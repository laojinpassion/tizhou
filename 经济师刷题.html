。","k":"民事法律行为的有效要件"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"根据民法典，向人民法院请求保护民事权利的普通诉讼时效期间为（　）。","o":["一年","二年","三年","五年"],"a":[2],"e":"普通诉讼时效期间为3年，自权利人知道或者应当知道权利受到损害以及义务人之日起计算；自权利受到损害之日起超过20年的，法院不予保护（最长保护期）。诉讼时效届满，义务人取得抗辩权，但自愿履行的不得请求返还。\n【时效考点】中止（最后6个月内因不可抗力等客观障碍，暂停计算）；中断（权利人请求、义务人同意履行、提起诉讼等，重新起算）。","k":"诉讼时效"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"multi","q":"诉讼时效期间发生中断的事由包括（　）。","o":["权利人向义务人提出履行请求","义务人同意履行义务","权利人提起诉讼或者申请仲裁","发生不可抗力","义务人失踪"],"a":[0,1,2],"e":"诉讼时效中断：请求（权利人主张）、认诺（义务人同意履行）、起诉（或仲裁），中断后时效期间重新计算。不可抗力导致的是诉讼时效中止（在最后6个月内暂停，障碍消除后继续计算），不是中断。\n【对比记忆】“中断是人为再重启，中止是客观按暂停键”。","k":"诉讼时效的中断与中止"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"关于代理的说法，正确的是（　）。","o":["代理必须在被代理人的授权或法律规定的范围内实施","代理人可以随意将代理事务转委托他人","无权代理一经实施即对被代理人发生效力","代理行为的法律效果由代理人自己承担"],"a":[0],"e":"代理人在代理权限内，以被代理人名义实施民事法律行为，对被代理人发生效力（D 错）。转委托原则上须经被代理人同意，紧急情况除外（B 错）。无权代理未经被代理人追认，对被代理人不发生效力（C 错）；但构成表见代理（相对人有理由相信代理人有代理权，如持有盖章空白合同书）的，代理行为有效，保护善意相对人。\n【代理分类】委托代理（授权产生）与法定代理（法律规定产生）。","k":"代理"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"平等主体之间发生合同纠纷，双方自愿达成仲裁协议的情况下，我国仲裁实行的基本制度是（　）。","o":["或裁或审、一裁终局","两审终审","仲裁后还可以就同一纠纷再向法院起诉","仲裁裁决可以上诉"],"a":[0],"e":"仲裁的基本制度：①协议仲裁——没有仲裁协议，仲裁委员会不予受理；②或裁或审——有效的仲裁协议排除法院管辖，二者只能选一；③一裁终局——裁决作出即生效，不能就同一纠纷再申请仲裁或起诉，也不得上诉（只有法定情形下可申请撤销裁决）。\n【对比记忆】诉讼两审终审、可上诉；仲裁一裁终局、不可上诉。","k":"仲裁的基本制度"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"经济法律关系的三要素是（　）。","o":["主体、客体、内容","主体、行为、结果","权利、义务、责任","自然人、法人、非法人组织"],"a":[0],"e":"法律关系（含经济法律关系）三要素：主体——参加法律关系的当事人（国家机关、企业、个人等）；客体——权利义务共同指向的对象（物、行为、智力成果、人身利益等）；内容——主体享有的权利和承担的义务，是法律关系的实质核心。\n【记忆钩子】“谁（主体）、指什么（客体）、干什么（内容）”。","k":"经济法律关系的构成"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"物权的种类和内容只能由法律规定，当事人不得自行创设。这体现的物权法基本原则是（　）。","o":["平等保护原则","物权法定原则","公示公信原则","一物一权原则"],"a":[1],"e":"物权法定原则：物权的种类和内容由法律统一规定，当事人不能像合同那样自由“发明”新的物权类型（例如约定“典押权”不受物权效力保护）。公示公信原则则解决“外人如何知道权利归属”：不动产靠登记、动产靠交付占有。\n【记忆钩子】“物权种类国家定（法定），权利变动要亮相（公示）”。","k":"物权法基本原则"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"multi","q":"所有权人对自己的不动产或者动产依法享有的权能包括（　）。","o":["占有","使用","收益","处分","追认"],"a":[0,1,2,3],"e":"所有权四项权能：占有（控制）、使用（按性能利用）、收益（收取孳息和利益）、处分（决定财产命运——转让、赠与、消费、毁弃），其中处分权能是所有权的核心。追认是效力待定行为中的概念，不是物权权能。\n【联动考点】四项权能可以与所有权人分离（出租＝让渡占有使用权能而保留收益），分离不等于丧失所有权。","k":"所有权的权能"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"为了公共利益的需要，依照法律规定的权限和程序将集体所有的土地转为国家所有并给予补偿，该行为属于（　）。","o":["征用","征收","征购","没收"],"a":[1],"e":"征收：为公共利益，依照法定权限程序，将集体或个人的不动产“所有权”收归国家，所有权发生转移，必须依法给予补偿。征用：因抢险救灾等紧急需要，临时“使用”单位或个人的不动产、动产，用后返还，被征用毁损灭失的要补偿——所有权不转移。\n【对比记忆】“征收变所有权，征用只借用；都要补偿，征收补偿在前、征用补偿在后”。","k":"征收与征用"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"业主对高层住宅的专有部分享有所有权，对电梯、外墙等共有部分享有的权利是（　）。","o":["仅有使用权，无任何管理权","共有和共同管理的权利","单独所有权","租赁使用权"],"a":[1],"e":"建筑物区分所有权＝三合一：对专有部分（自己家）的专有权＋对共有部分（电梯、楼道、外墙、绿地）的共有权＋对共有部分的共同管理权。电梯广告收益等共有部分产生的收益，扣除合理成本后属于全体业主共有。\n【常考细节】占用业主共有的道路或其他场地用于停放汽车的车位，属于业主共有——开发商无权出售。","k":"建筑物区分所有权"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"以建筑物等不动产设立抵押权的，抵押权自（　）时设立。","o":["抵押合同签订","办理抵押登记","抵押物交付","债务到期"],"a":[1],"e":"不动产抵押实行“登记生效主义”：抵押合同自成立时生效，但抵押权本身自办理抵押登记时设立。以动产抵押的，抵押权自抵押合同生效时设立，未登记的不得对抗善意第三人（登记对抗主义）。\n【对比记忆】“不动产看登记（不登记抵押权没设立），动产看合同（登记只为防第三人）”。","k":"抵押权的设立"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"债权人按照合同约定占有债务人的动产，债务人不履行到期债务时，债权人可以就该动产优先受偿。该担保物权是（　）。","o":["抵押权","质权","留置权","所有权保留"],"a":[2],"e":"留置权是法定担保物权，不用事先约定：债权人已合法占有债务人的动产（修车厂占有送修的车、保管人占有保管物），债务人不履行到期债务时，可以留置该动产并优先受偿。抵押权、质权是约定担保物权，须签订合同设立。\n【例外规则】企业之间留置的，可以不限于与债权同一法律关系；自然人间留置原则上须基于同一法律关系。","k":"留置权"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"根据农村土地承包法律制度，耕地的承包期为（　）。","o":["十五年","三十年","五十年","七十年"],"a":[1],"e":"土地承包经营权期限：耕地30年，草地30~50年，林地30~70年；耕地承包期届满后再延长30年（二轮到期后接着延，给农民吃“定心丸”）。住宅建设用地使用权期限届满自动续期（70年产权续期问题）。\n【数字组合记忆】“耕地三十再三十，房子七十年到了自动续”。","k":"用益物权（土地承包经营权）"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"下列行为中，一般属于要约邀请的是（　）。","o":["拍卖公告、招标公告、招股说明书","拍卖公告、招股说明书、已确定标的和价格的售货要约","投标文件","与对方磋商后发出的正式订单"],"a":[0],"e":"要约邀请是希望他人向自己发出要约的意思表示，民法典列举：拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表。投标文件是对招标的响应，内容具体确定，属于要约；正式订单更是要约。商业广告一般是要约邀请，但内容符合要约条件（具体确定、表明经承诺即受约束）的，视为要约。","k":"要约与要约邀请"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"当事人在订立合同过程中，假借订立合同恶意进行磋商，给对方造成损失。应当承担的责任是（　）。","o":["缔约过失责任","违约责任","侵权责任中的高度危险责任","行政责任"],"a":[0],"e":"缔约过失责任发生在“合同还没成立或虽成立但被认定无效、被撤销”阶段，因一方违背诚实信用原则（恶意磋商、隐瞒重要事实或提供虚假情况、泄露对方商业秘密等）给对方造成损失，应承担赔偿责任。违约责任以“合同有效成立”为前提，此时合同尚未生效成立，故不适用。\n【判断口诀】“合同成了找违约，合同没成（或无效）找缔约过失”。","k":"缔约过失责任"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"应当先履行债务的一方，有确切证据证明对方经营状况严重恶化、丧失商业信誉，可能丧失履行债务能力，可以采取的措施是（　）。","o":["直接解除合同且无需通知","中止履行并及时通知对方，对方提供适当担保后恢复履行","继续履行但保留索赔权利","要求对方提前支付违约金"],"a":[1],"e":"不安抗辩权的行使规范：先履行方有确切证据证明对方有经营状况严重恶化、转移财产抽逃资金逃避债务、丧失商业信誉等情形的，可以中止履行，但必须及时通知对方；对方提供适当担保的，应当恢复履行；中止后对方在合理期限内未恢复履行能力且未提供担保的，视为拒绝履行主要债务，可以解除合同并请求违约责任。注意流程：证据→中止＋通知→（恢复或解除），不能一上来就直接解除。","k":"双务合同履行中的抗辩权（不安抗辩权）"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"因不可抗力致使不能实现合同目的，当事人可以（　）。","o":["请求人民法院撤销合同","行使法定解除权解除合同","要求对方继续履行","请求确认合同自始无效"],"a":[1],"e":"法定解除情形包括：不可抗力致使不能实现合同目的、履行期届满前一方明确表示或以行为表明不履行主要债务（预期违约）、迟延履行主要债务经催告后合理期限内仍未履行、迟延履行或其他违约致使合同目的不能实现等。解除权是形成权，通知对方即可生效。因不可抗力解除的，免除违约责任（部分或全部），但不能免除“及时通知＋合理期限内提供证明”的义务。","k":"合同的法定解除"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"债务人怠于行使其对第三人的到期债权，影响债权人的到期债权实现的，债权人可以向人民法院请求（　）。","o":["以自己的名义代位行使债务人对第三人的权利","直接取得债务人对第三人的债权","宣告债务人破产","直接扣押第三人财产"],"a":[0],"e":"合同保全两把刀：代位权——债务人怠于行使其债权或与该债权有关的从权利，影响债权人到期债权实现的，债权人以自己名义代位行使（诉讼方式），代位权诉讼由被告住所地法院管辖；撤销权——债务人放弃债权、无偿转让财产、明显不合理低价转让且相对人知道等影响债权实现的，请求法院撤销。撤销权自知道或应当知道撤销事由之日起1年内行使，行为发生之日起5年内未行使的消灭。","k":"合同的保全（代位权与撤销权）"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"一方的违约行为同时损害对方人身权益、财产权益的，受损害方（　）。","o":["只能主张违约责任","只能主张侵权责任","有权在违约责任与侵权责任中选择其一来主张","可以同时主张两份全额赔偿"],"a":[2],"e":"违约责任与侵权责任竞合：同一行为既违约又侵权（如出售缺陷产品致买受人受伤），受损害方有权择一主张，但不能就同一损害重复受偿。选择思路：违约责任一般不能主张精神损害赔偿（违约造成精神损害严重，可通过侵权路径主张）；侵权责任的赔偿范围更宽，但需证明过错或符合无过错要件。","k":"违约责任与侵权责任的竞合"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"根据公司法，有限责任公司由（　）以下股东出资设立。","o":["三十个","五十个","一百个","二百个"],"a":[1],"e":"有限责任公司由50个以下股东出资设立，股东人数有上限；股份有限公司发起人为1~200人，且须有半数以上发起人在中国境内有住所。有限责任公司人合性强、封闭经营；股份公司资合性强、可公开发行股票。\n【对比数字】“有限公司50封顶，股份公司发起人200封顶”。","k":"公司的种类"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"multi","q":"根据公司法，股东可以用作出资的财产包括（　）。","o":["货币","实物（机器设备、原材料）","知识产权","土地使用权、股权、债权等可以用货币估价并可以依法转让的非货币财产","劳务"],"a":[0,1,2,3],"e":"出资形式的标准是“可估价＋可转让”：货币、实物、知识产权、土地使用权、股权、债权等均可；劳务、信用、自然人姓名、商誉、特许经营权、设定担保的财产不得作价出资（劳务难以评估且不可转让，合伙企业才允许劳务出资）。\n【非货币出资要求】应当评估作价、核实财产，并依法办理财产权转移手续。","k":"股东的出资形式"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"公司分配当年税后利润时，应当提取利润的（　）列入法定公积金，累计额达到注册资本百分之五十以上的可以不再提取。","o":["5%","10%","15%","25%"],"a":[1],"e":"法定公积金按税后利润的10%提取，累计达注册资本50%以上可不再提；公积金首先用于弥补亏损、扩大生产经营或转增资本（法定公积金转增时留存部分不得少于转增前注册资本的25%）。\n【顺序记忆】税后利润分配规则：先补亏→提法定公积金→（可提任意公积金）→向股东分配。有亏损未弥补前不得向股东分配。","k":"公司利润分配与公积金"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"公司合并的，应当自作出合并决议之日起法定期限内通知债权人并公告。公司合并时，原公司的债权债务（　）。","o":["由合并后存续或者新设的公司承继","自动消灭","由原股东按出资比例承担","必须全部清偿完毕后才能合并"],"a":[0],"e":"公司合并、分立时，债权债务依法由合并后存续或新设的公司（分立后的公司按协议连带承继）概括承继，不需要债权人逐一同意，但必须依法通知并公告（债权人可要求清偿或提供担保——分立前的债务由分立后的公司承担连带责任，另有书面约定的除外）。这是概括承继规则，与“债务转让须经债权人同意”的一般规则不同。\n【程序数字】决议之日起10日内通知债权人，30日内公告。","k":"公司合并与分立"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"公司清算时，公司财产在清偿顺序上排在“支付清算费用”之后、位于“清偿公司普通债务”之前的是（　）。","o":["股东出资返还","职工工资、社会保险费用和法定补偿金，以及税款","对股东的利润分配","对外投资"],"a":[1],"e":"清算清偿顺序：①支付清算费用；②职工工资、社保费用和法定补偿金；③缴纳所欠税款；④清偿公司债务；⑤剩余财产分配给股东。职工利益和税收优先于普通债权，股东分配绝对垫底——公司财产未清偿完毕前不得分配给股东。\n【记忆钩子】“费用、工资、税、债、股东”，一层压一层。","k":"公司清算"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"只有一个股东的有限责任公司，股东不能证明公司财产独立于股东自己的财产的，对公司债务（　）。","o":["不承担责任","承担连带责任","仅以出资额为限承担责任且无需其他条件","承担一半责任"],"a":[1],"e":"一人有限责任公司实行“财产混同举证责任倒置”：股东不能证明公司财产独立于自己财产的（如公私账户混用、无规范财务账册），应对公司债务承担连带责任——这是防止股东借一人公司逃债的利器。普通有限责任公司的股东仅在出资范围内承担有限责任，滥用法人独立地位和股东有限责任、逃避债务的，债权人也可主张“法人人格否认”（刺破公司面纱）。\n【记忆钩子】“一人公司要自证清白，证不明就连带”。","k":"一人有限公司与法人人格否认"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"multi","q":"根据公司法，股东享有的权利包括（　）。","o":["按照实缴的出资比例分取红利（全体股东另有约定的除外）","查阅、复制公司章程、股东会会议记录和财务会计报告等资料","公司新增资本时优先认缴出资","直接以公司名义对外签订合同","决定公司的日常经营管理事项"],"a":[0,1,2],"e":"股东核心权利：分红权、表决权、知情权（查阅复制章程、会议记录、财务会计报告等）、新增资本优先认缴权、转让出资的权利、请求法院撤销违法决议的权利等。以公司名义签约、管理日常经营是经理层的职权，股东通过股东会和选出的董事间接治理，不能“越俎代庖”——这正是所有权与经营权分离的要求。\n【高频陷阱】“股东直接经营管理公司”类选项基本都是错的。","k":"股东的权利"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"董事、监事、高级管理人员利用关联关系损害公司利益，给公司造成损失的，应当（　）。","o":["承担赔偿责任","仅被内部批评","由公司为其承担损失","只需向股东会道歉"],"a":[0],"e":"董监高对公司负有忠实义务（不得侵占财产、挪用资金、自我交易牟利、篡夺公司商业机会、同业竞争等）和勤勉义务（尽责履职）。利用关联关系损害公司利益的，应当承担赔偿责任；与其关联交易有关的决议，关联股东或董事应当回避表决。\n【联动考点】股东代表诉讼：董监高损害公司利益，符合条件的股东可以书面请求监事会（董事会）起诉，被拒或紧急情况下可以自己名义为公司利益直接起诉。","k":"董监高的义务与责任"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"注册商标的有效期为十年，自（　）起计算，每次续展注册的有效期为十年，续展次数不受限制。","o":["申请日","核准注册之日","商标设计完成之日","首次使用之日"],"a":[1],"e":"注册商标有效期10年，自核准注册之日起算；期满前12个月内可申请续展（还有6个月宽展期），每次续展10年、可无限续展——所以商标可以“永久”护住品牌。对比专利：发明20年、实用新型10年、外观设计15年，均自申请日起且不可续展。\n【对比记忆】“商标十年能续命，专利到期变公产”。","k":"商标法律制度"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"multi","q":"下列行为中，属于不正当竞争行为的有（　）。","o":["擅自使用与他人有一定影响的商品名称、包装、装潢近似的标识","采用财物或者其他手段贿赂交易相对方的工作人员","对商品性能、功能作虚假或引人误解的商业宣传","以低于成本价清仓处理有效期即将届满的商品","编造、传播虚假信息损害竞争对手的商业信誉"],"a":[0,1,2,4],"e":"反不正当竞争法列举的主要行为：混淆行为、商业贿赂、虚假宣传、侵犯商业秘密、不当有奖销售（谎称有奖、内定中奖、抽奖最高奖超过5万元）、诋毁商誉、网络不正当竞争等。D 属于正常的折价促销——季节性降价、处理临期商品、清仓甩卖只要有真实理由、明码标价，不构成不正当竞争（不正当低价倾销的认定须“排挤竞争对手”目的且无正当理由）。","k":"不正当竞争行为"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"根据产品质量法，生产者能够证明（　）情形的，不承担缺陷产品的赔偿责任。","o":["产品已按国家标准检验合格","未将产品投入流通","产品价格低于同类产品","使用者操作不当且产品没有任何警示缺失"],"a":[1],"e":"生产者承担的是严格责任（无过错责任），但有三项免责事由：①未将产品投入流通；②投入流通时引起损害的缺陷尚不存在；③将产品投入流通时的科学技术水平尚不能发现缺陷的存在（发展风险抗辩）。“检验合格”不是法定免责事由——标准过时或检验不能覆盖的缺陷仍须担责。\n【责任结构】生产者无过错责任，销售者过错责任（不能指明生产者等情形也要先行赔付）。","k":"产品质量责任"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"用人单位依照劳动合同法解除合同应当支付“经济补偿”的，按劳动者在本单位工作的年限计算：每满一年支付一个月工资；六个月以上不满一年的按一年计算；不满六个月的支付（　）工资。","o":["半个月","一个月","两个月","三个月"],"a":[0],"e":"经济补偿“N”的算法：每满一年一个月工资；6个月以上不满1年按1年算；不满6个月给半个月工资。月工资按解除前12个月平均工资，高于当地社平工资3倍的按3倍封顶且年限最多12年。违法解除的赔偿金为经济补偿标准的二倍（2N）。代通知金（额外支付一个月工资，即“N+1”）仅适用于医疗期满不能工作、不能胜任经调岗培训仍不能胜任、客观情况重大变化三种无过错解除情形。","k":"劳动合同的解除与经济补偿"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"multi","q":"消费者通过网络购买下列商品，不适用“七日无理由退货”规定的有（　）。","o":["消费者定作的商品","鲜活易腐的商品","在线下载或者消费者拆封的音像制品、计算机软件等数字化商品","交付的报纸、期刊","普通品牌的服装（未拆吊牌）"],"a":[0,1,2,3],"e":"七天无理由退货的法定例外：定作商品、鲜活易腐、在线下载或已拆封的数字化商品、交付的报纸期刊，以及其他根据商品性质不宜退货且经消费者确认的商品。普通服装只要完好且不影响二次销售（未拆吊牌）就可以无理由退货。\n【操作要点】退货的商品应当完好；退货运费一般由消费者承担，经营者和消费者另有约定的从其约定。","k":"消费者权益保护（七天无理由退货）"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"经营者提供的商品或服务不符合质量要求的，消费者依照消费者权益保护法可以自收到商品之日起（　）内退货。","o":["七日","十五日","三十日","六十日"],"a":[0],"e":"质量问题时退货分两档：七日内退货（不符合质量要求的，经营者应当退货、更换、修理——“三包”义务之一）；七日后符合法定解除合同条件的可及时退货，不符合解除条件的可要求经营者履行更换、修理义务。注意与“网购七天无理由退货”（无质量问题也可退）区分：一个因质量问题、一个无理由，都是七天但依据不同。\n【三包口诀】“七天能退，十五天能换（有瑕疵经两次修理仍不能正常使用的可换）”。","k":"消费者权益保护（三包义务）"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"统计数据的直接来源（一手数据）是指（　）。","o":["统计年鉴中引用的数据","报刊、网站转载的数据","通过调查或实验直接获得的数据","别人整理后发布的数据"],"a":[2],"e":"按来源渠道分：一手数据（直接数据）——通过调查（问卷调查、访谈、观测）或实验直接从调查对象那里取得；二手数据（间接数据）——统计年鉴、数据库、报刊文献等别人已收集发布的数据。用二手数据要注意口径、时点和权威性；做推断统计必须用一手数据或明确原始来源的数据。","k":"统计数据的来源"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"为特定目的专门组织的一次性全面调查，通常用于采集重大国情国力基础数据（如人口总量）的方式是（　）。","o":["普查","重点调查","典型调查","统计报表"],"a":[0],"e":"普查的特点：涉及范围广、调查单位全（全面调查）、一次性或周期性进行、工作量大成本高，因此只对最基础最重要的国情国力项目使用——人口普查每10年一次（逢0年份）、经济普查每5年一次（逢3、8年份）、农业普查每10年一次（逢6年份）。\n【对比】重点调查只选“举足轻重”的重点单位；典型调查有意识地选少数代表性单位深入解剖——都是非全面调查。","k":"统计调查的方式（普查）"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"从总体中随机抽取部分单位进行调查并据以推断总体，这种最常用的非全面调查方式是（　）。","o":["普查","抽样调查","全面统计报表","重点调查"],"a":[1],"e":"抽样调查是应用最广泛的非全面调查：按随机原则抽取样本，依据样本对总体数量特征进行估计和检验。优点：经济性（省时省钱）、时效性强、适应面广、准确性高（可计算并控制误差）。概率抽样可以计算抽样误差、把估计精度控制在需要的水平，这是它区别于重点调查、典型调查的根本点。","k":"抽样调查的特点"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"统计学的两大分支中，研究如何用样本信息对总体进行估计和检验的是（　）。","o":["描述统计","推断统计","会计统计","经济统计"],"a":[1],"e":"推断统计：研究如何利用样本数据推断总体特征，包括参数估计（点估计、区间估计）和假设检验两大内容。描述统计：用图表和指标（均值、方差等）对数据进行整理与概括，不超出数据本身。\n【一句话区分】“描述是把手里的数据说清楚，推断是用手里的数据猜没见过的总体”。","k":"描述统计与推断统计"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"实施概率抽样前，列出总体中所有抽样单元的名单或清单，供从中抽取样本使用。该清单称为（　）。","o":["样本","抽样框","统计表","登记册"],"a":[1],"e":"抽样框是抽样的“花名册”：供抽样用的全部总体单位的名单或清单（如全部企业的名录、住户门牌清单）。抽样框不完整或有重复（如名单漏户、一户多登）会造成抽样框误差，属于典型的非抽样误差。\n【流程链】确定目标总体→编制抽样框→抽取样本→调查→推断总体。","k":"抽样框"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"multi","q":"下列属于获得一手数据的途径的有（　）。","o":["问卷调查","科学实验","查阅统计年鉴","访谈","引用上市公司公告数据"],"a":[0,1,3],"e":"一手数据来自自己动手的调查（问卷、访谈、观测）与实验；统计年鉴、上市公司公告、数据库属于别人已发布的二手数据。使用二手数据无需自己组织调查，成本低，但要注意数据口径是否一致、来源是否权威、时点是否匹配。\n【判断口诀】“自己动手是一手，翻别人账本是二手”。","k":"数据的来源"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"一组数据中出现次数最多的变量值称为（　）。","o":["均值","中位数","众数","四分位数"],"a":[2],"e":"众数是出现频数最多的值，主要适合分类数据和顺序数据，也可用于数值型数据（如鞋码、最畅销型号）；缺点是可能不唯一（多众数）或不存在（各值频数相同）。中位数适合顺序数据和存在极端值的数值数据；均值只用数值型数据、最充分利用信息但怕极端值。\n【适用搭配】“分类看众数，顺序看中位，数值干净看均值”。","k":"集中趋势指标（众数）"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"计算加权算术平均数时，若各组的权数（频数）发生明显变化，则（　）。","o":["平均值不变，因为各组变量值没变","平均值会随权数结构的变化而变化","平均值必然变大","平均值必然变小"],"a":[1],"e":"加权算术平均数 x̄＝Σ(x·f)/Σf，不仅取决于各组变量值，还取决于权数（频数比重）结构：高数值组的权数越大，平均值越高；反之越低。这就是“结构影响均值”的原理——比较两个时期平均工资时，人员结构变化本身就会推动均值变化（辛普森效应的统计基础）。\n【应用陷阱】“两组平均数都不变，合并后的总平均数却变了”——权重结构在作怪。","k":"加权算术平均数"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"甲组数据：均值为20，标准差为4；乙组数据：均值为100，标准差为5。离散程度较小的组是（　）。","o":["甲组","乙组","两组离散程度相同","无法比较"],"a":[1],"e":"两组均值不同，不能直接比标准差，要用变异系数：甲＝4/20＝20%；乙＝5/100＝5%。乙组的相对离散程度更小、数据更稳定。标准差5＞4只说明乙组“绝对波动”大，但它的均值大得多，相对波动反而小。\n【解题步骤】均值不同或单位不同→一律换算变异系数再比较。","k":"变异系数的计算"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"某个数据的标准分数（z 分数）＝1，表示该数据（　）。","o":["等于该组数据的均值","高于均值一个标准差","位于全组第1位","低于均值一个标准差"],"a":[1],"e":"标准分数 z＝(x−均值)/标准差，表示该值偏离均值多少个标准差：z＝1即高于均值1个标准差，z＝−1.5即低于均值1.5个标准差。它消除了量纲和水平差异，可以用来比较“不同分布中的相对位置”（如比较数学80分与语文90分谁更突出）。\n【经验法则】正态分布下约68%的数据在±1个标准差内、95%在±2个内。","k":"标准分数","fig":"normal"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"multi","q":"下列指标中，属于集中趋势测度指标的有（　）。","o":["均值","中位数","众数","极差","方差"],"a":[0,1,2],"e":"集中趋势指标回答“一般水平是多少”：均值、中位数、众数、分位数。极差、方差、标准差、四分位差、变异系数回答“波动有多大”，属于离散程度指标。\n【成对记忆】“三兄弟管平均（均、中、众），一堆指标管散（极差、方差、标准差、变异系数）”。","k":"集中趋势与离散程度的指标体系"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"关于统计图的选用，下列说法正确的是（　）。","o":["条形图主要用于展示数值型分组数据的频数分布，各矩形连续排列","直方图主要用于展示分类数据的频数分布","直方图用于数值型分组数据，各矩形连续排列；条形图用于分类数据，各条形分开排列","饼图最适合展示时间序列的变化趋势"],"a":[2],"e":"直方图与条形图最易混：直方图——数值型数据分组后绘制，横轴是数值区间、矩形连续排列（宽度有含义，代表组距）；条形图——分类数据，条形分开排列（宽度无含义，只为美观）。时间序列趋势用线图，构成比例用饼图或环形图。\n【判断口诀】“连着排的是直方（数值），分开站的是条形（分类）”。","k":"数据的图示","fig":"histbar"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"先将总体各单位按某一标志排队，再按固定间隔每隔k个单位抽取一个样本单位。这种抽样方法是（　）。","o":["简单随机抽样","分层抽样","系统抽样（等距抽样）","整群抽样"],"a":[2],"e":"系统抽样（等距抽样）：排序→定间隔k＝N/n→随机起点（或随机起点后按固定位置）依次抽取。优点：操作简便、样本分布均匀；风险：若排队标志与调查变量存在周期性变化，且间隔与周期巧合，会产生系统性偏差。\n【方法族谱】简单随机（抽签）、分层（先分层再抽）、系统（排队等距）、整群（抽群查全体）、多阶段（层层往下抽）。","k":"系统抽样"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"调查某市小学生视力状况时，以学校（或班级）为单位随机抽取若干所，对被抽中单位的全部学生进行调查。这种抽样方法是（　）。","o":["分层抽样","整群抽样","系统抽样","判断抽样"],"a":[1],"e":"整群抽样：以“群”（班级、居委会、生产线）为抽样单位，抽中的群内全员调查。优点：组织方便、节省费用（不需要全名单，只需要群的名单）；缺点：群内单位相似度高，样本均匀性差，同样本量下误差通常大于简单随机抽样——所以常通过多抽群、群内少查来弥补。\n【对比分层】分层是“每层都抽一点”（撒匀），整群是“只抽几群全查”（聚焦）。","k":"整群抽样"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"全国性的大规模住户调查（如住户收支调查），通常先抽省、再抽市县、再抽小区、最后抽住户。这种抽样方式是（　）。","o":["分层抽样","多阶段抽样","简单随机抽样","普查"],"a":[1],"e":"多阶段抽样：先抽大单位，再在被抽中的大单位里抽小单位，逐级往下（省→县→小区→户）。大规模调查不可能一次编出全国住户名单（抽样框做不到），多阶段抽样只需要每一级的名单，兼顾可行性与效率；常与分层、整群结合使用（如最后阶段抽小区即为整群）。\n【判断标志】“先抽××，再从抽中的××里抽××”——多阶段。","k":"多阶段抽样"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"其他条件不变时，若把样本量扩大为原来的4倍，简单随机抽样的抽样平均误差（　）。","o":["扩大为原来的4倍","扩大为原来的2倍","缩小为原来的1/2","缩小为原来的1/4"],"a":[2],"e":"抽样平均误差与样本量的平方根成反比：样本量×4→误差÷2。这也解释了“加样本量的边际效果递减”——误差想减半，样本量要翻4倍；想减到1/3，样本量要翻9倍。成本与精度的权衡是确定样本量的核心逻辑。\n【公式】不重复抽样下 μ＝√[(1−n/N)·σ²/n]，重复抽样 μ＝σ/√n。","k":"样本量与抽样误差"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"下列误差中，属于非抽样误差的是（　）。","o":["随机抽样固有的代表性误差","抽样框遗漏部分总体单位造成的误差","增加样本量即可同步缩小的误差","由随机抽取顺序不同引起的误差"],"a":[1],"e":"误差二分法：抽样误差——随机抽样固有的代表性误差，可用样本量控制、可用公式计算；非抽样误差——抽样框误差（名单不全重复）、无回答误差（拒访、找不到人）、计量误差（问卷诱导、调查员错录、受访者乱答）等。非抽样误差加样本量也解决不了，只能靠改进设计和执行质量（预调查、回访核实、培训）。\n【答题标志】“名单、拒答、抄错、诱导”→非抽样误差；“随机、代表性、样本量”→抽样误差。","k":"抽样误差与非抽样误差"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"multi","q":"影响抽样误差大小的因素包括（　）。","o":["总体的变异程度","样本单位数的多少","抽样方法与抽样组织方式","调查员的访谈技巧","数据录入员打字速度"],"a":[0,1,2],"e":"抽样误差取决于三大因素：①总体变异程度（σ越大误差越大）；②样本量（n越大误差越小）；③抽样组织方式与估计方法（分层优于简单随机，重复与不重复抽样也有差别）。访谈技巧、录入速度影响的是登记性误差（非抽样误差），不在抽样误差公式之内。\n【公式锚点】μ＝σ/√n——三个变量对应三个因素。","k":"抽样误差的影响因素"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"一元线性回归方程 ŷ＝200＋12x 中，回归系数12的含义是（　）。","o":["x每增加1个单位，y平均增加12个单位","x与y的相关系数为12","y总变差中12%被x解释","x取0时y的预测值为12"],"a":[0],"e":"回归系数 b＝12：自变量x每变动1个单位，因变量y平均变动12个单位（b＞0为同向）。x＝0时ŷ＝200（200是截距a）；相关系数不可能大于1；R²才描述解释比例。回归方程的用途就是代入x做预测：x＝10时，ŷ＝200＋120＝320。","k":"回归系数的含义","fig":"scatter"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"最小二乘法（普通最小二乘，OLS）确定回归直线所依据的原则是使（　）。","o":["残差之和最小","残差平方和最小","因变量之和最小","斜率最大"],"a":[1],"e":"最小二乘法：让每个观测点到直线的纵向距离（残差）平方后加总，取使其最小的a、b——平方是为了消除正负抵消并放大大偏差的惩罚。注意不是“残差之和最小”（正负残差可以互相抵消，代数和为0没有约束力）。\n【配套考点】由OLS可推出：残差之和恒为0；回归直线必过点（x̄, ȳ）。","k":"最小二乘法","fig":"scatter"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"关于相关分析与回归分析的关系，下列说法正确的是（　）。","o":["相关分析需要先指定自变量和因变量","回归分析不必区分自变量与因变量","相关分析只度量变量间的关联方向与程度，回归分析进一步用于解释和预测，需要区分自变量与因变量","两者完全相同，可以互相替代"],"a":[2],"e":"相关分析：测度变量间线性关系的方向（正负）与强度（|r|大小），变量地位对等、不分因果先后。回归分析：在“谁是解释变量（自变量）、谁是被解释变量（因变量）”的假设下建立方程，用于说明影响和进行预测——x对y的回归与y对x的回归是两条不同的线。\n【记忆钩子】“相关看关系，回归定因果方向、能预测”。","k":"相关分析与回归分析的关系","fig":"scatter"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"两变量之间的相关系数 r＝0.6，则判定系数 R² 为（　）。","o":["0.6","0.36","0.77","0.6的相反数"],"a":[1],"e":"一元线性回归中 R²＝r²＝0.6²＝0.36，即y的变差中36%可由x解释，剩下的64%由其他因素和随机因素解释。相关系数0.6只是“中等偏上相关”，翻译成解释力就打折到36%——这正是R²更“诚实”的地方。\n【换算口诀】“r平方变R²，R²开方还原r（带上符号）”。","k":"相关系数与判定系数的换算","fig":"scatter"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"对顺序数据（如满意度等级、名次）之间相关关系的度量，适宜采用（　）。","o":["皮尔逊（Pearson）相关系数","斯皮尔曼（Spearman）等级相关系数","回归系数","变异系数"],"a":[1],"e":"皮尔逊相关系数适用于数值型变量的线性相关；顺序数据没有精确的数值距离，应把观测值转成等级后计算斯皮尔曼等级相关。回归系数用于建立预测方程，变异系数衡量离散程度，均不度量“相关”。\n【数据类型对应】数值×数值→Pearson；顺序×顺序（或转等级）→Spearman。","k":"等级相关"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"multi","q":"下列关于相关系数的说法中，正确的有（　）。","o":["相关系数的取值范围在−1到1之间","相关系数为正表示两变量同向变动","|r|越接近1，线性关系越强","相关系数为0，说明两变量之间不存在任何关系","相关关系不等于因果关系"],"a":[0,1,2,4],"e":"四正一误：取值[−1,1]（A）；符号表方向（B）；绝对值表强度（C）；相关≠因果——冰淇淋销量与溺水人数高度正相关，真正的原因是“夏天”（E 正确，也是统计思维的核心素养）。D 错：r＝0只说明“无线性关系”，可能存在曲线关系（如抛物线形关系）。","k":"相关系数的性质","fig":"scatter"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"某公司2025年各季度销售额逐期增长量分别为10万、15万、5万元。第三季度的累计增长量（以第一季度为基期）为（　）。","o":["10万元","15万元","30万元","5万元"],"a":[2],"e":"累计增长量＝相应各期逐期增长量之和＝10＋15＋5＝30万元。对应关系：累计增长量反映相对固定基期的总增量；逐期增长量反映相对上期的增量，两者互相换算：累计＝逐期之和，逐期＝相邻两个累计之差。\n【同类公式】定基发展速度＝环比发展速度连乘积——加法对应增长量，乘法对应发展速度。","k":"增长量指标"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"某地区生产总值2023年比2022年增长5%，2024年比2023年增长8%。2024年比2022年增长（　）。","o":["13%","13.4%","40%","104%"],"a":[1],"e":"定基发展速度＝环比发展速度连乘：1.05×1.08＝1.134，即2024年比2022年增长13.4%。最容易犯的错是“5%＋8%＝13%”——增长速度不能简单相加，必须先化为发展速度相乘再减1。\n【通用套路】“增速相加题，先加一后乘，再减一”。","k":"发展速度与增长速度"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"计算平均发展速度通常采用（　）。","o":["各期环比发展速度的算术平均数","各期环比发展速度的几何平均数（n个环比连乘后开n次方）","最初水平与最末水平的简单平均","各期增长速度的算术平均数"],"a":[1],"e":"由于定基发展速度是环比发展速度的连乘积，平均发展速度用几何平均法（水平法）：n个环比发展速度连乘积的n次方根，也就等于（期末水平÷期初水平）的1/n次方。算术平均会破坏“连乘还原”的数学关系。\n【用途】按平均发展速度外推可做长期预测；与之配套的“翻番”目标（如翻一番即发展速度2）常用对数求解所需年均增速。","k":"平均发展速度（几何平均法）"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"“增长1%的绝对值”指标等于（　）。","o":["基期水平÷100","报告期水平÷100","增长量÷增长速度","发展速度÷100"],"a":[0],"e":"增长1%的绝对值＝前期（基期）水平÷100，即速度每提高1个百分点对应的绝对增量。它解决“速度掩盖水平”的问题：小基数增长10%可能只增加10万元，大基数增长1%可能增加500万元——比较增长成绩时必须同时看速度和“1%背后的钱”。\n【速算】基期4000万，增长1%的绝对值＝40万元。","k":"增长1%的绝对值"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"某商店月末库存额为：上年末60万元、1月末90万元、2月末120万元、3月末90万元。第一季度（3个月）的月平均库存额为（　）。","o":["90万元","95万元","100万元","105万元"],"a":[1],"e":"时点序列求序时平均（间隔相等）用“首末折半法”：(首项÷2＋中间各项＋末项÷2)÷(项数−1)＝(60÷2＋90＋120＋90÷2)÷3＝(30＋90＋120＋45)÷3＝285÷3＝95万元。时点数不能像时期数那样直接简单平均（各时点只是瞬间值），必须折半加权。\n【对比】间隔不等的时点序列，用各时点间隔长度作权数加权平均。时期序列（如月销售额）才是直接简单平均。","k":"时点序列的序时平均数（首末折半法）"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"测定时间序列长期趋势时，将相邻若干期数据逐期移动求平均、以平滑短期波动的方法称为（　）。","o":["季节指数法","移动平均法","指数平滑法中的二次平滑","相关系数法"],"a":[1],"e":"移动平均法：取连续k期求平均，逐期后移，削平随机波动和季节波动，显现长期趋势——k越大越平滑但对转折点反应越迟钝。季节变动测定用季节指数（按月/季平均法），趋势拟合也可用最小二乘法配直线或曲线。\n【判断口诀】“滚着平均修路找方向（趋势），按季对比算旺淡（季节指数）”。","k":"长期趋势的测定（移动平均）"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"multi","q":"时间序列的构成成分包括（　）。","o":["长期趋势（T）","季节变动（S）","循环波动（C）","不规则波动（I）","抽样误差"],"a":[0,1,2,3],"e":"时间序列四分法：T长期趋势（方向性变化）、S季节变动（一年内固定周期）、C循环波动（一年以上非固定周期的涨落，如经济周期）、I不规则波动（偶然因素）。抽样误差属于抽样推断的概念，与时间序列构成无关。\n【识别口诀】“大方向看趋势，一年内看季节，跨几年看循环，剩下的都是意外”。","k":"时间序列的构成成分","fig":"trend"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"费雪的交易方程式 MV＝PT 所表达的核心观点是（　）。","o":["货币需求取决于恒久收入","物价水平取决于货币数量（货币数量论）","货币需求与利率负相关","货币供给由商业银行独立决定"],"a":[1],"e":"费雪方程式（现金交易说）：M货币量×V流通速度＝P物价×T交易总量。费雪假定V、T在短期内稳定，因此物价水平P主要由货币数量M决定——这是古典货币数量论的标准表述。恒久收入是弗里德曼的观点（C是凯恩斯投机性需求的表述）。\n【三大货币需求理论对照】费雪MV=PT（交易说）→剑桥M=kPY（余额说）→凯恩斯三动机→弗里德曼恒久收入。","k":"费雪交易方程式"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"剑桥学派的现金余额方程式 M＝kPY 与费雪方程式的主要区别在于（　）。","o":["更强调货币作为资产、人们持有货币的选择行为（k 由公众决定）","否定了货币数量对物价的影响","认为货币流通速度由制度决定且固定不变","只适用于金属货币流通"],"a":[0],"e":"剑桥方程式从“个人为什么要持币”的资产选择角度出发：M＝kPY 中的 k（持币比率）由公众的意愿决定，强调货币的需求面；费雪方程式着眼于交易的技术关系，V 偏向制度性常数。两者数学上相通（k≈1/V），但视角不同——一个看“钱怎么花”，一个看“钱怎么留”。\n【记忆钩子】“费雪算交易，剑桥想持币”。","k":"剑桥方程式"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"弗里德曼的货币需求理论认为，货币需求最主要取决于（　）。","o":["当期利率","恒久性收入","物价预期","汇率水平"],"a":[1],"e":"弗里德曼认为货币需求函数高度稳定，主要由恒久性收入（长期平均收入）决定，利率的影响很小。由此推出其政策主张：货币需求稳定、货币供给受央行控制，故应实行“单一规则”——按固定比率稳定增加货币供给，反对相机抉择。\n【三论速记】凯恩斯“利率牵着走”，弗里德曼“收入定乾坤，政策要单规”。","k":"弗里德曼货币需求理论"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"在货币供给的形成机制中，由中央银行直接控制、构成银行体系信用创造基础的货币是（　）。","o":["派生存款","基础货币","广义货币 M2","现金漏损"],"a":[1],"e":"基础货币＝流通中现金＋商业银行在央行的准备金存款，由央行通过公开市场操作、再贷款等直接控制，是商业银行创造存款货币的“原始火种”。商业银行吸收存款、放贷、再吸收存款的循环创造派生存款，最终货币供应量＝基础货币×货币乘数。\n【链条记忆】“央行点火（基础货币）→银行接力（派生存款）→总量＝火种×接力系数（乘数）”。","k":"货币供给过程（基础货币）"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"商业银行吸收100万元存款，法定存款准备金率为20%（不考虑现金漏损等其他因素），银行体系最终最多可形成的存款总额为（　）。","o":["100万元","200万元","500万元","1000万元"],"a":[2],"e":"存款创造乘数＝1/法定存款准备金率＝1/20%＝5，最终存款总额＝100×5＝500万元（其中派生存款400万）。考虑现金漏损和超额准备金后，实际乘数会小于简化值。\n【反向题】准备金率降到10%，乘数变10，存款总额最多1000万——准备金率越低，创造能力越强，这也解释了为何它是威力猛的货币政策工具。","k":"存款创造与货币乘数"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"multi","q":"下列关于货币乘数的说法中，正确的有（　）。","o":["法定存款准备金率越高，货币乘数越小","现金漏损率越高，货币乘数越小","超额准备金率越高，货币乘数越小","基础货币越大，货币乘数越大","货币供应量等于基础货币与货币乘数的乘积"],"a":[0,1,2,4],"e":"货币乘数＝货币供应量/基础货币，简化式 m＝1/r。三个“漏出”因素都压低乘数：法定准备金率、现金漏损率（公众多持现金）、超额准备金率（银行多存备付）——钱被“锁”得越多，能派生的越少（A、B、C 正确）。基础货币是乘数的分子项之外的“本金”，它的大小不改变乘数本身（D 混淆了总量与倍数）。总量关系 m×B＝M（E 正确）。\n【记忆钩子】“三漏压乘数，本金乘倍数”。","k":"货币乘数的决定因素"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"治理需求拉上型通货膨胀，最直接对症的政策组合是（　）。","o":["紧缩性财政政策与紧缩性货币政策（压缩总需求）","扩大财政赤字与降息","增加转移支付以提高居民收入","本币大幅贬值刺激出口"],"a":[0],"e":"需求拉上型通胀的病根是“钱多货少、总需求过旺”，对症下药是压总需求：紧缩货币（提高利率、回笼货币）＋紧缩财政（减支、增税）。扩大赤字、降息、加补贴都是给需求“火上浇油”；本币贬值还会推高进口价格，加剧通胀。\n【配套考点】成本推进型通胀单纯压缩需求会牺牲产出，政策上需供给管理（降成本、增供给）配合。","k":"通货膨胀的治理"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"中央银行作为“银行的银行”，其集中体现是（　）。","o":["垄断货币发行权","集中保管存款准备金、充当最后贷款人、组织全国清算","代理国库收支","经营商业性存贷款业务"],"a":[1],"e":"央行三大角色：发行的银行（垄断货币发行——C选项属此）；银行的银行（集中保管准备金、对金融机构再贷款再贴现——最后贷款人、组织清算——本题答案）；政府的银行（代理国库、持有管理国际储备、代表政府参与国际金融事务）。央行不办理企业和个人的商业性业务（D 错），不以盈利为目的。\n【归类练习】“印钱”是发行，“救银行”是最后贷款人，“管国库”是政府——三条线别串。","k":"中央银行的职能"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"中央银行调整再贴现率影响货币供给，除了改变银行融资成本外，还通过向市场传递政策信号发挥作用。这一效应称为（　）。","o":["告示效应","财富效应","替代效应","乘数效应"],"a":[0],"e":"再贴现政策的两大作用：一是成本效应——调整银行向央行融资的成本，影响其放贷能力；二是告示效应——贴现率的调整向市场宣示政策方向，引导预期（加息宣示收紧，市场随之调整行为）。它的弱点是央行处于被动：是否申请再贴现取决于商业银行。\n【工具性格对比】公开市场操作“主动灵活”，准备金率“猛烈刚性”，再贴现“被动＋信号强”。","k":"再贴现政策"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"货币政策中介目标应当具备的“三性”是（　）。","o":["安全性、流动性、盈利性","可测性、可控性、相关性","真实性、完整性、及时性","稳定性、持续性、公益性"],"a":[1],"e":"中介目标三性：可测性（数据能及时准确获得）、可控性（央行能有效施加影响）、相关性（与最终目标紧密相关）。常用中介目标：利率、货币供应量（我国长期把M2和社会融资规模增速作为重要中介目标/参考指标）。A 是商业银行经营原则，C 是政府预算原则。\n【传导链】政策工具→中介目标→最终目标，中介目标是“仪表盘”。","k":"货币政策中介目标"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"multi","q":"货币政策要实现的最终目标包括（　）。","o":["物价（币值）稳定","充分就业","经济增长","国际收支平衡","财政收入最大化"],"a":[0,1,2,3],"e":"货币政策四大最终目标：物价稳定、充分就业、经济增长、国际收支平衡。目标之间存在冲突（如物价稳定与充分就业/增长的短期权衡——菲利普斯曲线；内外均衡的冲突——米德冲突），所以央行需要权衡取舍，这也是“相机抉择”与“单一规则”之争的根源。财政收入最大化是财政目标，与货币政策无关——央行不以盈利为目的。\n【记忆钩子】“稳价、保就业、促增长、平衡国际账”。","k":"货币政策的最终目标"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"下列货币政策工具中，属于选择性货币政策工具的是（　）。","o":["公开市场操作","法定存款准备金率","消费信用控制","再贴现"],"a":[2],"e":"货币政策工具体系：一般性工具（三大法宝——公开市场操作、法定准备金率、再贴现，总量调节）＋选择性工具（针对特定领域：消费信用控制——分期付款首付比例与期限、不动产信用控制、优惠利率、证券市场信用控制等）＋补充性工具（窗口指导等直接信用控制和道义劝说）。题干问“选择性”，只有C指向特定消费领域。\n【判断口诀】“管总量的叫一般，管某个行业的叫选择”。","k":"货币政策工具体系"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"商业银行办理结算、代理收付等不占用自有资金、以收取手续费为主要收入的业务，属于（　）。","o":["负债业务","资产业务","中间业务","同业拆借业务"],"a":[2],"e":"商业银行三大业务板块：负债业务（形成资金来源——吸收存款、借款）、资产业务（运用资金——贷款、投资）、中间业务（不动用或极少动用自有资金、以中介人身份收手续费——结算、代理、银行卡、担保承诺、理财等）。同业拆借属于负债（短期借入）业务。\n【记忆钩子】“进钱的算负债，出钱的算资产，跑腿撮合赚手续费的算中间”。","k":"商业银行的业务"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"金融工具的四个基本特征是（　）。","o":["期限性、流动性、风险性、收益性","强制性、无偿性、固定性、收益性","可测性、可控性、相关性、稳定性","安全性、公益性、盈利性、保密性"],"a":[0],"e":"金融工具四性：期限性（偿还期限）、流动性（迅速变现且不损失价值的能力——现金最强）、风险性（本金收益受损的可能）、收益性（带来利息股息等回报）。四性之间此消彼长：流动性高的工具收益通常较低，风险高的工具要求更高收益补偿（风险溢价）。\n【混淆防御】B 是税收“三性”加的一项，C 是中介目标“三性”，都拿来当干扰项。","k":"金融工具的特征"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"下列金融工具中，属于货币市场工具的是（　）。","o":["国库券（短期国债）","十年期公司债券","普通股票","二十年期限的政府债券"],"a":[0],"e":"货币市场＝一年以内的短期资金市场，工具：国库券、同业拆借、商业票据（承兑、贴现）、大额可转让定期存单（CD）、回购协议。中长期债券和股票属于资本市场工具。国库券期限短（3个月、6个月、1年内）、信用高、流动性强，是货币市场的“当家品种”。\n【判断口诀】“一年以下货币市场，一年以上资本市场”。","k":"货币市场工具"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"multi","q":"下列业务中，属于商业银行中间业务的有（　）。","o":["支付结算业务","代理发行和兑付债券","发放住房按揭贷款","吸收企业活期存款","银行卡业务"],"a":[0,1,4],"e":"中间业务的标志：不形成或基本不形成银行表内资产负债，赚的是手续费与佣金——结算、代理（发行兑付、代收代付）、银行卡、担保承诺、理财托管等。发放贷款属于资产业务（资金运用、承担信用风险），吸收存款属于负债业务（资金来源）——这两项是银行的“主业”，但不是中间业务。\n【判断标准】“钱过不过银行的资产负债表”：过表的看借贷两头，不过表的才是中间业务。","k":"商业银行中间业务"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"某国政府对外债务违约引发本币大幅贬值、资本外逃和金融机构大面积倒闭。这种综合性危机最直接表现出的危机类型不包括（　）。","o":["债务危机","货币危机","流动性危机","操作危机"],"a":[3],"e":"金融危机的基本类型：债务危机（政府或企业还不起外债）、货币危机（本币遭投机冲击大幅贬值）、流动性危机（金融机构或市场流动性枯竭、挤兑），以及多种类型叠加的综合危机。题干情形是“债务＋货币＋流动性”的连环引爆。操作危机不是金融危机的分类——操作风险是金融机构内部流程、人员、系统的风险类别。\n【联动】危机的传染性：通过贸易、资本流动和信心渠道跨国传导。","k":"金融危机的类型"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"金融监管理论认为，政府必须对金融业实施严格监管的根本原因是（　）。","o":["金融行业利润率过高","金融体系存在系统性风险、负外部性和信息不对称等市场失灵","金融机构都是国有企业","金融监管可以增加财政收入"],"a":[1],"e":"金融业是市场失灵的重灾区：①负外部性——单家银行倒闭会引发挤兑传染，冲击整个经济；②信息不对称——存款人无法判断银行质量，引发逆向选择与道德风险；③公共产品属性——金融稳定本身就是公共产品；④系统性风险——个体理性可能导致集体非理性（羊群效应）。市场失灵是监管的理论根基，与利润高低、所有制、财政创收无关。","k":"金融监管的理论基础"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"我国存款保险制度对同一存款人在同一银行的存款实行限额偿付，最高偿付限额为（　）。","o":["10万元","50万元","100万元","500万元"],"a":[1],"e":"我国《存款保险条例》规定最高偿付限额为人民币50万元（本金+利息），覆盖绝大多数存款人（99%以上）；超出部分从投保机构清算财产中按比例受偿。存款保险制度的作用：保护中小存款人、增强公众信心、抑制挤兑传染——金融安全网的三大件之一（另两件：审慎监管、最后贷款人）。\n【判断口诀】“50万以内保险兜底，超过部分清算分钱”。","k":"存款保险制度"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"multi","q":"巴塞尔协议Ⅲ在原有基础上新增或强化的监管要求包括（　）。","o":["更严格的资本质量与数量要求（核心一级资本）","杠杆率监管","流动性覆盖率（LCR）和净稳定资金比例（NSFR）","逆周期资本缓冲和系统重要性银行附加资本","取消对银行的全部资本要求"],"a":[0,1,2,3],"e":"巴塞尔协议Ⅲ针对2008年金融危机的教训“打补丁”：①资本更“真”更“厚”——提高核心一级资本占比、扩大资本扣除；②首次引入不基于风险权重的杠杆率（≥3%）防监管套利；③新增流动性监管——LCR（短期30天应急能力）与NSFR（长期稳定资金）；④宏观审慎维度——逆周期资本缓冲（0~2.5%）、系统重要性银行附加资本。E 显然错误——协议的本意是加强而非取消资本约束。\n【时间线】巴Ⅰ定8%→巴Ⅱ三大支柱→巴Ⅲ流动性＋逆周期。","k":"巴塞尔协议Ⅲ"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"在给定置信水平下，某一金融资产或组合在未来特定持有期内的最大可能损失，称为（　）。","o":["期望收益","在险价值（VaR）","变异系数","标准差"],"a":[1],"e":"VaR（Value at Risk）是市场风险的通行计量语言：“95%置信度下，明天最多亏100万”——把风险翻译成一个可比较的金额数。银行据此设定市场风险限额与经济资本。VaR的局限：不度量超出置信水平的极端损失（尾部风险），需辅以压力测试。\n【对比】标准差/方差是波动性的统计度量，不直接回答“最多亏多少”。","k":"市场风险计量（VaR）"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"商业银行对借款人的还款意愿和还款能力进行审查并据此决策，主要针对的金融风险是（　）。","o":["市场风险","信用风险","操作风险","流动性风险"],"a":[1],"e":"信用风险＝交易对手不履约（不还钱、还不上钱）的风险，是银行最传统、占比最大的风险，管理手段包括贷前审查（还款能力与还款意愿）、担保抵押、风险定价、贷后管理、拨备与不良处置。市场风险管的是价格波动，操作风险管内控与系统，流动性风险管“有钱换不动”。\n【联动】不良贷款五级分类（正常、关注、次级、可疑、损失，后三类为不良）就是信用风险的分层刻画。","k":"信用风险及其管理"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"国际收支平衡表的主要构成部分是（　）。","o":["经常账户、资本和金融账户、净误差与遗漏","资产、负债、所有者权益","财政收入与财政支出","货币供给与货币需求"],"a":[0],"e":"国际收支平衡表按复式记账编制，主要包括：①经常账户——货物与服务、初次收入（投资收益、劳务报酬）、二次收入（转移）；②资本和金融账户——直接投资、证券投资、其他投资等；③净误差与遗漏（轧平借贷差额）。经常账户顺差大体对应储蓄大于投资、净出口的正贡献。\n【判读口诀】“经常看买卖，金融看投资，误差与遗漏兜个底”。","k":"国际收支平衡表"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"在其他条件不变的情况下，本币贬值对一国进出口的影响是（　）。","o":["出口商品以外币计价变便宜，利于出口；进口商品变贵，不利于进口","出口减少，进口增加","出口进口都减少","对进出口没有影响"],"a":[0],"e":"本币贬值→同样外币能换更多本币→外国买家用同样的钱能买到更多本国商品→出口竞争力上升；同时进口商品以本币计价变贵→进口受抑制。因此贬值是“奖出限入”，升值相反。前提是进出口对价格有足够弹性（马歇尔-勒纳条件），且需注意“J曲线效应”——贬值初期贸易收支可能先恶化后改善。","k":"汇率变动对进出口的影响"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"特别提款权（SDR）货币篮子中，2016年加入的货币是（　）。","o":["美元","欧元","人民币","日元"],"a":[2],"e":"SDR是IMF创设的“纸黄金”式储备资产，其定值篮子现包括美元、欧元、人民币、日元、英镑五种货币；人民币于2016年10月正式加入，是国际化的重要里程碑，此后权重上调至第三位。SDR本身不是货币，是成员国可向IMF兑换可自由使用货币的权利凭证。\n【联动】扩大SDR使用、提高人民币权重，都服务于国际货币体系多元化和人民币国际化。","k":"特别提款权（SDR）"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"一国管理国际储备资产时，通常将（　）置于首位。","o":["盈利性","安全性","流动性","多样性"],"a":[1],"e":"国际储备管理三性：安全性（保值、不损失本金）、流动性（随时可用于国际支付与干预）、盈利性（储备资产保值增值）。次序上安全性第一、流动性第二、盈利性第三——储备不是拿去炒股赚钱的，是国家的“应急钱包”，亏本和用不出来都是灾难。\n【结构管理】币种多元化分散风险、与对外支付结构匹配、适度规模（常用指标：储备/月进口额，一般为3~4个月进口额的经验区间）。","k":"国际储备管理"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"multi","q":"一国的国际储备资产包括（　）。","o":["外汇储备","货币性黄金","在国际货币基金组织的储备头寸","特别提款权（SDR）","本国企业持有的外币应收账款"],"a":[0,1,2,3],"e":"国际储备四要件：外汇储备（主体）、货币性黄金（注意是政府持有的金融资产意义上的黄金，不是首饰）、IMF储备头寸、SDR——共同特征是政府（货币当局）持有、可随时用于国际支付、被各国普遍接受。企业或个人持有的外币资产是民间外汇，不构成官方国际储备。\n【判断标准】“官方持有＋随时可用＋普遍接受”，三个条件缺一不可。","k":"国际储备的构成"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"推动跨境贸易和投资中使用人民币结算，减少对第三方货币的依赖。这一进程通常称为（　）。","o":["人民币国际化","外汇管制","货币一体化","资本外逃"],"a":[0],"e":"人民币国际化：人民币跨越国境，在贸易结算、投融资、储备货币等职能上被非居民广泛接受和使用的进程。主要抓手：跨境贸易人民币结算、双边本币互换协议、人民币清算行体系、CIPS（人民币跨境支付系统）、加入SDR篮子、发展离岸人民币市场（香港）。好处：降低汇率风险与换汇成本、提升国际话语权。\n【概念辨析】资本项目可兑换是“钱能自由进出”，国际化是“钱被世界使用”——前者是重要条件，两者不是一回事。","k":"人民币国际化"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"会计的基本职能是（　）。","o":["核算（反映）和监督（控制）","预测和决策","筹资和投资","记账和纳税"],"a":[0],"e":"会计两大基本职能：①核算——以货币为主要计量单位，对经济活动进行确认、计量、记录和报告（事后、事中、事前的反映）；②监督——对经济活动的合法性、合理性进行审查控制。预测、决策、分析、考核等是在基本职能基础上拓展的派生职能。\n【记忆钩子】“先算账（核算），再盯账（监督）”。","k":"会计的基本职能"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"下列各项中，不属于会计要素计量属性的是（　）。","o":["历史成本","重置成本","可变现净值","计划成本"],"a":[3],"e":"会计计量属性五种：历史成本（购置时实际支付——最常用，固定资产一般按此）、重置成本（现在重新购置要花多少）、可变现净值（预计售价减去进一步成本和销售费用）、现值（未来现金流折现）、公允价值（市场参与者有序交易价格）。计划成本是存货日常核算的内部管理口径，不是法定的计量属性。\n【记忆钩子】“历史、重置、可变现、现值、公允”五件套。","k":"会计要素的计量属性"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"企业期末对存货计提跌价准备、对固定资产采用加速折旧法。这些做法体现的会计信息质量要求是（　）。","o":["实质重于形式","谨慎性","可比性","重要性"],"a":[1],"e":"谨慎性要求对交易或事项进行确认计量时“不高估资产或收益、不低估负债或费用”——计提减值准备、加速折旧、确认或有负债但不确认或有资产，都是典型应用。注意谨慎性的边界：不得计提秘密准备（故意多提减值调节利润），那是滥用谨慎性。","k":"会计信息质量要求（谨慎性）"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"行政事业单位的预算会计核算一般采用的记账基础是（　）。","o":["权责发生制","收付实现制","永续盘存制","实地盘存制"],"a":[1],"e":"政府会计“双基础”：财务会计用权责发生制，预算会计原则上用收付实现制（国务院另有规定除外）——预算会计盯着“钱什么时候实际进出国库”。永续盘存制、实地盘存制是存货的盘存方法，与记账基础是两码事。\n【对照记忆】“企业一律权责；政府双轨：财务权责、预算收付”。","k":"记账基础"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"multi","q":"下列各项中，属于会计信息质量要求的有（　）。","o":["可靠性","相关性","可比性","权责发生制","历史成本"],"a":[0,1,2],"e":"会计信息质量要求八项：可靠性、相关性、可理解性、可比性、实质重于形式、重要性、谨慎性、及时性。权责发生制是记账（确认计量）基础，历史成本是计量属性——它们回答“怎么记账”，不是“记出来的账要什么质量”，分类题里最常拿它们冒充质量要求。\n【记忆钩子】“八项质量：靠、相、懂、比、实、重、谨、及”。","k":"会计信息质量要求"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"企业发生的下列支出中，应确认为资产而非当期费用的是（　）。","o":["支付本年度广告费","支付本月员工工资","购入一台使用年限超过一年的生产设备","支付违约罚款"],"a":[2],"e":"确认资产的核心条件：由企业过去的交易形成、为企业所拥有或控制、预期会带来经济利益。生产设备使用期超过一年、能长期产生经济利益，应确认为固定资产并分期折旧；广告费、工资、罚款的受益期在当期，直接计入当期费用（权责发生制与配比逻辑）。\n【判断口诀】“受益当期进费用，受益多期进资产，慢慢折旧慢慢摊”。","k":"会计要素的确认"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"会计凭证按填制程序和用途分为（　）。","o":["原始凭证和记账凭证","收款凭证、付款凭证、转账凭证","外来凭证和自制凭证","一次凭证和累计凭证"],"a":[0],"e":"原始凭证：经济业务发生时直接取得或填制的“第一手”凭据（发票、入库单、火车票），是记账的原始依据；记账凭证：会计人员根据审核无误的原始凭证归类整理后编制、直接作为登记账簿依据的凭证。B 是记账凭证按业务内容的分类，C 是原始凭证按来源的分类，D 是原始凭证按时点的分类——都是“子分类”。\n【链条】原始凭证（业务发生）→记账凭证（会计翻译）→账簿（归类汇总）→报表（输出）。","k":"会计凭证的分类"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"对总分类账和所属明细分类账的登记，要求在同期、同方向、同金额地进行。这一要求称为（　）。","o":["复式记账","平行登记","试算平衡","结账"],"a":[1],"e":"平行登记四同：同依据（同一凭证）、同期间、同方向（借贷方向一致）、同金额（总账金额＝所属明细账金额之和）。作用是保证总账与明细账相互勾稽、可以互相核对。复式记账是“每笔业务在两个以上账户登记”的记账方法，层级更高。\n【核对关系】总账余额＝所属各明细账余额之和，不等就说明有错。","k":"总账与明细账的平行登记"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"关于试算平衡，下列说法正确的是（　）。","o":["试算平衡了，账户记录一定没有错误","试算不平衡，账户记录肯定存在错误","试算平衡可以发现漏记某项业务的错误","试算平衡只是形式上的平衡，不能保证记账完全正确"],"a":[3],"e":"试算平衡依据“借贷必相等”检查记账的方向和金额：借贷不平衡→肯定有错；但借贷平衡≠记录正确——漏记、重记（同额）、方向记反（一借一贷颠倒）、同类科目串户等错误借贷依然平衡，试算无法发现。C 错：漏记不破坏平衡，恰恰是试算的盲区。\n【记忆钩子】“平了不代表对，不平一定错”。","k":"试算平衡"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"月末发现账簿记录中某笔金额把500元误记为5000元，且记账凭证也填错。适用的更正方法是（　）。","o":["划线更正法","红字更正法","补充登记法","直接涂改"],"a":[1],"e":"错账更正三法：①划线更正法——凭证对、账簿错（文字或金额笔误），划红线注销、上方写正确数并签章；②红字更正法——凭证科目或金额多记（本题500记成5000，多记4500），用红字冲销原错误凭证或冲销多记部分，再蓝字登记正确分录；③补充登记法——凭证金额少记，按差额补记。账簿不得刮擦涂改。\n【判断口诀】“账错划线，多记红字冲，少记补差额”。","k":"错账更正方法"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"企业银行日记账余额与银行对账单余额不一致，经查系存在未达账项。调整的依据是编制（　）。","o":["资产负债表","银行存款余额调节表","利润表","科目汇总表"],"a":[1],"e":"未达账项：企业与银行一方已入账、另一方尚未入账的款项（企业已收银行未收、企业已付银行未付、银行已收企业未收、银行已付企业未付四种）。双方各自补记对方已记的未达账项后，调节表调节后余额应相等——它是核对工具，不是记账依据（不能据此直接调账，须待结算凭证到达）。核对相符后账实一致，属于对账中的“账实核对”。","k":"财产清查（银行存款核对）"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"会计上对各项财产物资的增减变动，平时既登记收入又登记发出、随时结出账面结存数的盘存制度是（　）。","o":["实地盘存制","永续盘存制","权责发生制","收付实现制"],"a":[1],"e":"永续盘存制：进出都有账、随时可查账面结存，需定期盘点核对账实（差异查明原因处理）；管理严密但工作量大。实地盘存制：平时只记收入不记发出，期末盘点倒挤发出数（“以存计销”），手续简便但漏洞多、不能随时掌握结存。\n【记忆钩子】“永续记流水账，实地期末倒挤”。","k":"财产清查（盘存制度）"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"对账工作的主要内容是（　）。","o":["账证核对、账账核对、账实核对","填制凭证、登记账簿、编制报表","结账、试算、编制报表","审账、查账、调账"],"a":[0],"e":"对账三核对：账证核对（账簿与凭证）、账账核对（总账与明细账、总账与日记账之间）、账实核对（现金盘点、银行对账、财产清查、往来核对）。对账在结账前进行，保证“账证相符、账账相符、账实相符”，然后才能据以编表。\n【流程定位】“凭证→账簿（平行登记）→对账→结账→报表”。","k":"对账"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"multi","q":"下列关于会计凭证与账簿的说法中，正确的有（　）。","o":["记账凭证应当根据审核无误的原始凭证填制","原始凭证是登记账簿的直接依据之一","会计账簿包括序时账、分类账和备查账","账簿记录发生错误可以涂改、刮擦后重写","登记账簿必须依据经过审核的会计凭证"],"a":[0,1,2,4],"e":"凭证链条：原始凭证审核后填制记账凭证，再据以登记账簿（A、B、E 正确）；账簿按用途分序时账（日记账）、分类账（总账、明细账）、备查账（C 正确）。账簿错误必须按划线更正、红字更正、补充登记等规范方法处理，严禁涂改、刮擦、挖补（D 错）——会计法明确禁止。","k":"会计凭证与账簿"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"资产负债表中，资产项目按（　）顺序排列。","o":["金额从大到小","流动性（变现能力）由强到弱","取得时间先后","盈利能力高低"],"a":[1],"e":"资产负债表“左资产右负债权益”的结构里，资产按流动性递减排列：货币资金→交易性金融资产→应收账款→存货→长期股权投资→固定资产→无形资产等；负债按偿还期限递增排列：流动负债（一年内）在前、非流动负债在后。流动性排列方便报表使用者判断企业的短期偿债能力与资产变现能力。\n【联动】负债同口径：先流动后非流动，与资产对应比较得流动比率、速动比率。","k":"资产负债表的结构"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"我国企业利润表采用的格式是（　）。","o":["单步式","多步式","账户式","报告式"],"a":[1],"e":"利润表多步式分三步：①营业收入−营业成本−税金及附加−期间费用等＝营业利润；②营业利润＋营业外收入−营业外支出＝利润总额；③利润总额−所得税费用＝净利润。账户式、报告式是资产负债表的两种格式（我国用账户式：左右结构）。\n【三个利润的边界】营业利润看主业，利润总额加“意外之财/飞来之祸”，净利润再扣税。","k":"利润表"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"资产负债表“应收账款”项目应根据（　）填列。","o":["应收账款总账期末余额","应收账款明细账借方余额与预收账款明细账借方余额之和，扣除坏账准备","应收账款总账余额直接减坏账准备","预收账款总账余额"],"a":[1],"e":"“应收账款”按明细账分析填列：应收账款明细的借方余额＋预收账款明细的借方余额（预收账款出现借方余额实质是应收性质），再扣除已计提的坏账准备。同理“预收账款”＝两科目明细的贷方余额之和。这体现明细账重于总账的填列规则——总账余额会掩盖不同性质的明细方向。\n【同类考点】“应付账款”＝应付＋预付明细的贷方余额。","k":"资产负债表的填列方法"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"现金流量表中的“现金”包括库存现金、可随时用于支付的存款以及（　）。","o":["三个月内到期的短期债券投资等现金等价物","一年内到期的所有应收账款","全部银行定期存款","存货"],"a":[0],"e":"现金等价物四条件：期限短（一般自购买日起3个月内到期）、流动性强、易于转换为已知金额现金、价值变动风险很小——典型是3个月内到期的短期国债、短期企业债。定期存款（不可随时支取）、应收账款、存货都不满足“随时可支付”的即时流动性。\n【判断口诀】“三个月内到期、随时能变成确定金额的钱”才算等价物。","k":"现金及现金等价物"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"下列现金流量中，属于经营活动产生的现金流量的是（　）。","o":["销售商品、提供劳务收到的现金","购建固定资产支付的现金","吸收投资收到的现金","偿还借款支付的现金"],"a":[0],"e":"经营活动现金流量围绕“日常产供销”：销售商品提供劳务收款、收到税费返还、购买商品接受劳务付款、支付职工薪酬、支付税费等。购建固定资产＝投资活动；吸收投资（发行股票收到钱）、借款还款、分红＝筹资活动。\n【快速归类】“卖了钱、买了料、付了工资税”→经营；“买设备卖设备、投资进出”→投资；“找钱还钱分钱”→筹资。","k":"经营活动的现金流量"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"下列报表中，反映企业所有者权益各组成部分当期增减变动情况的是（　）。","o":["所有者权益变动表","利润表","资产负债表","附注"],"a":[0],"e":"所有者权益变动表全面反映报告期内所有者权益的增减变动：净利润、其他综合收益、股东投入与减少、利润分配（提取公积金、分红）、内部结转（资本公积转增等），按实收资本、资本公积、其他综合收益、盈余公积、未分配利润分项列示。它是连接利润表与资产负债表的桥梁——解释“净资产为什么变了”。","k":"所有者权益变动表"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"对财务报表中列示项目的文字描述或明细资料，以及对未能在报表中列示项目的说明，属于（　）。","o":["审计报告","附注","董事会决议","科目汇总表"],"a":[1],"e":"附注是财务报表不可或缺的组成部分，披露：企业的基本情况、报表编制基础、重要会计政策的说明、报表重要项目的明细、或有事项和承诺事项等。报表是“骨架数字”，附注是“血肉解释”——只看数字不看附注，很容易漏掉重大风险（如巨额担保、未决诉讼）。\n【完整报表体系】四表一注：资产负债表、利润表、现金流量表、所有者权益变动表＋附注。","k":"附注"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"multi","q":"一套完整的财务报表体系包括（　）。","o":["资产负债表","利润表","现金流量表","审计报告","附注"],"a":[0,1,2,4],"e":"企业财务报表“四表一注”：资产负债表、利润表、现金流量表、所有者权益变动表＋附注。审计报告是注册会计师对报表发表意见的独立鉴证文件，属于审计产物，不属于企业编制的财务报表体系——它是报表可信度的“背书”，不是报表本身。\n【答题标志】选项里塞“审计报告/验资报告/纳税申报表”冒充报表构成，是固定套路。","k":"财务报表的构成"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"某企业年末流动资产800万元，其中存货300万元，流动负债400万元。该企业的速动比率为（　）。","o":["1.25","2.0","0.75","1.0"],"a":[0],"e":"速动资产＝流动资产−存货＝800−300＝500万元；速动比率＝500÷400＝1.25。若算流动比率则是800÷400＝2。经验参考值：流动比率约2、速动比率约1，但不同行业差异大（零售业存货周转快，流动比率偏低也正常）。\n【分析要点】比率过高也未必好——可能是资金闲置或应收账款收不回，要结合行业和结构看。","k":"偿债能力比率（计算）"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"某企业资产总额5000万元，负债总额3000万元。该企业的资产负债率为（　）。","o":["40%","60%","66.7%","167%"],"a":[1],"e":"资产负债率＝负债总额÷资产总额＝3000÷5000＝60%。它衡量长期偿债能力和财务杠杆水平：对债权人越低越安全；对股东则是双刃剑——适度负债利用财务杠杆放大收益，过高则财务风险大。不同行业警戒线不同，一般制造业70%以上被认为偏高。\n【配套指标】产权比率＝负债÷所有者权益＝3000÷2000＝1.5，与资产负债率同向变化。","k":"资产负债率（计算）"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"应收账款周转率（次）的计算公式是（　）。","o":["营业收入÷平均应收账款余额","营业收入÷平均存货","营业成本÷平均应收账款余额","平均应收账款余额÷营业收入"],"a":[0],"e":"应收账款周转率＝营业收入（赊销收入）÷平均应收账款余额，反映年度内应收账款转为现金的平均次数；次数越多，回款越快，坏账风险和资金占用越小，也可换算为周转天数＝360÷周转次数。注意分母差异：存货周转率用营业成本（存货按成本计价）÷平均存货，总资产周转率用营业收入÷平均总资产——别把“分子”张冠李戴。","k":"营运能力比率"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"存货周转率偏低，可能说明企业存在的问题是（　）。","o":["存货积压、销售不畅或管理效率低下","存货周转太快导致缺货","赊销政策过于宽松","偿债能力过强"],"a":[0],"e":"存货周转率＝营业成本÷平均存货，偏低意味着同样多的销售“背着”过重的存货：可能积压滞销、备货过量，也可能有冷背残次存货未处理——占用资金、增加储存成本和跌价风险。C 描述的是应收账款周转率偏低的原因，D 与存货无关（反而通常伴随高周转）。\n【联动分析】存货积压还会推高流动比率“虚胖”，所以分析短期偿债要结合速动比率剔除存货。","k":"存货周转率的分析"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"某企业净利润200万元，营业收入2000万元，资产平均总额4000万元，所有者权益平均2000万元。该企业的净资产收益率（ROE）为（　）。","o":["5%","10%","20%","50%"],"a":[1],"e":"净资产收益率＝净利润÷平均所有者权益＝200÷2000＝10%。顺带算全链条：销售净利率＝200÷2000＝10%，总资产周转率＝2000÷4000＝0.5次，权益乘数＝4000÷2000＝2；杜邦验证：10%×0.5×2＝10% ✓。提高ROE的三条路：更赚钱（净利率）、更快转（周转率）、更多借（杠杆）。\n【杜邦体系】把ROE拆成“盈利×效率×杠杆”，诊断利润从哪来、风险在哪。","k":"净资产收益率（杜邦分析）"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"下列指标中，属于企业盈利能力分析指标的是（　）。","o":["销售净利率","流动比率","总资产周转率","资产负债率"],"a":[0],"e":"财务指标四大家族：盈利能力——销售净利率、毛利率、总资产报酬率、净资产收益率；偿债能力——流动比率、速动比率、资产负债率、利息保障倍数；营运能力——应收账款周转率、存货周转率、总资产周转率；发展能力——营业收入增长率、资本积累率。看到“比率、周转、负债率、净利率”先归类再答题。","k":"财务指标体系"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"multi","q":"下列指标中，反映企业短期偿债能力的有（　）。","o":["流动比率","速动比率","现金比率","资产负债率","存货周转率"],"a":[0,1,2],"e":"短期偿债能力看“一年内到债期能不能扛住”：流动比率（流动资产/流动负债）、速动比率（剔存货）、现金比率（货币资金＋交易性金融资产/流动负债，最严格）。资产负债率是长期偿债能力指标；存货周转率是营运能力指标。\n【阶梯记忆】“流动看家底，速动剔存货，现金最苛刻”。","k":"偿债能力指标体系"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"我国政府会计标准体系主要包括（　）。","o":["政府会计基本准则、具体准则及应用指南和政府会计制度","企业会计准则与小企业会计准则","民间非营利组织会计制度","村集体经济组织会计制度"],"a":[0],"e":"政府会计标准体系四层：基本准则（纲领，确立双功能双基础双报告框架）→具体准则（存货、投资、固定资产、公共基础设施、政府储备物资、负债等）→应用指南→政府会计制度（统一科目与报表格式）。适用主体：各级政府、各部门、各单位（行政单位和公益性事业单位）——营利性企业用企业会计准则，不在其列。","k":"政府会计标准体系"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"政府会计“适度分离并相互衔接”的两大会计功能是（　）。","o":["财务会计与预算会计","总账会计与明细会计","成本会计与管理会计","核算会计与审计"],"a":[0],"e":"同一核算系统内“双分录、并行账”：财务会计（权责发生制，5要素：资产负债净资产收入费用）编制财务报告，反映运行成本与资产负债家底；预算会计（收付实现制，3要素：预算收入、预算支出、预算结余）编制决算报告，反映预算收支执行。两者相互衔接：通过“预算结余与财务盈余差异”等机制勾稽。\n【记忆钩子】“财务算家底（权责），预算盯盘子（收付）；五要素对三要素”。","k":"政府会计的双功能"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"政府会计核算中，市政道路、公共图书馆等由政府会计主体控制的公共基础设施（　）。","o":["不属于政府资产，不需核算","属于政府会计核算的资产，单设科目反映","一律作为企业资产核算","只能统计不能入账"],"a":[1],"e":"政府会计把公共基础设施（市政道路、桥涵、隧道、公交场站、公共图书馆等）、政府储备物资、保障性住房、文物文化资产等“特殊资产”纳入统一核算，单设科目、计提折旧（文物文化资产除外），摸清政府“家底”——这是政府会计改革从“预算记账”走向“资产负债管理”的标志。\n【反向坑】“政府修的路不用入账”是旧习惯，新制度明确要求核算。","k":"政府会计的特殊资产"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"政府预算会计要素包括（　）。","o":["预算收入、预算支出、预算结余","资产、负债、净资产","收入、费用、利润","现金流人、现金流出、净现金流"],"a":[0],"e":"预算会计三要素：预算收入（纳入预算管理的现金流入）、预算支出（纳入预算管理的现金流出）、预算结余（收入减支出后的结余，含结转结余资金）。财务会计五要素（资产、负债、净资产、收入、费用）与预算三要素并行，一套系统两本账。\n【数字记忆】“财务五，预算三”——多出的利润概念政府没有，预算没有资产负债概念（那是财务的活）。","k":"预算会计要素"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"multi","q":"政府财务会计的要素包括（　）。","o":["资产","负债","净资产","利润","收入和费用"],"a":[0,1,2,4],"e":"政府财务会计五要素：资产、负债、净资产、收入、费用，等式“资产−负债＝净资产”。政府不以营利为目的，没有“利润”要素——收入减费用的差额反映运行余缺而非利润。B、C、D 中利润是典型的企业会计要素干扰项。\n【对照表】企业六要素：资产、负债、所有者权益、收入、费用、利润；政府五要素＋预算三要素。","k":"政府财务会计要素"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"政府会计“双报告”是指（　）。","o":["财务报告和决算报告","月报和年报","内部报告和外部报告","审计报告和验资报告"],"a":[0],"e":"双报告与双功能配套：财务报告——以权责发生制财务会计核算为基础，包括资产负债表、收入费用表等，反映政府财务状况和运行成本（政府综合财务报告是改革重点）；决算报告——以收付实现制预算会计核算为基础，反映年度预算收支执行结果（决算报表）。两报告编制基础、目标、使用者不同，相互补充。\n【记忆钩子】“财务报告看家底，决算报告看花销”。","k":"政府会计的双报告"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"自上而下统一布置、自下而上逐级提供基本统计数据，按一定周期经常性填报的调查制度是（　）。","o":["普查","统计报表制度","重点调查","抽样调查"],"a":[1],"e":"统计报表制度是我国政府统计取得经常性基本统计资料的重要方式：由政府统计机构统一制发表格、统一指标口径，自上而下布置、自下而上逐级上报汇总。优点是资料系统连续、口径统一；缺点是逐级上报环节多、时效性相对差，且依赖填报质量。\n【五方式总览】普查（全面、一次性）、统计报表（全面为主、经常）、抽样调查（非全面、最常用）、重点调查（重点单位）、典型调查（解剖麻雀）。","k":"统计调查的方式（统计报表）"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"multi","q":"下列指标中，属于离散程度（变异程度）测度指标的有（　）。","o":["极差","标准差","变异系数","四分位差","中位数"],"a":[0,1,2,3],"e":"离散程度指标家族：极差（最大−最小，最粗糙）、四分位差（Q3−Q1，抗极端值）、方差与标准差（最常用）、变异系数（标准差/均值，跨量纲比较）。中位数是集中趋势指标，站错了队。\n【成对记忆】集中三兄弟（均值、中位数、众数）管“一般水平”，离散一堆（极差、四分位差、方差、标准差、变异系数）管“波动大小”。","k":"离散程度指标体系"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"其他条件相同的情况下，不重复抽样与重复抽样的抽样平均误差相比（　）。","o":["不重复抽样误差更小","重复抽样误差更小","两者完全相等","两者无法比较"],"a":[0],"e":"不重复抽样中同一单位不会被抽中两次，样本的“覆盖效率”更高，其抽样误差比重复抽样小，公式中多乘一个修正系数√(1−n/N)。当总体很大、抽样比例很小时，该系数接近1，两种抽样的误差差异可以忽略，工程上常按重复抽样近似计算。\n【联动记忆】μ(不重复)＝μ(重复)×√(1−n/N)——n/N 就是“抽样比”。","k":"重复抽样与不重复抽样"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"某企业广告费x与销售额y的一元线性回归方程为 ŷ＝200＋12x（单位：万元）。当年广告费投入10万元时，销售额的预测值约为（　）。","o":["120万元","212万元","320万元","390万元"],"a":[2],"e":"把x＝10代入回归方程：ŷ＝200＋12×10＝200＋120＝320（万元）。截距200表示不投广告时的基准销售额（数学意义）；回归系数12表示广告费每增加1万元，销售额平均增加12万元。\n【外推提醒】预测只能在样本数据范围内内插使用——广告费0到20万的方程，不能拿去预测投500万的效果。","k":"回归方程的预测应用"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"下列现象之间，属于负相关关系的是（　）。","o":["居民收入与消费支出","产品价格与需求量","广告投入与销售额","身高与体重"],"a":[1],"e":"负相关＝两个变量反向变动。价格上升需求量下降（需求规律），是教科书级负相关；收入与消费、广告与销售额、身高与体重都是同向变动，属于正相关。\n【延伸判断】相关系数r＜0即负相关；但相关≠因果——相关关系要经过经济学逻辑和机制检验才能上升为因果解释。","k":"相关关系的类型"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"下列时间序列中，属于时期序列的是（　）。","o":["年末人口总数","各月商品销售额","月末库存额","季末银行存款余额"],"a":[1],"e":"时期序列：反映一段时期内累计发生量（销售额、产量、收入），各期数值可加总（全年销售额＝四个季度之和），数值大小与时期长短直接相关。时点序列：反映某一时点的瞬间水平（人口、库存、存款余额），各数值相加没有意义。判别法宝：问一句“加起来有意义吗？”——销售额加总有意义（时期），库存加总无意义（时点）。","k":"时期序列与时点序列"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"股份有限公司的设立方式中，发起人认购公司应发行的全部股份的是（　）。","o":["募集设立","发起设立","定向增发","吸收合并设立"],"a":[1],"e":"股份公司两种设立方式：发起设立——发起人认购全部股份，不向社会公开募集，设立简便（有限公司天然是发起式）；募集设立——发起人认购部分股份（不得少于35%），其余向社会公开募集或向特定对象募集，程序复杂、受严格监管。定向增发是公司成立后的再融资行为，不是设立方式。\n【数字记忆】募集设立中发起人认购比例≥35%。","k":"公司设立方式"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"在货币政策“三大法宝”中，具有主动性、灵活性、可微调和可逆转特点、成为多数国家最常用工具的是（　）。","o":["法定存款准备金率","再贴现","公开市场操作","窗口指导"],"a":[2],"e":"公开市场操作由央行主动发起，规模可大可小、方向可逆（买卖随时调整）、可连续高频操作，既能精细微调流动性，又不产生准备金率那样的剧烈冲击——全球主要央行都把它当作日常主力工具。准备金率威力大但不宜频繁动用，再贴现是否申请取决于商业银行（央行被动）。\n【我国特色】除传统工具外，央行还创设了MLF、SLF、PSL等新型工具灵活投放流动性。","k":"公开市场操作的特点"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"我国中央银行创设的MLF（中期借贷便利）等结构性货币政策工具，主要功能是（　）。","o":["替代财政支出直接拨款给企业","向符合要求的金融机构提供中期流动性，引导其向特定领域投放信贷","直接购买企业发行的股票","规定商业银行的存贷款利率"],"a":[1],"e":"MLF（中期借贷便利）、SLF（常备借贷便利）、PSL（抵押补充贷款）等属于新型（结构性）货币政策工具：金融机构以合格质押品从央行获得中短期资金，央行借此调节银行体系流动性总量与结构，并通过定向额度引导资金流向小微企业、“三农”、绿色等重点领域。它们不直接拨款给企业（要经过银行信贷）、不买股票、也不直接行政定价。\n【理解口诀】“央行把钱借给银行，附上‘怎么用’的导航”。","k":"我国货币政策工具的创新"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"商业银行能够进行存款货币创造的基本前提是（　）。","o":["实行全额准备金制度","实行部分准备金制度且非现金结算广泛使用","所有贷款必须用现金发放","银行只能吸收定期存款"],"a":[1],"e":"存款创造两个前提：①部分准备金制度——银行只需按比例留存准备金，其余可以放贷，资金才能“滚雪球”；②非现金结算广泛使用——贷款转入借款人账户再支付流转，始终留在银行体系内记账，派生存款链条才不因现金大量流出而中断。全额准备金（D选项意图）下每1元存款都锁死，乘数为1，无法创造货币。\n【联动】现金漏损率、超额准备金率越高，实际创造能力越弱。","k":"存款货币创造的前提"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"金融市场通过金融资产价格的波动引导资金从低效益部门流向高效益部门。这体现的金融市场功能是（　）。","o":["货币资金融通功能","优化资源配置功能","风险分散功能","宏观调控传导功能"],"a":[1],"e":"金融市场四大功能：融通资金（最基本）、优化资源配置（价格信号引导资金流向高效部门——题干所述）、风险分散与转移（金融工具把风险在市场参与者之间重新分配）、反映经济运行（“晴雨表”——股价利率等灵敏反映宏观与微观信息）。注意区分“把钱聚起来”（融通）与“把钱引到该去的地方”（配置）。","k":"金融市场的功能"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"金融机构之间进行短期、无担保资金借贷的市场是（　）。","o":["股票市场","同业拆借市场","中长期债券市场","外汇零售市场"],"a":[1],"e":"同业拆借市场：金融机构之间调剂头寸余缺的短期借贷（多为隔夜到七天，最长一般不超过一年），凭信用、无需担保，利率（如Shibor）是市场资金面松紧的敏感指标，也是货币政策传导的基准利率之一。\n【记忆钩子】“银行缺钱找同行，隔夜拆借看Shibor”。","k":"同业拆借市场"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"巴塞尔框架对业务规模大、复杂度高、倒闭可能引发系统性冲击的银行，要求计提额外的资本要求。这类银行称为（　）。","o":["政策性银行","系统重要性金融机构","外资银行","村镇银行"],"a":[1],"e":"系统重要性金融机构“大而不能倒”，其倒闭会引发系统性风险，因此巴塞尔框架及各国监管要求其计提附加资本（我国对入选全球系统重要性银行名单的大型银行有相应附加资本要求），并接受更严格的监管强度、恢复与处置计划（“生前遗嘱”）。\n【监管逻辑】“越大越重要→资本越厚→监管越严”，防范负外部性。","k":"系统重要性金融机构监管"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"2008年国际金融危机后，全球金融监管理念的显著转变是（　）。","o":["从强化监管转向放松监管","从只关注单个机构稳健（微观审慎）转向微观审慎与宏观审慎并重，关注系统性风险","取消对金融消费者的保护","只监管国有银行"],"a":[1],"e":"危机暴露了“单个机构都合规、整个系统却崩塌”的悖论——顺周期性、影子银行、关联传染等系统性风险无人负责。此后监管框架双轮驱动：微观审慎（管单个机构的资本与风险）＋宏观审慎（管整个体系的杠杆、流动性与顺周期，如逆周期资本缓冲、系统重要性附加）。金融消费者保护也被提到与审慎监管并列的位置（危机中误导销售的教训）。","k":"金融监管理念的演变"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"一国国际收支持续、大规模逆差可能带来的不利影响不包括（　）。","o":["本币面临贬值压力","外汇储备大量消耗","国际清偿能力下降","国内通货紧缩压力自动消失"],"a":[3],"e":"持续逆差＝外汇需求持续大于供给：本币贬值压力加大、为维护汇率消耗外汇储备、国际清偿力与国际信用受损，严重时引发货币危机；政策上往往被迫紧缩国内需求。D 说不利影响“不包括”的恰是它——逆差下紧缩调整反而通常伴随需求收缩压力，通货紧缩压力不会“自动消失”。\n【反向也有害】长期大规模顺差同样有问题：储备积压、本币升值压力、贸易摩擦，所以国际收支追求的是基本平衡。","k":"国际收支失衡的影响"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"“货币政策独立性、汇率稳定、资本自由流动三者不可兼得，最多只能同时实现两个”，这一结论称为（　）。","o":["三元悖论（不可能三角）","拉弗曲线","奥肯定律","菲利普斯曲线"],"a":[0],"e":"三元悖论（蒙代尔-弗莱明模型推论）：开放经济下，固定汇率＋资本自由流动→货币政策失去独立性（利率被世界利率锚定）；要保货币政策独立，只能在“管住资本流动”或“放弃汇率稳定”中二选一。我国的现实选择是“汇率有管理浮动＋货币政策独立＋资本项目有管理可兑换”的组合。\n【四个定律各自管什么】三元悖论管开放宏观；拉弗曲线管税率与税收；奥肯定律管失业与产出缺口；菲利普斯曲线管失业与通胀。","k":"三元悖论"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"利息保障倍数的计算公式是（　）。","o":["息税前利润÷利息费用","净利润÷利息费用","利息费用÷净利润","负债总额÷利息费用"],"a":[0],"e":"利息保障倍数＝息税前利润（EBIT）÷利息费用，衡量企业赚的利润能覆盖多少倍利息——倍数越高，付息越有底气，是长期偿债能力的重要补充指标。一般要求至少大于1，稳健标准常在3倍以上。用EBIT是因为利息本身在所得税前和利润前支付，分子必须“把利息和税加回来”。\n【家族定位】流动/速动比率管短期，资产负债率、产权比率、利息保障倍数管长期。","k":"长期偿债能力（利息保障倍数）"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"我国推行政府会计改革的主要目标之一是（　）。","o":["全面反映政府资产负债家底和运行成本，提升财政可持续性","增加政府收费收入","替代税务部门的征收职能","取消预算管理"],"a":[0],"e":"政府会计改革的核心目标：从只反映“钱花了没有”（预算执行）升级为同时反映“家底厚不厚、办事花多少钱”（资产负债状况与运行成本）——为编制政府综合财务报告、评价政府绩效、防范财政风险、推动成本核算与公共服务定价提供数据基础。预算管理不但没有取消，反而通过双系统得到更精细的反映。\n【一句话】“过去只见流水，现在还能盘家底”。","k":"政府会计改革的目标"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"multi","q":"关于政府会计“双报告”，下列说法正确的有（　）。","o":["决算报告以收付实现制的预算会计核算数据为基础编制","财务报告以权责发生制的财务会计核算数据为基础编制","决算报告主要反映年度预算收支执行情况","财务报告主要反映政府的财务状况和运行成本","两类报告都必须以权责发生制为基础"],"a":[0,1,2,3],"e":"双报告双基础一一对应：决算报告←收付实现制←预算会计（三要素），反映预算执行；财务报告←权责发生制←财务会计（五要素），反映财务状况与运行成本（含政府综合财务报告）。E 把两种基础混为一谈，是反向陷阱——恰恰是“双基础”构成了双报告的差异。\n【完整框架】双功能（财务＋预算）→双基础（权责＋收付）→双报告（财务＋决算）。三个“双”记成一条链。","k":"政府会计双报告"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"公共物品依靠市场机制供给不足的根本原因是（　）。","o":["生产成本太高","免费搭车行为（不付费也能享受）","消费者不喜欢公共物品","政府垄断供给"],"a":[1],"e":"公共物品的非排他性意味着无法阻止不付费者受益，理性人便倾向于“让别人出钱、自己搭车”；人人都这样想，愿意付费的人就寥寥无几，市场供给必然不足甚至为零。这是市场失灵在公共物品领域的核心机制，也是公共物品主要由政府提供的原因。\n【经典例证】路灯、国防——你不用也得用，用了也赖不掉，收不上钱就没人愿意生产。","k":"免费搭车问题"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"财政通过提供基础设施、支持基础研究等弥补市场供给缺口，体现的财政职能是（　）。","o":["资源配置职能","收入分配职能","经济稳定职能","监督管理职能"],"a":[0],"e":"资源配置职能回答“社会资源往哪配”：财政直接提供公共物品、纠正外部性（对污染征税、对教育补贴）、支持基础产业和基础研究——干市场“不愿干、干不了、干不好”的事。收入分配职能管“分蛋糕公平”，经济稳定职能管“熨平波动”。\n【判断口诀】“配资源（给什么）、调分配（给谁）、稳经济（何时多给少给）”。","k":"财政的资源配置职能"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"政府运用个人所得税累进税率和转移支付制度缩小居民收入差距。这体现的财政职能是（　）。","o":["资源配置职能","收入分配职能","经济稳定与发展职能","国有资产管理职能"],"a":[1],"e":"收入分配职能的手段：累进个人所得税“抽肥”、转移支付与社会保障“补瘦”，从而矫正市场按要素分配造成的贫富差距。再分配环节（税收、转移支付）是财政发挥作用的主场；初次分配主要由市场按要素贡献进行。\n【关联辨析】调节企业间的资源流向是配置职能；调节个人间、地区间的收入差距是分配职能。","k":"财政的收入分配职能"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"经济衰退时期，累进所得税收入自动减少、失业保险支出自动增加，从而缓解总需求下滑。这种机制属于（　）。","o":["相机抉择的财政政策","财政的自动稳定器","政府定价机制","转移支付的错误安排"],"a":[1],"e":"自动稳定器：税制和支出制度本身内嵌的“逆风向自动调节”装置——经济过热时累进税把更多收入“抽”进国库、抑制需求；衰退时税收自动下降、社保支出自动上升，托住总需求。它无需政府临时决策、反应及时，但力度有限，只能“减震”，不能“翻盘”。\n【对照】相机抉择是政府看清形势后主动踩油门或刹车（增支减税或反之）。","k":"财政的自动稳定器"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"高等教育、医疗服务等既可以由政府提供也可以由市场提供，兼具公共物品与私人物品性质。这类物品通常称为（　）。","o":["纯公共物品","准公共物品（混合物品）","纯私人物品","公共资源"],"a":[1],"e":"准公共物品介于两者之间：有一定竞争性或可排他性，但外部收益显著（教育提升国民素质、医疗维护公共卫生）。供给方式多元：政府主导＋受益者适当付费＋社会参与（如义务教育免费、高等教育收学费并补贴）。\n【谱系记忆】纯公共（国防治安）→准公共（教育医疗、收费公路）→纯私人（食品服装），越往右越该交给市场。","k":"准公共物品"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"公共财政区别于其他财政形态的基本特征是（　）。","o":["以满足社会公共需要为出发点和归宿","以盈利最大化为目标","直接参与企业日常经营","主要服务于特定利益集团"],"a":[0],"e":"公共财政的“公共性”：面向全体社会成员提供公共物品和公共服务，覆盖范围是“公共需要”领域，不以盈利为目的；同时公共财政必须是法治财政——取之于民、用之于民、受人民监督（预算经人大批准并公开）。\n【三个不对】不与民争利（退出竞争性领域）、不按身份服务（普惠）、不谋部门私利（预算约束）。","k":"公共财政的基本特征"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"近年来我国财政支出结构持续优化，其方向是（　）。","o":["压缩民生支出，扩大行政管理费","加大教育、社会保障、医疗卫生等民生领域投入","增加对竞争性领域的直接投资","扩大“三公”经费规模"],"a":[1],"e":"财政支出结构优化的主线是“保基本、补短板、惠民生”：教育、社保就业、医疗卫生、住房保障等民生支出占比持续提高，同时严控一般性支出（压缩“三公”经费），退出或减少对竞争性领域的直接干预——把有限的财政资金用在公共需要上。\n【判断技巧】凡把“民生”往下降、把“行政开支”往上提的选项，直接排除。","k":"财政支出结构"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"对财政支出项目进行绩效评价时，将项目的全部成本与预期收益进行对比以判断是否值得实施。这种方法是（　）。","o":["成本—效益分析法","因素分析法","趋势分析法","比率分析法"],"a":[0],"e":"成本—效益分析法：把项目全部成本（含社会成本）与全部效益（含社会效益）折算比较，净效益为正才可行，常用于公共基础设施等投资性支出决策。难点在于社会效益、生态效益难以货币化。绩效评价遵循结果导向：花钱必问效、无效必问责。\n【3E原则】经济性（省钱）、效率性（省时省力）、效果性（办成事）——绩效评价的三个维度。","k":"财政支出绩效评价"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"政府通过公开招标、竞争性谈判等方式向供应商购买货物、工程和服务，以提高资金使用效率、抑制腐败。这项制度是（　）。","o":["国库集中收付制度","政府采购制度","部门预算制度","分税制"],"a":[1],"e":"政府采购制度的核心是“公开、公平、公正＋竞争”：法定限额以上的采购必须依法定方式（公开招标为主）进行，用透明的竞争压价格、堵寻租，同时可以照顾中小企业、节能环保产品，发挥政策导向作用。\n【易混制度】国库集中收付管“钱怎么付”（直接从国库单一账户付到收款人，减少资金沉淀截留）；政府采购管“东西怎么买”。","k":"政府采购制度"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"财政资金由国库单一账户直接支付到商品劳务供应者或用款单位账户，避免资金层层拨付、层层沉淀。这一制度是（　）。","o":["政府采购制度","国库集中收付制度","转移支付制度","分税制"],"a":[1],"e":"国库集中收付制度改革了“层层拨付”的旧模式：所有财政资金进出都通过国库单一账户体系，工资、工程款直接付到最终收款人，中间环节只见指标不见钱——防止资金截留、挪用和“趴窝”，提高财政资金运行效率与透明度。\n【配套记忆】“预算管计划（部门预算），采购管购买，国库管支付”三件套构成财政支出管理链条。","k":"国库集中收付制度"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"瓦格纳法则揭示的规律是：随着人均收入的提高，财政支出占GDP的比重（　）。","o":["不断下降","不断上升（政府活动扩张）","保持不变","先升后永久归零"],"a":[1],"e":"瓦格纳法则（政府活动扩张法则）：经济发展、收入提高过程中，社会对公共物品与公共服务的需求增长快于私人消费（城市化、社会保障、教育、规制需求都扩张），财政支出占比呈长期上升趋势——这是各国经验数据的普遍规律。我国财政支出占GDP比重上升同样是“发展中的正常现象”，关键在结构是否合理、绩效是否高。\n【周期波动理论】皮考克-魏斯曼：危机（如战争、灾害）使支出台阶式跳升、危机后难降——“梯度渐进”说。","k":"财政支出增长理论（瓦格纳法则）"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"multi","q":"下列财政支出项目中，属于购买性支出的有（　）。","o":["行政管理费","政府投资建设高铁","机关公务员工资","财政补贴","政府债务利息支出"],"a":[0,1,2],"e":"购买性支出的判断标准是“政府花钱换回了商品、工程或劳务”：行政管理费、公共投资、公务员（政府雇员）工资、国防军费都对应真实的商品服务取得。财政补贴、债务利息是无偿单向转移、不换回对价，属于转移性支出。\n【一句话检验】“买没买到东西”：买到=购买性，白给=转移性。","k":"购买性支出与转移性支出的归类"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"衡量政府集中社会资源程度、反映宏观税负水平的主要指标是（　）。","o":["财政支出总额","财政收入（或大口径政府收入）占GDP的比重","财政赤字率","政府债务余额"],"a":[1],"e":"宏观税负＝政府收入/GDP，反映政府从经济总蛋糕中“切走”多少。小口径看一般公共预算收入，大口径还要加上政府性基金（含土地出让收入）、社保缴费、国有资本经营收入等“四本账”——大口径更能反映企业居民的真实负担。\n【政策内涵】减税降费政策的目标就是适度降低宏观税负、涵养税基、激发市场活力。","k":"财政收入规模与宏观税负"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"政府以债务人身份、按有借有还的信用原则取得财政收入的形式是（　）。","o":["税收","国债（政府债务收入）","行政事业性收费","罚没收入"],"a":[1],"e":"国债三特征：有偿性（到期还本付息）、自愿性（认购者自愿购买，与税收的强制性不同）、灵活性（发行规模时点可灵活安排）。它是弥补赤字的主要手段，也是宏观调控（公开市场操作标的）的重要工具，但借债要还，过度举债会累积债务风险、挤占未来财政空间。\n【对比记忆】“税是强制无偿，债是有偿自愿”。","k":"政府债务收入"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"国家凭借国有资产所有权取得的利润上缴、股息红利、租金等收入，称为（　）。","o":["税收收入","国有资产收益","行政收费","专项收入"],"a":[1],"e":"国有资产收益的依据是“所有权”而非“政治权力”——国家作为股东、所有者分享国有企业的经营成果（利润上缴、股利、国有产权转让收入、国有资源有偿使用收入等），主要进入国有资本经营预算。税收的依据是政治权力，两者性质不同，这也是“税利分流”改革的理论基础：国家先收税（身份是政权），再分利（身份是所有者）。","k":"国有资产收益"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"下列关于非税收入的说法，正确的是（　）。","o":["非税收入是我国财政收入的主体","非税收入具有分散性、不稳定性和一定的专用性","非税收入具有与税收相同的强制性和无偿性","罚没收入越多说明营商环境越好"],"a":[1],"e":"非税收入（行政事业性收费、罚没收入、国有资源资产有偿使用收入等）的特点：来源分散、规模不稳定、部分项目专款专用（如专项收入）。它只能是财政收入的补充，主体永远是税收（A 反了）。C 混淆概念——收费罚没或有对价或涉特定事项，其规范性要求“依法、透明、从严”。罚没收入异常增长反而反映执法逐利倾向（D），是监管要整治的对象。","k":"非税收入"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"决定一国财政收入规模的根本性因素是（　）。","o":["经济发展水平（生产发展规模与效益）","征收人员的努力程度","税率越高越好","物价上涨速度"],"a":[0],"e":"经济决定财政：经济发展水平（GDP规模与质量）决定可分配的“总蛋糕”，是财政收入规模的根本约束和源泉——所谓“经济根子决定财政票子”。分配体制与政策（宏观税负取向）、价格波动影响的是蛋糕怎么切、账面怎么算，属于次要因素。“竭泽而渔”式高税率短期增收、长期伤税基。\n【联动】拉弗曲线正是“税率—税基—税收收入”动态关系的图形化表达。","k":"影响财政收入规模的因素"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"政府性基金预算收入的突出特点是（　）。","o":["统收统支、可用于任意支出","依托特定专项收入来源，专款专用","主要来自国有企业利润上缴","主要来自个人所得税"],"a":[1],"e":"政府性基金预算“取之有据、用之有向”：每项基金对应特定的征收依据（如土地出让收入、民航发展基金、彩票公益金），收入与支出一一对应、专款专用、不能挪作他用。国有资本经营预算的收入主体才是国企上缴利润；一般公共预算以税收为主体。\n【四本预算收入速记】“公共靠税，基金靠费（专项），国资靠利，社保靠缴”。","k":"政府性基金预算"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"税制要素中，区别不同税种的主要标志、也是税收分类的基本依据的是（　）。","o":["纳税人","课税对象（征税对象）","税率","纳税期限"],"a":[1],"e":"课税对象（征税对象）回答“对什么征税”：对货物劳务征→增值税、消费税（流转税），对所得征→企业所得税、个人所得税（所得税），对财产征→房产税（财产税），对特定行为征→印花税（行为税）。税种的命名和分类都以课税对象为准。纳税人回答“向谁征”，税率回答“征多少”。\n【三要素定位】“对谁征（纳税人）、对什么征（课税对象）、征多少（税率）”。","k":"税制要素（课税对象）"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"纳税人是法律规定的直接负有纳税义务的单位和个人；实际承担税负的单位和个人称为（　）。","o":["扣缴义务人","负税人","征税主体","代征人"],"a":[1],"e":"纳税人与负税人可能一致（不可转嫁时，如个人所得税的工薪缴纳者）也可能分离（税负可转嫁时：纳税人缴税但通过提价或压价把负担推给别人，负税人是最终消费者）。扣缴义务人是依法代扣代缴的第三方（单位代扣个税），不是纳税人本身。\n【联动考点】税负能否转嫁取决于供求弹性——弹性小的一方（更“跑不掉”）承担更多税负。","k":"纳税人与负税人"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"我国增值税实行“环环征收、层层抵扣”的机制，纳税人可以抵扣进项税额、只对本环节的增值额纳税。增值税的这一特点使其具有（　）。","o":["重复征税、税负沉重","中性、避免重复征税","累进调节收入分配的作用","直接税属性"],"a":[1],"e":"增值税只对“增值部分”征税（销项−进项），同一货物无论经过多少环节，累计税负始终等于最终售价×税率，避免了传统产品税“道道征税、税上加税”的重复征税问题——这叫税收中性，不扭曲企业分工与外购决策（自己生产还是外购零部件不再受税负扭曲）。增值税属于间接税，税负最终由消费者承担。\n【身份定位】间接税管效率与收入，所得税管公平与调节。","k":"增值税的特点"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"我国对烟、酒、高档化妆品、成品油等特定消费品征收、旨在调节消费结构与引导产业方向的税种是（　）。","o":["增值税","消费税","房产税","印花税"],"a":[1],"e":"消费税的特点：①征收范围选择性——只对特定消费品（烟酒油车、高档消费、高耗能高污染产品）征收；②调节性——“寓禁于征”，抑制过度消费与负外部性；③单环节征收——一般在生产（进口）环节一次课征；④属于中央税（与增值税共享形成对比）。增值税普遍调节，消费税特殊调节，两者配合。\n【税类归属】消费税与增值税同属货物和劳务税（流转税）。","k":"消费税"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"关于起征点与免征额的区别，下列说法正确的是（　）。","o":["达到起征点的对全额征税，免征额以下的部分不征税、只对超过部分征税","两者含义相同可互换","达到免征额的对全额征税","我国个人所得税基本减除费用属于起征点"],"a":[0],"e":"起征点是“税之门”：收入达到门槛，全部收入都要计税；免征额是“税之折扣”：先扣除固定额度，只对剩余部分计税。个税每月5000元的基本减除费用（俗称“起征点”）在制度性质上是免征额——收入6000元时只对1000元计税，而不是对6000元全额计税。\n【记忆钩子】“起征点过线全征，免征额只征超出”。","k":"起征点与免征额"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"税负转嫁的难易主要取决于（　）。","o":["供求双方弹性大小的对比","纳税人是否愿意缴税","税务机关的征收力度","税率的奇偶性"],"a":[0],"e":"税负像“挤气球”：弹性小的一方被挤——需求弹性小（必需品、烟酒）时消费者跑不掉，税负容易前转给消费者；供给弹性小（土地）时税负更多由供给方承担。转嫁方式与能力归根到底由市场结构（垄断程度）和供求弹性决定。\n【应用判断】“必需品易转嫁、奢侈品难转嫁；竞争市场难转嫁、垄断市场易转嫁”。","k":"税负转嫁的影响因素"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"政府预算首先表现为财政年度内财政收支的计划安排，同时它还必须经过法定程序审查批准才能执行。这表明政府预算在本质上是（　）。","o":["政府内部的工作总结","具有法律效力的文件","企业的财务报表","银行的对账单"],"a":[1],"e":"政府预算的三重属性：年度财政收支计划（技术形式）、具有法律效力的文件（经人大批准后非经法定程序不得调整变更，违反即违法）、监督政府活动的工具（人民通过预算管住政府的“钱袋子”）。预算法确立“先有预算、后有支出、无预算不支出”的铁律。\n【年度考点】我国预算年度为公历1月1日至12月31日。","k":"政府预算的含义与属性"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"预算年度开始后、预算草案尚未经人大批准时，各级政府可以先安排的支出是（　）。","o":["任意上马新的重大项目","参照上年同期的预算支出数额安排必须支付的本年度部门基本支出、项目支出","大额举债搞形象工程","向企业预借资金"],"a":[1],"e":"预算法允许的过渡安排：预算批准前，可参照上年同期数额安排必须支付的部门基本支出、项目支出以及对下级政府的转移支付——保证政府运转不“断粮”，但仅限“必须”且待预算批准后据实列支。这是法治与效率的折中，绝不等于可以随意开支。\n【流程定位】预算批准前的支出→预算批准后按批准的预算执行。","k":"政府预算的执行"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"政府预算执行情况的年度总结，须报同级人民代表大会审查批准的文件是（　）。","o":["部门预算","决算","预算调整方案","国库年报"],"a":[1],"e":"决算是对年度预算执行最终结果的总结报告，与预算形成“批准—执行—总结—再批准”的闭环：下一年度由政府向人大报告上年度决算，人大审查批准。预算管“打算怎么花”，决算管“实际怎么花的”，两相对照才能问责。\n【口诀】“预算批一年，决算算总账”。","k":"政府决算"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"除涉及国家秘密的信息外，各级政府、各部门、各单位的预算和决算都应当向社会公开。这体现的预算原则是（　）。","o":["统一性原则","公开性原则","年度性原则","可靠性原则"],"a":[1],"e":"公开性原则：预算是人民的预算，除涉密信息外全口径、全过程公开（部门预算、“三公”经费、转移支付等都要公开），接受社会监督——阳光是最好的防腐剂。统一性是“一个口径一套科目”，年度性是“一年一编一年一批”，可靠性是“每笔数字有依据不虚列”。\n【实操体现】各级政府网站公开的“部门预算公开表”，就是公开性原则的落地面。","k":"政府预算的原则（公开性）"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"multi","q":"我国政府预算体系由下列哪些预算构成（　）。","o":["一般公共预算","政府性基金预算","国有资本经营预算","社会保险基金预算","家庭资产负债预算"],"a":[0,1,2,3],"e":"“四本预算”功能定位各异：一般公共预算（税收为主体，保民生保运转）；政府性基金预算（专项收入、专款专用，如土地出让收入）；国有资本经营预算（国企上缴利润，用于国有资本布局调整）；社会保险基金预算（社保缴费与财政补贴为来源、待遇支出为去向）。四本预算保持完整、相对独立又有机衔接（如国有资本经营预算按规定调入一般公共预算）。\n【“家庭资产负债预算”是杜撰选项，看穿即可。】","k":"政府预算体系（四本预算）"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"在四本预算中，规模最大、覆盖最广、以税收收入为主体的是（　）。","o":["一般公共预算","政府性基金预算","国有资本经营预算","社会保险基金预算"],"a":[0],"e":"一般公共预算是政府的“主体账本”：以税收收入为主体、非税收入为补充，保障教育、科技、文化、社保、医疗、国防、行政等公共支出，维持政府基本运转与公共服务供给。政府性基金预算以土地出让收入为大头（专项性强），国有资本经营预算规模相对小，社保基金预算专用于社保。\n【答题直觉】问“主体、最大、税收为主”，选一般公共预算。","k":"一般公共预算"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"财政管理体制的核心内容是（　）。","o":["政府间财政关系的安排（事权与支出责任划分、收入划分、转移支付）","企业成本核算方法","个人所得税收档次","国库现金管理操作"],"a":[0],"e":"财政管理体制处理中央与地方、地方各级政府之间的财政关系，三大支柱：①事权与支出责任划分——谁的事谁花钱、受益范围决定责任层级；②政府间收入划分——分税制按税种属性分收入；③转移支付制度——上级补下级、均衡地区财力。三者构成“分钱、分事、补钱”的完整框架。\n【改革方向】建立权责清晰、财力协调、区域均衡的中央和地方财政关系。","k":"财政管理体制的内容"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"国防、外交、国家安全等事项由中央政府承担支出责任，城市道路、社区服务等由地方政府承担。这种划分遵循的原则是（　）。","o":["按受益范围与信息优势划分事权（受益覆盖全国由中央、覆盖地方由地方）","按谁的权力大谁负责","全部由中央承担","全部由地方承担"],"a":[0],"e":"事权划分的基本逻辑：受益范围覆盖全国的全国性公共物品（国防外交）归中央；受益限于本地的（市政、社区服务）归地方；跨区域的（大江大河治理、跨省交通）为共同事权，由中央与地方按比例分担或中央补助。同时兼顾信息处理复杂度：贴近基层、信息分散的事项交给地方更有效率。\n【对应关系】“全国性的事中央办，家门口的事地方办，跨界的事商量办”。","k":"事权与支出责任划分"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"分税制财政管理体制下，按照（　）在中央与地方之间划分财政收入。","o":["企业规模","税种","地区贫富","征收人员编制"],"a":[1],"e":"分税制的“分税”即按税种属性划分收入：中央税（消费税、关税等——税基流动、宜于全国统一征收）、地方税（房产税、城镇土地使用税等——税基地域固定）、中央地方共享税（增值税、所得税等——体量大、与经济总量相关）。配套实行中央税与共享税由国家税务局系统征收（现为国家税务总局系统）、地方税由地方征管（征管体制改革后统一由税务系统征收，收入归属不变）。\n【记忆钩子】“消费关税归中央，增值税五五、所得税六四共享”。","k":"分税制"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"专项转移支付区别于一般性转移支付的最大特点是（　）。","o":["不指定用途，地方自由统筹","由上级指定用途，地方必须按规定方向使用，不得挪用","只给发达地区","由企业自愿捐赠形成"],"a":[1],"e":"专项转移支付“戴帽下达”：资金用于指定事项（义务教育、保障房、生态补偿等），专款专用、绩效导向，属于上级委托办事的资金；一般性转移支付“切块下达”，由地方统筹安排。改革方向：加大一般性转移支付比重、清理整合专项，提高地方统筹能力。\n【对比记忆】“一般性切块随便花，专项戴帽指定花”。","k":"专项转移支付"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"我国转移支付制度要解决的两个基本问题是（　）。","o":["纵向失衡与横向失衡","通胀与失业","进口与出口","储蓄与投资"],"a":[0],"e":"纵向失衡：各级政府“事权—财力”不匹配（地方事多钱少、中央钱多事少），靠纵向转移支付（中央对地方）补缺；横向失衡：地区间财力差距大（东部富、中西部穷），靠均衡性转移支付推动基本公共服务均等化。两类失衡是转移支付制度存在的根本理由。\n【评价视角】转移支付的本质是“财政资源的再配置＋区域公平的再平衡”。","k":"转移支付的作用"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"multi","q":"下列税收收入中，属于中央与地方共享收入的有（　）。","o":["增值税","企业所得税","个人所得税","消费税","关税"],"a":[0,1,2],"e":"共享收入：增值税（中央与地方五五分成）、企业所得税与个人所得税（六四分成）、证券交易印花税（现全部归中央，历史上曾共享）。消费税、关税、海关代征进口环节增值税属中央固定收入；房产税、城镇土地使用税、耕地占用税等属地方固定收入。\n【记忆钩子】“大的共享（增值五五、所得税六四），专门的归边（消费关税归中央）”。","k":"政府间收入的划分"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"下列各项中，属于财政政策工具的是（　）。","o":["预算、税收、公债、政府投资、财政补贴","法定存款准备金率、再贴现、公开市场操作","汇率、外汇储备","存款保险限额"],"a":[0],"e":"财政政策工具箱：预算（总盘子安排）、税收（调节收入与激励）、公债（融资＋调控）、政府投资与补贴（直接扩大或引导需求）、转移支付。B 是货币政策三大法宝，C 是汇率政策工具，D 是金融安全网安排——考题最爱用货币工具冒充财政工具。\n【识别口诀】“财政工具都在‘收税花钱发债’里，货币工具都在‘钱的价格与数量’里”。","k":"财政政策的工具"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"经济过热时，累进所得税使政府税收收入自动更快增长、抑制总需求。这种不需要政府主动决策即可发挥作用的机制称为（　）。","o":["相机抉择","自动稳定器","挤出效应","乘数效应"],"a":[1],"e":"自动稳定器两大支柱：累进所得税（收入涨→适用更高税率→税负更重→给需求降温）与转移支付/社保（失业多→支出自动上升→托底需求）。它随时在岗、无需开会决策，但只能减缓波动幅度，扭转趋势仍需相机抉择的主动财政政策。\n【对照记忆】“自动稳定器像安全气囊（自动弹出），相机抉择像司机踩刹车（主动操作）”。","k":"财政政策的内在稳定器"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"扩张性财政政策使政府支出增加、利率上升，从而减少私人投资和消费。这种现象称为财政政策的（　）。","o":["乘数效应","挤出效应","收入效应","替代效应"],"a":[1],"e":"挤出效应：政府大规模举债或支出推高资金需求与市场利率，私人部门的投资消费因融资成本上升而被“挤出”，部分抵消扩张政策的刺激效果。经济越接近充分就业、利率弹性越大，挤出越明显；衰退严重、利率低迷时挤出较弱、乘数较强。\n【配套考点】货币政策配合：扩张财政若配合宽松货币（利率被压住），挤出效应减弱——政策搭配的意义所在。","k":"挤出效应"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"我国实施“积极的财政政策”的政策内涵是（　）。","o":["增税减支、压缩总需求","减税降费、扩大支出、合理增加赤字与专项债，加力提效","冻结所有财政支出","提高利率抑制投资"],"a":[1],"e":"我国语境下的“积极财政政策”就是扩张性财政政策：以减税降费减轻企业与居民负担、以扩大政府支出和地方政府专项债券拉动有效投资、适度提高赤字率，同时强调“加力提效”——力度要够，花钱要有绩效。D 提高利率是紧缩性货币政策，方向相反。\n【政策搭配复盘】“积极财政＋稳健货币”“提质增效”等官方表述，考试常考内涵辨析。","k":"积极的财政政策"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"经济严重萧条时期，财政政策与货币政策的合理搭配是（　）。","o":["扩张性财政政策＋扩张性货币政策","紧缩性财政政策＋紧缩性货币政策","扩张性财政政策＋紧缩性货币政策","紧缩性财政政策＋扩张性货币政策"],"a":[0],"e":"双松搭配：财政扩大支出、货币降低利率，双管齐下提振总需求，适用于严重萧条；双紧用于严重过热。“松财政＋紧货币”：扩大需求同时防通胀资产泡沫；“紧财政＋松货币”：压政府赤字同时保市场流动性——后两种是结构权衡的搭配，用于“滞胀”或结构性矛盾。\n【记忆钩子】“病重下猛药（双松双紧），慢性病开组合方（一松一紧）”。","k":"财政政策与货币政策的搭配"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"我国弥补财政赤字的主要方式是（　）。","o":["向中央银行透支","发行国债","提高税率一次性加征","冻结公务员工资"],"a":[1],"e":"发行国债是规范的赤字弥补方式：面向社会自愿认购、有借有还，既能融资又不直接冲击基础货币。向央行透支（政府直接“印钱”花）会造成货币超发与通胀隐患，我国已明令禁止；一次性加税伤害税基与预期，不符合法治财政要求。\n【联动】赤字率（赤字/GDP）是观察财政扩张力度的核心指标，国际上常以3%作为一般性参考警戒线（非绝对红线）。","k":"财政赤字的弥补"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"multi","q":"下列措施中，属于扩张性财政政策的有（　）。","o":["减税降费","扩大政府公共投资","提高财政赤字率、增发国债","提高法定存款准备金率","降低再贴现率"],"a":[0,1,2],"e":"扩张性财政政策三板斧：减税（增收入）、扩支（增需求）、增赤字发债（保来源）。D、E 是紧缩方向相反的货币政策工具（提高准备金率收紧流动性、提高再贴现率收紧），且性质上根本不属于财政政策——本题一半考“认工具”，一半考“辨方向”。\n【快速排除法】先看是不是财政的（税、支、债），再看方向（松还是紧）。","k":"扩张性财政政策的措施"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"在其他条件不变的情况下，下列因素变动会引起商品需求减少的是（　）。","o":["消费者收入增加（正常商品）","消费者偏好增强","该商品价格上升","替代品价格上升"],"a":[2],"e":"注意题干问的是“需求减少”且选项是“该商品价格上升”——严格说，自身价格变化引起的是需求量沿曲线减少（点移动），而不是需求曲线移动，但结果方向是购买量下降，故为最佳答案。收入增加（正常品）、偏好增强、替代品涨价都会使需求增加、曲线右移。\n【概念自查】“自身价格→量的变化；其他因素→线的变化”，这一条吃透了本章一半的题。","k":"影响需求的因素"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"已知甲商品价格上升10%，乙商品需求量增加8%。甲、乙两种商品的关系是（　）。","o":["替代品（需求交叉弹性为正）","互补品（需求交叉弹性为负）","无关商品","同一商品"],"a":[0],"e":"需求交叉弹性＝乙商品需求量变动率/甲商品价格变动率＝8%/10%＝0.8＞0：甲涨价、乙需求反而增加，说明消费者从甲转向乙——两者互为替代品（如牛肉与羊肉）。交叉弹性＜0为互补品（甲涨价连累乙）；＝0为无关品。\n【记忆钩子】“一涨一多（需求）是替代，一涨一少是互补”。","k":"需求交叉弹性"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"其他条件不变时，生产技术进步、原材料价格下降，会导致该商品的（　）。","o":["供给增加，供给曲线向右移动","供给减少，供给曲线向左移动","需求增加","需求量沿曲线减少"],"a":[0],"e":"技术进步降低单位成本、原材料降价压缩成本，企业在每一价格水平上愿意供给更多——供给增加、曲线右移，均衡价格下降、均衡数量增加。影响供给的因素：成本、技术、价格预期、生产者数量、相关品价格、政策（补贴增、税负减）。\n【对照需求端】收入的变动影响需求，成本的变动影响供给——“成本动供给，收入动需求”。","k":"影响供给的因素"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"multi","q":"影响某商品需求价格弹性大小的因素包括（　）。","o":["替代品的数量与相近程度","商品用途的广泛性","商品在消费者支出中所占比重","时间长短（调整的充分程度）","生产者的技术水平"],"a":[0,1,2,3],"e":"需求价格弹性的决定因素：替代品越多越相近→弹性越大（一涨价就“跑路”）；用途越广→弹性越大（可多可少都用它）；支出占比越大→弹性越大（斤斤计较）；必需品弹性小、奢侈品弹性大；时间越长→弹性越大（消费者越有时间调整习惯）。生产者技术水平影响的是供给，与需求弹性无关。\n【应用呼应】富有弹性的商品降价增收（薄利多销），缺乏弹性的商品提价增收。","k":"需求价格弹性的影响因素","fig":"elastic"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"市场上某商品供过于求时，将会出现的情况是（　）。","o":["价格上升，供给增加、需求减少","价格下降，需求增加、供给减少，直至恢复均衡","价格不变，数量增加","政府必然立即干预"],"a":[1],"e":"供过于求→出现过剩→卖方竞相降价→买方多买、卖方少卖→过剩消除、回到均衡。市场通过价格这只“看不见的手”自动出清。均衡是动态的：任何供需变化都会打破均衡，价格波动引导其回归。\n【反向同理】供不应求→短缺→价格上升→抑制需求、刺激供给→回均衡。","k":"均衡价格的形成","fig":"ds"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"需求价格弹性的基本含义是（　）。","o":["需求量对价格变动的反应程度，等于需求量变动率与价格变动率之比","价格对需求量变动的反应程度","需求量与价格的绝对变动量之比","收入变动对需求量的影响"],"a":[0],"e":"需求价格弹性系数 Ed＝需求量变动百分比/价格变动百分比——弹性是用“相对变化率”而非绝对量定义的，这样才能跨商品、跨币种比较。|Ed|＞1富有弹性，＜1缺乏弹性，＝1单位弹性。收入变动影响需求是“需求收入弹性”，其他商品价格影响是“交叉弹性”。\n【常见错】把“价格变动1元、需求变5件”当成弹性——弹性是百分比，不是绝对量。","k":"需求价格弹性的定义","fig":"elastic"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"无差异曲线上某一点的斜率的绝对值表示（　）。","o":["边际替代率（维持效用不变，增加一单位X需要放弃的Y的数量）","商品的价格比率","消费者的收入水平","边际成本"],"a":[0],"e":"边际替代率MRS＝无差异曲线斜率的绝对值＝ΔY/ΔX：为了保持总效用不变，多要一个X愿意放弃多少Y。由于边际效用递减，MRS沿曲线不断下降——这正是无差异曲线凸向原点的原因（凸向原点＝边际替代率递减）。\n【三角联动】“边际效用递减→MRS递减→曲线凸向原点”，一串三个考点。","k":"边际替代率","fig":"indifference"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"在其他条件不变时，消费者收入增加会使预算线（　）。","o":["平行向外移动","平行向内移动","绕纵轴旋转","保持不变"],"a":[0],"e":"预算线：I＝P₁X＋P₂Y。收入增加→两轴截距同比例扩大→预算线平行外移（可买得起更多）；收入减少平行内移。只有价格变化才引起旋转：X价格下降→横轴截距外移、纵轴截距不动（绕纵轴逆时针转）。预算线内是买得起的区域，线上是花光全部收入的组合。\n【图形三问】“动的是收入（平移）还是价格（旋转）？向里还是向外？”","k":"预算线的变动","fig":"budget"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"序数效用论下，消费者均衡在图形上表现为（　）。","o":["无差异曲线与预算线的交点","无差异曲线与预算线的切点","预算线与坐标轴的交点","无差异曲线的最高点"],"a":[1],"e":"切点处：无差异曲线的斜率（MRS）＝预算线的斜率（P₁/P₂），即“愿意交换的比率＝市场允许交换的比率”，且切点是预算线上能达到的最高无差异曲线——既买得起又效用最大。交点不满足最优（还能沿预算线滑动到更高效用），预算线端点只是极端消费。\n【两种语言】基数效用论说“MU₁/P₁＝MU₂/P₂”，序数效用论画“切点”——一个结论两套表述。","k":"消费者均衡（序数效用论）","fig":"budget"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"multi","q":"关于总效用与边际效用的关系，下列说法正确的有（　）。","o":["边际效用为正时，总效用持续增加","边际效用为零时，总效用达到最大","边际效用为负时，总效用下降","总效用与边际效用没有关系","边际效用一般随消费量增加而递减"],"a":[0,1,2,4],"e":"边际效用是总效用的“增速”：MU＞0→TU还在涨（涨得越来越慢）；MU＝0→TU到顶；MU＜0→TU往下掉。所以“总效用递增、边际效用递减”可以同时成立（D 把关系说死，错）。曲线形态：TU先升后降（倒U），MU一路下降（可能穿过横轴）。\n【画图记忆】“TU是坡，MU是坡的陡度——坡还在升但越来越缓，直到平顶”。","k":"总效用与边际效用","fig":"tu-mu"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"吉芬商品的需求曲线向右上方倾斜，即价格越高购买量越多。其原因是（　）。","o":["吉芬商品是特殊低档商品，收入效应（正向）超过了替代效应（负向）","吉芬商品是高档奢侈品","消费者完全理性","供给增加导致价格上升"],"a":[0],"e":"吉芬商品：低档品中的特殊情形（如饥荒年代的土豆）——价格上升使穷人实际收入大降，被迫更多购买这种“最便宜的主食”（收入效应强烈且为正向），超过了价格上升本应引起的替代效应（转向其他食品），净结果是需求量随价格上升而增加。它是需求规律的著名例外，必须同时是低档品＋收入效应超替代效应。\n【对比记忆】正常品：两效应同向；一般低档品：反向但替代效应占优（曲线仍右下）；吉芬品：反向且收入效应占优（曲线右上）。","k":"吉芬商品"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"在其他要素投入不变、只增加一种要素投入时，当该要素的边际产量等于零时，（　）。","o":["总产量达到最大","总产量为零","平均产量达到最大","边际产量达到最大"],"a":[0],"e":"一种可变要素的产量三阶段：MP上升→MP＝AP最高点→MP＝0（TP最大）→MP＜0（TP下降）。MP＝0意味着“多投一份不再多产”，再加投入就是负作用——合理投入区域在AP最高点到MP＝0之间（第二阶段）。\n【曲线交点三姐妹】“MP穿AP于AP最高点；MP＝0时TP顶；MP先于AP、TP到顶”。","k":"一种可变要素的生产函数","fig":"tp-ap-mp"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"下列各项中，属于企业固定成本的是（　）。","o":["原材料费用","计件工资","厂房折旧与租金","燃料动力费"],"a":[2],"e":"固定成本不随产量变动：厂房设备折旧、租金、管理人员工资、保险费等——产量为零也要付。可变成本随产量增减：原材料、计件工资、燃料动力、包装费等。折旧要区分：厂房设备折旧是固定的，但按产量法计提的机器折旧则近似可变——考试一般按“与产量无关→固定”判断。\n【判断口诀】“停产了还要付的，是固定；多产多花的，是可变”。","k":"固定成本与可变成本","fig":"cost"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"在保持产量不变的前提下，增加一单位某种要素投入所需要减少的另一种要素的数量，称为（　）。","o":["边际替代率（技术替代率）","边际产量","边际成本","机会成本"],"a":[0],"e":"边际技术替代率（MRTS）是等产量曲线的斜率绝对值：L替代K的比率。由于边际报酬递减，随着越来越多地使用劳动替代资本，劳动的边际产量下降、可替代的资本越来越少——边际技术替代率递减，等产量曲线凸向原点（与无差异曲线逻辑完全平行）。\n【平行结构记忆】消费者理论（无差异曲线/MRS）↔生产者理论（等产量线/MRTS），两条线长得一模一样。","k":"边际技术替代率"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"已经支出且无法收回的成本（如专用设备投资报废损失）在进行经营决策时应当（　）。","o":["作为决策的重要依据","不予考虑（沉没成本不是成本）","全额计入未来成本","按年摊销后再决策"],"a":[1],"e":"沉没成本：过去发生、无论如何决策都收不回来的支出。理性决策只比较“未来的增量收益与增量成本”，沉没成本与未来无关——纠结沉没成本是典型的决策陷阱（“票已买了不好看也要看完”）。经济学原则：“向前看，不向后看”。\n【易混区分】机会成本（隐成本）要考虑——它是未来的放弃；沉没成本不考虑——它是过去的埋葬。","k":"沉没成本"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"multi","q":"下列成本项目中，属于企业短期可变成本的有（　）。","o":["原材料费用","计件工资","燃料动力费","厂房租金","管理人员固定工资"],"a":[0,1,2],"e":"可变成本随产量增减：原材料、计件工资、燃料动力、运输包装费等“多产多花”的项目。厂房租金、管理人员固定工资即使停产也照付，属于固定成本。\n【辨析要点】“计件”是关键词——工资是否可变取决于计酬方式：计件工资可变，固定月薪不可变。","k":"可变成本的构成","fig":"cost"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"垄断企业对同一种商品向不同购买者收取不同价格（如景区对学生半价、成人全价）。这种行为属于（　）。","o":["一级价格歧视","二级价格歧视","三级价格歧视","正常定价"],"a":[2],"e":"价格歧视三级分法：一级（完全歧视）——按每个消费者的最大支付意愿逐一定价，消费者剩余全部被剥夺（理论极端）；二级——按购买数量分段定价（批量折扣、阶梯电价），不同“量”不同价；三级——按可分割的、需求弹性不同的市场类别定价（学生票、老人票、国内国外市场差价）。题干按“人群”分价，是典型的三级价格歧视。\n【识别口诀】“一人一价是一级，按量分档是二级，按人群分市场是三级”。","k":"价格歧视"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"垄断竞争市场区别于完全竞争市场的最主要特征是（　）。","o":["产品有差别","企业数量更多","完全不能自由进出","信息完全"],"a":[0],"e":"垄断竞争＝“很多企业＋产品有差别＋自由进出”：产品差别（品牌、包装、服务、位置的差异）使每家企业对自己的“特色产品”有小小定价权（垄断性），但众多近似替代品又约束其定价（竞争性）。差别化是垄断竞争的灵魂，也是现实中最常见的市场结构（餐饮、日化、服装）。\n【市场结构定位链】完全竞争（同质+价格接受）→垄断竞争（有差别）→寡头（少数大企业）→完全垄断（独一份），垄断力量依次增强。","k":"垄断竞争市场"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"完全竞争条件下，企业实现短期均衡（利润最大化）的条件是（　）。","o":["边际收益等于边际成本（MR＝MC）","价格等于平均成本","产量越大越好","总收益最大"],"a":[0],"e":"利润最大化的通用条件 MR＝MC：再多产一单位的边际收益大于边际成本就继续增产，反之减产，均衡在两者相等处。完全竞争下P＝MR，故条件可写成P＝MC。短期中企业可能盈利也可能亏损——若P＜AVC（连可变成本都收不回），应停产（停止营业点）；P≥AVC则可继续生产弥补部分固定成本。\n【利润最大≠价格最高】企业不追求单价高、不追求产量大，追求“边际上刚刚好”。","k":"完全竞争企业的短期均衡","fig":"cost"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"multi","q":"完全垄断市场的特征包括（　）。","o":["市场上只有一个卖者","产品没有相近的替代品","存在极高的进入壁垒，其他企业无法进入","企业是价格的接受者","企业可以对不同市场实行差别定价"],"a":[0,1,2,4],"e":"完全垄断三特征＋定价权：唯一卖者、无相近替代品、进入壁垒高（资源控制、特许、专利、规模经济），企业是价格制定者而非接受者（D 是完全竞争的特征，放反了），并可能实行价格歧视增利。垄断的形成原因（自然垄断、资源独占、行政特许、专利保护）也是常考搭配。\n【反向设问警惕】“价格接受者”是这类题最高频的陷阱选项。","k":"完全垄断市场的特征"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"电网、自来水等行业的显著特点是：由一家企业经营整个市场的成本低于多家企业分别经营的成本之和。这类行业形成的垄断称为（　）。","o":["资源性垄断","自然垄断","行政性垄断","专利垄断"],"a":[1],"e":"自然垄断源于显著的规模经济（固定投入巨大、边际成本低，如电网管网铁路）：产量越大平均成本越低，多家重复建设反而浪费——天然适合“一家经营＋政府管制定价”（防止垄断高价损害消费者）。资源性垄断靠独占矿藏资源，行政性垄断靠政府特许，专利垄断靠法律保护，性质各不相同。\n【治理逻辑】“独此一家可以，但价格要管”——准入垄断与价格管制的组合拳。","k":"自然垄断"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"寡头垄断市场上，少数大企业之间可能通过协议统一价格、分配市场份额。这种做法形成的组织或行为称为（　）。","o":["完全竞争","卡特尔（公开串谋）","价格接受","倾销"],"a":[1],"e":"卡特尔：寡头企业为避免价格战而达成的公开串谋协议（统一价格、限定产量、划分市场），典型如历史上的石油输出国组织（OPEC）。串谋能把价格维持在垄断水平、共同牟利，但成员有偷偷降价的激励（背叛收益大），卡特尔天生不稳定；许多国家反垄断法禁止国内卡特尔（国际石油输出组织另论）。\n【博弈直觉】“合作最好，背叛最爽，所以长不大”——囚徒困境在市场的翻版。","k":"寡头市场的串谋（卡特尔）"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"企业对生产要素（如劳动力、机器设备）的需求，是由消费者对该要素所生产产品的需求引起的。这称为要素需求的（　）。","o":["派生需求（引致需求）","直接需求","最终需求","刚性需求"],"a":[0],"e":"派生需求（引致需求）：要素需求从产品需求“派生”出来——没人买面包，就没有人雇面包师。理解这一性质，就能推出：产品市场繁荣→要素需求增加；产品需求弹性大→要素需求弹性也大。生产要素市场与产品市场是联动的两级。\n【联合需求】要素需求还具有“联合性/共同性”——面包需要面粉、烤炉、劳动一起配合，缺一不可。","k":"生产要素需求的性质"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"在完全竞争的劳动市场上，单个企业面临的劳动供给曲线是（　）。","o":["一条水平线（按市场工资率可雇到任意数量劳动）","向右上方倾斜","向后弯曲","垂直线"],"a":[0],"e":"完全竞争要素市场：企业是要素价格的接受者，按市场既定工资率想雇多少人就雇多少人（雇佣量相对于整个市场微不足道），故其面临的要素供给曲线是水平线，均衡条件VMP＝W中的W固定。而整个市场的劳动供给曲线才向右上方倾斜（工资越高，全社会的劳动供给越多）。\n【区分主体】“单个企业看水平，整个市场看上升”——和产品市场单个企业需求曲线水平是同一个逻辑。","k":"完全竞争要素市场的均衡"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"土地的自然供给在短期内是固定不变的，因此土地的供给曲线是（　）。","o":["垂直线（供给完全不随价格变动）","水平线","向右上方倾斜","向后弯曲"],"a":[0],"e":"土地数量天然固定（“土地是老天爷给的”），无论地租多高都变不出新土地——供给曲线垂直，地租完全由需求决定：需求越大，地租越高。垂直供给曲线下征收“地租税”全部由土地所有者承担、不转嫁——这是税收归宿理论的经典应用。\n【延伸】从社会整体看土地供给垂直；但对单个农场主，土地用途可转换（种粮改种菜），其面临的土地供给仍可有弹性。","k":"土地的供给曲线与地租"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"劳动的市场需求曲线向右下方倾斜，其原因是（　）。","o":["劳动的边际产品价值随劳动投入增加而递减","工资越高劳动者越愿意工作","企业数量固定不变","产品价格随劳动增加而上升"],"a":[0],"e":"劳动需求曲线即VMP曲线：资本等要素固定时，劳动的边际产量递减（边际报酬递减规律），乘以产品价格得VMP递减——企业只在“工资＝边际产品价值”处雇佣，因此工资越低雇佣越多，曲线右下倾斜。B 说的是劳动供给端，方向对但解释的是供给曲线。\n【两条线一对因】“需求下斜因边际递减，供给上斜因劳动与闲暇的替代”。","k":"劳动的需求曲线"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"对于教育、疫苗接种等具有显著正外部性的产品或服务，政府适宜采取的政策是（　）。","o":["征收重税限制供给","给予财政补贴，鼓励其供给和消费","完全交给市场自由定价","禁止私人提供"],"a":[1],"e":"正外部性＝社会收益＞私人收益，市场自发供给量低于社会最优（学校、疫苗“生产过少”），纠正手段是补贴（学费减免、免费接种）、税收优惠，把外部收益“补”给决策者，使私人收益接近社会收益。负外部性（污染）则反向操作：征税、收费、管制。\n【对称记忆】“正外部性补起来，负外部性罚出去”。","k":"正外部性的治理"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"二手车市场上，卖方知道车的真实质量而买方不知道，导致劣质车驱逐优质车、市场萎缩。这一现象属于信息不对称引起的（　）。","o":["逆向选择","道德风险","外部经济","规模不经济"],"a":[0],"e":"逆向选择发生在交易“之前”：信息劣势方按平均质量出价→优质品退出→平均质量下降→价格更低→恶性循环，最终“劣胜优汰”（阿克洛夫柠檬市场）。道德风险发生在交易“之后”：签约后一方隐藏行动（买了保险就不小心开车）。区分口诀：“事前挑人看逆向，事后变坏看道德”。\n【治理手段】信号传递（质保、品牌）、信息甄别（检测）、政府强制信息披露。","k":"逆向选择与道德风险"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"科斯定理表明，在产权明确且交易成本较低的前提下，外部性问题（　）。","o":["只能由政府征税解决","可以通过当事人的自愿协商解决，实现资源有效配置","完全无法解决","必须通过国有化解决"],"a":[1],"e":"科斯定理的核心洞见：外部性本质是产权不清晰——只要产权界定清楚、交易成本足够小，受影响各方通过谈判（谁有权谁谈判筹码不同，但效率结果相同）就能内部化外部成本，无需政府介入。现实启示：排污权交易、明确物权界址等“产权手段”比单纯行政命令更灵活；但交易成本大（受影响者成千上万）时，政府干预仍有必要。\n【记忆钩子】“产权说清楚，市场自己谈”。","k":"科斯定理与产权"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"政府设定污染物排放总量上限，向企业发放可交易的排污许可证，治理成本低的企业减排后出售许可证获利。这种环境治理手段是（　）。","o":["排污权交易","直接行政关停","财政全额补贴治污","自愿协议"],"a":[0],"e":"排污权交易把“排放权”变成可买卖的稀缺商品：总量固定保证环境目标，价格由市场发现——减排便宜的企业多减多卖、减排贵的企业花钱买指标，全社会以最低总成本完成减排。与庇古税（按排放量征税）同为市场化环境政策工具，区别是税先定价、交易先定量。\n【国际延伸】碳交易市场（碳排放权交易）就是排污权交易思想在碳减排上的应用。","k":"排污权交易"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"草原、公海渔场等共有资源具有“非排他但竞争”的属性，人人可用、过度使用导致枯竭。这一现象被称为（　）。","o":["公地悲剧","搭便车","马太效应","示范效应"],"a":[0],"e":"公地悲剧：共有资源非排他（拦不住别人用）＋竞争性（你多用我就少得）→人人都过度使用→资源枯竭，集体理性输给个体理性。治理思路：明确产权（草场承包到户）、配额管制（休渔期、捕捞许可）、收费或社区自治规则。与纯公共物品（非排他且非竞争）区分：公地“抢得到但会抢光”。\n【四格矩阵】非排他＋非竞争＝纯公共物品；非排他＋竞争＝公共资源；排他＋非竞争＝准公共（自然垄断品）；排他＋竞争＝私人物品。","k":"公共资源与公地悲剧"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"对自然垄断行业（如电网）进行政府管制时，若按边际成本定价会导致企业亏损（因平均成本递减），常见的可行定价方式是（　）。","o":["按平均成本定价，保证企业收支相抵","完全放开由市场定价","按利润最大化定价","免费供应"],"a":[0],"e":"自然垄断平均成本递减：边际成本始终低于平均成本，按P＝MC定价价格低于平均成本→企业亏损，需财政长期补贴；折中方案是平均成本定价（P＝AC，企业保本、消费者不吃亏太多），或两部制收费（固定费＋按量费）。管制定价要在“效率（边际成本）与可持续（不亏损）”之间权衡。\n【记忆钩子】“边际成本最理想，平均成本不亏本，两部收费两头兼顾”。","k":"对自然垄断的价格管制"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"国内生产总值（GDP）是按（　）计算的一国（或地区）常住单位生产的最终产品和劳务的市场价值总和。","o":["国民原则（本国国民）","国土（地域）原则（境内生产，不论生产者国籍）","国籍原则","企业注册地原则"],"a":[1],"e":"GDP按“国土/地域”原则核算：在中国境内生产就算中国GDP，包括外资企业在华产出；GNP（现称GNI）按“国民”原则：本国国民（含在境外的）生产的算本国国民收入。外资在华利润计入我国GDP、不计入我国GNI——这就是两个指标的差异来源。\n【记忆钩子】“GDP看地盘，GNI看人头”。","k":"GDP的概念（地域原则）"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"面粉厂出售给面包房的面粉、出售给居民的面粉，在GDP核算中的处理是（　）。","o":["两次都计入GDP","卖给面包房的面粉不计入（中间产品），卖给居民的计入（最终产品）","两次都不计入","按重置价值计一次"],"a":[1],"e":"GDP只计最终产品，避免重复计算：面粉卖给面包房是中间产品（还要变成面包被再次核算），直接卖给居民消费就是最终产品。避免重复的技术是增值法：各环节只计本环节的增加值，加总等于最终产品价值。\n【易错点】同一批面粉身份不同待遇不同——“卖给的下游是谁”决定中间还是最终。","k":"最终产品与中间产品"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"用收入法核算GDP时，包括劳动者报酬、生产税净额、固定资产折旧和（　）。","o":["营业盈余","个人储蓄","政府转移支付","进口总额"],"a":[0],"e":"收入法把GDP按要素与政府的“分蛋糕”加总：劳动者报酬（工资奖金社保）＋生产税净额（生产税−补贴）＋固定资产折旧＋营业盈余（企业利润）＝GDP。四大项对应“挣的钱、交的税、磨的旧、赚的利”。与支出法（C+I+G+NX）、生产法（各行业增加值）三法殊途同归。\n【对比记忆】支出法看“钱花到哪”，收入法看“钱被谁挣走”。","k":"GDP的收入法核算"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"在只有家庭和企业的两部门经济中，国民收入恒等式表现为（　）。","o":["投资等于储蓄（I＝S）","消费等于储蓄","税收等于政府购买","出口等于进口"],"a":[0],"e":"两部门（家庭＋企业）：总收入＝消费＋储蓄，总支出＝消费＋投资，收支相等推出I＝S——储蓄是投资的资金来源，这是宏观恒等式家族的起点。三部门加入政府：I＝S＋(T−G)（私人储蓄＋政府净收入支撑投资）；四部门再加净出口：I＝S＋(T−G)＋(M−X)。\n【记忆链】“两部门I＝S，三部门加政府，四部门加外贸”。","k":"储蓄—投资恒等式"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"线性消费函数为C＝a＋bY（a为自发消费，b为边际消费倾向）。随着收入增加，平均消费倾向（APC＝C/Y）将（　）。","o":["不断下降","不断上升","保持不变","等于边际消费倾向"],"a":[0],"e":"APC＝C/Y＝a/Y＋b：收入Y越大，a/Y越小，APC越接近并永远高于b（MPC）。含义：越富的家庭收入中消费占比越低、储蓄占比越高——凯恩斯消费函数的核心结论，也是“刺激消费要盯中低收入群体”的学理依据。\n【两条曲线关系】“APC＞MPC，且APC随收入下降、逐渐靠近MPC”。","k":"消费函数与消费倾向"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"边际消费倾向为0.75时，边际储蓄倾向为（　）。","o":["0.25","0.75","1","4"],"a":[0],"e":"收入要么消费要么储蓄：MPC＋MPS＝1，故MPS＝1−0.75＝0.25。延伸：投资乘数k＝1/MPS＝1/0.25＝4——储蓄倾向越高、乘数越小，扩张政策的效果越弱。\n【成对换算】知道MPC就知道了MPS和乘数（k＝1/(1−MPC)），一组数字通吃三种题。","k":"边际消费倾向与边际储蓄倾向"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"multi","q":"下列各项中，应计入当年GDP的有（　）。","o":["当年生产并销售的汽车","家政公司提供的当年保洁服务","去年生产、今年售出的存货","买卖二手房的佣金（当年提供的中介服务）","二手房本身的价值"],"a":[0,1,3],"e":"GDP计“当年生产的新价值”：当年生产的汽车（C）、当年提供的保洁服务（服务也是产出）、二手房交易的佣金（中介服务是当年新提供的服务）都计入。去年造的存货不是今年生产（去年已计入），二手房子本身只是产权转移、不是当年生产——都不重复计入。\n【判断口诀】“是不是今年新造的（含服务）；中介费是服务要算，旧货本身不算”。","k":"GDP的核算范围"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"经济增长率扣除资本增长贡献和劳动增长贡献后的剩余部分，通常被解释为（　）的贡献。","o":["技术进步（全要素生产率）","人口增长","通货膨胀","汇率变动"],"a":[0],"e":"增长核算（索洛余值法）：产出增长＝资本贡献（α·ΔK/K）＋劳动贡献（β·ΔL/L）＋技术进步率（索洛余值）。余值——增长中“要素投入解释不了的部分”——归功于技术进步与效率提升（全要素生产率TFP）。它告诉我们：靠堆要素的增长有极限，靠科技与效率的增长才有后劲。\n【政策语言】“从要素驱动转向创新驱动”＝提高TFP贡献率。","k":"增长核算与全要素生产率"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"联合国开发计划署的人类发展指数（HDI）综合衡量发展的三个维度是（　）。","o":["预期寿命（健康）、受教育程度（教育）、人均收入（体面的生活水平）","GDP总量、军费、人口","外汇储备、贸易额、通胀率","城市化率、工业化率、信息化率"],"a":[0],"e":"HDI用三个维度纠正“唯GDP”的发展观：健康（出生预期寿命）、教育（入学年限与预期在校年限）、体面生活（人均国民收入）。它体现发展经济学的基本立场：发展≠增长，发展还包括结构优化、能力提升、福利改善。\n【辨析】“有增长无发展”指GDP涨了但结构恶化、贫富分化、环境破坏——增长是必要条件，不是充分条件。","k":"经济发展（人类发展指数）"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"既满足当代人的需要，又不损害后代人满足其需要能力的发展，称为（　）。","o":["可持续发展","粗放型增长","进口替代","出口导向"],"a":[0],"e":"可持续发展的核心是代际公平：今天的增长不能透支资源环境（后代的发展本钱），内涵包括经济可持续、社会可持续、生态可持续三维。与之配套的政策：绿色低碳转型、资源节约与循环利用、生态补偿制度。“绿水青山就是金山银山”正是可持续发展理念的中国表达。\n【对照】粗放型增长靠高投入高消耗，与可持续方向相反。","k":"可持续发展"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"在经济周期的度量中，如果经济总量的绝对值出现下降（GDP负增长），这种周期称为（　）。","o":["增长型周期","古典型周期","长周期","季节波动"],"a":[1],"e":"按波动形态分：古典型周期——经济总量绝对水平下降（负增长、真正“衰退”）；增长型周期——总量还在增长、只是增长率高低起伏（增速换挡）。现代经济多以增长型周期为主，古典型衰退多伴随重大危机。划分周期的“谷谷”或“峰峰”间隔即周期长度（短周期3~4年、中周期8年、长周期50~60年）。\n【判断口诀】“绝对量降是古典，增速降是增长型”。","k":"经济周期的类型"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"multi","q":"下列关于经济增长与经济发展关系的说法，正确的有（　）。","o":["经济增长是经济发展的基础和前提","经济发展包含经济增长，还包括结构优化、福利改善等更丰富内涵","有经济增长必然有经济发展","经济发展可以用人类发展指数等综合指标衡量","高质量增长强调效率、结构与可持续性"],"a":[0,1,3,4],"e":"增长是发展的必要条件而非充分条件（C 错——可能是“有增长无发展”：单纯堆要素、结构恶化、成果分配不均）。发展＝增长＋结构升级＋制度进步＋福利与环境改善，用HDI等综合指标衡量；高质量发展正是对“发展内涵”的政策化表达：创新驱动、协调平衡、绿色低碳、开放合作、共享普惠。\n【答题直觉】“把增长和发展画等号的选项，一律错”。","k":"经济增长与经济发展的关系"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"我国衡量价格总水平变动最常用的指标是（　）。","o":["居民消费价格指数（CPI）","生产者价格指数（PPI）","GDP缩减指数","恩格尔系数"],"a":[0],"e":"CPI反映居民购买消费品和服务价格的总变动，与民生直接相关，是国际上度量通货膨胀最常用指标（我国把3%左右作为年度调控参考目标之一）。PPI反映工业品出厂价格（偏上游、领先指标）；GDP缩减指数覆盖全部最终产品但季度才出、时效差；恩格尔系数（食品支出占比）衡量生活水平，不是价格指数。\n【联动解读】PPI向CPI传导、剪刀差，都是政策分析常用语。","k":"价格总水平的度量（CPI）"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"失业率的计算公式是（　）。","o":["失业人数÷劳动力总数（就业人数＋失业人数）×100%","失业人数÷总人口×100%","失业人数÷就业人数×100%","（总人口−就业人数）÷总人口×100%"],"a":[0],"e":"失业率＝失业人数/劳动力总数，劳动力＝就业者＋失业者（16岁以上、有劳动能力、正在找工作的人口）。分母不是总人口——家庭主妇、在校学生、退休者、丧失劳动能力者不属于劳动力；想工作但已放弃找工作的“灰心丧气的劳动者”被计入“退出劳动力市场”，这正是统计失业率低估实际失业的原因。\n【配套指标】劳动参与率＝劳动力/适龄人口。","k":"失业率"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"奥肯定律描述的关系是（　）。","o":["失业率与产出缺口反向变动（失业率每高于自然失业率1个百分点，实际GDP低于潜在GDP约2%）","税率与税收收入的关系","失业与通货膨胀的替代关系","收入与消费的关系"],"a":[0],"e":"奥肯定律：失业率的变动与GDP增长缺口负相关——失业多1个点，产出损失约2个点，说明“失业的宏观代价巨大”，为政府稳定就业提供量化依据。注意区分：奥肯定律管“失业—产出”，菲利普斯曲线管“失业—通胀”，拉弗曲线管“税率—税收”，别记串。\n【政策含义】保就业就是保增长，稳就业政策有宏观效率依据。","k":"奥肯定律"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"菲利普斯曲线最初揭示的是失业率与（　）之间此消彼长的关系。","o":["货币工资增长率（后扩展为通货膨胀率）","利率水平","财政赤字率","汇率水平"],"a":[0],"e":"菲利普斯曲线（菲利普斯，英国数据）：失业率与货币工资增长率负相关；萨缪尔森等将其扩展为失业率与通货膨胀率的替代关系——低失业伴随高通胀、高失业伴随低通胀，政策上面临“两难取舍”。短期存在替代关系，长期中预期调整后曲线趋于垂直（长期不存在替代）——理性预期学派的修正。\n【联动】这一“短期替代、长期消失”的结论是理解货币政策规则之争的钥匙。","k":"菲利普斯曲线","fig":"phillips"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"发生通货膨胀时，从固定利率债权债务关系看，通常（　）。","o":["债务人受益、债权人受损","债权人受益、债务人受损","双方都不受影响","银行必然破产"],"a":[0],"e":"未预期的通胀使货币购买力下降：债务人还的钱“缩水”，实际债务负担减轻——受益；债权人收回的钱买不到原来那么多东西——受损。同理，固定收入者（退休金、工薪）受损，持有实物资产与涨价资产者相对受益。\n【反向操作】通胀预期下“长期固定利率债务受欢迎、浮动利率资产受欢迎”——利率会被通胀预期推高。","k":"通货膨胀的再分配效应"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"月通货膨胀率超过50%的极端通货膨胀，称为（　）。","o":["温和通货膨胀","奔腾式通货膨胀","恶性（超级
