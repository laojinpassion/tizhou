）通货膨胀","隐蔽型通货膨胀"],"a":[2],"e":"按程度分：温和（爬行式）通胀——年率较低（一般低于10%），对经济危害有限甚至润滑交易；奔腾式——两位数急速上涨，扰乱经济秩序；恶性（超级）通胀——月率超50%（物价一年涨千倍量级），货币体系崩溃（历史案例：魏玛德国、津巴布韦）。按是否显现：公开型（物价明涨）与隐蔽型（有价无货、排队配给）。\n【治理共识】恶性通胀的唯一出路是财政货币“双紧”＋币制改革＋恢复财政纪律。","k":"通货膨胀的类型（按程度）"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"亚当·斯密的绝对优势理论认为，国际贸易的基础是（　）。","o":["各国在不同产品上的绝对劳动成本差异","各国的要素禀赋差异","规模经济","各国需求偏好差异"],"a":[0],"e":"绝对优势理论（斯密《国富论》）：各国按绝对劳动成本最低的产品分工生产并交换，双方获利。局限：若一国在所有产品上都处于绝对劣势，贸易似乎无法发生——李嘉图用比较优势理论修补了这个漏洞（机会成本差异决定分工）。要素禀赋理论（赫克歇尔-俄林）解释比较优势的来源（资源禀赋），规模经济理论（克鲁格曼）解释发达国家的产业内贸易。\n【理论演进线】绝对优势→比较优势→要素禀赋→规模经济，一个比一个精细。","k":"绝对优势理论"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"赫克歇尔-俄林的要素禀赋理论认为，一国应当出口（　）。","o":["密集使用本国相对丰裕要素生产的产品","本国绝对成本最低的产品","本国稀缺资源生产的产品","所有本国能生产的产品"],"a":[0],"e":"要素禀赋理论（H-O理论）回答了“比较优势从哪来”：各国要素存量不同（劳动力丰富的国家、资本丰富的国家），出口密集使用本国丰裕要素的产品、进口密集使用本国稀缺要素的产品——劳动丰富的国家出口服装，资本丰富的国家出口机器。\n【记忆钩子】“有什么多就卖什么多的”。","k":"要素禀赋理论"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"解释发达国家之间、相似产品之间大量贸易（产业内贸易）的理论是（　）。","o":["绝对优势理论","规模经济贸易理论（克鲁格曼）","重商主义","要素禀赋理论"],"a":[1],"e":"规模经济贸易理论（新贸易理论，克鲁格曼）：即使两国要素禀赋、技术相近，分工与规模经济仍带来贸易利益——大规模专业化生产降低平均成本，消费者同时享受“便宜＋多样”（德国出口汽车给美国，美国也出口汽车给德国）。它解释了战后发达国家间贸易比重上升的现象，是传统比较优势理论覆盖不到的盲区。\n【对照传统】要素禀赋解释“南北贸易”（发达国家与发展中国家），规模经济解释“北北贸易”（发达国家之间）。","k":"规模经济贸易理论"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"征收进口关税的福利效应表现为（　）。","o":["消费者受损、生产者受益、政府获得关税收入，社会整体出现净损失","全社会都受益","只有消费者受益","只影响出口国利益"],"a":[0],"e":"关税抬高了国内价格：消费者支付更多（消费者剩余减少，且损失最大）；国内生产者获得保护、扩大生产（生产者剩余增加）；政府获得关税收入；但“保护低效率生产＋抑制消费”造成无谓损失（净福利为负）。此外还引发贸易伙伴报复、资源配置扭曲。\n【政策现实】关税是“保护少数、摊薄到多数人头上”的隐形税——每个人多掏一点，养活一个低效行业。","k":"关税的效应"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"一国企业以低于正常价值的价格向另一国出口产品，并对进口国同类产业造成实质损害。这种行为称为（　）。","o":["倾销","补贴","走私","转口贸易"],"a":[0],"e":"倾销：出口价格低于“正常价值”（出口国国内价格或成本加合理利润），损害进口国产业，进口国可依WTO规则征收反倾销税（税率不超过倾销幅度）。认定要件：低价＋损害＋因果关系。反补贴针对的是政府补贴出口；走私是逃避监管的非法行为；转口贸易是正常贸易方式。\n【公平与否的争辩】“低于成本卖”是掠夺性倾销还是正常促销，实务中认定复杂，但考试按规则答案走。","k":"倾销与反倾销"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"世界贸易组织（WTO）的最惠国待遇原则要求（　）。","o":["一成员给任何一国的优惠，无条件给予所有成员","只给最友好的国家优惠","对发展中国家不适用","只适用于服务贸易"],"a":[0],"e":"WTO两大基石原则：最惠国待遇（MFN）——给你给我的任何一个伙伴的最好待遇，就自动给我（成员之间“一视同仁”，不允许选择性优惠）；国民待遇——进口产品在国内税费与法规上享受不低于本国同类产品的待遇（“进了国门就是自己人”）。例外：自由贸易区/关税同盟的内部优惠、对发展中国家的特殊差别待遇、安全例外等。\n【记忆钩子】“最惠国：一碗水端平；国民待遇：进门同待遇”。","k":"WTO的基本原则"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"multi","q":"下列措施中，属于非关税壁垒的有（　）。","o":["进口配额","进口许可证制度","苛刻的技术标准与卫生检疫要求","歧视性政府采购","降低进口关税"],"a":[0,1,2,3],"e":"非关税壁垒名目繁多：数量限制类（配额、许可证）、技术类（技术标准、认证、卫生检疫——SPS/TBT）、行政类（歧视性政府采购、海关程序刁难）、外汇管制等。降低关税是贸易自由化措施，方向恰好相反。\n【趋势判断】当代贸易摩擦更多采用非关税手段（更隐蔽、更灵活），技术标准是重灾区——“标准即壁垒”。","k":"非关税壁垒的种类"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"《区域全面经济伙伴关系协定》（RCEP）的重要意义在于（　）。","o":["它是目前全球参与人口最多、经贸规模最大、最具发展潜力的自由贸易区","它是全球最高的关税同盟","它取代了世界贸易组织","它只涉及金融服务开放"],"a":[0],"e":"RCEP由东盟十国发起，中国、日本、韩国、澳大利亚、新西兰共同参与，2022年生效——覆盖全球约三成人口、经济总量与贸易额，是全球规模最大的自贸协定。核心内容：货物贸易最终零关税比例高、原产地累积规则（区域价值成分累积计算，便利产业链布局）、服务与投资开放、电子商务等新规则。\n【战略意义】首次以自贸协定纽带连接中日两大经济体，深化亚太产业链合作。","k":"区域经济合作（RCEP）"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"长期平均成本曲线呈U形的原因是（　）。","o":["先出现规模经济、后出现规模不经济","边际效用递减","供求关系波动","价格管制"],"a":[0],"e":"长期中企业可自由调整规模：规模较小时扩大规模带来专业化分工、大型设备等规模经济，平均成本下降；规模过大后管理层次膨胀、协调困难，出现规模不经济，平均成本上升——长期平均成本曲线因此呈U形，最低点对应最优规模。短期U形则源于边际报酬先增后减（可变要素与固定要素配比失衡）。\n【对位记忆】“短期U形看边际报酬，长期U形看规模经济”。","k":"长期平均成本曲线"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"与完全竞争相比，垄断市场的效率损失表现为（　）。","o":["价格高于边际成本，产量低于社会最优水平，产生无谓损失","产量高于社会最优水平","价格等于边际成本","消费者剩余增加"],"a":[0],"e":"垄断企业按MR＝MC定产、按需求曲线定价，导致P＞MC：一部分愿意按边际成本购买的消费者买不到，交易减少；已成交部分价格虚高、消费者剩余被转移；加上“高价格抑制交易”形成的无谓损失——社会福利净减少。这也是反垄断政策的经济依据（拆分、管制、引入竞争）。\n【对照】完全竞争P＝MC，资源配置帕累托效率；垄断P＞MC，价格“失真”。","k":"垄断的效率损失"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"工资率上升产生的“替代效应”是指（　）。","o":["闲暇的机会成本上升，劳动者减少闲暇、增加劳动供给","劳动者收入提高后多买闲暇、减少劳动","企业用机器替代劳动","劳动者换雇主"],"a":[0],"e":"工资上升对劳动供给有双向作用：替代效应——闲暇的机会成本（少工作损失的收入）变贵，人们用工作替代闲暇，劳动供给增加；收入效应——钱多了“买得起”闲暇，减少劳动。两效应反向拉扯，替代效应占优时供给曲线右上（劳动力市场常见区间），收入效应占优时向后弯（高工资段）。\n【对称记忆】对劳动者：工资是工作的报酬、也是闲暇的价格。","k":"工资变化的替代效应与收入效应"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"资本这种生产要素提供服务的价格，通常表现为（　）。","o":["利率（利息）","工资","地租","利润"],"a":[0],"e":"要素服务价格各归其位：劳动→工资，资本→利息（利率），土地→地租，企业家才能→利润。资本需求曲线（利率越低投资越多）与资本供给（储蓄）共同决定均衡利率。理解这个对应关系，货币政策（利率）与实体经济投资的分析就打通了。\n【判断口诀】“给劳动的叫工资，借资本付利息，租土地交地租，剩下的归利润”。","k":"资本的价格"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"政府规定的最低工资标准高于市场均衡工资率时，可能出现的后果是（　）。","o":["劳动需求量减少、供给量增加，出现失业（劳动力过剩）","就业自动增加","工资下降回均衡","劳动供给减少"],"a":[0],"e":"最低工资是劳动力市场上的“保护价格”（高于均衡价）：企业按更高工资只愿雇佣较少人，求职者却增多，差额就是失业。它保护了在岗者，但可能伤及最弱势的低技能劳动者。现实政策需要权衡：适度标准的最低工资对就业影响有限，且能改善收入分配；定得过高则副作用明显。\n【对照保护价格】农产品保护价→过剩由政府收购；最低工资→“过剩”是失业，政府收不了人，所以争议更大。","k":"最低工资与劳动力市场"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"根据外部性理论，对产生负外部性的经济活动按外部成本大小征收的矫正性税收称为（　）。","o":["庇古税","拉弗税","关税","个人所得税"],"a":[0],"e":"庇古税：按“外部成本内部化”的思路征税——税率=边际外部成本，让排污者自己承担社会代价，产量回落到社会最优。对正外部性则给予等额补贴（庇古补贴）。它是环境税费（排污费、环保税、碳税）的理论原型。\n【对比科斯】庇古走“政府定价”路线，科斯走“界定产权、市场谈判”路线——两套药方对应不同交易成本条件。","k":"庇古税"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"治理信息不对称问题，政府可采取的措施不包括（　）。","o":["强制信息披露","质量认证与标准管理","建立信誉与信用体系","禁止市场交易"],"a":[3],"e":"信息不对称的治理工具箱：强制披露（食品配料表、财报审计）、认证与许可（3C认证、执业资格）、声誉机制（信用评级、平台评价）、担保与售后承诺。全面禁止交易是极端手段，会同时消灭交易的收益，通常不是合理选择——监管的目标是“让信息流动起来”，而不是“让市场关门”。\n【市场自发解决】品牌、质保、连锁经营本身就是企业自建的“信誉抵押品”。","k":"信息不对称的治理"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"剔除价格变动因素、按不变价格计算的GDP称为（　）。","o":["名义GDP","实际GDP","潜在GDP","人均GDP"],"a":[1],"e":"实际GDP＝按基期不变价格计算的GDP，剔除了物价上涨的“水分”，反映真实产出变化；名义GDP按当期价格计算，包含价格因素。两者之比即GDP缩减指数（平减指数），也是测算通货膨胀的宽口径指标。报告“经济增长6.5%”通常指实际GDP增速。\n【判断口诀】“看增长用实际，看现值用名义；实际＝名义÷价格指数”。","k":"名义GDP与实际GDP"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"主要依靠增加生产要素投入数量来实现增长的方式，称为（　）。","o":["集约型增长","粗放型增长","内涵式增长","创新型增长"],"a":[1],"e":"粗放型（外延式）增长：靠多投入劳动力、资本、资源“堆”产量，边际效益递减、资源环境代价大；集约型（内涵式）增长：靠技术进步、管理改善、劳动者素质提高提高要素使用效率。增长方式转变的核心是提高全要素生产率贡献——创新驱动、质量第一。\n【判断标志】“堆数量、拼资源”是粗放，“提效率、上技术”是集约。","k":"经济增长方式的类型"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"发展中国家普遍存在传统农业部门与现代工业部门并存的二元经济结构。刘易斯模型认为，经济发展的过程是（　）。","o":["农业剩余劳动力向现代工业部门转移，直至二元结构转化为一元","工业劳动力回流农业","农业部门自动消失","两个部门互不相干"],"a":[0],"e":"刘易斯二元经济模型：传统农业部门存在大量边际产出接近零的剩余劳动力，现代工业部门以略高于农业收入的工资吸收劳动力，直至剩余劳动力被吸纳完毕（刘易斯转折点），工资开始上涨、两部门融合——这解释了发展中国家“廉价劳动力红利”及其消失。中国经济发展常引用该模型解释“民工潮”与“招工难”的转换。\n【结构含义】二元结构是发展中国家的典型特征，城镇化、工业化就是消解二元结构的过程。","k":"二元经济结构（刘易斯模型）"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"库兹涅茨曲线描述的收入分配随经济发展的变化规律是（　）。","o":["先扩大后缩小（呈倒U形）","一直扩大","一直缩小","保持不变"],"a":[0],"e":"库兹涅茨“倒U假说”：发展初期，工业化、城市化使收入差距扩大（部门间、城乡间、技能间差异拉大）；发展成熟后，劳动力转移完成、教育与再分配制度完善，差距重新收敛。经验检验分歧较大（部分国家长期未收敛），但“发展不能听任分化——需要主动的分配调节”的政策含义清晰。\n【同类曲线】环境库兹涅茨曲线（污染随发展先升后降），逻辑同源、别记混主题。","k":"库兹涅茨曲线"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"充分就业状态下仍然存在的失业（摩擦性失业与结构性失业之和）对应的失业率称为（　）。","o":["自然失业率","周期性失业率","零失业率","登记失业率"],"a":[0],"e":"自然失业率＝摩擦性＋结构性失业占劳动力的比重：即使总供求平衡、经济“充分就业”，换工作、技能错配仍会造成一定失业，所以充分就业≠零失业。超过自然失业率的部分才是周期性失业，需要总需求政策治理；摩擦性与结构性失业靠劳动力市场建设（信息平台、职业培训）。\n【政策口诀】“需求政策治周期，供给政策治自然”。","k":"自然失业率"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"编制居民消费价格指数（CPI）时，调查的内容是（　）。","o":["居民消费的一篮子商品和服务的价格变动（含食品烟酒、衣着、居住、生活用品、交通通信、教育文化、医疗保健、其他等大类）","全部工业品出厂价格","股票价格指数","农产品收购价格"],"a":[0],"e":"CPI按“一篮子”消费品和服务编制：我国CPI覆盖八大类——食品烟酒、衣着、居住、生活用品及服务、交通和通信、教育文化娱乐、医疗保健、其他用品及服务，按居民消费支出结构确定权重并定期更新。食品（尤其猪肉）权重影响大，故有“猪周期扰动CPI”的说法；居住类含房租不含房价。\n【区分】工业品出厂价格是PPI的篮子，两者口径不同。","k":"CPI的构成"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"国防、治安等纯公共物品通常由政府免费提供，其原因是（　）。","o":["无法向受益者分别收费（非排他性），市场无法有效供给","政府提供一定更便宜","法律禁止私人生产任何公共物品","消费者不需要这类物品"],"a":[0],"e":"纯公共物品非排他＋非竞争，无法对使用者分别收费、收费成本极高，市场价格机制失灵；其成本只能通过税收等强制性方式筹集、由政府统一提供并免费享用。注意“免费提供”指的是消费端不收费，资源成本仍在（税收支付）——“天下没有免费的公共物品，只有看不见的税单”。\n【准公共物品对照】教育医疗可部分收费（受益者负担）＋政府补贴，供给方式更灵活。","k":"纯公共物品的提供方式"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"财政支出绩效评价遵循的“3E”原则是指（　）。","o":["经济性、效率性、效果性","公平性、公开性、公正性","强制性、无偿性、固定性","计划、执行、检查"],"a":[0],"e":"3E原则：经济性（Economy——花得省，成本最小化）、效率性（Efficiency——花得快，投入产出比）、效果性（Effectiveness——花得值，目标达成度）。后扩展出“5E”（加环境性Equity/Environment、公平性）。“花钱必问效、无效必问责”是预算绩效管理的总要求。\n【记忆钩子】“省钱、省事、办成事”。","k":"财政支出绩效评价（3E原则）"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"税收成为财政收入最主要形式的原因不包括（　）。","o":["来源广泛、稳定可靠","强制无偿、规范法治","依据国家政治权力征收","完全由纳税人自愿决定缴纳多少"],"a":[3],"e":"税收的优越性：以政治权力为后盾（强制性）、无需偿还付息（无偿性）、依法定标准征收（固定性/规范性），因此来源广泛、及时、稳定——天然适合充当财政的“主粮”。自愿性是国债和捐赠的特征，恰恰是税收所不具备的。\n【三性连锁】强制→无偿→固定，三者互为支撑，共同区别于收费、国债、罚没等其他收入形式。","k":"税收的特征（ again 强化）"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"按照税收与价格的关系分类，增值税（一般计税方法）属于（　）。","o":["价内税","价外税（税额在价格之外单独列明）","直接税","财产税"],"a":[1],"e":"价外税：税款不包含在商品价格内、单独列示（增值税专用发票上“金额＋税额”分列），消费者看得见税；价内税：税款含在价格里（消费税、关税），消费者只看到总价。间接税/直接税按“能否转嫁”分，增值税是间接税；按计税依据分还有从价税、从量税（车船税按辆、啤酒从量）。\n【三个分类维度】“价格内外、能否转嫁、计量方式”，一套税三种身份。","k":"税收的分类（价内税与价外税）"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"我国《预算法》确立的预算管理基本规则是（　）。","o":["先有预算、后有支出；各级预算须经本级人大批准，未经法定程序不得调整","先花钱后补预算","政府可自行决定收支","预算只对内不公开"],"a":[0],"e":"预算法治的铁律：无预算不支出、先批准后执行；预算执行中确需调整的，必须编制预算调整方案报本级人大常委会审查批准；决算接受人大审批与审计监督。目的是把政府收支关进“制度的笼子”。\n【配套时间线】人大批准预算→执行→决算→审计→公开，一个年度闭环。","k":"预算法治"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"中央预算草案由（　）编制、提请全国人民代表大会审查批准。","o":["国务院","财政部独立决定","审计署","中国人民银行"],"a":[0],"e":"预算编制主体：国务院编制中央预算草案（具体由财政部门汇总），报全国人大审查批准；地方各级预算由本级政府编制、本级人大批准。人大是预算的“批准机关”，财政部门是“编制与执行的具体经办机关”，审计机关事后监督——分工明确。\n【易混点】“财政部编制、国务院提请、人大批准”是一条流水线，别把角色张冠李戴。","k":"预算的编制与审批主体"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"我国现行财政管理体制的类型是（　）。","o":["分税制基础上的分级财政管理体制","统收统支体制","财政包干体制","单一税制体制"],"a":[0],"e":"我国1994年分税制改革确立了“分税制＋分级财政”体制：中央与地方按税种划分收入、分级编制预算、分级承担支出责任，并配套转移支付制度均衡地区财力。此前经历统收统支（计划经济时期）、财政包干（80年代“分灶吃饭”）等阶段——包干制导致“两个比重”（财政收入占GDP、中央收入占比）下滑，才有了分税制改革。\n【历史坐标】1994分税制是理解现行央地财政关系的起点。","k":"我国财政管理体制的类型"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"按财政政策调节经济周期的作用方式划分，可分为（　）。","o":["自动稳定的财政政策和相机抉择的财政政策","中央财政政策和地方财政政策","税收政策和货币政策","长期政策和五年规划"],"a":[0],"e":"两大类：自动稳定器——制度内嵌、自动发挥（累进税、社保）；相机抉择——政府审时度势主动出手（增支减税或紧缩）。另有按松紧方向分为扩张性、紧缩性、中性（稳健）政策；按作用空间分为总量政策与结构性政策（减税定向行业、专项债投向）。\n【两个分类维度】“怎么发挥作用（自动/相机）＋往哪个方向使劲（松/紧）”。","k":"财政政策的分类"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"根据消费者权益保护法，对侵害众多消费者合法权益的行为，可以提起公益诉讼的主体是（　）。","o":["中国消费者协会以及在省、自治区、直辖市设立的消费者协会","任何单个消费者","新闻媒体","行业协会"],"a":[0],"e":"消费者公益诉讼：对侵害众多不特定消费者合法权益、损害社会公共利益的行为，中消协和省级消协可以向人民法院提起诉讼——让“维权成本高、单个不值得告”的群体性侵害有制度出口。单个消费者的私益诉讼照常进行；新闻媒体有舆论监督权但无诉讼主体资格。\n【同族制度】检察机关公益诉讼、环境公益诉讼，共同构成公益诉讼体系。","k":"消费者公益诉讼"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"消费者效用最大化时选择商品组合，当商品X的价格下降而其他条件不变时，预算线与无差异曲线形成新的切点。这一比较静态分析的结论是（　）。","o":["价格变化引起消费者均衡点移动，可由不同价格下的均衡点推导出个人需求曲线","需求曲线与均衡无关","收入变化不影响均衡点","效用与价格始终无关"],"a":[0],"e":"价格—消费曲线（PCC）：让X的价格连续变化，把每一价格下的消费者均衡点（预算线与无差异曲线的切点）连起来，再转换到“价格—数量”坐标系，就得到该消费者的需求曲线——这正是序数效用论对需求规律的微观推导。同理，收入—消费曲线（ICC）推导恩格尔曲线。\n【理论闭环】“需求为什么向右下倾斜？”——边际效用递减/替代与收入效应给了答案，PCC给出了图形推导。","k":"消费者均衡与需求曲线的推导","fig":"indifference"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"按照税收负担能否转嫁分类，个人所得税、企业所得税属于（　）。","o":["间接税（税负易转嫁）","直接税（税负不易转嫁，由纳税人直接承担）","从量税","中央税"],"a":[1],"e":"直接税：纳税人与负税人基本一致、税负难转嫁——个人所得税、企业所得税、房产税、车船税；间接税：税负可转嫁给最终消费者——增值税、消费税、关税。直接税直接“摸收入与财产”，调节分配功能强；间接税征收效率高但具有累退性（低收入者负担相对重）。\n【结构取舍】现代税制“间接税保收入、直接税调分配”，我国正逐步提高直接税比重。","k":"直接税与间接税"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"政府间财政关系中，“地方的事权所需财力不足、中央财力相对集中”形成的纵向财力缺口，主要通过（　）弥补。","o":["中央对地方的转移支付","地方自行发行货币","取消地方事权","提高地方关税"],"a":[0],"e":"分税制下收入相对向中央集中、大量事权由地方承担，形成纵向财政失衡——转移支付（含税收返还、一般性与专项转移支付）就是把中央集中的财力“回流”给地方的制度管道。地方无权发货币、无关税权，取消事权更不可能——转移支付是唯一的规范化解法。\n【改革方向】推进省以下财政体制改革，健全县级基本财力保障机制。","k":"政府间财政关系（纵向失衡与转移支付）"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"multi","q":"下列因素变动中，会导致商品供给增加（供给曲线右移）的有（　）。","o":["生产技术进步","原材料价格下降","政府给予生产补贴","消费者对该商品的偏好增强","行业内生产企业数量增加"],"a":[0,1,2,4],"e":"供给由“成本—技术—主体数量—政策”决定：技术进步与原材料降价降低单位成本（A、B）；补贴改善盈利预期（C）；更多企业进入增加市场总供给（E）。消费者偏好影响的是需求端（D），与供给曲线无关——需求类因素混进供给题是经典干扰。\n【对照记忆】“成本技术动供给，收入偏好动需求”。","k":"影响供给的因素","fig":"supply-shift"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"multi","q":"完全竞争市场的特征包括（　）。","o":["买者和卖者数量众多，任何人都无法影响市场价格","产品同质无差别","资源可以自由流动，企业进出市场无障碍","买卖双方信息完全","单个企业面临向右下方倾斜的需求曲线"],"a":[0,1,2,3],"e":"完全竞争四条件：众多买卖者、产品同质、自由进出、信息完全（A、B、C、D）。正因为这些条件，单个企业只能是价格接受者，其需求曲线是水平线（E 说反了——面对右下倾斜需求曲线的是垄断力量更强的市场）。\n【对照表】四类市场的垄断力量由弱到强：完全竞争→垄断竞争→寡头→完全垄断，需求曲线由水平到最陡。","k":"完全竞争市场的特征"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"multi","q":"按通货膨胀的成因划分，其类型包括（　）。","o":["需求拉上型","成本推进型","输入型","结构型","温和型"],"a":[0,1,2,3],"e":"按成因四分：需求拉上（总需求过旺）、成本推进（工资原料成本上升）、输入型（进口涨价与外部冲击传导）、结构型（部门结构失衡传导扩散）。温和型是按“程度”分类的说法（温和/奔腾/恶性），与成因分类不在一个维度。\n【分类题防御】先看清题问的是“按什么分类”，维度混搭是固定陷阱。","k":"通货膨胀的类型（按成因）"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"multi","q":"关于GDP与国民总收入（GNI）的区别，下列说法正确的有（　）。","o":["GDP按国土（地域）原则核算","GNI按国民（常住居民）原则核算","外资企业在本国的生产计入本国GDP","外资企业汇出国外的利润计入本国GNI","两者在任何国家都完全相等"],"a":[0,1,2,3],"e":"GDP“看地盘”：境内常住单位的生产成果（含外资在本国的产出）；GNI“看人头”：本国常住单位从国内外获得的全部收入（本国要素在境外的收入算进来，外资汇走的利润不算）。经济大量引入外资的国家通常GDP＞GNI；对外投资大国相反。两者永远不会“完全相等”（E 错）——净要素收入几乎不为零。\n【数字口径】GNI＝GDP＋来自国外的净要素收入。","k":"GDP与GNI"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"multi","q":"财政政策的内在稳定器（自动稳定器）主要包括（　）。","o":["累进所得税制度","失业保险和社会福利等转移支付制度","农产品维护价格制度","政府购买性支出的主动增减","公开市场操作"],"a":[0,1,2],"e":"自动稳定器的三大装置：累进所得税（繁荣时自动多征税）、转移支付（衰退时失业救济、低保自动扩支出）、农产品维护价格（价格波动时自动收放储备调节）。D 是政府主动决策的相机抉择手段，不属于“自动”范畴；E 是货币政策工具，跑错片场。\n【判断标准】看是否需要“开会决策”——不用开会就起作用的，才是自动稳定器。","k":"财政政策的自动稳定器"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"multi","q":"中央银行的职能包括（　）。","o":["发行的银行（垄断货币发行）","银行的银行（最后贷款人、集中准备金、组织清算）","政府的银行（代理国库、管理国际储备）","以盈利为目的经营存贷款业务","直接为企业和个人办理结算账户开立"],"a":[0,1,2],"e":"央行三大职能（A、B、C），另外两条都是“央行不该干的事”：不以盈利为目的、原则上不与企业和个人直接发生业务往来（D、E 错）——这正是央行与商业银行的本质区别。央行的对象是金融机构和政府，“最后贷款人”角色只在非常时期对金融机构启用。\n【反着记】“央行三管：管印钱、管银行、管国库；不抢商业银行生意”。","k":"中央银行的职能"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"multi","q":"下列融资活动中，属于直接融资的有（　）。","o":["发行股票","发行企业债券","商业票据签发与转让","向商业银行申请贷款","办理融资租赁"],"a":[0,1,2],"e":"直接融资：资金供需双方直接建立债权债务或股权关系——股票、债券、商业票据、风险投资等；银行存贷款、融资租赁、信托贷款等经过金融中介的资产负债表，属间接融资。判断标志：钱有没有“经过中介的手转一道”。\n【延伸】直接融资市场化程度是金融体系结构的重要标志，我国长期以间接融资为主，政策方向是提高直接融资比重。","k":"直接融资与间接融资"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"multi","q":"下列关于会计等式与复式记账的说法中，正确的有（　）。","o":["基本会计等式为“资产＝负债＋所有者权益”","任何经济业务的发生都不会破坏会计等式的平衡关系","复式记账对每项经济业务在两个或两个以上相互联系的账户中登记","借贷记账法的记账规则是“有借必有贷、借贷必相等”","会计等式平衡了就说明所有账都记对了"],"a":[0,1,2,3],"e":"会计恒等式是复式记账的理论基石：任何业务要么等式两边同增同减、要么一边内部有增有减，恒等关系永存（A、B）；复式记账（C）与“有借必有贷、借贷必相等”规则（D）共同保证试算平衡。E 是经典误读——平衡只是必要条件，漏记、重记、串户等错误借贷依旧平衡。\n【记忆钩子】“等式永平是原理，试算平衡是体检，体检正常不等于没病”。","k":"会计等式与复式记账","fig":"taccount"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"multi","q":"下列属于统计调查方式的有（　）。","o":["普查","抽样调查","统计报表","重点调查与典型调查","会计恒等试算"],"a":[0,1,2,3],"e":"我国统计调查方式体系：普查（全面、一次性）、统计报表（经常性、自上而下布置）、抽样调查（非全面、应用最广）、重点调查（只查举足轻重的少数单位）、典型调查（有意识选代表深入解剖）。E 是会计概念，与统计调查无关。\n【选择逻辑】要“全”用普查，要“快省”用抽样，要“常态”用报表，要“抓大头”用重点，要“解剖麻雀”用典型。","k":"统计调查方式体系"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"multi","q":"物权与债权相比，物权具有的特征包括（　）。","o":["支配权（直接支配标的物并享受其利益）","对世权（义务人为权利人之外的一切人）","具有排他性（一物之上不能有两个所有权）","请求权（须请求特定义务人为一定行为）","种类和内容由当事人自由创设"],"a":[0,1,2],"e":"物权三特征：支配权（直接管物，无需他人介入）、对世权（人人都是义务人）、排他性（一物一权）；还具有追及效力和优先效力。请求权是债权的特征（D 说反了）；物权实行法定原则，当事人不得自由创设（E 错，恰是债权“意思自治”的对照面）。\n【对仗记忆】“物权对物直接管、对全世界生效、不能自己发明；债权对人发请求、只对特定人生效、合同里随便约定”。","k":"物权与债权"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"multi","q":"有限责任公司与股份有限公司相比，有限责任公司的特征包括（　）。","o":["股东人数有上限（50人以下）","股东以其认缴的出资额为限对公司承担责任","不得公开发行股票募集股份","注册资本划分为等额股份","股权（出资）对外转让受限制，其他股东有优先购买权"],"a":[0,1,2,4],"e":"有限公司的“封闭性”：人数封顶50、不得公开募股、出资转让须其他股东过半数同意且其他股东有优先购买权（人合性），D “注册资本划分为等额股份”是股份公司的标志——有限公司按出资比例行使权利，不划等额股份。E 中“以认缴出资额为限担责”其实是两类公司的共同点（有限责任），但作为有限公司特征表述无误，多选题按正确表述入选。\n【记忆钩子】“有限公司是熟人合伙（封闭），股份公司是陌生人募资（开放）”。","k":"公司的种类与区别"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"multi","q":"影响一国财政收入规模的因素包括（　）。","o":["经济发展水平","分配体制与分配政策","价格变动","税收征管水平","国际汇率制度选择"],"a":[0,1,2,3],"e":"财政收入规模四因素：经济发展水平（根本约束，蛋糕多大）、分配体制政策（切多大比例，宏观税负取向）、价格（名义收入随物价水涨船高，实际规模要看不变价）、征管水平（堵漏能力决定“应收尽收”程度）。汇率制度影响的是对外金融关系，与财政收入规模无直接关系。\n【判断口诀】“蛋糕多大（经济）、切多少（政策）、称的时候用啥秤（价格）、撒没撒漏（征管）”。","k":"影响财政收入规模的因素"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"下列物品（服务）中，属于纯公共物品的是（　）。","o":["高等教育","国防","收费高速公路","经济适用住房"],"a":[1],"e":"纯公共物品同时具备两个特征：①非竞争性——增加一个消费者的边际成本为零；②非排他性——技术上或经济上无法把不付费者排除在受益之外。国防是教科书级的纯公共物品。高等教育、收费公路、经济适用房都具有可排他性或竞争性，属于（准）公共物品或私人物品。\n【同类举例】纯公共物品还有：治安、路灯、灯塔、环境保护。","k":"公共物品及其特征"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"multi","q":"在社会主义市场经济条件下，财政具有的职能包括（　）。","o":["资源配置职能","收入分配职能","经济稳定与发展职能","以盈利为目的的投资经营职能","直接决定商品价格职能"],"a":[0,1,2],"e":"财政三大职能：①资源配置——提供公共物品、纠正外部性；②收入分配——通过税收和转移支付调节收入差距；③经济稳定与发展——运用财政政策熨平经济波动、促进增长与就业。公共财政姓“公”，不以盈利为目的，不直接经营企业和定价。\n【记忆钩子】“配资源、调分配、稳经济”。","k":"财政的三大职能"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"描述“税率提高到一定程度后，税收收入反而随税率提高而下降”这一关系的曲线是（　）。","o":["洛伦兹曲线","拉弗曲线","菲利普斯曲线","无差异曲线"],"a":[1],"e":"拉弗曲线表明：税率与税收收入并非线性正相关，存在一个最佳税率；税率超过该点后，高税率抑制经济活动、税基萎缩，税收收入不增反降。它是供给学派主张减税的理论依据。洛伦兹曲线衡量收入分配公平程度，菲利普斯曲线描述失业率与通货膨胀率的交替关系，无差异曲线属于消费者行为理论。","k":"拉弗曲线","fig":"laffer"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"纳税人通过提高商品销售价格，把税负转嫁给商品购买者或最终消费者承担。这种税负转嫁方式属于（　）。","o":["前转（顺转）","后转（逆转）","消转","税收资本化"],"a":[0],"e":"前转：纳税人抬高售价把税负向前转给购买者/消费者，是最常见、最典型的转嫁方式。后转：压低进货价把税负向后转给供应者。混转：一部分前转、一部分后转。消转：不转嫁给任何人，靠改善经营、降低成本自行消化。税收资本化：多见于土地等耐久财产交易，买方把未来应纳税款从购价中预先扣除。\n【记忆钩子】“往前加价是前转，往后压价是后转”。","k":"税负转嫁的方式"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"multi","q":"税收区别于其他财政收入形式的基本特征（税收“三性”）包括（　）。","o":["强制性","无偿性","固定性","返还性","盈利性"],"a":[0,1,2],"e":"税收三性：①强制性——凭国家政治权力依法征收，不是自愿捐赠；②无偿性——国家取得税收不需要直接向纳税人支付任何对价；③固定性——按事先规定的课税对象、税率等标准征收，相对稳定。返还性（如国债偿还）与盈利性均与税收本质不符。\n【辨析】国债有偿还性，收费与政府提供服务有直接对价，这两点正是它们区别于税收之处。","k":"税收的基本特征"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"下列各项中，不属于我国政府预算体系组成部分的是（　）。","o":["一般公共预算","政府性基金预算","国有资本经营预算","货币政策执行预算"],"a":[3],"e":"我国实行“四本预算”：①一般公共预算（税收为主体，保障民生与公共服务）；②政府性基金预算（专款专用，如土地出让收入）；③国有资本经营预算（国企上缴利润）；④社会保险基金预算（社保缴费与待遇支出）。货币政策由中央银行执行，不属于政府预算范畴。","k":"我国政府预算体系（四本预算）"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"按照我国现行分税制财政管理体制，下列税种中属于中央固定收入的是（　）。","o":["增值税","消费税","企业所得税","个人所得税"],"a":[1],"e":"消费税、关税、车辆购置税等属于中央固定收入；增值税为中央与地方共享税（目前五五分成）；企业所得税和个人所得税为中央与地方共享（六四分成）。\n【记忆钩子】“消费全归央，增值五五分，所得税六四开”。","k":"分税制与税种划分"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"宏观经济处于萧条、失业率上升阶段时，政府适宜采取的财政政策是（　）。","o":["提高税率、压缩财政支出","减少税收、扩大财政支出","增加税收、扩大财政支出","提高利率、减少货币供应"],"a":[1],"e":"萧条期总需求不足，应实行扩张性（积极）财政政策：减税增加企业和居民可支配收入、扩大支出直接增加总需求。紧缩期相反，采用紧缩性财政政策（增税、减支）。D 提高利率属于紧缩性货币政策，且不属于财政政策工具。\n【联动考点】自动稳定器：累进所得税和转移支付随经济波动自动反向调节，无需政府临时决策。","k":"财政政策的类型与工具"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"凯恩斯的流动性偏好理论认为，人们持有货币的动机不包括（　）。","o":["交易动机","预防动机","投机动机","储藏动机"],"a":[3],"e":"凯恩斯货币需求三动机：交易动机（应付日常支付）、预防动机（应付意外支出）、投机动机（把握有价证券的获利机会），三者对应持有货币的三种需求，其中投机性货币需求与利率负相关。储藏动机不属于该理论。\n【记忆钩子】“交、预、投”三动机。","k":"凯恩斯流动性偏好理论"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"因原材料价格上涨、工资成本上升推动一般物价水平持续上涨，这种通货膨胀属于（　）。","o":["需求拉上型通货膨胀","成本推进型通货膨胀","输入型通货膨胀","结构型通货膨胀"],"a":[1],"e":"成本推进型：从供给（成本）端发力，工资、原材料、利润推进等成本上升推动物价上涨。需求拉上型：“过多的货币追逐过少的商品”，由总需求过度扩张引起；输入型：进口品涨价或外币流入传导；结构型：部门结构失衡引起物价总体上行。\n【判断口诀】先问压力来自“买方（需求）”还是“卖方（成本）”。","k":"通货膨胀的类型"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"multi","q":"中央银行的一般性货币政策工具（“三大法宝”）包括（　）。","o":["法定存款准备金率","再贴现","公开市场操作","窗口指导","消费信用控制"],"a":[0,1,2],"e":"一般性货币政策工具是“三大法宝”：法定存款准备金率（威力猛，影响所有银行）、再贴现（影响银行融资成本与数量信号）、公开市场操作（最灵活、最常用，央行买卖政府债券吞吐基础货币）。窗口指导属于辅助性/道义劝说工具，消费信用控制属于选择性货币政策工具。\n【记忆钩子】“准备金、再贴现、公开市场”三件套。","k":"货币政策三大工具"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"中央银行在公开市场上买入政府债券，将直接导致（　）。","o":["基础货币投放增加，市场利率趋于下降","基础货币回笼，市场利率趋于上升","财政赤字扩大","商业银行准备金减少"],"a":[0],"e":"央行买入债券＝向市场（商业银行或公众）支付货币＝投放基础货币→商业银行准备金增加、货币供给扩张→资金面宽松，市场利率趋于下降。卖出债券则相反（回笼货币、收紧）。这是最常用的微调工具。\n【记忆钩子】“买进放水，卖出抽水”。","k":"公开市场操作"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"商业银行能够随时以合理成本变现资产、应付客户提取存款和支付需要的能力，称为（　）。","o":["盈利性","流动性","安全性","成长性"],"a":[1],"e":"商业银行经营管理三原则：盈利性（追求利润）、流动性（随时应付提存与支付）、安全性（控制风险、稳健经营），三者此消彼长，需统筹平衡。题干描述的“随时变现应付提存”即流动性。利润最大化倾向会牺牲流动性与安全性，故监管要求（如流动性覆盖率）必不可少。","k":"商业银行经营管理原则"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"按融资期限划分，融资期限在一年以内的金融市场属于（　）。","o":["资本市场","货币市场","发行市场","外汇市场"],"a":[1],"e":"货币市场：期限一年以内，如同业拆借、票据贴现、短期国债（国库券）、大额可转让存单，功能是调剂短期资金余缺。资本市场：期限一年以上，如股票市场、中长期债券市场，功能是长期资金融通与资源配置。\n【分界线】一年，考试反复在“国库券＝货币市场工具”上设陷阱。","k":"金融市场的类型"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"multi","q":"金融风险的基本类型包括（　）。","o":["信用风险","市场风险","流动性风险","操作风险","经营杠杆风险"],"a":[0,1,2,3],"e":"金融风险四大基本类型：①信用风险——交易对手不履约（还不上钱）；②市场风险——利率、汇率、股价等市场价格波动带来损失；③流动性风险——想变现时变现不了或必须大幅折价；④操作风险——内部流程、人员、系统缺陷或外部事件造成损失（如违规操作、系统宕机）。经营杠杆是企业财务概念，不属于金融风险分类。\n【记忆钩子】“信、市、流、操”。","k":"金融风险的类型"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"一国的国际储备中，占比最高、最主要的组成部分通常是（　）。","o":["货币性黄金","外汇储备","在国际货币基金组织的储备头寸","特别提款权（SDR）"],"a":[1],"e":"国际储备四大构成：外汇储备、货币性黄金、IMF储备头寸、特别提款权（SDR）。其中外汇储备流动性最好、规模最大，是国际储备的主体。我国的外汇储备规模长期居世界第一。\n【联动考点】外汇储备的作用：弥补国际收支逆差、干预外汇市场稳定汇率、增强国际清偿力与信心。","k":"国际储备的构成"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"某小区居民收入数据中存在个别极端高收入者。若要更稳健地描述该组数据的一般（集中趋势）水平，宜采用的指标是（　）。","o":["均值","中位数","方差","标准差"],"a":[1],"e":"均值容易受极端值影响，“被富人拉高”；中位数按位置取值，不受极端值影响，是存在偏态或极端值时更稳健的集中趋势指标。方差、标准差属于离散程度（波动）指标，与题意不符。\n【记忆钩子】“有 outlier，看中位；对称干净，才用均值”。这也是“居民收入中位数”比“平均数”更常被引用的原因。","k":"集中趋势指标"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"要比较“身高（cm）”与“体重（kg）”两组计量单位不同、均值差异较大的数据的离散程度，应当采用的指标是（　）。","o":["极差","标准差","变异系数","四分位差"],"a":[2],"e":"变异系数＝标准差÷均值，是无量纲的相对离散指标，用于：①计量单位不同的数据之间比较；②均值相差悬殊的数据之间比较。标准差、极差、四分位差都带原始单位，直接比较没有意义。\n【典型坑】“身高的标准差5＞体重的标准差4，所以身高更分散”——错，单位不同不能比。","k":"离散程度指标与变异系数"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"multi","q":"下列抽样方法中，属于概率抽样的有（　）。","o":["简单随机抽样","分层抽样","整群抽样","判断抽样","方便抽样"],"a":[0,1,2],"e":"概率抽样的核心特征：每个单位有已知的、非零的入样概率，可计算抽样误差。常见方法：简单随机抽样、分层抽样、系统抽样、整群抽样、多阶段抽样。判断抽样、方便抽样（街头随手拦访）、自愿样本属于非概率抽样，无法推断总体精度。\n【判断标准】问一句：“入样靠不靠抽签（随机机制）？”","k":"概率抽样与非概率抽样"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"下列关于抽样误差的说法中，正确的是（　）。","o":["在其他条件相同时，样本单位数越多，抽样误差越小","在其他条件相同时，样本单位数越多，抽样误差越大","抽样误差可以完全消除","抽样误差是由于登记、计算错误造成的"],"a":[0],"e":"抽样误差随样本量增大而减小（与样本量的平方根成反比），与总体变异程度成正比，并受抽样组织方式影响。C 错：抽样误差是随机抽样固有的代表性误差，只能控制不能完全消除；D 错：登记性误差（调查员抄错、受访者乱答）属于另一类误差，与抽样误差不同。\n【记忆钩子】“样本越大越像总体”。","k":"抽样误差及其影响因素"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"两个变量的相关系数 r＝−0.92，说明两变量之间（　）。","o":["高度正相关","高度负相关","低度负相关","不存在相关关系"],"a":[1],"e":"相关系数取值范围 [−1, 1]：正负号表示方向，绝对值表示强度，|r|≥0.8 通常视为高度相关。r＝−0.92 即两变量变动方向相反且关系紧密（如：产品价格越高、需求量越小）。\n【注意】相关不等于因果；r 只度量线性关系，r＝0 不代表两变量没有任何关系（可能是非线性）。","k":"相关系数"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"定基发展速度等于相应时期内各环比发展速度的（　）。","o":["连乘积","算术和","算术平均数","加权平均数"],"a":[0],"e":"定基发展速度（报告期水平÷某一固定基期水平）＝相应各期环比发展速度（报告期÷上期）的连乘积。对应地，两个相邻定基发展速度之商＝环比发展速度。增长速度＝发展速度−1（增长100%即发展速度200%）。\n【数字例】增长10%再增长20%：定基发展速度＝1.1×1.2＝1.32，即累计增长32%，不是30%。","k":"时间序列的速度分析"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"multi","q":"下列各项中，属于会计基本前提（会计假设）的有（　）。","o":["会计主体","持续经营","会计分期","货币计量","权责发生制"],"a":[0,1,2,3],"e":"会计四大基本前提：会计主体（为谁记账，划清空间界限）、持续经营（假设企业不会破产清算）、会计分期（把经营期间切成年度、季度、月度）、货币计量（用货币统一计量）。权责发生制不是假设，而是会计确认、计量和报告的基础。\n【高频陷阱】E 是最常被塞进选项的干扰项。","k":"会计基本前提"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"multi","q":"下列会计要素中，反映企业财务状况（资产负债表要素）的有（　）。","o":["资产","负债","所有者权益","收入","利润"],"a":[0,1,2],"e":"六大会计要素分两组：反映财务状况（时点、静态、资产负债表）——资产、负债、所有者权益；反映经营成果（时期、动态、利润表）——收入、费用、利润。两组之间以“收入−费用＝利润”和“资产＝负债＋所有者权益”两大会计等式相联结。","k":"会计要素的分类"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"某企业当年12月一次性预收次年全年场地租金120万元。按照权责发生制，该企业当年应确认的租金收入为（　）。","o":["0万元","10万元","60万元","120万元"],"a":[0],"e":"权责发生制按收入的权利、费用的义务“归属期”确认，而不是按款项收付确认。租金对应的服务期间在次年，当年只是“预收账款”（负债），当年确认收入为0。收付实现制才按实际收到现金的120万确认。\n【判断口诀】“权责看归属，现金看收付”。","k":"权责发生制与收付实现制"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"借贷记账法下，“借方”登记增加额的账户是（　）。","o":["资产类账户","负债类账户","所有者权益类账户","收入类账户"],"a":[0],"e":"记账规则“资产、费用（成本）借增贷减；负债、所有者权益、收入贷增借减”。即借方记增加的是资产类和费用成本类账户；负债、权益、收入类账户增加记在贷方。会计恒等式“资产＝负债＋所有者权益”决定了等式两边增减登记方向相反。\n【记忆钩子】“资产费用借加，负债权益收入贷加”。","k":"借贷记账法","fig":"taccount"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"反映企业某一特定日期（如12月31日）财务状况的会计报表是（　）。","o":["利润表","资产负债表","现金流量表","利润分配表"],"a":[1],"e":"资产负债表是“时点表”（像一张照片），反映特定日期资产、负债、所有者权益的存量；利润表、现金流量表是“时期表”（像一段录像），反映一段期间的经营成果和现金流量。\n【结构】资产负债表按流动性排列：左资产右负债与权益；利润表多步式：营业利润→利润总额→净利润。","k":"资产负债表"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"计算速动比率时，速动资产是指流动资产扣除（　）后的余额。","o":["存货","货币资金","应收账款","固定资产"],"a":[0],"e":"速动比率＝速动资产÷流动负债，速动资产＝流动资产−存货（−预付账款等变现能力差的项目）。存货是流动资产中变现最慢、最容易贬值的项目，剔除后更能反映短期偿债的“即时”能力。一般认为速动比率约等于1较为合适（流动比率约为2）。\n【联动】固定资产本身就不属于流动资产，故D是干扰项。","k":"偿债能力比率"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"我国政府会计实行“双功能、双基础、双报告”体系，其中实行收付实现制核算基础的是（　）。","o":["财务会计","预算会计","成本会计","管理会计"],"a":[1],"e":"政府会计“双体系”：财务会计——权责发生制，编制财务报告（反映运行成本、资产负债状况）；预算会计——收付实现制（国务院另有规定除外），编制决算报告（反映预算收支执行）。同一个系统里两套账并行、相互衔接。\n【记忆钩子】“财务要权责，预算看收付”。","k":"政府会计标准体系"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"下列各项中，属于用益物权的是（　）。","o":["建设用地使用权","抵押权","质权","留置权"],"a":[0],"e":"物权三分：①所有权（占有、使用、收益、处分四项权能）；②用益物权——对他人的不动产使用、收益，包括土地承包经营权、建设用地使用权、宅基地使用权、地役权、居住权；③担保物权——抵押权、质权、留置权，作用是担保债务履行、优先受偿。\n【记忆钩子】“担保三兄弟：抵、质、留；剩下的用益都是‘用’字辈”。","k":"物权的种类"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"根据民法典关于善意取得的规定，受让人取得不动产或动产所有权的条件不包括（　）。","o":["受让人受让时是善意的","以合理的价格转让","转让的不动产依法应当登记的已经登记，动产已经交付","受让人无偿取得该财产"],"a":[3],"e":"善意取得三要件：①受让人受让时善意（不知且不应知转让人无处分权）；②以合理价格转让——有偿性是必要条件，无偿取得不适用善意取得；③已完成登记（不动产）或交付（动产）。原所有权人的损失只能向无处分权人追偿。\n【立法目的】保护交易安全与信赖，牺牲原所有权人的静态安全换取动态安全。","k":"善意取得"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"根据民法典的规定，要约生效的时间是（　）。","o":["要约人发出要约时","要约到达受要约人时","受要约人作出承诺时","双方签字盖章时"],"a":[1],"e":"要约是希望与他人订立合同的意思表示，自到达受要约人时生效（到达主义）。承诺生效时合同成立，承诺同样自到达要约人时生效。注意区分三个时点：要约生效（到达）→承诺生效（到达，合同成立）→依法需批准的合同自批准时生效。","k":"合同的订立（要约与承诺）"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"一方以欺诈手段，使对方在违背真实意思的情况下订立合同，受欺诈方有权请求（　）。","o":["人民法院或者仲裁机构予以撤销","自行宣布合同无效","直接扣押欺诈方财产","公安机关追究欺诈方刑事责任"],"a":[0],"e":"可撤销的民事法律行为包括：重大误解、欺诈（含第三人欺诈且对方知情）、胁迫、显失公平。撤销权必须通过人民法院或仲裁机构行使，撤销后合同自始没有法律约束力。注意新规：欺诈、胁迫所签合同一般属“可撤销”而非“无效”（仅损害国家利益的无效这一旧规已调整）。\n【除斥期间】自知道或应当知道撤销事由之日起1年内行使。","k":"可撤销合同"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"multi","q":"当事人一方不履行合同义务或者履行不符合约定的，依法承担违约责任的方式包括（　）。","o":["继续履行","采取补救措施","赔偿损失","支付违约金","行政拘留"],"a":[0,1,2,3],"e":"违约责任的承担方式：继续履行、采取补救措施（修理、重作、更换、退货、减少价款等）、赔偿损失、支付违约金、定金责任（双倍返还或不予返还）。行政拘留是行政处罚，与民事违约责任性质不同。\n【联动考点】定金不得超过主合同标的额的20%；违约金过分高于损失的可请求法院适当减少。","k":"违约责任"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"根据2024年7月1日起施行的新《公司法》，有限责任公司全体股东认缴的出资额应当自公司成立之日起（　）内缴足。","o":["一年","三年","五年","十年"],"a":[2],"e":"新《公司法》将认缴制的“无期限”改为“五年实缴期限”：有限责任公司股东认缴的出资额须在公司成立之日起五年内缴足，股份有限公司发起人应在成立前全额缴纳。这是对长期以来“认缴天价、永不到账”乱象的制度纠偏。\n【时效提醒】公司法近年修订幅度大，数字类考点务必以当年教材和最新法条为准。","k":"公司法律制度（新公司法）"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"根据专利法，发明专利权的保护期限自申请日起计算为（　）。","o":["10年","15年","20年","25年"],"a":[2],"e":"三种专利的保护期均自申请日起算：发明20年，实用新型10年，外观设计15年（2021年修改后的专利法将外观设计从10年延长至15年）。保护期届满后技术进入公有领域。\n【记忆钩子】“发明二十、实用十、外观十五”（外观与实用新型别记反）。","k":"专利法律制度"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"某公司在销售的商品中掺杂掺假、以假充真。该行为主要侵犯了消费者的（　）。","o":["安全保障权","知情权","自主选择权","结社权"],"a":[1],"e":"消费者九项权利：安全保障、知情、自主选择、公平交易、求偿、结社、获得知识、人格尊严（含个人信息保护）、监督。掺杂掺假、以次充好使消费者无法获知商品的真实情况，侵犯的是知情权；若商品缺陷危及人身安全才涉及安全保障权。\n【答题技巧】先分清“信息被蒙蔽（知情）”与“人身财产受威胁（安全）”。","k":"消费者权益保护法律制度"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"某公司与劳动者订立了期限为3年的劳动合同，其约定的试用期最长不得超过（　）。","o":["1个月","2个月","3个月","6个月"],"a":[3],"e":"试用期上限规则：合同期3个月以上不满1年的，试用期≤1个月；1年以上不满3年的，≤2个月；3年以上固定期限和无固定期限的，≤6个月。同一用人单位与同一劳动者只能约定一次试用期；以完成一定工作任务为期限或期限不满3个月的，不得约定试用期。\n【记忆钩子】“一年以内一个月，一到三年两个月，三年以上封顶六个月”。","k":"劳动合同法律制度"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"政府对某些商品规定低于均衡价格的最高限价（限价）后，市场通常会出现的结果是（　）。","o":["供不应求，出现短缺、排队购买甚至黑市交易","供过于求，出现商品过剩","市场自动恢复到均衡状态","需求曲线整体向右移动"],"a":[0],"e":"最高限价低于均衡价格：在此价格上需求量＞供给量，产生短缺，常见排队、配给、黑市加价等现象。最高限价多用于保护买方（如战时物价管制）。\n【对比考点】保护价格（支持价格）高于均衡价格：供过于求出现过剩，政府通常收购储备——典型如粮食保护价。","k":"均衡价格模型的应用（最高限价与保护价格）","fig":"price-control"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"政府为扶持农业，对粮食规定高于均衡价格的保护价格。为维持该价格，政府通常需要（　）。","o":["向消费者发放购物补贴","收购市场上过剩的粮食建立储备","向市场投放储备粮平抑价格","对粮食生产征收特别税"],"a":[1],"e":"保护价格高于均衡价格→供给量＞需求量→市场过剩，过剩部分由政府收购形成储备，才能把价格“托”在保护价水平。投放储备粮是压低价格的措施，与保护价方向相反。\n【记忆钩子】“限价防涨价要收购，最高价压涨价管短缺”。对照记：最高限价→短缺；保护价格→过剩。","k":"均衡价格模型的应用（保护价格）","fig":"price-control"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"消费者连续喝奶茶，第3杯带来的满足感的增加量明显小于第2杯。这一现象反映的规律是（　）。","o":["边际效用递减","边际效用递增","总效用递减","机会成本递减"],"a":[0],"e":"边际效用递减规律：随着消费数量连续增加，每增加一单位消费带来的效用增量（边际效用）是递减的。注意区分：只要边际效用＞0，总效用仍在增加（只是增加得越来越慢）；边际效用＝0 时总效用最大；边际效用＜0 时总效用才下降。所以 C 错——“满足感的增加量变小”不代表“满足感本身变小”。","k":"边际效用递减规律","fig":"tu-mu"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"正常商品的价格下降后，消费者增加对该商品的购买。从效应分解看，其原因在于（　）。","o":["替代效应使购买量增加，收入效应使购买量减少","替代效应和收入效应都使购买量增加","替代效应使购买量减少，收入效应使购买量增加","替代效应和收入效应都使购买量减少"],"a":[1],"e":"价格下降的两种效应：①替代效应——该商品相对变便宜，消费者用它替代其他商品，购买量增加；②收入效应——同样收入购买力增强（实际收入上升），正常商品的购买量随之增加。对正常商品，两种效应方向一致，需求曲线向右下方倾斜。低档商品（如劣质品）两效应方向相反，特殊情况下才可能出现需求曲线向右上方倾斜（吉芬商品）。","k":"替代效应与收入效应"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"微观经济学中所说的“长期”，是指（　）。","o":["时间长度超过一年的时期","全部生产要素都可以调整的时期","至少有一种生产要素固定不变的时期","企业已经实现利润最大化的时期"],"a":[1],"e":"长期与短期的划分标准不是日历时间，而是要素能否全部调整：短期——至少有一种要素（通常是厂房、设备等固定要素）数量不变；长期——所有要素都可调整，企业可以调整生产规模甚至进入、退出行业。因此“一年以上”是常见误读，有的行业长期可能只要几个月，有的要数年。","k":"短期与长期的划分"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"某企业将全部生产要素投入增加一倍，产量增加超过一倍。该企业处于（　）。","o":["规模报酬递增","规模报酬递减","规模报酬不变","边际报酬递减"],"a":[0],"e":"规模报酬研究“所有要素同比例增加”时产量的变化：产出增幅＞投入增幅为递增（往往源于专业化分工、大型设备、管理协同），＝为不变，＜为递减。注意与边际报酬递减区分：边际报酬递减针对“其他要素不变、只增加一种要素”的短期情形。\n【对应关系】同比例增加所有要素→规模报酬；只增加一种要素→边际产量。","k":"规模报酬"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"完全垄断企业面对向右下方倾斜的需求曲线，其边际收益与价格的关系是（　）。","o":["边际收益小于价格","边际收益等于价格","边际收益大于价格","边际收益与价格无关"],"a":[0],"e":"垄断企业多卖一单位必须降价，而且降价适用于所有产品，故新增一单位带来的收益增量（MR）小于新价格本身，即 MR＜P。而完全竞争企业是价格接受者，P＝MR——这是两类市场最重要的区别之一。垄断企业按 MR＝MC 确定产量，再按需求曲线定价，价格高于边际成本。","k":"垄断企业的收益曲线"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"在完全竞争的生产要素市场中，企业为利润最大化而使用劳动要素的原则是：劳动的（　）。","o":["边际产量等于平均产量","边际产品价值等于工资率（劳动价格）","边际产品价值等于产品价格","总产量达到最大"],"a":[1],"e":"企业使用要素的边际收益是“边际产品价值”VMP＝P×边际产量MP，边际成本是要素价格（劳动为工资率W）。多雇一人增加的产值＞工资就继续雇，＜就减少雇，均衡在 VMP＝W。选项C混淆了 VMP 里的产品价格与要素价格；A、D 是产量概念，与要素使用决策无关。","k":"生产者使用生产要素的原则"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"某企业产品价格为10元/件，当前雇用的最后一名工人的边际产量为5件/天。该工人为企业带来的边际产品价值为（　）。","o":["50元/天","5元/天","10元/天","2元/天"],"a":[0],"e":"边际产品价值 VMP＝产品价格P×边际产量MP＝10×5＝50（元/天）。若该工人的日工资低于50元，增雇可增利；高于50元则应减雇。\n【判断要点】VMP 一定是“价格×边际产量”，与工资、平均产量无关。工资率是使用要素的成本，不进 VMP 的计算。","k":"边际产品价值（VMP）"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"当工资率上升到较高水平后，劳动者反而可能减少劳动供给、增加闲暇。此时劳动供给曲线（　）。","o":["向后弯曲","变成水平线","变成垂直线","向上倾斜得更陡"],"a":[0],"e":"工资上升有两种效应：替代效应——闲暇的机会成本变高，人们多工作；收入效应——收入高了，人们想多买“闲暇”这种奢侈品。工资较低时替代效应占优（供给曲线向右上），工资高到一定程度后收入效应超过替代效应，劳动供给量反而减少，供给曲线向后弯曲。\n【记忆钩子】“钱少拼命干，钱多想躺平”。","k":"劳动供给曲线","fig":"labor-supply"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"某化工厂向河流排污却未支付治理费用。关于该负外部性的说法，正确的是（　）。","o":["工厂的私人成本低于社会成本，产量高于社会最优水平","工厂的私人成本高于社会成本，产量低于社会最优水平","市场会自动把外部成本内部化，无需干预","该行为只影响工厂自身收益，不影响他人"],"a":[0],"e":"负外部性＝生产的真实代价没有全部计入私人成本：私人成本＜社会成本，企业按私人成本决策会“生产过多”，超过社会最优产量。纠正手段：征收庇古税（按外部成本征税）、排污收费、排污权交易、规制标准等；科斯定理提示产权清晰且交易成本低时也可通过谈判解决。\n【对称记忆】正外部性（如接种疫苗、教育）则“生产过少”，用补贴纠正。","k":"外部性与政府干预"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"某经济社会边际消费倾向为0.8，政府投资增加100亿元。在其他条件不变时，国民收入将增加约（　）。","o":["80亿元","125亿元","500亿元","800亿元"],"a":[2],"e":"投资乘数 k＝1/(1−边际消费倾向)＝1/(1−0.8)＝5；国民收入增加＝100×5＝500亿元。乘数机制：一笔投资先变成收入，再按边际消费倾向不断被消费、再变成别人的收入……循环放大。\n【联动】边际储蓄倾向＝1−0.8＝0.2，乘数也等于1/边际储蓄倾向。MPC越大，乘数越大。","k":"投资乘数"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"一个完整的经济周期依次经历的四个阶段是（　）。","o":["繁荣、衰退、萧条、复苏","复苏、繁荣、萧条、衰退","繁荣、萧条、衰退、复苏","扩张、复苏、收缩、衰退"],"a":[0],"e":"经济周期四阶段（自波峰到波谷再到波峰）：繁荣（扩张到顶）→衰退（活动下滑）→萧条（谷底徘徊）→复苏（重新回升）。也可简化为扩张与收缩两大阶段，谷底与波峰是转折点。\n【周期长度考点】短周期（基钦，约3~4年）、中周期（朱格拉，约8年）、长周期（康德拉季耶夫，约50~60年）。","k":"经济周期的阶段","fig":"cycle"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"未预期的通货膨胀引起的收入再分配效应是（　）。","o":["有利于债务人，不利于债权人","有利于债权人，不利于债务人","对债权人和债务人都没有影响","有利于靠固定工资生活的群体"],"a":[0],"e":"通胀使货币的实际购买力下降：债务人还的钱“变毛了”，实际债务负担减轻，受益；债权人收回的钱缩水，受损。同理，通胀不利于靠固定收入（工资、退休金）生活的人，有利于持有涨价资产（房产、股票）的人。政府若大量举债，温和通胀还能实际减轻政府债务——这也是有些国家容忍通胀的原因之一。","k":"通货膨胀的效应"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"某国规定每年进口某种汽车的数量不得超过10万辆。这种贸易限制措施属于（　）。","o":["关税壁垒","进口配额（非关税壁垒）","出口补贴","外汇倾销"],"a":[1],"e":"对进口数量直接设限是典型的进口配额，属于非关税壁垒。非关税壁垒还包括进口许可证制、技术性贸易壁垒（标准、认证）、卫生与植物卫生措施、自动出口限制等。关税壁垒是“用价格（征税）限进口”，配额是“用数量限进口”，后者对数量控制更直接、更刚性。","k":"非关税壁垒"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"关于公共物品的供给，下列说法正确的是（　）。","o":["公共物品必须由政府直接生产","政府提供不等于政府直接生产，可以采取合同外包等方式","公共物品只能由市场提供","公共物品的供给不需要成本补偿"],"a":[1],"e":"公共物品“提供主体”与“生产方式”是两回事：提供者通常是政府（因为免费搭车导致市场供给不足），但生产可以交给市场——合同外包、政府购买服务、特许经营（BOT）等。“政府提供”指政府出资并承担最终责任，生产环节完全可以引入竞争。\n【易错点】A 把“提供”与“生产”混为一谈，是本考点最经典的干扰项。","k":"公共物品的提供与生产"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"下列财政支出项目中，属于转移性支出的是（　）。","o":["政府投资修建高速公路","行政管理费","财政补贴","公务员工资"],"a":[2],"e":"按是否获得等价商品和服务分：①购买性支出——政府花钱“买东西”，一手钱一手货，如政府投资、行政管理费、公务员工资，对生产和就业影响直接；②转移性支出——钱无偿单方面转出、不取得对价，如财政补贴、社会保障支出（抚恤、救济）、债务利息，主要体现收入分配职能。\n【判断口诀】“有没有拿到货”：拿到货是购买，白给钱是转移。","k":"财政支出的分类（购买性支出与转移性支出）"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"衡量一国政府活动规模、反映财政支出相对水平的常用指标是（　）。","o":["财政支出总额","财政支出占GDP的比重","财政收入总额","财政赤字额"],"a":[1],"e":"财政支出占GDP的比重是相对指标，剔除了经济体量差异，便于纵向比较和国际比较，是衡量政府活动规模最常用的指标。财政支出总额是绝对指标，只看总量不看经济体量，说服力有限。\n【趋势考点】随着经济发展和政府职能扩展，各国财政支出占GDP比重总体呈上升趋势（瓦格纳法则）。","k":"财政支出规模"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"multi","q":"下列关于财政支出的说法中，正确的有（　）。","o":["购买性支出对生产和就业的影响直接","转移性支出主要体现政府的收入分配职能","购买性支出遵循等价交换原则","转移性支出直接形成对商品和服务的购买","转移性支出包括财政补贴和债务利息支出"],"a":[0,1,2,4],"e":"购买性支出：政府以购买者身份按等价交换取得商品和服务，直接构成社会总需求的一部分，直接刺激生产与就业（A、C 正确）。转移性支出：资金无偿转移、不换回对价，通过改变收入分配格局间接影响需求，体现分配职能（B 正确），内容包括补贴、社保、利息等（E 正确）。D 颠倒了性质——直接形成购买的是购买性支出。","k":"财政支出的分类"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"我国财政收入最主要的形式是（　）。","o":["税收","政府收费","国有资产收益","罚没收入"],"a":[0],"e":"税收占我国财政收入的绝大部分（通常在85%~90%），是最稳定、最规范、覆盖面最广的收入形式。收费、罚没等具有一次性、分散性，国有资产收益随经营波动，国债是有偿的临时性收入，都不能挑大梁。\n【判断标准】凡问“最主要、最重要、主体”，财政收入的答案基本都是税收。","k":"财政收入的形式"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"我国个人所得税综合所得适用的税率形式是（　）。","o":["比例税率","超额累进税率","全额累进税率","定额税率"],"a":[1],"e":"个人所得税综合所得按3%~45%的超额累进税率计征：只对“超过上一级次的部分”适用更高税率，税负随收入平滑上升。比例税率（如增值税13%）、定额税率（如车船税按辆）对不同收入者税负不随收入累进。全额累进在临界点附近税负跳升严重，各国基本不用。\n【记忆分组】比例：增值税、企业所得税（25%标准税率）；超额累进：个税综合所得；定额：车船税、部分资源税。","k":"税率的类型"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"政府预算草案必须提交国家权力机关审查批准后方可执行。这体现的政府预算原则是（　）。","o":["完整性原则","统一性原则","合法性原则","保密性原则"],"a":[2],"e":"合法性原则：政府预算的编制、执行和决算都要经过法定程序审查批准，受立法机关约束——本质是“政府的钱袋子要经人民同意”。完整性：全部收支都进预算，不设账外账；统一性：统一预算科目、统一口径；公开性：向社会公开，接受监督。保密性与预算的公开精神相悖。","k":"政府预算的原则"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"中央对地方实施一般性转移支付的主要目的是（　）。","o":["指定地方资金的具体用途","均衡地区间基本财力、推进基本公共服务均等化","提高中央财政收入占比","替代地方税体系"],"a":[1],"e":"政府间转移支付解决的是“财力与事权不匹配、地区间财力差距”问题。一般性转移支付（均衡性转移支付为主体）不指定用途，由地方统筹用于保基本民生、保工资、保运转，目标是缩小地区财力差距、实现基本公共服务均等化；专项转移支付才“戴帽”指定用途，且不得挪用。\n【对比记忆】“一般性给钱随便花（均衡均等），专项给钱指定花”。","k":"政府间转移支付"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"经济过热、通货膨胀压力加大时，政府适宜采取的财政政策是（　）。","o":["增加税收、压缩财政支出","减少税收、扩大财政支出","降低法定存款准备金率","扩大货币供应量"],"a":[0],"e":"过热期总需求过旺，应实行紧缩性（稳健从紧）财政政策：增税压低私人可支配收入、减支直接压缩政府需求，给经济“降温”。萧条期则相反（减税扩支）。C、D 是货币政策工具，与财政政策分属两套工具箱——考题常拿货币工具冒充财政工具。\n【搭配口诀】“热了收（紧缩财政），冷了放（扩张财政）；货币政策管水量，财政政策管花销”。","k":"财政政策的类型与运用"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"我国货币层次划分中，M0 是指（　）。","o":["流通中现金","单位活期存款","居民储蓄存款","单位定期存款"],"a":[0],"e":"M0＝流通中现金（银行体系以外的现金），流动性最强。M1＝M0＋单位活期存款，是狭义货币，反映企业资金松紧；M2＝M1＋准货币（单位定期存款、居民储蓄存款等），是广义货币，通常作为货币政策监测的主要指标。\n【记忆钩子】“M0揣兜里，M1进单位，M2存银行”——流动性逐层递减、范围逐层扩大。","k":"货币供给层次"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"中央银行提高法定存款准备金率，将直接导致（　）。","o":["商业银行可贷资金减少，货币供应量收缩","商业银行可贷资金增加，货币供应量扩张","基础货币投放增加","企业融资成本立即下降"],"a":[0],"e":"法定存款准备金率提高→每吸收一笔存款要冻结更多准备金→银行体系信用创造能力（货币乘数）下降→可贷资金减少、货币供应量收缩、市场利率趋于上行。它是“三大法宝”中威力最大、通常不宜频繁动用的工具。C 方向反了——这不是投放基础货币的操作。","k":"法定存款准备金率政策"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"下列融资活动中，属于直接融资的是（　）。","o":["向银行申请贷款","发行企业债券","办理银行承兑汇票贴现","申请融资租赁"],"a":[1],"e":"直接融资：资金供需双方直接对接，不经银行“转手”，典型是发行股票、债券。间接融资：资金先存入银行等金融中介，再由中介贷出——银行贷款、票据贴现、融资租赁都以中介机构为依托，属于间接融资。判别标志：钱是从“最终出资人”手里直接到“最终用钱人”手里，还是隔了一层中介的资产负债表。","k":"直接融资与间接融资"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"根据巴塞尔协议确立的国际监管标准，商业银行的资本充足率应不低于（　）。","o":["4%","8%","15%","20%"],"a":[1],"e":"巴塞尔协议规定商业银行资本充足率（资本与风险加权资产之比）不得低于8%，核心资本充足率不低于4%；巴塞尔协议Ⅲ在此基础上增加了储备资本缓冲等更严要求。资本充足率的本质：用自有资本吸收损失，保护存款人和金融体系稳定——资本是“防波堤”，不能太薄。\n【联动】我国以立法形式引入存款保险制度（限额偿付），与资本监管共同构成金融安全网。","k":"巴塞尔协议与资本充足率"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"我国现行的人民币汇率制度属于（　）。","o":["固定汇率制度","自由浮动汇率制度","以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度","联系汇率制度"],"a":[2],"e":"人民币汇率制度的官方表述是完整的“一句话考点”：以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。它既不是盯死一种货币的固定汇率（如联系汇率制），也不是完全放任的自由浮动——央行可在必要时干预，保持汇率基本稳定。\n【答题技巧】选项里看到“有管理的浮动”基本就是它；看到“盯住美元”“联系汇率”都是干扰。","k":"人民币汇率制度"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"“统计”一词通常包含三种涵义，它们是（　）。","o":["统计工作、统计数据、统计学","统计调查、统计整理、统计分析","总体、样本、标志","普查、抽样调查、重点调查"],"a":[0],"e":"统计的三种涵义：①统计工作——收集、整理、分析数据的实践活动；②统计数据——工作活动的成果（数字与资料）；③统计学——总结实践经验形成的理论与方法论科学。三者是“活动—成果—理论”的关系。\n【辨析】B 是统计工作的三个环节；C 是统计学基本概念；D 是统计调查的组织方式，都不是“统计”一词的涵义本身。","k":"统计的涵义"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"对产品按“一等品、二等品、三等品”分等级登记。这里的“产品等级”属于（　）。","o":["分类变量","顺序变量","数值变量","随机变量"],"a":[1],"e":"变量按取值性质分：分类变量——类别之间无高低次序（性别、行业）；顺序变量——类别有等级次序但不能作数量运算（产品等级、满意度、学历层次）；数值变量——取值是数字，可加减运算（产量、收入）。\n【判断口诀】“能分不能排是分类，能排不能算是顺序，能算才是数值”。","k":"变量的类型"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"multi","q":"下列关于大数据特征的说法中，正确的有（　）。","o":["数据体量巨大（Volume）","数据类型多样（Variety）","处理速度快、时效性强（Velocity）","价值密度高，每条数据都蕴含大量信息（Value）","大数据分析更关注相关关系而非仅仅因果关系"],"a":[0,1,2,4],"e":"大数据“4V”特征：Volume大量、Variety多样、Velocity高速，以及 Value——价值密度低（海量数据中有用信息相对稀疏，需要挖掘提取），D 把“密度低”说成“密度高”，是最常见的反向陷阱。E 正确：大数据思维的重要转变是从追求精确的因果关系转向接受混杂、关注相关关系。\n【记忆钩子】“量大、样多、跑得快，价值像沙里淘金”。","k":"大数据的特征"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"某组数据的均值明显大于中位数，则该组数据的分布形态为（　）。","o":["左偏（负偏）分布","右偏（正偏）分布","对称分布","均匀分布"],"a":[1],"e":"存在少数极端大值时，均值被拉高而中位数不受影响，均值＞中位数，分布呈右偏（长尾拖向右侧），如收入分布。反之均值＜中位数为左偏。对称分布下两者重合。\n【记忆钩子】“尾巴甩向哪边就往哪边偏”——大尾巴在右，均值跟着尾巴跑。","k":"分布形态（偏态）"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"与简单随机抽样相比，分层抽样的主要优点是（　）。","o":["无需任何抽样框","样本代表性更好，估计精度更高，还可以对各层分别进行估计","调查成本一定更高","样本量一定更小"],"a":[1],"e":"分层抽样先把总体分成“层内差异小、层间差异大”的若干层，再在每层内抽样：一是样本均匀撒遍各层，代表性更好、抽样误差更小；二是能对每一层单独估计（如分行业、分地区）。C、D 的“一定”都不成立——分层还可能降低成本，样本量取决于设计而非方法本身。\n【对比】整群抽样是“群间差异小、群内像总体”，抽几个整群调查，省钱但误差偏大——两者方向正好相反，最爱对着考。","k":"分层抽样"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"一元线性回归模型的判定系数 R²＝0.85，其含义是（　）。","o":["自变量每变动一个单位，因变量平均变动0.85个单位","因变量变差中约有85%可以由自变量（回归方程）解释","两变量的相关系数为0.85的85%","回归预测的误差为15%的概率是85%"],"a":[1],"e":"判定系数 R² 度量拟合优度：取值[0,1]，表示因变量总变差中被回归方程解释的比例。R²＝0.85 即85%的变差由x解释，其余15%来自其他因素与随机扰动。注意与回归系数区分：回归系数才描述“x每变1单位，y平均变多少”（A 是回归系数的含义）。R² 越接近1，拟合越好。","k":"判定系数（拟合优度）","fig":"scatter"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"某品牌月饼销量每年中秋节前大幅上升、节后回落，年复一年呈规律性变化。这种波动属于时间序列构成成分中的（　）。","o":["长期趋势","季节变动","循环波动","不规则波动"],"a":[1],"e":"时间序列四大构成成分：长期趋势（持续的方向性变化）、季节变动（一年内随季节/节日的固定周期重复，月份数据最常见）、循环波动（非固定周期的涨落，如经济周期，周期常在一年以上）、不规则波动（偶然因素）。月饼、空调、羽绒服销量都是教科书级的季节变动例子。\n【判别口诀】“一年内重复是季节，跨年大起大落是循环”。","k":"时间序列的构成成分","fig":"trend"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"企业以融资租赁方式租入的设备，虽然法律所有权属于出租人，但会计上作为企业自有固定资产核算。这体现的会计信息质量要求是（　）。","o":["谨慎性","实质重于形式","重要性","及时性"],"a":[1],"e":"实质重于形式：按交易或事项的经济实质进行会计确认、计量和报告，而不仅以其法律形式为依据。融资租赁承租方实质上控制了设备、享有收益并承担风险，故视同自有资产。谨慎性是“不高估资产收益、不低估负债费用”（如计提减值准备）；重要性抓大放小；及时性不得提前或延后。","k":"会计信息质量要求（实质重于形式）"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"会计循环的基本环节按正确顺序排列为（　）。","o":["填制和审核会计凭证→登记会计账簿→编制财务会计报告","登记会计账簿→填制会计凭证→编制财务会计报告","编制财务会计报告→填制会计凭证→登记会计账簿","填制和审核会计凭证→编制财务会计报告→登记会计账簿"],"a":[0],"e":"会计循环：经济业务发生→填制并审核会计凭证（把业务变成会计语言）→据此登记账簿（分类、汇总）→期末对账结账→编制财务会计报告（输出信息）。凭证是“入口”，账簿是“加工”，报表是“出口”，顺序不能乱。\n【记忆钩子】“先凭证、后账簿、再报表”。","k":"会计循环的环节"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"企业购买生产设备支付的现金，在现金流量表中应计入（　）。","o":["经营活动现金流量","投资活动现金流量","筹资活动现金流量","汇率变动对现金的影响"],"a":[1],"e":"现金流量表把现金收支分为三类：经营活动（日常产供销，如销售收款、采购付款、付工资）、投资活动（长期资产购建与处置、对外投资及其收回——买设备在此）、筹资活动（吸收投资、借款、还款、分红）。判断口诀：跟“日常经营的钱”走是经营，跟“买机器、做投资”走是投资，跟“找钱、还钱”走是筹资。","k":"现金流量表的分类"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"下列财务指标中，最能反映企业为股东投入资本创造收益能力（盈利能力核心指标）的是（　）。","o":["流动比率","净资产收益率","资产负债率","存货周转率"],"a":[1],"e":"净资产收益率（ROE）＝净利润÷平均净资产，直接回答“股东的钱一年赚了百分之几”，是杜邦分析体系的核心，也是盈利能力的综合性最强指标。流动比率、资产负债率反映偿债能力，存货周转率反映营运效率。\n【杜邦分解】ROE＝销售净利率×总资产周转率×权益乘数——把盈利、效率、杠杆串成一条线。","k":"盈利能力比率"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"政府财务会计的要素不包括（　）。","o":["资产","净资产","利润","费用"],"a":[2],"e":"政府财务会计五要素：资产、负债、净资产、收入、费用。“利润”是企业会计的要素（收入−费用＝利润），政府会计不以营利为目的、没有利润概念，相应等式为“资产−负债＝净资产”。\n【对比记忆】企业六要素：资产、负债、所有者权益、收入、费用、利润；政府五要素：没有“利润”，且“所有者权益”换成“净资产”。","k":"政府会计要素"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"反垄断法、反不正当竞争法等直接体现国家干预、协调经济运行的法律，属于（　）法律部门。","o":["民商法","经济法","行政法","刑法"],"a":[1],"e":"调整社会主义市场经济主要有两大法律部门：民商法——调整平等主体之间的人身与财产关系（合同、物权、公司法等），强调“平等自治”；经济法——调整国家在干预、协调经济运行中发生的经济关系（反垄断、反不正当竞争、财政税收、金融监管等），体现“国家干预”。\n【区分标志】主体地位平等、意思自治的是民商法；有“看得见的手”介入的是经济法。","k":"调整经济的法律体系"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"抵押与质押的主要区别在于（　）。","o":["是否转移担保财产的占有","是否必须签订书面合同","担保的债权数额大小","能否由债务人本人提供担保"],"a":[0],"e":"抵押——不转移占有，抵押物仍在抵押人手里用（如房产抵押、生产设备抵押）；质押——必须转移占有或交付权利凭证（动产质押交付、权利质押登记/交付），出质人失去对质物的占有控制。书面合同两者都需要（B 同）；担保金额、担保人身份（C、D）两者都无差别。\n【记忆钩子】“抵押不搬家，质押要过手”。","k":"担保物权（抵押与质押）"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"某买卖合同标的额为100万元，双方约定定金30万元。一方违约时，定金罚则实际可适用的数额为（　）。","o":["30万元","25万元","20万元","10万元"],"a":[2],"e":"民法典规定：定金数额由当事人约定，但不得超过主合同标的额的20%；超过部分不产生定金效力（不适用双倍返还/不予返还的罚则），只能按预付款处理。本题20%上限＝20万元，故定金罚则适用的只有20万。\n【定金罚则】给付方违约→无权请求返还；收受方违约→双倍返还。","k":"定金规则"}],"jk1":[{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在没有限速标志、标线的城市道路上（没有中心线），最高时速不得超过（　）。","o":["30公里/小时","40公里/小时","50公里/小时","70公里/小时"],"a":[0],"e":"无限速标志时：没有道路中心线的城市道路最高 30km/h，公路 40km/h；同方向只有一条机动车道的城市道路 50km/h，公路 70km/h。\n【记忆钩子】“城3公4，单车道城5公7”。","k":"限速规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在没有限速标志、标线的公路上（同方向只有一条机动车道），最高时速不得超过（　）。","o":["40公里/小时","50公里/小时","70公里/小时","80公里/小时"],"a":[2],"e":"同方向只有一条机动车道的公路，无限速标志时最高 70km/h；同类条件的城市道路为 50km/h。城市严于公路，因为路口行人非机动车多。","k":"限速规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"在没有中心线的道路上遇到对向来车时，两车应当（　）。","o":["各自靠右行驶并保持横向安全距离","左侧行驶，抢占先机","鸣笛示意对方让行","加速通过，避免会车"],"a":[0],"e":"我国实行右侧通行原则，会车时各自靠右、减速慢行、保持横向间距，必要时停车让行。抢行、逼车都是违法行为。","k":"右侧通行与会车"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车通过没有交通信号灯控制也没有交警指挥的交叉路口时，正确的通行原则是（　）。","o":["转弯的机动车让直行的车辆先行","直行的机动车让转弯的车辆先行","大型车让小型车先行","先到路口的减速慢行，后到的加速通过"],"a":[0],"e":"无信号灯路口规则：①转弯让直行；②相对方向行驶的右转弯让左转弯；③没有方向指示信号灯的路口，转弯让直行。直行优先是路口安全的基本逻辑。","k":"路口让行规则"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车准备进入环形路口（环岛）时，正确的做法是（　）。","o":["让已在路口内的机动车先行","抢先进入，占据内圈","鸣笛催促环岛内车辆让行","直接驶入内圈快速通过"],"a":[0],"e":"准备进入环岛的让已在环岛内的车辆先行——环岛内车辆有优先通行权。进入时开左转向灯（驶入内侧车道），驶出时开右转向灯。","k":"环岛通行规则"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车行经人行横道时，遇行人正在通过人行横道，应当（　）。","o":["停车让行","鸣笛提醒行人快速通过","减速绕行","加速在行人前通过"],"a":[0],"e":"行经人行横道遇行人正在通过，必须停车让行——这是“礼让斑马线”的法律义务，违者记 3 分并罚款。即便无人通过，也应减速慢行。","k":"礼让行人"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇有前方交叉路口交通阻塞时，正确的做法是（　）。","o":["依次停在路口以外等候，不得进入路口","借对向车道绕过阻塞段","在路口内停车等候","鸣喇叭催促前方车辆"],"a":[0],"e":"前方路口阻塞时应当依次停在路口以外等候，即使绿灯也不得进入路口——“绿灯不入堵路口”，进入路口内滞留属于违法（闯堵）。","k":"路口阻塞处置"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在车道减少的路口、路段，遇有前方机动车停车排队等候或者缓慢行驶时，应当（　）。","o":["每车道一辆依次交替驶入车道减少后的路口、路段","加速抢行并入剩余车道","鸣笛要求其他车道车辆让行","压实线强行加塞"],"a":[0],"e":"车道减少的路口路段实行“拉链式交替通行”：两边车道各一辆、依次交替合并。抢行加塞既危险也违法。","k":"交替通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在道路上发生故障，妨碍交通又难以移动时，正确的做法是（　）。","o":["开启危险报警闪光灯，并在来车方向设置警告标志","开启近光灯，在车后设置警告标志","开启远光灯，车内等候救援","开启示廓灯，在车前设置警告标志"],"a":[0],"e":"故障车妨碍交通又难以移动：开危险报警闪光灯（双闪）＋夜间同时开示廓灯和后位灯＋在来车方向（车后）设警告标志，必要时迅速报警。\n【方向陷阱】警告标志一定设在“来车方向”（车后），不是车前。","k":"故障车处置"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车上道路行驶，下列做法正确的是（　）。","o":["悬挂机动车号牌并随车携带行驶证、驾驶证","号牌可以适当遮挡边角避免曝光","行驶证放在家里，需要时再取","使用其他车辆的机动车号牌"],"a":[0],"e":"上道路行驶的机动车必须悬挂号牌（清晰完整、不得遮挡污损）、放置检验合格标志和保险标志，并随车携带行驶证、驾驶证。遮挡号牌、使用他人号牌都是严重违法。","k":"上路基本条件"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车行经漫水路或者漫水桥时，正确的做法是（　）。","o":["停车察明水情，确认安全后低速通过","加速冲过漫水路段","紧跟前车尾部通过","鸣笛后直接通过"],"a":[0],"e":"行经漫水路（桥）必须停车察明水情：水深、流速、水下路况不明时不得冒险通过，确认安全后低挡低速匀速通过，途中不得停车换挡。","k":"漫水路通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车通过铁路道口时，正确的做法是（　）。","o":["一停二看三通过，服从道口管理人员指挥","加速通过，避免在道口停车","跟紧前车一次性连续通过","道口栏杆刚抬起就抢先加速"],"a":[0],"e":"通过铁路道口：红灯亮或栏杆放下时停在停止线外；无信号时“一停（停在道口外）二看（观察左右有无来车）三通过”，确认安全后一次连续通过，不得在道口内变速、停车。","k":"铁路道口"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在道路上临时停车，下列地点中可以停车的是（　）。","o":["施划有停车泊位的路段","交叉路口 50 米以内的路段","公交车站 30 米以内的路段","急弯路 50 米以内的路段"],"a":[0],"e":"交叉路口、铁路道口、急弯路、窄路、桥梁、陡坡、隧道 50 米以内，以及公交站、加油站、消防栓 30 米以内不得停车。只有施划泊位或允许临时停车的路段可以停。\n【口诀】“口五站三”不能停。","k":"临时停车规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在没有交通信号的道路上行驶，应当在确保安全、畅通的原则下（　）。","o":["通行","鸣笛快速通过","靠左侧行驶","停车观察交警指挥"],"a":[0],"e":"没有交通信号的道路上，在确保安全、畅通的原则下通行。这是道路交通安全法的兜底原则——安全永远是第一位的。","k":"安全通行原则"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"道路交通信号包括交通信号灯、交通标志、交通标线和（　）。","o":["交通警察的指挥","导航软件的提示","其他车辆的鸣笛","乘车人的提醒"],"a":[0],"e":"道路交通信号四大类：信号灯、标志、标线、交警指挥。当信号灯与交警指挥不一致时，服从交警指挥。\n【优先级】交警＞信号灯＞标志标线。","k":"交通信号"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"交通信号灯红灯亮时，表示（　）。","o":["禁止通行","警示慢行","准许通行","仅限右转车辆通行"],"a":[0],"e":"红灯禁止通行、绿灯准许通行、黄灯警示（已越过停止线的可继续通行，未越线的应停在停止线内等候）。右转车辆在不妨碍被放行车辆行人通行的情况下可以通行，但不是“仅限右转”。","k":"信号灯含义"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇前方车辆停车排队等候或缓慢行驶时，正确的做法是（　）。","o":["依次排队行驶，不得借道超车、占用对面车道","借非机动车道超越排队车辆","穿插到排队车辆前方","鸣笛催促前车加速"],"a":[0],"e":"排队缓行时依次行驶，不得借道超车、占用对面车道、穿插等候车辆。加塞、借道超车既造成拥堵也是违法行为。","k":"排队通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车变更车道时，正确的做法是（　）。","o":["提前开启转向灯，观察后方来车情况后再变更","变更车道无须开启转向灯","同时跨越两条以上车道一次变更到位","转向灯开启的同时立即转向"],"a":[0],"e":"变更车道：提前开转向灯→观察后视镜与盲区→在不影响其他车辆正常行驶的前提下再变更，且一次只能变更到相邻车道，不得连续跨越多条车道。","k":"变更车道"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车通过有交通信号灯控制的交叉路口，向右转弯遇有同车道前车正在等候放行信号时，应当（　）。","o":["依次停车等候","借用非机动车道右转","鸣笛示意前车让行后右转","从前车左侧绕行后右转"],"a":[0],"e":"右转弯遇前车等候放行信号时，应依次停车等候，不得借用非机动车道绕行（除非有专门的右转渠化导向车道）。借道绕行极易与放行的直行非机动车发生冲突。","k":"路口右转"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在夜间没有路灯、照明不良的道路上行驶时，应当开启（　）。","o":["前照灯、示廓灯和后位灯","只有近光灯","危险报警闪光灯","只有远光灯"],"a":[0],"e":"夜间无路灯或照明不良时，开前照灯（远光）、示廓灯和后位灯；但同方向行驶的后车与前车近距离行驶时不得使用远光灯。会车时距对向来车 150 米内改用近光。","k":"灯光使用"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在夜间道路上发生故障或事故，妨碍交通又难以移动的，除开双闪外还应当开启（　）。","o":["示廓灯和后位灯","远光灯","前雾灯","转向灯"],"a":[0],"e":"夜间故障车难以移动：开危险报警闪光灯＋示廓灯＋后位灯，并设警告标志。这是“夜间三灯齐开”的固定考点。","k":"夜间故障车灯光"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车上坡行驶，即将到达坡顶时，正确的做法是（　）。","o":["减速慢行，鸣喇叭示意对向车辆（无禁鸣标志时）","加速冲上坡顶","保持原速靠左行驶","坡顶前变换远光灯照射对向"],"a":[0],"e":"接近坡顶视线盲区大（看不到对向来车与行人），应减速慢行、靠右行驶，必要时鸣喇叭（禁鸣区除外）或交替使用远近灯光提示。加速冲坡顶是最危险的做法。","k":"坡道通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车掉头时，下列地点中允许掉头的是（　）。","o":["没有禁止掉头标志、标线的路段，且不影响其他车辆和行人正常通行","铁路道口","人行横道上","隧道内"],"a":[0],"e":"铁路道口、人行横道、桥梁、急弯、陡坡、隧道，以及有禁止掉头标志标线的地点严禁掉头；没有禁止标志的路段在不妨碍交通时可以掉头。\n【口诀】“口人道桥弯隧坡，禁止掉头莫碰错”。","k":"掉头规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车倒车时，正确的做法是（　）。","o":["查明车后情况，确认安全后倒车","在铁路道口倒车调头","在高速公路上倒车返回出口","只依赖倒车影像，无须回头观察"],"a":[0],"e":"倒车前必须查明车后情况、确认安全。铁路道口、交叉路口、单行路、桥梁、急弯、陡坡、隧道内严禁倒车；高速公路上倒车记 12 分并属严重违法。\n【提示】倒车影像是辅助，不能替代观察。","k":"倒车规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车遇有前方车辆停车排队等候时，从其左侧变更车道超越排队车辆的行为属于（　）。","o":["违法的穿插超越行为","合法的超车行为","合法的借道行驶","合理的提速行为"],"a":[0],"e":"前方排队或缓行时借道超车、占用对面车道、穿插等候车辆，均属违法。排队通行考验的恰恰是驾驶人的守法意识。","k":"禁止穿插"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇到执行紧急任务的警车、消防车、救护车、工程救险车时，应当（　）。","o":["按规定让行","加速与其抢行","紧随其后借道行驶","鸣笛要求其避让"],"a":[0],"e":"遇执行紧急任务的特种车辆必须让行，不得穿插、超越。不让行特种车辆会被处罚；因此让行产生的压线等行为经核实后不予处罚。","k":"特种车辆让行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在雨天遇到撑雨伞和穿雨衣的行人在路边行走时，正确的做法是（　）。","o":["提前减速，注意观察，留出安全横向距离","加速绕过行人","持续鸣喇叭提醒","紧贴行人一侧缓慢通过"],"a":[0],"e":"雨伞、雨衣会遮挡行人和骑车人的视线与听觉，且路面湿滑，应提前减速、加大横向安全距离、随时准备停车，切忌加速绕行或鸣笛催促。","k":"雨天礼让行人"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"行车中遇到儿童在道路上嬉戏打闹时，正确的做法是（　）。","o":["降低车速，随时准备停车避让","保持原速快速通过","鸣喇叭驱赶儿童离开","加速从儿童身后绕行"],"a":[0],"e":"儿童行为缺乏预见性、可能突然横穿，遇到时应主动降低车速、必要时停车避让。鸣笛驱赶可能惊吓儿童导致意外。","k":"特殊人群避让"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇到盲人在道路上通行时，正确的做法是（　）。","o":["减速或停车避让，不得持续鸣喇叭","鸣喇叭提醒其让路","快速从其身边通过","紧跟其后缓慢行驶"],"a":[0],"e":"盲人听觉灵敏但行动缓慢且方向感不稳定，持续鸣喇叭会使其惊慌失措。应当减速停车避让，确保其安全通过后再行驶。","k":"避让盲人"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在道路上行驶，下列做法中违法的是（　）。","o":["在限速 60km/h 的路段以 55km/h 行驶","在禁止鸣喇叭路段鸣喇叭","按导向车道指示方向行驶","在潮汐车道按指示方向通行"],"a":[1],"e":"禁止鸣喇叭路段（如医院、学校、居民区周边）鸣喇叭属于违法行为。A 是遵章行驶，C、D 是按标志标线通行的正确做法。","k":"禁鸣规定"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"警告标志的作用是（　）。","o":["警告车辆、行人注意危险地点","禁止或限制车辆行人交通行为","指示车辆行人行进","传递道路方向、地点、距离信息"],"a":[0],"e":"警告标志＝黄底黑边黑图案、顶角朝上的等边三角形，提醒注意前方危险。禁令标志（白底红圈红杠）禁止限制，指示标志（蓝底白图案）指示行进，指路标志（蓝底/绿底白字）传递方向地点距离信息。","k":"警告标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"禁令标志的颜色特征是（　）。","o":["白底、红圈、红杠、黑图案","黄底、黑边、黑图案","蓝底、白图案","绿底、白图案"],"a":[0],"e":"禁令标志：白底红圈红杠黑图案，形状多为圆形，表示禁止或限制（如禁止驶入、限速、禁止停车）。\n【颜色口诀】“黄三角是警告，红圈是禁止，蓝色指示，绿色指路（高速）”。","k":"禁令标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"圆形、蓝底、白图案的交通标志属于（　）。","o":["指示标志","警告标志","禁令标志","辅助标志"],"a":[0],"e":"指示标志：圆形或矩形、蓝底白图案，指示车辆行人按规定方向地点行进（如直行、右转、环岛行驶）。","k":"指示标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"高速公路上传递道路方向、地点、距离信息的标志（指路标志）通常为（　）。","o":["绿底白字","蓝底白字","白底黑字","黄底黑字"],"a":[0],"e":"指路标志：一般道路为蓝底白字，高速公路为绿底白字。看到绿色门架式标志就是高速出口、方向信息。","k":"指路标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车看到前方有“注意儿童”警告标志时，应当（　）。","o":["减速慢行，注意观察儿童活动动态","加速通过该路段","持续鸣喇叭驱散儿童","变更到最左侧车道快速通过"],"a":[0],"e":"注意儿童标志多设于学校、幼儿园、少年宫等路段，提示驾驶人减速慢行、随时准备停车避让突然出现的儿童。","k":"注意儿童标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车遇前方有“施工”警告标志时，正确的做法是（　）。","o":["减速慢行，按施工导改标志和现场指挥有序通过","加速通过施工路段减少影响","从对向车道逆行绕过施工区","原地掉头绕行其他城市道路"],"a":[0],"e":"施工路段路况变化大（车道收窄、地面不平、人员机械作业），应提前减速、按导向标志和临时信号灯或现场指挥通行。","k":"施工路段通行"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"限速标志标明的最高时速，与前车保持的安全距离发生冲突时的正确理解是（　）。","o":["既不超限速，也要根据车速和天气路况保持足够安全距离","只要不超速就无须保持车距","保持车距重要，可以适当超速","跟紧前车防止被加塞"],"a":[0],"e":"限速和安全距离是两条并行的要求：限速是“最高值”，安全距离按“车速越快距离越大、雨雪雾加倍”执行，二者都要满足。","k":"限速与安全距离"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车看到“禁止通行”标志时，表示该标志禁止（　）。","o":["一切车辆和行人通行","仅禁止机动车通行","仅禁止行人通行","仅禁止非机动车通行"],"a":[0],"e":"“禁止通行”是白底红圈的空心圆（红圈中无横杠），禁止一切车辆和行人通行；“禁止驶入”是红底白横杠，禁止机动车驶入但行人可通行——两个标志是高频混淆点。","k":"禁止通行与禁止驶入"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"路口导向车道内的白色导向箭头的作用是（　）。","o":["指示车辆按箭头方向行驶","禁止车辆变更车道","表示该车道限时通行","警告前方有危险"],"a":[0],"e":"导向车道线内的导向箭头规定该车道的行驶方向，进入导向车道后不得变更车道，须按箭头指示方向通行（可变导向车道按 LED 指示）。","k":"导向车道线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"道路中心的黄色虚线表示（　）。","o":["允许越线超车或向左转弯（在对向无来车且安全时）","严格禁止越线","仅限公交车越线","表示车道分界"],"a":[0],"e":"中心黄色虚线：在对向无来车、保证安全的前提下可以越线超车或转弯；中心黄色实线严禁越线；黄色虚实线：实线一侧禁止越线，虚线一侧允许。","k":"中心黄色标线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"车行道边缘的白色实线的作用是（　）。","o":["指示机动车道的边缘，禁止车辆跨越","指示行人过街位置","表示临时停车区域","警告前方施工"],"a":[0],"e":"车行道边缘白色实线用于指示机动车道边缘，车辆不得跨压；虚线处在保证安全时允许临时跨越（如驶入路侧出入口）。","k":"车行道边缘线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"人行横道线（白色平行粗实线，俗称斑马线）表示（　）。","o":["准许行人横穿车行道的标线","机动车临时停放标线","非机动车通行标线","公交专用道标线"],"a":[0],"e":"人行横道线是行人过街的法定通道，车辆行经时必须减速，遇行人通过必须停车让行。","k":"人行横道线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"路面上施划的黄色网格线区域表示（　）。","o":["禁止停车区域（含排队等候时也不得进入）","允许临时停车区域","公交专用道","人行横道预告"],"a":[0],"e":"黄色网格线设于禁止停车的路段（常见于单位门口、路口），车辆不得在该区域停车，排队等候时也不得占用网格线区域停车。","k":"黄色网格线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"高速公路车行道分界线为白色虚线时，表示（　）。","o":["在保证安全的情况下可以越线变更车道","严格禁止越线变道","仅限货车越线","表示紧急停车带"],"a":[0],"e":"白色虚线＝同向车道分界，安全时可以变道；白色实线（如隧道、桥梁、出入口附近）禁止变道。高速公路最右侧另有应急车道（带“紧急停车带”标志），非紧急情况不得占用。","k":"高速公路标线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"减速标线（路面上的白色横向或菱形图案）的作用是（　）。","o":["提示驾驶人减速慢行","指示变道方向","表示允许停车","分隔对向车流"],"a":[0],"e":"减速标线多设于收费站广场、出口匝道、事故多发路段，提示驾驶人提前减速，常与“减速慢行”标志配合出现。","k":"减速标线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在路口遇到黄灯持续闪烁时，表示（　）。","o":["警示注意，确认安全后通过","禁止通行","加速抢行","停车等待绿灯"],"a":[0],"e":"黄灯持续闪烁（闪光警告信号灯）多用于夜间或危险路段路口：提示减速慢行、注意瞭望，确认安全后通过。这与“黄灯亮时已越线可通行、未越线应停”的普通黄灯不同。","k":"黄灯闪烁"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在路口遇红灯亮时，正确的做法是（　）。","o":["依次停在停止线以外等待放行","已越过停止线的继续通行，未越线的停车等候","右转车辆一律停车","借对向车道绕行"],"a":[1],"e":"红灯亮时：未越过停止线的应停在停止线以外等候；已经越过停止线的可以继续通行。右转车在无专门右转红灯且不妨碍被放行车辆行人时可右转。","k":"红灯通行规则"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在有方向指示信号灯的路口，准备左转弯时，应当（　）。","o":["待左转弯信号灯（或左转箭头灯）变绿后再左转","红灯时提前借对向车道左转","绿灯直行车道直接左转","随意在路口内待转"],"a":[0],"e":"有方向指示信号灯（箭头灯）的路口，必须按箭头指示通行：左转箭头绿灯亮才可左转。有的路口设“左转待转区”，直行绿灯亮时可先驶入待转区等候。","k":"方向指示信号灯"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交警指挥","t":"single","q":"交通警察发出减速慢行手势信号时，右手（或左手）单侧摆动，掌心朝下，表示（　）。","o":["提示车辆减速缓慢行驶","准许左方直行车辆通行","示意车辆靠边停车","准许右方车辆右转弯"],"a":[0],"e":"交警减速慢行手势：单臂向下压摆、掌心朝下。配合记忆：掌心朝前手臂平伸＝停止；手臂平伸侧摆＝直行；左转弯待转＝左臂向左下方摆动。看不懂手势时以“安全减速”为第一反应。","k":"交警手势"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交警指挥","t":"single","q":"当交通信号灯与交通警察的现场指挥不一致时，车辆应当（　）。","o":["服从交通警察的指挥","按信号灯通行","自行选择通行方式","停车等待信号灯变绿"],"a":[0],"e":"信号灯与交警指挥不一致时，服从交警指挥——现场处置（如疏导、管制）优先于固定信号设施。","k":"信号优先级"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在高速公路上遇到能见度较低的雾天时，应开启的灯光是（　）。","o":["雾灯、近光灯、示廓灯和前后位灯","只开远光灯","只开双闪灯，关闭其他灯","不开灯以免反光"],"a":[0],"e":"雾天在高速公路行驶：开雾灯、近光灯、示廓灯、前后位灯，能见度低于 100 米时还应开危险报警闪光灯（双闪），切勿开远光灯（光线被雾气漫反射，反而看不清）。","k":"雾天灯光"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车看到“傍山险路”警告标志时，正确的做法是（　）。","o":["减速慢行，注意观察山体落石和会车","加速靠山体一侧抢行","持续鸣喇叭占道行驶","紧靠道路边缘行驶不观察"],"a":[0],"e":"傍山险路标志提示临崖、落石、连续急弯风险，应减速、鸣号（无禁鸣时）、注意观察、尽量靠内侧（靠山体一侧）谨慎会车。","k":"傍山险路"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"看到“前方学校（注意儿童）”标志到学校路段时，除减速慢行外还应（　）。","o":["注意观察学生动态，随时准备停车","变道至最左侧车道行驶","鸣喇叭提示学生让路","跟紧前车快速通过"],"a":[0],"e":"学校路段学生集中、行为突发，除限速减速外，要重点观察路边和路口的学生动态，随时准备停车避让。","k":"学校路段"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"路口内施划的白色“左转弯待转区”虚线框表示（　）。","o":["同向直行绿灯亮时，左转弯车辆可进入待转区等候","任何时候左转车都可进入停车","禁止左转车辆进入的区域","右转车待转区"],"a":[0],"e":"左转弯待转区：同向直行信号绿灯亮时，左转车辆应先进入待转区等候，待左转灯（或满屏灯）放行后完成左转——提高路口通行效率。","k":"左转弯待转区"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"“潮汐车道”标志表示该车道（　）。","o":["根据早晚交通流量方向，可随指示灯变化调整行车方向","只允许潮汐式涨落时段通行","固定为单行道","仅限大型车辆通行"],"a":[0],"e":"潮汐车道（可变方向车道）通过车道上方的可变指示灯调整行车方向（早高峰进城、晚高峰出城），必须按当时的指示方向通行，切勿按习惯方向闯入。","k":"潮汐车道"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"安全跟车与车距","t":"single","q":"驾驶机动车在高速公路上以 100km/h 行驶时，与同车道前车的最小安全距离一般应保持（　）。","o":["100米以上","50米以上","30米以上","10米以上"],"a":[0],"e":"高速公路安全距离口诀：车速超过 100km/h，距离 100 米以上；低于 100km/h，可适当缩短但不小于 50 米。雨雾冰雪天气距离要加倍。\n【记忆钩子】“百码百米，五十码底”。","k":"高速公路安全车距"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"安全跟车与车距","t":"single","q":"驾驶机动车跟车行驶时，跟车距离过近的主要危害是（　）。","o":["前车紧急制动时极易发生追尾事故","油耗会增加很多","会遮挡前车视线以外的危险","导致发动机过热"],"a":[0],"e":"跟车过近意味着制动距离被压缩，前车急刹时必然追尾。跟车要遵循“2 秒法则”：以前车经过某参照物为起点，自己至少 2 秒后到达同一位置。","k":"跟车距离"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"安全跟车与车距","t":"single","q":"夜间行车遇到对向车辆持续使用远光灯、视线严重受影响时，正确的做法是（　）。","o":["减速慢行，必要时靠边停车让行","立即开启远光灯对射互晃","加速超过该车辆摆脱眩光","闭眼缓行通过眩光区"],"a":[0],"e":"遭遇远光眩目：先减速稳住方向，视线右移借用路缘参照，必要时靠边停车让行，切勿对射远光或凭感觉加速——眩光下 2 秒盲开等于闭眼行驶数十米。","k":"远光眩目处置"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"驾驶机动车超车时，正确的操作顺序是（　）。","o":["开启左转向灯，鸣喇叭（禁鸣区除外），从前车左侧超越","直接从前车右侧加速超越","与前车保持并行后寻找机会挤入","先减速靠边，从前车右侧低速超越"],"a":[0],"e":"超车规定：从左侧超越，提前开左转向灯、鸣喇叭（禁鸣区除外）确认安全后超车；超越后驶回原车道前须开启右转向灯并与被超车辆拉开必要距离。\n【铁律】超车一律从左侧，右侧超车违法。","k":"超车规定"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"下列路段中，允许超车的是（　）。","o":["视野开阔、无禁止超车标线的平直路段","铁路道口","隧道内","人行横道前"],"a":[0],"e":"铁路道口、交叉路口、窄桥、弯道、陡坡、隧道、人行横道等路段不得超车。超车前要确认前方路况开阔、对向无来车。","k":"禁止超车路段"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"驾驶机动车会车时，遇对向来车占用自己的行车道，正确的做法是（　）。","o":["减速或停车，让对方车辆先行通过","立即开启右转向灯强行抢行","持续鸣喇叭迫使对方让行","加速逼回对方车辆"],"a":[0],"e":"对方占道时“让速不让道”更安全：先减速，必要时停车，避免在恐慌中变道撞及其他目标。抢行、逼车、斗气是事故的最大诱因。","k":"会车处置"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"夜间会车时，对向来车距离自己 150 米以内，应当（　）。","o":["改用近光灯","继续使用远光灯","开启危险报警闪光灯","关闭所有灯光"],"a":[0],"e":"夜间会车应在距对向来车 150 米内改用近光灯；窄路窄桥与非机动车会车时也应使用近光灯，避免眩目引发事故。","k":"夜间会车灯光"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"起步与观察","t":"single","q":"机动车在道路边临时停车起步驶入行车道前，应当（　）。","o":["先开启左转向灯，观察后方来车，确认安全后再驶入","直接快速驶入行车道","开右转向灯驶入行车道","鸣笛示意后方车辆避让后驶入"],"a":[0],"e":"从路侧起步汇入车流：开左转向灯→观察后视镜和盲区→确认安全后平顺驶入。直接快速汇入或鸣笛要求他人避让都是危险且违法的。","k":"起步汇入车流"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"起步与观察","t":"single","q":"行车前绕车一周检查的目的不包括（　）。","o":["检查车内音响系统是否正常","观察车辆周围有无行人、障碍物","检查轮胎气压和外观状态","确认车辆下方有无儿童或小动物"],"a":[0],"e":"绕车一周的目的：观察车周环境（行人、障碍物、儿童）、车况（轮胎、灯光、车牌）。音响属于车内设备，与绕车检查无关。\n【考点】上车前绕车是科目三的法定动作，也是防“鬼探头”式碾压事故的关键。","k":"绕车检查"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"起步与观察","t":"single","q":"驾驶机动车起步前，驾驶人应当（　）。","o":["调整好座椅、系好安全带，观察后视镜并确认安全","先鸣喇叭再起步","迅速起步抢占车道","仅通过倒车影像观察周围"],"a":[0],"e":"起步标准动作：调座椅→系安全带→调整后视镜→打左转向灯→观察后视镜与盲区→确认安全后平顺起步。","k":"起步规范"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"驾驶机动车时接拨打手持电话的危害，说法正确的是（　）。","o":["分散注意力，单手操纵，反应明显变慢，极易引发事故","只是小动作，不影响驾驶","仅在高速行驶时有危害","使用免提通话同样严重违法且危害相同"],"a":[0],"e":"驾驶时接打手持电话违法（记 3 分并罚款），主要危害是注意力分散和单手操控。使用蓝牙耳机等免提方式虽能双手握盘，但通话仍会分散注意力，驾驶中应尽量少通话。","k":"分心驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"下列行为中，属于危险驾驶犯罪行为的是（　）。","o":["醉酒驾驶机动车在道路上行驶","驾驶时打电话","未系安全带驾驶","驾驶时向车外抛物"],"a":[0],"e":"醉酒驾驶（血液酒精含量≥80mg/100ml）构成危险驾驶罪，依法追究刑事责任并吊销驾驶证、5 年内不得重新申领。其余选项属交通违法，但未达刑事犯罪程度。","k":"醉酒驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"车辆驾驶人员血液中酒精含量大于或等于（　）时，构成醉酒驾驶。","o":["80mg/100ml","20mg/100ml","50mg/100ml","100mg/100ml"],"a":[0],"e":"标准分界：≥20mg/100ml 且＜80mg/100ml 为饮酒驾驶（违法）；≥80mg/100ml 为醉酒驾驶（犯罪）。\n【口诀】“20 违法，80 犯罪”。","k":"酒精含量标准"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"疲劳驾驶（连续驾驶机动车超过 4 小时未停车休息或停车休息时间少于 20 分钟）的直接危害是（　）。","o":["感知和判断能力下降，反应迟钝，极易失控引发事故","会增加轮胎磨损","导致车辆油耗上升","使导航信号变弱"],"a":[0],"e":"法规要求连续驾驶不得超过 4 小时、停车休息不少于 20 分钟。疲劳时反应迟钝、视野变窄、容易走神，是长途事故的头号诱因。感到困倦应立即驶入服务区或安全地带休息。","k":"疲劳驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"驾驶机动车向道路抛撒物品的危害不包括（　）。","o":["提升后车发动机功率","危及后方车辆和行人安全","可能遮挡后车视线引发事故","破坏环境卫生并诱发后车避让事故"],"a":[0],"e":"车窗抛物既违法又不文明：抛出物可能砸中后车、遮挡视线、诱发避让连锁事故。抛撒物品的驾驶人将被处罚。","k":"车窗抛物"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在高速公路遇到能见度小于 200 米的雾天时，最高时速和跟车距离应为（　）。","o":["不超过 60km/h，与前车保持 100 米以上距离","不超过 80km/h，保持 50 米","不超过 100km/h，保持 100 米","不超过 120km/h，保持 150 米"],"a":[0],"e":"雾天高速公路能见度规则：<200 米→≤60km/h、车距 100 米以上；<100 米→≤40km/h、车距 50 米以上；<50 米→≤20km/h 并尽快驶离高速。同时开启雾灯、近光、示廓灯、前后位灯，<100 米加开双闪。\n【口诀】“2 百 6 1 百；1 百 4 五十；5 十 2 驶离”。","k":"雾天能见度规则"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在高速公路遇能见度小于 50 米的强雾天时，除按规定开启灯光和低速行驶外，还应（　）。","o":["尽快从最近的出口驶离高速公路","在行车道上停车等待雾散","加速驶向下一个服务区","紧跟大车行驶借其引路"],"a":[0],"e":"能见度＜50 米：车速≤20km/h，并从最近的出口尽快驶离高速公路或进入服务区；严禁在行车道停车（追尾风险极高）。","k":"强雾天处置"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在雨天行驶时，路面附着力下降，正确的做法是（　）。","o":["降低车速，避免急加速、急制动和急打方向","保持原速行驶缩短淋雨时间","急制动测试路面附着力","高速通过积水路段溅开积水"],"a":[0],"e":"雨天“三急”最危险：急加速、急制动、急打方向都容易打滑失控（水滑效应）。应降速、加大车距、缓打方向、缓踩制动，涉水路段低速匀速通过。","k":"雨天驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在冰雪道路行驶时，最容易出现的危险是（　）。","o":["制动距离延长，车辆易发生侧滑失控","发动机温度过高","灯光照射距离变短","轮胎气压迅速升高"],"a":[0],"e":"冰雪路面附着力极低：制动距离成倍延长、转向易侧滑。应低速行驶、缓踩制动（利用发动机制动）、避免急打方向，有条件时安装防滑链。","k":"冰雪路面驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在夜间行驶时，光线差、视线受限，正确的做法是（　）。","o":["降低行驶速度，集中注意力观察灯光照射范围内的动态","提高车速弥补视线不足","持续使用喇叭探路","紧跟前车利用其灯光探路"],"a":[0],"e":"夜间可视范围缩小、对向眩光干扰多，必须降速并集中精力，把车速控制在与灯光照射距离相匹配的水平——“照多远、开多快”。","k":"夜间驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车从匝道驶入高速公路行车道时，应当（　）。","o":["开启左转向灯，在加速车道内提速，确认安全后汇入行车道","直接低速汇入行车道","在匝道口急刹观察后突然汇入","开启右转向灯汇入行车道"],"a":[0],"e":"高速公路汇入流程：在加速车道内将车速提到 60km/h 以上→开左转向灯→观察后视镜与盲区→在不影响正常行驶车辆的前提下汇入。低速突然汇入是高速追尾的主因之一。","k":"高速汇入"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车驶离高速公路时，应当（　）。","o":["提前开启右转向灯，驶入减速车道后降低车速驶离","在行车道上突然减速驶向出口","错过出口后立即停车倒车返回","连续跨越多条车道直接驶向出口"],"a":[0],"e":"驶离高速：提前并线至最右侧→开右转向灯→进入减速车道减速→经匝道驶离。错过出口只能继续行驶到下一出口，严禁倒车、逆行、掉头（记 12 分）。\n【口诀】“出口早准备，错过不回头”。","k":"高速驶离"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车在高速公路上发生故障需停车检查时，正确的做法是（　）。","o":["将车移至应急车道或路肩，开启双闪，在车后 150 米外设置警告标志，人员撤离到护栏外并报警","在行车道内停车立即检修","人员在车内等待救援","在车后 30 米设置警告标志即可"],"a":[0],"e":"高速故障停车标准流程：移至应急车道→开双闪→车后 150 米外放三角警示牌（夜间、雨雾天还要加距离并开示廓灯、后位灯）→人员全部撤离到护栏外→拨打报警救援电话。\n【数字】普通道路车后 50~100 米，高速公路 150 米以外。","k":"高速故障停车"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车在高速公路上行驶，下列做法中违法的是（　）。","o":["在应急车道内正常行驶","按限速标志行驶","从减速车道驶离高速","在加速车道提速后汇入"],"a":[0],"e":"应急车道是生命通道，仅限紧急情况（故障、事故、救护）使用，正常行驶占用应急车道将被记分罚款。","k":"应急车道"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车在高速公路上行驶，遇前方交通拥堵缓行时，正确的做法是（　）。","o":["依次减速排队行驶，不占用应急车道","从应急车道超车通过","穿插到大型车前方","在路肩掉头返回"],"a":[0],"e":"高速拥堵时依次排队，应急车道留给救援车辆。占用应急车道既处罚又可能耽误生命救援。","k":"高速拥堵通行"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"文明驾驶","t":"single","q":"驾驶机动车经过积水路段时，正确的做法是（　）。","o":["减速慢行或停车观察，避免溅湿行人","加速通过减少进水","紧贴路边行人通过","连续鸣喇叭示意行人躲避"],"a":[0],"e":"经过积水路段应减速慢行或停车让行，高速通过会溅起水花殃及行人与非机动车，既不文明也违法（遇行人应避让）。","k":"积水路段礼让"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"文明驾驶","t":"single","q":"行车中需要借道时，遇到后方车辆鸣喇叭催促，正确的做法是（　）。","o":["保持心态平和，按自己的节奏安全完成操作","立即加速完成操作","与其斗气别车","长时间占用道路不理会任何车辆"],"a":[0],"e":"被催促时不慌不斗：保持安全节奏完成操作。斗气驾驶（别车、逼停）属严重违法行为，极易造成重大事故。\n【文明驾驶核心】礼让、冷静、不斗气。","k":"文明驾驶心态"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶证的有效期分为 6 年、10 年和长期。驾驶人初次申领驾驶证的有效期为（　）。","o":["6 年","10 年","长期","3 年"],"a":[0],"e":"驾驶证有效期规则：初次申领 6 年；每个记分周期均未记满 12 分的，换发 10 年有效期驾驶证；10 年有效期内每个记分周期均未记满 12 分的，换发长期有效的驾驶证。\n【记忆钩子】“6 年 → 10 年 → 长期，靠的是不记满 12 分”。","k":"驾驶证有效期"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶证有效期即将届满需要换证的，驾驶人应当在驾驶证有效期满前（　）内申请换证。","o":["90 日","30 日","60 日","180 日"],"a":[0],"e":"有效期满前 90 日内向核发地或核发地以外的车辆管理所申请换证。逾期不换仍驾车属无证驾驶范畴（超过有效期 1 年以上未换证的将被注销）。\n【口诀】“期满前九十，抓紧办换证”。","k":"换证时限"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶人初次申领驾驶证后的 12 个月为实习期。实习期内驾驶机动车上高速公路行驶，正确的做法是（　）。","o":["由持相应或者更高准驾车型驾驶证 3 年以上的驾驶人陪同","任何时间都可以独自上高速","只要车流量小就可以独自上高速","在实习期内禁止申领任何驾驶证"],"a":[0],"e":"实习期为 12 个月；实习期内上高速公路，必须由持相应或更高准驾车型驾驶证 3 年以上的驾驶人陪同。此外实习期内应在车身尾部粘贴或悬挂统一实习标志。","k":"实习期规定"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶人户籍迁出原车辆管理所管辖区的，应当（　）。","o":["向迁入地车辆管理所申请换证","重新申领驾驶证","在原籍驾驶即可，全国通用无须处理","注销原驾驶证后重新考试"],"a":[0],"e":"户籍迁出原辖区或居住在核发地以外的，可向迁入地（居住地）车管所申请换证——驾驶证全国通用，换证只是信息属地化，不需要重新考试。","k":"驾驶证换证属地"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"持有 C1 驾驶证的驾驶人，可以驾驶的车辆是（　）。","o":["小型、微型载客汽车以及轻型、微型载货汽车（含低速载货汽车）","所有摩托车","中型载客汽车","重型半挂牵引车"],"a":[0],"e":"C1 准驾车型：小型、微型载客汽车，轻型、微型载货汽车，低速载货汽车，三轮汽车，以及 C2（自动挡）、C3、C4 准驾车型。C1 不含摩托车（需 E/F 证），也不含中型客车、大货车、牵引车。\n【高频陷阱】“C1 可以骑摩托车”——错。","k":"准驾车型"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"年龄在 70 周岁以上的机动车驾驶人，应当（　）。","o":["每年进行一次身体检查，并提交体检证明","每两年提交一次体检证明","无须再提交体检证明","注销驾驶证后重新申领"],"a":[0],"e":"70 周岁以上驾驶人每年体检并提交身体条件证明；未按时提交的，车管所将注销其驾驶证。此外 70 岁以上申领（含增驾）还需通过记忆力、判断力、反应力“三力”测试。","k":"高龄驾驶人体检"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶人发现驾驶证丢失后，正确的做法是（　）。","o":["申请补领，补领后原驾驶证作废不得继续使用","继续使用，被查到再说","使用朋友的驾驶证驾车","找路边办证小广告补办"],"a":[0],"e":"驾驶证丢失应向核发地或核发地以外车管所申请补领；补领后原驾驶证作废，若继续使用原证驾车将按使用失效证件处理。\n【提示】可通过“交管 12123”App 在线补领。","k":"驾驶证补领"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"机动车驾驶人的一个记分周期时间为（　）。","o":["12 个月","6 个月","24 个月","3 个月"],"a":[0],"e":"记分周期为 12 个月，满分 12 分，从初次领证之日起计算。周期内记分不满 12 分且罚款已缴清的，记分予以清除；仍有罚款未缴的，记分转入下一周期。","k":"记分周期"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"机动车驾驶人在一个记分周期内累积记分达到 12 分的，应当（　）。","o":["参加道路交通安全法律法规学习并重新考试（科目一），考试合格后清除记分","直接到车管所缴纳罚款清除记分","换领新驾驶证即可清零","找他人代为处理记分"],"a":[0],"e":"记满 12 分：扣留驾驶证→参加 7 天左右法律法规学习→重新考科目一，合格后记分清除并发还驾驶证。一个周期内两次记满 12 分的，还要加考科目三。找他人代记分属违法（双方均处罚）。","k":"记满 12 分的处理"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路或城市快速路上违法占用应急车道行驶的，一次记（　）。","o":["6 分","12 分","3 分","1 分"],"a":[0],"e":"违法占用应急车道行驶记 6 分并罚款；在高速公路、城市快速路上违法停车的记 9 分。应急车道是生命通道，非紧急情况不得占用。","k":"占用应急车道记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"饮酒后驾驶机动车的（血液酒精含量达到 20mg/100ml 以上），一次记（　），并处暂扣驾驶证 6 个月和罚款。","o":["12 分","6 分","9 分","3 分"],"a":[0],"e":"饮酒后驾驶机动车：记 12 分＋暂扣驾驶证 6 个月＋罚款 1000～2000 元；再次饮酒驾车的，处 10 日以下拘留＋罚款＋吊销驾驶证。\n【对比】饮酒驾驶营运机动车：15 日拘留＋5000 元罚款＋吊销驾驶证＋5 年内不得重新申领。","k":"饮酒驾驶处罚"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路、城市快速路上倒车、逆行、穿越中央分隔带掉头的，一次记（　）。","o":["12 分","9 分","6 分","3 分"],"a":[0],"e":"高速/城市快速路上倒车、逆行、穿越中央分隔带掉头属最危险的违法行为之一，一次记 12 分并罚款。错过出口请继续行驶至下一出口。","k":"高速倒车逆行"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车行经人行横道，不按规定减速、停车、避让行人的，一次记（　）。","o":["3 分","6 分","12 分","1 分"],"a":[0],"e":"不礼让斑马线记 3 分并罚款。斑马线前“一脚刹车”既是守法也是文明。","k":"不礼让行人记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路或城市快速路上行驶时，驾驶人未按规定系安全带的，一次记（　）。","o":["1 分","3 分","6 分","9 分"],"a":[0],"e":"驾驶人未按规定系安全带（在高速或城市快速路上行驶时）记 1 分并罚款。安全带是“生命带”，前排后排都要系。\n【联动】驾驶时接打手持电话记 3 分。","k":"安全带记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"造成交通事故后逃逸，尚不构成犯罪的，处罚正确的是（　）。","o":["记 12 分，处 200 元以上 2000 元以下罚款，可以并处 15 日以下拘留","仅记 3 分并口头教育","只赔偿损失，不予处罚","吊销驾驶证且终生禁驾"],"a":[0],"e":"事故逃逸尚不构成犯罪：记 12 分＋200～2000 元罚款＋可并处 15 日以下拘留。构成犯罪的（致人重伤、死亡等）依法追究刑事责任，吊销驾驶证且终生禁驾。\n【牢记】“逃逸一时爽，代价无限大”。","k":"肇事逃逸处罚"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"使用伪造、变造的机动车号牌、行驶证、驾驶证的，处罚正确的是（　）。","o":["记 12 分，收缴物品，处 15 日以下拘留，并处 2000 元以上 5000 元以下罚款；构成犯罪的依法追究刑事责任","仅没收假牌假证","记 6 分并罚款 200 元","扣留车辆后放行"],"a":[0],"e":"伪造、变造或使用伪造变造的牌证：记 12 分＋收缴＋拘留＋2000～5000 元罚款，构成犯罪追究刑责。使用其他车辆号牌的同样记 12 分并处罚。","k":"伪造牌证处罚"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路上行驶低于规定的最低时速的，一次记（　）。","o":["3 分","1 分","6 分","12 分"],"a":[0],"e":"高速公路有最低时速限制（一般车道不低于 60km/h），低速行驶同样是危险的“移动路障”，记 3 分并罚款。\n【记分速记】12 分最严重（酒驾、逃逸、高速倒车逆行、假牌）；9 分（遮挡号牌、高速违法停车）；6 分（闯红灯、占应急车道）；3 分（接打电话、不礼让行人、低速行驶）；1 分（不系安全带、违反禁止标线）。","k":"低速行驶记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车时拨打、接听手持电话的，一次记（　）。","o":["3 分","1 分","6 分","9 分"],"a":[0],"e":"驾驶时接打手持电话记 3 分并罚款。分心 2 秒，盲开数十米——需要接打电话请靠边停车或使用免提。","k":"接打电话记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车不按照规定避让执行紧急任务的警车、消防车、救护车、工程救险车的，一次记（　）。","o":["3 分","1 分","6 分","12 分"],"a":[0],"e":"不避让特种车辆记 3 分并罚款。让行特种车辆：在保证安全的前提下减速、变道、停车，为生命通道让行。","k":"避让特种车辆记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"车辆管理","t":"single","q":"机动车驾驶人应当于机动车驾驶证有效期满前 90 日内申请换证；机动车所有人住所在车辆管理所管辖区域内迁移的，应当（　）。","o":["向登记地车辆管理所申请变更登记","重新购买车辆","不需要办理任何手续","注销行驶证后重新上牌"],"a":[0],"e":"机动车所有人住所在车管所管辖区内迁移、姓名或联系方式变更的，应当向登记地车管所申请变更登记（备案）。\n【区分】驾驶人信息变化→换证/备案；机动车转移（过户）→转移登记。","k":"机动车变更登记"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"在道路上发生交通事故，仅造成轻微财产损失且基本事实清楚的，当事人应当（　）。","o":["先撤离现场再自行协商处理","保护现场等待交警到场","将车辆原地保留并堵塞交通","弃车离开现场"],"a":[0],"e":"轻微事故（无人伤、事实清楚、车可移动）：应当先撤离现场、恢复交通，再自行协商赔偿或使用“交管 12123”在线快处——堵路协商反而违法。\n【对比】有人伤亡或对事实有争议的，必须保护现场并立即报警。","k":"轻微事故快处"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"在道路上发生交通事故，造成人员伤亡时，驾驶人应当（　）。","o":["立即抢救受伤人员，并迅速报告执勤交警或公安机关交通管理部门","先撤离现场再报警","自行与伤者私了后离开","驾车逃离现场避免麻烦"],"a":[0],"e":"造成人身伤亡的事故：立即抢救伤员并迅速报警；因抢救伤员需要变动现场的，应当标明位置。逃逸将承担全责乃至刑事责任。\n【顺序】救人→报警→保护现场。","k":"伤亡事故处置"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"机动车在高速公路上发生交通事故，车辆可以移动时，正确的做法是（　）。","o":["将车辆移至应急车道或就近驶离，开启双闪并在来车方向 150 米外设置警告标志，人员撤离到安全区域后报警","原地保留现场等待交警","人员在车周围摆放三角牌","继续在行车道行驶寻找出口"],"a":[0],"e":"高速公路事故“车能先动就先动”：移至应急车道→开双闪→150 米外放三角牌→人员全部撤离到护栏外→报警。“车靠边、人撤离、即报警”九字诀是保命口诀。","k":"高速事故处置（九字诀）"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"发生交通事故后当事人逃逸的，承担的责任是（　）。","o":["逃逸的当事人承担全部责任，但有证据证明对方当事人也有过错的，可以减轻责任","双方各承担一半责任","不承担任何责任","仅承担刑事责任不承担民事赔偿"],"a":[0],"e":"逃逸者原则上承担事故全部责任（有证据证明对方也有过错的可减轻）。逃逸还会触发记 12 分、拘留乃至吊销驾照终生禁驾的严重后果。","k":"逃逸责任"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"道路上发生交通事故，当事人对交通事故事实及成因有争议的，应当（　）。","o":["保护现场并立即报警，等候交通警察处理","强行要求对方当场赔钱","弃车离开现场","拦截过往车辆逼停对方"],"a":[0],"e":"对事实成因有争议、有人伤、无牌无证或酒驾等情形，必须保护现场立即报警，不能私了。私了仅适用于无人伤、事实清楚、责任明确且可撤离的轻微事故。","k":"争议事故报警"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"车辆涉水后制动效能降低，正确的做法是（　）。","o":["低速行驶，轻踩制动踏板利用摩擦产生的热量蒸发水分，恢复制动效能","立即高速行驶甩干水分","直接停车不管","拉紧驻车制动器行驶"],"a":[0],"e":"涉水后制动器内进水导致制动减弱：低速行驶并间歇轻踩制动，让摩擦生热烘干制动片，确认制动恢复后再正常行驶。","k":"涉水后制动恢复"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故现场抢救伤员的基本要求是（　）。","o":["先救命、后治伤：优先处理危及生命的大出血、呼吸道阻塞等问题","先固定骨折再处理出血","先搬移伤员到路边再施救","给所有伤员喂水补充体力"],"a":[0],"e":"现场急救原则“先救命后治伤”：优先处理大出血（止血）、保持呼吸道通畅，再处理骨折等损伤。给昏迷伤员喂水可能造成窒息。","k":"急救基本原则"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故中发现伤员手指、胳膊或腿骨折时，正确的做法是（　）。","o":["用夹板（或就便器材）固定骨折部位上方和下方，避免晃动","用力将骨折处复位拉直","热敷揉搓骨折部位","不做处理等待伤员自行恢复"],"a":[0],"e":"骨折处置：固定制动——用夹板或木板等固定骨折部位上下两个关节，不要试图复位拉直，防止二次损伤；开放性骨折先止血包扎再固定。","k":"骨折固定"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"救助有骨折伤员益处最大、最应注意避免的错误做法是（　）。","o":["随意搬动、背拖脊柱受伤的伤员","拨打急救电话","在专业指导下用硬担架搬运","观察伤员呼吸和意识"],"a":[0],"e":"脊柱、颈椎受伤的伤员严禁随意搬动或背拖，否则可能加重脊髓损伤导致瘫痪。应保持伤员平卧位、固定颈部，等待专业急救人员用硬担架搬运。","k":"脊柱伤员搬运"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故现场对伤员进行心肺复苏时，胸外按压的位置和频率应为（　）。","o":["两乳头连线中点（胸骨下半部），按压频率 100～120 次/分钟","左胸心脏位置，每分钟 60 次","腹部位置，每分钟 80 次","任意位置，随意按压"],"a":[0],"e":"心肺复苏要点：按压位置为胸骨下半部（两乳头连线中点），频率 100～120 次/分钟，深度 5～6 厘米，每次按压后让胸廓充分回弹，尽量不中断。","k":"心肺复苏"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故现场有伤员大量出血时，正确的止血方法是（　）。","o":["用干净的布料、绷带直接压在出血部位加压包扎止血","在伤口上涂抹药膏","用泥土、烟灰撒在伤口上","不处理等自行凝固"],"a":[0],"e":"直接压迫止血是现场最有效的止血法：用干净布料直接按压伤口并加压包扎；四肢大出血无法控制时，可在近心端使用止血带并记录时间。严禁往伤口撒泥土烟灰（易感染）。","k":"止血方法"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"车辆发生火灾时，正确的做法是（　）。","o":["立即靠边停车、切断电源、组织人员撤离，用灭火器对准火源根部灭火","打开发动机舱盖仔细查找火源","用水直接浇灭油火","躲在车内等待火势自行熄灭"],"a":[0],"e":"车辆起火：立即停车、切断电源、组织乘员远离车辆，用灭火器对准火焰根部喷射；不要贸然完全打开引擎盖（大量进氧会助燃），可微开缝隙喷射。油类火灾严禁用水浇。","k":"车辆灭火"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"搬运昏迷或有窒息危险的伤员时，正确的做法是（　）。","o":["采取侧卧位（或侧俯卧位）搬运，保持呼吸道通畅","采取仰卧位搬运","采取俯卧位搬运","抱起伤员立位搬运"],"a":[0],"e":"昏迷伤员仰卧时舌后坠、呕吐物易堵塞呼吸道，应采取侧卧位（复原卧位）搬运并清理口鼻异物，保持呼吸道通畅。","k":"昏迷伤员搬运"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"道路上发生交通事故，驾驶人未造成人身伤亡且对事实及成因无争议却拒不撤离现场的，交通警察将（　）。","o":["予以强制撤离，并依法处理","帮助其协商赔偿","不予理会","当场吊销其驾驶证"],"a":[0],"e":"应当自行撤离现场而不撤离、造成交通堵塞的，交警可以强制撤离并依法处罚。快处快撤既是义务也是保护自己。","k":"拒不撤离的后果"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"抢救失血过多的伤员时，下列做法中错误的是（　）。","o":["给伤员大量饮水补充水分","采取压迫止血措施","及时拨打 120 急救电话","注意给伤员保暖"],"a":[0],"e":"失血伤员不宜大量饮水（可能需要手术麻醉，且昏迷时饮水会窒息）；保暖、压迫止血、呼叫 120 才是正确做法。\n【急救铁律】不给伤员随意进食进水。","k":"失血伤员处理"}],"jk4":[{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶机动车起步前，驾驶人应对车辆周围进行绕车观察，最主要的目的是（　）。","o":["确认车辆周围有无行人、儿童及障碍物，避免起步事故","检查车辆油耗多少","观察天气情况","欣赏车辆外观有无划痕"],"a":[0],"e":"车辆盲区内的行人、儿童是起步事故的高发原因，绕车一周确认安全是起步前的必做动作，同时顺带检查轮胎、车牌状态。","k":"起步观察"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆汇入主路车流时，正确的做法是（　）。","o":["开启转向灯，观察主路情况，确认安全后汇入","加速直接汇入主路","低速缓慢汇入，让主路车辆避让","鸣喇叭示意主路车辆停车让行"],"a":[0],"e":"汇入主路必须“一开灯、二观察、三汇入”，在不影响主路车辆正常行驶的前提下汇入。直接汇入或低速汇入都会迫使主路车辆紧急避让。","k":"汇入主路"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在交叉路口左转弯时，应提前（　）。","o":["开启左转向灯，驶入左转弯车道","开启右转向灯，驶入右转弯车道","在直行车道直接左转","不开转向灯，凭经验转弯"],"a":[0],"e":"转弯、变更车道、超车、掉头等都要提前开启相应转向灯，并提前驶入对应导向车道。路口内临时变道左转极易与直行车流冲突。","k":"左转弯规范"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆行经学校附近路段时，正确的做法是（　）。","o":["减速慢行，注意观察学生动态，随时准备停车避让","保持正常车速通过","鸣喇叭警告学生让路","加速在学生放学前冲过"],"a":[0],"e":"学校路段学生集中、突发横穿多，应主动减速、加强观察、随时准备停车。上下学高峰还应服从交警和护学岗指挥。","k":"学校路段"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆通过窄路、窄桥与会车时，正确的做法是（　）。","o":["减速靠右通过，必要时选择宽阔地点停车让行","加速抢先通过","鸣喇叭迫使对方让行","紧靠道路中心行驶"],"a":[0],"e":"窄路窄桥会车空间有限：减速靠右，有让行条件的一方应停车让行，确保双方安全交会。","k":"窄路会车"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"行车中遇到转向失控、制动失灵等紧急故障时，驾驶人首先应当（　）。","o":["握稳方向，控制住车辆行驶轨迹","立即跳车逃生","猛拉驻车制动器","关闭发动机滑行"],"a":[0],"e":"任何紧急情况的第一步都是“稳住方向、控制车辆”，方向失控时乱打方向或跳车都会造成更严重后果。握稳方向后再逐级减速、开启双闪、靠边停车。","k":"紧急故障第一反应"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在高速公路行驶时，发现轮胎气压过低或出现异常，正确的做法是（　）。","o":["逐渐减速，开启右转向灯驶入应急车道或就近驶离高速检查","立即紧急制动停车检查","继续行驶到目的地再处理","高速行驶中停车更换轮胎"],"a":[0],"e":"高速上轮胎异常严禁急刹与猛打方向，应稳住方向、松开油门逐渐减速，开右转向灯驶入应急车道处理，并按规定摆放警告标志。","k":"轮胎异常处置"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆变更车道时，应当提前开启转向灯并（　）。","o":["通过后视镜观察后方和侧方交通情况","加速快速插入目标车道","鸣喇叭通知其他车辆","降低车速缓慢平移"],"a":[0],"e":"变道三步：开灯预告→观察后视镜和盲区→确认安全后平顺变更。加速插入或缓慢平移都会造成后车反应不及。","k":"变更车道观察"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在道路上跟车行驶时，最重要的是（　）。","o":["根据前车速度和路况保持动态安全距离","始终紧跟前车不掉队","频繁变更车道寻找更快车道","紧盯前车尾灯忽略其他方向"],"a":[0],"e":"安全距离是动态的：随车速、天气、载重调整。速度快、雨雾天、重载时距离要加大。跟车还要观察前车的前车，预判连带制动。","k":"动态跟车"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆遇到前方车辆正在执行紧急任务（救护车、消防车）时，应当（　）。","o":["减速避让，在条件允许的车道停车让行","加速与其并行","紧跟其后利用其开道","鸣喇叭要求其等待"],"a":[0],"e":"为特种车辆让行是法定义务：同向的在保证安全下变道让出通道，路口的在保证安全后停车让行——因让行产生的交通违法经核实后不予处罚。","k":"避让特种车辆"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在弯道上行驶时，正确的做法是（　）。","o":["减速、鸣号（禁鸣区除外）、靠右行","提前加速冲过弯道","弯道中踩制动减速","占用对向车道切弯"],"a":[0],"e":"弯道驾驶“减速、鸣号、靠右行”三原则：入弯前减速（弯中制动易侧滑），盲区弯道鸣号提示，全程靠右不占对向车道。","k":"弯道驾驶"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆下长坡时，正确的控制车速的方法是（　）。","o":["利用发动机牵阻作用控制车速，配合行车制动器","持续踩住行车制动器不放","挂空挡滑行省油","拉紧驻车制动器下坡"],"a":[0],"e":"下长坡长时间连续踩制动会导致制动器过热失效（热衰退），应挂低挡利用发动机制动控制车速，配合点刹。空挡滑行既违法又失去发动机牵阻。","k":"下长坡控速"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆通过隧道时，正确的做法是（　）。","o":["提前开启前照灯，按限速行驶，隧道内不得变更车道","进入隧道后减速开远光灯观察","在隧道内超车尽快通过","隧道口不减速直接进入适应光线"],"a":[0],"e":"隧道驾驶：提前开灯（进暗处眼睛需要适应）、按隧道限速行驶、隧道内禁止变更车道和超车，保持车距，禁止停车。","k":"隧道驾驶"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆行经人行横道前，遇绿灯放行但行人尚未通过完毕时，应当（　）。","o":["停车让行人先行通过","鸣喇叭催促行人","加速从行人身后绕过","保持车速从人群中间通过"],"a":[0],"e":"绿灯放行也必须等斑马线上的行人走完——路权让位于生命权。此时若后方鸣笛催促，也应坚持让行。","k":"斑马线让行"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在雨天遇到非机动车驾驶人穿戴雨衣影响视线时，应当（　）。","o":["减速慢行，加大横向间距，随时准备停车","正常车速紧贴通过","鸣喇叭提醒其注意","加速从其左侧超越"],"a":[0],"e":"雨衣遮挡视线、雨天人车不稳，与非机动车交会或超越时应加大横向距离、低速通过，防止其突然晃动或滑倒。","k":"雨天非机动车"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"行车中遇到其他车辆加塞时，正确的做法是（　）。","o":["减速礼让，保持安全距离","加速顶住不让其加塞","鸣喇叭并长时间逼鸣","故意碰撞示意警告"],"a":[0],"e":"遇到加塞“让速不让道”，减速留出空间避免剐蹭，斗气别车会构成违法乃至犯罪。安全永远优先于“一口气”。","k":"应对加塞"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"驾驶车辆时发现后方车辆鸣喇叭、闪灯示意超车，正确的做法是（　）。","o":["在保证安全的前提下，适当减速靠右让其超越","加速行驶不让其超越","故意压低车速阻拦","开启双闪逼其后车绕行"],"a":[0],"e":"后车示意超车时应礼让：减速靠右，为对方留出超车空间。斗气阻拦属于报复性驾驶行为，极易引发恶性事故。","k":"礼让后车"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"下列驾驶行为中，属于文明驾驶的是（　）。","o":["夜间会车时交替使用远近光灯提示后改用近光","雨天高速通过积水路段","小区内鸣喇叭催促行人","车窗抛物减轻车内垃圾"],"a":[0],"e":"文明驾驶体现在细节：夜间规范用灯、雨天减速防溅水、小区禁鸣、不向车外抛物。这些细节直接反映驾驶人的素养。","k":"文明驾驶行为"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"驾驶车辆遇到其他驾驶人发生交通事故需要帮助时，正确的做法是（　）。","o":["在保证安全的前提下停车协助，保护现场并帮助报警","围观拍照发朋友圈","加速离开避免麻烦","借机超车快速通过"],"a":[0],"e":"助人为乐是驾驶人职业道德的要求：在确保自身安全的前提下停车协助，帮助摆放警示标志、报警求救。围观堵路、拍照传播都是不当行为。","k":"助人互助"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"驾驶车辆通过居民小区时，应当（　）。","o":["低速慢行，避让行人和宠物，不鸣喇叭","正常车速通过小区道路","鸣喇叭开道提醒行人","借小区道路抄近道加速通过"],"a":[0],"e":"小区内老人儿童密集、视线遮挡多：低速、禁鸣、随时避让。多数小区道路还有限速 5~15km/h 的规定。","k":"小区驾驶"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"关于驾驶人在行车中的着装与操作，正确的做法是（　）。","o":["穿鞋底防滑、软硬适中的鞋子驾驶，不穿拖鞋或高跟鞋","穿拖鞋驾驶更凉快灵活","高跟鞋跟部便于踩踏制动","赤脚踩踏踏板更灵敏"],"a":[0],"e":"拖鞋、高跟鞋、厚底靴都会影响踏板的踩踏力度与精度，是明确的危险行为。驾驶应穿软硬适中、防滑的平底鞋。","k":"驾驶着装"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在雨天行驶，遇前方路面有积水时，正确的做法是（　）。","o":["减速或停车观察水深和水下路况，低速匀速通过","高速冲过积水路段","紧跟前车车辙快速通过","停车在水中休息观察"],"a":[0],"e":"积水路段“一慢二看三通过”：不明水深绝不冒险，通过时低挡匀速、不停车不换挡，通过后轻踩制动恢复制动效能。","k":"积水路段"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在冰雪道路行驶时，转向和制动都应（　）。","o":["轻缓柔和，避免急打方向和急踩制动","快速果断，一步到位","与干燥路面操作相同","先加速再减速"],"a":[0],"e":"冰雪路面附着力极低，“柔和”是关键词：缓加速、缓制动（多用发动机制动）、缓打方向，加大跟车距离，防止侧滑甩尾。","k":"冰雪路面操作"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"车辆在冰雪路面发生侧滑时，正确的做法是（　）。","o":["松抬加速踏板，向侧滑的一侧适当转动方向盘修正","立即紧急制动","向侧滑相反方向猛打方向","拉紧驻车制动器"],"a":[0],"e":"车辆侧滑（甩尾）修正口诀“顺滑打轮”：松油门、向侧滑方向轻转方向盘，待车身回正后再缓加油。紧急制动和反向猛打都会加剧侧滑。","k":"侧滑修正"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在雾天行驶时，正确的做法是（　）。","o":["开启雾灯和危险报警闪光灯，低速行驶，多鸣喇叭提示","开启远光灯照亮前方","紧跟前车借其灯光行驶","加速抢在雾变大前通过"],"a":[0],"e":"雾天：开雾灯＋双闪（必要时近光、示廓灯）、降速、勤按喇叭提示位置；远光灯会被雾气漫反射形成白幕，反而更看不清。","k":"雾天驾驶"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在夜间会车时对向车辆灯光眩目、视线受阻，应当（　）。","o":["减速慢行，必要时靠边停车，视线右移避开光源","开启远光灯对射","闭眼片刻缓解眩目","加速冲过眩目区"],"a":[0],"e":"眩光会形成 2 秒左右的视觉盲区，减速或停车是唯一安全做法；视线可稍向右移借助路缘参照。对射远光会害人害己。","k":"夜间眩光"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆通过连续弯道（山区弯路）时，正确的做法是（　）。","o":["减速慢行，鸣号提示，注意观察弯道尽头的来车","连续切弯占用对向车道","弯中加速体验操控","紧贴弯道外侧行驶"],"a":[0],"e":"山区连续弯道盲区多：“减速、鸣号、靠右”贯穿每个弯道，绝不占用对向车道切弯，注意观察凸面镜和弯道标志提示。","k":"连续弯道"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆行经施工路段时，正确的做法是（　）。","o":["按施工标志和临时导向行驶，减速慢行，与前车保持较大距离","加速通过减少暴露时间","紧跟前车尾部通过","在施工路段停车询问路线"],"a":[0],"e":"施工路段车道收窄、路面不平、人员机械混行：按导改标志减速通行、加大车距、注意观察工作人员手势。","k":"施工路段"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"夜间驾驶车辆会车前，正确的观察方法是（　）。","o":["提前观察前方道路情况，减速并改用近光灯","到两车交会时再观察减速","凭灯光判断对方车型不减速","开远光灯先照亮对向车辆"],"a":[0],"e":"夜间会车要“提前”：提前降速、提前改近光、提前观察路侧，避免在交会瞬间手忙脚乱。","k":"夜间会车"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行驶中轮胎突然爆裂（爆胎）时，正确的做法是（　）。","o":["紧握方向盘，保持行驶方向，轻踏制动踏板缓慢减速停车","立即紧急制动停车","猛打方向盘修正方向","迅速松开方向盘保护自己"],"a":[0],"e":"爆胎瞬间的正确反应：紧握方向保持直线行驶→松油门→轻踩制动缓慢减速→开双闪靠边停车。急刹和猛打方向会导致车辆失控翻车。","k":"爆胎处置"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中制动突然失灵时，驾驶人应当（　）。","o":["握稳方向，抢挂低速挡利用发动机制动减速，同时使用驻车制动器","立即跳车弃车","猛踩制动踏板不放松","关闭点火开关滑行减速"],"a":[0],"e":"制动失灵处置：握稳方向→抢挂低挡（发动机制动）→缓拉驻车制动（分段拉紧）→开双闪鸣笛警示→利用路边障碍物（缓冲物）摩擦减速。行驶中关闭点火开关会失去转向助力且锁死方向盘（带锁车型），绝对禁止。","k":"制动失灵"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中发动机突然熄火（转向仍有助力余量）时，正确的做法是（　）。","o":["握稳方向，减速开启右转向灯，滑行靠边停车检查","立即重新点火启动","紧急制动停车在行车道内","立即关闭一切电器"],"a":[0],"e":"行驶中熄火：控制方向是第一位的（熄火后液压助力会逐渐消失，转向变沉），靠滑行减速、开右转向灯靠边停车，设置警示后排查。","k":"行驶中熄火"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆转向突然失控时，正确的做法是（　）。","o":["握稳方向，及时减速，开启危险报警闪光灯并鸣喇叭提示，选择安全地点停车","立即紧急制动到停车","继续加速保持行驶","弃车跳车逃生"],"a":[0],"e":"转向失控：减速、开双闪、鸣笛警示其他车辆，果断选择安全地点（空旷处、缓冲物较少处）停车；只有车速降下来失控的后果才可控。","k":"转向失控"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆行驶中发生侧滑时，应向（　）转动方向盘进行修正。","o":["侧滑的一侧（后轮侧滑方向）","侧滑的相反一侧","任意一侧","固定向左侧"],"a":[0],"e":"后轮侧滑（甩尾）修正口诀“顺打方向”：车尾向哪边甩，方向就向哪边转，把车头“带”回来。切忌紧急制动（会加重失控）。","k":"侧滑修正方向"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆落入水中时，正确的逃生方法是（　）。","o":["保持冷静，待车身下沉至水浸过车窗后，深吸气开门或砸窗游出","第一时间猛力推车门逃生","在车内等待救援不采取任何措施","立即爬到车顶等待"],"a":[0],"e":"车辆落水初期水压差导致车门推
