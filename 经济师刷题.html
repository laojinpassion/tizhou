不开：系好安全带保持镇定，待水进入车厢接近充满、内外压力接近时，深吸一口气开门或用安全锤砸碎侧窗四角游出。安全锤应击打玻璃四角。","k":"落水逃生"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中发动机舱起火时，正确的做法是（　）。","o":["立即靠边停车熄火，组织人员撤离，微开发动机舱盖用灭火器对准火源根部喷射","立即打开发动机舱盖查找火源","用水浇灭发动机火焰","继续行驶赶到消防队"],"a":[0],"e":"发动机舱起火：停车熄火断电→人员撤离→舱盖微开缝隙灭火（全开会让大量空气涌入助燃）→对准根部喷射。油类火灾禁止用水浇。","k":"车辆起火"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆即将发生正面碰撞、无法避免时，正确的做法是（　）。","o":["顺向撞向危险较小的一侧，同时紧急制动，驾驶人身体后靠紧贴座椅","打开车门跳车","向副驾驶一侧躲避方向","猛打方向盘抢救方向"],"a":[0],"e":"正面碰撞无法避免时：紧急制动降低相对速度，身体后靠（远离方向盘气囊弹出区），顺向转向选择损失较小的一侧碰撞。高速时猛打方向极易侧翻失控。","k":"碰撞避险"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆翻车时，车内人员的正确做法是（　）。","o":["抓紧车内固定物（方向盘、扶手等），身体紧贴座椅固定，翻转停止后再逃生","在翻转过程中跳车","抱头在车内随意翻滚","立即解开安全带站起逃生"],"a":[0],"e":"翻车过程中跳车极其危险（易被车辆碾压）：抓紧固定物、身体紧贴座椅背靠、双脚蹬住，翻转停止确认安全后再破窗或开门撤离。","k":"翻车避险"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中遇到牲畜或畜力车时，正确的做法是（　）。","o":["减速慢行，不鸣喇叭，保持较大安全距离","鸣喇叭驱赶牲畜让路","加速绕过牲畜","紧贴牲畜缓慢通过"],"a":[0],"e":"牲畜受鸣喇叭惊吓会失控冲撞，应减速靠近内侧缓慢通过或停车让行，切勿鸣笛驱赶。","k":"避让牲畜"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"抢救事故受伤人员时，应当（　）。","o":["先处理危及生命的伤情，如大出血和呼吸道阻塞","先处理轻微擦伤","先等待伤员家属到场","给伤员服用止痛药物"],"a":[0],"e":"现场急救原则“先救命后治伤”：优先处理气道阻塞和大出血等致命伤情，同时拨打 120，不要随意搬动疑似脊柱损伤的伤员。","k":"急救优先级"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"搬运昏迷或有窒息危险的伤员时，应采取（　）。","o":["侧卧位，保持呼吸道通畅","仰卧位","俯卧位","坐位"],"a":[0],"e":"昏迷伤员侧卧（复原卧位）可防止舌后坠和呕吐物堵塞气道。仰卧可能加重窒息，搬运时还要特别注意保护颈椎。","k":"昏迷伤员体位"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"伤员较大动脉出血时，现场首选的急救方法是（　）。","o":["在伤口近心端用手指或绷带压迫止血","在伤口处涂抹药膏","让伤员平躺休息自行止血","用纸巾轻擦伤口"],"a":[0],"e":"动脉大出血凶险，应立即在近心端压迫止血（指压或加压包扎），并尽快送医；使用止血带要标注时间，每隔一段时间放松一次。","k":"大出血急救"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"伤员被烧伤后，正确的现场处理方法是（　）。","o":["用清洁冷水冲洗降温，小心除去衣物，不要弄破水泡","在烧伤处涂抹酱油或牙膏","立即撕除粘连的衣物","用针挑破水泡放液"],"a":[0],"e":"烧烫伤急救“冲、脱、泡、盖、送”：冷水冲降温→小心脱去衣物→冷水浸泡→清洁敷料覆盖→尽快送医。涂抹酱油牙膏会污染创面，挑破水泡易感染。","k":"烧伤处理"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"对硫化氢、一氧化碳等有害气体中毒的伤员，正确的做法是（　）。","o":["将伤员迅速移至通风良好的地方，保持呼吸道通畅","在原地进行人工呼吸","给伤员戴上原有口罩","先给伤员喂水稀释毒物"],"a":[0],"e":"气体中毒急救第一步是脱离中毒环境：将伤员移到上风向通风处，解开衣领保持呼吸通畅，呼吸停止的立即进行心肺复苏。施救者也要注意自身防护，避免盲目进入中毒环境。","k":"气体中毒急救"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"救助腐蚀性化学品溅到皮肤上的伤员时，正确的做法是（　）。","o":["用大量清水反复冲洗接触部位","用布巾用力擦拭","涂抹中和药膏后再冲洗","包扎后等待送医处理"],"a":[0],"e":"腐蚀品灼伤第一时间用大量流动清水持续冲洗（至少 15 分钟以上），稀释并冲走化学品，再脱去污染衣物送医。先擦拭会扩大灼伤面积。","k":"化学品灼伤"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"对无骨端外露的开放性伤口出血伤员进行包扎时，正确的做法是（　）。","o":["用敷料覆盖伤口后进行加压包扎","将伤口内的异物拔出后再包扎","用泥土止血后再包扎","暴露伤口自然干燥"],"a":[0],"e":"开放性伤口：覆盖敷料加压包扎止血。伤口内的异物（钢筋、玻璃等）不要自行拔出——拔出可能引发大出血，应由医护人员处理。","k":"包扎原则"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到伤员心脏骤停时，应立即进行心肺复苏。关于按压与人工呼吸的比例，正确的是（　）。","o":["30 次胸外按压配合 2 次人工呼吸","15 次按压配合 5 次人工呼吸","10 次按压配合 10 次人工呼吸","只按压不做人工呼吸"],"a":[0],"e":"成人心肺复苏按压:吹气＝30:2，按压频率 100～120 次/分钟、深度 5～6 厘米，持续到专业急救人员到达或伤员恢复自主呼吸。","k":"心肺复苏比例"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆运载易燃易爆或腐蚀性危险货物时，正确的做法是（　）。","o":["按规定取得相应资质和许可，配备专用车辆并悬挂警示标志","用普通私家车少量运输","与其他货物混装运输","夜间运输躲避检查"],"a":[0],"e":"危险货物运输需专用资质车辆、押运员和许可路线。普通车辆运输危险品属于严重违法行为，发生泄漏后果不堪设想。","k":"危险品运输"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"车辆行经高速公路服务区休息时，正确的做法是（　）。","o":["感到疲劳即进服务区休息，避免疲劳驾驶","坚持到目的地再休息","在应急车道临时停车休息","连续驾驶超过 4 小时也无需休息"],"a":[0],"e":"连续驾驶不得超过 4 小时、休息不少于 20 分钟。服务区休息既守法也防疲劳——疲劳驾驶的反应速度接近酒驾。","k":"服务区休息"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇前方突发自然灾害（山体滑坡、泥石流）时，正确的做法是（　）。","o":["立即减速停车观察，确认安全后再通行或选择绕行，及时向有关部门报告","加速冲过灾害区域","紧跟前车盲目前进","在灾害点附近停车拍照"],"a":[0],"e":"遇自然灾害：停车观察、生命第一，绝不在滑坡、泥石流下方停留；确认无法通行时选择安全路线绕行并报告，帮助预警后方车辆。","k":"自然灾害处置"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"关于安全带的作用，正确的说法是（　）。","o":["发生碰撞时能有效约束乘员身体，大幅降低死亡和重伤风险","只在高速行驶时需要系","后排乘客无须系安全带","安全带会妨碍紧急逃生"],"a":[0],"e":"安全带是车辆碰撞时最重要的被动安全装置：正确系用可使正面碰撞死亡率降低约 57%。前后排都要系，儿童应使用安全座椅。","k":"安全带"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到突发地震等灾害需要紧急避险时，正确的做法是（　）。","o":["减速停车在开阔地带，远离桥梁、隧道、高楼和广告牌","加速通过桥梁尽快离开","停在桥下或隧道内躲避","紧贴高层建筑停车"],"a":[0],"e":"地震避险：减速停车于开阔地带，远离桥梁隧道高楼等易倒塌物；车内是比较安全的避险空间，人员应留在车内观察，听从统一指挥。","k":"地震避险"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到道路交通事故现场有人受伤昏迷并停止呼吸时，在等待急救车的同时应当（　）。","o":["立即就地进行心肺复苏，有条件的配合人工呼吸","掐人中等待伤员苏醒","给伤员喂水唤醒","搬动伤员到阴凉处观察"],"a":[0],"e":"呼吸心跳骤停的黄金抢救时间只有 4 分钟：立即胸外按压＋人工呼吸（30:2），不要浪费时间等待，除非现场有危险必须先转移伤员。","k":"呼吸骤停急救"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆行经高速公路收费站时，正确的做法是（　）。","o":["提前减速，按车道指示依次通行，保持车距防止追尾","临近收费站急刹排队","从 ETC 车道强行通过未安装设备的通道","在收费站前随意变道加塞"],"a":[0],"e":"收费站是高速上的高危节点：提前减速、按标志分道（ETC/人工）、保持车距、不随意变道。ETC 车道需保持规定车速（一般≤20km/h）通过。","k":"收费站通行"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"关于驾驶车辆时的视线盲区，正确的说法是（　）。","o":["车辆A柱、后视镜范围外、车头车尾附近都存在盲区，起步转弯要多观察","配备全景影像的车辆没有盲区","只有货车才有盲区","盲区可以完全通过后视镜消除"],"a":[0],"e":"任何车辆都有盲区：A柱遮挡、后视镜死角、车头车尾低矮区域。起步、转弯、变道都要转头观察补足盲区，宁停三分不强抢一秒。","k":"车辆盲区"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到交通非常拥堵、长时间停滞不前时，正确的做法是（　）。","o":["保持耐心依次排队，关闭发动机减少怠速排放","频繁变道钻空抢行","下车活动堵塞道路","占用应急车道绕行"],"a":[0],"e":"拥堵时依次排队、保持车距、不抢行不加塞，长时间停滞可熄火等待。频繁变道只会让整体通行效率更低，还容易剐蹭。","k":"拥堵耐心"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆经过事故现场，看到伤员倒地需要救助时，正确的做法是（　）。","o":["在不妨碍交通的前提下停车施以援手，或帮助报警疏导","加速离开避免责任","下车拍照留念","鸣喇叭提醒伤员离开"],"a":[0],"e":"救助他人既是道德义务也受法律保护（民法典“好人条款”：自愿施救造成受助人损害的，救助人不承担民事责任）。在确保安全的前提下应积极施救。","k":"施救义务"}],"kj":[{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"会计的最基本职能是（　）。","o":["核算职能","监督职能","预测职能","决策职能"],"a":[0],"e":"会计核算（反映）是最基本职能，贯穿经济业务事前、事中、事后全过程；监督（控制）是与之并列的基本职能。预测、决策属于拓展职能。","k":"会计的职能"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"企业以取得收取款项的权利或支付款项的义务为基础确认收入和费用，这一记账基础称为（　）。","o":["权责发生制","收付实现制","永续盘存制","实地盘存制"],"a":[0],"e":"企业会计的确认、计量和报告以权责发生制为基础——按权利义务的归属期确认，而非按现金收付。收付实现制主要用于行政事业单位预算会计。","k":"权责发生制"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"下列各项中，属于流动资产的是（　）。","o":["存货","固定资产","无形资产","长期股权投资"],"a":[0],"e":"流动资产是预计在一个正常营业周期内变现、出售或耗用的资产，包括货币资金、交易性金融资产、应收款项、存货等。固定资产、无形资产、长期股权投资属于非流动资产。","k":"会计要素（资产）"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"企业购入原材料一批已验收入库，货款尚未支付。该项业务对会计等式的影响是（　）。","o":["资产增加，负债增加","资产内部一增一减","资产增加，所有者权益增加","负债减少，资产减少"],"a":[0],"e":"购料未付款：原材料（资产）增加，应付账款（负债）增加——等式两边同增，总额平衡。“资产＝负债＋所有者权益”恒等关系不受影响。","k":"会计等式"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"借贷记账法下，负债类账户的结构特点是（　）。","o":["贷方登记增加，借方登记减少，期末余额一般在贷方","借方登记增加，贷方登记减少","借贷方均登记增加","无余额"],"a":[0],"e":"负债及所有者权益类账户：贷方记增加、借方记减少，余额在贷方。与资产类账户（借增贷减，余额在借方）方向相反。","k":"借贷记账法","fig":"taccount"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"总分类账户与明细分类账户平行登记的要点不包括（　）。","o":["登记的原始凭证不同","会计期间相同","借贷方向相同","登记金额相等"],"a":[0],"e":"平行登记“四同”：同依据、同期间、同方向、同金额——总账与明细账使用的是同一原始凭证，A 恰是相同点而非不同点。\n【核对关系】总账余额＝所属明细账余额之和。","k":"平行登记"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"企业对财产物资进行清查时，对库存现金的清查方法是（　）。","o":["实地盘点法","技术推算法","函证核对法","抽样检查法"],"a":[0],"e":"库存现金采用实地盘点（突击盘点），编制库存现金盘点报告表；银行存款采用与银行对账单核对（编制余额调节表）；往来款项用函证核对。","k":"财产清查"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"下列各项中，属于会计信息质量要求中“谨慎性”体现的是（　）。","o":["对存货计提跌价准备","对购入的设备计提折旧","按实际成本计量存货","编制资产负债表"],"a":[0],"e":"谨慎性要求不高估资产和收益、不低估负债和费用：计提减值准备、加速折旧是典型应用。计提折旧是正常的成本分摊，购入设备按实际成本是历史成本计量。","k":"会计信息质量要求"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业现金清查中发现库存现金短款，无法查明原因的部分，经批准后应计入（　）。","o":["管理费用","营业外支出","其他应收款","财务费用"],"a":[0],"e":"现金短缺：有责任人的计入其他应收款（应向责任人赔偿），无法查明原因的计入管理费用。现金溢余无法查明原因的计入营业外收入——方向相反，注意对比。","k":"库存现金清查"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业销售商品一批，价款 100 000 元，增值税销项税额 13 000 元，代购货单位垫付运费 2 000 元。该企业应确认的应收账款金额为（　）。","o":["115 000 元","100 000 元","113 000 元","102 000 元"],"a":[0],"e":"应收账款入账金额＝价款＋增值税销项税额＋代垫运杂费＝100 000＋13 000＋2 000＝115 000 元。\n【公式】应收账款＝售价×(1＋税率)＋代垫费用。","k":"应收账款入账价值"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业采用备抵法核算应收款项减值，计提坏账准备时应借记的科目是（　）。","o":["信用减值损失","管理费用","资产减值损失","坏账准备"],"a":[0],"e":"计提坏账准备：借记“信用减值损失”，贷记“坏账准备”（坏账准备是应收款项的备抵科目）。实际发生坏账核销时才借记坏账准备、贷记应收账款。","k":"应收款项减值"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业购入交易性金融资产（以公允价值计量且其变动计入当期损益），持有期间公允价值上升，应贷记的科目是（　）。","o":["公允价值变动损益","投资收益","其他综合收益","营业外收入"],"a":[0],"e":"交易性金融资产持有期间的公允价值变动计入当期损益：上升借记“交易性金融资产——公允价值变动”，贷记“公允价值变动损益”。处置时的价差再计入投资收益。","k":"交易性金融资产"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"下列各项中，不应计入存货采购成本的是（　）。","o":["入库后的仓储费用","购买价款","运输途中的合理损耗","入库前的挑选整理费用"],"a":[0],"e":"存货采购成本＝购买价款＋相关税费＋运输费、装卸费、保险费＋入库前的挑选整理费等。入库后的仓储费用计入当期损益（管理费用等），不计入存货成本。","k":"存货成本"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"某企业采用月末一次加权平均法核算发出存货。月初库存 A 材料 100 件、成本 1 000 元；本月购入 300 件、成本 3 600 元；本月发出 200 件。本月发出材料的成本为（　）。","o":["2 300 元","2 000 元","2 400 元","1 150 元"],"a":[0],"e":"加权平均单位成本＝(1 000＋3 600)÷(100＋300)＝4 600÷400＝11.5 元/件；发出成本＝200×11.5＝2 300 元。\n【公式】一次算出平均单价，再乘发出数量。","k":"月末一次加权平均法"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"期末存货成本高于其可变现净值时，企业应当（　）。","o":["按可变现净值计量，计提存货跌价准备","仍按成本计量不作处理","按两者之和计量","将差额计入营业外支出"],"a":[0],"e":"存货按成本与可变现净值孰低计量：成本高于可变现净值的差额计提存货跌价准备（借记资产减值损失——存货跌价损失）。以前减记的影响已消除的，可在原计提范围内转回。","k":"存货跌价准备"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业购入一台需要安装的设备，价款及增值税、安装费合计 113 万元（其中价款 100 万元、增值税 13 万元），安装完成后该固定资产的入账价值为（　）。（增值税可抵扣）","o":["100 万元（价款＋安装费，不含可抵扣增值税）","113 万元","13 万元","87 万元"],"a":[0],"e":"增值税一般纳税人购入设备，进项税额 13 万元可抵扣，不计入固定资产成本；入账价值＝价款＋运输费＋安装费等相关支出（不含可抵扣增值税）。需要安装的设备通过“在建工程”归集，安装完工转入固定资产。","k":"固定资产入账价值"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"某企业一项固定资产原值 100 万元，预计净残值 4 万元，预计使用年限 5 年，采用年限平均法计提折旧。该设备年折旧额为（　）。","o":["19.2 万元","20 万元","19.6 万元","18 万元"],"a":[0],"e":"年限平均法：年折旧额＝(原值−预计净残值)÷预计使用年限＝(100−4)÷5＝19.2 万元；年折旧率＝19.2÷100＝19.2%。\n【公式】“原值减残值，除以年限”。","k":"年限平均法折旧"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业对其一台设备采用双倍余额递减法计提折旧，原值 100 万元，预计使用 5 年（不考虑残值因素影响前期计算）。第一年应计提的折旧额为（　）。","o":["40 万元","20 万元","38.4 万元","50 万元"],"a":[0],"e":"双倍余额递减法：年折旧率＝2÷预计使用年限＝2÷5＝40%；第一年折旧＝原值×40%＝40 万元（前期不考虑净残值，最后两年改为平均法并扣除残值）。\n【对比】加速折旧前期折旧大、后期小。","k":"双倍余额递减法"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业出售一台不需用的设备，取得价款 50 万元，该设备账面价值 42 万元，发生清理费用 2 万元（不考虑税费）。该处置业务对企业当期损益的影响是（　）。","o":["资产处置收益增加 6 万元","营业外收入增加 6 万元","资产处置损失增加 6 万元","不影响当期损益"],"a":[0],"e":"出售固定资产（非报废毁损）的处置损益计入“资产处置收益”：50−42−2＝6 万元收益。因自然灾害等报废毁损产生的损益才计入营业外收支。\n【区分】主动处置＝资产处置收益；被动报废＝营业外收支。","k":"固定资产处置"},{"s":"kj","p":"资产","c":2,"cn":"无形资产及其他","t":"single","q":"下列关于无形资产摊销的说法中，正确的是（　）。","o":["使用寿命有限的无形资产，其摊销额自可供使用当月起开始摊销","所有无形资产都必须摊销","无形资产摊销一律计入管理费用","使用寿命不确定的无形资产按 10 年摊销"],"a":[0],"e":"无形资产“当月增加当月摊销”（与固定资产当月增加下月计提相反）。使用寿命有限的自可供使用当月起摊销，使用寿命不确定的不摊销（每年减值测试）。摊销去向按受益对象：自用计入管理费用、出租计入其他业务成本等。","k":"无形资产摊销"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"企业预提短期借款利息时，应借记的科目是（　）。","o":["财务费用","管理费用","短期借款","应付利息是贷方科目"],"a":[0],"e":"短期借款利息按月预提：借记“财务费用”，贷记“应付利息”；支付时借记应付利息、贷记银行存款。借款利息一律属于筹资性支出，计入财务费用。","k":"短期借款利息"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"下列各项中，不属于职工薪酬核算内容的是（　）。","o":["购建厂房的支出","职工工资、奖金、津贴和补贴","职工福利费和五险一金","工会经费和职工教育经费"],"a":[0],"e":"职工薪酬包括短期薪酬（工资、福利费、五险一金、工会经费、职工教育经费等）、离职后福利、辞退福利和其他长期职工福利。购建厂房属于资本性支出，与职工薪酬无关。","k":"职工薪酬"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"企业将自产的产品作为非货币性福利发放给职工，应当按照（　）确认应付职工薪酬。","o":["产品的公允价值（含销项税额）","产品的成本价","产品的成本与公允价值之和","1 元象征性金额"],"a":[0],"e":"以自产产品发放职工福利：按公允价值（售价）＋销项税额确认应付职工薪酬，同时视同销售确认收入并结转成本——两头都要走账。","k":"非货币性福利"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"一般纳税人销售货物开具增值税专用发票注明价款 200 万元、销项税额 26 万元。该企业当期“应交税费——应交增值税（销项税额）”应确认（　）。","o":["26 万元","200 万元","226 万元","13 万元"],"a":[0],"e":"销项税额＝不含税销售额×税率＝200×13%＝26 万元，贷记“应交税费——应交增值税（销项税额）”。一般纳税人当期应纳增值税＝销项税额−可抵扣进项税额。","k":"应交增值税"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"下列各项中，应通过“其他应付款”科目核算的是（　）。","o":["应付经营租赁固定资产的租金","应付购货款","应交企业所得税","应付职工工资"],"a":[0],"e":"其他应付款核算除主营业务以外的应付、暂收款项，如应付经营租赁租金、收取的押金等。应付购货款走应付账款，应交税费、应付职工薪酬各有专门科目。","k":"其他应付款"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"企业开出的商业承兑汇票到期无力支付时，应将应付票据的账面余额转入（　）。","o":["应付账款","短期借款","其他应付款","营业外收入"],"a":[0],"e":"商业承兑汇票到期无力支付→转入应付账款；银行承兑汇票到期无力支付→转入短期借款（银行垫付）。两者去向不同，是经典对比考点。","k":"应付票据到期"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"企业从职工工资中代扣代缴的个人所得税，应贷记的科目是（　）。","o":["应交税费——应交个人所得税","管理费用","其他应收款","应付职工薪酬之外的单设科目"],"a":[0],"e":"代扣个税：发放工资时借记“应付职工薪酬”，贷记“应交税费——应交个人所得税”和银行存款；实际缴纳时借记应交税费。个税由企业代扣代缴，负担人是职工个人。","k":"代扣个税"},{"s":"kj","p":"负债","c":3,"cn":"非流动负债","t":"single","q":"企业为购建固定资产取得长期借款，在该固定资产尚未达到预定可使用状态之前，其符合资本化条件的借款利息应计入（　）。","o":["在建工程成本","财务费用","管理费用","长期借款本金"],"a":[0],"e":"长期借款利息区分去向：符合资本化条件的（购建固定资产达到预定可使用状态前）计入资产成本；其余计入财务费用。资本化期间的判断是长期借款核算的核心。","k":"长期借款利息"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"single","q":"企业按当年净利润的 10% 提取法定盈余公积时，应借记“利润分配”，贷记（　）。","o":["盈余公积——法定盈余公积","实收资本","资本公积","本年利润"],"a":[0],"e":"提取盈余公积属于所有者权益内部结转：借“利润分配——提取法定盈余公积”，贷“盈余公积——法定盈余公积”，所有者权益总额不变。","k":"盈余公积"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"single","q":"下列各项中，会引起企业所有者权益总额发生变动的是（　）。","o":["投资者追加投资","用盈余公积弥补亏损","提取法定盈余公积","资本公积转增资本"],"a":[0],"e":"追加投资使所有者权益总额增加。盈余公积补亏、提取盈余公积、资本公积转增资本都只是所有者权益内部“左口袋换右口袋”，总额不变。\n【判断技巧】看是否动了“外钱”：有钱从外面进来（投资、利润）才变总额。","k":"所有者权益变动"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"single","q":"企业接受投资者投入的一台设备（不属于出资额超出其注册资本份额的情形），该业务会导致（　）。","o":["实收资本增加，固定资产增加","资本公积增加","盈余公积增加","负债增加"],"a":[0],"e":"投资者投入设备：借记固定资产，贷记实收资本（在注册资本内份额）与资本公积（溢价部分）。本题未提溢价，按实收资本增加处理。","k":"实收资本"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"single","q":"下列各项中，属于企业留存收益的是（　）。","o":["盈余公积和未分配利润","实收资本和资本公积","盈余公积和资本公积","未分配利润和应付股利"],"a":[0],"e":"留存收益＝盈余公积＋未分配利润，是企业历年实现的净利润留存于企业的部分。实收资本、资本公积来自投资者投入，不属于留存收益。","k":"留存收益"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"single","q":"企业销售商品满足收入确认条件时，确认收入的核心判断标准是（　）。","o":["客户取得相关商品的控制权","商品已经发出","已经收到货款","已经开具发票"],"a":[0],"e":"收入确认的核心是“客户取得商品控制权”（能够主导商品的使用并获得几乎全部经济利益）。发出商品、收款、开票都只是表象，不是确认收入的本质标准。","k":"收入确认"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"single","q":"企业销售商品一批，售价 50 000 元（不含税），给予购货方 10% 的商业折扣。该企业应确认的销售收入为（　）。","o":["45 000 元","50 000 元","40 500 元","49 500 元"],"a":[0],"e":"商业折扣在销售时直接扣减，按折扣后金额确认收入：50 000×(1−10%)＝45 000 元。\n【对比】现金折扣（为早点收款给的折扣）不影响收入确认金额，实际发生时计入财务费用。","k":"商业折扣与现金折扣"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"single","q":"企业已经发出商品但不符合收入确认条件的，发出商品的成本应借记的科目是（　）。","o":["发出商品","主营业务成本","销售费用","库存商品保留不动"],"a":[0],"e":"不满足收入确认条件但商品已发出的，按成本借记“发出商品”，贷记“库存商品”——控制权没转移，收入和成本都不确认。","k":"发出商品"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"费用","t":"single","q":"下列各项中，应计入“销售费用”的是（　）。","o":["销售商品发生的广告费","企业行政管理部门的办公费","银行手续费","生产车间设备的折旧费"],"a":[0],"e":"销售费用核算销售环节的费用：广告费、运输费、销售人员薪酬、专设销售机构费用等。行政办公费属于管理费用，银行手续费属于财务费用，车间折旧计入制造费用（产品成本）。","k":"销售费用"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"费用","t":"single","q":"下列各项中，应计入“财务费用”的是（　）。","o":["银行承兑汇票的手续费","业务招待费","车间管理人员的工资","广告宣传费"],"a":[0],"e":"财务费用核算筹资性支出：利息支出（减利息收入）、银行手续费、汇兑损益等。业务招待费计入管理费用；车间管理人员工资计入制造费用。","k":"财务费用"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"利润","t":"single","q":"下列各项中，不影响企业营业利润的是（　）。","o":["营业外收入","管理费用","投资收益","财务费用"],"a":[0],"e":"营业利润＝营业收入−营业成本−税金及附加−销售/管理/研发/财务费用＋其他收益＋投资收益＋公允价值变动收益−减值损失＋资产处置收益等。营业外收支在利润总额环节才介入，不影响营业利润。","k":"营业利润"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"利润","t":"single","q":"某企业本年营业利润 300 万元，营业外收入 20 万元，营业外支出 50 万元，所得税费用 60 万元。该企业本年净利润为（　）。","o":["210 万元","270 万元","230 万元","320 万元"],"a":[0],"e":"利润总额＝营业利润＋营业外收入−营业外支出＝300＋20−50＝270 万元；净利润＝利润总额−所得税费用＝270−60＝210 万元。\n【公式链】营业利润→＋营业外收支＝利润总额→−所得税＝净利润。","k":"净利润计算"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"利润","t":"single","q":"企业当期实现的净利润，加上年初未分配利润（或减去年初未弥补亏损）后的余额，为（　）。","o":["可供分配的利润","未分配利润","盈余公积","营业利润"],"a":[0],"e":"可供分配的利润＝当年净利润＋年初未分配利润（或−年初未弥补亏损），再依次提取法定盈余公积、任意盈余公积后进行分配。","k":"利润分配"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"资产负债表中“货币资金”项目应根据（　）填列。","o":["库存现金、银行存款和其他货币资金三个总账科目期末余额的合计数","库存现金科目余额","银行存款科目余额","银行存款日记账余额"],"a":[0],"e":"货币资金＝库存现金＋银行存款＋其他货币资金（外埠存款、银行汇票存款等）的合计。应收账款等往来项目则要按明细账分析填列并扣除坏账准备——不同项目填列方法不同。","k":"资产负债表填列"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"资产负债表中“应收账款”项目应根据（　）填列。","o":["应收账款明细账借方余额与预收账款明细账借方余额之和，减去坏账准备","应收账款总账贷方余额","预收账款总账余额","应收账款总账借方余额直接填列"],"a":[0],"e":"“应收账款”＝应收账款明细借方＋预收账款明细借方−坏账准备；对应地“预收账款”＝两个科目明细贷方余额之和。总账余额会掩盖不同性质的明细方向，必须按明细分析。","k":"应收账款项目填列"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"利润表中“营业利润”项目之前不应减去的项目是（　）。","o":["营业外支出","税金及附加","销售费用","财务费用"],"a":[0],"e":"营业利润＝收入−成本−税金及附加−期间费用＋其他收益等；营业外支出在计算“利润总额”时才减去。这是多步式利润表的结构层次考点。","k":"利润表结构"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"企业偿还在建工程专项借款的利息支出（不符合资本化条件部分），在现金流量表中应计入（　）。","o":["筹资活动产生的现金流量","经营活动产生的现金流量","投资活动产生的现金流量","汇率变动对现金的影响"],"a":[0],"e":"偿付利息、还本付息都属于筹资活动现金流出。判断口径：日常经营→经营；购建处置长期资产与对外投资→投资；借款还款分红→筹资。","k":"现金流量分类"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"下列各项中，应计入产品成本的是（　）。","o":["生产车间管理人员的工资","企业行政管理部门人员的工资","销售机构人员的工资","筹建期间的开办费"],"a":[0],"e":"产品成本归集生产环节的耗费：直接材料、直接人工、制造费用（含车间管理人员工资、车间折旧等）。行政管理费计入管理费用，销售机构费用计入销售费用——费用归集按“谁受益谁负担”。","k":"产品成本的范围"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"企业生产 A、B 两种产品共同耗用原材料 60 000 元，按材料定额消耗量比例分配。A 产品定额 400 千克，B 产品定额 200 千克。A 产品应分配的材料费用为（　）。","o":["40 000 元","20 000 元","30 000 元","60 000 元"],"a":[0],"e":"分配率＝60 000÷(400＋200)＝100 元/千克；A 产品分配＝400×100＝40 000 元；B 产品＝200×100＝20 000 元。共同费用的分配：先定标准（定额、工时），算分配率，再各自分配。","k":"材料费用分配"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"某车间本月完工产品 400 件，在产品 100 件（完工程度约当 50%）。月初在产品成本与本月生产费用合计 90 000 元（材料随加工陆续投入）。完工产品应负担的成本为（　）。","o":["80 000 元","90 000 元","72 000 元","20 000 元"],"a":[0],"e":"约当产量＝100×50%＝50 件；总约当产量＝400＋50＝450 件；单位成本＝90 000÷450＝200 元/件；完工产品成本＝400×200＝80 000 元；月末在产品＝50×200＝10 000 元。\n【公式】“在产品按完工程度折算成约当产量再分配”。","k":"约当产量比例法"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"以产品品种为成本计算对象、适用于大量大批单步骤生产（或管理上不要求分步计算成本）的成本计算方法是（　）。","o":["品种法","分批法","分步法","分类法"],"a":[0],"e":"成本计算基本方法：品种法（大量大批单步骤，如发电）、分批法（单件小批按订单，如造船、定制设备）、分步法（大量大批多步骤，需分车间步骤算成本，如钢铁、纺织）。","k":"成本计算方法"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"政府会计实行“双功能”核算体系，其中反映政府年度预算收支执行情况的是（　）。","o":["预算会计（收付实现制）","财务会计（权责发生制）","成本会计","管理会计"],"a":[0],"e":"政府会计双体系：预算会计以收付实现制为基础，核算预算收入、预算支出、预算结余三要素，编制决算报告；财务会计以权责发生制为基础，核算资产、负债、净资产、收入、费用五要素，编制财务报告。","k":"政府会计双功能"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"政府财务会计的构成要素中，“资产−负债”的差额称为（　）。","o":["净资产","利润","预算结余","所有者权益"],"a":[0],"e":"政府会计恒等式“资产−负债＝净资产”。政府不以营利为目的，没有“利润”要素；预算会计另有“预算结余”三要素体系。","k":"政府会计要素"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"行政单位收到财政部门拨入的财政拨款时，预算会计应确认（　）。","o":["财政拨款预算收入（收付实现制）","主营业务收入","投资收益","营业外收入"],"a":[0],"e":"预算会计按收付实现制确认“财政拨款预算收入”（实际收到款项时确认）；财务会计则按权责发生制确认“财政拨款收入”。双体系对同一业务各记各账、相互衔接。","k":"财政拨款预算收入"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"下列报表中，由政府会计主体以权责发生制为基础编制、反映其财务状况和运行成本的是（　）。","o":["政府综合财务报告","财政决算报告","税收收入月报表","预算执行情况表"],"a":[0],"e":"政府综合财务报告以权责发生制财务会计数据为基础，全面反映政府的资产负债“家底”与运行成本；决算报告反映预算执行。两者共同构成政府“双报告”。","k":"政府综合财务报告"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"multi","q":"下列各项中，属于会计基本假设的有（　）。","o":["会计主体","持续经营","会计分期","货币计量","实质重于形式"],"a":[0,1,2,3],"e":"会计四大基本假设：会计主体（为谁记账）、持续经营（不会破产清算）、会计分期（划分期间）、货币计量（以货币为主单位）。实质重于形式是会计信息质量要求，不是假设。","k":"会计基本假设"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"multi","q":"下列各项中，应作为企业资产在资产负债表中列示的有（　）。","o":["经营租赁方式出租给其他单位的设备","经营租赁方式租入的设备","融资租赁方式租入的设备","已签订采购合同但尚未购入的原材料","盘亏待处理的存货"],"a":[0,2],"e":"资产的定义核心是“企业拥有或控制、由过去交易形成、预期带来经济利益”：经营租出的设备控制权仍在企业（A）；融资租入的设备实质上由企业控制，符合实质重于形式（C）。经营租入设备不拥有控制权；尚未购入的原材料不属于过去的交易；盘亏待处理的存货已不符合资产定义，应转销。","k":"资产的定义与确认"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"multi","q":"下列各项中，属于会计核算环节（方法）的有（　）。","o":["填制和审核会计凭证","登记会计账簿","成本计算","财产清查","编制纳税申报表"],"a":[0,1,2,3],"e":"会计核算方法七种：设置科目账户、复式记账、填制审核凭证、登记账簿、成本计算、财产清查、编制财务报告。纳税申报是税务事项，不属于会计核算方法体系。","k":"会计核算方法"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"multi","q":"下列各项中，通过“其他货币资金”科目核算的有（　）。","o":["银行汇票存款","银行本票存款","信用卡存款","存出投资款","库存现金"],"a":[0,1,2,3],"e":"其他货币资金：外埠存款、银行汇票存款、银行本票存款、信用卡存款、信用证保证金存款、存出投资款等。库存现金单独核算，不属于其他货币资金。","k":"其他货币资金"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"multi","q":"下列各项中，应计入存货采购成本的有（　）。","o":["购买价款","进口关税","运输途中的合理损耗","入库前的挑选整理费用","入库后的仓储保管费用"],"a":[0,1,2,3],"e":"存货成本包括买价、相关税费（关税等）、运输装卸保险费、合理损耗、入库前挑选整理费。入库后的仓储费计入当期损益（生产必需的仓储除外）。","k":"存货成本构成"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"multi","q":"企业可以采用的存货发出计价方法有（　）。","o":["先进先出法","月末一次加权平均法","移动加权平均法","个别计价法","后进先出法"],"a":[0,1,2,3],"e":"我国企业会计准则允许的发出计价：先进先出、月末一次加权平均、移动加权平均、个别计价。后进先出法（LIFO）已被准则取消。\n【提示】计价方法一经确定不得随意变更。","k":"发出存货计价方法"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"multi","q":"下列固定资产中，应当计提折旧的有（　）。","o":["未使用的房屋建筑物","季节性停用的机器设备","经营租赁方式出租的设备","已提足折旧仍继续使用的设备","单独计价入账的土地"],"a":[0,1,2],"e":"除“已提足折旧仍继续使用”和“单独计价入账的土地”外，固定资产都应计提折旧——未使用的房屋照提（计管理费用），季节性停用设备照提，经营租出的照提（计入其他业务成本）。\n【口诀】“除两例外全提”。","k":"固定资产折旧范围"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"multi","q":"下列各项中，属于职工薪酬的有（　）。","o":["职工工资、奖金、津贴和补贴","职工福利费","医疗保险费、工伤保险费等社会保险费","住房公积金","企业为职工垫付的水电费"],"a":[0,1,2,3],"e":"职工薪酬：短期薪酬（工资、福利、五险一金、工会经费、教育经费、非货币性福利等）、离职后福利、辞退福利。企业为职工垫付的水电费属于“其他应收款”（债权），不是薪酬。","k":"职工薪酬的内容"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"multi","q":"一般纳税人企业发生的下列税金中，应通过“应交税费”科目核算的有（　）。","o":["增值税","企业所得税","城市维护建设税","印花税（不通过应交税费核算的情形除外）","房产税"],"a":[0,1,2,4],"e":"应交税费核算企业按税法规定应缴纳的各种税费：增值税、所得税、城建税、房产税、教育费附加等。印花税因不需要预计应交数，直接付款时借记“税金及附加”，不通过应交税费。\n【特例记忆】印花税不走应交税费。","k":"应交税费"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"multi","q":"下列各项中，属于企业留存收益的有（　）。","o":["法定盈余公积","任意盈余公积","未分配利润","资本公积","实收资本"],"a":[0,1,2],"e":"留存收益＝盈余公积（法定＋任意）＋未分配利润，来源于企业净利润的留存。资本公积、实收资本属于投资者投入形成的权益。\n【联动】留存收益可以转增资本、弥补亏损，总额在内部结转时不变。","k":"留存收益的构成"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"multi","q":"下列各项中，会引起企业留存收益总额发生变动的有（　）。","o":["提取法定盈余公积","用盈余公积转增资本","宣告分配现金股利","实现净利润","用盈余公积弥补亏损"],"a":[1,2,3],"e":"留存收益＝盈余公积＋未分配利润：用盈余公积转增资本（B）使盈余公积减少；宣告分配现金股利（C）借记利润分配，未分配利润减少；实现净利润（D）使未分配利润增加——三者都会引起留存收益总额变动。提取盈余公积（A）和盈余公积补亏（E）只是内部结转，总额不变。\n【记忆】“内转不变，进出才变”。","k":"留存收益的变动"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"multi","q":"企业确认商品销售收入时，需要判断的履约义务履行方式包括（　）。","o":["在某一时点履行履约义务","在某一时段内履行履约义务","在签订合同时即确认全部收入","在收款时确认收入"],"a":[0,1],"e":"收入准则按履约义务的履行模式确认收入：某一时点履行（如交付商品）在控制权转移时点确认；某一时段履行（如建造服务、定制软件）按履约进度确认。","k":"收入确认的模式"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"费用","t":"multi","q":"下列各项中，属于期间费用的有（　）。","o":["管理费用","销售费用","财务费用","制造费用","研发费用"],"a":[0,1,2,4],"e":"期间费用＝管理费用＋销售费用＋财务费用＋研发费用（费用化部分），直接计入当期损益。制造费用是产品成本的组成部分，计入存货成本而非期间费用。","k":"期间费用"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"multi","q":"下列各项中，属于资产负债表流动资产项目的有（　）。","o":["货币资金","应收账款","存货","无形资产","长期股权投资"],"a":[0,1,2],"e":"流动资产：货币资金、交易性金融资产、应收票据及应收账款、预付款项、其他应收款、存货等。无形资产、长期股权投资是非流动资产。","k":"流动资产项目"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"multi","q":"一套完整的财务报表至少应当包括（　）。","o":["资产负债表","利润表","现金流量表","所有者权益变动表","附注"],"a":[0,1,2,3,4],"e":"“四表一注”：资产负债表、利润表、现金流量表、所有者权益变动表＋附注。审计报告是外部鉴证文件，不属于企业编制的报表体系。","k":"财务报表的构成"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"multi","q":"下列各项中，属于产品成本项目的有（　）。","o":["直接材料","直接人工","制造费用","管理费用","销售费用"],"a":[0,1,2],"e":"产品成本项目：直接材料、直接人工、制造费用（燃料及动力可视情况单列）。管理费用、销售费用属于期间费用，与产品成本无关。\n【归集口诀】“车间里发生的是成本，办公室发生的是费用”。","k":"产品成本项目"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"multi","q":"下列关于政府会计的说法中，正确的有（　）。","o":["财务会计实行权责发生制","预算会计一般实行收付实现制","编制政府综合财务报告和决算报告（双报告）","只核算预算收支，不核算资产负债","财务会计要素包括资产、负债、净资产、收入、费用"],"a":[0,1,2,4],"e":"政府会计“双功能、双基础、双报告”：财务会计（权责发生制、五要素、财务报告）＋预算会计（收付实现制、三要素、决算报告）。D 说“只核算预算收支”是旧模式，改革后资产负债家底也要核算。","k":"政府会计体系"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业的库存现金限额一般由开户银行根据实际需要核定，通常按企业（　）日常零星开支所需现金确定。","o":["3～5 天","10～15 天","1 个月","半年"],"a":[0],"e":"库存现金限额按 3～5 天日常零星开支的需要核定，边远地区和交通不便地区可按多于 5 天但不超过 15 天核定。超过限额的现金应及时送存银行。","k":"库存现金限额"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业拨付给内部各部门周转使用的备用金，应通过（　）科目核算。","o":["其他应收款","库存现金","银行存款","应付账款"],"a":[0],"e":"备用金（内部各部门周转使用的定额备用金）通过“其他应收款——备用金”核算；领用时借记其他应收款，报销补足时直接计入费用。","k":"备用金"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"企业盘盈的存货（按规定程序批准后），正确的处理是（　）。","o":["冲减管理费用","计入营业外收入","计入其他业务收入","增加盈余公积"],"a":[0],"e":"存货盘盈：按重置成本借记存货，报批后冲减管理费用（原因是计量误差）。对比：固定资产盘盈作为前期差错处理（通过以前年度损益调整），存货盘亏的管理原因损失计入管理费用、自然灾害损失计入营业外支出。","k":"存货盘盈盘亏"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业对自有设备采用工作量法计提折旧。该设备原值 60 万元，预计净 function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),2800);
}
function tabbarHTML(active){
  const tabs=[['home','🏠','首页'],['mockSelect','📝','模考'],['wrong','❌','错题本'],['settings','👤','我的']];
  return `<div class="tabbar">${tabs.map(t=>`<button class="${active===t[0]?'on':''}" onclick="nav('${t[0]}')"><span class="ti">${t[1]}</span>${t[2]}</button>`).join('')}</div>`;
}
const QMAP=new Map(); Object.values(SUBJECTS).forEach(s=>s.qs.forEach(q=>QMAP.set(q.id,q)));
const findQ=id=>QMAP.get(id);

let S;
try{ S=JSON.parse(localStorage.getItem('jj_state_v1'))||{}; }catch(e){ S={}; }
S.mode=S.mode==='instant'?'instant':'batch';
S.stats=S.stats||{}; S.wrong=S.wrong||{}; S.mocks=S.mocks||[]; S.mockLive=S.mockLive||null;
function save(){ try{localStorage.setItem('jj_state_v1',JSON.stringify(S));}catch(e){} }

function chapters(skey){
  const map=new Map();
  SUBJECTS[skey].qs.forEach(q=>{
    const key=q.p+'|'+q.c;
    if(!map.has(key)) map.set(key,{p:q.p,c:q.c,cn:q.cn,qs:[]});
    map.get(key).qs.push(q);
  });
  return [...map.values()];
}
function subjStats(skey){
  let a=0,c=0,chs=new Set();
  SUBJECTS[skey].qs.forEach(q=>{ const st=S.stats[q.id]; if(st&&st.a){a+=st.a;c+=st.c;chs.add(q.p+'|'+q.c);} });
  const total=SUBJECTS[skey].qs.length;
  const touched=new Set();
  SUBJECTS[skey].qs.forEach(q=>{ if(S.stats[q.id]&&S.stats[q.id].a) touched.add(q.id); });
  return {a,c,total,done:touched.size,chTotal:chapters(skey).length,chTouched:chs.size};
}
function accCls(p){ return p>=80?'pct-ok':(p>=60?'pct-mid':'pct-bad'); }
function pct(a,c){ return a?Math.round(c/a*100):0; }

/* ============ 会话 ============ */
let SES=null;
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startSession(qids,opts={}){
  const qs=qids.map(findQ).filter(Boolean);
  if(!qs.length){ alert('暂无可刷的题目'); return; }
  SES={qs,idx:0,sel:null,revealed:false,batchStart:0,wrongAdded:0,title:opts.title||'',redo:!!opts.redo,source:opts.source||''};
  nav('quiz');
}
function figHTML(q){
  const f=window.__FIGS__&&q.fig&&window.__FIGS__[q.fig];
  return f?`<div class="figbox">${f}<div class="figcap">📐 理解配图（示意图，作答以题干为准）</div></div>`:'';
}
const eqSet=(x,y)=>x.length===y.length&&x.every(v=>y.includes(v));

function record(q,sel,atIdx){
  const st=S.stats[q.id]||(S.stats[q.id]={a:0,c:0}); st.a++;
  const ok=eqSet(sel,q.a);
  if(ok) st.c++;
  else S.wrong[q.id]=todayISO();
  if(ok&&SES.redo) delete S.wrong[q.id];
  if(SES) SES.results=SES.results||{}, SES.results[atIdx!==undefined?atIdx:SES.idx]=ok;
  save(); return ok;
}

/* ============ 渲染 ============ */
function nav(screen,arg){ ({home:renderHome,exam:renderExam,subject:renderSubject,quiz:renderQuiz,wrong:renderWrong,settings:renderSettings,mockSelect:renderMockSelect,mockRun:renderMockRun})[screen](arg); }

window.openExam=function(i){ EXIDX=i; EX=EXAMS[i]; initSubjects(); SES=null; nav('exam'); };
window.doSearch=function(){
  const kw=(document.getElementById('skw').value||'').trim().toLowerCase();
  const box=document.getElementById('sres');
  if(!kw){ box.innerHTML=''; return; }
  const rows=[], seen=new Set();
  CATALOG.forEach(c=>c.exams.forEach(x=>{
    if(x.st!=='ready' && x.name.toLowerCase().includes(kw)){
      const id='cat:'+x.name;
      if(!seen.has(id)){ seen.add(id); rows.push({f:`toast('「${esc(x.name)}」数据包筹备中 — 到 GitHub 提需求可加速上线')`,txt:`${x.icon||'📘'} ${esc(x.name)}`,sub:'数据包筹备中'}); }
    }
  }));
  EXAMS.forEach((e,i)=>{
    e.subjects.forEach(s=>{
      const qs=DATA.banks[s.key]||[];
      const hits=[];
      if((e.name+' '+(s.name||'')+' '+(s.short||'')).toLowerCase().includes(kw)) hits.push('subj');
      const chs={};
      qs.forEach(q=>{ const k=(q.p||'')+'|'+q.c; if(!chs[k])chs[k]={p:q.p,c:q.c,cn:q.cn,n:0}; chs[k].n++; });
      Object.values(chs).forEach(ch=>{ if(((ch.cn||'')+' '+(ch.p||'')).toLowerCase().includes(kw)) hits.push('chap:'+ch.c); });
      const tags=new Set(qs.map(q=>q.k).filter(Boolean));
      tags.forEach(tag=>{ if(tag.toLowerCase().includes(kw)) hits.push('tag:'+tag); });
      hits.forEach(h=>{
        if(h==='subj'){ const id='s:'+i+':'+s.key; if(!seen.has(id)){seen.add(id); rows.push({f:`goRes(${i},'${s.key}',null,null)`,txt:`${e.icon||'📚'} ${esc(e.name)} › ${esc(s.name)}（${qs.length} 题）`,sub:'进入科目'});} }
        else if(h.startsWith('chap:')){ const c=+h.slice(5); const id='c:'+i+':'+s.key+':'+c; const ch=Object.values(chs).find(x=>x.c===c); if(!seen.has(id)&&ch){seen.add(id); rows.push({f:`goRes(${i},'${s.key}',null,${c})`,txt:`${esc(e.name)} › ${esc(ch.cn)}（${ch.n} 题）`,sub:'直接开刷这一章'});} }
        else { const tag=h.slice(4); const id='t:'+i+':'+s.key+':'+tag; if(!seen.has(id)){seen.add(id); rows.push({f:`goRes(${i},'${s.key}','${tag.replace(/'/g,"\\'")}',null)`,txt:`考点「${esc(tag)}」`,sub:`${esc(e.name)} › ${esc(s.short||s.name)} · 考点直刷`});} }
      });
    });
  });
  box.innerHTML = rows.length
    ? rows.slice(0,30).map(r=>`<div class="sres-row" onclick="${r.f}"><div class="tx">${r.txt}</div><div class="sub">${r.sub} ›</div></div>`).join('')
    : `<div class="card mut" style="font-size:13.5px">没有匹配「${esc(kw)}」的内容。该考试的数据包可能还未收录——欢迎到 GitHub 提需求。</div>`;
};
window.goRes=function(i,skey,tag,c){
  if(EXAMS[EXIDX]!==EXAMS[i]){ EXIDX=i; EX=EXAMS[i]; initSubjects(); SES=null; }
  if(tag){ startSession((DATA.banks[skey]||[]).filter(q=>q.k===tag).map(q=>q.id),{title:'考点：'+tag}); }
  else if(c){ startChapter(skey,c); }
  else nav('subject',skey);
};

function renderSubject(skey){
  const sub=SUBJECTS[skey], chs=chapters(skey);
  let lastP=null, html='';
  chs.forEach(ch=>{
    if(ch.p!==lastP){ html+=`<div class="gname">${esc(ch.p)}</div>`; lastP=ch.p; }
    const done=ch.qs.filter(q=>S.stats[q.id]&&S.stats[q.id].a).length;
    const n=ch.qs.length;
    const st=ch.qs.reduce((acc,q)=>{const t=S.stats[q.id];if(t&&t.a){acc.a+=t.a;acc.c+=t.c;}return acc;},{a:0,c:0});
    const p=pct(st.a,st.c);
    html+=`<div class="chap" onclick="startChapter('${skey}',${ch.c})">
      <div class="nm">${ch.p==='案例分析'?'':('第'+ch.c+'章 ')}${esc(ch.cn)}<div class="bar"><i style="width:${n?done/n*100:0}%"></i></div></div>
      <div class="st">${done}/${n} 题${st.a?`<br><span class="${accCls(p)}">${p}%</span>`:''}</div>
    </div>`;
  });
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="nav('exam')">‹ 返回</button><div class="title">${esc(sub.name)}</div><div class="sp"></div></div>
  <button class="btn ghost" onclick="startAll('${skey}')">🔀 本科全部乱序刷（${sub.qs.length} 题）</button>
  ${html}
  <div class="footer-note">点任意章节开始，从第 1 题顺序刷。做错自动进错题本。</div>`;
}
window.startChapter=(skey,c)=>{
  const ch=chapters(skey).find(x=>x.c===c); if(!ch)return;
  startSession(ch.qs.map(q=>q.id),{title:(ch.p==='案例分析'?'':'第'+ch.c+'章 ')+ch.cn});
};
window.startAll=skey=>{ startSession(shuffle(SUBJECTS[skey].qs.map(q=>q.id)),{title:SUBJECTS[skey].name+' · 乱序',source:skey}); };

function renderQuiz(){
  const {qs,idx}=SES;
  const q=qs[idx];
  const letters=['A','B','C','D','E'];
  const isMulti=q.t==='multi';
  const revealed=SES.revealed;
  const sel=SES.sel||[];
  let opts=q.o.map((o,i)=>{
    let cls='opt';
    if(!revealed){ if(sel.includes(i)) cls+=' sel'; }
    else{
      cls+=' lock';
      if(q.a.includes(i)) cls+=' correct';
      else if(sel.includes(i)) cls+=' wrongpick';
      else cls+=' dim';
    }
    return `<button class="${cls}" ${revealed?'':'onclick="pick('+i+')"'}><span class="abc">${letters[i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const multiBtn=(!revealed&&isMulti&&S.mode==='instant')?`<button class="btn" onclick="revealNow()">确认答案</button>`:'';
  let nextBtn='';
  if(revealed) nextBtn=`<button class="btn" onclick="nextQ()">${idx+1===qs.length?'查看本次成绩':'下一题 →'}</button>`;
  else if(S.mode==='batch'||(S.mode==='instant'&&!isMulti)) nextBtn=`<button class="btn" ${sel.length?'':'disabled'} onclick="nextQ()">${nextBatchEdge()?'查看本组成绩 →':'下一题 →'}</button>`;
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="quitQuiz()">‹ 退出</button><div class="title">${esc(SES.title)}</div><div class="sp"></div></div>
  <div class="progress"><i style="width:${(idx)/qs.length*100}%"></i></div>
  <div class="mut small" style="margin-bottom:4px">第 ${idx+1}/${qs.length} 题 · ${esc(q.cn)} <span class="badge ${isMulti?'b-multi':'b-single'}">${isMulti?'多选·错选不得分':'单选'}</span>${S.mode==='batch'&&!revealed?'<span class="small">（批量模式：先做完一组再统一揭晓）</span>':''}</div>
  <div class="card">
    ${q.bg?`<details class="bgc" open><summary>📋 案例背景材料</summary><div>${esc(q.bg)}</div></details>`:''}
    <div class="stem">${esc(q.q)}</div>
    ${figHTML(q)}
    ${opts}
    ${revealed?verdictHTML(q,sel):''}
    ${multiBtn}${nextBtn}
  </div>`;
}
function nextBatchEdge(){ const nextIdx=SES.idx+1; return nextIdx===SES.qs.length||(SES.mode==='batch'&&nextIdx%5===0); }
function verdictHTML(q,sel){
  const ok=eqSet(sel,q.a);
  const ans=q.a.map(i=>'ABCDEF'[i]).join('、');
  return `<div class="verdict ${ok?'v-ok':'v-bad'}">${ok?'✓ 回答正确':'✗ 回答错误'}　正确答案：${ans}</div>
  <div class="explain"><span class="ktag">${esc(q.k||'考点')}</span><br>${esc(q.e)}</div>`;
}
window.pick=i=>{
  const q=SES.qs[SES.idx];
  if(SES.revealed)return;
  if(q.t==='multi'){ SES.sel=SES.sel||[]; const k=SES.sel.indexOf(i); if(k>=0)SES.sel.splice(k,1); else SES.sel.push(i); SES.sel.sort(); }
  else SES.sel=[i];
  SES.selBy=SES.selBy||{}; SES.selBy[SES.idx]=SES.sel.slice();
  if(S.mode==='instant'&&q.t==='single') revealNow(); else renderQuiz();
};
window.revealNow=()=>{
  const q=SES.qs[SES.idx];
  if(!SES.sel||!SES.sel.length)return;
  SES.revealed=true;
  record(q,SES.sel);
  renderQuiz();
};
window.nextQ=()=>{
  const nextIdx=SES.idx+1;
  if(S.mode==='batch'&&(nextIdx===SES.qs.length||nextIdx%5===0)){ renderBatch(nextIdx); return; }
  if(nextIdx>=SES.qs.length){ renderSummary(); return; }
  SES.idx=nextIdx; SES.sel=null; SES.revealed=false;
  renderQuiz();
};

function renderBatch(endIdx){
  let okN=0; const items=[];
  for(let i=SES.batchStart;i<endIdx;i++){
    const q=SES.qs[i];
    const sel=(SES.selBy&&SES.selBy[i])||[];
    const ok=record(q,sel,i); if(ok)okN++;
    const letters=['A','B','C','D','E'];
    const opts=q.o.map((o,j)=>{
      let cls='opt lock';
      if(q.a.includes(j))cls+=' correct'; else if(sel.includes(j))cls+=' wrongpick'; else cls+=' dim';
      return `<button class="${cls}"><span class="abc">${letters[j]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    const ans=q.a.map(i=>'ABCDEF'[i]).join('、');
    items.push(`<div class="sum-item" onclick="this.classList.toggle('open')">
      <div class="sum-head"><span class="mk" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓':'✗'}</span><span>第${i+1}题 · ${esc(q.q.slice(0,40))}${q.q.length>40?'…':''}</span></div>
      <div class="sum-body"><div class="mut small" style="margin:10px 0 2px">正确答案：${ans}</div>${q.bg?`<details class="bgc"><summary>📋 背景材料</summary><div>${esc(q.bg)}</div></details>`:''}${figHTML(q)}${opts}<div class="explain"><span class="ktag">${esc(q.k||'考点')}</span><br>${esc(q.e)}</div></div>
    </div>`);
  }
  const total=endIdx-SES.batchStart;
  const p=pct(total,okN);
  const isEnd=endIdx>=SES.qs.length;
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="quitQuiz()">‹ 退出</button><div class="title">本组成绩</div><div class="sp"></div></div>
  <div class="card" style="text-align:center">
    <div class="num" style="font-size:34px;color:${p>=80?'var(--ok)':p>=60?'var(--amber)':'var(--bad)'}">${okN}/${total}</div>
    <div class="mut">做错的题已自动收入错题本，点每题展开看解析</div>
  </div>
  ${items.join('')}
  <button class="btn" onclick="continueBatch(${endIdx})">${isEnd?'查看本次成绩 →':'继续下一组 →'}</button>`;
}
window.continueBatch=endIdx=>{
  if(endIdx>=SES.qs.length){ renderSummary(); return; }
  SES.idx=endIdx; SES.batchStart=endIdx; SES.sel=null; SES.revealed=false;
  renderQuiz();
};
window.quitQuiz=()=>{ SES=null; nav('exam'); };

function renderSummary(){
  const total=SES.qs.length;
  let a=0,c=0;
  SES.qs.forEach(q=>{ const st=S.stats[q.id]; if(st){a+=st.a;c+=st.c;} });
  let okN=0; const wrongIds=[];
  SES.qs.forEach((q,i)=>{
    const ok=(SES.results&&SES.results[i]!==undefined)?SES.results[i]:((SES.selBy&&SES.selBy[i])?eqSet(SES.selBy[i],q.a):false);
    if(ok)okN++; else wrongIds.push(q.id);
  });
  const p=pct(total,okN);
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="nav('exam')">‹ 本科</button><div class="title">本次成绩</div><div class="sp"></div></div>
  <div class="card" style="text-align:center">
    <div class="big" style="color:${p>=80?'var(--ok)':p>=60?'var(--amber)':'var(--bad)'}">${p}%</div>
    <div class="mut">${okN}/${total} 题正确 · 新增错题 ${wrongIds.length} 道</div>
  </div>
  ${wrongIds.length?`<button class="btn ghost" onclick="startSession(${JSON.stringify(wrongIds).replace(/"/g,'&quot;')},{title:'错题重做',redo:true})">🔁 立刻重做这 ${wrongIds.length} 道错题</button>`:'<div class="card mut" style="text-align:center">全对，漂亮 👍</div>'}
  <button class="btn sub" onclick="nav('exam')">返回本科</button>`;
}

function renderWrong(){
  const ids=Object.keys(S.wrong).sort((a,b)=>S.wrong[b].localeCompare(S.wrong[a]));
  let html='';
  if(!ids.length){
    html=`<div class="card mut" style="text-align:center;padding:28px">错题本是空的，先去刷几题吧 🙂</div>`;
  }else{
    const bySub={jc:[],gs:[]};
    ids.forEach(id=>{ const q=findQ(id); if(q)bySub[q.s].push(q); });
    Object.keys(bySub).forEach(skey=>{
      if(!bySub[skey].length)return;
      html+=`<div class="gname">${esc(SUBJECTS[skey].name)}</div>`;
      bySub[skey].forEach(q=>{
        html+=`<div class="wrongrow"><div class="tx"><b>${esc(q.q.slice(0,60))}${q.q.length>60?'…':''}</b><br><span class="small">${esc(q.cn)} · 做错于 ${S.wrong[q.id]}</span></div><button class="del" onclick="delWrong('${q.id}')">移除</button></div>`;
      });
    });
  }
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="nav('exam')">‹ 返回</button><div class="title">错题本</div><div class="sp"></div></div>
  ${ids.length?`<button class="btn" onclick="redoWrong()">🔁 错题重做（${ids.length} 题，乱序）</button><div class="small" style="text-align:center;margin-top:6px">重做全对会自动移出错题本</div>`:''}
  ${html}
  ${tabbarHTML('wrong')}`;
}
window.delWrong=id=>{ delete S.wrong[id]; save(); renderWrong(); };
window.redoWrong=()=>{ startSession(shuffle(Object.keys(S.wrong)),{title:'错题重做',redo:true}); };

function renderSettings(){
  let a=0,c=0;EX.subjects.forEach(s=>{const st=subjStats(s.key);a+=st.a;c+=st.c;});
  const wrongN=Object.keys(S.wrong).length;
  const mockN=S.mocks.length;
  const mockHist=S.mocks.length?`<div class="card"><div class="h2">🏅 模考成绩（最近 ${S.mocks.length} 次）</div>${S.mocks.map(m=>{
    const sub=(EX.subjects.find(s=>s.key===m.subject)||{}).short||m.subject;
    return `<div class="wrongrow"><div class="tx"><b>${esc(sub)}　${m.score} 分</b><br><span class="small">${m.pass?'✓ 达到合格线':'未达合格线'} · ${m.date}</span></div></div>`;
  }).join('')}</div>`:'';
  $('#app').innerHTML=`
  <div class="exbanner">
    <div class="eb-icon">👤</div>
    <div class="eb-name">我的学习</div>
    <div class="eb-meta">当前备考：${esc(EX.name)}</div>
  </div>
  <div class="card" style="text-align:center">
    <div class="h2">学习概览 · ${esc(EX.name)}</div>
    <div class="row" style="margin-top:8px;text-align:center">
      <div style="flex:1"><div class="num">${a}</div><div class="small">累计做题</div></div>
      <div style="flex:1"><div class="num">${a?Math.round(c/a*100)+'%':'—'}</div><div class="small">总正确率</div></div>
      <div style="flex:1"><div class="num">${wrongN}</div><div class="small">错题待清</div></div>
      <div style="flex:1"><div class="num">${mockN}</div><div class="small">模考次数</div></div>
    </div>
  </div>
  ${mockHist}
  <div class="card">
    <div class="h2">⚙ 答案揭晓模式</div>
    <div class="mode">
      <button class="${S.mode==='batch'?'on':''}" onclick="setMode('batch')">批量揭晓（推荐）</button>
      <button class="${S.mode==='instant'?'on':''}" onclick="setMode('instant')">做一题看一题</button>
    </div>
    <div class="small">批量模式：5 题一组做完统一判分，先逼自己完成回忆，记忆效果更好。即时模式：做一题立刻出答案解析，适合第一轮熟悉考点。</div>
  </div>
  <div class="card">
    <div class="h2">🗂 数据</div>
    <div class="mut" style="margin-bottom:8px">当前数据包：${esc(EX.name)}（${EX.subjects.reduce((n,s)=>n+SUBJECTS[s.key].qs.length,0)} 题）。进度保存在本机浏览器，清缓存会丢。</div>
    <button class="btn sub" style="color:var(--bad)" onclick="wipe()">⚠ 清空全部做题数据</button>
  </div>
  <div class="card">
    <div class="h2">ℹ 关于题舟</div>
    <div class="small" style="line-height:1.8">
      题舟 TiZhou · 通用刷题引擎 v1（开源 MIT）<br>
      题库为按考试大纲生成的<b>模拟题</b>，非官方真题，以当年官方教材与考纲为准。<br>
      想加新考试数据包 / 提需求：<a href="https://github.com/laojinpassion/tizhou" target="_blank" style="color:var(--acc)">GitHub · laojinpassion/tizhou</a>
    </div>
  </div>
  ${tabbarHTML('settings')}`;
}
window.setMode=m=>{ S.mode=m; save(); renderSettings(); };
window.wipe=()=>{ if(confirm('确定清空所有做题记录、错题本和统计吗？')){ S={mode:S.mode,stats:{},wrong:{}}; save(); nav('home'); } };

/* ============ 全真模考（规则来自考试数据包） ============ */
let MK=null, MKTimer=null;
function renderMockSelect(){
  const m=S.mocks&&S.mocks[0];
  const mockCards=EX.subjects.map(s=>{
    const r=(EX.mock||{})[s.key];
    if(!r)return'';
    const parts=[]; if(r.single)parts.push(r.single+' 单选'); if(r.multi)parts.push(r.multi+' 多选'); if(r.case)parts.push(r.case+' 个案例分析');
    return `<div class="mockcard" onclick="startMock('${s.key}')"><div class="ic">${s.icon||'📘'}</div><div class="tx"><b>${esc(s.name)}</b><div class="mut small">${parts.join(' + ')} · 共 ${r.total||'?'} 题 · ${r.dur||105} 分钟</div></div></div>`;
  }).join('');
  $('#app').innerHTML=`
  <div class="topbar"><div class="title" style="text-align:left;font-weight:800">📝 全真模考</div><div class="sp"></div></div>
  <div class="card"><div class="h2">规则说明</div><div class="mut">按真实考试结构随机组卷并计时，到时自动交卷。评分规则：单选 ${(EX.mock[s]||{}).singlePts||1} 分/题；多选与案例分析 2 分/题——<b>错选不得分，少选且所选均正确时每个正确选项得 0.5 分</b>。满分 ${EX.totalScore} 分，${EX.passScore} 分及格。模考中答案不即时揭晓，交卷后统一出分。</div></div>
  ${m?`<div class="card"><div class="mut">最近一次模考：${esc((EX.subjects.find(s=>s.key===m.subject)||{}).short||m.subject)} <b>${m.score} 分</b> · ${m.pass?'✓ 达到合格线':'未达 '+EX.passScore+' 分合格线'} · ${m.date}</div></div>`:''}
  ${mockCards}
  <div class="footer-note">建议在电脑上做模考以模拟机考手感。中途关闭页面进度会保留，可从考试页"继续模考"恢复；切出页面计时不会暂停，请专注作答。</div>
  ${tabbarHTML('mockSelect')}`;
}
window.startMockSelect=function(){ nav('mockSelect'); };
window.startMock=function(s){
  const r=(EX.mock||{})[s];
  if(!r){ alert('该科目未配置模考规则'); return; }
  const singles=shuffle(SUBJECTS[s].qs.filter(q=>q.t==='single'&&!q.bg)).slice(0,r.single||0);
  const multis=shuffle(SUBJECTS[s].qs.filter(q=>q.t==='multi'&&!q.bg)).slice(0,r.multi||0);
  let cases=[];
  if(r.case){
    const cq=SUBJECTS[s].qs.filter(q=>q.bg);
    const keys=[...new Set(cq.map(q=>q.p+'|'+q.c))].sort(()=>Math.random()-0.5).slice(0,r.case);
    cases=cq.filter(q=>keys.includes(q.p+'|'+q.c));
  }
  const qs=[...singles,...multis,...cases];
  if(qs.length<r.total){ alert('题库不足，无法组卷（还缺 '+(r.total-qs.length)+' 题，请先扩充题库）'); return; }
  MK={s,qs,idx:0,selBy:{},startedAt:Date.now(),durMs:r.dur*60*1000,done:false};
  S.mockLive={ids:qs.map(q=>q.id),idx:0,selBy:{},startedAt:MK.startedAt,durMs:MK.durMs}; save();
  clearInterval(MKTimer); MKTimer=setInterval(tickMock,1000);
  nav('mockRun');
};
window.resumeMock=function(){
  const L=S.mockLive; if(!L)return;
  const qs=L.ids.map(findQ).filter(Boolean);
  if(!qs.length){ delete S.mockLive; save(); nav('home'); return; }
  MK={s:qs[0].s,qs,idx:L.idx||0,selBy:L.selBy||{},startedAt:L.startedAt,durMs:L.durMs||105*60*1000,done:false};
  if(Date.now()-MK.startedAt>=MK.durMs){ finishMock(true); return; }
  clearInterval(MKTimer); MKTimer=setInterval(tickMock,1000);
  nav('mockRun');
};
function fmtLeft(ms){ ms=Math.max(0,ms); const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60; return (h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function tickMock(){
  if(!MK||MK.done)return;
  if(MK.durMs-(Date.now()-MK.startedAt)<=0){ finishMock(true); }
}
function renderMockRun(){
  const q=MK.qs[MK.idx], letters=['A','B','C','D','E'];
  const sel=MK.selBy[MK.idx]||[];
  const left=MK.durMs-(Date.now()-MK.startedAt);
  const isMulti=q.t==='multi';
  const opts=q.o.map((o,i)=>`<button class="opt${sel.includes(i)?' sel':''}" onclick="mockPick(${i})"><span class="abc">${letters[i]}</span><span>${esc(o)}</span></button>`).join('');
  const marked=MK.qs.map((qq,i)=>`<b class="${MK.selBy[i]&&MK.selBy[i].length?'ans':''}${i===MK.idx?' cur':''}" onclick="mockJump(${i})">${i+1}</b>`).join('');
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="quitMock()">‹ 退出</button><div class="title">模考 · ${SUBJECTS[MK.s].short}</div><div class="timer" style="color:${left<10*60*1000?'var(--bad)':'var(--acc)'}">${fmtLeft(left)}</div></div>
  <div class="progress"><i style="width:${(MK.idx+1)/MK.qs.length*100}%"></i></div>
  <div class="mut small" style="margin-bottom:4px">第 ${MK.idx+1}/${MK.qs.length} 题 · ${esc(q.cn||'')} <span class="badge ${isMulti?'b-multi':'b-single'}">${q.bg?'案例分析 · 不定项':(isMulti?'多选':'单选')}</span></div>
  <div class="card">
    ${q.bg?`<details class="bgc" open><summary>📋 案例背景材料</summary><div>${esc(q.bg)}</div></details>`:''}
    <div class="stem">${esc(q.q)}</div>
    ${figHTML(q)}
    ${opts}
  </div>
  <div class="row">
    <button class="btn sub" style="margin-top:0" ${MK.idx===0?'disabled':''} onclick="mockJump(${MK.idx-1})">‹ 上一题</button>
    <button class="btn sub" style="margin-top:0" ${MK.idx===MK.qs.length-1?'disabled':''} onclick="mockJump(${MK.idx+1})">下一题 ›</button>
  </div>
  <div class="card" style="margin-top:10px"><div class="small" style="cursor:pointer;font-weight:700" onclick="const g=document.getElementById('ag');g.style.display=g.style.display==='none'?'flex':'none'">⊞ 答题卡（点开跳转任意题 / 查看作答情况）</div><div class="ansgrid" id="ag" style="display:none">${marked}</div></div>
  <div class="small" style="text-align:center;margin-top:6px">${isMulti||q.bg?'错选不得分，少选每个正确项得 0.5 分 · 答案未揭晓，交卷后统一出分':''}</div>
  <button class="btn" onclick="submitMockConfirm()">交卷</button>`;
}
window.mockPick=function(i){
  const q=MK.qs[MK.idx];
  if(q.t==='multi'){ const cur=(MK.selBy[MK.idx]||[]).slice(); const k=cur.indexOf(i); if(k>=0)cur.splice(k,1); else cur.push(i); cur.sort(); MK.selBy[MK.idx]=cur; }
  else MK.selBy[MK.idx]=[i];
  S.mockLive.selBy=MK.selBy; S.mockLive.idx=MK.idx; save();
  renderMockRun();
};
window.mockJump=function(i){ if(!MK||i<0||i>=MK.qs.length)return; MK.idx=i; S.mockLive.idx=i; save(); renderMockRun(); };
window.quitMock=function(){
  if(confirm('模考进行中。退出将保留进度（计时继续），可从本科页"继续模考"恢复。确认退出？')){ clearInterval(MKTimer); MK=null; nav('exam'); }
};
window.submitMockConfirm=function(){ if(confirm('确认交卷？未作答的题目按 0 分计。')) finishMock(false); };
function scoreOne(q,sel,singlePts){
  const sp=singlePts||1;
  if(!sel||!sel.length)return 0;
  if(q.bg||q.t==='multi'){ /* 案例分析小题与多选：一律2分，错选不得分，少选每个正确项0.5分 */
    if(sel.some(i=>!q.a.includes(i))) return 0;
    if(sel.length===q.a.length) return 2;
    return 0.5*sel.length;
  }
  return sel.length===1&&sel[0]===q.a[0]?sp:0;
}
function finishMock(auto){
  if(!MK)return;
  MK.done=true; clearInterval(MKTimer);
  const singlePts=((EX.mock||{})[MK.s]||{}).singlePts||1;
  let score=0; const det={single:[0,0],multi:[0,0],case:[0,0]}; const wrongIds=[];
  MK.qs.forEach((q,i)=>{
    const sel=MK.selBy[i]||[]; const sc=scoreOne(q,sel,singlePts); score+=sc;
    const kind=q.bg?'case':q.t;
    det[kind][0]+=sc; det[kind][1]+=(q.bg||q.t==='multi')?2:singlePts;
    if(!sel.length||!eqSet(sel,q.a)) wrongIds.push(q.id);
  });
  const rec={date:todayISO(),subject:MK.s,score:Math.round(score*10)/10,pass:score>=EX.passScore,total:MK.qs.length,
    s1:det.single[0].toFixed(1)+'/'+det.single[1], s2:det.multi[0].toFixed(1)+'/'+det.multi[1], s3:det.case[0].toFixed(1)+'/'+det.case[1]};
  S.mocks.unshift({date:rec.date,subject:rec.subject,score:rec.score,pass:rec.pass}); S.mocks=S.mocks.slice(0,10);
  MK._wrongIds=wrongIds; delete S.mockLive; save();
  $('#app').innerHTML=`
  <div class="topbar"><button class="back" onclick="nav('exam')">‹ 本科</button><div class="title">模考成绩</div><div class="sp"></div></div>
  ${auto?'<div class="card mut" style="text-align:center">⏰ 考试时间到，已自动交卷</div>':''}
  <div class="card" style="text-align:center">
    <div class="big" style="color:${rec.pass?'var(--ok)':'var(--bad)'}">${rec.score}<span style="font-size:16px"> / ${EX.totalScore}</span></div>
    <div class="mut">${rec.pass?'✓ 达到合格线 '+EX.passScore+' 分，保持节奏':'距合格线 '+EX.passScore+' 分还差 '+(EX.passScore-rec.score).toFixed(1)+' 分，错题就是提分地图'} · ${esc((EX.subjects.find(s=>s.key===MK.s)||{}).short||MK.s)} · ${rec.date}</div>
    <div class="row" style="margin-top:10px;text-align:center">
      <div style="flex:1"><div class="num" style="font-size:16px">${rec.s1}</div><div class="small">单选 得分/满分</div></div>
      <div style="flex:1"><div class="num" style="font-size:16px">${rec.s2}</div><div class="small">多选 得分/满分</div></div>
      ${MK.s==='gs'?`<div style="flex:1"><div class="num" style="font-size:16px">${rec.s3}</div><div class="small">案例 得分/满分</div></div>`:''}
    </div>
  </div>
  <button class="btn ghost" onclick="showMockWrong()">看错题与未答题解析（${wrongIds.length} 题）</button>
  <button class="btn sub" onclick="nav('exam')">返回本科</button>
  <div id="mockWrongBox"></div>`;
}
window.showMockWrong=function(){
  if(!MK||!MK._wrongIds)return;
  const items=MK._wrongIds.map(id=>{
    const q=findQ(id); if(!q)return'';
    const letters=['A','B','C','D','E'];
    const opts=q.o.map((o,j)=>`<button class="opt lock ${q.a.includes(j)?'correct':'dim'}"><span class="abc">${letters[j]}</span><span>${esc(o)}</span></button>`).join('');
    return `<div class="card"><div class="mut small">${esc(q.cn||'')}</div>
    ${q.bg?`<details class="bgc"><summary>📋 背景材料</summary><div>${esc(q.bg)}</div></details>`:''}
    <div class="stem">${esc(q.q)}</div>${figHTML(q)}${opts}
    <div class="verdict v-ok">正确答案：${q.a.map(i=>letters[i]).join('、')}</div>
    <div class="explain"><span class="ktag">${esc(q.k||'考点')}</span><br>${esc(q.e)}</div></div>`;
  }).join('');
  document.getElementById('mockWrongBox').innerHTML=items||'<div class="card mut" style="text-align:center">无错题，全对！</div>';
};

/* 启动 */
renderHome();
setTimeout(()=>{ const sp=document.getElementById('splash'); if(sp) sp.classList.add('hide'); }, 3000);
</script>
