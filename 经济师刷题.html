<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fb2">
<title>题舟 · 通用刷题引擎</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1c2330;--mut:#6b7686;--acc:#2f6fb2;--accbg:#eef5fc;--ok:#2e8b57;--okbg:#ecf7f0;--bad:#c94f4f;--badbg:#fbeeee;--line:#e3e8ef;--amber:#b7791f;--amberbg:#fdf6e7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#app{max-width:600px;margin:0 auto;padding:14px 14px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.h1{font-size:22px;font-weight:700;line-height:1.4}
.h2{font-size:17px;font-weight:700;margin:0 0 6px}
.mut{color:var(--mut);font-size:14px}
.small{font-size:13px;color:var(--mut)}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px;cursor:pointer}
.topbar .title{font-weight:700;font-size:16px;flex:1;text-align:center}
.topbar .sp{width:58px}
.badge{display:inline-block;font-size:12px;border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.b-single{background:var(--accbg);color:var(--acc)}
.b-multi{background:var(--amberbg);color:var(--amber)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .25s}
.stem{font-weight:600;font-size:16.5px;margin:2px 0 10px;white-space:pre-wrap}
.opt{display:flex;gap:8px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;font-size:15.5px;line-height:1.55;cursor:pointer;color:var(--ink)}
.opt .abc{font-weight:700;color:var(--mut);flex:none}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .abc{color:var(--ok)}
.opt.wrongpick{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.6}
.opt.lock{cursor:default}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;background:var(--acc);color:#fff}
.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
.btn.sub{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.45}
.explain{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;font-size:15px;white-space:pre-wrap}
.ktag{display:inline-block;background:var(--amberbg);color:var(--amber);border-radius:8px;padding:2px 10px;font-size:13px;margin-bottom:8px}
.verdict{font-weight:700;margin-top:12px;font-size:16px}
.v-ok{color:var(--ok)} .v-bad{color:var(--bad)}
.chap{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.chap .nm{flex:1;font-size:15.5px;font-weight:600}
.chap .st{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:var(--ok)}
.gname{font-size:13px;color:var(--mut);font-weight:700;margin:14px 2px 8px}
.big{font-size:44px;font-weight:800;line-height:1.1;color:var(--acc)}
.row{display:flex;gap:10px}
.row .card{flex:1;margin-bottom:0}
.num{font-size:24px;font-weight:800}
.pct-ok{color:var(--ok)} .pct-mid{color:var(--amber)} .pct-bad{color:var(--bad)}
.wrongrow{display:flex;align-items:flex-start;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.wrongrow .tx{flex:1;font-size:14.5px}
.del{border:0;background:none;color:var(--mut);font-size:13px;cursor:pointer;padding:2px 4px;flex:none}
.mode{display:flex;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}
.mode button{flex:1;border:0;background:#fff;padding:11px;font-size:15px;cursor:pointer;font-weight:600;color:var(--mut)}
.mode button.on{background:var(--acc);color:#fff}
.sum-item{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden;background:#fff}
.sum-head{display:flex;gap:8px;align-items:flex-start;padding:11px 13px;cursor:pointer;font-size:14.5px}
.sum-head .mk{font-weight:800;flex:none}
.sum-body{padding:0 13px 13px;border-top:1px dashed var(--line);display:none}
.sum-item.open .sum-body{display:block}
.figbox{margin:10px 0;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;padding:8px 8px 2px;overflow-x:auto}
.figbox svg{display:block;width:100%;max-width:430px;height:auto;margin:0 auto}
.figbox svg text{paint-order:stroke;stroke:#fbfcfe;stroke-width:3px;stroke-linejoin:round}
.figcap{font-size:12px;color:var(--mut);text-align:center;padding:2px 0 6px}
.hero{background:linear-gradient(135deg,#2f6fb2,#173d61);color:#fff;border-radius:16px;padding:24px 18px 20px;text-align:center;margin-bottom:14px}
.hero-svg{width:76px;opacity:.95;margin:0 auto;display:block}
.hero-name{font-size:27px;font-weight:800;letter-spacing:8px;margin-top:2px;text-indent:8px}
.hero-slogan{font-size:13px;opacity:.85;margin-top:3px;letter-spacing:1px}
.hero-stats{font-size:12px;opacity:.7;margin-top:12px}
.searchbox{margin-bottom:14px}
.searchbox input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:12px 15px;font-size:15px;background:#fff;outline:none}
.searchbox input:focus{border-color:var(--acc)}
.sres-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:8px;cursor:pointer}
.sres-row .tx{font-size:14.5px;font-weight:600}
.sres-row .sub{font-size:12px;color:var(--acc);margin-top:2px}
#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#2f6fb2,#0f2b4a);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
#splash svg{width:120px}
.sp-name{font-size:36px;font-weight:800;letter-spacing:14px;text-indent:14px;margin-top:12px}
.sp-slogan{font-size:14px;opacity:.85;margin-top:8px;letter-spacing:2px}
.sp-tip{font-size:11px;opacity:.5;margin-top:34px}
/* ================= v3 主题层（主流 APP 视觉） ================= */
:root{--brand:#2563eb;--brand2:#1d4ed8;--cta:#ff8a00;--bg:#eef2f8;--card:#ffffff;--ink:#111c2e;--mut:#7a8699;--line:#e6ebf3;--acc:#2563eb;--accbg:#eaf1ff;--ok:#16a34a;--okbg:#e8f7ee;--bad:#dc2626;--badbg:#fdeeee;--amber:#d97706;--amberbg:#fdf3e3}
body{background:var(--bg)}
#app{padding-bottom:88px}
.topbar{padding:10px 14px 6px}
.topbar .title{font-weight:800;letter-spacing:.5px}
.card{border:none;border-radius:16px;box-shadow:0 1px 3px rgba(16,32,64,.06),0 6px 18px rgba(16,32,64,.05)}
.h2{font-size:16.5px}
.hero{background:linear-gradient(145deg,#3b82f6 0%,#2563eb 45%,#1e40af 100%);border-radius:0 0 24px 24px;padding:14px 16px 52px;margin-bottom:-34px;box-shadow:0 8px 24px rgba(37,99,235,.25)}
.hero-name{font-size:21px;letter-spacing:5px;font-weight:800}
.hero-stats{opacity:.8}
.searchbox{position:relative;z-index:3;padding:0 16px;margin-bottom:18px}
.searchbox input{border:none;border-radius:15px;box-shadow:0 10px 26px rgba(29,78,216,.16);padding:14px 16px;font-size:15px}
.gname{display:flex;align-items:center;gap:7px;font-size:14.5px;color:var(--ink);font-weight:800;margin:18px 2px 10px}
.gname::before{content:'';width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#3b82f6,#1d4ed8)}
.subject-card{border-radius:16px}
.subject-card .h2{margin-bottom:4px}
.subject-card .go{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--brand);font-weight:700}
.subject-card .go::after{content:'›';font-size:20px;line-height:1;color:#b6c3d9}
.chap{border:none;border-radius:15px;box-shadow:0 1px 3px rgba(16,32,64,.05);margin-bottom:10px}
.chap .nm{font-weight:600}
.badge{font-weight:700}
.badge[style*="--okbg"]{padding:2px 9px;border-radius:20px}
.btn{border-radius:15px;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.btn.ghost{box-shadow:none;background:var(--accbg);border-color:transparent;color:var(--brand)}
.btn.sub{box-shadow:none;border-color:var(--line);border-radius:15px}
.mode{border:none;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.mode button.on{background:var(--brand)}
.opt{border-radius:13px;border-color:var(--line)}
.opt.sel{background:var(--accbg);border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.wrongpick{background:var(--badbg);border-color:var(--bad)}
.progress{height:8px;border-radius:4px;background:#e4eaf3}
.explain{background:#f7f9fc;border-radius:12px;padding:12px;margin-top:14px;border-top:none}
.ktag{background:#fff4e0;color:#b45309;font-weight:700}
.verdict{font-size:15.5px}
.tabbar{border-top:none;box-shadow:0 -4px 20px rgba(16,32,64,.08)}
.tabbar button{font-size:10.5px;letter-spacing:.5px;padding:8px 0 6px;color:#98a3b5}
.tabbar button.on{color:var(--brand)}
.sum-item{border:none;border-radius:14px;box-shadow:0 1px 3px rgba(16,32,64,.06)}
.wrongrow{border:none;border-radius:13px;box-shadow:0 1px 3px rgba(16,32,64,.05)}
.mockcard{border:none;border-radius:16px;box-shadow:0 2px 10px rgba(16,32,64,.06)}
.menu-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:15px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,32,64,.06);cursor:pointer}
.menu-row .mi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.menu-row .mt{flex:1;font-weight:600;font-size:15px}
.menu-row .md{font-size:12px;color:var(--mut);font-weight:400}
.menu-row .ar{color:#b6c3d9;font-size:20px}
.stat-tile{border-radius:14px;padding:12px 6px;text-align:center;color:#fff}
.stat-tile .num{color:#fff;font-size:21px}
.stat-tile .small{color:rgba(255,255,255,.8)}
#splash{background:linear-gradient(165deg,#3b82f6 0%,#2563eb 45%,#123a7a 100%)}
#splash .sp-name{animation:spFloat 2.6s ease-in-out infinite}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (prefers-reduced-motion: reduce){#splash .sp-name{animation:none}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(17,28,46,.93);color:#fff;border-radius:12px;padding:11px 17px;font-size:13.5px;z-index:98;opacity:0;transition:opacity .3s;pointer-events:none;max-width:82vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:none;display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:7px 0 5px;font-size:10.5px;letter-spacing:.5px;color:#98a3b5;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.tabbar button.on{color:var(--brand);font-weight:700}
.tabbar .ti{font-size:20px;line-height:1.35}
#app{padding-bottom:88px}
.footer-note{margin-top:18px;font-size:12.5px;color:var(--mut);line-height:1.7}
.subject-card{cursor:pointer;position:relative;overflow:hidden}
.subject-card .go{color:var(--acc);font-weight:700;font-size:14px}
.bgc{background:#f8fafd;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14.5px}
.bgc summary{cursor:pointer;font-weight:700;color:var(--acc)}
.bgc div{white-space:pre-wrap;margin-top:6px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;color:var(--acc)}
.ansgrid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ansgrid b{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:var(--mut)}
.ansgrid b.ans{background:var(--acc);color:#fff;border-color:var(--acc)}
.ansgrid b.cur{outline:2px solid var(--amber)}
.exbanner{background:linear-gradient(145deg,#3b82f6,#1e40af);color:#fff;margin:-14px -14px 16px;padding:16px 16px 22px;border-radius:0 0 24px 24px;position:relative;box-shadow:0 8px 24px rgba(30,64,175,.28)}
.exbanner .eb-back{position:absolute;left:12px;top:14px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:19px;cursor:pointer;line-height:1}
.eb-icon{font-size:34px;line-height:1.2}
.eb-name{font-size:20px;font-weight:800;margin-top:4px}
.eb-meta{font-size:12.5px;opacity:.88;margin-top:3px}
</style>
</head>

法律、Economic经济、Social社会文化、Technological技术，专门用于宏观环境扫描。五力模型分析行业竞争结构（现有竞争者、潜在进入者、替代品、买方、卖方）；价值链分析企业内部活动；杜邦分析财务比率分解。\n【对应关系】宏观用PEST，行业用五力，内部用价值链/SWOT的内部维度。","k":"企业外部环境分析（PEST）"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"波特“五力模型”中，用以分析行业竞争结构的五种竞争力不包括（　）。","o":["潜在进入者的威胁","替代产品的威胁","政府宏观调控政策","购买者的讨价还价能力"],"a":[2],"e":"五力：①现有企业间竞争；②潜在进入者威胁；③替代品威胁；④购买者（买方）讨价还价能力；⑤供应者（卖方）讨价还价能力。政府政策属于宏观环境（PEST 中的 P），不是五力之一。\n【答题技巧】五力全部围绕“行业内赚钱的难易程度”，凡是政策、文化、汇率这类宏观词出现，先标“不属于”。","k":"波特五力模型"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"波士顿矩阵中，市场增长率高、相对市场占有率低的业务属于（　）。","o":["明星业务","金牛业务","问题业务","瘦狗业务"],"a":[2],"e":"波士顿矩阵以“市场增长率”为纵轴、“相对市场占有率”为横轴：明星（双高，加大投资）、金牛（低增长高份额，收获现金养其他业务）、问题（高增长低份额，有风险，择优扶植或放弃）、瘦狗（双低，收缩或撤退）。\n【记忆钩子】“明星双高，金牛躺着收钱，问题前途未卜，瘦狗等着退休”。","k":"波士顿矩阵","fig":"boston"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"某家电整机企业投资建设自己的核心零部件生产基地，实现向上游原材料、零部件环节延伸。该战略属于（　）。","o":["前向一体化","后向一体化","横向一体化","多元化战略"],"a":[1],"e":"纵向一体化按产业链方向分：后向一体化——向供应链上游延伸（整机厂自建零部件、面料厂自建棉纺）；前向一体化——向下游分销、终端延伸（制造商自建销售门店、自创零售）。横向一体化是并购同行业竞争对手；多元化是跨行业经营。\n【判断口诀】“往上游叫后向，往下游叫前向，吃同行叫横向”。","k":"发展战略（一体化战略）"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"multi","q":"在对未来情况一无所知（各自然状态发生概率未知）的不确定型决策中，可选用的决策方法包括（　）。","o":["乐观原则（大中取大）","悲观原则（小中取大）","后悔值原则（大中取小）","等概率原则","期望损益值法"],"a":[0,1,2,3],"e":"不确定型决策（概率未知）四法：乐观（大中取大）、悲观（小中取大，华德法）、折中（加权系数）、后悔值（大中取小，萨维奇法）、等概率（拉普拉斯法，视为等概率）。期望损益值法、决策树法需要已知各状态概率，属于风险型决策方法。\n【高频混淆】概率未知用“四原则”，概率已知用“期望值、决策树”。","k":"经营决策方法"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"公司法人治理结构的核心是（　）。","o":["所有者与经营者之间的权力制衡关系","工会与职工代表大会的关系","母公司与子公司的股权关系","企业与政府监管部门的关系"],"a":[0],"e":"公司治理要解决的根本问题是所有权与经营权分离后的委托—代理问题：股东（所有者）把资产交给董事会和经理层（经营者）经营管理，通过股东会—董事会—经理层—监事会（或审计委员会）的分层授权与制衡，降低代理成本、保护股东权益。\n【治理链条】股东会是权力机构→董事会是决策（执行股东会决议）机构→经理层是执行机构→监事会/审计委员会是监督机构。","k":"公司治理的基本概念"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"在公司组织机构中，负责聘任或者解聘公司经理并根据经理提名聘任副经理、财务负责人的机构是（　）。","o":["股东会","董事会","监事会","职工代表大会"],"a":[1],"e":"董事会是股东会的执行机构，行使的典型职权：召集股东会会议并报告工作、执行股东会决议、决定经营计划和投资方案、制定财务预算决算方案、聘任或解聘经理及决定其报酬等。股东会“选董事、批章程、分红利”；经理层由董事会聘任，对董事会负责。\n【分工记忆】“股东会定大事，董事会选经理，经理管日常”。","k":"董事会的职权"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"multi","q":"下列各项中，属于有限责任公司董事会职权的有（　）。","o":["召集股东会会议，并向股东会报告工作","决定公司的经营计划和投资方案","聘任或解聘公司经理","修改公司章程","审议批准公司的年度财务预算方案"],"a":[0,1,2],"e":"董事会职权围绕“经营决策”：召集股东会、执行股东会决议、决定经营计划与投资方案、制定利润分配及增减资本方案、内部管理机构设置、聘任解聘经理等。修改公司章程、审议批准年度财务预算决算、决定利润分配方案属于股东会的职权——董事会只能“制定”这些方案，无权“批准”。\n【高频陷阱】“制定”归董事会，“批准”归股东会，一词之差决定对错。","k":"董事会与股东会的职权划分"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"根据2024年7月1日施行的新《公司法》，公司可以按照章程规定在董事会中设置某一机构，行使监事会职权并不设监事会。该机构是（　）。","o":["审计委员会","提名委员会","薪酬与考核委员会","风险管理委员会"],"a":[0],"e":"新《公司法》允许公司选择单层制治理：在董事会中设置审计委员会，由其行使监事会职权，从而不设监事会。审计委员会成员过半数应为非执行董事。这是本次修法对监督机构设置的重大变革，企业可在“监事会模式”与“审计委员会模式”中择一。\n【时效提醒】治理结构是修订重点，练习时注意区分新旧法条表述。","k":"新公司法与监督机构"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"企业根据消费者需求的差异性，把整体市场划分为若干具有相似需求子市场的过程，称为（　）。","o":["市场细分","目标市场选择","市场定位","市场预测"],"a":[0],"e":"STP 战略三步走：S（Segmenting）市场细分——按需求差异切分市场；T（Targeting）目标市场选择——评估各子市场并选定要进入的；P（Positioning）市场定位——在目标顾客心中树立区别于竞争者的形象。细分是起点，选择是决策，定位是占位。\n【记忆钩子】“先切（S）、再选（T）、后占（P）”。","k":"STP 战略"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"经典“4P”营销组合策略不包括（　）。","o":["产品（Product）","价格（Price）","渠道（Place）","权力（Power）"],"a":[3],"e":"4P：Product产品、Price价格、Place渠道（分销）、Promotion促销，是企业可控的营销组合要素。Power（权力）属于“6P”中加的两个P之一（另有Public Relations公共关系），是政治营销理论在大市场营销中补充的要素，不属于经典4P。\n【联动考点】4C：顾客Customer、成本Cost、便利Convenience、沟通Communication——从企业视角转向顾客视角。","k":"营销组合（4P）"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"某科技企业的新产品上市初期制定较高价格，以求在竞争者进入市场之前尽快收回投资并获取利润。该定价策略属于（　）。","o":["渗透定价策略","撇脂定价策略","差别定价策略","心理定价策略"],"a":[1],"e":"撇脂定价：高价“撇取鲜奶油”，适用于技术领先、需求弹性小、短期难被模仿的创新产品，风险是高价吸引竞争者。渗透定价：低价进入、迅速抢占份额、形成规模壁垒，适用于易模仿、需求价格弹性大的产品。\n【对比记忆】“撇脂赚快钱，渗透占地盘”。","k":"新产品定价策略"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"某日化企业对其洗发水、牙膏、洗衣粉分别使用完全不同的品牌名称（如飘柔、海飞丝等各自独立运作）。该企业的品牌战略属于（　）。","o":["单一品牌战略","多品牌战略","主副品牌战略","品牌特许经营战略"],"a":[1],"e":"多品牌战略：一个企业、多个独立品牌，分别占领不同细分市场，可分散风险、避免“一荣俱荣一损俱损”，但推广成本高（典型如宝洁）。单一品牌（统一品牌）：所有产品共用一个品牌，节约成本、品牌资产共享（如海尔），风险是“一损俱损”。主副品牌：企业品牌＋产品副品牌组合使用（如“海尔·小王子”）。","k":"品牌战略的类型"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"multi","q":"在市场营销管理哲学的演变中，以消费者需求为中心的（现代）经营观念包括（　）。","o":["市场营销观念","社会营销观念","生产观念","产品观念","推销观念"],"a":[0,1],"e":"经营观念演进五阶段：生产观念（“我产什么你买什么”，供不应求时代）、产品观念（迷恋“酒香不怕巷子深”）、推销观念（“卖出去比造出来更重要”）为传统观念，出发点是企业自身；市场营销观念（先研究顾客需求再组织生产）、社会营销观念（兼顾消费者福利与社会长远利益）为现代观念，出发点是顾客需求。\n【判断标准】看“起点”：从工厂出发是传统，从顾客出发是现代。","k":"市场营销观念的演变"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"某商品的流通路线为：制造商→批发商→零售商→消费者。该分销渠道的层级为（　）。","o":["零级渠道","一级渠道","二级渠道","三级渠道"],"a":[2],"e":"渠道层级按“中间层次的数目”计：零级渠道＝直销（制造商→消费者）；一级渠道含1个中间商（制造商→零售商→消费者）；二级渠道含2个中间商（制造商→批发商→零售商→消费者，制造商→代理商→零售商→消费者）。本题有批发商、零售商两个层次，为二级渠道。","k":"分销渠道的层级结构","fig":"channel"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"同一分销渠道层级内部各成员之间发生的冲突（如两家同品牌经销商互相压价抢客），属于（　）。","o":["垂直渠道冲突","水平渠道冲突","多渠道冲突","交叉渠道冲突"],"a":[1],"e":"渠道冲突按方向分：水平冲突——同一层级成员之间（同级经销商抢地盘、互相杀价）；垂直冲突——上下层级之间（厂家直销被经销商视为抢生意、总代理压任务）；多渠道冲突——制造商建立两条以上渠道服务同一市场时（线上低价冲击线下门店）。题干“同一层级”即水平冲突。\n【记忆钩子】“横向同级别打架，纵向上下级打架”。","k":"渠道冲突的类型"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"某品牌经销商为完成考核任务，超越厂家划定的销售区域，向异地市场低价倾销商品。这种现象称为（　）。","o":["窜货","代销","特许经营","直销"],"a":[0],"e":"窜货（跨区销售）：经销商越过划定的经销区域低价销售，直接后果是扰乱价格体系、挫伤守区经销商积极性。常用治理手段：产品区域编码（一物一码可溯源）、区域市场考核从“只看销量”改为“销量＋市场秩序”、价格管控与保证金制度、严查低价货源。\n【联动】窜货的根源常在“压任务＋返利政策只挂钩销量”，治理要动政策而不只是罚款。","k":"窜货及其治理"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"高档奢侈品品牌通常只在少数指定门店（如百货专柜、旗舰店）销售，这类分销策略属于（　）。","o":["密集分销","选择分销","独家分销","多渠道分销"],"a":[2],"e":"按渠道宽度（同一层级中间商数量）分三档：密集分销——尽可能多的网点铺货（日用品、饮料）；选择分销——筛选部分符合条件的中间商（家电、服装）；独家分销——一个区域只授权一家（奢侈品、高端汽车），控价力最强、形象最好但覆盖最窄。三者呈现“宽度递减、控制力递增”的谱系。","k":"分销策略（渠道宽度）"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"某设备组拥有设备10台，每台设备年有效工作时间为2500小时，加工单位产品的台时定额为5小时/件。该设备组的生产能力为（　）。","o":["4000件","5000件","6000件","25000件"],"a":[1],"e":"以台时定额计算：设备组生产能力＝设备数量×单位设备有效工作时间÷单位产品台时定额＝10×2500÷5＝5000（件）。若已知的是产量定额（件/台时），则相乘而不是相除：设备数×有效工时×产量定额。\n【防错】看到“定额”先分辨是“台时定额”（每件耗多少台时，用除）还是“产量定额”（每台时产多少件，用乘）。","k":"生产能力的核算"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"企业生产计划的主要指标中，反映企业在计划期内生产的产品品名和产品品种数量的指标是（　）。","o":["品种指标","质量指标","产量指标","产值指标"],"a":[0],"e":"生产计划四大指标：品种指标（生产什么、几个品种）、质量指标（品级率、合格率等，生产得多好）、产量指标（实物量，生产多少）、产值指标（货币量，价值多少，含总产值、商品产值、净产值/工业增加值）。\n【记忆钩子】“品名看品种，好坏看质量，多少看产量，值钱看产值”。","k":"生产计划的指标体系"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"物料需求计划（MRP）系统的主要输入信息不包括（　）。","o":["主生产计划（MPS）","物料清单（BOM）","库存信息","设备折旧率"],"a":[3],"e":"MRP 三大输入：①主生产计划MPS（最终产品要产多少、什么时候要）；②物料清单BOM（产品的零部件、原材料构成及数量关系）；③库存信息（现有库存、在途量）。系统据此计算出各物料的需求时间与数量并下达订单。设备折旧率属于财务核算内容，与MRP运算无关。\n【记忆钩子】“计划＋清单＋库存”三进一出（出采购与生产计划）。","k":"MRP 系统的构成"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"准时制（JIT）生产方式的核心思想是（　）。","o":["扩大批量生产以摊薄成本","在需要的时候、按需要的量、生产（供应）所需的产品，消除一切浪费","增加在制品库存以保证生产连续","以事后检验为主要质量管理手段"],"a":[1],"e":"JIT 的目标是彻底消除浪费（过量生产、库存、等待、搬运、不良品等），手段是拉动式生产：后工序在需要的时间向前工序领取需要的数量，用“看板”传递需求信号，追求“零库存、零不良”。C 恰好相反——在制品库存正是JIT要消灭的对象。\n【联动考点】看板管理是JIT的重要工具；精益生产的两大支柱是JIT与自动化（自働化）。","k":"准时制生产（JIT）与精益生产"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"multi","q":"企业生产能力的种类包括（　）。","o":["设计生产能力","查定生产能力","计划生产能力","历史最高产量","行业平均产量"],"a":[0,1,2],"e":"生产能力三种类别：①设计能力——建厂或扩建时设计任务书规定的应达到的能力（理想上限）；②查定能力——老企业经技术改造后重新查定的能力；③计划能力——计划期内实际可能达到的能力（编制生产计划的直接依据）。历史产量是过去的结果，行业平均是外部参照，都不是生产能力的种类。\n【考点延伸】编制年度生产计划用计划能力，不用设计能力。","k":"生产能力的种类"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"物流各功能要素中，主要创造商品“空间效用”（克服产地与销地之间的距离）的是（　）。","o":["运输","仓储","包装","流通加工"],"a":[0],"e":"运输解决“空间距离”，创造空间效用，是物流系统中成本占比最大的要素之一；仓储解决“时间错配”，创造时间效用。包装保护商品、方便运输销售；流通加工在流通环节进行简单加工（贴标、分装、组装）提升附加值。\n【对应记忆】“运输管远近（空间），仓储管早晚（时间）”。","k":"物流的功能要素"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"某企业年需求某物料10000件，每次订货的订货成本50元，单位物料年储存成本1元/件。按经济订货批量（EOQ）模型，最佳订货批量约为（　）。","o":["500件","1000件","2000件","5000件"],"a":[1],"e":"EOQ 公式：Q*＝√(2DS/H)＝√(2×10000×50÷1)＝√1000000＝1000（件）。此时年订货成本与年储存成本相等（各25000元），总库存相关成本最低。\n【公式含义】订货批量越大→订货次数少、订货成本低，但库存高、储存成本高；EOQ 是两者的平衡点。变量：D年需求量、S每次订货成本、H单位年储存成本。","k":"经济订货批量（EOQ）","fig":"eoq"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"库存物资ABC分类管理中，应当作为重点管理对象、实行严格控制的是（　）。","o":["品种数少、资金占用额大的A类物资","品种数多、资金占用额小的C类物资","所有物资平均分配管理精力","资金占用中等的B类物资"],"a":[0],"e":"ABC分类源于帕累托“关键的少数、次要的多数”：A类品种约占10%~20%、资金占用约70%~80%，重点管理、精确核算、勤进货；C类品种多、金额小，简化管理、大批量订货；B类介于两者之间常规管理。\n【记忆钩子】“A类少数管大头，C类多数随它去”。","k":"库存ABC分类管理"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"下列关于供应链管理的说法中，正确的是（　）。","o":["供应链管理只管理企业内部的生产物流","供应链管理是对从供应商的供应商到客户的客户之间的物流、信息流、资金流的集成化管理","供应链管理的目标是将库存转移到供应商手里","供应链成员之间是纯粹的对抗性买卖关系"],"a":[1],"e":"供应链管理（SCM）以核心企业为中心，对链条上物流、信息流、资金流进行计划、协调与控制，目标是整条链的成本最低、响应最快，强调成员间的战略协同（伙伴关系）而非对抗。只管内部物流是传统物流管理的视野；把库存硬推给供应商只是零和转嫁，不创造链上价值。\n【判断标志】见到“集成”“协同”“整条链”多是正确项，见到“单方面”“转移给对方”多是错误项。","k":"供应链管理"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"企业对产品生产工艺、生产装备和生产方法进行的改进与创新属于（　）。","o":["产品创新","工艺创新","市场创新","组织创新"],"a":[1],"e":"按创新对象分：产品创新——产出“新的或改进的产品/服务”，直接面向市场；工艺创新（过程创新）——改进“怎么造”，包括新工艺、新设备、新方法，目标是降本提效提质。两者常相伴生：新产品往往要求新工艺。\n【判断口诀】“造出来的是产品创新，怎么造的是工艺创新”。","k":"技术创新的类型"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"技术创新活动由科学技术的重大突破所引发、从实验室技术成果开始向商业化方向推进。这种创新模式属于（　）。","o":["技术推动模式","需求拉动模式","交互作用模式","集成创新模式"],"a":[0],"e":"技术推动：科学发现→技术发明→生产→市场，创新源头是科技突破（如晶体管）。需求拉动：市场需求→引发研发→技术成果→市场，源头是市场机会。交互作用（耦合）模式：技术与市场共同作用，被认为更符合实际。\n【判断口诀】“从技术找市场＝推动，从市场找技术＝拉动”。","k":"技术创新的模式"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"技术供方与受方签订许可合同，允许受方在一定条件下使用其专利技术，受方支付使用费。这种技术转移方式属于（　）。","o":["许可证贸易","合资经营","设备租赁","技术援助"],"a":[0],"e":"许可证贸易（技术许可）是国际技术转移最常见的方式，标的可以是专利、商标、专有技术（Know-how）或其组合，核心是“授权使用＋支付许可费”，不转移所有权。合资经营转移技术依附于股权安排；设备租赁是物的租赁；“交钥匙工程”、技术咨询与援助属于其他转移形式。\n【关键词识别】见“许可合同＋使用费”，选许可证贸易。","k":"技术转移的方式"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"构成商业秘密必须具备的条件不包括（　）。","o":["不为公众所知悉（秘密性）","具有商业价值","权利人采取了相应保密措施","已经获得专利授权"],"a":[3],"e":"商业秘密三要件：秘密性、价值性、保密措施，三者缺一不可。商业秘密与专利是两种并行的保护路径：专利以“公开换保护”、有20年期限；商业秘密靠保密、无期限（可口可乐配方），但一旦泄露即丧失保护。已获专利授权的技术必须公开说明书，恰恰不再是商业秘密。\n【对比记忆】“专利公开换垄断，秘密捂着不求人”。","k":"商业秘密的构成要件"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"multi","q":"下列关于技术创新的说法中，正确的有（　）。","o":["技术创新是一种经济行为，核心是科技成果的商业化","技术创新具有高风险性","成功的技术创新可能带来高收益","技术创新就是发明创造","技术创新的成败与企业战略、组织、资金等因素相关"],"a":[0,1,2,4],"e":"技术创新＝科技成果的首次商业化应用，是“发明＋商业化”：发明是技术行为，创新是经济行为，没有实现商业化的发明不叫创新，D 是最经典错误。创新高投入、高不确定（技术、市场双风险），但一旦成功可获超额利润。创新落地依赖战略导向、组织支持、资金投入等系统性条件。\n【名句记忆】熊彼特：创新是“建立一种新的生产函数”，即“生产要素的新组合”。","k":"技术创新的概念与特征"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"工作分析的直接成果（输出）是（　）。","o":["工作说明书","劳动合同","绩效合同","企业组织结构图"],"a":[0],"e":"工作分析（职位分析）收集某一职位的工作内容、职责、任职资格等信息，输出两个文件：工作说明书（工作描述：做什么、怎么做、在什么条件下做）＋任职资格说明书（任职者资格：知识、技能、经验、能力）。它是招聘、培训、绩效考核、薪酬设计的基础性文件。\n【流程记忆】“分析→说明书→招培考薪都靠它”。","k":"工作分析"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"人力资源需求预测中，邀请专家背靠背多轮匿名发表意见、经反复反馈后意见逐步收敛的方法是（　）。","o":["管理人员判断法","德尔菲法","转换比率分析法","工作负荷分析法"],"a":[1],"e":"德尔菲法三特征：匿名（背靠背，防止权威和从众干扰）、反馈（多轮，每轮反馈汇总结果）、收敛（意见逐步集中）。管理人员判断法简便但主观；转换比率分析用“业务量→人员需求”的历史比率推算，属于定量方法。\n【记忆钩子】“匿名多轮靠收敛，德尔菲”。","k":"人力资源需求预测方法"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"平衡计分卡（BSC）的四个考核维度不包括（　）。","o":["财务维度","客户维度","内部业务流程维度","竞争对手维度"],"a":[3],"e":"平衡计分卡四维度：财务（股东怎么看我们）、客户（客户怎么看我们）、内部业务流程（我们必须擅长什么）、学习与成长（我们能否持续改进和创造价值）。四个维度层层递进：学习成长支撑流程，流程支撑客户，客户支撑财务。竞争对手分析是战略分析工具，不是BSC维度。\n【记忆钩子】“财、客、流程、学习成长”四个圈。","k":"平衡计分卡"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"企业为员工缴纳的“五险一金”，在薪酬构成中属于（　）。","o":["基本薪酬","可变薪酬（绩效薪酬）","间接薪酬（福利）","津贴"],"a":[2],"e":"薪酬三块：基本薪酬（相对固定，按岗位/能力/资历）、可变薪酬（与绩效挂钩，奖金、提成、股权激励）、间接薪酬（福利：五险一金、带薪休假、补充保险、员工服务等，不直接以现金形式随个人绩效波动）。津贴补贴一般作为基本薪酬的补充形式单独列示。\n【判断技巧】“跟个人绩效走的进可变，人人有份非现金的进福利”。","k":"薪酬的构成"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"赫茨伯格双因素理论中，工资、工作条件、公司政策等因素属于（　）。","o":["激励因素","保健因素","成就因素","期望因素"],"a":[1],"e":"双因素理论：保健因素——工资、工作条件、公司政策与管理制度、人际关系、职位保障；改善只能消除不满，不能带来满意与激励。激励因素——成就、认可、工作本身富有挑战、责任、晋升；才能真正产生激励。启示：加薪≠激励，只是“不闹了”；要员工有干劲，需在成就、认可、成长上做文章。\n【对比】马斯洛五层次：生理→安全→社交→尊重→自我实现；期望理论：激励力＝效价×期望值。","k":"激励理论（双因素理论）"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"multi","q":"下列各项中，属于常用绩效考核方法的有（　）。","o":["360度考核法","关键绩效指标法（KPI）","平衡计分卡（BSC）","关键事件法","头脑风暴法"],"a":[0,1,2,3],"e":"绩效考核常用方法：360度考核（上级、同事、下级、客户、自评全方位反馈）、KPI（抓关键指标）、平衡计分卡（四维度）、关键事件法（记录典型好/坏行为作为考核依据）、目标管理法（MBO）、排序法、评级量表法等。头脑风暴是创新创意的群体决策方法，不属于绩效考核方法。\n【答题技巧】凡是“考核/评价”类选项要看它是否回答“干得怎么样”，创意方法一般都不回答。","k":"绩效考核的方法"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"某企业向银行借款，年利率为8%，企业所得税税率为25%。该企业借款的税后资金成本率为（　）。","o":["8%","6%","2%","10%"],"a":[1],"e":"债务资金成本率＝利率×(1−所得税率)＝8%×(1−25%)＝6%。原因：借款利息可以在企业所得税税前扣除（税盾效应），实际负担被所得税“打折”。\n【联动】权益筹资（普通股）无税盾、股东要求的回报更高，因此债务成本一般低于权益成本——但债务会带来财务风险，不能无限借。","k":"债务资金成本（税盾）"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"财务杠杆系数（DFL）反映的是（　）。","o":["销售量变动对息税前利润变动的影响","息税前利润变动对普通股每股收益变动的影响","总资产变动对销售收入变动的影响","净利润变动对营业收入变动的影响"],"a":[1],"e":"三个杠杆各管一段：经营杠杆（DOL）——销售量变动→放大息税前利润EBIT的变动（源于固定成本）；财务杠杆（DFL）——EBIT变动→放大每股收益EPS的变动（源于固定利息）；总杠杆（DTL）＝两者连乘，销售变动→放大EPS。DFL＝EBIT÷(EBIT−I)。\n【记忆链】“销售→EBIT看经营，EBIT→EPS看财务”。","k":"财务杠杆"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"某项目初始投资100万元，投产后每年获得净现金流量25万元。该项目的静态投资回收期为（　）。","o":["3年","4年","5年","25年"],"a":[1],"e":"静态投资回收期＝初始投资额÷年净现金流量＝100÷25＝4（年）。它衡量“多久回本”，优点是直观、简单，缺点是忽略货币时间价值、也不考虑回收期之后的现金流。与动态回收期（考虑时间价值折现）相对。\n【答题习惯】投资评价的计算题先判断是静态还是动态指标，静态直接除，动态要折现。","k":"静态投资回收期"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"采用净现值（NPV）法评价独立项目时，项目可行的判断标准是（　）。","o":["净现值大于或等于零","净现值等于零即可，与正负无关","净现值小于零","净现值大于内含报酬率"],"a":[0],"e":"NPV＝未来各年净现金流量的现值合计−初始投资现值。NPV≥0 说明项目收益率至少达到基准折现率，能增加企业价值，可行；NPV＜0 不可行。互斥项目比较时选NPV更大者。内含报酬率（IRR）是使NPV＝0的折现率，IRR≥基准收益率则可行，两个标准结论一致、不能互相“大于”。","k":"净现值法"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"企业首先确定目标资本结构下投资所需的权益资本，剩余利润才作为股利分配给股东。这种股利政策属于（　）。","o":["剩余股利政策","固定股利政策","固定股利支付率政策","低正常股利加额外股利政策"],"a":[0],"e":"剩余股利政策：先满足再投资，剩余才分配——利于保持理想资本结构、降低资金成本，但股利波动大，适用于初创期或高速扩张期。固定股利政策：股利长期稳定，传递经营稳健信号，适合成熟期；固定股利支付率：股利随盈余同比例波动；低正常加额外：兼顾稳定信号与灵活性。\n【判断口诀】“先投资后分配是剩余，旱涝保收是固定，水涨船高是支付率，保底加奖金是低正常加额外”。","k":"股利政策"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"multi","q":"下列各项中，属于企业权益性筹资方式的有（　）。","o":["吸收直接投资","发行普通股","留存收益筹资","银行借款","融资租赁"],"a":[0,1,2],"e":"权益筹资：吸收直接投资、发行股票（普通股/优先股）、留存收益（内部积累），无须还本、无固定利息负担，但成本高、会稀释控制权。银行借款、发行债券、融资租赁属于债务筹资：成本较低、利息税前扣除，但须按期还本付息，增加财务风险。\n【记忆钩子】“不用还的算权益，必须还本付息的算债务”。","k":"筹资方式"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"multi","q":"下列关于企业筹资与资本结构的说法中，正确的有（　）。","o":["债务筹资的资金成本一般低于权益筹资","债务利息可以在企业所得税前扣除，具有税盾作用","负债比例越高，财务杠杆对每股收益的放大效应越明显","负债比例越高企业价值必然越高","融资租赁属于债务性筹资"],"a":[0,1,2,4],"e":"债务成本低于权益成本且利息税前扣除（A、B 正确）；负债比例高→固定的利息负担重→财务杠杆放大效应强（C 正确）；但负债过高会放大财务风险、增加破产和代理成本，企业价值并非随负债单调上升（D 是对资本结构理论的最常见误读——MM理论等讨论的是存在权衡的曲线关系）。融资租赁实质是“融资＋融物”，租金分期支付，归入债务性筹资（E 正确）。","k":"资本结构与财务风险"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"消费者在线上下单支付、由线下门店完成餐饮制作与配送的消费模式（如外卖平台），主要体现了电子商务的（　）模式。","o":["B2B","B2C","C2C","O2O"],"a":[3],"e":"O2O（Online to Offline）：线上交易或预订＋线下消费体验，典型如外卖、网约车、电影票、到店团购。B2B企业对企业（1688批发）；B2C企业对消费者（品牌官方商城、天猫店）；C2C个人对个人（旧物转让、个人店铺）。\n【识别技巧】抓“交易双方是谁＋消费发生在线上还是线下”两个要素。","k":"电子商务的模式"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"在电子商务交易中，第三方支付平台（如支付宝）对交易的主要作用是（　）。","o":["替代银行完成货币发行","作为买卖双方资金中转的“担保人”，降低交易信用风险","对商品进行质量检验并出具证书","承担商品的物流配送"],"a":[1],"e":"第三方支付解决的是电子商务中的“信任缺口”：买家付款→平台代管→卖家发货→买家确认→平台放款给卖家，以资金中转＋担保交易降低双方违约风险。货币发行是央行的职权；质检、物流都不是支付平台的核心职能。\n【延伸】电子支付系统还包括电子现金、电子钱包、银行卡网络支付等形态。","k":"电子支付与第三方支付"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"企业通过优化网站内容、结构与外部链接，提高网站在搜索引擎自然（免费）结果中的排名。这种网络营销方式称为（　）。","o":["搜索引擎优化（SEO）","搜索引擎营销（SEM 竞价排名）","病毒式营销","电子邮件营销"],"a":[0],"e":"SEO（搜索引擎优化）：靠内容与结构优化赢得“自然排名”，长期有效、不按点击付费。SEM（竞价排名）：花钱购买关键词出价，见效快、停止付费即失效。两者合称搜索营销，另有社交媒体营销、内容营销、直播电商等网络营销方式。\n【对比记忆】“SEO养鱼（慢但免费），SEM买鱼（快但花钱）”。","k":"网络营销方法"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"multi","q":"下列关于电子商务模式的说法中，正确的有（　）。","o":["B2B 指企业与企业之间开展的电子商务","天猫平台上品牌商直接面向消费者销售，以 B2C 为主","淘宝早期个人卖家对个人买家的交易属于 C2C","O2O 强调线上交易（预订、支付）与线下消费体验的结合","B2B 指个人与个人之间进行的交易"],"a":[0,1,2,3],"e":"按交易对象划分：B2B（企业—企业）、B2C（企业—消费者）、C2C（个人—个人）、O2O（线上—线下联动）等。E 把B2B说成个人对个人，与C2C混淆，错。近年还出现社交电商、直播电商、跨境电商等新形态，本质仍是“交易双方＋交易场景”的不同组合。\n【答题技巧】每个选项都用“谁卖给谁、在哪消费”两问校验一遍。","k":"电子商务模式辨析"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"企业进入国际市场的各种方式中，控制程度最高、投入资源和风险也最大的是（　）。","o":["间接出口","许可证贸易","合资经营","独资经营"],"a":[3],"e":"进入模式谱系（控制力、资源投入、风险同步上升）：间接出口＜直接出口＜许可证贸易＜合资经营＜独资经营。独资完全掌控经营、独享利润，但投入最大、政治与经营风险自担。许可贸易投入小、风险低，代价是控制弱且可能培养出竞争对手。\n【判断口诀】“管得越多，投得越多，风险越大”。","k":"国际市场进入模式"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"企业以许可证贸易方式进入国际市场的主要缺点是（　）。","o":["投入成本过高","对海外市场的经营控制力弱，且可能培养出潜在竞争者","无法获得任何技术使用费收入","必须承担东道国的全部经营风险"],"a":[1],"e":"许可贸易的收益模式是收取许可使用费，收入不会为零（C 错）；东道国经营主要由被许可方进行，母公司投入小、风险低（A、D 反了）。代价在于：技术授权后控制力弱，若合同约束不足，被许可方掌握技术后可能自立门户成为竞争者。\n【规避手段】合同中约定保密条款、技术改进回馈、限定销售区域与期限。","k":"许可证贸易的优缺点"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"按 CIF 术语（成本加保险费加运费）签订的国际货物买卖合同中，卖方应承担的义务包括（　）。","o":["仅办理出口清关手续","租船订舱、支付至目的港的运费并为货物办理保险","承担货物在目的港卸货后的全部费用与风险","负责货物进口清关并缴纳进口关税"],"a":[1],"e":"CIF 下卖方：办理出口手续、租船订舱付运费、办理保险付保费（到目的港）；但风险在装运港货物装上船时即转移给买方——“CIF 只保到港费用，不保到港风险”是高频陷阱。进口清关与关税由买方负责（D 错）；仅办出口清关是 FOB 等术语下卖方的义务范围（A 不完整）。\n【对比】FOB：装运港船上交货，运费保险买方出；DDP：完税后交货，卖方义务最重。","k":"国际贸易术语（Incoterms）"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"某制造企业为绕开关税等贸易壁垒、就近占领东道国市场，在目标市场国家投资设厂进行本地化生产。这类对外直接投资属于（　）导向型投资。","o":["资源导向型","市场导向型","效率导向型","技术导向型"],"a":[1],"e":"国际直接投资动因分类：市场导向型——绕开贸易壁垒、贴近并占领当地市场（题干情形）；资源导向型——获取东道国矿产、能源、廉价土地等资源；效率导向型——利用低成本劳动力等要素降低全球生产成本；战略资产导向型——并购获取品牌、技术、渠道等战略性资产。\n【判断口诀】“奔市场去的是市场型，奔原料去的是资源型，奔便宜去的是效率型，奔技术品牌去的是战略资产型”。","k":"国际直接投资的动机"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"multi","q":"下列各项中，属于企业进入国际市场方式的有（　）。","o":["商品出口","许可证贸易","合资经营","独资经营","员工内部创业"],"a":[0,1,2,3],"e":"国际市场进入方式三大类：①出口进入（间接出口、直接出口）；②契约进入（许可证贸易、特许经营、交钥匙工程、管理合同）；③投资进入（合资、独资、跨国并购）。员工内部创业是企业内部的创新机制，与国际市场进入无关。\n【记忆钩子】“卖出去（出口）、借出去（契约）、投进去（投资）”。","k":"国际市场进入方式"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"SWOT 分析中，某企业内部具有技术领先优势，外部市场正处于高速增长期。该企业宜采取的战略组合是（　）。","o":["SO 战略（增长型）","WO 战略（扭转型）","ST 战略（多元化/防御型）","WT 战略（防御型）"],"a":[0],"e":"SWOT 四组合：SO——内部优势×外部机会，乘势扩张（增长型）；WO——利用外部机会克服内部劣势（扭转型）；ST——利用自身优势规避外部威胁（多元化/防御型）；WT——劣势遇威胁，收缩防守（防御型）。题干“优势＋机会”是标准的 SO 增长型组合。\n【记忆钩子】“S加O就冲，W遇W就缩”。","k":"SWOT 分析","fig":"swot"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"某企业出售旗下部分亏损事业部、缩小经营规模，以集中资源保住核心业务。该战略属于（　）。","o":["发展战略（一体化）","稳定战略","收缩战略（放弃）","密集型成长战略"],"a":[2],"e":"总体战略三大类：发展（扩张）、稳定（维持现状小幅增长）、收缩（收缩战线保生存）。收缩的方式包括：抽资转向（削减某业务投资转向其他领域）、放弃（出售或关闭事业部/子公司）、清算（整体变卖）。题干“出售事业部”即典型的放弃式收缩。\n【判断口诀】“卖业务是放弃，砍投入是抽资，关门散伙是清算”。","k":"总体战略的类型"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"股份有限公司修改公司章程、增加或减少注册资本、合并分立解散等重大事项的决议，须经（　）通过。","o":["出席会议的股东所持表决权的半数以上","出席会议的股东所持表决权的三分之二以上","全体股东一致同意","董事会全体董事过半数同意"],"a":[1],"e":"股东大会决议分两档：普通决议——一般事项，出席会议股东所持表决权过半数通过；特别决议——修改章程、增减注册资本、合并分立解散、变更公司形式，须出席会议股东所持表决权的 2/3 以上通过。\n【对比记忆】有限责任公司股东会修改章程须“代表全体股东三分之二以上表决权”的股东通过——股份公司看“出席会议”，有限公司看“全体”，别记混。","k":"股东（大）会决议规则"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"上市公司董事会下设的专门委员会中，主要负责监督内部控制、审查财务信息及其披露的是（　）。","o":["战略委员会","审计委员会","提名委员会","薪酬与考核委员会"],"a":[1],"e":"上市公司董事会通常下设战略、审计、提名、薪酬与考核四个专门委员会：审计委员会——监督内控与内部审计、审查财务信息及披露、对接外部审计（成员中独立董事应占多数且担任召集人）；提名委员会——研究董事、经理人选；薪酬与考核委员会——制定董监高考核与薪酬方案；战略委员会——研究公司长远发展战略。\n【新法联动】新《公司法》允许以董事会审计委员会行使监事会职权，地位进一步抬升。","k":"董事会专门委员会"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"消费者购买决策过程通常包括五个阶段。消费者在使用产品后感到不满意并向朋友吐槽、要求退货，这属于其中的（　）。","o":["信息搜集阶段","方案评估阶段","购买决策阶段","购后行为阶段"],"a":[3],"e":"购买决策五阶段：需求识别（感到有问题）→信息搜集→方案评估（比价、比性能）→购买决策（下单付款）→购后行为（使用体验、评价传播、复购或退货投诉）。购后满意会带来复购与口碑，购后不满意引发退货、负面传播——所以营销不是“卖出去就结束”。\n【判断技巧】见“用了之后/退货/口碑/复购”即购后行为。","k":"消费者购买决策过程"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"某产品销售额增长速度放缓、利润趋于稳定、市场上竞争者数量最多。该产品处于产品生命周期的（　）。","o":["导入期","成长期","成熟期","衰退期"],"a":[2],"e":"产品生命周期四阶段特征：导入期——销量小、增长慢、成本高、通常亏损；成长期——销量迅速上升、竞争者开始涌入、利润快速增加；成熟期——销量见顶增长放缓、利润稳定、竞争者最多最激烈（营销重点是调整市场、调整产品、调整营销组合）；衰退期——销量利润双双下滑（策略是收割或放弃）。\n【对比记忆】“成长看增速，成熟看竞争”。","k":"产品生命周期","fig":"plc"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"制造商对渠道成员进行评估时，通常采用的核心指标是（　）。","o":["销售配额完成率、库存周转率与服务水平等绩效指标","经销商老板的社交影响力","经销商办公楼面积","经销商员工的平均年龄"],"a":[0],"e":"渠道评估围绕“绩效”展开：销售配额完成情况（核心）、平均库存水平与周转率、对客户的服务水平与交货及时性、与厂家政策的配合度、窜货等违规记录等。评估结果决定渠道成员的激励、调整或淘汰。\n【联动考点】渠道激励常用手段：返利、促销支持、资金支持、培训、独家区域授权——注意“激励在前、评估在后”的管理闭环。","k":"渠道成员的评估"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"某汽车整车厂采用专用流水线，长年大批量生产少数几种车型。这种生产类型属于（　）。","o":["大量生产","成批生产","单件生产","订货型生产"],"a":[0],"e":"按生产专业化程度分：大量生产——品种少、产量大、多用高效率专用设备、工作地专业化程度高（汽车总装、家电生产线）；成批生产——品种较多、分批轮番生产；单件生产——品种多、产量少、按订单定制、通用设备（造船、重型机械）。\n【对应关系】“流水线＋专用设备＋少品种”≈大量生产；“按客户图纸造一台”≈单件生产。","k":"生产类型"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"某流水线每日有效工作时间为480分钟，计划日产量240件。该流水线的节拍为（　）。","o":["0.5分钟/件","2分钟/件","4分钟/件","480分钟/件"],"a":[1],"e":"节拍＝计划期有效工作时间÷计划期产量＝480÷240＝2（分钟/件），即流水线上平均每隔2分钟出一件产品。节拍是流水线设计的基础参数，决定各工序设备数量（工序时间÷节拍）。\n【反向题】若给定节拍求产量：产量＝有效工时÷节拍。","k":"流水线节拍"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"multi","q":"企业生产计划的主要指标包括（　）。","o":["品种指标","质量指标","产量指标","产值指标","市场占有率指标"],"a":[0,1,2,3],"e":"生产计划四大指标：品种（生产什么）、质量（多好）、产量（多少，实物量）、产值（值多少，货币量：总产值、商品产值、工业增加值）。市场占有率是营销指标，反映竞争地位，不属于生产计划的指标体系。\n【记忆钩子】“品、质、量、值”四件套。","k":"生产计划的指标体系"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"供应链库存管理模式中，VMI 指的是（　）。","o":["供应商管理库存：由供应商根据协议监测并补充下游库存","由政府统一管理企业库存","客户上门自行提货管理库存","库存完全清零的管理方法"],"a":[0],"e":"VMI（Vendor Managed Inventory，供应商管理库存）：下游（如零售商）向供应商开放库存与销售数据，由供应商按协议主动补货。好处：降低牛鞭效应、减少整体库存与缺货、双方共享信息实现双赢。\n【同类考点】联合库存管理（JMI）、协同计划预测补货（CPFR）——都是“信息共享＋协同补货”思路的变体。","k":"供应链库存管理（VMI）"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"衡量企业技术创新投入强度的常用指标“R&D 投入强度”，是指（　）之比。","o":["研发经费与销售收入","研发人员数量与员工总数","专利数量与研发经费","新产品数量与产品总数"],"a":[0],"e":"R&D 投入强度＝研究与试验发展经费÷销售收入（企业层面；宏观层面用研发经费÷GDP），反映企业对创新“砸了多少钱”，是国际通行的创新投入衡量指标。B 是研发人员比重（人力投入强度），C、D 是产出类指标，都不是“投入强度”。\n【数字参考】高新技术企业的认定条件之一就是研发费用占销售收入比例达到规定门槛。","k":"R&D 投入强度"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"与外部招聘相比，内部招聘的主要优点是（　）。","o":["能带来全新的思想和方法","招聘成本低、适应期短，对在职员工有激励作用","人才来源范围更广","有利于避免近亲繁殖"],"a":[1],"e":"内部招聘：晋升、轮岗、竞聘上岗等方式。优点：候选人了解企业文化与业务、适应快；成本低；给员工看得见的上升通道，激励士气。缺点：来源有限、可能“近亲繁殖”、易引发内部竞争矛盾。外部招聘的优点恰是 A、C、D——带来新思想、来源广、避免近亲繁殖，两者特征正好互补。\n【对比记忆】“内部求稳快省钱，外部求新面更宽”。","k":"人员招聘"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"下列关于内含报酬率（IRR）的说法中，正确的是（　）。","o":["使项目净现值等于零的折现率","使项目净现值最大的折现率","项目的会计利润率","银行的贷款利率"],"a":[0],"e":"内含报酬率是项目自身“能赚到的年化收益率”：令 NPV＝0 反解出的折现率。判断标准：IRR≥基准（必要）收益率则方案可行。它不考虑回收期之后的现金流分布、对非常规现金流可能出现多重解，是与 NPV 并列最常用的动态评价指标。\n【关系记忆】“NPV 表达金额，IRR 表达比率；折现率取 IRR 时，NPV 恰好归零”。","k":"内含报酬率"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"企业进行资本结构决策时，通常认为最优资本结构的标准是（　）。","o":["负债比例最高","股权比例最高","加权平均资金成本最低、企业价值最大","负债与股权完全相等"],"a":[2],"e":"最优资本结构＝在适度风险下使加权平均资金成本（WACC）最低、同时企业价值最大的负债与权益组合。负债有税盾、成本低，但比例过高会放大财务风险、抬高股东要求的回报和破产风险，所以“越高越好”（A）与“对半开”（D）都不是标准。\n【方法延伸】每股收益无差别点分析、比较资金成本法是常用的资本结构决策方法。","k":"最优资本结构"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"某项目投产后年营业收入500万元，付现成本300万元，固定资产年折旧额50万元，企业所得税税率25%。该项目年营业净现金流量为（　）。","o":["112.5万元","150万元","162.5万元","200万元"],"a":[2],"e":"营业净现金流量＝净利润＋折旧。税前利润＝500−300−50＝150万元；所得税＝150×25%＝37.5万元；净利润＝112.5万元；加回折旧50万元→营业净现金流量＝162.5万元。折旧是“非付现成本”，算利润时扣掉、算现金流要加回。\n【简算公式】NCF＝（收入−付现成本−折旧）×(1−税率)＋折旧；或＝收入×(1−税率)−付现成本×(1−税率)＋折旧×税率。","k":"营业净现金流量（净利＋折旧）"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"某企业通过微信社群、会员体系把用户沉淀在自己可反复免费触达的池子里进行运营。这种网络营销做法称为（　）。","o":["公域流量投放","私域流量运营","搜索引擎竞价","直播带货"],"a":[1],"e":"私域流量：沉淀在品牌自己掌控的渠道（微信群、公众号、会员APP、企业微信）中，可反复、低成本甚至免费触达的用户群；与之相对的公域流量（搜索、平台推荐、信息流广告）需要持续付费购买曝光。私域运营的核心是用户关系与复购，适合高复购、高客单品类。\n【辨析】直播带货、竞价排名都是公域流量场景的具体玩法。","k":"网络营销（私域流量）"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"在信用证结算方式下，承担第一性付款责任的是（　）。","o":["进口商","开证银行","出口商","通知银行"],"a":[1],"e":"信用证（L/C）是银行应进口商申请向出口商开出的有条件付款承诺：只要出口商提交的单据与信用证条款相符，开证行必须先行付款，之后才向进口商追款。所以卖方收款的信用基础是“银行信用”而非“商业信用”，这正是信用证优于汇付、托收之处。\n【角色记忆】“申请人（进口商）找开证行开证，通知行负责通知，受益人（出口商）交单拿钱”。","k":"国际结算（信用证）"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"海运提单（B/L）的性质与作用不包括（　）。","o":["货物收据","运输合同的证明","物权凭证（可凭单提货、转让）","货物运输保险合同"],"a":[3],"e":"海运提单三大功能：①承运人签发的货物收据；②运输合同的证明；③物权凭证——正本提单持有人有权提货，指示提单可背书转让实现“单据买卖”。保险合同是另一份独立文件（保险单/保险凭证），与提单无关。\n【联动考点】CIF 术语下卖方负责投保，需向买方提供保险单——保险单与提单是两套单据。","k":"海运提单"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"企业战略通常分为三个层次：总体战略（公司层）、业务战略（竞争战略）和职能战略。其中“如何在特定市场竞争中取得优势（如成本领先、差异化）”属于（　）。","o":["总体战略","业务战略","职能战略","社会责任战略"],"a":[1],"e":"战略层次金字塔：公司层（总体）战略——决定“进入哪些行业、业务组合怎么摆”（发展/稳定/收缩）；业务层（竞争）战略——决定“在这个行业里怎么打赢”（成本领先、差异化、集中化）；职能层战略——营销、财务、生产、人力资源等部门的具体支撑策略。上层定方向，下层给配套。\n【记忆钩子】“公司选赛道，业务赢比赛，职能送补给”。","k":"企业战略的层次"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"某啤酒企业并购了同行业的另一家啤酒厂，以扩大市场份额、减少竞争对手。该战略属于（　）。","o":["前向一体化","后向一体化","横向一体化","市场开发"],"a":[2],"e":"横向一体化（水平一体化）：并购、联合同行业竞争对手或相似业务企业，扩大规模、提升市场集中度，动因是规模经济、减少竞争、获取渠道与品牌。与前向（向下游分销）、后向（向上游供应）合称一体化战略族——都是“在原行业内做深做宽”，与多元化（跨行业）相区别。\n【判断口诀】“吃上游是后向，吃下游是前向，吃同行是横向”。","k":"横向一体化战略"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"single","q":"国际化经营战略中，企业在全球范围推行标准化产品与统一模式（强调全球一体化），与其相对的是强调各国市场差异、因地制宜的（　）。","o":["全球标准化战略","本土化（多国）战略","退出战略","多元化战略"],"a":[1],"e":"国际化战略的坐标轴是“全球一体化 vs 当地响应”：全球标准化战略追求规模效率，全球卖同样的产品（典型如早期可口可乐、苹果硬件）；本土化（多国本土化）战略按各国需求定制、放权给当地（食品、日化行业常见）；跨国战略力求“两头兼顾”——全球效率与当地响应并举，实施难度最大。\n【判断口诀】“全球一盘棋是标准化，一地一策是本土化”。","k":"国际化经营战略的类型"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"关于有限责任公司董事会会议制度，下列说法正确的是（　）。","o":["董事会会议有过半数董事出席方可举行，决议须经全体董事的过半数通过","一名董事出席即可开会","决议须经全体董事一致同意","董事会决议只须董事长个人同意"],"a":[0],"e":"董事会会议规则：应有过半数董事出席方可举行；作出决议必须经全体董事（不是全体与会董事）的过半数通过——“过半数出席＋过半数通过”双门槛。董事会实行一人一票、集体决策，董事长没有更大表决权，只主持会议。董事应当对董事会决议承担责任；表决表明异议并可证明的，可免责。\n【易错点】通过票数分母是“全体董事”而非“出席董事”，比股东大会（出席表决权过半数）更严格。","k":"董事会会议制度"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"关于监事会，下列说法正确的是（　）。","o":["监事会成员中应当包括适当比例的职工代表，且董事、高级管理人员不得兼任监事","监事可以由经理兼任","监事会成员全部由股东代表组成","监事会负责公司日常经营管理"],"a":[0],"e":"监事会的独立性与代表性：成员不得少于三人，应当包括股东代表和适当比例的职工代表（职工代表由职工民主选举产生，比例不得低于三分之一）；董事、高级管理人员不得兼任监事——监督者不能是被监督者。监事会职权：检查公司财务、监督董监高履职、提议召开临时股东会、对董监高提起诉讼等；新公司法允许公司以董事会审计委员会替代监事会。\n【记忆钩子】“监事盯董事，职工进监事，经理别兼任”。","k":"监事会"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"关于国有独资公司，下列说法正确的是（　）。","o":["不设股东会，由履行出资人职责的机构授权董事会行使部分股东会职权","必须设股东会","职工代表大会行使股东会职权","不设董事会"],"a":[0],"e":"国有独资公司是“单一国有股东”的有限公司：不设股东会，由履行出资人职责的机构（国资委等）行使股东会职权或授权董事会行使部分职权；董事会成员中应当有职工代表，须经出资人机构同意的部分高管任免受特别程序约束。治理目标除保值增值外还承担政策性功能，因此治理安排上有特殊规则。\n【改革联动】新一轮国企改革强调“完善中国特色现代企业制度”，党委把方向、董事会定战略防风险、经理层谋经营抓落实。","k":"国有独资公司"},{"s":"gs","p":"工商管理实务","c":2,"cn":"公司法人治理结构","t":"single","q":"公司经理层由董事会聘任，对董事会负责。经理职权的核心是（　）。","o":["决定公司经营方针和投资计划","组织实施董事会决议、主持公司的生产经营管理工作","修改公司章程","聘任全体股东"],"a":[1],"e":"经理是董事会的执行者：组织实施董事会决议和年度经营计划、主持日常生产经营管理、提名副经理和财务负责人人选、任免除应由董事会聘任以外的管理人员。决定经营方针和投资计划是股东（大）会职权，修改章程也是股东会职权——经理层“执行为主、不能越位”。\n【治理三层分工】股东会定大事（所有权），董事会做决策（战略），经理抓落实（经营）。","k":"经理层的职权"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"企业把自己的产品定位为“高端”，避开与强大竞争对手的直接对抗，寻找市场空隙。这种市场定位策略属于（　）。","o":["迎头定位","避强定位","重新定位","无差异定位"],"a":[1],"e":"市场定位三种典型策略：避强定位——避开强劲对手、找空当切入，风险小成功率高（“七喜”定位“非可乐”）；迎头定位——与强手正面竞争、硬碰硬（需要明显实力优势）；重新定位——产品市场反应不佳或需求变化时调整原有定位。无差异定位是目标市场选择策略（不做细分、一网打尽），不属于定位策略术语体系。\n【判断口诀】“躲着打是避强，对着打是迎头，改打法是重新定位”。","k":"市场定位策略"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"企业通过广告、公共关系等手段面向最终消费者大力宣传，吸引消费者主动向零售商求购，从而促使零售商向厂家进货。这种促销策略属于（　）。","o":["推式策略","拉式策略","掠夺性定价策略","撇脂定价策略"],"a":[1],"e":"促销组合两路线：拉式策略——面向最终消费者做广告、公关，把需求“拉”动起来，消费者到渠道点名求购，渠道自然进货；推式策略——面向渠道成员做人员推销、渠道促销（返利、陈列支持），把产品一级一级“推”向终端。工业品偏推式，消费品偏拉式，多数企业两者结合。\n【记忆钩子】“推是推着渠道走，拉是拉着顾客跑”。","k":"促销策略"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"single","q":"企业通过建立客户数据库、分析客户价值、提供个性化服务来维系长期客户关系、提高客户终身价值。这种营销理念与工具是（　）。","o":["客户关系管理（CRM）","市场细分","薄利多销","渠道窜货管理"],"a":[0],"e":"客户关系管理（CRM）的核心：从“一锤子买卖”转向“终身客户”——用信息系统沉淀客户数据，按客户价值分层维护（大客户重点维系），通过个性化服务提升满意度与复购率。获取一个新客户的成本远高于维系一个老客户，所以CRM的账算的是客户终身价值（CLV）。\n【与其他概念区分】市场细分是选客户的方法（前置），CRM是留住客户的方法（后置）。","k":"客户关系管理"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"设计分销渠道时，若产品体积大、价值高、技术复杂、需要专业安装服务，通常宜选择（　）。","o":["长渠道、宽渠道","短渠道、窄渠道（直销或独家分销）","越长越宽越好","不设渠道"],"a":[1],"e":"产品特性决定渠道形态：体积大、易腐、单价高、技术复杂、需要服务支持的产品，宜短渠道（减少中转损耗、保持服务与形象）——工业设备、大型家电、奢侈品常走直销或独家分销；低价、标准化、高频消费的日用品宜长宽渠道（密集铺货、就近购买）。此外还要看市场特性（目标顾客集中度）、企业自身资源与控制意愿、竞争格局。\n【判断口诀】“娇贵的产品走短道，亲民的货铺长街”。","k":"分销渠道的设计"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"选择经销商时，除考察其资金实力、销售网络外，还特别重视其经营合作意愿与商业信誉。这体现渠道成员选择的标准是（　）。","o":["只看报价最低","经营能力、合作意愿与信誉并重","只看规模最大","只看熟人关系"],"a":[1],"e":"渠道成员选择的三大类标准：经营能力（资金、网络、人员、仓储物流）、合作意愿（对企业产品的认同、配合促销与价格政策的意愿）、信誉与经营作风（守约、不窜货、不售假）。便宜和规模都是必要条件而非充分条件——渠道是“婚姻”不是“买卖”，选错再换代价极高。\n【管理闭环】选择（准入）→激励（返利培训）→评估（绩效）→调整（淘汰），四步循环。","k":"渠道成员的选择"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"特许方把自己的商标、经营模式等授权给受许方使用，收取特许经营费并提供统一培训与支持，受许方按统一模式经营。这种渠道方式属于（　）。","o":["直销","特许经营（连锁加盟）","代理出口","租赁经营"],"a":[1],"e":"特许经营的本质是“品牌＋模式”的授权复制：特许方输出商标、商号、经营技术（标准化手册、供应链），受许方付费（加盟费＋权益金）并在统一模式下经营、自担门店投资与经营风险。优点：扩张快、轻资产、标准统一；风险：管控不力会损害品牌（食品安全事故连坐）。\n【与直营连锁的区别】直营店总部出钱出人自负盈亏；加盟店受许人出钱、所有权归受许人，只受模式约束。","k":"特许经营"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"近年来许多制造企业减少中间批发层级、直接对接零售终端甚至消费者（如电商直营、DTC模式）。这种趋势称为（　）。","o":["渠道层级增加","渠道扁平化","渠道垄断化","渠道国有化"],"a":[1],"e":"渠道扁平化：压缩中间层级，让厂家更贴近终端与用户。动因：信息技术（电商、直播）让厂商可以直达消费者；层级越多加价越多、信息损耗越大；扁平化能降成本、控价格、快响应、拿数据。冲击最大的就是纯批发商——必须向“物流服务商、增值服务商”转型。\n【辩证看】扁平化不是越扁越好：覆盖广度需要中间商分担资金与物流功能，工业品、下沉市场仍离不开层级。","k":"渠道扁平化"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"single","q":"企业在设计渠道时，让线上电商与线下门店共同销售同一产品，却因线上价格更低导致线下经销商强烈不满。这种冲突属于（　）。","o":["水平渠道冲突","垂直渠道冲突","多渠道冲突","渠道成员评估"],"a":[2],"e":"多渠道（交叉）冲突：制造商建立两条以上渠道服务同一目标市场时发生——线上低价冲击线下、直销抢经销商生意，是电商时代最典型的渠道管理难题。与水平冲突（同层级成员间）、垂直冲突（上下层级间）并列。治理思路：产品区隔（线上专供款）、价格协同（线上线下同价或控制最低零售价）、订单归属分配（线下服务线上转化）。\n【判断口诀】“同一层级吵是水平，上下级吵是垂直，两条线打架是多渠道”。","k":"多渠道冲突"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"全面质量管理（TQM）强调产品质量靠全员、全过程、全组织的努力保证，其基本工作方法是（　）。","o":["PDCA循环（计划—执行—检查—处理）","EOQ订货","MRP运算","5S只是打扫卫生"],"a":[0],"e":"全面质量管理（TQM）“三全一多样”：全员参与、全过程控制（从设计、采购、生产到售后）、全组织管理，方法工具多样。核心工作逻辑是PDCA循环：计划（Plan）→执行（Do）→检查（Check）→处理（Act，固化标准或进入下一循环），循环上升持续改进。质量控制从“检验把关”（事后）演进到“统计过程控制”（事中）再到“全面质量管理”（全过程预防）。\n【记忆钩子】“全员全程全组织，PDCA转起来”。","k":"全面质量管理（TQM）"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"某设备组有设备10台，每台年有效工作时间2500小时，单位设备小时产量定额为0.5件/台时。该设备组的生产能力为（　）。","o":["5000件","10000件","12500件","25000件"],"a":[2],"e":"已知产量定额（每小时每台产多少件）时用乘法：生产能力＝设备数×有效工时×产量定额＝10×2500×0.5＝12500（件）。与台时定额版本（除法：10×2500÷5＝5000件）对照记忆——“定额是每小时产量用乘，是每件耗时分用除”，两题互为镜像。\n【防错提示】先看单位：件/台时（产量定额）还是台时/件（台时定额），再定乘除。","k":"生产能力的核算（产量定额法）"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"single","q":"网络计划技术（如关键路线法CPM）中，决定整个项目工期的路线是（　）。","o":["耗时最长的路线（关键路线）","耗时最短的路线","成本最低的路线","环节最少的路线"],"a":[0],"e":"网络计划把项目拆成工序、画成网络图：关键路线是从起点到终点耗时最长的路径，其总时长决定项目总工期——关键路线上的工序延误一天，项目就延误一天（无机动时间）；非关键路线有富余（时差），可抽出资源支援关键工序。工期压缩要从关键工序下手（赶工），压缩后关键路线可能转移。\n【记忆钩子】“最长的路决定工期，掐住关键别松手”。","k":"网络计划技术"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"物流管理中，压缩库存可以降低储存成本，但会增加缺货损失；提高服务水平又往往推高库存。成本与服务之间的这种矛盾称为（　）。","o":["效益背反（二律背反）","规模经济","范围经济","牛鞭效应"],"a":[0],"e":"效益背反（二律背反）：物流各要素之间存在此消彼长的冲突——库存与服务、包装与运输破损、自营与外包成本等。物流管理的核心方法论就是系统最优：不是每个环节都最省钱，而是总成本最低、总服务水平最优。牛鞭效应则是供应链上信息扭曲导致的需求波动放大现象，属于另一个独立考点。\n【记忆钩子】“按下葫芦浮起瓢，物流算的是总账”。","k":"物流管理的效益背反"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"物流功能要素中的包装，其基本功能不包括（　）。","o":["保护商品，防止破损污染","方便运输、装卸与储存（单元化）","促进销售（传达信息、吸引顾客）","改变商品的化学性质"],"a":[3],"e":"包装三大功能：保护（防破损、防潮、防污染——工业包装的根本任务）、便利（标准化、集装化，便于装卸运输储存与清点——单元化物流的基础）、促销（商业包装的装潢与信息传达）。改变商品化学性质是加工（如发酵、化学反应），不是包装的职能——包装再 fancy 也不能把果汁变成酒。\n【绿色物流视角】包装还是减塑、循环利用的主战场（可循环快递箱、瘦身胶带）。","k":"包装的功能"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"在城市配送中，按照用户要求，对小批量、多品种货物进行分拣、组配，并按时送达末端用户。这一物流功能是（　）。","o":["干线运输","配送","仓储保管","流通加工"],"a":[1],"e":"配送是“小批量、多品种、高频次、短距离”的末端物流活动，核心动作是分拣＋组配＋按时送达，是物流连接最终用户的“最后一公里”。它与运输的区别：运输是干线、大批量、长距离的“搬家”，配送是末端、小批量的“分发”。配送中心是现代流通企业的枢纽（前置仓、前置仓模式即其延伸）。\n【记忆钩子】“运输管长途大票，配送管最后一块”。","k":"配送"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"企业保持一定库存的主要积极作用不包括（　）。","o":["平衡供需、防止缺货断供","应对需求与供应的不确定性（安全库存）","获得批量采购的价格优惠","增加资金占用和仓储成本"],"a":[3],"e":"库存的正面作用：调节产销时间差、防缺货（安全库存）、享受批量折扣、稳定生产节奏。但库存同时是双刃剑——资金占用、储存成本、跌价与呆滞风险（D 把代价当成了“积极作用”，反向设问）。库存管理的本质是在“缺货风险”与“持有成本”之间找平衡，JIT追求的低库存不是零库存极端，而是靠流程可靠性把必要库存压到最低。\n【EOQ呼应】经济订货批量正是“订货成本与储存成本”平衡的数学解。","k":"库存的利弊"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"single","q":"对退货、回收的包装物、报废产品进行回收处理与再利用的物流活动，称为（　）。","o":["正向物流","逆向物流","干线物流","冷链物流"],"a":[1],"e":"逆向物流：货物从消费端“倒流”回起点的物流（退换货、召回、包装回收、废旧产品回收再制造），是绿色物流与循环经济的重要组成。难点：流量不确定、质量参差、成本核算难。电商时代退换货高频化，逆向物流能力直接影响客户体验与利润（“退货自由”背后的物流账）。\n【正逆对比】正向追求效率与准时，逆向追求追溯与合规（尤其危废、电器电子产品回收有法定责任）。","k":"逆向物流"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"企业依靠自身研发力量独立完成技术突破并拥有自主知识产权的创新战略是（　）。","o":["模仿创新战略","自主创新战略","合作创新战略","技术引进战略"],"a":[1],"e":"三大技术创新战略：自主创新——自主研发、率先突破，掌握知识产权，先发优势大但风险高投入大；模仿创新——跟随率先创新者，吸收改进再创新，投入低风险小但受制于人、面临专利壁垒；合作创新——企业间或产学研联合攻关，分摊成本、优势互补，适合重大共性技术（产业技术联盟）。\n【判断口诀】“第一个吃螃蟹是自主，跟着吃是模仿，合伙吃是合作”。","k":"技术创新战略的类型"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"我国专利权授予实行（　）。","o":["先发明原则","先申请原则（两个以上申请人分别就同样的发明创造申请专利的，专利权授予最先申请的人）","先使用原则","抽签决定"],"a":[1],"e":"我国专利实行先申请原则：同样的发明创造，专利授给最先申请的人——所以研发成果要及时申请，抢先使用不抢先申请反而可能为他人作嫁衣。配套制度：新颖性宽限期（特定公开后6个月内不丧失新颖性的法定情形）、抵触申请检索。\n【管理启示】“专利是跑出来的，不是藏出来的”——与商业秘密“捂出来”形成对照。","k":"专利的先申请原则"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"企业与高校、科研院所联合开展研发，共担投入、共享成果。这种创新组织方式属于（　）。","o":["产学研合作创新","政府行政命令创新","单一企业自主创新","技术引进模仿"],"a":[0],"e":"产学研合作把高校院所的“知识存量”与企业的“工程化、市场化能力”对接：成果转化、联合实验室、委托研发、产业技术联盟等形式。优点：分摊研发成本与风险、优势互补、加速成果转化；难点：知识产权归属约定、利益分配与保密。国家层面通过科技成果转化法、科研经费“放管服”等政策激励。\n【联动】合作创新战略是三大创新战略之一，与自主创新、模仿创新并列。","k":"产学研合作"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"single","q":"企业从外部购买技术许可、聘请专家或购置先进设备来获得技术能力，而非自己从头研发。这种获取技术的方式属于（　）。","o":["技术引进","自主创新","技术出口","基础研究"],"a":[0],"e":"技术引进：通过许可贸易、设备购置、合资合作、人才引进等渠道从外部获得技术，速度快、起点高，适合追赶阶段；但要消化吸收再创新，否则陷入“引进—落后—再引进”循环。技术出口则是反向输出。基础研究是探索普遍规律的原创科研，通常由高校科研机构承担，企业多以应用研究与开发为主。\n【战略组合】成熟企业往往“引进消化＋自主攻关”双轨并行。","k":"技术引进"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"企业为员工设计管理与专业技术并行的晋升通道，使技术骨干不必转管理岗也能获得职级与薪酬提升。这属于（　）。","o":["职业生涯管理（双通道发展）","末位淘汰","工作轮换","劳动定额管理"],"a":[0],"e":"职业生涯管理双通道：管理通道（主管→经理→总监）与专业技术通道（工程师→高级工程师→专家）并行，解决“当官才有前途”的独木桥问题，留住技术人才。配套工具：任职资格标准、导师制、培训发展计划。工作轮换是培养多技能与防止倦怠的岗位安排手段，不专指晋升通道设计。\n【记忆钩子】“不当官也能升级，技术大牛走专道”。","k":"职业生涯管理"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"培训效果评估的柯克帕特里克四层次模型，由浅入深的四个层次是（　）。","o":["反应、学习、行为、结果","学习、反应、结果、行为","计划、执行、检查、处理","招聘、培训、考核、薪酬"],"a":[0],"e":"柯氏四级评估：①反应层——学员满意吗（课后问卷）；②学习层——学到东西了吗（考试、演练）；③行为层——回到岗位行为变了吗（上级观察、90天回访）；④结果层——组织绩效改善了吗（产出、质量、成本）。层次越深评估越难、价值越大，多数企业只做到前两层。\n【记忆钩子】“听了说好（反应）、考会了（学习）、真去做了（行为）、业绩涨了（结果）”。","k":"培训评估（柯克帕特里克模型）"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"single","q":"根据劳动合同法，建立劳动关系应当订立书面劳动合同，订立时限为（　）。","o":["用工之日起一个月内","用工之日起六个月内","试用期满后","一年以后"],"a":[0],"e":"书面劳动合同必须在用工之日起一个月内订立；超过一个月不满一年未订立的，应当向劳动者每月支付二倍工资；满一年未订立的，视为已订立无固定期限劳动合同。这是“不签合同要付代价”的刚性约束，倒逼企业规范用工。\n【配套考点】试用期包含在劳动合同期限内；仅约定试用期的，试用期不成立、该期限为劳动合同期限。","k":"劳动合同的订立"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"某企业资本结构为：债务占40%、税后债务成本6%；权益占60%、权益成本12%。该企业的加权平均资金成本（WACC）为（　）。","o":["9.6%","18%","7.2%","10%"],"a":[0],"e":"WACC＝债务比例×税后债务成本＋权益比例×权益成本＝40%×6%＋60%×12%＝2.4%＋7.2%＝9.6%。注意债务成本必须用税后口径（利息可抵税）；权重用目标资本结构的市场价值比例更严谨。WACC常用作项目投资评价的基准折现率。\n【决策含义】项目的内含报酬率高于WACC才创造价值——低于9.6%的项目在“给银行打工”。","k":"加权平均资金成本（WACC）"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"single","q":"互斥方案（只能选其一）的投资决策中，当各方案计算期相同时，应选择（　）。","o":["净现值最大的方案","投资额最小的方案","回收期最长的方案","会计利润率最高的方案"],"a":[0],"e":"互斥方案比选看“绝对价值”：计算期相同时选NPV最大者；计算期不同时可用年等额净回收额法（年均化）比较。回收期只是辅助指标（不管回收期后的现金流），会计利润率不含时间价值——都不能单独作为互斥决策标准。内含报酬率在互斥方案中还可能与NPV结论冲突（规模差异），以NPV为准。\n【记忆钩子】“独立方案看门槛（IRR≥基准），互斥方案比大小（NPV最大）”。","k":"互斥方案的决策规则"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"电子商务交易安全要求信息在传输中不被窃取和篡改、交易者不能否认自己的行为、参与方身份真实可靠。对应的四项安全要素是（　）。","o":["保密性、完整性、不可抵赖性、交易者身份的真实性","盈利性、流动性、安全性、收益性","可测性、可控性、相关性、稳定性","强制性、无偿性、固定性、及时性"],"a":[0],"e":"电子商务安全四要素：保密性（加密防窃听）、完整性（防篡改，校验/哈希）、不可抵赖性（数字签名让对方无法抵赖）、身份真实性（数字证书认证）。支撑技术：非对称加密、数字签名与数字证书（CA认证）、防火墙等。\n【口诀】“保密、完整、赖不掉、人是真的”。","k":"电子商务的安全要素"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"电子商务对传统商务的最主要变革之一，是显著降低了（　）。","o":["交易成本与信息不对称","商品质量","消费者选择权","物流配送效率"],"a":[0],"e":"电子商务降低三类成本：搜寻成本（比价信息一键可得）、交易成本（签约支付线上化）、渠道成本（去中介直达）；同时缓解信息不对称（评价体系、比价工具），倒逼价格透明与服务改进。这也是平台型商业模式崛起的经济逻辑——用技术把“撮合”成本压到极低。\n【辩证】也带来新问题：数据安全、刷单炒信、平台垄断——制度要跟上技术。","k":"电子商务对经济活动的影响"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"平台型电商的“双边市场”特征是：一侧用户越多，对另一侧用户的吸引力越大。这种效应称为（　）。","o":["交叉网络外部性","规模不经济","挤出效应","替代效应"],"a":[0],"e":"交叉网络外部性：平台一侧（买家）的规模提升另一侧（卖家）的接入价值，反之亦然——买家多吸引卖家，卖家多丰富买家选择，形成正反馈“赢者通吃”倾向。平台定价也特殊：常对一边免费或补贴（消费者），向另一边收费（商家佣金广告）。这正是平台反垄断监管关注的网络效应与“二选一”问题的经济根源。\n【记忆钩子】“两边人互相拉客，平台越大越值钱”。","k":"平台经济与双边市场"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"根据电子商务法，电子商务平台经营者对平台内经营者资质资格未尽到审核义务，或者对消费者未尽到安全保障义务，造成消费者损害的（　）。","o":["与平台内经营者承担连带责任（或依法承担相应的责任）","一律不承担责任","只承担道德责任","由消费者全部自担"],"a":[0],"e":"电子商务法压实平台责任：对平台内经营者未尽资质审核义务（如无证食品经营）或未尽消费者安全保障义务造成损害的，依法承担连带责任或相应责任；知道或应当知道侵权而不采取必要措施的，与经营者承担连带责任。同时平台须公示经营者资质、记录交易信息保存不少于三年、依法报送纳税信息。\n【监管逻辑】“平台收了佣金，就要管好场子”。","k":"电子商务平台的法律责任"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"single","q":"电商平台上商家通过虚构交易、编造用户评价等方式提升店铺信誉。这种行为（　）。","o":["属于正常的营销手段","属于虚假宣传，违反电子商务法和反不正当竞争法","只违反平台内部规则，不违法","有利于消费者决策"],"a":[1],"e":"刷单炒信是典型的虚假交易与虚假宣传：虚构销量、评价欺骗消费者、误导市场，违反电子商务法（不得以虚构交易、编造用户评价等方式进行虚假或引人误解的商业宣传）和反不正当竞争法，情节严重的可追究法律责任；组织刷单的“职业刷单”还可能构成非法经营。平台通过大数据识别虚假交易并降权封店。\n【对照记忆】合法的促销打折是“真让利”，刷单是“假繁荣”。","k":"电子商务中的虚假交易"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"跨国公司按产品线在全球范围设置事业部（如家电事业部、手机事业部各自管理全球业务）。这种组织结构是（　）。","o":["全球产品结构","全球地区结构","全球矩阵结构","国内职能结构"],"a":[0],"e":"跨国公司组织结构三种典型：全球产品结构——按产品线全球统筹，利于全球技术协同与品牌统一；全球地区结构——按区域设事业部，利于响应各地市场差异；全球矩阵结构——产品与地区双线汇报，兼顾两者但管理复杂、易多头指挥。选择逻辑与战略匹配：全球标准化战略多用产品结构，本土化战略多用地区结构。\n【记忆钩子】“产品线纵着管（产品型），地图横着分（地区型），十字交叉是矩阵”。","k":"跨国公司的组织结构"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"企业在海外经营中面临东道国政局动荡、政策突变、征收国有化等风险。这类风险统称为（　）。","o":["政治风险","技术风险","纯财务核算风险","库存风险"],"a":[0],"e":"政治风险：东道国政治环境变化给外资带来的损失风险——政局动荡、政策与法律突变、外汇管制、征收与国有化、战争恐怖主义等。管理手段：投资前风险评估（国家风险评级）、与东道国政府谈判协议、投保海外投资保险（如中国信保）、合资本地化、渐进投入。\n【国际商务风险族】政治风险、汇率风险（财务）、文化与管理差异风险、法律合规风险——各有对策，别混。","k":"国际商务中的政治风险"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"single","q":"自由贸易试验区、自由贸易港的核心使命是（　）。","o":["进行制度创新试验，形成可复制推广的经验","提高关税保护本地企业","限制外资进入","替代 WTO 裁决机制"],"a":[0],"e":"我国自贸试验区（自贸港）的定位是“制度创新试验田”：在贸易便利化、投资自由化（负面清单管理）、金融开放、政府监管等领域先行先试，成熟经验复制推广全国——不是给特殊政策“栽盆景”，而是种“苗圃”。海南自由贸易港对标世界最高水平开放形态（零关税、低税率、简税制、货物资金人员进出自由便利）。\n【联动考点】RCEP（区域全面经济伙伴关系协定）是全球规模最大的自贸区，与自贸试验区共同构成开放格局。","k":"自由贸易试验区"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"multi","q":"按波士顿矩阵，企业对不同类型的业务应采取的对策包括（　）。","o":["对明星业务加大投资，扩大市场占有率","对金牛业务维持现状、收获现金，用其利润支持其他业务","对问题业务择优扶植，无前途的及时放弃","对瘦狗业务继续追加大量投资","对所有业务平均分配资源"],"a":[0,1,2],"e":"波士顿矩阵的管理含义：明星（双高）——重点投资培养成未来金牛；金牛（低增长高份额）——收获现金“挤奶”养其他业务；问题（高增长低份额）——选择性投入，行就推成明星、不行就放弃；瘦狗（双低）——收缩、收割或撤退（D 反了）。平均分配资源（E）违背组合管理“抓重点”的思想——矩阵的全部意义就是差别化配置。\n【记忆钩子】“养明星、挤金牛、赌问题、裁瘦狗”。","k":"波士顿矩阵的对策","fig":"boston"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"multi","q":"波特价值链分析中，属于基本活动（主体活动）的有（　）。","o":["内部后勤（原料接收与存储）","生产作业","外部后勤（成品储运）","市场营销与销售","人力资源管理"],"a":[0,1,2,3],"e":"价值链两分：基本活动——内部后勤、生产作业、外部后勤、市场营销与销售、售后服务（直接创造价值的链条）；支持活动——企业基础设施（财务、计划等）、人力资源管理、技术开发、采购（为基本活动提供保障）。人力资源属于支持活动（E），这是最常见的归类陷阱。\n【记忆钩子】“五段流水线是基本，四大后台是支持”。","k":"价值链分析","fig":"value-chain"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"multi","q":"促销组合的主要方式包括（　）。","o":["广告","人员推销","销售促进（营业推广）","公共关系","渠道窜货"],"a":[0,1,2,3],"e":"促销组合四大工具：广告（大众传播）、人员推销（面对面沟通，工业品主力）、销售促进（限时打折、赠品、抽奖等短期刺激）、公共关系（新闻报道、事件营销塑造形象）。各工具长短互补：广告广而浅、人员推销深而贵、促销快而短效、公关慢但可信度高。渠道窜货是渠道管理问题，不是促销手段（E）。\n【策略选择】消费品偏广告+促销，工业品偏人员推销+公关。","k":"促销组合"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"multi","q":"分销渠道的功能包括（　）。","o":["集散商品（化整为零、聚零为整）","实现销售、沟通信息","物流储运与资金融通","承担市场风险","替代生产企业进行产品研发设计"],"a":[0,1,2,3],"e":"渠道成员的五大功能：商品集散、销售实现与信息传递、实体储运、资金融通（预付款、赊销垫资）、风险承担（存货跌价、呆账）。研发设计是制造商的核心职能，渠道可以反馈市场需求信息，但不“替代”研发（E 越位）。\n【理解要点】渠道存在的理由＝它替厂家干了厂家自己干成本更高的事——功能视角是理解渠道冲突与扁平化的钥匙。","k":"分销渠道的功能"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"multi","q":"看板管理中，看板的主要功能包括（　）。","o":["传递领料和生产的指令","防止过量生产和过量运送","进行目视管理，暴露现场问题","替代所有质量检验","作为与供应商结算货款的唯一法律凭证"],"a":[0,1,2],"e":"看板是JIT的“神经信号”：领料看板与生产看板传递“什么时候、生产/领取多少”的指令（A）；因为“没有看板不生产、不运送”，天然防止过量（B）；看板随物流在现场流动，异常一眼可见，是目视化管理工具（C）。质量靠源头保证与自働化控制，看板不能替代检验（D）；结算靠合同与发票，看板是企业内部（或紧密协作圈）的物流信息载体（E 越权）。\n【规则记忆】“不见看板不生产、不运送，看板跟着零件走”。","k":"看板管理"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"multi","q":"绩效考核中常见的考核误区（考核者主观偏差）包括（　）。","o":["晕轮效应（以偏概全，一个优点掩盖全部）","趋中倾向（不敢打高分也不打低分，都给中间分）","近因效应（只凭最近表现评分）","宽大化倾向（普遍打高分，做老好人）","360度全方位考核"],"a":[0,1,2,3],"e":"考核者偏差四件套：晕轮、趋中、近因、宽大化（还有苛严化、首因效应等），都属于“人打分带偏见”的方法论问题，对策是量化指标、多维考核、校准会议、考核者培训。360度考核是试图用多视角抵消单一偏差的考核方法，是“纠偏工具”，不是偏差本身（E）。\n【答题直觉】“效应/倾向”是偏差，“方法/技术”是工具，两类词混在选项里先分类。","k":"绩效考核的误区"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"multi","q":"企业薪酬体系设计应当遵循的原则包括（　）。","o":["公平性原则（内部公平、外部公平、个人公平）","竞争性原则（薪酬水平有外部竞争力）","激励性原则（绩效与报酬挂钩，拉开差距）","经济性（成本可控）与合法性原则（不低于最低工资等法定要求）","平均主义原则（人人拿一样的薪酬最稳定）"],"a":[0,1,2,3],"e":"薪酬设计五原则：公平（三种公平缺一不可）、竞争（对标市场，关键人才给得起）、激励（干好干坏不一样）、经济（薪酬总额与效益匹配）、合法（最低工资、社保、加班费红线）。平均主义恰恰抹杀了激励与公平中的“个人公平”——干多干少一个样是薪酬设计的大忌（E）。\n【判断口诀】“对内要公、对外要抢、对人要拉差距、对账要算得起、对法要守线”。","k":"薪酬设计原则"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"multi","q":"下列筹资方式中，属于债务性筹资的有（　）。","o":["银行借款","发行公司债券","融资租赁","商业信用（应付账款）","吸收直接投资"],"a":[0,1,2,3],"e":"债务筹资的特征是“到期还本付息、形成固定负担”：银行借款、债券、融资租赁（分期付租金、实质融资＋融物）、商业信用（占用供应商货款，零成本但有时限）都属于此类。吸收直接投资形成所有者权益，不还本、不分红义务固定（按盈利分配），是权益筹资（E）。\n【风险视角】债务比例高→财务杠杆放大收益也放大风险→利息保障倍数、资产负债率是监控仪表。","k":"筹资方式（债务性）"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"multi","q":"B2B电子商务平台按服务模式可分为（　）。","o":["水平型（综合型）平台：面向多行业提供通用交易服务","垂直型（专业型）平台：深耕特定行业上下游","自建型平台：大型企业自建的采购或销售平台","跨境B2B平台：连接国内外企业间交易","个人闲置物品转让平台"],"a":[0,1,2,3],"e":"B2B平台形态：水平综合型（多行业通用，如1688批发）、垂直专业型（钢铁、化塑等行业纵深，懂行、供应链服务深）、企业自建（采购商城/分销系统）、跨境B2B（阿里巴巴国际站等）。个人闲置转让属于C2C场景（E），与B2B的“企业间交易”定位不符。\n【判断锚点】问两个问题：“交易双方是企业吗？”“平台横向铺开还是纵向扎深？”","k":"B2B电子商务平台"},{"s":"gs","p":"工商管理实务","c":11,"cn":"国际商务运营","t":"multi","q":"国际贸易中常用的结算方式包括（　）。","o":["汇付（电汇T/T、信汇、票汇）","托收（付款交单D/P、承兑交单D/A）","信用证（L/C）","赊销记账（O/A）","以物易物的原始交换"],"a":[0,1,2,3],"e":"国际结算三大传统方式＋变体：汇付（商业信用，预付或货到付款）、托收（银行代办收款但银行不担责，仍属商业信用，D/P凭付款交单、D/A凭承兑交单）、信用证（银行信用，开证行第一性付款责任）；赊销O/A在成熟市场关系中也常用（买方市场下越来越普遍，但卖方风险最大）。银行信用与商业信用的分界是核心考点：只有信用证由银行承担付款责任。\n【风险排序】预付货款对卖方最安全，O/A对卖方风险最高，信用证居中但单据要求严格。","k":"国际结算方式"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"multi","q":"企业实施成本领先战略的主要途径包括（　）。","o":["扩大规模，摊薄固定成本","改进工艺、优化流程以降低消耗","严控管理费用等各项成本开支","塑造独特品牌形象并收取溢价","比竞争对手更早推出全新产品"],"a":[0,1,2],"e":"成本领先战略拼的是“同样的东西更便宜”：规模经济（A）、工艺与流程降耗（B）、全成本控制（C）是三条主路径。D 是差异化战略的做法（用独特性换溢价）；E 属于创新/先动策略，与成本领先没有必然关系。\n【对照记忆】“成本领先靠省，差异化靠独特，集中化靠聚焦”。","k":"成本领先战略"},{"s":"gs","p":"工商管理实务","c":1,"cn":"企业战略与经营决策","t":"multi","q":"企业实现差异化的途径包括（　）。","o":["产品设计与功能差异化","服务差异化（安装、维修、响应速度）","品牌形象与传播差异化","渠道与购买体验差异化","把价格降到行业最低"],"a":[0,1,2,3],"e":"差异化的本质是“顾客觉得不一样并愿意多付钱”：产品、服务、品牌形象、渠道体验都是常见载体。价格最低是成本领先战略的打法，不是差异化（E）——靠低价吸引来的顾客对价格敏感、毫无忠诚，恰恰与差异化逻辑相悖。","k":"差异化战略"},{"s":"gs","p":"工商管理实务","c":3,"cn":"市场营销与品牌管理","t":"multi","q":"有效的市场细分应满足的条件包括（　）。","o":["可衡量性（细分标准的规模与购买力可以测量）","可进入性（企业有能力触达并服务该子市场）","可盈利性（子市场规模足够、有利可图）","可区分性（子市场之间对营销组合的反应明显不同）","子市场数量越多越好"],"a":[0,1,2,3],"e":"有效细分四性：可衡量、可进入、可盈利、可区分。子市场并非越多越好——切得过细会导致每个子市场都太小、服务成本高企（E 错），细分的目的是“选中值得打的仗”，不是“把市场切碎”。\n【答题直觉】“越细越好”类绝对化表述，在营销题里基本都是错的。","k":"市场细分的有效性"},{"s":"gs","p":"工商管理实务","c":4,"cn":"分销渠道管理","t":"multi","q":"制造商激励渠道成员的常用方式包括（　）。","o":["销售返利与年终奖励","促销支持与广告补贴","培训与技术指导","资金支持（赊销额度、账期放宽）","单方面提高供货价格"],"a":[0,1,2,3],"e":"渠道激励四大类：利益激励（返利、奖励、账期）、支持激励（促销资源、培训）、关系激励（授予区域、联合规划）。单方面提价是挤压渠道利润的行为，方向正好相反（E）——激励的本质是“让渠道跟着你有肉吃”。\n【联动】激励要与评估挂钩：完成配额、不窜货的才拿满返利，否则激励会养出乱价者。","k":"渠道成员的激励"},{"s":"gs","p":"工商管理实务","c":5,"cn":"生产管理","t":"multi","q":"现场管理“5S”活动的内容包括（　）。","o":["整理（要与不要，一留一清）","整顿（科学布局、取用快捷）","清扫（清除垃圾与污渍）","清洁（形成制度、保持成果）","素养（养成习惯、遵守规范）"],"a":[0,1,2,3,4],"e":"5S 全对题：整理、整顿、清扫、清洁、素养（日语罗马字均以S开头）。它是一切现场管理（精益生产、TQM）的基础工程——没有干净的现场，就没有稳定的质量。\n【记忆钩子】“分开留、排好队、扫干净、成制度、变习惯”。这类全选型多选题在考试里出现频率不低，认准“5S=五个S”即可。","k":"现场管理（5S）"},{"s":"gs","p":"工商管理实务","c":6,"cn":"物流管理","t":"multi","q":"常用的库存控制方法包括（　）。","o":["定量订货法（库存降到订货点即下单）","定期订货法（固定周期检查并补货）","ABC分类控制法","准时制（JIT）库存控制","凭经验随手采购"],"a":[0,1,2,3],"e":"库存控制四大方法：定量订货（订货点触发，量固定时点不固定）、定期订货（固定周期订货，时固定量不固定）、ABC分类（差异化投入管理精力）、JIT（按需求拉动、追求低库存）。凭经验随手采购没有量化规则与制度支撑，正是库存管理要革除的对象（E）。\n【对比记忆】“定量管点，定期管段，ABC分轻重，JIT除库存”。","k":"库存控制的方法"},{"s":"gs","p":"工商管理实务","c":7,"cn":"技术创新管理","t":"multi","q":"知识产权的主要类型包括（　）。","o":["专利权（发明、实用新型、外观设计）","商标权","著作权（版权）","商业秘密","企业组织架构图"],"a":[0,1,2,3],"e":"知识产权是智力成果的专有权利：专利、商标、著作权、商业秘密（反不正当竞争法保护）为核心类型，还有地理标志、集成电路布图设计、植物新品种等。组织架构图是企业管理文件，不属于受知识产权专门法保护的智力成果（E）。\n【联动】不同类型的保护方式与期限差异（专利有期限、商标可续展、商业秘密靠保密）是常考组合。","k":"知识产权的类型"},{"s":"gs","p":"工商管理实务","c":8,"cn":"人力资源管理","t":"multi","q":"内部招聘的主要渠道包括（　）。","o":["内部晋升","内部竞聘上岗","岗位轮换","员工推荐","校园招聘"],"a":[0,1,2],"e":"内部招聘从现有员工中选拔：晋升（向上）、竞聘（公开竞争上岗）、轮换（平级流动培养复合能力）。员工推荐属于外部招聘的一种辅助渠道——被推荐者是公司以外的人；校园招聘更是典型的外部招聘（E）。\n【边界判断】问一句“人在不在我公司名册上”：在，内部；不在，外部。","k":"内部招聘与外部招聘"},{"s":"gs","p":"工商管理实务","c":9,"cn":"企业投融资决策","t":"multi","q":"下列项目投资评价指标中，属于静态（非折现）指标的有（　）。","o":["静态投资回收期","会计收益率（投资利润率）","净现值（NPV）","内含报酬率（IRR）","现值指数"],"a":[0,1],"e":"静态指标不折现：静态回收期、会计收益率——简单直观但忽视货币时间价值。NPV、IRR、现值指数都建立在现金流折现基础上，属于动态（折现）指标，评价结论更科学。\n【成对记忆】“静态俩：回收期+会计收益率；动态仨：NPV+IRR+现值指数”。","k":"投资评价指标体系"},{"s":"gs","p":"工商管理实务","c":10,"cn":"电子商务","t":"multi","q":"电子支付的主要类型包括（　）。","o":["网上支付（网上银行）","移动支付（手机支付、扫码）","电话支付","第三方平台支付","以货易货"],"a":[0,1,2,3],"e":"电子支付是电子化手段完成的货币支付与资金转移：网上银行支付、移动支付（已成绝对主流）、电话支付、第三方支付平台（支付宝、微信支付，兼具担保功能）等。以货易货是原始的商品交换方式，连“货币”都不涉及（E）。\n【联动考点】第三方支付的资金中转与担保机制、支付安全（保密性、完整性、不可抵赖性）。","k":"电子支付的类型"},{"s":"gs","p":"案例分析","c":1,"cn":"案例一：华宇家电的战略抉择","t":"single","bg":"华宇家电公司主营洗衣机，面对的外部环境包括：国家出台以旧换新补贴政策；居民可支配收入持续增长；消费者健康洗护意识增强；直驱变频与物联网技术快速普及。公司现有三条业务线：A波轮洗衣机（市场增长率5%，相对市场份额35%，行业第一）；B高端滚筒（市场增长率25%，相对份额8%）；C老式双缸（增长率−10%，份额3%）。公司正考虑向上游电机厂投资建厂以保障核心部件供应。","q":"“以旧换新补贴政策”和“居民可支配收入增长”属于企业外部环境分析中的（　）。","o":["政治法律环境与经济环境","技术环境与社会文化环境","行业竞争环境","企业内部环境"],"a":[0],"e":"PEST归因：政府补贴是政治法律（政策）环境；居民收入是经济环境。健康意识属于社会文化环境、物联网技术属于技术环境——四种环境要素各归各位，是案例分析中“给材料贴标签”的基本功。","k":"PEST宏观环境分析"},{"s":"gs","p":"案例分析","c":1,"cn":"案例一：华宇家电的战略抉择","t":"single","bg":"华宇家电公司主营洗衣机，面对的外部环境包括：国家出台以旧换新补贴政策；居民可支配收入持续增长；消费者健康洗护意识增强；直驱变频与物联网技术快速普及。公司现有三条业务线：A波轮洗衣机（市场增长率5%，相对市场份额35%，行业第一）；B高端滚筒（市场增长率25%，相对份额8%）；C老式双缸（增长率−10%，份额3%）。公司正考虑向上游电机厂投资建厂以保障核心部件供应。","q":"按波士顿矩阵划分，B高端滚筒业务（高增长率、低份额）属于（　）。","o":["明星业务","金牛业务","问题业务","瘦狗业务"],"a":[2],"e":"B业务增长率25%（高）但相对份额仅8%（低），落在“问题业务”象限：市场有前途、自身地位弱，需要择优扶植（加大投入冲份额）或果断放弃。A业务双高特征趋近明星；C业务双低为瘦狗。案例题给数据让你“对号入座”，先看增长率、再看相对份额，两个维度缺一不可。","k":"波士顿矩阵的应用","fig":"boston"},{"s":"gs","p":"案例分析","c":1,"cn":"案例一：华宇家电的战略抉择","t":"single","bg":"华宇家电公司主营洗衣机，面对的外部环境包括：国家出台以旧换新补贴政策；居民可支配收入持续增长；消费者健康洗护意识增强；直驱变频与物联网技术快速普及。公司现有三条业务线：A波轮洗衣机（市场增长率5%，相对市场份额35%，行业第一）；B高端滚筒（市场增长率25%，相对份额8%）；C老式双缸（增长率−10%，份额3%）。公司正考虑向上游电机厂投资建厂以保障核心部件供应。","q":"华宇投资建设电机厂以保障核心部件供应，该战略属于（　）。","o":["前向一体化","后向一体化","横向一体化","市场开发战略"],"a":[1],"e":"电机是洗衣机的上游零部件，整机厂向上游延伸控制供应环节＝后向一体化。判断锚点：看被投资方在产业链上的位置——原材料/零部件（上游）是后向，分销/终端（下游）是前向，同行是横向。","k":"一体化战略的判别"},{"s":"gs","p":"案例分析","c":1,"cn":"案例一：华宇家电的战略抉择","t":"multi","bg":"华宇家电公司主营洗衣机，面对的外部环境包括：国家出台以旧换新补贴政策；居民可支配收入持续增长；消费者健康洗护意识增强；直驱变频与物联网技术快速普及。公司现有三条业务线：A波轮洗衣机（市场增长率5%，相对市场份额35%，行业第一）；B高端滚筒（市场增长率25%，相对份额8%）；C老式双缸（增长率−10%，份额3%）。公司正考虑向上游电机厂投资建厂以保障核心部件供应。","q":"对C老式双缸洗衣机业务（增长率−10%、份额3%），合理的对策包括（　）。","o":["不再追加新的产能投资","利用现有渠道逐步收割剩余利润","制定退出计划，有序收缩","将其列为公司未来三年的战略重点","追加投资扩产与竞争对手正面抢占份额"],"a":[0,1,2],"e":"C业务双低（市场萎缩、地位边缘）是典型瘦狗业务：停止输血（A）、收割残值（B）、有序退出（C）是教科书式处置；把它当战略重点（D）或扩产抢份额（E）都与象限特征背道而驰。案例分析中“资源向谁配置”的答案，永远要与业务在矩阵中的位置自洽。","k":"瘦狗业务的处置"},{"s":"gs","p":"案例分析","c":2,"cn":"案例二：青荷茶饮的市场打法","t":"single","bg":"青荷茶饮初创，进入竞争激烈的新茶饮市场。市场调研发现三类客群：学生党（价格敏感）、都市白领（重品质与社交场景）、家庭客（大杯实惠）。公司选定白领为核心客群，主打“0卡糖＋鲜奶茶”，上市定价略低于头部品牌约20%，采取线上小程序点单＋外卖平台＋线下门店同步销售。开业后线上促销降价引发线下加盟商强烈不满。公司邀请本地美食博主探店传播，并推出“第二杯半价”限时活动。","q":"“选定白领为核心客群”属于STP战略中的（　）。","o":["市场细分（S）","目标市场选择（T）","市场定位（P）","渠道决策"],"a":[1],"e":"先区分三个动作：发现学生/白领/家庭三类需求差异是市场细分（S）；决定“主攻白领”是目标市场选择（T）；“0卡糖＋鲜奶”树立健康品质形象是市场定位（P）。案例题常把三个动作写在一段话里，考的就是你能不能切开。","k":"STP战略的区分"},{"s":"gs","p":"案例分析","c":2,"cn":"案例二：青荷茶饮的市场打法","t":"single","bg":"青荷茶饮初创，进入竞争激烈的新茶饮市场。市场调研发现三类客群：学生党（价格敏感）、都市白领（重品质与社交场景）、家庭客（大杯实惠）。公司选定白领为核心客群，主打“0卡糖＋鲜奶茶”，上市定价略低于头部品牌约20%，采取线上小程序点单＋外卖平台＋线下门店同步销售。开业后线上促销降价引发线下加盟商强烈不满。公司邀请本地美食博主探店传播，并推出“第二杯半价”限时活动。","q":"“定价略低于头部品牌约20%以快速抢占市场”的定价策略属于（　）。","o":["撇脂定价","渗透定价","差别定价","心理定价"],"a":[1],"e":"低价切入、让利于量、迅速扩大份额＝渗透定价，适用于需求弹性大、易模仿、需要快速上量的茶饮市场。撇脂定价是高价收割早期利润（科技新品常用），方向恰好相反。","k":"新产品定价策略"},{"s":"gs","p":"案例分析","c":2,"cn":"案例二：青荷茶饮的市场打法","t":"single","bg":"青荷茶饮初创，进入竞争激烈的新茶饮市场。市场调研发现三类客群：学生党（价格敏感）、都市白领（重品质与社交场景）、家庭客（大杯实惠）。公司选定白领为核心客群，主打“0卡糖＋鲜奶茶”，上市定价略低于头部品牌约20%，采取线上小程序点单＋外卖平台＋线下门店同步销售。开业后线上促销降价引发线下加盟商强烈不满。公司邀请本地美食博主探店传播，并推出“第二杯半价”限时活动。","q":"线上渠道降价冲击线下加盟商利益，该渠道冲突属于（　）。","o":["水平渠道冲突","垂直渠道冲突","多渠道冲突","渠道成员竞争"],"a":[2],"e":"同一制造商开辟多条渠道服务同一市场（线上＋线下）并互相“抢客压价”，是多渠道（交叉）冲突的教科书场景。区分：加盟商与直营店同为“下一层”吵是水平冲突，厂家与经销商上下级吵是垂直冲突；本题的病根在“两条渠道体系之间”。治理：产品区隔（线上专供款）、价格协同、订单归属分配。","k":"多渠道冲突"},{"s":"gs","p":"案例分析","c":2,"cn":"案例二：青荷茶饮的市场打法","t":"multi","bg":"青荷茶饮初创，进入竞争激烈的新茶饮市场。市场调研发现三类客群：学生党（价格敏感）、都市白领（重品质与社交场景）、家庭客（大杯实惠）。公司选定白领为核心客群，主打“0卡糖＋鲜奶茶”，上市定价略低于头部品牌约20%，采取线上小程序点单＋外卖平台＋线下门店同步销售。开业后线上促销降价引发线下加盟商强烈不满。公司邀请本地美食博主探店传播，并推出“第二杯半价”限时活动。","q":"“美食博主探店传播”和“第二杯半价”分别属于促销组合中的（　）。","o":["广告","人员推销","公共关系","销售促进"],"a":[2,3],"e":"博主探店借第三方之口塑造口碑与曝光，属公共关系（口碑营销是公关的数字形态）；“第二杯半价”是限时让利的短期刺激，属销售促进。广告是付费购买媒介版面自己说好话，人员推销是一对一面谈——四个工具按“谁在说、对谁说、说多久”来辨。","k":"促销组合工具的辨析"},{"s":"gs","p":"案例分析","c":3,"cn":"案例三：宏达零部件的流水线","t":"single","bg":"宏达公司为整车厂配套生产刹车片，品种少、批量大，采用专用设备流水线生产。某型号刹车片日需求800件，流水线每日两班有效工作时间960分钟。公司推行“在整车厂需要的时间、按需要的量供应”模式，以看板传递需求信号，致力于消除在制品库存。物料需求由系统根据主生产计划、产品结构清单和库存数据自动运算生成采购与生产指令。","q":"宏达公司的生产类型属于（　）。","o":["单件生产","成批生产","大量生产","订货型单件定制"],"a":[2],"e":"“品种少、批量大、专用设备流水线、为固定客户持续供货”是大量生产的标准画像。判断三看：品种数、重复程度、设备专用性。","k":"生产类型的判别"},{"s":"gs","p":"案例分析","c":3,"cn":"案例三：宏达零部件的流水线","t":"single","bg":"宏达公司为整车厂配套生产刹车片，品种少、批量大，采用专用设备流水线生产。某型号刹车片日需求800件，流水线每日两班有效工作时间960分钟。公司推行“在整车厂需要的时间、按需要的量供应”模式，以看板传递需求信号，致力于消除在制品库存。物料需求由系统根据主生产计划、产品结构清单和库存数据自动运算生成采购与生产指令。","q":"该流水线的节拍为（　）。","o":["0.8分钟/件","1.0分钟/件","1.2分钟/件","1.5分钟/件"],"a":[2],"e":"节拍＝有效工作时间÷计划产量＝960÷800＝1.2分钟/件，即平均每1.2分钟出产一件。计算题先认准分子分母：有效工时在上、需求量在下，别倒过来。","k":"流水线节拍的计算"},{"s":"gs","p":"案例分析","c":3,"cn":"案例三：宏达零部件的流水线","t":"single","bg":"宏达公司为整车厂配套生产刹车片，品种少、批量大，采用专用设备流水线生产。某型号刹车片日需求800件，流水线每日两班有效工作时间960分钟。公司推行“在整车厂需要的时间、按需要的量供应”模式，以看板传递需求信号，致力于消除在制品库存。物料需求由系统根据主生产计划、产品结构清单和库存数据自动运算生成采购与生产指令。","q":"公司推行“在需要的时间、按需要的量供应”，这种生产方式是（　）。","o":["MRPⅡ","准时制（JIT）生产","大量定制","预测驱动的大批量生产"],"a":[1],"e":"JIT的标志句就是“在需要的时候、按需要的量、生产需要的物品”，配套拉动式看板与消除浪费目标。它与MRP的推动式逻辑相反（MRP按计划“推”，JIT按需求“拉”），本题材料中看板信号是JIT的铁证。","k":"准时制生产"},{"s":"gs","p":"案例分析","c":3,"cn":"案例三：宏达零部件的流水线","t":"multi","bg":"宏达公司为整车厂配套生产刹车片，品种少、批量大，采用专用设备流水线生产。某型号刹车片日需求800件，流水线每日两班有效工作时间960分钟。公司推行“在整车厂需要的时间、按需要的量供应”模式，以看板传递需求信号，致力于消除在制品库存。物料需求由系统根据主生产计划、产品结构清单和库存数据自动运算生成采购与生产指令。","q":"案例中MRP系统运算所需的输入信息包括（　）。","o":["主生产计划（MPS）","物料清单（BOM）","库存信息","设备折旧率","员工考勤表"],"a":[0,1,2],"e":"材料里“主生产计划、产品结构清单（即BOM）、库存数据”三个词与MRP三大输入一一对应。设备折旧率、考勤表是财务与人事信息，不参与物料需求运算。\n【案例技巧】题干把输入项“翻译”成了业务语言，要能对回术语——这是案例分析题的常见考法。","k":"MRP的输入"},{"s":"gs","p":"案例分析","c":4,"cn":"案例四：岚山科技的绩效改革","t":"single","bg":"岚山科技是一家200人的软件公司，员工反映“干多干少一个样”，公司此前仅按出勤发放固定工资。新方案：第一步对全部岗位进行职位分析并编写工作说明书；第二步建立KPI指标体系并引入360度考核；第三步将考核结果与奖金、晋升挂钩。技术骨干提出“只有转管理岗才能涨薪”，公司随之增设技术专家职级通道。核心工程师老王拿到2万元绩效奖后仍提出离职，深度访谈显示其离职动因是“项目缺乏挑战、工作得不到认可”。","q":"“对全部岗位进行职位分析并编写工作说明书”，这项工作的直接输出是（　）。","o":["工作说明书与任职资格说明书","劳动合同","绩效考核表","工资条"],"a":[0],"e":"工作分析输出两个文件：工作描述（做什么、怎么做）＋任职资格（要什么人）。它是后续KPI设计、招聘、薪酬定级的基础——案例里“第一步做职位分析”的顺序安排本身就有考点意味：没有工作分析，考核指标就是无源之水。","k":"工作分析"},{"s":"gs","p":"案例分析","c":4,"cn":"案例四：岚山科技的绩效改革","t":"single","bg":"岚山科技是一家200人的软件公司，员工反映“干多干少一个样”，公司此前仅按出勤发放固定工资。新方案：第一步对全部岗位进行职位分析并编写工作说明书；第二步建立KPI指标体系并引入360度考核；第三步将考核结果与奖金、晋升挂钩。技术骨干提出“只有转管理岗才能涨薪”，公司随之增设技术专家职级通道。核心工程师老王拿到2万元绩效奖后仍提出离职，深度访谈显示其离职动因是“项目缺乏挑战、工作得不到认可”。","q":"“增设技术专家职级通道”属于（　）。","o":["职业生涯管理（双通道发展）","末位淘汰","岗位轮换","裁员安置"],"a":[0],"e":"让技术人才不走“当官”独木桥也能晋升涨薪，是典型的管理与专业双通道职业生涯设计，功能是留住技术骨干。","k":"职业生涯管理"},{"s":"gs","p":"案例分析","c":4,"cn":"案例四：岚山科技的绩效改革","t":"single","bg":"岚山科技是一家200人的软件公司，员工反映“干多干少一个样”，公司此前仅按出勤发放固定工资。新方案：第一步对全部岗位进行职位分析并编写工作说明书；第二步建立KPI指标体系并引入360度考核；第三步将考核结果与奖金、晋升挂钩。技术骨干提出“只有转管理岗才能涨薪”，公司随之增设技术专家职级通道。核心工程师老王拿到2万元绩效奖后仍提出离职，深度访谈显示其离职动因是“项目缺乏挑战、工作得不到认可”。","q":"老王拿到绩效奖仍离职，用赫茨伯格双因素理论解释，最贴切的是（　）。","o":["绩效奖金属于激励因素，金额太小","绩效奖金属于保健因素，只能消除不满；真正缺的是成就与认可等激励因素","老王属于不理性的员工","说明工资越高越容易离职"],"a":[1],"e":"双因素理论的经典应用：钱、条件、政策是保健因素——给够只能“不闹”，给不出满意与干劲；成就、认可、挑战性工作才是激励因素。老王的离职动因（无挑战、不被认可）恰好落在激励因素缺失上，与“奖金照发人照走”的现象严丝合缝。案例问“最贴切的解释”，就用理论对症状。","k":"双因素理论的应用"},{"s":"gs","p":"案例分析","c":4,"cn":"案例四：岚山科技的绩效改革","t":"multi","bg":"岚山科技是一家200人的软件公司，员工反映“干多干少一个样”，公司此前仅按出勤发放固定工资。新方案：第一步对全部岗位进行职位分析并编写工作说明书；第二步建立KPI指标体系并引入360度考核；第三步将考核结果与奖金、晋升挂钩。技术骨干提出“只有转管理岗才能涨薪”，公司随之增设技术专家职级通道。核心工程师老王拿到2万元绩效奖后仍提出离职，深度访谈显示其离职动因是“项目缺乏挑战、工作得不到认可”。","q":"绩效考核结果在人力资源管理中的用途包括（　）。","o":["确定绩效工资与奖金分配","作为晋升、调岗的依据","发现培训需求、制定改进计划","替代与员工订立的书面劳动合同","直接决定公司战略方向"],"a":[0,1,2],"e":"考核是人力资源管理的枢纽：向上连薪酬（奖金分配）、晋升调配，向下连培训需求诊断与管理改进（A、B、C）。劳动合同是劳动关系文件，与绩效无关（D）；战略方向由股东会董事会定（E越位）。\n【案例技巧】“用途类”多选题抓“人事铁三角”：钱、位置、能力提升。","k":"绩效考核结果的运用"},{"s":"gs","p":"案例分析","c":5,"cn":"案例五：隆基机械的扩产决策","t":"single","bg":"隆基机械拟投资600万元扩建生产线，预计投产后每年获得净现金流量150万元，经营期5年，期末无残值。公司适用企业所得税税率25%，可按8%利率取得银行借款；权益资金成本为12%，目标资本结构为债务40%、权益60%。公司近年盈利稳定、现金流充裕，董事会在讨论扩产资金来源与股利分配安排。","q":"该项目的静态投资回收期为（　）。","o":["3年","4年","4.5年","5年"],"a":[1],"e":"静态回收期＝初始投资÷年净现金流量＝600÷150＝4年，恰好等于经营期5年之内。注意它不考虑货币时间价值，仅作粗筛指标——回收期看似安全不代表项目赚钱。","k":"静态投资回收期（计算）"},{"s":"gs","p":"案例分析","c":5,"cn":"案例五：隆基机械的扩产决策","t":"single","bg":"隆基机械拟投资600万元扩建生产线，预计投产后每年获得净现金流量150万元，经营期5年，期末无残值。公司适用企业所得税税率25%，可按8%利率取得银行借款；权益资金成本为12%，目标资本结构为债务40%、权益60%。公司近年盈利稳定、现金流充裕，董事会在讨论扩产资金来源与股利分配安排。","q":"银行借款的税后资金成本为（　）。","o":["8%","6%","5.33%","2%"],"a":[1],"e":"税后债务成本＝利率×(1−所得税率)＝8%×(1−25%)＝6%。利息的税盾效应把8%的名义成本“打了个七五折”。案例计算题给税率，八成就是为了考这一步。","k":"税后债务成本（计算）"},{"s":"gs","p":"案例分析","c":5,"cn":"案例五：隆基机械的扩产决策","t":"single","bg":"隆基机械拟投资600万元扩建生产线，预计投产后每年获得净现金流量150万元，经营期5年，期末无残值。公司适用企业所得税税率25%，可按8%利率取得银行借款；权益资金成本为12%，目标资本结构为债务40%、权益60%。公司近年盈利稳定、现金流充裕，董事会在讨论扩产资金来源与股利分配安排。","q":"按目标资本结构计算的加权平均资金成本（WACC）为（　）。","o":["8%","9.6%","10%","12%"],"a":[1],"e":"WACC＝40%×6%＋60%×12%＝2.4%＋7.2%＝9.6%。注意必须用税后债务成本（上一步的6%），链条题一环错环环错：8%→6%→9.6%。","k":"加权平均资金成本（计算）"},{"s":"gs","p":"案例分析","c":5,"cn":"案例五：隆基机械的扩产决策","t":"multi","bg":"隆基机械拟投资600万元扩建生产线，预计投产后每年获得净现金流量150万元，经营期5年，期末无残值。公司适用企业所得税税率25%，可按8%利率取得银行借款；权益资金成本为12%，目标资本结构为债务40%、权益60%。公司近年盈利稳定、现金流充裕，董事会在讨论扩产资金来源与股利分配安排。","q":"关于该项目的评价与公司股利安排，下列说法正确的有（　）。","o":["若项目净现值（NPV）按WACC折现后大于零，则项目创造价值、可行","静态回收期指标已经充分考虑了货币时间价值","公司若想优先保证扩产投资、剩余利润再分红，可采用剩余股利政策","提高债务比例不会增加公司的财务风险"],"a":[0,2],"e":"A 正确：NPV以WACC为基准折现率，NPV≥0即回报超过综合资金成本；B 错——静态回收期的“静态”就是指不含时间价值；C 正确，剩余股利政策“先投资后分红”；D 错——债务的固定利息负担正是财务杠杆风险的来源。\n【案例技巧】多选小题逐项当判断题做，别被“看起来都对”带节奏。","k":"投资评价与股利政策综合"},{"s":"gs","p":"案例分析","c":6,"cn":"案例六：惠邻超市的配送中心","t":"single","bg":"惠邻连锁超市经营300家门店，由中心配送中心统一配送生鲜与日配商品。商品结构上，约15%的SKU贡献了78%的销售额（如大米、食用油、饮料）；牛奶、面包等要求每日凌晨直送门店。公司希望确定每次向供应商订货的最优批量以平衡订货成本与储存成本；并与主力乳品供应商达成协议，由供应商依据各门店销售数据主动为门店补货。近期发现配送车辆装载率偏低，但门店缺货投诉却在上升。","q":"“15%的SKU贡献78%销售额”的商品，按ABC分类法应划为（　）。","o":["A类物资，重点管理","B类物资，常规管理","C类物资，简化管理","D类物资，不予管理"],"a":[0],"e":"A类＝品种少（15%）＋金额大（78%），正是“关键的少数”，应精确核算、勤进货、重点盯。案例给百分比数字就是让你套“品种占比小、资金占比大→A类”的口径。","k":"ABC分类管理"},{"s":"gs","p":"案例分析","c":6,"cn":"案例六：惠邻超市的配送中心","t":"single","bg":"惠邻连锁超市经营300家门店，由中心配送中心统一配送生鲜与日配商品。商品结构上，约15%的SKU贡献了78%的销售额（如大米、食用油、饮料）；牛奶、面包等要求每日凌晨直送门店。公司希望确定每次向供应商订货的最优批量以平衡订货成本与储存成本；并与主力乳品供应商达成协议，由供应商依据各门店销售数据主动为门店补货。近期发现配送车辆装载率偏低，但门店缺货投诉却在上升。","q":"“供应商依据门店销售数据主动补货”的库存管理模式是（　）。","o":["寄售","VMI（供应商管理库存）","联合采购","零库存采购"],"a":[1],"e":"VMI的识别句式：“供应商根据（共享的）销售/库存数据，主动决定补货的时间与数量”。它与寄售（所有权在供应商但管理在己）、联合采购（拼单压价）都不是一回事。供应链协同类案例题，抓“谁在管理库存”这个主语。","k":"供应商管理库存（VMI）"},{"s":"gs","p":"案例分析","c":6,"cn":"案例六：惠邻超市的配送中心","t":"single","bg":"惠邻连锁超市经营300家门店，由中心配送中心统一配送生鲜与日配商品。商品结构上，约15%的SKU贡献了78%的销售额（如大米、食用油、饮料）；牛奶、面包等要求每日凌晨直送门店。公司希望确定每次向供应商订货的最优批量以平衡订货成本与储存成本；并与主力乳品供应商达成协议，由供应商依据各门店销售数据主动为门店补货。近期发现配送车辆装载率偏低，但门店缺货投诉却在上升。","q":"“车辆装载率低与门店缺货并存”反映出的物流管理问题是（　）。","o":["物流成本太高需要全面外包","物流各要素之间存在效益背反，缺乏系统优化","门店订货太少","供应商故意不给货"],"a":[1],"e":"装载率低（为保配送频次拆小批次）与缺货（补货计划与需求脱节）同时出现，是典型的“局部各自为政、整体效率受损”——效益背反原理的现实版。解法是系统思维：按ABC分级差异化配送频次、统一计划、信息共享，而不是头痛医头。","k":"效益背反原理的应用"},{"s":"gs","p":"案例分析","c":6,"cn":"案例六：惠邻超市的配送中心","t":"multi","bg":"惠邻连锁超市经营300家门店，由中心配送中心统一配送生鲜与日配商品。商品结构上，约15%的SKU贡献了78%的销售额（如大米、食用油、饮料）；牛奶、面包等要求每日凌晨直送门店。公司希望确定每次向供应商订货的最优批量以平衡订货成本与储存成本；并与主力乳品供应商达成协议，由供应商依据各门店销售数据主动为门店补货。近期发现配送车辆装载率偏低，但门店缺货投诉却在上升。","q":"关于经济订货批量（EOQ）模型，下列说法正确的有（　）。","o":["EOQ使年订货成本与年储存成本之和最小","年需求量越大，EOQ越大","单位储存成本越高，EOQ越大","EOQ与每次订货成本无关"],"a":[0,1],"e":"EOQ＝√(2DS/H)：目标（A）是两类成本之和最小；年需求量D在分子（B正确，D越大订得越多）；单位储存成本H在分母，H越大订得越少（C说反）；订货成本S在分子（D错，S越大越倾向大批量少订）。\n【公式直觉】“想要的多（D）、下手贵（S）→一次多订；存着贵（H）→一次少订”。","k":"EOQ模型的理解","fig":"eoq"},{"s":"gs","p":"案例分析","c":7,"cn":"案例七：金泰股份的治理整改","t":"single","bg":"金泰股份有限公司为上市公司，董事会由9名董事组成，其中独立董事3名。2024年新公司法施行后，公司经章程规定在董事会中设置审计委员会，不再设监事会。公司拟修改公司章程并增发新股，需提交股东大会审议。审计中发现：某董事未经报告程序与公司进行关联交易并从中获利。","q":"金泰公司以审计委员会替代监事会，其直接法律依据是（　）。","o":["2024年施行的新《公司法》允许公司按照章程规定在董事会中设置审计委员会行使监事会职权","证监会强制所有公司取消监事会","公司章程可以违反法律任意设置机构","董事会决议即可取代法律规定"],"a":[0],"e":"新《公司法》给了公司“监事会模式/审计委员会模式”二选一的权利，且前提是“章程规定”——是法律授权下的自治安排，不是监管强制（B）、更不能突破法律（C、D）。这是新公司法最常考的治理变化点。","k":"新公司法（审计委员会）"},{"s":"gs","p":"案例分析","c":7,"cn":"案例七：金泰股份的治理整改","t":"single","bg":"金泰股份有限公司为上市公司，董事会由9名董事组成，其中独立董事3名。2024年新公司法施行后，公司经章程规定在董事会中设置审计委员会，不再设监事会。公司拟修改公司章程并增发新股，需提交股东大会审议。审计中发现：某董事未经报告程序与公司进行关联交易并从中获利。","q":"修改公司章程的决议，须经（　）通过。","o":["出席会议的股东所持表决权的过半数","出席会议的股东所持表决权的三分之二以上","全体股东一致同意","董事会三分之二以上董事同意"],"a":[1],"e":"修改章程、增减注册资本、合并分立解散属于特别决议事项：出席股东大会股东所持表决权的2/3以上通过。普通事项过半数即可；董事会无权定章程。数字题在案例里出现，先辨“什么事”，再套“什么数”。","k":"股东大会特别决议"},{"s":"gs","p":"案例分析","c":7,"cn":"案例七：金泰股份的治理整改","t":"single","bg":"金泰股份有限公司为上市公司，董事会由9名董事组成，其中独立董事3名。2024年新公司法施行后，公司经章程规定在董事会中设置审计委员会，不再设监事会。公司拟修改公司章程并增发新股，需提交股东大会审议。审计中发现：某董事未经报告程序与公司进行关联交易并从中获利。","q":"对未经报告进行关联交易获利的董事，公司可以采取的正确措施是（　）。","o":["要求其向公司赔偿损失（违反忠实义务的责任）","没收其个人全部财产","由其决定是否赔偿","只需口头提醒下不为例"],"a":[0],"e":"董监高对公司负有忠实义务，利用关联关系损害公司利益的应当承担赔偿责任；关联交易须履行报告与决议程序（关联董事回避表决）。情节严重的还可能引发股东代表诉讼、监管处罚。","k":"董监高的忠实义务"},{"s":"gs","p":"案例分析","c":7,"cn":"案例七：金泰股份的治理整改","t":"multi","bg":"金泰股份有限公司为上市公司，董事会由9名董事组成，其中独立董事3名。2024年新公司法施行后，公司经章程规定在董事会中设置审计委员会，不再设监事会。公司拟修改公司章程并增发新股，需提交股东大会审议。审计中发现：某董事未经报告程序与公司进行关联交易并从中获利。","q":"关于金泰公司审计委员会的构成与运作，下列说法正确的有（　）。","o":["审计委员会成员中过半数应为非执行董事","上市公司审计委员会中独立董事应占多数，并由独立董事担任召集人","应由总经理兼任审计委员会召集人以便沟通","审计委员会可以行使监事会职权"],"a":[0,1,3],"e":"新公司法要求审计委员会成员过半数为非执行董事（A）；上市公司监管规则要求独董占多数并任召集人（B）；其制度定位正是行使监事会职权、监督财务与内控（D）。由总经理（被监督对象）兼任召集人（C）违背监督独立性，属于送分错误项。\n【记忆钩子】“审计委员会：非执行过半、独董牵头、替监事会干活”。","k":"审计委员会的构成"},{"s":"gs","p":"案例分析","c":8,"cn":"案例八：远大电气的出海之路","t":"single","bg":"远大电气拟进入东南亚市场，备选方案：一是许可证贸易（向当地厂商授权商标与技术，收取许可费）；二是独资建厂。首批设备出口按CIF术语成交。结算方式上，当地买方起初要求赊销，公司为控制收汇风险改用信用证。鉴于当地政局近年有所波动，子公司大量雇佣本地员工，并就海外投资投保了投资保险。","q":"若远大选择许可证贸易方式进入东南亚市场，该方式的主要优点是（　）。","o":["投入小、风险低，可以较快进入市场","对当地经营的控制在四种方式中最强","完全不存在技术扩散风险","利润全部归远大所有"],"a":[0],"e":"许可贸易“轻资产”进入：投资小、政治风险低、速度快；代价是控制弱、可能培养竞争者（C 说反了——技术正是通过许可扩散的）。控制最强、收益独享的是独资（B、D 都是独资的特征），两者对照着记。","k":"许可证贸易的优缺点"},{"s":"gs","p":"案例分析","c":8,"cn":"案例八：远大电气的出海之路","t":"single","bg":"远大电气拟进入东南亚市场，备选方案：一是许可证贸易（向当地厂商授权商标与技术，收取许可费）；二是独资建厂。首批设备出口按CIF术语成交。结算方式上，当地买方起初要求赊销，公司为控制收汇风险改用信用证。鉴于当地政局近年有所波动，子公司大量雇佣本地员工，并就海外投资投保了投资保险。","q":"按CIF术语出口时，办理海上货物运输保险并支付保险费的责任方是（　）。","o":["卖方（远大电气）","买方","承运人","开证银行"],"a":[0],"e":"CIF＝成本＋保险费＋运费：卖方负责租船订舱付运费、办理保险付保费至目的港；但风险自货物在装运港装上船时即转移给买方——“费用卖方出，风险装船移”。承运人只管运输，开证行只管付款。","k":"CIF术语"},{"s":"gs","p":"案例分析","c":8,"cn":"案例八：远大电气的出海之路","t":"single","bg":"远大电气拟进入东南亚市场，备选方案：一是许可证贸易（向当地厂商授权商标与技术，收取许可费）；二是独资建厂。首批设备出口按CIF术语成交。结算方式上，当地买方起初要求赊销，公司为控制收汇风险改用信用证。鉴于当地政局近年有所波动，子公司大量雇佣本地员工，并就海外投资投保了投资保险。","q":"改用信用证结算后，承担第一性付款责任的是（　）。","o":["进口商","开证银行","远大电气","通知银行"],"a":[1],"e":"信用证是开证行向受益人（卖方）作出的独立付款承诺：单证相符即付款，银行信用取代商业信用——这正是远大防范赊销收汇风险的手段。进口商是最终付款人但不是“第一性”责任人。","k":"信用证结算"},{"s":"gs","p":"案例分析","c":8,"cn":"案例八：远大电气的出海之路","t":"multi","bg":"远大电气拟进入东南亚市场，备选方案：一是许可证贸易（向当地厂商授权商标与技术，收取许可费）；二是独资建厂。首批设备出口按CIF术语成交。结算方式上，当地买方起初要求赊销，公司为控制收汇风险改用信用证。鉴于当地政局近年有所波动，子公司大量雇佣本地员工，并就海外投资投保了投资保险。","q":"案例中远大应对东道国政治风险的措施包括（　）。","o":["投保海外投资保险","大量雇佣本地员工、推进本地化经营","将公司全部资产集中投入到该单一国家","退出所有国际市场业务"],"a":[0,1],"e":"政治风险的对症管理：投保投资保险转移损失（A）、本地化经营降低“外来者”敏感度（B）——材料里两处伏笔一一对应。把鸡蛋全放一个篮子（C）放大风险，因噎废食退出国际化（D）放弃收益，都是过度反应。\n【案例技巧】多选小题的选项常与案例材料一一“埋伏笔”，先回原文找对应句。","k":"政治风险的管理"}],"jc":[{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"某商品的需求价格弹性系数大于1（富有弹性）。在其他条件不变的情况下，该商品的生产企业若想增加销售收入，应当（　）。","o":["适当提高价格","适当降低价格","保持价格不变，增加广告投入","同时提高价格并减少销量"],"a":[1],"e":"需求富有弹性（Ed＞1）时，价格与总收益反向变动：降价→销量大幅增加→总收益增加，即“薄利多销”。反之，若需求缺乏弹性（Ed＜1，如粮油、食盐等必需品），提价才能增加总收益。\n【记忆钩子】弹性大就降价走量，弹性小就提价收割。","k":"需求价格弹性与总收益","fig":"elastic"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"其他条件不变时，下列因素中会导致某商品需求曲线向右移动的是（　）。","o":["该商品自身价格下降","该商品替代品的价格上升","该商品互补品的价格上升","消费者对未来收入的预期转差"],"a":[1],"e":"需求曲线移动＝需求变动，由商品自身价格以外的因素引起；自身价格变化只引起需求量变动（沿同一条曲线的点的移动）。替代品价格上升→消费者转向本商品→需求增加、曲线右移；互补品价格上升→需求减少、左移；收入预期转差→需求减少。\n【高频陷阱】“自身价格下降”是点移动，不是曲线移动，A 是最常见的干扰项。","k":"需求变动 vs 需求量变动","fig":"demand-shift"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"下列关于无差异曲线的说法中，正确的是（　）。","o":["同一条无差异曲线上任意两个商品组合给消费者带来的效用水平相同","任意两条无差异曲线可以相交","无差异曲线向右上方倾斜","离原点越远的无差异曲线，代表的效用水平越低"],"a":[0],"e":"无差异曲线三大特征：①负斜率（向右下方倾斜，维持效用不变，多消费一种必须少消费另一种）；②凸向原点（边际替代率递减）；③任意两条不相交；④离原点越远效用越高。B、C、D 全部说反。\n【记忆钩子】“右下斜、凸向原点、互不交、越远越爽”。","k":"无差异曲线的特征","fig":"indifference"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"在收入和商品价格既定的条件下，消费者实现效用最大化（消费者均衡）的条件是（　）。","o":["各种商品的边际效用相等","各种商品的边际效用与其价格之比相等","在各种商品上的支出金额相等","各种商品的边际效用均为零"],"a":[1],"e":"消费者均衡条件：MU₁/P₁＝MU₂/P₂＝…＝λ（货币的边际效用），即每一元钱花在任何商品上的边际效用都相等。若 MU₁/P₁＞MU₂/P₂，说明花在商品1上的钱更“值”，应增购商品1、减购商品2，直至比例相等。\n【辨析】A 只说边际效用相等，忽略了价格差异，错。","k":"消费者均衡条件（边际效用均等法则）"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"企业主使用自有资金投资办厂，因而放弃了这笔资金存入银行可获得的利息。该利息属于企业的（　）。","o":["显成本","隐成本","沉没成本","可变成本"],"a":[1],"e":"隐成本是企业使用自有资源而放弃的把这些资源用于其他用途时能获得的最高收入，不发生实际的货币支付。显成本是购买或租用他人要素的实际货币支出（工资、房租、贷款利息）。会计成本只核算显成本，而经济学成本＝显成本＋隐成本。\n【同类考点】自有房屋办厂放弃的租金、自己经营放弃的工资，都是隐成本。","k":"隐成本与机会成本"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"multi","q":"关于短期成本曲线的说法，正确的有（　）。","o":["边际成本曲线先后穿过平均可变成本曲线和平均成本曲线的最低点","平均固定成本随产量增加而不断下降","当边际成本小于平均成本时，平均成本下降","平均固定成本随产量增加而不断上升","边际成本曲线与平均成本曲线没有交点"],"a":[0,1,2],"e":"①MC 曲线自下而上先后穿过 AVC 和 AC 的最低点，正确；②AFC＝TFC/Q，固定成本不变，产量越大每单位分摊越少，必然持续下降，正确；③“边际拉平均”：MC＜AC 时把平均数往下拉，MC＞AC 时往上拉，正确；④D 与②相反，错；⑤MC 一定与 AC 相交于其最低点，错。\n【记忆钩子】“边际拉平均，先穿可变后穿总；均摊固定只降不升”。","k":"短期成本曲线之间的关系","fig":"cost"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"下列各类市场中，单个企业面临的需求曲线是一条水平线的是（　）。","o":["完全竞争市场","完全垄断市场","垄断竞争市场","寡头垄断市场"],"a":[0],"e":"完全竞争市场的特征：①买卖者众多，任何人都无法影响价格，企业是“价格接受者”；②产品完全同质；③资源自由流动、进出无壁垒；④信息完全。因此单个企业按市场价格可以卖出任意数量，其需求曲线为水平线，且价格＝边际收益（P＝MR）。其余三类市场中的企业都对价格有控制力，面对向右下方倾斜的需求曲线。","k":"四种市场结构的特征"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"某行业由少数几家大企业支配，企业之间的决策相互依存、相互影响，新企业进入的壁垒很高。该市场结构属于（　）。","o":["完全竞争市场","垄断竞争市场","寡头垄断市场","完全垄断市场"],"a":[2],"e":"寡头垄断的关键特征是“少数几家＋相互依存＋进入壁垒高”（如汽车、钢铁、航空）。完全垄断是“唯一一家、无替代品”；垄断竞争是“很多企业＋产品有差别＋进出容易”（如餐饮、日化）。相互依存性是寡头区别于其他市场结构的核心标志——一家降价，其余几家必须跟进或应对。","k":"四种市场结构的特征"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"multi","q":"导致市场失灵的原因主要有（　）。","o":["垄断","外部性","公共物品","信息不对称","完全竞争"],"a":[0,1,2,3],"e":"市场失灵的四大原因：垄断、外部性（如污染的负外部性）、公共物品（非竞争性＋非排他性导致“免费搭车”、市场供给不足）、信息不对称（如二手车市场的逆向选择）。完全竞争恰是帕累托效率得以实现的理想状态，不是市场失灵的原因。\n【记忆钩子】“垄、外、公、信”四大祸首。","k":"市场失灵的原因"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"用支出法核算国内生产总值（GDP）时，下列项目中不应包括的是（　）。","o":["居民消费支出","企业固定资产投资","政府购买支出","政府转移支付"],"a":[3],"e":"支出法：GDP＝消费C＋投资I＋政府购买G＋净出口X−M。政府转移支付（养老金、失业救济等）只是收入的转移，不对应当期任何产品或劳务的生产，故不计入GDP。\n【高频陷阱】“政府购买”≠“政府支出”：政府支出＝政府购买＋转移支付，只有购买部分计入GDP。","k":"GDP 支出法核算"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"下列关于经济增长的说法中，正确的是（　）。","o":["经济增长就等于经济发展","经济增长的源泉包括劳动投入、资本投入和技术进步","集约型经济增长主要依靠生产要素投入数量的增加","GDP 增长速度越高，经济发展质量必然越高"],"a":[1],"e":"增长的源泉可分解为劳动、资本与技术进步（增长核算）。A 错：增长是产量的增加，发展还包括结构优化、制度进步、福利改善，增长≠发展；C 错：主要靠要素投入数量增加的是“粗放型”，集约型靠的是效率提升和技术进步；D 错：忽视资源环境代价的高增速未必是高质量增长。","k":"经济增长的源泉与增长方式"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"因经济衰退、总需求不足而导致的失业属于（　）。","o":["摩擦性失业","结构性失业","周期性失业","自愿失业"],"a":[2],"e":"周期性失业与经济周期波动相关，总需求不足时出现，扩张性宏观政策（扩大总需求）可以对症治理。摩擦性失业是转换工作过程中的暂时失业（正常现象）；结构性失业源于劳动者的技能、地区结构与岗位需求不匹配（如传统行业工人找不到新兴行业岗位），靠培训、迁移等供给政策解决。\n【记忆钩子】“换工作—摩擦，不匹配—结构，没需求—周期”。","k":"失业的类型"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"按照大卫·李嘉图的比较优势理论，一国应当专门生产并出口的产品是（　）。","o":["绝对成本比别国低的产品","机会成本相对较低、具有比较优势的产品","本国资源稀缺的产品","本国能够生产的所有产品"],"a":[1],"e":"比较优势理论：即使一国在所有产品上都处于绝对劣势，只要不同产品间的相对成本（机会成本）存在差异，各国按“两优取其重、两劣取其轻”的原则分工，贸易双方都能获益。决定贸易格局的是比较优势（机会成本低）而非绝对优势。\n【辨析】A 是亚当·斯密绝对优势理论的说法，适用范围窄，是本题的经典干扰项。","k":"比较优势理论"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"我国民法调整的对象是（　）。","o":["平等主体之间的人身关系和财产关系","国家机关内部的隶属关系","犯罪与刑罚关系","行政管理关系"],"a":[0],"e":"民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系——关键词“平等主体”。隶属关系（上下级命令服从）由行政法调整，犯罪与刑罚由刑法调整。\n【体系坐标】民商法管“平起平坐的交易”，经济法管“国家伸手的干预”，行政法管“官管民”，刑法管“最严重的行为”。","k":"民法的调整对象"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"根据民法典，自然人的民事行为能力划分为（　）。","o":["完全民事行为能力、限制民事行为能力、无民事行为能力","完全民事权利能力、限制民事权利能力","一般行为能力、特殊行为能力","民事权利能力与民事责任能力"],"a":[0],"e":"民事行为能力三档：①完全——18周岁以上成年人，以及16周岁以上、以自己的劳动收入为主要生活来源的未成年人（视为完全）；②限制——8周岁以上的未成年人、不能完全辨认自己行为的成年人，可实施纯获利益的或与其年龄智力相适应的行为；③无——8周岁以下未成年人、完全不能辨认自己行为的人，由法定代理人代理实施。\n【高频数字】8周岁是“限制/无”的分界线，16、18周岁各有一档。","k":"自然人民事行为能力"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"multi","q":"根据民法典，法人包括（　）。","o":["营利法人","非营利法人","特别法人","非法人组织","自然人"],"a":[0,1,2],"e":"民法典把法人分为三类：营利法人（有限责任公司、股份有限公司和其他企业法人）；非营利法人（事业单位、社会团体、基金会、社会服务机构等，为公益目的成立、不分配利润）；特别法人（机关法人、农村集体经济组织法人、城镇农村的合作经济组织法人、基层群众自治组织法人）。非法人组织（个人独资企业、合伙企业）不具有法人资格，不是法人；自然人更不是。\n【判断口诀】“赚钱的、不赚钱的、管事的”，三类法人。","k":"法人的分类"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"multi","q":"民事法律行为有效应当具备的条件包括（　）。","o":["行为人具有相应的民事行为能力","意思表示真实","不违反法律、行政法规的强制性规定，不违背公序良俗","必须采用书面形式","必须经过公证"],"a":[0,1,2],"e":"民事法律行为生效三要件：主体合格（相应的行为能力）、意思表示真实、内容合法（不违反强制性规定且不违背公序良俗）。形式一般由当事人自由选择，只有法律规定或当事人约定必须书面/登记的才受限制，公证更不是一般生效要件。\n【反向对应】缺了哪一条对应什么后果：能力欠缺或意思不真实→效力待定或可撤销；内容违法→无效
