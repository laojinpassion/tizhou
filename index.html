用已知肝毒性药物并加强监测。A（经肾排泄药一律加倍）、B（无需调整）、D（只看口味）均不合理。【记忆钩子】“肝不好→肝代谢药减量、避肝毒药、防首过减弱致浓度升高”。","k":"肝功能不全用药"},{"s":"yaoshi","p":"特殊人群用药","c":9,"cn":"特殊人群用药与用药安全","t":"single","q":"肾功能不全患者使用主要经肾排泄的药物时，常规的剂量调整原则是（　）。","o":["根据肾功能（如肌酐清除率）减量或延长给药间隔，必要时监测血药浓度","一律加大剂量以保证疗效","所有药物均须改为静脉注射","完全停用全部药物"],"a":[0],"e":"肾功能不全时肾小球滤过、肾小管分泌与重吸收能力下降，主要经肾以原形排泄的药物（如氨基糖苷类、万古霉素、地高辛、青霉素类与头孢类、锂盐及部分降糖药）清除减慢、半衰期显著延长、易蓄积中毒。应依据肌酐清除率或 eGFR 减少剂量或延长给药间隔，对治疗窗窄的药物进行治疗药物监测（TDM）并按浓度个体化调整；必要时改用主要经肝代谢或胆汁排泄的药物。B、C 与合理调整方向相反，D 过于绝对，均错。【记忆钩子】“肾不好→肾排药减量或拉长间隔＋窄治疗窗药做 TDM”。","k":"肾功能不全用药"},{"s":"yaoshi","p":"特殊人群用药","c":9,"cn":"特殊人群用药与用药安全","t":"single","q":"关于药品不良反应报告，正确的做法是（　）。","o":["只有确认百分之百由该药引起才报告","发现可疑不良反应即按可疑即报原则报告，不必等待因果关系完全确定","只报告新的或严重的不良反应，已知的一般反应不必报告","由患者自行向监测机构报告，医疗机构与经营企业无需报告"],"a":[1],"e":"我国实行药品不良反应报告和监测制度，遵循“可疑即报”原则：只要怀疑不良反应与用药存在关联即可报告，无需等因果关系确证，以尽早捕捉风险信号；报告范围涵盖新的、严重的以及一般的不良反应，其中新的与严重反应须重点及时报告，死亡病例须立即报告。药品上市许可持有人、医疗机构、药品经营企业都是法定报告主体并应建立相应制度，个人（患者、消费者）也可报告。A 错：等待确证会延误信号；C 错：一般 ADR 同样在监测收集范围内；D 错：报告责任主体是企业与医疗机构等，并非仅由患者自行报告。【记忆钩子】“可疑即报，宁多报勿漏报；新、严、死亡要抓紧”。","k":"药品不良反应报告"},{"s":"yaoshi","p":"特殊人群用药","c":9,"cn":"特殊人群用药与用药安全","t":"multi","q":"符合老年人合理用药原则的做法有（　）。","o":["从小剂量开始、缓慢调整至个体适宜剂量","简化用药方案，尽量减少同时使用的药物品种与服药次数","优先选相互作用少、不良反应明确且便于监测的药物","加强用药依从性管理与疗效、不良反应监测","认为老年人久病成医，可完全凭经验自行加减药或模仿他人用药"],"a":[0,1,2,3],"e":"老年人合理用药要点：明确用药指征、能不用则不用；小剂量起始、缓慢滴定；简化方案以减少多重用药与服药次数，可用分药盒、用药清单辅助；充分评估相互作用与禁忌、选安全证据充分的药物；定期做用药重整（多科就诊后梳理重复用药）、监测肝肾功能与疗效及不良反应；加强用药教育与依从性。E 错：凭经验自行停药、加量、模仿他人用药或重复多科开药，是老年多重用药与药物不良事件的重要诱因，须由医师或药师评估。【记忆钩子】老年“合并用药品种多要警惕多重用药；小量起始、重整方案、勤监测”。","k":"老年人合理用药原则"},{"s":"yaoshi","p":"特殊人群用药","c":9,"cn":"特殊人群用药与用药安全","t":"multi","q":"下列药物或药物类别与其安全性警示，对应正确的有（　）。","o":["异维 A 酸——妊娠期强致畸，须禁用并严格避孕","四环素类——儿童期可致牙齿黄染并影响骨骼发育","喹诺酮类——妊娠期与哺乳期作为首选、安全性最高","氨基糖苷类——儿童耳肾毒性明显，须慎用并监测","青霉素类——妊娠期细菌感染相对安全，不过敏者可遵医嘱使用"],"a":[0,1,3,4],"e":"异维 A 酸有强致畸性，妊娠期绝对禁用、育龄期用药须严格避孕（A 对）；四环素类沉积于牙齿与骨骼，致牙釉质发育不全、牙齿黄染，儿童期及妊娠后期禁用（B 对）；氨基糖苷类耳毒性、肾毒性明显，儿童及肾功能不全者慎用、必要时做 TDM（D 对）；青霉素类与头孢类对胎儿相对安全，是妊娠期细菌感染常用且较安全的抗菌药，前提是不过敏（E 对）。C 错：喹诺酮类因幼年动物软骨或关节损伤，儿童青少年一般避免使用，妊娠哺乳期也非首选，更谈不上“安全性最高”。【易错点】妊娠期抗菌药“青霉素、头孢相对安全”，四环素、磺胺（近分娩）、氨基糖苷、喹诺酮、异维 A 酸要躲。","k":"特殊人群禁忌药物"},{"s":"yaoshi","p":"特殊人群用药","c":9,"cn":"特殊人群用药与用药安全","t":"multi","q":"关于药品不良反应（ADR）及其分类，下列叙述正确的有（　）。","o":["ADR 的前提是合格药品在正常用法用量下出现的有害反应","按与药理作用及剂量的关系，可分为 A 型（量变型）与 B 型（质变型）等","A 型反应通常与剂量相关、可预测、发生率高而死亡率低","B 型反应（如过敏反应、特异质反应）通常与剂量无关、难以预测","用药差错、假劣药品与药物过量中毒均属于 ADR 范畴"],"a":[0,1,2,3],"e":"ADR 定义三要素：合格药品、正常用法用量、与用药目的无关的有害反应（A 对）。按与药理作用和剂量的关系常分 A 型（augmented，剂量相关、可预测、发生率高而死亡率低，如副作用、毒性反应、继发反应）与 B 型（bizarre，与剂量无关、难以预测、发生率低但可能严重，如变态反应、特异质反应），此外还有 C 型等分类（B、C、D 对）。E 错：用药差错、假药劣药、药物滥用与超剂量中毒均不满足“合格药品＋正常用法用量”前提，不属 ADR 定义范畴，虽同属用药安全与药物警戒需关注的事件。【易错点】“合格＋正常用法用量”是 ADR 的门槛，超量、假药、差错一律不算。","k":"ADR分类与监测"},{"s":"yaoshi","p":"特殊人群用药","c":9,"cn":"特殊人群用药与用药安全","t":"multi","q":"下列关于特殊人群药动学或药效学特点的叙述，正确的有（　）。","o":["老年人肝肾功能与血浆白蛋白常下降，游离药物比例可能升高","新生儿或婴幼儿肝药酶与肾功能尚未发育成熟，药物清除常较慢","妊娠期血容量与肾小球滤过率增加，部分经肾排泄药物清除可能加快","肝功能不全时首过效应减弱，某些口服药生物利用度可升高","肾功能不全对所有药物的体内处置均无影响，无需调整剂量"],"a":[0,1,2,3],"e":"老年人肝血流、肝药酶活性、GFR 与白蛋白下降→游离型增多、清除减慢（A 对）；新生儿尤其早产儿肝药酶（如葡萄糖醛酸结合）与肾小球滤过未成熟，氯霉素可致灰婴综合征、磺胺可加重核黄疸风险，总体清除偏慢（B 对）；妊娠期血容量、心输出量与 GFR 增加，部分主要经肾排泄药物清除加快、血药浓度可能降低，同时蛋白结合与肝代谢也改变，需综合评估（C 对）；肝功能不全或门体分流时首过效应减弱，高肝提取率口服药生物利用度升高、易蓄积（D 对）。E 错：肾功能不全显著影响经肾排泄药物的清除，恰是剂量调整最常见的情形之一。【记忆钩子】“老人与新生儿清除慢；妊娠分布容积与肾清除变大；肝病首过减弱”。","k":"特殊人群药动学"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"single","q":"药师调剂处方执行四查十对时，查处方主要核对的是（　）。","o":["药名、剂型、规格、数量","药品性状、用法用量","临床诊断（查用药合理性）","科别、姓名、年龄"],"a":[3],"e":"四查十对：查处方，对科别、姓名、年龄；查药品，对药名、剂型、规格、数量；查配伍禁忌，对药品性状、用法用量；查用药合理性，对临床诊断。故 A 属“查药品”、B 属“查配伍禁忌”、C 属“查用药合理性”，只有 D 是“查处方”的核对内容。【记忆钩子】按“查处方→科别姓名年龄；查药品→名形规数；查配伍→性状用法用量；查合理→对诊断”的顺序记，四查逐项对应。","k":"四查十对"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"single","q":"下列情形中，药师审方应判定为不规范处方、需联系处方医师更正或重新开具的是（　）。","o":["医师按诊疗规范开具的常规处方","处方字迹潦草、关键信息无法辨认或未按规定签名签章","用法用量清楚、诊断与用药相符的处方","患者按处方正常取药"],"a":[1],"e":"处方审核分合法性、规范性与适宜性审核：字迹潦草无法辨认、缺临床诊断或诊断与用药不符、未签名签章或签名不符、剂量规格用法不清、超处方限量未注明理由、未使用药品通用名、需皮试而未注明等，均属不规范或不适宜处方。药师应拒绝调配、联系处方医师更正确认并重新签章，不得自行猜测或涂改后调配；处方的修改须由原开具医师确认并签章方有效。A、C、D 均为合法合规、可正常调配的情形。【易错点】“信息不清或缺签名→退回医师，药师不得自行猜、自行改”。","k":"处方规范性审核"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"single","q":"关于药品有效期，下列理解正确的是（　）。","o":["药品在规定贮存条件下能够保证质量的期限，超过有效期不得使用","有效期越长的药品，药效一定越强","有效期与贮存条件无关，是药品从生产到失效的任意时长","超过有效期但外观未变的药品仍可正常销售使用"],"a":[0],"e":"药品有效期是药品在规定贮藏条件（温度、湿度、避光、包装）下质量（含量、有关物质、无菌、溶出等）符合法定标准的期限，由稳定性试验确定并标注于包装；超过有效期的药品按劣药管理，禁止销售与使用，须按不合格药品（红色标识）隔离、登记、报损销毁。B 错：有效期长短反映稳定性，与药效强弱无必然关系；C 错：有效期以“规定贮存条件”为前提，贮存不当可提前变质；D 错：过期药即便外观正常也禁止使用（含量可能下降、杂质可能增加），且属劣药。【记忆钩子】“有效期＝规定贮存下的质量承诺期；过期＝劣药＝红牌停用”。","k":"药品有效期"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"single","q":"药品储存与陈列管理中，下列做法正确的是（　）。","o":["为节省空间，药品可与杀虫剂、消毒剂等混放","拆零药品可无标识地敞口存放","药品与非药品、内服与外用、处方药与非处方药分区或分柜存放并有明显标识","所有药品一律堆叠在地面、无需垫板与离墙离地"],"a":[2],"e":"药品经营与使用单位储存陈列实行分区分类、色标与标识管理：药品与非药品、内服药与外用药、处方药与非处方药、易串味药、中药材与中药饮片、特殊管理药品、危险品等应分开存放并有清晰标识；药品须离地、离墙、避光并按温湿度要求存放，拆零药品应保留原包装标签或说明书、集中存放于拆零专柜并做好记录；麻醉药品、第一类精神药品等专柜加锁、专人专账。A 错：与有毒、有异味或非药品混放易致污染、串味与误用；B 错：拆零药须保留标签信息、不得无标识敞放；D 错：需垫板或货架、离地离墙以防潮防污染。【记忆钩子】“分区分类＋色标＋离地离墙＋拆零留标签”。","k":"药品储存与陈列"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"single","q":"关于抗菌药物的治疗性应用，下列叙述正确的是（　）。","o":["感冒、流感等病毒性感染应常规预防性使用抗菌药物","只要发热就应联合使用广谱抗菌药物","为增强疗效，疗程越长、剂量越大越好","尽早查明病原菌、依据病原学与药敏结果选药，并按适应证与药动学药效学特点合理给药"],"a":[3],"e":"抗菌药物治疗性应用原则：诊断为细菌性（或真菌、支原体等敏感病原体）感染者方有指征；尽早留取标本做病原学检查与药敏，据结果结合抗菌谱、感染部位、PK/PD 特点及患者生理病理状态选药；按品种、剂量、给药次数、途径与疗程规范给药，能用窄谱不用广谱、能单用不联合、能口服不注射，并落实分级管理。A 错：病毒性感染（普通感冒、流感等）无抗菌药使用指征，滥用促耐药；B 错：发热原因未明不应盲目广谱联合；C 错：剂量过大、疗程过长增加不良反应、二重感染与耐药风险，疗程应依感染类型与临床反应确定。【记忆钩子】“有指征、查病原、按药敏、窄谱优先、剂量疗程规范；病毒性感冒不用抗菌药”。","k":"抗菌药物合理应用"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"single","q":"对患者进行用药教育与用药交代时，下列内容恰当的是（　）。","o":["只告知药品总价，其余让患者自行看说明书","说明服药时间（餐前、餐后或空腹）、正确用法、漏服处理与需警惕的不良反应","建议患者症状好转即刻自行停药，不必完成疗程","鼓励患者把剩余抗菌药物留给家人下次使用"],"a":[1],"e":"用药交代的核心内容包括：药品名称与适应证、用法用量与服药时点（空腹、餐前、随餐或餐后以及与食物或其他药的间隔）、正确给药技术（吸入剂、胰岛素笔、舌下含服、透皮贴、缓控释整片吞服、栓剂等）、疗程与不可擅自停药或加量、漏服处理原则、常见可耐受反应与须立即就医的警示症状、贮存条件、与酒或食物的禁忌、复诊与监测安排。A 错：仅报价格、让患者自行摸索属未尽职责；C 错：抗菌药、抗高血压药、抗癫痫药、糖皮质激素、抗抑郁药等骤停可致复发、反跳或撤药反应，须按疗程或遵医嘱逐渐调整；D 错：剩余抗菌药分享他人属无指征用药、剂量疗程不当，助长耐药。【记忆钩子】用药交代“何时吃、怎么吃、漏了咋办、何时就医、剩余药别分享”。","k":"用药教育"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"single","q":"下列关于药学服务（药学监护）核心目标的叙述，最准确的是（　）。","o":["以患者为中心，促进合理用药、提高药物治疗的安全性、有效性与依从性","以药品销售为中心，追求销量最大化","仅负责按处方发药，不参与用药评估与咨询","以替代医师做出疾病诊断为主要职责"],"a":[0],"e":"现代药学服务已从“以保障药品供应为中心”转向“以患者为中心”，药师通过处方审核与调配、用药评估与重整、用药咨询与教育、药物治疗管理、不良反应监测与报告、慢病随访、参与临床药物治疗团队等，促进合理用药，提升药物治疗的安全、有效、经济与适宜性，改善依从性与生活质量。B 错：以销售为中心违背职业道德与执业规范；C 错：发药只是环节之一，审方、评估、教育与监测同样是职责；D 错：疾病诊断与处方开具属医师职责，药师无诊断权与处方权（法律法规另有规定者除外），但可就药物治疗方案提出建议。【记忆钩子】药学服务“以患者为中心、以合理用药为魂、药师不代医师做诊断”。","k":"药学服务目标"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"multi","q":"药师对处方进行适宜性审核时，应重点审核的内容包括（　）。","o":["处方用药与临床诊断的相符性","剂量、用法、给药途径与疗程是否适宜","是否存在重复用药、配伍禁忌或有害相互作用","是否有禁忌证、过敏史及特殊人群剂量等需关注情形","药品零售利润率是否符合门店考核指标"],"a":[0,1,2,3],"e":"处方适宜性审核要点包括：适应证或诊断与用药相符性；遴选药品的品种、剂型、规格、给药途径、用法用量与疗程是否适宜；是否存在重复给药、配伍禁忌或有害相互作用；特殊人群（老年人、儿童、孕哺期、肝肾功能不全者）的剂量与禁忌；需皮试药品是否注明过敏试验及结果；有无超说明书用药且缺乏合理依据；溶媒选择、给药速度、联合用药等。E 错：利润率属经营考核指标，与处方的合法性、规范性、适宜性无关，以此干预审方违背执业规范。【记忆钩子】审方分“合法、规范、适宜”三层，适宜性盯住“诊断—药品—剂量—相互作用—禁忌—特殊人群”。","k":"处方适宜性审核"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"multi","q":"关于药品储存养护与效期管理，下列做法正确的有（　）。","o":["按包装标示的温度、湿度与避光要求分类存放，并监测记录温湿度","实行效期管理，近效期药品预警并按先产先出、近期先用原则发放","不合格（含过期、变质、破损）药品移入红色不合格区，隔离并按规定报损","麻醉药品、第一类精神药品等专柜加锁、专人保管、专用账册","为方便取用，可将不同批号、不同效期的同一药品混垛堆放且不留标识"],"a":[0,1,2,3],"e":"药品储存养护要求：按标示条件（常温、阴凉、冷处、避光或遮光、防潮及湿度范围）分库分区存放并定时监测记录温湿度；实行色标（合格绿、不合格红、待确定黄）与效期管理，近效期预警，遵循先产先出、先进先出、近效期先出；过期、变质、破损或标识不清者判为不合格或按劣药管理，移入红色不合格区隔离登记、报损销毁，不得销售；特殊管理药品执行专人、专柜加锁、专账、专用处方等。E 错：不同批号或效期混垛、不留标识会导致无法追溯、无法执行近效期先出，易误发过期药，是养护大忌。【记忆钩子】“按温湿度分区＋色标＋近效期先出＋不合格红区隔离＋麻精专柜专账”。","k":"药品储存养护"},{"s":"yaoshi","p":"药品调剂与处方审核","c":10,"cn":"药品调剂、储存与药学服务","t":"multi","q":"下列符合抗菌药物合理使用原则的说法有（　）。","o":["诊断为细菌性感染者方有指征应用，病毒性感染一般不用","尽早留取病原学标本，依据病原菌种类与药敏结果选药","联合用药应有明确指征，如病因未明的严重感染、混合感染或需长疗程易耐药者","按药动学药效学特点、感染部位与患者肝肾功能确定剂量、途径与疗程","为巩固疗效，所有感染一律采用最长疗程、最大剂量与多药联用"],"a":[0,1,2,3],"e":"合理应用要点：明确细菌等病原体感染指征（A 对，病毒性感染无指征）；尽早病原学检查并以药敏为导向的目标治疗，经验治疗也应在留取标本后启动并据结果调整（B 对）；联合用药限于明确指征——病原未查明的严重感染、单一药物不能控制的混合或重症感染、需长期治疗易产生耐药者（如结核病），以及为降低个别药物毒性剂量等（C 对）；依 PK/PD（浓度依赖或时间依赖）、感染部位穿透性、特殊人群肝肾功能与年龄优化剂量、途径与疗程（D 对）。E 错：无差别最长疗程、最大剂量、多药联用会显著增加不良反应、二重感染、筛选耐药与费用，违背能窄谱不广谱、能单用不联用、剂量疗程个体化。【记忆钩子】“有指征、查病原、按药敏、慎联合、个体化给药；病毒性感冒不用抗菌药”。","k":"抗菌药物合理应用原则"}],"yhjr":[{"s":"yhjr","p":"金融基础","c":1,"cn":"金融基础","t":"single","q":"我国货币政策的中介目标之一“M2”指的是（　）。","o":["广义货币供应量（M1＋准货币）","流通中的现金","狭义货币","外汇储备总额"],"a":[0],"e":"M0＝流通中现金；M1＝M0＋单位活期存款；M2＝M1＋准货币（定期存款、储蓄存款等），是货币政策监测的主要指标。","k":"货币层次"},{"s":"yhjr","p":"金融基础","c":1,"cn":"金融基础","t":"single","q":"中央银行提高法定存款准备金率，将导致（　）。","o":["商业银行可贷资金减少，货币供应量收缩","货币供应量扩张","财政赤字扩大","外汇储备增加"],"a":[0],"e":"法定存款准备金率提高→货币乘数下降→货币供应收缩、利率上行，属于紧缩性货币政策“三大法宝”之一。","k":"货币政策"},{"s":"yhjr","p":"金融基础","c":1,"cn":"金融基础","t":"single","q":"商业银行经营管理的基本原则是（　）。","o":["盈利性、流动性、安全性的统一","只追求利润最大化","只保证资金安全","规模最大化"],"a":[0],"e":"三性原则：盈利性是目标、流动性是保障、安全性是前提，三者此消彼长需要统筹平衡。","k":"商业银行经营原则"},{"s":"yhjr","p":"金融基础","c":1,"cn":"金融基础","t":"single","q":"直接融资与间接融资的最主要区别在于（　）。","o":["资金供需双方是否直接建立债权债务关系","融资金额大小","融资期限长短","是否经过互联网"],"a":[0],"e":"直接融资（股票、债券）供需双方直接对接；间接融资（存贷款）以银行等中介机构为媒介，中介既是对手方又承担信用风险。","k":"直接融资与间接融资"},{"s":"yhjr","p":"金融监管与从业规范","c":2,"cn":"金融监管与从业规范","t":"single","q":"我国对银行保险机构实施统一监督管理的机构是（　）。","o":["国家金融监督管理总局","中国人民银行","中国证券监督管理委员会","财政部"],"a":[0],"e":"2023 年机构改革后，国家金融监督管理总局统一负责除证券业之外的银行业、保险业监管；证监会监管证券期货市场；中国人民银行负责货币政策与宏观审慎管理。","k":"金融监管体制"},{"s":"yhjr","p":"金融监管与从业规范","c":2,"cn":"金融监管与从业规范","t":"single","q":"我国存款保险制度对同一存款人在同一家投保机构的最高偿付限额为（　）。","o":["50 万元人民币（本金和利息）","10 万元人民币","100 万元人民币","全额偿付"],"a":[0],"e":"存款保险限额偿付 50 万元，超出部分从投保机构清算财产中受偿。该制度保护存款人、防范挤兑。","k":"存款保险"},{"s":"yhjr","p":"金融监管与从业规范","c":2,"cn":"金融监管与从业规范","t":"single","q":"银行业金融机构从业人员的基本职业操守不包括（　）。","o":["利用职务便利向客户索取好处","诚实守信、勤勉尽责","保护客户信息和资金安全","公平对待不同客户"],"a":[0],"e":"银行业从业基本准则：诚实信用、守法合规、专业胜任、勤勉尽责、保护商业秘密与客户隐私、公平对待客户。索贿受贿属严重违法。","k":"从业操守"},{"s":"yhjr","p":"证券基础","c":3,"cn":"证券基础","t":"single","q":"股票与债券的根本区别在于（　）。","o":["股票是所有权凭证，债券是债权凭证","股票收益固定，债券收益不固定","股票风险小于债券","债券可以上市，股票不能上市"],"a":[0],"e":"股票代表对公司的所有权（参与决策、分享剩余收益），债券代表债权（固定利息、到期还本），风险与收益结构不同。","k":"股票与债券"},{"s":"yhjr","p":"证券基础","c":3,"cn":"证券基础","t":"single","q":"我国证券市场的监管机构是（　）。","o":["中国证券监督管理委员会","国家金融监督管理总局","中国人民银行","证券交易所"],"a":[0],"e":"证监会依法对证券期货市场实行统一监督管理；证券交易所是一线自律监管组织，不是行政监管机构。","k":"证券监管"},{"s":"yhjr","p":"证券基础","c":3,"cn":"证券基础","t":"single","q":"证券市场“内幕交易”行为指的是（　）。","o":["利用内幕信息买卖证券或建议他人买卖证券","在公开信息基础上进行投资分析","通过交易所集中竞价买卖股票","长期价值投资并持有"],"a":[0],"e":"内幕交易、操纵市场、虚假陈述是证券法明令禁止的三大违法行为，将承担行政乃至刑事责任。","k":"证券违法行为"},{"s":"yhjr","p":"基金基础","c":4,"cn":"基金基础","t":"single","q":"开放式基金与封闭式基金的根本区别在于（　）。","o":["基金份额是否可以随时申购与赎回","是否投资股票","是否收取管理费","是否由基金经理管理"],"a":[0],"e":"开放式基金份额总额不固定、可随时申购赎回（按净值计价）；封闭式基金份额固定、在存续期内不能赎回，只能在二级市场转让。","k":"开放式与封闭式基金"},{"s":"yhjr","p":"基金基础","c":4,"cn":"基金基础","t":"single","q":"主要投资于短期货币市场工具（如国库券、大额存单）的基金是（　）。","o":["货币市场基金","股票型基金","债券型基金","混合型基金"],"a":[0],"e":"货币市场基金投资于货币市场工具，风险低、流动性好，常作为现金管理工具（如余额宝类产品）。","k":"基金分类"},{"s":"yhjr","p":"基金基础","c":4,"cn":"基金基础","t":"single","q":"基金托管人的主要职责是（　）。","o":["保管基金资产，监督基金管理人的投资运作","负责基金的投资决策","代理基金销售","审批基金发行"],"a":[0],"e":"基金实行资产托管制度：托管人（商业银行）独立保管基金财产、复核净值、监督管理人运作，与管理人职责分离、相互制衡。","k":"基金托管"},{"s":"yhjr","p":"金融风险与合规","c":5,"cn":"金融风险与合规","t":"single","q":"金融机构操作风险的定义中不包括（　）导致损失的风险。","o":["市场价格波动","内部程序不完善","人员舞弊","信息系统故障"],"a":[0],"e":"操作风险源于不完善或有问题的内部程序、人员、系统或外部事件；市场价格波动属于市场风险。","k":"操作风险"},{"s":"yhjr","p":"金融风险与合规","c":5,"cn":"金融风险与合规","t":"single","q":"巴塞尔协议要求商业银行的资本充足率不得低于（　）。","o":["8%","4%","12%","20%"],"a":[0],"e":"资本充足率≥8%（核心一级≥4.5%＋储备资本），巴塞尔协议Ⅲ还引入杠杆率、流动性覆盖率（LCR）等监管指标。","k":"巴塞尔协议"},{"s":"yhjr","p":"金融风险与合规","c":5,"cn":"金融风险与合规","t":"single","q":"金融机构“了解你的客户（KYC）”原则要求（　）。","o":["识别客户身份并了解其交易目的与资金来源，防范洗钱","只了解高净值客户","向第三方出售客户信息","允许他人代持账户"],"a":[0],"e":"KYC 是反洗钱（AML）制度的基础：身份识别、尽职调查、可疑交易报告，防止金融机构被用于洗钱与恐怖融资。","k":"反洗钱与KYC"},{"s":"yhjr","p":"金融市场","c":6,"cn":"金融市场","t":"single","q":"上海银行间同业拆放利率（Shibor）反映的是（　）。","o":["银行间短期资金拆借的价格水平","股票市场整体走势","外汇储备规模","财政收入增速"],"a":[0],"e":"Shibor 是货币市场基准利率，由信用等级较高的银行组成报价团报出的同业拆出利率算术平均值，反映资金面松紧。","k":"Shibor"},{"s":"yhjr","p":"金融市场","c":6,"cn":"金融市场","t":"single","q":"我国人民币汇率实行的是（　）。","o":["以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度","固定汇率制度","盯住美元的联系汇率制","完全自由浮动制度"],"a":[0],"e":"人民币汇率制度的三要素：市场供求为基础、参考一篮子货币调节、有管理的浮动。","k":"人民币汇率制度"},{"s":"yhjr","p":"金融市场","c":6,"cn":"金融市场","t":"single","q":"外汇储备的主要功能不包括（　）。","o":["作为商业银行的信贷资金来源","弥补国际收支逆差","干预外汇市场稳定汇率","增强国际清偿能力"],"a":[0],"e":"外汇储备功能：弥补国际收支逆差、干预外汇市场、增强国际清偿力与信用。它不是商业银行放贷的资金来源。","k":"外汇储备功能"},{"s":"yhjr","p":"金融基础","c":1,"cn":"金融基础","t":"multi","q":"下列属于中央银行职能的有（　）。","o":["发行的银行","银行的银行（最后贷款人）","政府的银行（代理国库）","经营个人存贷款业务","直接参与企业并购"],"a":[0,1,2],"e":"央行三大职能：发行的银行、银行的银行、政府的银行。央行不办理商业性业务、不以盈利为目的。","k":"中央银行职能"},{"s":"yhjr","p":"金融监管与从业规范","c":2,"cn":"金融监管与从业规范","t":"multi","q":"下列属于洗钱行为特征或表现形式的有（　）。","o":["将犯罪所得通过多个账户转移分散","用犯罪所得购置房产等资产","通过地下钱庄兑换资金","如实申报大额现金存款来源","利用他人身份证件开立账户"],"a":[0,1,2,4],"e":"洗钱的核心是掩饰、隐瞒犯罪所得的来源与性质：转移分散、购置资产、地下钱庄、借用账户均为典型手法。如实申报是守法行为。","k":"反洗钱"},{"s":"yhjr","p":"证券基础","c":3,"cn":"证券基础","t":"multi","q":"证券法禁止的证券市场违法行为包括（　）。","o":["内幕交易","操纵证券市场","编造传播虚假信息扰乱市场","依据公开披露信息进行价值投资","欺诈客户"],"a":[0,1,2,4],"e":"证券法三大禁止行为：内幕交易、操纵市场、虚假陈述（含编造传播虚假信息），另有欺诈客户等。基于公开信息的投资合法。","k":"证券违法行为"},{"s":"yhjr","p":"基金基础","c":4,"cn":"基金基础","t":"multi","q":"关于基金投资的说法中，正确的有（　）。","o":["基金财产独立于基金管理人和托管人的固有财产","基金管理人由依法设立的基金管理公司担任","货币市场基金风险低于股票型基金","基金投资保证本金不受损失","基金份额持有人按份额分享收益"],"a":[0,1,2,4],"e":"基金财产独立托管、破产隔离；不同类型基金风险收益特征不同。基金不保本——“卖者尽责、买者自负”，收益随投资标的波动。","k":"基金财产与风险"},{"s":"yhjr","p":"金融风险与合规","c":5,"cn":"金融风险与合规","t":"multi","q":"金融风险的主要类型包括（　）。","o":["信用风险","市场风险","流动性风险","操作风险","道德高尚带来的声誉收益"],"a":[0,1,2,3],"e":"金融风险四大基本类型：信用、市场、流动性、操作风险，另有声誉风险、法律风险等。E 混入了非风险概念。","k":"金融风险类型"},{"s":"yhjr","p":"金融市场","c":6,"cn":"金融市场","t":"multi","q":"下列属于货币市场工具的有（　）。","o":["同业存单","国库券","商业票据","十年期国债","公司股票"],"a":[0,1,2],"e":"货币市场工具期限一年以内：同业拆借、国库券、商业票据、大额存单、回购协议。长期国债与股票属资本市场工具。","k":"货币市场工具"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"single","q":"货币被用来表现和衡量其他一切商品价值时，执行的是（　）。","o":["价值尺度职能","流通手段职能","贮藏手段职能","支付手段职能"],"a":[0],"e":"价值尺度是货币表现、衡量商品价值的功能，只需观念上的货币；流通手段是充当交换媒介（需现实货币）；贮藏手段是保存购买力；支付手段用于清偿债务、赋税、工资等。【易错点】价值尺度可以是“观念货币”，流通手段必须是现实货币，二者最易混淆。","k":"货币职能"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"single","q":"企业之间在商品交易中以延期付款或预收货款形式提供的信用属于（　）。","o":["商业信用","银行信用","国家信用","消费信用"],"a":[0],"e":"商业信用是企业之间在买卖商品时以延期付款（赊销）或预付货款形式提供的信用，是信用制度的基础，先于银行信用存在。【记忆钩子】看主体：企业↔企业＝商业信用，银行↔客户＝银行信用，政府举债＝国家信用，商家↔消费者＝消费信用。","k":"信用形式"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"single","q":"在整个利率体系中起主导作用、能带动其他利率变化的利率是（　）。","o":["基准利率","浮动利率","名义利率","市场利率"],"a":[0],"e":"基准利率是利率体系的核心，由央行确定或引导，其他存贷款利率、债券收益率据此上下浮动。【易错点】名义利率是未剔除通胀的利率、实际利率＝名义利率－通胀率；市场利率由供求决定，均不是“带动其他利率”的主导利率。","k":"利率种类"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"single","q":"在直接标价法下，若一定单位外币折合的本币数额减少，说明（　）。","o":["本币升值、外币贬值","本币贬值、外币升值","本币与外币同步升值","汇率变动与币值无关"],"a":[0],"e":"直接标价法以本币表示单位外币的价格（如 1 外币＝X 本币）。X 变小即买同样外币花更少本币→外币更便宜（外币贬值）、本币更值钱（本币升值）。【记忆钩子】直接标价“数字降＝本币升”，间接标价法恰好相反。","k":"汇率标价"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"single","q":"关于通货膨胀，下列表述正确的是（　）。","o":["一般物价水平持续、普遍上涨，货币购买力下降","个别商品一次性涨价即构成通货膨胀","通货膨胀意味着所有商品价格同幅度上涨","通货膨胀会使债权人实际收益增加"],"a":[0],"e":"通胀是物价总水平持续、普遍上涨，本质是货币供给超过货币需求、货币贬值、购买力下降。【易错点】个别或一次性涨价不等于通胀；不同商品涨幅不同；通胀使债务人受益、债权人受损（偿还的是贬值后的货币），D 把方向说反了。","k":"通货膨胀"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"single","q":"下列现象中，通常被视为通货紧缩典型特征的是（　）。","o":["物价总水平持续下跌并伴随经济衰退","物价总水平持续上涨","货币供应量增速持续加快","失业率暂时性下降"],"a":[0],"e":"通缩是物价总水平持续下跌、货币供应量减少，常伴随生产下降、失业上升、经济衰退。【记忆钩子】通胀＝钱多货贵，通缩＝钱少货贱；通缩易陷入“物价跌→企业亏损→裁员→需求再降”的螺旋。","k":"通货紧缩"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"single","q":"下列哪一项属于货币政策的最终目标（　）。","o":["稳定物价","提高商业银行利润率","直接决定财政赤字规模","管理证券市场指数点位"],"a":[0],"e":"货币政策最终目标通常包括稳定物价、充分就业、经济增长和国际收支平衡；央行通过调节货币供应与利率间接影响这些宏观变量。【易错点】中介目标（货币供应量、利率）是可观测、可调控的中间变量，最终目标是宏观结果，二者层次不同；央行不直接干预银行利润或股指。","k":"货币政策目标"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"multi","q":"下列属于中央银行一般性货币政策工具（“三大法宝”）的有（　）。","o":["法定存款准备金率","再贴现政策","公开市场业务","直接规定商业银行存贷款利率上限","消费者信用控制"],"a":[0,1,2],"e":"一般性工具（总量调节）即三大法宝：法定存款准备金率、再贴现、公开市场业务。【易错点】消费者信用控制、不动产信用控制、优惠利率等属于“选择性”工具；规定利率上限属于直接信用控制，均不在三大法宝之列。","k":"货币政策工具"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"multi","q":"关于中央银行公开市场业务，下列说法正确的有（　）。","o":["央行在金融市场上买卖有价证券以调节货币供应量","买入证券会投放基础货币、增加市场流动性","卖出证券会回笼基础货币、收紧市场流动性","该工具主动性强、可灵活微调、可逆向操作","只能单向买入、不能卖出证券"],"a":[0,1,2,3],"e":"公开市场业务是央行买卖政府债券等调节基础货币：买入＝投放、卖出＝回笼；优点是主动、灵活、可微调、可逆转。【易错点】E 错在“只能买入”——正因能双向操作、可随时反向修正，它才成为最常用的日常调控工具。","k":"公开市场业务"},{"s":"yhjr","p":"货币信用与货币政策","c":7,"cn":"货币、信用、利率与货币政策","t":"multi","q":"关于货币乘数与货币供应量，下列说法正确的有（　）。","o":["货币乘数反映基础货币扩张为货币供应量的倍数","法定存款准备金率越高，货币乘数越小","现金漏损率上升会降低货币乘数","商业银行超额准备金率上升会降低货币乘数","货币乘数与法定存款准备金率同向变动"],"a":[0,1,2,3],"e":"货币供应量＝基础货币×货币乘数；货币乘数与法定准备金率、现金漏损率、超额准备金率均反向变动。【记忆钩子】三项“漏出”（法定、超额、现金）越大，银行可贷资金越少、派生能力越弱、乘数越小——E 把反向说成同向。","k":"货币乘数"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"single","q":"金融市场通过把储蓄转化为投资、引导资金流向效率更高的部门，体现的是（　）。","o":["资源配置功能","定价功能","风险分散功能","清算结算功能"],"a":[0],"e":"金融市场基本功能包括：资金融通、资源配置（引导资金流向）、定价（发现价格）、风险分散与转移、信息传递、宏观调控传导等。题干“把储蓄转为投资、流向高效部门”正是资源配置。【易错点】定价功能指通过交易形成利率、收益率等价格；风险分散指通过组合投资分摊风险，勿混。","k":"金融市场功能"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"single","q":"按交易工具的期限划分，以短期资金融通为主、流动性强、风险相对较低的市场是（　）。","o":["货币市场","资本市场","中长期债券市场","股票市场"],"a":[0],"e":"按期限划分：货币市场融通短期资金（同业拆借、票据、国库券等），工具流动性强、风险低；资本市场融通长期资金（股票、中长期债券），风险收益相对较高。【记忆钩子】“货币”市场≈短期“钱”的周转，“资本”市场≈长期“本”的筹措。","k":"金融市场分类"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"single","q":"已发行的股票、债券在投资者之间相互转让流通的市场属于（　）。","o":["二级市场（流通市场）","一级市场（发行市场）","货币市场","场外发行市场"],"a":[0],"e":"一级市场是证券首次发行、资金从投资者流向发行人的市场；二级市场是已发行证券的流通转让市场，提供流动性、形成价格。【记忆钩子】“一级”管“生出来”（发行），“二级”管“转起来”（流通）。","k":"发行市场与流通市场"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"single","q":"在我国金融机构体系中，不以盈利为首要目标、专门服务国家特定政策领域（如进出口、农业、基础设施）的银行是（　）。","o":["政策性银行","大型商业银行","城市商业银行","外资银行"],"a":[0],"e":"政策性银行由政府创立、不以盈利为目的，在进出口、农业开发、基础设施建设等政策性领域提供融资；商业银行以安全性、流动性、盈利性为经营原则。【易错点】央行是“银行的银行”、不以盈利为目的但属宏观调控与监管角色，政策性银行则具体经办政策性信贷，二者定位不同。","k":"金融机构体系"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"single","q":"下列机构中，属于非银行金融机构的是（　）。","o":["信托公司","股份制商业银行","农村信用合作社","邮政储蓄银行"],"a":[0],"e":"非银行金融机构包括信托、证券、保险、基金管理、金融租赁、财务公司等，不吸收公众活期存款、不创造存款货币。【易错点】农村信用社、邮储银行均属存款类银行业金融机构；信托公司受人之托、代人理财，不经营吸收公众存款，归为非银。","k":"非银行金融机构"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"single","q":"下列金融工具中，属于直接融资工具的是（　）。","o":["企业债券","银行贷款","定期存款","大额可转让存单"],"a":[0],"e":"直接融资工具由资金需求方直接发行给供给方，如股票、企业债券、商业票据；间接融资工具经金融中介，如银行贷款、存款、存单。【易错点】判断关键看“资金供需双方是否直接建立债权债务关系”——债券持有人直接是发行企业的债权人，而存款人只与银行发生关系。","k":"直接融资工具"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"single","q":"金融市场常被称为国民经济“晴雨表”，主要体现的是其（　）。","o":["反映功能","资金融通功能","风险分散功能","清算结算功能"],"a":[0],"e":"金融市场汇集并反映微观经济与宏观景气信息：证券价格、利率、收益率的变化往往领先或同步反映经济运行，故称“晴雨表”，即反映（信号）功能。【易错点】资金融通是“聚敛”功能、风险分散是“组合分摊”功能，勿因“晴雨表”联想到这些。","k":"金融市场反映功能"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"multi","q":"下列关于我国金融机构体系的说法，正确的有（　）。","o":["中央银行处于金融体系的核心与主导地位","商业银行以吸收存款、发放贷款为主要业务","政策性银行不以盈利为首要目标","证券公司、保险公司属于非银行金融机构","证券交易所属于吸收公众存款的银行业金融机构"],"a":[0,1,2,3],"e":"我国形成以央行为核心、商业银行为主体、政策性银行与非银机构并存、金融市场为纽带的分工协作体系。【易错点】E 错——证券交易所是提供证券交易场所与设施的自律性组织，不吸收存款、不放贷，不是银行业金融机构。","k":"金融机构体系"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"multi","q":"关于货币市场的特点，下列表述正确的有（　）。","o":["融通资金期限较短","工具流动性强、变现较容易","风险相对较低","主要用于满足短期流动性周转需求","以长期资本形成为主要目的"],"a":[0,1,2,3],"e":"货币市场＝短期资金融通市场，特征是“短、频、快”：期限短、流动性强、风险低，用于调剂短期头寸；长期资本形成是资本市场（股票、中长期债券）的功能。【记忆钩子】货币市场管“周转”，资本市场管“建设”。","k":"货币市场特点"},{"s":"yhjr","p":"金融市场与金融机构","c":8,"cn":"金融市场分类与金融机构体系","t":"multi","q":"下列各项中，属于金融市场构成要素的有（　）。","o":["金融市场参与者（交易主体）","金融工具（交易客体）","交易的组织形式与场所","由供求形成的利率、价格等信号机制","政府为每笔交易提供的本金担保承诺"],"a":[0,1,2,3],"e":"金融市场由交易主体、交易客体（金融工具）、交易组织形式与场所、以及价格（利率／收益率）机制构成。【易错点】市场遵循“卖者尽责、买者自负”，政府不为每笔交易本金兜底；把“政府担保”当作市场固有要素是常见误解。","k":"金融市场要素"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"single","q":"商业银行最典型、最主要的负债业务（资金来源）是（　）。","o":["吸收存款","发放贷款","办理票据贴现","代理收付款项"],"a":[0],"e":"负债业务是银行形成资金来源的业务，吸收存款（含活期、定期、储蓄）是最主要来源；同业拆入、央行借款、发行债券也属负债。【易错点】发放贷款、票据贴现是资产业务（运用资金）；代理收付属中间业务，不构成银行自身负债。","k":"商业银行负债业务"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"single","q":"下列业务中，属于商业银行资产业务的是（　）。","o":["发放贷款","吸收居民储蓄存款","签发银行汇票","代收水电费"],"a":[0],"e":"资产业务是银行运用资金、获取收益的业务，以贷款（含贴现）和证券投资为主。【记忆钩子】“进来的是负债（存款），出去的是资产（贷款）”；代收代付、结算、银行卡等不动用自有资金、只收手续费，属中间业务。","k":"商业银行资产业务"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"single","q":"关于商业银行中间业务，下列表述正确的是（　）。","o":["不构成银行表内资产与负债，主要依靠收取手续费获得收入","直接形成银行的贷款资产","直接增加银行的存款负债","需要动用银行自有资金承担主要投资风险"],"a":[0],"e":"中间业务（含表外业务）不运用或较少运用银行自有资金、不列入资产负债表内资产负债，以接受委托、提供服务收取手续费／佣金为特征，如结算、代理、担保、承诺、银行卡。【易错点】它并非“零风险”——担保、承诺类表外业务可能形成或有负债，但一般不动用自有资金、以手续费收入为主。","k":"商业银行中间业务"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"single","q":"按存款期限与支取方式划分，可随时支取、主要用于交易结算的存款是（　）。","o":["活期存款","定期存款","整存整取储蓄存款","通知存款"],"a":[0],"e":"活期存款随时可支取、流动性强，是货币层次中 M1 的重要组成部分，银行付息成本较低但稳定性差；定期存款有约定期限、利率较高、稳定性好。【记忆钩子】“活”在随时取，“定”在约期取；活期偏“交易媒介”，定期偏“价值贮藏”。","k":"存款分类"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"single","q":"以借款人或第三人的财产作为抵押或质押而发放的贷款，属于（　）。","o":["担保贷款","信用贷款","票据贴现","同业拆借"],"a":[0],"e":"按担保方式：信用贷款（仅凭信誉）、担保贷款（保证／抵押／质押）、票据贴现（以未到期票据转让融资）。【易错点】抵押不转移占有、质押转移占有（或交付权利凭证），二者是担保贷款下易混的两种方式；票据贴现虽以票据作媒介，但归类上通常单列。","k":"贷款分类"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"single","q":"商业银行买入持票人未到期的商业票据、扣除自贴现日至到期日利息后支付余款，这一业务称为（　）。","o":["票据贴现","票据承兑","同业拆借","信用证开立"],"a":[0],"e":"贴现是持票人将未到期票据转让给银行、银行扣除贴现利息后付现，本质是银行以票据为担保的短期放款，属资产业务。【易错点】承兑是银行承诺“到期付款”（属表外／或有负债），贴现已实际垫付资金（资产）；先承兑、后可能贴现，方向别反。","k":"票据贴现"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"single","q":"下列业务中，属于商业银行表外（或有负债类）业务的是（　）。","o":["开出信用证","吸收企业定期存款","发放住房按揭贷款","买入国债并持有至到期"],"a":[0],"e":"表外业务不列入资产负债表内，但可能转化为表内债权债务，如信用证、保函、备用承诺、贷款承诺、衍生交易。【易错点】“表外”不等于“无风险”——一旦客户违约，银行须履行付款责任，或有负债即变成现实负债；存款、贷款、债券投资都是表内项目。","k":"表外业务"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"multi","q":"下列各项中，属于商业银行负债（资金来源）业务的有（　）。","o":["吸收公众存款","向中央银行再贴现或再贷款","同业拆入","发行金融债券","向企业发放流动资金贷款"],"a":[0,1,2,3],"e":"负债业务＝筹资：各项存款为主，另有同业拆入、央行借款（再贴现／再贷款）、发行金融债券等主动负债。【易错点】发放贷款是资金“运用”，属资产业务，E 方向相反。","k":"负债业务构成"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"multi","q":"下列各项中，属于商业银行资产（资金运用）业务的有（　）。","o":["发放各类贷款","办理票据贴现","进行债券等证券投资","存放中央银行准备金存款","吸收居民活期储蓄存款"],"a":[0,1,2,3],"e":"资产业务＝用钱生息：贷款、贴现、证券投资、存放同业与存放央行款项、现金资产等。【记忆钩子】凡“银行把钱放出去／存到别处”多为资产，凡“钱从客户／同业进来”多为负债；E 是最典型的负债。","k":"资产业务构成"},{"s":"yhjr","p":"商业银行经营管理","c":9,"cn":"商业银行业务与存款贷款","t":"multi","q":"下列业务中，主要依靠收取手续费或佣金、一般不直接构成表内资产负债的有（　）。","o":["代理收付款项","办理银行结算与汇兑","提供银行卡服务","开立保函（担保类）","向客户发放抵押贷款"],"a":[0,1,2,3],"e":"中间／表外业务以服务收费为特征：结算汇兑、代理、银行卡、担保承诺（保函、信用证）等。【易错点】保函／信用证虽属表外或有负债、也可能垫款，但办理时以手续费收入为主、不直接记表内；发放抵押贷款是表内资产业务，E 不选。","k":"中间与表外业务"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"single","q":"关于股票的基本性质，下列表述正确的是（　）。","o":["股票是代表股东对公司所有权的凭证，通常不可要求公司返还出资","股票是债权债务凭证，到期还本付息","股票收益在发行时即固定不变","股票持有人对公司的经营决策无任何参与权"],"a":[0],"e":"股票是所有权凭证：股东享有收益分配、参与重大决策、剩余财产分配等权利，但一般不能退股（只能在二级市场转让），且股利不固定、不保本。【易错点】“不可返还出资”≠“没有财产权”——股东可通过转让变现；债券才到期还本付息，D 否定了股东的表决权。","k":"股票性质"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"single","q":"与普通股相比，优先股最核心的特征通常体现在（　）。","o":["在利润分配和剩余财产分配上享有优先顺序，但表决权一般受限制","享有公司日常经营决策的完整表决权","收益随公司利润大幅波动且无固定分配顺序","必须在约定到期日由公司赎回本金"],"a":[0],"e":"优先股“优先”在收益与清算分配的顺序（通常股息相对固定），代价是表决权受限、通常不参与公司日常决策；普通股表决权完整但收益处于剩余、波动大。【记忆钩子】优先股“分钱在前、说话靠后”，像“类债”的股权。","k":"普通股与优先股"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"single","q":"按发行主体划分，由中央政府或其授权机构发行、通常被视为信用风险极低的债券是（　）。","o":["政府债券（国债）","公司债券","金融债券","可转换债券"],"a":[0],"e":"按发行主体：政府债券（国债／地方债）、金融债券（银行等金融机构发行）、公司（企业）债券。政府债券以国家信用为后盾，常称“金边债券”、被视作低风险基准。【易错点】可转换债券是按“是否含转股权”的含权分类，不是按发行主体；金融债券的发行人是金融机构而非政府。","k":"债券分类"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"single","q":"交易双方约定在未来某一确定日期、按事先确定的价格买卖一定数量标的物的标准化合约是（　）。","o":["期货合约","远期合约","期权合约","互换合约"],"a":[0],"e":"期货是在交易所交易的标准化远期合约（标的、数量、交割日均由交易所统一规定）；远期是非标准化的场外约定；期权是“买权／卖权”（有权利无义务）；互换是交换现金流（如利率互换）。【记忆钩子】“标准化＋交易所”＝期货，“私下定制”＝远期，“花权利金买选择权”＝期权。","k":"金融衍生品"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"single","q":"关于期权合约，下列表述正确的是（　）。","o":["买方支付权利金后获得按约定价格买入或卖出标的物的权利，而非义务","买卖双方负有必须按约定价格成交的同等义务","期权买方在到期日必须行权","期权合约只能在场内以实物交割、不可平仓"],"a":[0],"e":"期权的核心是不对称性：买方付权利金取得“权利”（可行权也可放弃），卖方收权利金承担“义务”。【易错点】把期权当成“双方都有义务”就混同了远期／期货；买方最大损失一般限于权利金，这是期权与期货风险结构的关键差异。","k":"期权"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"single","q":"与核准制相比，证券发行注册制最强调的核心理念是（　）。","o":["以信息披露为中心，把价值判断交给市场和投资者","由监管机构对发行人的盈利能力作实质背书","由监管机构决定发行价格与发行时机","保证投资者本金不受损失"],"a":[0],"e":"注册制的精髓是“信息披露为核心”：监管审核披露的真实、准确、完整，不对证券价值作实质判断；是否购买、以何价格购买由投资者自主决策、风险自担。【记忆钩子】核准制＝“监管替你挑”，注册制＝“把信息摆齐、买者自负”；任何制度都不保本。","k":"发行制度"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"single","q":"在证券交易所内，按“价格优先、时间优先”原则由买卖双方指令直接配对成交的机制是（　）。","o":["集中竞价交易机制","做市商报价驱动机制","协议转让机制","大宗交易单独协商机制"],"a":[0],"e":"竞价（指令驱动）机制：交易所汇总买卖指令，按价格优先、时间优先撮合成交；做市商（报价驱动）机制则由做市商持续报出买卖双向报价、投资者与之成交。【易错点】“价格优先、时间优先”是竞价撮合的口诀，做市商市场看的是做市商报出的买卖价差。","k":"证券交易机制"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"multi","q":"下列关于股票特征的表述，正确的有（　）。","o":["收益性","风险性","流动性","参与性（股东可参与重大决策）","本金由发行人保证按期返还"],"a":[0,1,2,3],"e":"股票基本特征：收益性、风险性、流动性、永久性（不可退股）、参与性。【易错点】“永久性”指出资一般不可抽回，但可通过二级市场转让变现——E 把“可转让”误当成“发行人保本返还”，与股票本质相悖。","k":"股票特征"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"multi","q":"下列金融工具中，属于金融衍生工具的有（　）。","o":["远期合约","期货合约","期权合约","互换合约","普通储蓄存单"],"a":[0,1,2,3],"e":"衍生品价值“衍生”自标的（利率、汇率、股价、商品价格等），基本形态为远期、期货、期权、互换四类。【记忆钩子】“远期、期货、期权、互换”四大件；普通存单、股票、债券是基础（原生）金融工具，不属于衍生品。","k":"金融衍生品分类"},{"s":"yhjr","p":"证券市场基础","c":10,"cn":"股票债券衍生品与发行交易","t":"multi","q":"下列关于债券特征的表述，正确的有（　）。","o":["偿还性（按约定期限还本）","流动性（可转让变现）","安全性相对股票较高","收益性（通常按约定取得利息）","持有人有权参与发行人的日常经营决策"],"a":[0,1,2,3],"e":"债券四特征：偿还性、流动性、安全性、收益性；债权人不享有经营表决权。【易错点】“安全性较高”是相对股票而言（优先受偿、收益相对确定），并非绝对无风险——仍存在利率风险与信用风险。","k":"债券特征"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"single","q":"按投资对象划分，主要投资于股票、以追求资本增值为主要目标的基金是（　）。","o":["股票型基金","债券型基金","货币市场基金","混合型基金"],"a":[0],"e":"按投资对象：股票型（主要投股票）、债券型（主要投债券）、货币市场基金（投短期货币工具）、混合型（股债等混合配置）。【易错点】股票型预期收益与风险都较高；混合型因可在股债间灵活调仓，风险收益一般介于股、债之间。","k":"基金按投资对象分类"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"single","q":"按投资目标划分，以追求稳定的当期收入（如利息、分红）、资本增值居次为主要目标的基金是（　）。","o":["收入型基金","成长型基金","平衡型基金","指数型基金"],"a":[0],"e":"按投资目标：成长型（追求资本长期增值，多投成长股）、收入型（追求稳定当期收益，多投高息股／债券）、平衡型（兼顾二者）。【记忆钩子】“成长”要“涨”，“收入”要“息”，“平衡”两头顾；指数型是按“投资策略（被动跟踪）”分类，不是按投资目标。","k":"基金按投资目标分类"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"single","q":"证券投资基金中，负责基金资产投资决策、管理和运作的当事人是（　）。","o":["基金管理人","基金托管人","基金份额持有人","基金销售机构"],"a":[0],"e":"基金当事人三方：份额持有人（出资人、受益人）、管理人（投资决策与运作，一般由基金管理公司担任）、托管人（保管资产、监督管理人）。【易错点】“管钱”（托管）与“管投资”（管理）分离制衡是基金制度的基石；销售机构、注册登记机构属基金服务机构，不是核心当事人。","k":"基金管理人职责"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"single","q":"关于基金份额持有人的地位，下列表述正确的是（　）。","o":["是基金的出资人、基金资产的实际受益人和基金份额的权利主体","负责基金资产的具体投资决策","负责保管并复核基金资产净值","承担基金投资的全部亏损并以其固有财产为他人收益担保"],"a":[0],"e":"持有人出资认购份额，享有收益分配、赎回、信息披露、持有人大会表决等权利，是基金的受益所有人；以出资额为限承担风险。【易错点】决策归管理人、保管归托管人；基金不保本，持有人不“担保他人收益”，D 把有限责任与刚性兑付混淆。","k":"基金份额持有人"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"single","q":"开放式基金申购与赎回的价格，通常以（　）为基础计算。","o":["基金份额净值（基金资产净值÷基金总份额）","基金的面值","证券交易所的收盘指数","基金管理人自行确定的固定价格"],"a":[0],"e":"基金份额净值＝基金资产净值／总份额；资产净值＝资产总值－负债。开放式基金按“未知价”原则以当日收市后计算的净值申购赎回。【记忆钩子】“净值＝家底÷份数”；面值、指数、固定价都不是开放式基金申赎计价依据。","k":"基金估值"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"single","q":"关于证券投资基金的费用，下列表述正确的是（　）。","o":["管理费、托管费等一般按约定从基金资产中计提，收取方式在基金合同与招募说明书中载明","所有费用一律由投资者在申购时一次性额外支付","基金费用全部由基金管理人以自有资金承担","基金买卖证券的交易费用不计入基金资产、由交易所承担"],"a":[0],"e":"基金费用分两类：从基金资产中按约定计提的（管理费、托管费、销售服务费等）与交易／申赎时直接发生的（申购费、赎回费、交易佣金等），均须在合同、招募说明书中事先披露。【易错点】管理费并非申购时另掏，而是从净值中计提、你看到的净值已扣除；具体费率以合同为准，切勿记死数值。","k":"基金费用"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"single","q":"基金销售机构在向投资者推介基金前，应当首先（　）。","o":["了解投资者的风险承受能力与投资目标，进行适当性匹配","承诺基金的最低预期收益率","替投资者作出具体申购决策","优先推荐佣金最高的产品"],"a":[0],"e":"投资者适当性原则：“了解产品、了解客户、将适当的产品卖给适合的投资者”。销售机构须做风险测评、产品风险评级、匹配并充分揭示风险。【易错点】任何保本保收益承诺、代客决策、以佣金为导向的推荐都属违规——“卖者尽责”在前，“买者自负”在后。","k":"投资者适当性"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"multi","q":"下列关于证券投资基金分类的说法，正确的有（　）。","o":["按运作方式可分为开放式基金与封闭式基金","按投资对象可分为股票型、债券型、货币市场、混合型等","按投资目标可分为成长型、收入型、平衡型","按法律形式可分为公司型基金与契约型基金","开放式基金与股票型基金属于同一分类维度下的并列类别"],"a":[0,1,2,3],"e":"基金常见分类维度：运作方式、投资对象、投资目标、投资策略（主动／被动）、法律形式（公司型／契约型）、募集方式等，各维度相互独立、可叠加。【易错点】E 错——“开放式”按运作方式、“股票型”按投资对象，二者分属不同维度、可叠加（如“开放式股票型基金”），并非同一维度下的并列类别。","k":"基金分类维度"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"multi","q":"下列关于基金当事人职责的表述，正确的有（　）。","o":["基金管理人负责基金的投资决策与日常运作管理","基金托管人负责安全保管基金财产并监督管理人投资运作","基金份额持有人按所持份额分享基金收益、承担相应风险","基金财产独立于管理人和托管人的固有财产","基金托管人负责决定基金具体的股票买卖时点"],"a":[0,1,2,3],"e":"三方各司其职：持有人出资受益、管理人投资运作、托管人保管监督；基金财产具有独立性（破产隔离）。【易错点】E 错——择时选股是管理人的投资权限，托管人只复核、监督、办理清算，不得越位决策，这正是“管投分离”的制衡设计。","k":"基金当事人职责"},{"s":"yhjr","p":"基金分类与运作","c":11,"cn":"基金分类、当事人与估值费用","t":"multi","q":"下列行为中，符合基金销售规范与投资者适当性要求的有（　）。","o":["对投资者进行风险承受能力评估","对基金产品进行风险等级划分","向投资者充分揭示产品风险并由其自主决策","根据客户风险等级匹配相应风险等级的产品","向所有投资者无差别承诺“本金绝对安全、收益保底”"],"a":[0,1,2,3],"e":"适当性管理闭环：了解客户（测评）→了解产品（评级）→匹配→充分揭示风险→客户自主决策，留痕可回溯。【记忆钩子】“测客户、评产品、做匹配、讲风险、自决策”五步；任何保本保收益承诺都是红线，E 明显违规。","k":"基金销售规范"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"single","q":"借款人或交易对手不能按约定履行义务、未能偿还本息而导致损失的风险，属于（　）。","o":["信用风险","市场风险","流动性风险","操作风险"],"a":[0],"e":"信用风险（违约风险）源于交易对手不履约，是银行业最古老、最主要的风险；市场风险源于价格（利率、汇率、股价）不利变动；流动性风险是“无法及时以合理成本变现或筹资”；操作风险源于内部程序／人员／系统／外部事件。【记忆钩子】“不还钱＝信用，价格跌＝市场，变不了现＝流动性，出内鬼／系统崩＝操作”。","k":"信用风险"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"single","q":"因利率、汇率、股票价格和商品价格等市场因素不利变动而使金融资产蒙受损失的风险，属于（　）。","o":["市场风险","信用风险","操作风险","声誉风险"],"a":[0],"e":"市场风险是“价格类”因素变动带来的风险，可细分为利率风险、汇率风险、股票风险、商品风险。【易错点】利率上升导致债券价格下跌属于市场风险（价格变动），而借款人因利率上升还不起钱属于信用风险（违约）——同是利率，落脚点不同。","k":"市场风险"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"single","q":"银行虽账面有偿付能力，但无法及时以合理成本获得充足资金以应对资产增长或支付到期债务，这类风险是（　）。","o":["流动性风险","信用风险","市场风险","战略风险"],"a":[0],"e":"流动性风险强调“时间”与“成本”：有钱但一时变不了现、或融资成本过高；它常是信用／市场／操作风险恶化的综合结果，严重时引发挤兑。【易错点】“资不抵债”是清偿力问题，“有钱但转不动”才是流动性问题，二者不等同。","k":"流动性风险"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"single","q":"通过持有多种相关性较低的资产来降低非系统性风险的方法，称为（　）。","o":["风险分散（资产组合多样化）","风险对冲","风险转移","风险规避"],"a":[0],"e":"四类常用管理方法：分散（不把鸡蛋放一个篮子，降非系统性风险）、对冲（用衍生品等反向头寸抵消）、转移（保险、担保、资产证券化）、规避（拒绝／退出高风险业务），另有风险补偿（定价、拨备）。【记忆钩子】“分散靠组合、对冲靠反向、转移找第三方、规避是不做”；分散只能降非系统性风险，系统性风险无法靠分散消除。","k":"风险分散"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"single","q":"金融机构在为客户开立账户或建立业务关系时，履行反洗钱义务的首要环节是（　）。","o":["客户身份识别（核对并登记客户真实身份）","直接报送可疑交易报告","为客户保守一切交易秘密且不予记录","替客户设计避税方案"],"a":[0],"e":"反洗钱三项核心义务：客户身份识别、客户身份资料与交易记录保存、大额交易和可疑交易报告；识别是前提与基础。【易错点】可疑交易报告建立在身份识别与持续尽职调查之上；“保密”不能对抗法定报告义务，识别与保存记录本身即是法定义务。","k":"反洗钱义务"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"single","q":"证券公司同时从事自营与经纪、研究等业务时，为防止利益冲突而设置的信息隔离机制通常称为（　）。","o":["信息隔离墙","保证金制度","涨跌停板制度","信息披露豁免"],"a":[0],"e":"信息隔离墙通过业务隔离、人员隔离、信息管控，防止内幕信息在自营、资管、研究、投行等部门间不当流动，防范利益冲突与内幕交易。【易错点】保证金、涨跌停板是交易／风控制度；隔离墙处理的是“信息跨域滥用”，不是价格限制。","k":"利益冲突管理"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"multi","q":"下列情形中，可能引发操作风险的有（　）。","o":["内部业务流程设计存在缺陷","员工越权交易或内部舞弊","核心交易系统故障中断","外部欺诈或自然灾害等外部事件","央行上调基准利率导致债券价格下跌"],"a":[0,1,2,3],"e":"操作风险由不完善／失效的内部程序、人员、系统或外部事件造成（含法律风险）。【易错点】E 是利率变动引起的价格损失，归“市场风险”；记住操作风险四来源：“流程、人员、系统、外部事件”，利率不在其中。","k":"操作风险成因"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"multi","q":"下列关于金融风险类型与实例的对应，正确的有（　）。","o":["交易对手到期不付款——信用风险","汇率波动导致外币资产折算损失——市场风险","存款集中提取、一时难以低成本筹资——流动性风险","柜员违规操作造成资金差错——操作风险","股价上涨带动持仓盈利——操作风险"],"a":[0,1,2,3],"e":"按“损失来源”归类：不履约＝信用、价格变＝市场、变现／筹资难＝流动性、内部人／系统／流程出错＝操作。【记忆钩子】E 把“盈利”也当风险，且股价变动本属市场风险——风险指“不利结果的不确定性”，盈利不是风险事件。","k":"金融风险类型"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"multi","q":"下列做法中，符合金融机构反洗钱与合规要求的有（　）。","o":["按规定识别并核验客户身份","妥善保存客户身份资料与交易记录","对大额、可疑交易按规定程序报告","对高风险客户采取强化尽职调查措施","为留住大客户而对其异常交易刻意不报告"],"a":[0,1,2,3],"e":"反洗钱义务链：识别→保存→报告→分级管理（风险为本），并配合监管与司法调查。【易错点】“保密”不是挡箭牌，对异常交易“睁一只眼闭一只眼”本身即违规甚至构成共犯；E 是典型的合规红线。","k":"反洗钱与合规"},{"s":"yhjr","p":"金融风险与从业合规","c":12,"cn":"风险管理、反洗钱与职业道德","t":"multi","q":"下列行为中，符合金融从业人员职业道德与合规要求的有（　）。","o":["诚实守信、勤勉尽责，如实向客户说明产品风险","保守客户隐私与商业秘密","公平对待所有客户，不因资产规模歧视","主动回避本人或亲属与客户之间的利益冲突","利用未公开信息为本人或关系人谋取利益"],"a":[0,1,2,3],"e":"从业基本准则：诚实信用、守法合规、专业胜任、勤勉尽责、保守秘密、公平对待客户、利益冲突回避。【记忆钩子】凡“利用未公开信息牟利”（内幕信息／未公开信息交易）既违职业道德也涉嫌违法，E 是典型禁止行为。","k":"职业道德与行为规范"}],"yj":[{"s":"yj","p":"建设工程经济","c":1,"cn":"资金时间价值","t":"single","q":"资金的时间价值是指（　）。","o":["资金在周转使用中随时间推移而产生的增值","资金的面值变化","通货膨胀造成的物价上涨","银行存款的名义利息"],"a":[0],"e":"资金随时间周转使用产生增值。衡量尺度：利息与利率；影响因素包括使用时间、数量、投入与回收方式及通货膨胀。","k":"资金时间价值"},{"s":"yj","p":"建设工程经济","c":1,"cn":"资金时间价值","t":"single","q":"名义利率 12%，每年计息 4 次（按季度计息），其年有效利率为（　）。","o":["12.55%","12%","13%","12.36%"],"a":[0],"e":"有效利率＝(1＋12%/4)⁴−1≈12.55%。计息周期越短，有效利率越高于名义利率。","k":"名义利率与有效利率"},{"s":"yj","p":"建设工程经济","c":1,"cn":"资金时间价值","t":"single","q":"财务净现值（FNPV）评价指标的判别准则是（　）。","o":["FNPV≥0 时方案可行，FNPV 越大越优","FNPV＜0 时方案可行","FNPV＝0 时方案最优","FNPV 与可行性无关"],"a":[0],"e":"FNPV≥0 表明方案收益率达到基准收益率要求，经济上可行；互斥方案比选时 FNPV 越大越优。","k":"财务净现值"},{"s":"yj","p":"建设工程经济","c":1,"cn":"资金时间价值","t":"single","q":"财务内部收益率（FIRR）是指使技术方案在整个计算期内各年净现金流量现值累计（　）时的折现率。","o":["等于零","等于 1","最大","等于基准收益率"],"a":[0],"e":"FIRR 是使 FNPV＝0 的折现率，反映方案自身的盈利能力。FIRR≥基准收益率（ic）时方案可行。","k":"财务内部收益率"},{"s":"yj","p":"建设工程经济","c":1,"cn":"资金时间价值","t":"single","q":"静态投资回收期指标的优点与局限分别是（　）。","o":["直观反映投资回收快慢；未考虑资金时间价值和回收期之后的现金流","考虑了时间价值；计算复杂","能全面反映盈利能力；便于比较","无任何局限"],"a":[0],"e":"静态回收期简单直观、反映风险（回收越快风险越小），但忽略时间价值与回收期后的现金流，只作辅助指标。","k":"投资回收期"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"single","q":"依法必须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于（　）。","o":["20 日","15 日","30 日","10 日"],"a":[0],"e":"依法必须招标项目自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于 20 日。","k":"招标投标法"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"single","q":"投标保证金的上限一般不得超过招标项目估算价的（　）。","o":["2%","5%","10%","20%"],"a":[0],"e":"投标保证金不得超过招标项目估算价的 2%，投标截止后投标人撤销投标文件的，招标人可以不退还投标保证金。","k":"投标保证金"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"single","q":"中标通知书发出之日起（　）内，招标人和中标人应当按照招标文件和中标人的投标文件订立书面合同。","o":["30 日","15 日","60 日","10 日"],"a":[0],"e":"中标通知书发出后 30 日内订立书面合同，且不得再行订立背离合同实质性内容的其他协议。","k":"中标与合同订立"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"single","q":"建筑施工企业应当依法为职工参加工伤保险并缴纳工伤保险费，鼓励企业（　）。","o":["为从事危险作业的职工办理意外伤害保险并支付保险费","强制职工个人购买商业保险","以现金代替保险","不为危险岗位职工投保"],"a":[0],"e":"《建筑法》规定：建筑施工企业应依法为职工参加工伤保险缴纳工伤保险费，鼓励为危险作业职工办理意外伤害保险（投保人是企业而非职工个人）。","k":"建筑法"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"建设工程项目管理的核心任务是（　）。","o":["项目的目标控制（费用、进度、质量）","项目的资料归档","项目的竣工验收","项目的招标代理"],"a":[0],"e":"项目管理的本质是目标控制：费用（投资/成本）目标、进度目标、质量目标三大目标的对立统一管理。","k":"项目管理核心"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"双代号网络计划中，决定工程总工期的线路是（　）。","o":["关键线路（总持续时间最长的线路）","最短的线路","费用最低的线路","工序最少的线路"],"a":[0],"e":"关键线路是自起点至终点持续时间最长的线路，其总时差为零；关键工作的拖延将直接延误总工期，压缩工期应从关键工作入手。","k":"网络计划关键线路"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"施工成本管理的任务中，成本核算的基础是（　）。","o":["成本预测","成本计划","成本控制","成本分析"],"a":[0],"e":"成本管理任务环环相扣：预测是前提、计划是目标、控制是过程保障、核算是最基础的工作（提供实际数据）、分析是深入、考核是落实。","k":"施工成本管理任务"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"挣值法中，已完工作预算费用（BCWP）的计算公式是（　）。","o":["已完成工作量×预算单价","计划完成工作量×预算单价","已完成工作量×实际单价","计划完成工作量×实际单价"],"a":[0],"e":"BCWP（挣值）＝已完成工作量×预算单价；BCWS＝计划工作量×预算单价；ACWP＝已完成工作量×实际单价。三值组合得出进度偏差与费用偏差。","k":"挣值法"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"当费用偏差 CV＝BCWP−ACWP 为负值时，表示（　）。","o":["项目运行超出预算费用（超支）","项目运行节约费用","进度拖延","进度超前"],"a":[0],"e":"CV＜0 表示实际费用高于预算（超支）；SV＝BCWP−BCWS＜0 表示进度延误。挣值法通过三值四指标全面评价费用与进度状态。","k":"费用偏差分析"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"影响建设工程项目质量的因素“人、机、料、法、环”中，“法”指的是（　）。","o":["施工方案、工艺方法和组织措施等管理方法因素","法律法规","执法力度","法人代表"],"a":[0],"e":"4M1E 因素：人（Man）、机械（Machine）、材料（Material）、方法（Method）、环境（Environment）。工艺方案与技术方法属于“法”。","k":"质量影响因素"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"施工质量事故处理的基本方法中，当质量缺陷不影响结构安全和使用功能时，可以（　）。","o":["不作专门处理（修补处理、加固处理、返工处理、限制使用、不作处理）","一律返工重做","立即报废重建","隐瞒不报继续施工"],"a":[0],"e":"质量事故处理方式：修补、加固、返工、限制使用、不作处理五种，应根据缺陷程度与影响由设计单位验算认可后选择。","k":"质量事故处理"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"安全生产责任制中，施工项目负责人对项目安全生产的责任是（　）。","o":["对建设工程项目的安全施工负责，落实安全生产责任制度","只负责质量不负责安全","安全责任全部由专职安全员承担","由建设单位承担"],"a":[0],"e":"项目负责人是项目安全生产的第一责任人，对项目安全施工全面负责；专职安全员负责现场监督检查。“三管三必须”：管业务必须管安全。","k":"安全生产责任制"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"施工合同类型中，适用于工程量能准确计算、工期较短、技术简单风险小的合同是（　）。","o":["固定总价合同","单价合同","成本加酬金合同","无固定格式合同"],"a":[0],"e":"总价合同适合工程量清晰、风险较小的项目；单价合同适合工程量不确定的项目；成本加酬金适用于紧急抢险或全新技术项目，风险主要由业主承担。","k":"施工合同类型"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"施工合同索赔成立的前提条件不包括（　）。","o":["索赔方主观上感到利益受损","与合同对照事件已造成额外费用或工期损失","损失原因按合同约定不属于索赔方行为责任或风险责任","按合同规定的程序及时提交索赔意向通知和索赔报告"],"a":[0],"e":"索赔成立三条件：与合同对照造成损失、非己方原因、按程序提交索赔文件。主观感受不是索赔依据。","k":"施工索赔"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"建设工程项目信息管理的核心手段是（　）。","o":["基于计算机与互联网的信息处理技术进行信息管理","纸质档案管理","人工传递文件","口头交底"],"a":[0],"e":"项目信息管理依赖于信息化手段（BIM、项目管理信息系统 PMIS 等），实现信息收集、存储、传输的规范化。","k":"项目信息管理"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"项目结构图（WBS）的作用是（　）。","o":["对项目进行逐层分解，反映组成项目的所有工作任务","反映组织分工关系","反映工作流程逻辑","反映合同结构"],"a":[0],"e":"项目结构图（WBS）将项目逐层分解至工作包，是编制进度计划、成本计划与责任分配（责任矩阵）的基础。","k":"项目结构图"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"建设工程项目实施阶段策划的主要任务是确定（　）。","o":["如何组织该项目的开发或建设","项目建设的指导思想","土地开发方案","融资渠道"],"a":[0],"e":"实施阶段策划的核心任务是定义“如何组织开发或建设”（组织、管理、合同、经济、技术等策划），决策期策划则确定开发或建设的任务和意义。","k":"项目策划"},{"s":"yj","p":"建设工程经济","c":1,"cn":"资金时间价值","t":"single","q":"技术方案经济效果评价中，偿债能力指标不包括（　）。","o":["财务净现值","利息备付率","偿债备付率","资产负债率"],"a":[0],"e":"偿债能力指标：利息备付率、偿债备付率、资产负债率、流动比率、速动比率。FNPV 是盈利能力指标。","k":"经济评价指标体系"},{"s":"yj","p":"建设工程经济","c":1,"cn":"资金时间价值","t":"single","q":"技术方案的盈利能力指标中，反映方案相对盈利水平的指标是（　）。","o":["财务内部收益率","财务净现值","总投资收益率","静态投资回收期"],"a":[0],"e":"FIRR 是相对指标（反映自身收益率），FNPV 是绝对指标（反映盈利总额）。总投资收益率也属相对盈利指标，但 FIRR 考虑了时间价值更常用于方案评价。","k":"盈利能力指标"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"single","q":"建造师注册有效期满需继续执业的，应当在注册有效期届满前（　）办理延续注册。","o":["30 日","60 日","90 日","15 日"],"a":[0],"e":"建造师注册有效期为 3 年，有效期届满前 30 日内申请延续注册，延续注册有效期仍为 3 年。","k":"建造师注册管理"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"single","q":"按照《建设工程质量管理条例》，建设工程的最低保修期限中，屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏为（　）。","o":["5 年","2 年","1 年","设计文件规定的合理使用年限"],"a":[0],"e":"最低保修期限：地基基础与主体结构为设计文件规定的合理使用年限；屋面防水与防渗漏 5 年；供热供冷系统 2 个采暖期/供冷期；电气管线、给排水管道、设备安装和装修工程 2 年。","k":"保修期限"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"single","q":"建设工程竣工验收应当具备的条件不包括（　）。","o":["完成建设工程设计和合同约定的各项内容","有完整的技术档案和施工管理资料","有工程使用的主要建筑材料、建筑构配件和设备的进场试验报告","施工方认为工程已经足够好"],"a":[3],"e":"竣工验收四条件：完成设计和合同约定内容、完整技术档案与施工管理资料、主要材料设备进场试验报告、勘察设计施工监理等单位分别签署的质量合格文件等。","k":"竣工验收条件"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"建设工程项目总承包（EPC 模式）中，总承包单位对工程的（　）向业主负责。","o":["设计、采购、施工全过程的质量、安全和工期等全面负责","仅对施工质量负责","仅对设计质量负责","不承担责任"],"a":[0],"e":"EPC（设计-采购-施工）总承包：由总承包单位对工程的设计、采购、施工全过程负总责，实现设计施工一体化，缩短建设周期。","k":"总承包模式"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"施工组织设计的基本内容中，用以确定主要分部分项工程施工方法的是（　）。","o":["施工方案","施工进度计划","施工平面布置图","主要技术经济指标"],"a":[0],"e":"施工组织设计核心内容：工程概况、施工部署及施工方案（选择施工方法与机械）、施工进度计划、施工平面图、主要技术经济指标。","k":"施工组织设计"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"single","q":"项目目标动态控制的纠偏措施中，属于技术措施的是（　）。","o":["调整改进施工方法、优化施工机械选型","调整任务分工与管理职能分工","落实加快进度所需资金","修改合同条款"],"a":[0],"e":"纠偏措施四类：组织措施（分工流程）、管理措施（方法手段如网络计划、合同措施）、经济措施（资金资源）、技术措施（方案、机械、材料）。","k":"动态控制纠偏措施"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"multi","q":"根据《招标投标法》，下列项目中依法必须进行招标的有（　）。","o":["大型基础设施、公用事业等关系社会公共利益、公众安全的项目","全部或者部分使用国有资金投资的项目","使用国际组织或者外国政府贷款、援助资金的项目","施工单项合同估算价达到规定标准的项目","涉及抢险救灾的特殊项目"],"a":[0,1,2,3],"e":"必须招标的项目：大型基础设施公用事业等公共利益项目、全部或部分使用国有资金或国家融资的项目、使用国际组织或外国政府资金的项目，以及达到规模标准的各类工程。抢险救灾等特殊情况可以不招标。","k":"强制招标范围"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"multi","q":"根据《安全生产法》，生产经营单位的主要负责人对本单位安全生产工作负有的职责包括（　）。","o":["建立健全并落实安全生产责任制","组织制定安全生产规章制度和操作规程","保证安全生产投入的有效实施","组织建立并落实安全风险分级管控和隐患排查治理双重预防机制","将安全生产责任全部转嫁给安全员"],"a":[0,1,2,3],"e":"主要负责人是安全生产第一责任人，七项法定职责（含双重预防机制）。安全责任不可转嫁，安全员是专职管理岗位而非责任转移对象。","k":"安全生产法"},{"s":"yj","p":"建设工程法规","c":2,"cn":"建设工程法规","t":"multi","q":"建筑工程开工前，建设单位申请领取施工许可证应当具备的条件包括（　）。","o":["已经办理该建筑工程用地批准手续","已经确定建筑施工企业","有满足施工需要的施工图纸及技术资料","建设资金已经落实","施工场地已经全部腾空且永不占用周边道路"],"a":[0,1,2,3],"e":"施工许可证八条件：用地批准、规划许可（城市规划区内）、确定施工企业、资金落实、图纸资料、保证质量安全的具体措施等。E 为不切实际的表述。","k":"施工许可证"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"multi","q":"双代号网络计划时间参数中，关于总时差（TF）与自由时差（FF）的说法正确的有（　）。","o":["总时差是不影响总工期的前提下可以利用的机动时间","自由时差是不影响其紧后工作最早开始时间的前提下可利用的机动时间","总时差最小的线路为关键线路","自由时差≥总时差","关键工作的总时差一定为零"],"a":[0,1,2],"e":"FF≤TF 恒成立（自由时差是总时差的一部分）；计划工期等于计算工期时关键工作 TF＝0，但计划工期小于计算工期时关键工作 TF 可为正值。","k":"时间参数"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"multi","q":"施工质量控制的特点包括（　）。","o":["需要控制的因素多","控制的难度大","过程控制要求高","终检局限大（终检存在局限）","质量控制结果完全可再现"],"a":[0,1,2,3],"e":"施工质量控制特点：因素多、难度大、过程控制要求高、终检局限大（不能像工业产品一样拆解检验），因此必须强调过程质量与预防为主。","k":"施工质量控制特点"},{"s":"yj","p":"建设工程项目管理","c":3,"cn":"建设工程项目管理","t":"multi","q":"施工成本的过程控制方法包括（　）。","o":["合同控制","成本原始记录与数据统计","进度报告与资源消耗分析","赢得值（挣值）法偏差分析","只做事后总结不做过程控制"],"a":[0,1,2,3],"e":"成本过程控制强调实时性：合同控制、定额与原始记录、进度报告分析、挣值法偏差纠偏。E 与过程控制理念相反。","k":"成本过程控制"}],"zaojia":[{"s":"zaojia","p":"建设工程造价构成","c":1,"cn":"工程造价构成","t":"single","q":"我国现行建设项目总投资中，生产性建设工程项目总投资包括建设投资、建设期利息和（　）。","o":["流动资金","预备费","土地使用费","管理费"],"a":[0],"e":"生产性项目总投资＝固定资产投资（建设投资＋建设期利息）＋流动资产投资（流动资金）。非生产性项目总投资即固定资产投资。","k":"总投资构成"},{"s":"zaojia","p":"建设工程造价构成","c":1,"cn":"工程造价构成","t":"single","q":"设备购置费中的设备原价是指（　）。","o":["国产标准设备、非标准设备的出厂价或进口设备的抵岸价","设备的零售价","设备的租借价格","设备的重置价格"],"a":[0],"e":"国产设备原价为出厂价；进口设备原价为抵岸价（到岸价＋关税＋增值税等从属费用）。","k":"设备购置费"},{"s":"zaojia","p":"建设工程造价构成","c":1,"cn":"工程造价构成","t":"single","q":"按费用构成要素划分，建筑安装工程费包括人工费、材料费、施工机具使用费、企业管理费、利润、规费和（　）。","o":["税金（增值税）","设备购置费","土地出让金","流动资金"],"a":[0],"e":"建安费七要素：人工费、材料费、施工机具使用费、企业管理费、利润、规费、税金（增值税）。","k":"建安费构成"},{"s":"zaojia","p":"建设工程造价构成","c":1,"cn":"工程造价构成","t":"single","q":"下列费用中，属于规费的是（　）。","o":["社会保险费（五险）","管理人员工资","办公费","广告费"],"a":[0],"e":"规费＝社会保险费（养老、失业、医疗、工伤、生育）＋住房公积金＋工程排污费，属于政府和有关权力部门规定的费用。","k":"规费"},{"s":"zaojia","p":"建设工程造价构成","c":1,"cn":"工程造价构成","t":"single","q":"基本预备费的计算基数是（　）。","o":["工程费用（设备工器具购置费与建安费）加上工程建设其他费用","只含建安费","只含设备购置费","流动资金"],"a":[0],"e":"基本预备费＝(工程费用＋工程建设其他费用)×基本预备费率，用于应对设计变更、自然灾害等不可预见支出。","k":"基本预备费"},{"s":"zaojia","p":"建设工程计价","c":2,"cn":"工程计价依据与方法","t":"single","q":"工程量清单计价中，综合单价的组成不包括（　）。","o":["利润和一定范围的增值税（税金单独列项时）","人工费","材料费","企业管理费"],"a":[0],"e":"综合单价＝人工费＋材料费＋机械费＋企业管理费＋利润（并考虑风险费用），全费用综合单价才含规费税金；分部分项工程费中税金单独计取。","k":"综合单价"},{"s":"zaojia","p":"建设工程计价","c":2,"cn":"工程计价依据与方法","t":"single","q":"招标工程量清单中“暂列金额”的作用是（　）。","o":["用于施工中可能发生的工程变更、合同约定调整等不可预见的支出","支付给承包人的利润","材料涨价专用款","分包利润"],"a":[0],"e":"暂列金额由招标人确定并在合同中列明，用于工程变更、价格调整等不可预见支出，结算时按实际发生与否计入或收回。","k":"暂列金额"},{"s":"zaojia","p":"建设工程计价","c":2,"cn":"工程计价依据与方法","t":"single","q":"工程造价指数按照编制方法可分为（　）。","o":["定基指数和环比指数","个体指数和总指数之外无其他分类","只分为年指数和月指数","静态指数和动态指数（按此分类）"],"a":[0],"e":"按编制方法（对比基期是否固定）分为定基指数与环比指数；按范围分个体指数与总指数。造价信息指数通常编制为定基或环比指数。","k":"工程造价指数"},{"s":"zaojia","p":"建设工程计价","c":2,"cn":"工程计价依据与方法","t":"single","q":"施工定额的编制对象是（　）。","o":["以同一性质的施工过程（工序）为对象","以整个项目为对象","以单项工程为对象","以分部工程为对象"],"a":[0],"e":"施工定额（劳动定额、材料消耗定额、机械台班定额）以工序为研究对象，是企业内部使用的定额，属于生产性定额；预算定额以分部分项工程为对象；概算定额以扩大的分部分项工程为对象。","k":"定额体系"},{"s":"zaojia","p":"建设工程计价","c":2,"cn":"工程计价依据与方法","t":"single","q":"材料损耗定额中的损耗包括（　）。","o":["施工中不可避免的损耗和不可避免的废料","保管不当造成的丢失","质量事故造成的浪费","自然灾害毁损"],"a":[0],"e":"材料消耗定额＝净用量＋不可避免的损耗量（施工操作损耗、场内运输损耗等）。非正常损耗不计入定额，应由责任方承担。","k":"材料消耗定额"},{"s":"zaojia","p":"工程造价管理","c":3,"cn":"决策与设计阶段造价","t":"single","q":"投资估算中，流动资金估算通常采用的方法是（　）。","o":["分项详细估算法或扩大指标法","概算定额法","预算单价法","类似工程预算法"],"a":[0],"e":"流动资金估算：分项详细估算法（流动资产−流动负债）与扩大指标法（按固定资产、销售收入等比例估算）。","k":"流动资金估算"},{"s":"zaojia","p":"工程造价管理","c":3,"cn":"决策与设计阶段造价","t":"single","q":"设计阶段限额设计的核心思想是（　）。","o":["按照批准的投资估算控制初步设计，按概算控制施工图设计","先施工后算账","投资随设计随意变化","只控制施工成本"],"a":[0],"e":"限额设计按投资估算控制初步设计、按批准的概算控制施工图设计，把投资限额分解到各专业设计，实现“投资不打倒算账”。","k":"限额设计"},{"s":"zaojia","p":"工程造价管理","c":3,"cn":"决策与设计阶段造价","t":"single","q":"价值工程中“价值”的含义是（　）。","o":["功能与成本的比值（V＝F/C）","商品的市场价格","材料的采购成本","企业的利润"],"a":[0],"e":"价值工程以提高价值为目标：V＝F/C，途径包括功能提高成本不变、功能不变成本降低、功能提高且成本降低等。","k":"价值工程"},{"s":"zaojia","p":"工程造价管理","c":3,"cn":"决策与设计阶段造价","t":"single","q":"设计概算审查时，对主要设备、材料的价格审查重点是（　）。","o":["价格的合理性、合法性（是否符合市场信息价与调价规定）","包装是否精美","供应商的名气","运输距离长短无关紧要"],"a":[0],"e":"概算审查重点：设备材料价格是否符合市场信息价与调价规定、费用计取是否合规、有无漏项重项等。","k":"设计概算审查"},{"s":"zaojia","p":"招投标与合同价款","c":4,"cn":"招投标与合同价款","t":"single","q":"招标控制价（最高投标限价）的编制依据是（　）。","o":["国家或省级、行业建设主管部门颁发的计价定额和计价办法、工程造价信息等","投标人的报价平均值","投标最低价","发包人的心理价位"],"a":[0],"e":"招标控制价依据计价定额、计价办法、造价信息与市场价格编制并公开发布，投标人的报价超过招标控制价的应予废标。","k":"招标控制价"},{"s":"zaojia","p":"招投标与合同价款","c":4,"cn":"招投标与合同价款","t":"single","q":"合同价款方式中，适用于工程量清单计价、工程量变化风险由业主承担的合同是（　）。","o":["单价合同","固定总价合同","成本加酬金合同","无计价方式的合同"],"a":[0],"e":"单价合同：工程量按实结算、单价固定，量由业主承担、价由承包人承担——工程量清单计价默认采用。总价合同量价风险由承包人承担，成本加酬金适用于应急特例。","k":"合同价款方式"},{"s":"zaojia","p":"招投标与合同价款","c":4,"cn":"招投标与合同价款","t":"single","q":"因物价波动引起的合同价款调整，常用物价波动调整方法为（　）。","o":["价格指数调整法与造价信息调整法","成本加成法","市场询价法","双方各让一步法"],"a":[0],"e":"物价波动调整采用价格指数调整法（按造价指数加权）或造价信息调整法（按信息价与投标价差调整），按合同约定选用。","k":"物价波动调整"},{"s":"zaojia","p":"结算与决算","c":5,"cn":"工程结算与决算","t":"single","q":"工程竣工结算的审核人（受发包人委托）通常是（　）。","o":["发包人委托的工程造价咨询企业或发包人自己审核","承包人自行审定","材料供应商审定","设计单位审定"],"a":[0],"e":"竣工结算由承包人编制，发包人直接审核或委托具有相应资质的工程造价咨询企业审核，结算文件是支付竣工结算款的依据。","k":"竣工结算"},{"s":"zaojia","p":"结算与决算","c":5,"cn":"工程结算与决算","t":"single","q":"工程预付款的支付与扣回方式通常在（　）中约定。","o":["施工合同专用条款","招标公告","竣工图","监理日志"],"a":[0],"e":"预付款比例、支付时间、扣回方式（起扣点、分期扣回）由发承包双方在合同专用条款中约定，常见起扣点按未完工程所需主要材料款计算。","k":"工程预付款"},{"s":"zaojia","p":"结算与决算","c":5,"cn":"工程结算与决算","t":"single","q":"建设工程项目竣工决算的内容不包括（　）。","o":["施工企业的内部员工花名册","竣工财务决算说明书","竣工财务决算报表","工程造价对比分析"],"a":[0],"e":"竣工决算由竣工财务决算说明书、竣工财务决算报表、工程造价对比分析、工程竣工图与资料四部分组成。员工花名册不属于竣工决算内容。","k":"竣工决算"},{"s":"zaojia","p":"造价信息管理","c":6,"cn":"造价信息管理","t":"single","q":"工程造价信息管理的基本原则不包括（　）。","o":["随意篡改数据以迎合结论","标准化原则","有效性原则","定量化原则与时效性原则"],"a":[0],"e":"造价信息管理遵循标准化、有效性、定量化、时效性、高效处理等原则，数据的真实完整是造价管理的基础。","k":"造价信息管理"},{"s":"zaojia","p":"建设工程造价构成","c":1,"cn":"工程造价构成","t":"multi","q":"按造价形成划分，建筑安装工程费包括分部分项工程费、措施项目费、其他项目费、规费和（　）。","o":["税金（增值税）","利润（计入造价的费用构成要素）","设备购置费","流动资金","基本预备费"],"a":[0,1],"e":"按造价形成划分：分部分项工程费＋措施项目费＋其他项目费＋规费＋税金；其中分部分项与措施项目费中包含利润。设备购置费、流动资金、预备费不属于建安费构成。","k":"建安费（按造价形成划分）"},{"s":"zaojia","p":"建设工程计价","c":2,"cn":"工程计价依据与方法","t":"multi","q":"措施项目费包括（　）。","o":["安全文明施工费","夜间施工增加费","二次搬运费","已完工程及设备保护费","设备购置费"],"a":[0,1,2,3],"e":"措施项目费：安全文明施工费（四项内容，不可竞争费用）、夜间施工、二次搬运、已完工程及设备保护、大型机械进出场、脚手架、临时设施等。设备购置费属设备购置费科目。","k":"措施项目费"},{"s":"zaojia","p":"招投标与合同价款","c":4,"cn":"招投标与合同价款","t":"multi","q":"关于投标报价的说法中，正确的有（　）。","o":["投标报价不得高于招标控制价","投标人可根据自身管理水平自主确定管理费与利润","措施项目费中的安全文明施工费必须按国家规定计取（不可竞争）","投标报价低于成本价的应予否决","暂列金额计入投标总价并可自行挪用"],"a":[0,1,2,3],"e":"投标报价＞招标控制价应废标；企业自主确定管理费利润；安全文明施工费为不可竞争费用按规定计取；低于成本价投标应否决；暂列金额纳入合同价款但须按约定使用不得挪用。","k":"投标报价"},{"s":"zaojia","p":"结算与决算","c":5,"cn":"工程结算与决算","t":"multi","q":"工程价款结算的方式包括（　）。","o":["按月结算","分段结算","竣工后一次结算","双方约定的其他方式","口头结算"],"a":[0,1,2,3],"e":"结算方式：按月结算、分段结算、竣工后一次结算及双方约定的其他方式（含双方约定的其他结算方式），结算必须以合同约定为依据。","k":"结算方式"}],"zhuanan":[{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"single","q":"《安全生产法》确立的安全生产工作方针是（　）。","o":["安全第一、预防为主、综合治理","生产第一、安全第二","先生产后安全","边生产边治理"],"a":[0],"e":"安全生产工作方针：安全第一、预防为主、综合治理。坚持人民至上、生命至上，把保护人民生命安全摆在首位。","k":"安全生产方针"},{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"single","q":"《安全生产法》规定的“三管三必须”是指（　）。","o":["管行业必须管安全、管业务必须管安全、管生产经营必须管安全","管人管财管物","管生产、管销售、管售后","管上级、管下级、管同级"],"a":[0],"e":"“三管三必须”确立了安全生产的责任体系：管行业必须管安全、管业务必须管安全、管生产经营必须管安全。","k":"三管三必须"},{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"single","q":"生产经营单位的（　）是本单位安全生产第一责任人，对本单位的安全生产工作全面负责。","o":["主要负责人","专职安全员","车间主任","工会主席"],"a":[0],"e":"主要负责人（法定代表人、实际控制人等）是本单位安全生产第一责任人，其他负责人对职责范围内的安全生产工作负责。","k":"安全生产第一责任人"},{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"single","q":"生产经营单位的安全生产责任制应当明确各岗位的责任人员、责任范围和（　）。","o":["考核标准","工资标准","休息时间","娱乐活动"],"a":[0],"e":"安全生产责任制应明确各岗位的责任人员、责任范围和考核标准等内容，实现全员安全生产责任制。","k":"安全生产责任制"},{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"single","q":"从业人员发现直接危及人身安全的紧急情况时，有权（　）。","o":["停止作业或者在采取可能的应急措施后撤离作业场所","继续作业完成产量","自行组织违章作业","隐瞒不报"],"a":[0],"e":"紧急撤离权：发现直接危及人身安全的紧急情况，从业人员有权停止作业或在采取可能的应急措施后撤离，单位不得降低其工资、待遇或解除劳动合同。","k":"从业人员的权利"},{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"single","q":"从业人员在作业过程中发现事故隐患或者其他不安全因素，应当（　）。","o":["立即向现场安全生产管理人员或者本单位负责人报告","自行处理不必报告","等下班后再说","直接离职"],"a":[0],"e":"从业人员发现事故隐患应立即报告现场安全管理人员或本单位负责人；接到报告的人员应当及时予以处理。","k":"隐患报告"},{"s":"zhuanan","p":"安全生产管理","c":2,"cn":"安全生产管理","t":"single","q":"生产经营单位应当建立安全风险分级管控制度，按照安全风险分级采取相应的（　）措施。","o":["管控","放任","激励","宣传"],"a":[0],"e":"双重预防机制：安全风险分级管控（红橙黄蓝四级）＋事故隐患排查治理，把风险控制在隐患形成之前、把隐患消灭在事故之前。","k":"双重预防机制"},{"s":"zhuanan","p":"安全生产管理","c":2,"cn":"安全生产管理","t":"single","q":"生产经营单位应当在有较大危险因素的生产经营场所和有关设施、设备上，设置明显的（　）。","o":["安全警示标志","广告牌","宣传画","监控摄像头"],"a":[0],"e":"在有较大危险因素的生产经营场所和有关设施、设备上设置明显的安全警示标志，并保证完好可用。","k":"安全警示标志"},{"s":"zhuanan","p":"安全生产管理","c":2,"cn":"安全生产管理","t":"single","q":"生产经营单位新建、改建、扩建工程项目的安全设施，必须与主体工程（　）。","o":["同时设计、同时施工、同时投入生产和使用","主体完工后补建","只设计不施工","由政府代建"],"a":[0],"e":"“三同时”制度：安全设施与主体工程同时设计、同时施工、同时投入生产和使用，安全设施投资应当纳入建设项目概算。","k":"三同时"},{"s":"zhuanan","p":"安全生产管理","c":2,"cn":"安全生产管理","t":"single","q":"生产经营单位使用的危险物品容器、运输工具，以及涉及人身安全的特种设备，必须按照国家有关规定（　）方可投入使用。","o":["经专业机构检测、检验合格，取得安全使用证或者安全标志","外观无破损即可","由负责人签字即可","随机抽一台检验"],"a":[0],"e":"涉及人身安全的特种设备和危险物品容器运输工具，须经专业资质机构检测检验合格、取得安全使用证或安全标志，方可投入使用。检测检验机构对其结果负责。","k":"特种设备检验"},{"s":"zhuanan","p":"安全生产管理","c":2,"cn":"安全生产管理","t":"single","q":"生产经营单位的安全教育培训中，新入厂员工必须经过（　）后方可上岗。","o":["厂（矿）、车间（工段）、班组三级安全教育","一次全员大会","签一份承诺书","师傅口头讲解"],"a":[0],"e":"新员工三级安全教育（厂级、车间级、班组级）不少于规定学时，考核合格后才能上岗；转岗、复岗、“四新”（新技术新工艺新设备新材料）也须重新培训。","k":"三级安全教育"},{"s":"zhuanan","p":"安全生产管理","c":2,"cn":"安全生产管理","t":"single","q":"生产经营单位进行爆破、吊装、动火、临时用电等危险作业时，应当（　）。","o":["安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实","让作业人员自行把握","由财务人员现场监督","事后补办手续"],"a":[0],"e":"危险作业（爆破、吊装、动火、临时用电等）必须安排专门人员现场安全管理，落实操作规程与安全措施，作业前进行安全技术交底与审批（作业票制度）。","k":"危险作业管理"},{"s":"zhuanan","p":"事故应急救援与调查处理","c":3,"cn":"事故应急救援与调查处理","t":"single","q":"生产安全事故发生后，单位负责人接到报告后应当（　）。","o":["立即如实报告，不得迟报、漏报、谎报或瞒报","先内部消化再决定是否上报","等事故调查清楚再报","只报好的一面"],"a":[0],"e":"单位负责人接报后应立即如实报告当地负有安全生产监督管理职责的部门，不得迟报、漏报、谎报、瞒报，事故现场应保护并组织抢救。","k":"事故报告"},{"s":"zhuanan","p":"事故应急救援与调查处理","c":3,"cn":"事故应急救援与调查处理","t":"single","q":"造成 3 人以上 10 人以下死亡，或者 10 人以上 50 人以下重伤，或者 1000 万元以上 5000 万元以下直接经济损失的事故属于（　）。","o":["较大事故","一般事故","重大事故","特别重大事故"],"a":[0],"e":"事故四级：一般（3 人以下死亡等）、较大（3～10 人死亡等）、重大（10～30 人死亡等）、特别重大（30 人以上死亡等）。\n【记忆】“3、10、30”分档。","k":"事故等级"},{"s":"zhuanan","p":"事故应急救援与调查处理","c":3,"cn":"事故应急救援与调查处理","t":"single","q":"较大事故、重大事故、特别重大事故的调查，应当自事故发生之日起（　）内提交事故调查报告（技术鉴定所需时间可相应延长）。","o":["60 日","30 日","90 日","180 日"],"a":[0],"e":"事故调查组应当自事故发生之日起 60 日内提交调查报告，特殊情况经批准可延长，但延长期限最长不超过 60 日。","k":"事故调查时限"},{"s":"zhuanan","p":"事故应急救援与调查处理","c":3,"cn":"事故应急救援与调查处理","t":"single","q":"事故调查处理的“四不放过”原则不包括（　）。","o":["事故责任追究与事故等级挂钩即可、原因可查可不查","事故原因未查清不放过","责任人员未处理不放过","整改措施未落实不放过、有关人员未受到教育不放过"],"a":[0],"e":"“四不放过”：原因未查清不放过、责任人未处理不放过、整改措施未落实不放过、有关人员未受教育不放过。","k":"四不放过"},{"s":"zhuanan","p":"安全生产技术","c":4,"cn":"安全生产技术","t":"single","q":"机械设备的防护装置应满足的要求是（　）。","o":["在危险部位设置防护罩、防护栏等，且不影响操作、牢固可靠","可以随意拆卸","用纸板代替金属防护罩","设置后不得检修设备"],"a":[0],"e":"机械防护装置（防护罩、联锁装置等）应牢固可靠、不得随意拆除，检修时应有联锁或断电挂牌（LOTO）程序。","k":"机械安全"},{"s":"zhuanan","p":"安全生产技术","c":4,"cn":"安全生产技术","t":"single","q":"高处作业是指在距坠落基准面（　）及以上的作业。","o":["2 米或 2 米以上","5 米以上","10 米以上","1 米以上"],"a":[0],"e":"高处作业分级：2～5 米一级、5～15 米二级、15～30 米三级、30 米以上特级。高处作业必须系挂安全带（高挂低用）。","k":"高处作业"},{"s":"zhuanan","p":"安全生产技术","c":4,"cn":"安全生产技术","t":"single","q":"进入有限空间（受限空间）作业前，必须（　）。","o":["先通风、再检测（氧含量与有害气体）、后作业，并办理作业审批与专人监护","直接进入作业","点燃明火测试氧含量","戴口罩即可进入"],"a":[0],"e":"有限空间作业“先通风、再检测、后作业”：氧含量 19.5%～23.5%、可燃气体与有毒气体达标后方可作业，严禁盲目施救（盲目施救是有限空间事故伤亡扩大的主因）。","k":"有限空间作业"},{"s":"zhuanan","p":"安全生产技术","c":4,"cn":"安全生产技术","t":"single","q":"危险化学品储存应当遵循的原则是（　）。","o":["分类分区存放，相互禁忌的物质不得混储混运","所有化学品混放节约空间","随意堆放","放在人员密集区域"],"a":[0],"e":"危险化学品储存“禁忌物隔离”：氧化剂与还原剂、酸与碱、遇水反应物与水源等互为禁忌，应分类分区、专用库房、双人收发双人保管（剧毒品“五双”制度）。","k":"危险化学品储存"},{"s":"zhuanan","p":"事故应急救援与调查处理","c":3,"cn":"事故应急救援与调查处理","t":"multi","q":"生产安全事故应急救援预案体系一般包括（　）。","o":["综合应急预案","专项应急预案","现场处置方案","应急救援组织与物资保障","员工个人旅游计划"],"a":[0,1,2,3],"e":"应急预案体系：综合预案（总体纲领）＋专项预案（针对具体事故类型）＋现场处置方案（岗位卡片式），并定期演练修订。","k":"应急预案体系"},{"s":"zhuanan","p":"安全生产管理","c":2,"cn":"安全生产管理","t":"multi","q":"生产经营单位的安全生产投入主要用于（　）。","o":["安全设施设备的购置与维护","安全生产教育培训","劳动防护用品配备","应急救援演练与物资储备","为负责人购买豪华轿车"],"a":[0,1,2,3],"e":"安全生产投入（安全生产费用）专门用于改善安全生产条件：设施设备、教育培训、劳保用品、应急演练、隐患治理等，不得挪作他用。","k":"安全生产投入"},{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"multi","q":"从业人员的安全生产权利包括（　）。","o":["知情权（了解危险因素与应急措施）","建议权（对本单位安全工作提出建议）","批评、检举、控告权","紧急撤离权","违章作业权"],"a":[0,1,2,3],"e":"从业人员八项权利：知情、建议、批评检举控告、拒绝违章指挥和强令冒险作业、紧急撤离、伤亡赔偿、劳保配备、教育培训。违章作业是义务的反面，不是权利。","k":"从业人员的权利"},{"s":"zhuanan","p":"安全生产法规","c":1,"cn":"安全生产法规","t":"multi","q":"从业人员的安全生产义务包括（　）。","o":["遵章守规、服从管理","正确佩戴和使用劳动防护用品","接受安全教育培训","发现隐患立即报告","擅自拆除安全防护装置"],"a":[0,1,2,3],"e":"从业人员三项义务：遵章守规服从管理、佩戴使用劳保用品、接受培训并报告隐患。擅自拆除安全防护装置属违法行为。","k":"从业人员的义务"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"single","q":"全员安全生产责任制的核心要求是（　）。","o":["把安全生产责任落实到每个岗位、每名从业人员，并配套相应的考核与奖惩","仅由安全管理部门承担本单位全部安全责任","只明确主要负责人的责任即可，其他岗位不必细化","以签订免责协议的方式代替责任的层层落实"],"a":[0],"e":"全员安全生产责任制强调横向到边、纵向到底，把责任分解到所有岗位和人员，并建立配套的监督考核与奖惩机制确保责任落地。B、C把责任局限在个别部门或个人，违背全员与一岗一责要求；D用免责协议转嫁、免除责任，既违法也无效。\n【易错点】全员责任制不是人人平均担责，核心是各负其责加考核到位。","k":"全员安全生产责任制"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"single","q":"关于生产经营单位主要负责人的安全生产职责，下列表述正确的是（　）。","o":["组织建立并落实安全风险分级管控和隐患排查治理双重预防工作机制","负责逐台设备的日常点检与运行记录","承担全部隐患的日常排查与整改闭环","独立完成全体从业人员的安全培训授课"],"a":[0],"e":"主要负责人职责集中在组织、决策、保障层面：建立健全并落实全员安全生产责任制、组织制定规章制度和操作规程、组织制定并实施教育培训计划、保证安全投入有效实施、组织建立并落实双重预防机制、组织制定并实施应急救援预案、及时如实报告事故等。B、C、D都是具体事务性、执行层的工作，属于安全管理机构与岗位人员的日常职责，不是主要负责人的法定职责。\n【记忆钩子】负责人的动作都是组织、保证、建立、督促、报告，凡是亲自逐台、亲自全部、亲自授课多为干扰。","k":"主要负责人职责"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"single","q":"生产经营单位安全生产规章制度中，处于核心地位、统领其他各项制度的是（　）。","o":["安全生产责任制","安全操作规程","设备维护保养制度","考勤与休假管理制度"],"a":[0],"e":"安全生产责任制是生产经营单位最基本、最核心的安全管理制度，是各项规章制度的总纲，管生产必须管安全通过责任制层层落地。B安全操作规程是岗位操作层面的技术文件，受责任制统领；C属设备设施专项管理；D与安全生产无直接关系。\n【易错点】核心制度是安全生产责任制，不是安全操作规程；二者是总纲与岗位细则的层级关系。","k":"安全生产规章制度体系"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"single","q":"矿山、金属冶炼、建筑施工、运输单位和危险物品的生产、经营、储存、装卸单位，应当（　）。","o":["设置安全生产管理机构或者配备专职安全生产管理人员","由主要负责人兼任全部日常安全管理工作","委托外部单位全权负责本单位的安全生产","仅在发生事故后临时组建安全管理小组"],"a":[0],"e":"高危行业单位应当设置安全生产管理机构或者配备专职安全生产管理人员；其他单位也应按规定设置机构或配备专职、兼职安全管理人员。B混淆全面负责与日常管理，主要负责人不因机构设置而减责，但日常管理须有专门力量；C安全生产主体责任不得通过委托转移，受托机构提供服务不免除本单位责任；D违背安全管理常设化要求。\n【易错点】委托注册安全工程师或机构提供管理服务，不免除本单位的安全生产主体责任。","k":"安全管理机构与人员配备"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"single","q":"关于安全生产费用（安全生产投入），下列说法正确的是（　）。","o":["应专款专用，专门用于改善安全生产条件，不得挤占、挪用","可用于改善员工食堂、宿舍等生活福利设施","利润下降时可以首先削减","由从业人员个人按工资比例缴纳"],"a":[0],"e":"安全生产费用由生产经营单位按规定提取、在成本中列支，专门用于完善和改进安全生产条件，实行专款专用、专户核算，不得挤占挪用；决策机构、主要负责人或个人经营的投资人应保证投入满足安全生产需要，并对投入不足导致的后果负责。B属职工生活福利，C违背不得随意削减，D费用来源于单位而非个人缴纳。\n【记忆钩子】企业出钱、成本列支、专款专用、不足担责。","k":"安全生产费用"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"single","q":"安全生产责任保险的性质与主要作用是（　）。","o":["一种附带事故预防服务的保险，保险机构协助投保单位开展隐患排查、培训等风险防控","属于人身意外伤害保险，赔款直接冲抵单位对从业人员的赔偿责任","用于替代工伤保险的强制性险种","只负责出险赔付，不参与任何事故预防"],"a":[0],"e":"安全生产责任保险是商业保险，在矿山、危险化学品、烟花爆竹、交通运输、建筑施工、民用爆炸物品、金属冶炼、渔业生产等高危行业领域依法实施，其突出特征是保险机构须按约定提供事故预防服务（隐患排查、安全培训、风险评估等），赔偿与预防并重。B错在把安责险混同于人身意外险，且赔款不能免除单位依法应承担的赔偿责任；C安责险与工伤保险并行、互不替代；D忽视了它最具辨识度的事故预防功能。\n【易错点】安责险不等于工伤保险，也不等于一般财产险，提供事故预防服务是它的独有标签。","k":"安全生产责任保险"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"single","q":"生产经营单位将生产经营项目、场所、设备发包或者出租时，下列做法正确的是（　）。","o":["与承包、承租单位签订专门的安全生产管理协议，并对其安全生产工作统一协调、管理","在合同中约定安全由承包方全部负责后即可不再过问","只对承包方的生产进度与质量进行考核","由承包方自行决定是否需要签订安全生产管理协议"],"a":[0],"e":"发包、出租单位不得以包代管、以租代管：应与承包、承租单位签订专门的安全生产管理协议，或在承包、租赁合同中约定各自的安全生产管理职责，并对承包、承租单位的安全生产工作统一协调、管理，定期进行安全检查、督促整改。B约定免责不能免除法定责任，C只管进度放弃安全管理，D放弃法定管理义务。\n【记忆钩子】包出去的是活儿，包不出去的是责任。","k":"相关方与承包商管理"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"multi","q":"生产经营单位主要负责人的安全生产职责包括（　）。","o":["建立健全并落实本单位全员安全生产责任制","组织制定并实施本单位安全生产规章制度和操作规程","保证本单位安全生产投入的有效实施","组织制定并实施本单位的生产安全事故应急救援预案","对每一起一般隐患亲自到场拍照建档"],"a":[0,1,2,3],"e":"主要负责人法定职责集中于建机制、定制度、保投入、抓培训、管风险、定预案、报事故等组织保障层面，A、B、C、D均属之。E把隐患排查治理的具体事务强加给主要负责人，既不属于其法定职责，也无必要与可能，日常隐患的排查、登记、整改闭环由安全管理机构与岗位人员按制度执行。\n【易错点】区分组织制定并实施（负责人）与具体执行与记录（安全管理人员、岗位员工）。","k":"主要负责人职责"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"multi","q":"下列关于安全生产费用使用范围的说法，正确的有（　）。","o":["完善、改造和维护安全防护设施设备支出","配备、维护应急救援器材与开展应急演练支出","重大危险源和事故隐患的评估、监控与整改支出","安全生产宣传、教育、培训及配备劳动防护用品支出","新建办公楼等一般土建工程支出"],"a":[0,1,2,3],"e":"安全生产费用专门用于改善安全生产条件：安全设施设备的完善改造维护、应急救援器材与演练、重大危险源与事故隐患评估监控整改、安全教育培训与劳动防护用品、安全评价检测检验、安全生产标准化建设等。E是一般生产办公设施建设，不属于改善安全生产条件的安全投入，不得在安全生产费用中列支。\n【记忆钩子】凡属为消除或控制风险而花钱可列，凡属一般生产经营建设不可列。","k":"安全生产费用使用范围"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"multi","q":"生产经营单位的安全生产规章制度，按管理对象与内容通常涵盖的类别有（　）。","o":["综合安全管理类，如安全生产责任制、安全奖惩与事故管理","人员安全管理类，如安全教育培训、劳动防护用品管理","设备设施安全管理类，如安全操作规程管理、设备维护与危险作业审批","作业环境与职业健康类，如作业场所职业卫生管理","员工考勤、薪酬与请休假管理"],"a":[0,1,2,3],"e":"按安全生产管理的常用分类，规章制度可分为综合安全管理、人员安全管理、设备设施安全管理、作业环境（含职业健康）安全管理等类别，A、B、C、D分别对应其典型制度。E属于人力资源与行政管理范畴，与安全生产管理无直接关系，不纳入安全生产规章制度体系。\n【易错点】安全操作规程归入设备设施/作业类制度，注意与作为总纲的安全生产责任制区分层级。","k":"规章制度分类"},{"s":"zhuanan","p":"安全生产责任制与组织保障","c":5,"cn":"安全生产责任制与主体责任","t":"multi","q":"关于企业安全文化建设与安全生产责任制的关系，下列表述正确的有（　）。","o":["安全生产责任制为安全文化建设提供制度基础","安全文化通过共同理念与氛围引导员工由被动遵章转向主动要安全","安全文化建设可以替代责任制的刚性约束与追责机制","责任制的落实需要相应的监督检查与考核奖惩机制保障","只要张贴了安全标语、开了动员会，就完成了安全文化建设"],"a":[0,1,3],"e":"责任制提供刚性约束（明责、履责、追责），安全文化提供柔性引导（理念、氛围、自觉），二者互补而非替代：A、B、D正确。C错在替代，文化不能取代制度的强制力与严肃性；E把安全文化建设简单等同于标语口号与形式活动，流于表面，未触及安全观念与行为习惯的养成。\n【记忆钩子】制度管底线、文化管上限，刚柔并济、缺一不可。","k":"安全文化与责任制"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"single","q":"关于双重预防机制两道防线的作用，下列表述正确的是（　）。","o":["第一道防线把风险控制在可接受范围，第二道防线把隐患治理在事故发生之前","第一道防线排查隐患，第二道防线追究责任","第一道防线负责事后救援，第二道防线负责事故赔偿","两道防线均由政府监管部门独立运行，企业配合即可"],"a":[0],"e":"双重预防机制等于安全风险分级管控（第一道防线，关口前移，把风险控制在隐患形成之前）加隐患排查治理（第二道防线，把隐患消灭在事故发生之前）。B、C颠倒或曲解了两道防线的功能，D错在运行与责任主体是生产经营单位本身，监管部门履行监督职责而非替企业运行机制。\n【记忆钩子】先管风险、再治隐患；风险在前、隐患在后、事故在最后。","k":"双重预防机制"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"single","q":"安全风险分级管控的基本流程，排序正确的是（　）。","o":["危险源辨识→风险评估与分级→制定并落实管控措施→分级管控与动态更新","制定管控措施→危险源辨识→事故调查→风险评估","风险评估→直接销号→危险源辨识→无需更新","事故报告→隐患整改→危险源辨识→责任追究"],"a":[0],"e":"风险分级管控遵循辨识（找出危险源）→评估（确定风险等级）→管控（按等级落实技术、管理、个体防护等措施并明确管控层级）→持续改进与动态更新的闭环。B、C、D顺序错乱或掺入事故调查、责任追究等事后环节，都不构成事前分级管控流程。\n【易错点】辨识必在评估之前；不辨识就评估是无的放矢，评估完不落实措施等于没管。","k":"风险分级管控流程"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"single","q":"按安全风险分级管控的通行做法，风险等级由高到低对应的颜色标注依次是（　）。","o":["红、橙、黄、蓝","蓝、黄、橙、红","绿、黄、橙、红","红、黄、蓝、绿"],"a":[0],"e":"风险分级通常采用红（重大风险）、橙（较大风险）、黄（一般风险）、蓝（低风险）由高到低标注，分别对应不同层级的管控责任，风险越高、管控层级越高。B为倒序，C、D混入了不属于该标准序列的颜色。\n【记忆钩子】红橙黄蓝，由热到冷等于由险到安。","k":"风险分级四色"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"single","q":"关于危险源与事故隐患的关系，下列说法正确的是（　）。","o":["危险源是可能导致事故的根源或状态，隐患是管控措施缺失、失效或存在缺陷形成的问题","危险源与隐患是同一概念，只是叫法不同","隐患是根源，危险源是隐患造成的结果","只要存在危险源就必须立即停产整改"],"a":[0],"e":"危险源（如能量、危险物质，以及导致约束失效的因素）是客观存在的根源，本身不等于隐患；当管控措施缺失、失效或出现缺陷时，才构成事故隐患，隐患必须排查治理。D错在存在危险源即停产，危险源通过辨识、分级、管控把风险降到可接受即可，并非一律消除或停产。\n【易错点】有危险源不等于有隐患；危险源靠分级管控，隐患必须闭环治理。","k":"危险源与隐患辨析"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"single","q":"关于重大危险源的管理，下列做法正确的是（　）。","o":["登记建档，定期检测、评估、监控，制定应急预案并告知相关人员应急措施","仅在上级部门来检查时临时整理一次台账","将重大危险源的位置与危害对全体从业人员完全保密","辨识确定后一次建档、长期有效，无需再复核"],"a":[0],"e":"对重大危险源应登记建档，进行定期检测、评估、监控，制定应急预案，告知从业人员和相关人员在紧急情况下应采取的应急措施，并按规定向有关部门备案；构成重大危险源的设施与场所还应设置明显的安全警示标志与监测预警。B是形式主义，C否定从业人员的知情权与应急告知要求，D违背动态辨识、定期评估原则。\n【记忆钩子】建档、检测、评估、监控、预案、告知、备案一条链，环环不能少。","k":"重大危险源管理"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"single","q":"关于事故隐患排查治理，下列表述正确的是（　）。","o":["建立隐患台账，落实整改措施、责任、资金、时限和预案，整改后复查验收、闭环销号","一般隐患可以只登记不整改，积累到一定数量再统一处理","重大事故隐患由班组自行决定整改方案即可，无需上报","隐患整改完成后不必复查验收，可直接销号"],"a":[0],"e":"隐患排查治理实行闭环管理：登记建档、下达整改通知、落实整改责任与措施（重大隐患还须落实资金、时限、预案并制定治理方案）、整改后复查验收、销号；重大事故隐患应及时向负有安全生产监督管理职责的部门报告，治理期间难以保证安全的应停产停业、撤出人员。B、C、D分别违背查必改、重大隐患上报、改必验的要求。\n【易错点】查而不改、改而不验都不算闭环；重大隐患的治理方案与报告是关键得分点。","k":"隐患排查治理闭环"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"single","q":"关于安全评价按实施阶段的分类，下列说法正确的是（　）。","o":["安全预评价在建设项目前期进行，安全验收评价在竣工后、正式投产前进行，安全现状评价针对在役生产系统","安全预评价在事故发生之后进行","安全验收评价等同于日常的安全检查表检查","安全现状评价只适用于尚未开工的新建项目"],"a":[0],"e":"按实施阶段划分：安全预评价（项目前期、可研与设计阶段，预测性辨识与评估）、安全验收评价（竣工后、正式投产使用前，验证安全设施三同时落实与有效性）、安全现状评价（在役生产系统定期或特定情形下的综合安全评价）。B把预评价当事后评价，C混淆验收评价与日常检查，D现状评价的对象是在役系统而非新建项目。\n【记忆钩子】预等于事前预测，验收等于投产前把关，现状等于在役体检。","k":"安全评价分类"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"multi","q":"下列安全评价方法中，主要用于定性或半定量风险分析的有（　）。","o":["安全检查表法（SCL）","预先危险性分析（PHA）","危险与可操作性研究（HAZOP）","作业条件危险性评价法（LEC）","定量风险评价（QRA，基于事故概率与后果的数值计算）"],"a":[0,1,2,3],"e":"SCL按检查清单逐项定性核查，PHA在系统早期定性辨识危险源与触发条件，HAZOP用引导词定性审查工艺参数偏差及后果，LEC以事故发生可能性、暴露于危险环境的频繁程度、后果严重性赋分半定量评估作业条件危险性，四者均属定性或半定量方法。E（QRA）以事故概率与后果数值进行定量计算，属定量风险评价，与题意定性或半定量不符，应排除。\n【易错点】LEC带分值但仍是半定量；QRA才是用概率算数的纯定量方法，别被有分数迷惑。","k":"安全评价方法分类"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"multi","q":"关于安全风险分级管控与隐患排查治理（双重预防机制），下列说法正确的有（　）。","o":["风险分级管控强调按风险等级落实相应层级的管控责任与措施","隐患排查治理针对的是风险控制措施失效或缺失所形成的缺陷","企业应将风险点、管控措施及应急处置措施告知相关岗位从业人员","双重预防机制的运行主体是生产经营单位，并应随工艺、设备、物料变化动态更新","机制建立并通过验收后即可永久沿用，无需再更新"],"a":[0,1,2,3],"e":"A、B分别对应两道防线的定位；C是风险公告与岗位告知（保障知情权、确保措施落地）的要求，正确；D强调企业主体责任与动态更新，正确。E错在永久沿用，工艺、设备、物料、作业环境及法律法规变化时须重新辨识评估、动态更新，双重预防机制是动态闭环而非一次性达标工程。\n【易错点】双重预防机制最怕建完就锁进抽屉，动态更新与全员告知才是它的灵魂。","k":"双重预防机制要点"},{"s":"zhuanan","p":"双重预防机制与安全评价","c":6,"cn":"风险分级管控、隐患排查与安全评价","t":"multi","q":"安全评价的一般程序通常包括（　）等环节。","o":["前期准备与危险、有害因素辨识分析","划分评价单元并选择评价方法","定性、定量评价并提出安全对策措施建议","作出评价结论、编制安全评价报告","代替生产经营单位承担事故的赔偿与整改责任"],"a":[0,1,2,3],"e":"安全评价程序为：前期准备（收集资料、现场勘查）→辨识与分析危险有害因素→划分评价单元→选择评价方法→定性定量评价→提出安全对策措施建议→作出评价结论→编制安全评价报告。E超出评价机构的职责边界，评价机构对其出具的评价报告依法承担责任，但不替代生产经营单位的安全生产主体责任，也不承担事故赔偿与整改责任。\n【记忆钩子】流程口诀：备、辨、划、选、评、策、论、报。","k":"安全评价程序"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"single","q":"安全生产标准化建设所遵循的运行模式是（　）。","o":["策划—实施—检查—改进（PDCA）动态循环、持续改进","一次性达标评审通过后固定不变","仅依靠政府监管部门外部检查推动","以事故起数作为唯一衡量标准"],"a":[0],"e":"安全生产标准化采用PDCA动态循环模式：策划（P，制定方针目标与制度）、实施（D，落实运行与记录）、检查（C，监督、考评、自评）、改进（A，纠偏、完善、提升），通过自我检查、自我纠正、自我完善实现持续改进与绩效提升。B、C、D都否定其企业自主运行、动态循环、持续改进的本质。\n【记忆钩子】标准化不是一次考试，是企业一辈子的PDCA。","k":"安全生产标准化运行模式"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"single","q":"安全生产标准化以（　）为基础，建立全员、全过程、全方位的安全管理体系。","o":["安全风险管控和隐患排查治理，落实企业安全生产主体责任","政府监管部门包办代替","购买最高保额的商业保险","把全部安全事务外包给第三方"],"a":[0],"e":"标准化以落实企业安全生产主体责任为落脚点，以安全风险分级管控和隐患排查治理为基础，覆盖全员、全过程、全方位，实现岗位达标、专业达标、企业达标。B、C、D都把主体责任外移，或用单一手段（买保险、外包）替代系统化的体系建设。\n【易错点】标准化等级靠自主运行加自评加外部评审取得并保持，不是靠买保险或外包。","k":"安全生产标准化内涵"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"single","q":"生产经营单位采用新技术、新工艺、新材料或者使用新设备时，应当（　）。","o":["对从业人员进行专门的安全生产教育和培训，使其了解安全技术特性并掌握防护措施","直接投入使用，让员工边干边熟悉","只培训管理人员，操作人员自行摸索","因员工已有同类作业经验而免于培训"],"a":[0],"e":"四新（新技术、新工艺、新材料、新设备）必须组织专门的安全生产教育和培训，使从业人员了解其安全技术特性、掌握安全操作规程与防护措施；同时应结合四新重新辨识风险、修订规章制度与操作规程。B、C、D都违反四新专项培训要求。\n【记忆钩子】四新必配四懂：懂特性、懂风险、懂防护、懂操作。","k":"四新安全培训"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"single","q":"关于特种作业人员上岗作业的要求，下列说法正确的是（　）。","o":["必须经专门的安全作业培训并取得相应资格，方可上岗作业","只要具备多年实操经验即可无证上岗","由班组长口头同意后即可独立操作","普通岗前三级安全教育可替代特种作业操作资格"],"a":[0],"e":"特种作业（如电工作业、焊接与热切割作业、高处作业、制冷与空调作业等）危险性大、易发生事故，作业人员必须经专门的安全技术培训并考核合格、取得相应资格后方可上岗，并按规定参加复审、复审合格方可继续作业。B、C、D都否定持证上岗这一硬性要求。\n【易错点】三级安全教育不等于特种作业培训；前者是全员普及，后者是专项持证，二者不能相互替代。","k":"特种作业人员"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"single","q":"关于劳动防护用品的选用原则，下列说法正确的是（　）。","o":["依据作业场所的危险有害因素与防护要求正确选用，并监督从业人员正确佩戴使用","价格越贵，防护效果一定越好","可用普通民用口罩替代防尘、防毒呼吸防护用品","发放之后由从业人员自行决定是否佩戴"],"a":[0],"e":"劳动防护用品的选用要对症：依据危害因素的种类、浓度或强度、作业环境选用符合标准、具备相应防护性能的产品，用人单位应免费提供、不得以货币或其他物品替代，并教育、监督从业人员正确佩戴使用。B以价格代替性能与适配性，C防护等级明显不足，D放弃教育监督义务。\n【记忆钩子】选对型、戴对法、单位买单、监督到位。","k":"劳动防护用品选用"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"single","q":"关于劳动防护用品的使用管理，下列做法正确的是（　）。","o":["建立发放台账，定期检查维护，达到报废条件或失效时及时更换","一次性发放后长期、终身使用","对公用的防护器具不做任何检查即反复使用","超过有效使用期限但外观完好即可继续使用"],"a":[0],"e":"用人单位应建立劳动防护用品的采购、验收、保管、发放、使用、更换、报废管理制度与台账；对安全帽、安全带、呼吸防护用品等应定期检查维护，达到报废条件（超过有效期、破损、失效、受过冲击或接触过有害物）即强制报废、及时更换。B、C、D都可能使防护性能丧失而不被察觉，形成戴了等于没戴。\n【易错点】安全帽、安全带受过一次冲击或超过有效期，即便看着很新也应报废。","k":"劳动防护用品管理"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"single","q":"生产经营单位建立安全生产教育和培训档案，其主要作用是（　）。","o":["如实记录培训时间、内容、参加人员及考核结果，实现可追溯与持续改进","仅用于上级检查时临时补填应付","作为扣发从业人员工资的依据","替代从业人员的特种作业操作资格证书"],"a":[0],"e":"培训档案应如实记录培训的时间、地点、内容、授课人、参加人员、考核结果等，是落实培训主体责任、证明培训到位、实现可追溯与持续改进的重要依据，也是事故调查与监管检查的重要资料。B弄虚作假、C用途错位、D档案不能替代依法取得的操作资格证书。\n【记忆钩子】档案记清何时、学啥、谁参加、考得怎样，四项要素缺一不可。","k":"安全教育培训档案"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"multi","q":"安全生产标准化的核心要素通常涵盖（　）等方面。","o":["目标职责与制度化管理","教育培训与现场管理","安全风险管控及隐患排查治理","应急管理、事故管理与持续改进","产品定价与销售渠道管理"],"a":[0,1,2,3],"e":"安全生产标准化基本规范的核心要素一般包括：目标职责、制度化管理、教育培训、现场管理、安全风险管控及隐患排查治理、应急管理、事故管理、持续改进等，形成策划—实施—检查—改进的完整闭环。E属于企业经营管理范畴，与安全生产标准化要素无关。\n【易错点】双重预防（风险管控加隐患治理）是标准化的核心支柱之一，别只把它当成一项独立制度。","k":"安全生产标准化要素"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"multi","q":"生产经营单位应当对从业人员进行安全生产教育和培训的情形包括（　）。","o":["新录用人员上岗前的三级安全教育","调换工种、离岗后重新上岗，以及采用四新时的相应培训","特种作业人员接受专门培训并取得相应资格","对进入作业现场的外来参观、实习、承包方人员进行安全告知","仅在发生生产安全事故之后才组织培训"],"a":[0,1,2,3],"e":"安全教育培训覆盖全员、全过程：新员工三级教育、转岗与复岗再培训、四新专项培训、特种作业持证培训、相关方与外来人员安全告知、经常性安全教育等。E错在仅事后培训，培训以事前预防为主，事故后的警示教育是补充，而不是唯一时机。\n【记忆钩子】入厂、转岗、复岗、四新、特种、外来，情形一变就要训。","k":"安全教育培训情形"},{"s":"zhuanan","p":"安全标准化与教育培训","c":7,"cn":"安全生产标准化、教育培训与劳动防护","t":"multi","q":"关于劳动防护用品（个体防护装备），下列说法正确的有（　）。","o":["用人单位应免费提供符合标准的劳动防护用品，不得以货币或其他物品替代","个体防护是控制职业危害的最后一道防线，不能替代工程治理措施","应针对头部、呼吸、眼面、听觉、手部、足部、躯干、坠落防护等不同部位选配","用人单位应教育、监督从业人员正确佩戴和使用","只要配备最高等级的防护用品，即可取消通风、密闭、降噪等工程措施"],"a":[0,1,2,3],"e":"个体防护处于职业危害控制层级的最末端，其地位低于危害消除与替代、工程控制、管理控制，不能本末倒置；A、B、C、D分别对应免费提供、层级定位、按部位选配、教育监督，均正确。E错在用个体防护取代源头治理与工程措施，违反先源头、后个体的控制层级原则。\n【记忆钩子】防护层级：先消除与替代、再工程、后管理、末个体，个体防护永远排在最后。","k":"劳动防护用品要点"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"single","q":"生产经营单位的应急预案体系中，针对具体场所、装置或岗位编制，重点明确应急处置程序与岗位动作的是（　）。","o":["现场处置方案","综合应急预案","专项应急预案","上级人民政府的突发公共事件总体预案"],"a":[0],"e":"预案体系分三层：综合应急预案（总体纲领，规定应急组织体系、响应原则与基本程序）、专项应急预案（针对某一类事故，如火灾、危险化学品泄漏）、现场处置方案（针对具体场所、装置或岗位，以卡片形式明确事故风险描述、应急工作职责、应急处置程序与注意事项，最贴近一线操作）。D是政府层面的预案，不属于生产经营单位应急预案体系。\n【记忆钩子】综合管总、专项管类、现场管点。","k":"应急预案体系层次"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"single","q":"按组织形式划分，应急演练可分为（　）。","o":["桌面演练和实战演练","综合演练和单项演练","检验性演练和示范性演练","内部演练和联合演练"],"a":[0],"e":"应急演练有三个常见分类维度：按组织形式分为桌面演练（讨论推演、口头模拟）与实战演练（实际操作、动用人员装备）；按演练内容分为综合演练与单项演练；按目的作用分为检验性演练、示范性演练与研究性演练。B是按内容分类，C是按目的分类，D不是规范的分类维度。本题问组织形式，故选A。\n【易错点】三个维度极易张冠李戴：形式看桌面或实战、内容看综合或单项、目的看检验或示范或研究。","k":"应急演练分类"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"single","q":"应急预案编制完成后，生产经营单位应当组织（　），以检验其科学性、实用性与可操作性。","o":["评审或论证，并由主要负责人签署发布、按规定备案、定期评估修订","直接封存归档，不再改动","仅由编制部门内部签字确认后发布","发布后长期不变，仅在发生事故后临时修订"],"a":[0],"e":"预案编制后应组织评审（内部评审或外部专家论证），由本单位主要负责人签署发布，按规定报送有关部门备案，并组织培训与演练、定期评估，根据演练评估结果、组织机构与风险变化及时修订，形成全生命周期闭环管理。B、C、D都属于预案闭环管理缺失。\n【记忆钩子】预案全生命周期：编、评、发、备、训、练、评、改。","k":"应急预案编制与评审"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"single","q":"事故发生后，关于事故现场有关人员与单位负责人的报告义务，下列表述正确的是（　）。","o":["现场有关人员应立即报告本单位负责人，单位负责人接报后应迅速组织抢救并按规定如实上报","现场人员可先自行处理，处理不了再报告","单位负责人可等待事故原因完全查清后再一并上报","只需口头通知相邻单位，无需向负有监管职责的部门报告"],"a":[0],"e":"事故报告要求及时、如实：事故现场有关人员应当立即报告本单位负责人；单位负责人接到报告后应迅速采取有效措施、组织抢救、防止事故扩大以减少人员伤亡和财产损失，并按规定如实报告负有安全生产监督管理职责的部门，不得迟报、漏报、谎报、瞒报，不得在事故调查处理期间擅离职守。B、C、D都违背及时、如实报告与组织抢救义务。\n【易错点】先抢救、边报边救，不能等查清再报，更不能瞒报、谎报。","k":"事故报告要求"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"single","q":"事故调查处理应当坚持的原则是（　）。","o":["科学严谨、依法依规、实事求是、注重实效","快速结案、从轻处理、内部消化","以罚代管、以赔代改","由职务最高者单方面认定责任"],"a":[0],"e":"事故调查处理坚持科学严谨、依法依规、实事求是、注重实效的原则，及时准确查明事故原因，查明事故性质和责任，评估应急处置工作，总结事故教训、提出防范和整改措施，并提交事故调查报告；同时落实四不放过要求。B、C、D都违背依法、客观、追责与整改并重的要求。\n【记忆钩子】四不放过讲结果（原因、责任人、整改、教育），四原则讲态度（严谨、依法、求实、实效），别记混。","k":"事故调查处理原则"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"single","q":"关于事故致因理论，海因里希事故因果连锁论的核心观点是（　）。","o":["伤亡事故是一连串因素按因果顺序连锁作用的结果，消除中间环节即可中断连锁、防止事故","事故完全由不可控的偶然因素决定，无规律可循","只要设备足够先进，就不会发生任何生产安全事故","事故原因只能归咎于个人违章，与管理因素无关"],"a":[0],"e":"海因里希把事故过程概括为遗传及社会环境、人的缺点、人的不安全行为或物的不安全状态、事故、伤害这样一串因果连锁，如同多米诺骨牌，抽掉其中任一环节（尤其是消除人的不安全行为与物的不安全状态）即可中断连锁、避免伤害。B否定事故的规律性与可预防性，C、D片面化，现代系统安全理论强调管理缺陷是深层次原因，不能把事故只归咎于个人或只寄托于设备。\n【记忆钩子】多米诺骨牌，抽掉中间那张（不安全行为与不安全状态）。","k":"事故致因理论"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"multi","q":"一套完整、可操作的生产经营单位应急预案文件，除三类预案主体外还应包含（　）等支撑性内容。","o":["应急组织机构及各岗位职责","应急物资、装备与避难场所清单","危险源与风险清单、周边应急资源及联络方式","事故报告与应急响应流程、规范化记录表格","员工年度绩效考核与奖金分配表"],"a":[0,1,2,3],"e":"预案的支撑附件是把纸面预案变成可操作预案的关键：明确谁来干（机构职责）、用什么干（物资装备与场所）、针对什么干（危险源与风险清单）、如何联动（联络方式与响应流程）、如何留痕（记录表格）。A、B、C、D都属于此类支撑内容。E属于人力资源薪酬管理，与应急预案无关。\n【记忆钩子】预案落地五件套：人、物、险、联、表。","k":"应急预案附件构成"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"multi","q":"应急演练结束后，演练评估与总结改进环节通常包括（　）。","o":["对演练执行情况、预案合理性与可操作性进行评估","总结存在问题并提出整改措施","根据演练暴露的问题修订完善应急预案","将演练情况与改进结果归档并组织相关人员学习","演练结束即任务完成，无需形成任何书面记录"],"a":[0,1,2,3],"e":"演练闭环为计划、准备、实施、评估、改进：演练后应组织评估（检验预案、锻炼队伍、磨合机制、教育公众、完善准备），撰写评估与总结报告，针对暴露问题制定整改、修订预案，并归档、组织学习、跟踪验证整改效果。E错在无需书面记录，演练须有方案、记录、评估报告与整改闭环。\n【易错点】演练的价值不在演得热闹，而在评估出真问题、改到位。","k":"应急演练评估与改进"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"multi","q":"下列关于事故致因理论与事故预防的说法，正确的有（　）。","o":["人的不安全行为和物的不安全状态是事故的直接原因","管理上的缺陷往往是导致不安全行为与不安全状态的深层次原因","能量意外释放理论认为事故本质是能量的不正常转移或意外释放","轨迹交叉理论强调人的因素与物的因素在时间和空间上相遇才导致事故","只要彻底消灭违章行为，就能杜绝所有生产安全事故"],"a":[0,1,2,3],"e":"A、B对应综合致因论对直接原因与间接（深层）原因的划分，C是能量意外释放论的核心，D是轨迹交叉论的核心，均正确。E把事故预防绝对化、单一化：即便消除人的违章，设备故障、环境不良、管理缺陷仍可能单独或组合致灾，系统安全强调人、机、环、管多维度综合防控。\n【记忆钩子】直接看行为状态、深挖找管理、本质查能量、触发看交叉。","k":"事故致因理论综合"},{"s":"zhuanan","p":"应急管理与事故调查","c":8,"cn":"应急预案、演练与事故报告调查分析","t":"multi","q":"关于生产安全事故统计指标，下列说法正确的有（　）。","o":["绝对指标反映事故总量，如事故起数、伤亡人数、直接经济损失","相对指标便于在不同单位、不同时期之间作横向与纵向比较","伤害频率、伤害严重率一类的率指标属于相对指标","按事故类别、原因、伤害部位计算的构成比属于相对指标","相对指标没有比较价值，只有绝对指标才有统计意义"],"a":[0,1,2,3],"e":"事故统计指标分两类：绝对指标是总量指标（事故起数、死亡重伤轻伤人数、直接经济损失、损失工日等），反映规模但受暴露人数与作业量影响，不便直接比较；相对指标是两个绝对量之比（率、比、频率、构成比），消除了规模差异，适合不同企业、不同时期的横向纵向比较与趋势分析。E把二者作用说反，恰恰是相对指标更适合比较。\n【易错点】判断口诀：是多少个、多少元属绝对；是率、比、频率、占比属相对。","k":"事故统计指标"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"single","q":"机械设备传动部位（如齿轮、皮带轮、联轴器、旋转轴）设置防护罩的主要目的是（　）。","o":["防止人体任何部位接触运动部件而被卷入、夹击或绞碾","便于操作人员随时观察设备的运转状态","减少设备运转时的能量损耗","提高设备的自动化程度"],"a":[0],"e":"机械伤害多发生在旋转、往复、传动等危险部位，防护罩、防护栏用于实现物理隔离，防止人员接触运动件造成绞、碾、卷入、夹击、剪切等伤害；联锁装置、双手操纵装置、急停装置等是补充措施。B、C、D都不是设置防护装置的安全目的，观察需求应通过网状防护罩、透明防护板等方式兼顾。\n【记忆钩子】转的、动的、咬合的，一律罩起来。","k":"机械伤害防护"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"single","q":"关于机械设备的安全防护装置，下列说法错误的是（　）。","o":["为方便清理，可以在设备运转过程中临时拆下防护罩，用完后再装回","防护装置应牢固可靠、不易被绕过或随意拆除","联锁装置应保证防护装置打开时设备不能启动或立即停止运转","检修设备时应执行断电、挂牌、上锁等能量隔离措施"],"a":[0],"e":"本题选错误项。A错误：设备运转中拆除防护罩使危险部位裸露，是典型的违章行为，极易导致绞碾、卷入伤害；清理、调整、维修必须先停机断电并落实能量隔离。B、C、D分别是防护装置的可靠性、联锁功能与检修能量隔离（上锁挂牌）的正确要求。\n【易错点】就拆一下、马上装回是侥幸心理最常栽的跟头；联锁与能量隔离才是正解。","k":"机械防护装置要求"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"single","q":"防止直接接触电击（正常工作状态下带电体）最基本、最常用的防护措施是（　）。","o":["绝缘、屏护（遮栏或护罩）和保持安全间距","保护接地","保护接零","把装设漏电保护器作为唯一防护措施"],"a":[0],"e":"触电防护分两类：直接接触电击防护靠绝缘、屏护、安全间距把带电体封闭或隔开，以及采用安全特低电压等；间接接触电击（故障时原本不带电的金属外壳意外带电）防护才依靠保护接地、保护接零（自动切断电源）等措施。B、C属间接接触防护，D表述错误，剩余电流动作保护装置通常作为附加或后备防护，不能作为唯一措施，也不能替代绝缘、屏护等基本防护。\n【易错点】先分清直接接触还是间接接触：正常带电用绝缘屏护间距，故障带电用接地接零并切断电源。","k":"触电防护措施"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"single","q":"在潮湿、狭窄、金属容器内部等触电危险性大的作业环境，应优先采用（　）作为安全供电措施。","o":["安全特低电压且由安全隔离变压器供电，并配合绝缘防护用品","直接引用普通市电且不做任何隔离","提高供电电压以减小回路电流","采用自耦变压器降压后直接供电"],"a":[0],"e":"特别危险环境（潮湿、导电良好地面、金属容器或管道内）应采用安全特低电压供电，电源须由安全隔离变压器提供、与高压侧可靠隔离，二次回路不得接地，并配绝缘手套、绝缘鞋、绝缘垫等防护用品。B无任何隔离，C中电压越高通过人体的电流越大越危险，D用自耦变压器降压不可替代安全隔离变压器，自耦变压器一、二次侧有电的直接联系，故障时高压可能窜入低压侧，不能作为安全特低电压电源。\n【记忆钩子】特别危险场所用安全特低电压加隔离变压器，再加绝缘防护。","k":"安全特低电压"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"single","q":"关于保护接地与保护接零，下列说法正确的是（　）。","o":["保护接地把设备外壳接地以降低故障时的对地电压，保护接零把外壳接保护零线，借短路电流使保护装置迅速切断电源","两者可在同一低压配电网中随意混用","保护接零就是把设备金属外壳接到自来水管上","保护接地只在设备正常运行带电时起作用"],"a":[0],"e":"二者都是防止间接接触电击（故障时原本不带电的金属外壳意外带电）的措施，但机理不同：保护接地通过低接地电阻把故障外壳对地电压限制到较低水平；保护接零把外壳接至保护零线（PE），使碰壳故障形成单相短路，促使熔断器或断路器迅速动作切断电源。B错在同一低压系统中一般不允许部分设备接地、部分接零混用，接地设备漏电时可能使接零设备外壳带上危险电压；C接自来水管不可靠且违规；D接地针对的是故障带电，不是正常运行带电。\n【易错点】接零是接保护零线（PE或PEN），不是接水管；先分清直接接触与间接接触再选措施。","k":"保护接地与保护接零"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"single","q":"关于特种设备的安全使用管理，下列做法正确的是（　）。","o":["办理使用登记、建立安全技术档案、按期申报定期检验并做好日常维护保养与检查","只要设备尚能运转就一直使用，不必安排检验","由操作人员自行决定是否办理使用登记","安全技术档案只保存采购发票即可"],"a":[0],"e":"特种设备（锅炉、压力容器、压力管道、电梯、起重机械、客运索道、大型游乐设施、场（厂）内专用机动车辆等）须依法办理使用登记、建立完整的安全技术档案（设计、制造、安装、改造、维修、检验、运行与故障记录等）、按规定周期申报定期检验，并开展日常维护保养、经常性检查与隐患排查，作业人员与相关管理人员按规定持证上岗。B、C、D都违背法定管理要求。\n【记忆钩子】特种设备管理抓登记、建档、定检、持证、日常维保，一样都不能少。","k":"特种设备使用管理"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"single","q":"关于高处作业与有限空间作业共有的安全管理要求，下列说法正确的是（　）。","o":["作业前进行风险辨识与审批、落实专项安全措施、安排专人监护并配备应急救援装备","二者危险程度不高，可由单人自行决定作业","只要作业人员经验丰富就不需要安排监护","作业中不必考虑应急救援，出事后再临时想办法"],"a":[0],"e":"高处作业与有限空间（受限空间）作业均属高风险作业，共性要求是：作业前风险辨识与作业审批（作业票）、专项安全技术措施与交底（如安全带高挂低用、先通风再检测后作业）、安排专人全程监护、配备并会正确使用应急救援装备与器材、严禁盲目施救。B、C、D都否定审批、监护与应急准备。\n【易错点】盲目施救是有限空间作业伤亡扩大的首要原因；监护人是专门盯着的人，不是一起干的人。","k":"高风险作业安全管理"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"multi","q":"机械伤害的主要类型包括（　）。","o":["卷入、绞碾与夹击","剪切、切割与刺扎","飞出物、崩块造成的物体打击","碰撞、挤压与缠绕","电离辐射导致的细胞损伤"],"a":[0,1,2,3],"e":"机械性伤害主要来自机械设备运动部件与工具、工件的机械能作用：卷入缠绕、绞碾、夹击、剪切、切割、刺扎、碰撞挤压、飞出物或崩块打击等。E属物理性职业危害（电离辐射）的作用后果，是能量长期作用引起的健康损害，不属于机械伤害类型。\n【易错点】别把噪声、振动、辐射等职业危害与机械伤害混为一类，前者是能量长期作用，后者是机械能瞬时作用。","k":"机械伤害类型"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"multi","q":"下列关于电气安全防护的说法，正确的有（　）。","o":["绝缘、屏护和间距是防止直接接触电击的基本措施","保护接地与保护接零主要用于防止间接接触电击","剩余电流动作保护装置通常作为附加防护，不能替代基本绝缘与接地等措施","在爆炸危险场所应选用与危险区域等级相适应的防爆电气设备","只要安装了漏电保护器，就可以取消设备外壳的接地或接零"],"a":[0,1,2,3],"e":"A、B分别对应直接接触与间接接触防护的基本措施；C中剩余电流动作保护是附加或后备防护，须与绝缘、屏护、接地接零等配合使用，不能单独取代；D中爆炸性环境须按危险区域分区选用隔爆、增安、本质安全等相应防爆型式的电气设备。E错在取消接地或接零，漏电保护器不能替代基本防护，单一措施一旦失效即失去保护。\n【记忆钩子】电气防护讲多重屏障：基本防护加故障防护加附加防护，层层兜底，谁也不能替谁。","k":"电气安全防护综合"},{"s":"zhuanan","p":"机械与电气安全技术","c":9,"cn":"机械、电气、特种设备与作业安全技术","t":"multi","q":"关于有限空间（受限空间）作业，下列做法正确的有（　）。","o":["作业前办理审批手续，进行危险有害因素辨识与安全技术交底","严格执行先通风、再检测、后作业的顺序","作业期间保持持续通风与气体监测，安排专人全程监护","配备呼吸防护、救生索、三脚架等应急救援装备，严禁无防护盲目施救","为提高效率，可一人下井作业、另一人在井口顺手搭把手照应"],"a":[0,1,2,3],"e":"有限空间作业要点：作业审批与风险辨识、隔离（清洗、置换、盲板隔断）、先通风再检测后作业、持续监测与通风、专人监护、防护与救援装备到位、严禁盲目施救。A、B、C、D均正确。E描述的是无正式审批、无气体检测、无有效监护与应急准备的冒险作业，正是伤亡扩大的典型诱因，应坚决禁止。\n【记忆钩子】有限空间三字诀风、测、护，再加一条铁律：不盲目下去救人。","k":"有限空间作业要点"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"single","q":"燃烧（着火）必须同时具备的三个基本条件是（　）。","o":["可燃物、助燃物（氧化剂）和引火源（温度达到着火点）","可燃物、氮气与密闭空间","氧气、二氧化碳与惰性气体","可燃物、催化剂与高压环境"],"a":[0],"e":"燃烧三要素为可燃物、助燃物（氧化剂，常见为空气中的氧）、引火源（足够温度或能量使可燃物达到着火点），三者同时存在且相互作用才会发生燃烧；一切灭火方法的本质都是破坏其中至少一个要素。B中氮气与二氧化碳一般不助燃，C缺少可燃物与引火源且二氧化碳是灭火介质，D中催化剂与高压都不是燃烧的必要条件。\n【记忆钩子】火三角：可燃、助燃、点火源；灭火就是拆掉任意一角。","k":"燃烧三要素"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"single","q":"关于灭火的基本方法，下列对应关系正确的是（　）。","o":["冷却法——降低燃烧物温度至着火点以下","窒息法——把可燃物搬离火场","隔离法——向火焰喷射化学灭火剂中断链式反应","抑制法——用不燃气体稀释氧气浓度"],"a":[0],"e":"四种基本灭火方法：冷却（降温至燃点以下，如用水）、窒息（隔绝或稀释氧，如二氧化碳、泡沫覆盖）、隔离（移走或隔断可燃物，如关闭阀门、转移可燃物）、化学抑制（中断燃烧链式反应，如干粉灭火剂）。A对应正确；B把搬离可燃物错配给窒息法（应属隔离法）；C把喷射化学灭火剂错配给隔离法（应属抑制法）；D把稀释氧浓度错配给抑制法（应属窒息法）。\n【易错点】四种方法极易张冠李戴，按降温是冷却、断氧是窒息、搬物是隔离、断链是抑制对号入座。","k":"灭火基本方法"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"single","q":"关于可燃气体（蒸气）的爆炸极限，下列说法正确的是（　）。","o":["只有浓度处于爆炸下限与爆炸上限之间时，遇火源才会发生爆炸","浓度低于爆炸下限时最容易发生爆炸","浓度高于爆炸上限时遇火源必定爆炸","爆炸极限与温度、压力、含氧量等条件无关"],"a":[0],"e":"可燃气体或蒸气与空气混合后，遇火源能发生爆炸的浓度范围称爆炸极限（下限至上限）：低于下限时可燃物过少，既不燃也不爆；高于上限时氧气不足，一般不爆，但遇空气稀释后可能重新落入爆炸范围，仍然危险；只有区间内才发生爆炸。爆炸下限越低、极限范围越宽，火灾爆炸危险性越大。爆炸极限受温度、压力、含氧量、惰性气体含量、点火能量等影响，故D错误。\n【记忆钩子】太稀不炸、太浓不炸、中间才炸；下限越低越危险。","k":"爆炸极限"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"single","q":"危险化学品安全标签与安全技术说明书（SDS）的共同作用是（　）。","o":["向下游使用者传递化学品的危险性、安全使用、防护措施与应急处置信息","仅用于产品宣传与美化包装","只标注生产厂家的名称与联系方式","可替代危险化学品的安全储存规范与岗位操作规程"],"a":[0],"e":"化学品安全标签（象形图、信号词、危险性说明、防范说明等）与安全技术说明书SDS（成分组成、危险性概述、急救措施、消防措施、泄漏应急处理、操作处置与储存、接触控制与个体防护、理化特性、毒理学与生态学资料、废弃处置、运输信息、法规信息等）合称一书一签，用于向下游传递危害与防护信息，是从业人员知情权与安全使用、应急处置的依据。B、C片面，D错在替代，标签与说明书不能取代工程控制、储存规范与操作规程。\n【记忆钩子】一书（SDS）一签（标签），危害、防护、应急信息全在上面。","k":"化学品一书一签"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"single","q":"生产性粉尘所致职业健康危害中，长期吸入游离二氧化硅含量较高的矿物性粉尘最易引起（　）。","o":["矽肺（硅沉着病），属不可逆的尘肺病","职业性哮喘等过敏性呼吸系统疾病","噪声聋等物理因素所致职业病","接触性皮炎等职业性皮肤病"],"a":[0],"e":"长期吸入含游离二氧化硅的矿物性粉尘可致矽肺，是尘肺中进展较快、危害较重的一类，肺组织弥漫性纤维化一旦形成目前不可逆转、缺乏特效根治手段，故重在源头防尘与职业健康监护。B多由致敏性化学物或生物因素经呼吸道致敏引起，C由噪声这一物理因素引起，D由皮肤接触刺激物或致敏物引起，致病因素与进入途径都与游离二氧化硅粉尘不同。\n【记忆钩子】矽肺不可逆，预防重于治疗；综合防尘口诀：革、水、密、风、护、管、教、查。","k":"粉尘危害与防尘"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"single","q":"关于生产性噪声的职业危害及防护，下列说法错误的是（　）。","o":["噪声只会引起听觉疲劳，脱离噪声环境后都能完全恢复，不会造成永久性损伤","长期接触强噪声可导致永久性听力损失甚至噪声聋","控制噪声应优先采取声源控制与传播途径控制，如消声、隔声、吸声、减振","佩戴耳塞、耳罩属于作为最后一道防线的个体听力保护措施"],"a":[0],"e":"本题选错误项。A错误：短时间暴露可致暂时性听阈位移（听觉疲劳，脱离后可恢复），但长期反复接触强噪声会发展为永久性听阈位移乃至噪声聋（不可逆），还可影响神经系统、心血管系统与心理状态。B、C、D正确：工程控制优先（源头降噪、传播途径上消声隔声吸声减振），个体防护（耳塞耳罩）作为补充与最后防线，并配合健康监护与接触时间管理。\n【易错点】听觉疲劳可恢复、噪声聋不可逆，别把两者混为一谈。","k":"噪声危害与防护"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"multi","q":"控制与消除点火源，是防火防爆的重要措施。下列属于点火源控制范畴的有（　）。","o":["禁止明火，动火作业实行审批与现场隔离","选用防爆电气设备，防止电气火花与静电放电","防止机械摩擦、撞击产生火花，使用防爆工具","控制高温表面与热辐射，避免蓄热自燃","刻意增大可燃气体浓度使其始终高于爆炸上限"],"a":[0,1,2,3],"e":"常见点火源包括明火、电气火花、静电放电、摩擦与撞击火花、高温表面、雷电、自热自燃等，A、B、C、D都是针对性的点火源控制措施。E本身不属于点火源控制，且做法不可靠，一旦泄漏、通风或混入空气使浓度回落进爆炸区间反而更危险；工程上应通过密闭、通风、惰性化、可燃气体检测报警等把浓度控制在安全范围，并配合泄爆、抑爆、隔爆等减轻措施。\n【记忆钩子】防爆两抓手：管住火源加管住浓度，再用检测报警与泄爆抑爆兜底。","k":"点火源控制与防爆"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"multi","q":"危险化学品的储存、使用管理，下列做法正确的有（　）。","o":["按危险特性分类、分区、分库储存，禁忌物料隔离存放","储存场所设置相应的通风、防火、防爆、防泄漏与应急处置设施","容器张贴规范的安全标签，随货提供安全技术说明书","建立出入库登记与领用台账，剧毒、易制爆等按规定实行专门管理","为取用方便，把氧化剂与易燃还原剂混放在同一货架上"],"a":[0,1,2,3],"e":"危化品管理要点：分类分区分库、禁忌物隔离存放、专用库房及相应安全与应急设施、一书一签、出入库与领用台账、剧毒与易制爆等按规实行专门管理、泄漏应急与废弃处置规范。A、B、C、D均正确。E把氧化剂与易燃还原剂混放，二者接触极易引发燃烧甚至爆炸，是典型的禁忌物料混存，必须严格禁止。\n【易错点】分类分区、禁忌隔离是危化品储存第一原则，混放等于埋雷。","k":"危险化学品储存管理"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"multi","q":"职业性有害因素按其来源通常可分为（　）。","o":["生产过程中的有害因素，如化学毒物、粉尘、噪声、振动、异常气象条件与生物因素","劳动过程中的有害因素，如劳动组织不合理、精神紧张、劳动强度过大、长时间不良体位","生产环境中的有害因素，如厂房布局不合理、采光照明不良、通风不足、露天作业气象条件","与职业活动无关的遗传性疾病与个人生活习惯","仅指能够引起急性中毒的化学毒物"],"a":[0,1,2],"e":"职业性有害因素按来源分三类：一是生产过程产生的（化学因素如粉尘与毒物、物理因素如噪声振动高温辐射、生物因素如致病微生物）；二是劳动过程产生的（劳动组织与作息制度不合理、精神性职业紧张、劳动强度过大、长时间不良体位或工具不合适等）；三是生产环境产生的（厂房设计或布局不合理、采光照明不良、通风不足、作业场所狭窄、露天作业受自然气象条件影响等）。D与职业活动无关，E把范围窄化为急性中毒的化学毒物，均不成立。\n【记忆钩子】三类来源一句话：生产过程、劳动过程、生产环境。","k":"职业性有害因素分类"},{"s":"zhuanan","p":"防火防爆与职业健康","c":10,"cn":"防火防爆、危险化学品与职业健康安全","t":"multi","q":"关于职业健康监护与职业病预防，下列说法正确的有（　）。","o":["上岗前职业健康检查可发现职业禁忌证，避免易感者从事相应作业","在岗期间定期健康检查有助于早期发现职业健康损害或疑似职业病","离岗时健康检查可明确劳动者离岗时的健康状况、分清相关责任","职业病预防应遵循三级预防，其中第一级预防即源头控制、消除或降低危害最为根本","职业健康监护档案应对劳动者本人保密，不得向其提供"],"a":[0,1,2,3],"e":"职业健康监护包括上岗前、在岗期间、离岗时以及应急健康检查，分别用于发现职业禁忌证、早期发现健康损害与疑似职业病、界定离岗时的健康状态，并须建立、妥善保存职业健康监护档案，劳动者有权查阅、复印本人档案，用人单位应如实、无偿提供。职业病三级预防中，一级预防（病因预防，改革工艺、源头治理）最根本，二级预防（早发现、早诊断、早治疗，含健康监护）、三级预防（对已患病者治疗康复、防止恶化与并发症）依次跟进。E错在对本人保密，劳动者对本人职业健康监护档案享有知情、查阅与复印权。\n【易错点】一级预防最根本、健康监护属二级预防、档案必须对本人公开，三句话别记反。","k":"职业健康监护与三级预防"}],"zj":[{"s":"zj","p":"存货与固定资产","c":1,"cn":"存货与固定资产","t":"single","q":"下列各项中，应计入存货成本的是（　）。","o":["非正常消耗的直接材料","入库前的挑选整理费","入库后的仓储费用","销售存货发生的销售费用"],"a":[1],"e":"存货成本包括采购成本、加工成本和其他成本（入库前必要支出）。非正常消耗、入库后仓储费、销售费用均计入当期损益。","k":"存货成本"},{"s":"zj","p":"存货与固定资产","c":1,"cn":"存货与固定资产","t":"single","q":"企业发出存货计价由先进先出法改为月末一次加权平均法，属于（　）。","o":["会计政策变更","会计估计变更","前期差错更正","资产负债表日后事项"],"a":[0],"e":"发出存货计价方法的变更属于会计政策变更，采用追溯调整法处理（确定不切实可行的除外）。","k":"会计政策变更"},{"s":"zj
