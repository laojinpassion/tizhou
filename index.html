"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"提出“教育即生长、教育即生活、教育即经验的改造”，倡导“从做中学”的教育家是（　）。","o":["杜威","赫尔巴特","夸美纽斯","布鲁纳"],"a":[0],"e":"杜威（美国实用主义）：教育即生长、生活、经验的改造，主张儿童中心、从做中学。赫尔巴特是“传统教育派”代表（教师中心、教材中心、课堂中心）。","k":"教育家思想"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"“因材施教”的教学原则主要依据学生身心发展的（　）。","o":["个别差异性","顺序性","阶段性","互补性"],"a":[0],"e":"个体身心发展规律：顺序性（循序渐进）、阶段性（不同年龄不同任务）、不平衡性（抓关键期）、互补性（长善救失）、个别差异性（因材施教）。","k":"身心发展规律"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"教学过程的中心环节是（　）。","o":["领会知识（感知与理解教材）","巩固知识","运用知识","检查知识"],"a":[0],"e":"教学过程基本环节：激发学习动机→领会知识（中心环节，含感知与理解）→巩固知识→运用知识→检查知识。","k":"教学过程"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"教师用语言系统地向学生传授知识的方法是（　）。","o":["讲授法","实验法","参观法","练习法"],"a":[0],"e":"讲授法是应用最广泛的方法，包括讲述、讲解、讲读、讲演；运用时要启发引导，避免满堂灌。","k":"教学方法"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"德育过程的基本矛盾是社会通过教师向学生提出的道德要求与（　）之间的矛盾。","o":["学生已有品德水平之间的矛盾","教师与学生家长之间的矛盾","学校与社会的矛盾","教材与教法的矛盾"],"a":[0],"e":"德育过程的主要矛盾：教育者提出的德育要求与受教育者已有品德水平之间的矛盾，德育过程即促使该矛盾转化的过程。","k":"德育过程"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"“一把钥匙开一把锁”体现的德育原则是（　）。","o":["因材施教原则","集体教育与个别教育相结合原则","疏导原则","知行统一原则"],"a":[0],"e":"因材施教（长善救失）：根据学生的个性特点与实际状况采取不同的教育方法。疏导原则是循循善诱以理服人，知行统一是言行一致。","k":"德育原则"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"班集体形成的基础和前提是（　）。","o":["明确的共同目标","人数足够多","班主任严厉","教室宽敞"],"a":[0],"e":"班集体形成的基本条件：明确的共同目标（方向与动力）、健全的组织结构、共同的生活准则、平等友好的氛围与心理相容。","k":"班集体建设"},{"s":"jiaozhao","p":"心理学","c":2,"cn":"心理学","t":"single","q":"皮亚杰认知发展理论中，2～7 岁儿童处于（　）。","o":["前运算阶段（思维具有自我中心性）","感知运动阶段","具体运算阶段","形式运算阶段"],"a":[0],"e":"皮亚杰四阶段：感知运动（0-2 岁）、前运算（2-7 岁，自我中心、泛灵论）、具体运算（7-11 岁，守恒）、形式运算（11 岁以上，抽象逻辑）。","k":"认知发展理论"},{"s":"jiaozhao","p":"心理学","c":2,"cn":"心理学","t":"single","q":"学生“举一反三”“触类旁通”的现象属于学习的（　）。","o":["迁移","遗忘","消退","强化"],"a":[0],"e":"学习迁移：一种学习对另一种学习的影响。正迁移促进、负迁移干扰；顺向与逆向、水平与垂直迁移等分类。","k":"学习迁移"},{"s":"jiaozhao","p":"心理学","c":2,"cn":"心理学","t":"single","q":"根据耶克斯-多德森定律，学习动机与学习效率的关系是（　）。","o":["倒 U 型曲线关系，中等强度的动机效率最高","动机越强效率越高","动机越弱效率越高","两者无关"],"a":[0],"e":"耶克斯-多德森定律：中等强度动机效率最佳，任务越复杂最佳动机水平越低。教学应将动机调节到适度水平。","k":"学习动机"},{"s":"jiaozhao","p":"心理学","c":2,"cn":"心理学","t":"single","q":"艾宾浩斯遗忘曲线揭示的遗忘规律是（　）。","o":["遗忘进程先快后慢","遗忘进程先慢后快","遗忘与时间无关","遗忘呈线性增长"],"a":[0],"e":"艾宾浩斯遗忘曲线：遗忘在学习之后立即开始，先快后慢，因此复习应及时、分布复习优于集中复习。","k":"遗忘规律"},{"s":"jiaozhao","p":"心理学","c":2,"cn":"心理学","t":"single","q":"教师以积极的方式看待自己与工作、能承受挫折，属于教师职业心理素质中的（　）。","o":["良好的职业心态与自我调适能力","超高的智商","完美的外表","万能的教学技巧"],"a":[0],"e":"教师职业心理素质包括认知能力、人格特征（热情耐心、责任心强）与心理健康水平（情绪稳定、自我调适、抗压能力）。","k":"教师心理素质"},{"s":"jiaozhao","p":"心理学","c":2,"cn":"心理学","t":"single","q":"“罗森塔尔效应”（教师期望效应）说明（　）。","o":["教师的期望会显著影响学生的行为与发展","学生的成绩与教师无关","智商决定一切","期望只对教师有效"],"a":[0],"e":"罗森塔尔效应（皮格马利翁效应）：教师积极的期望通过态度、方法传递给学生，促进其发展——教师应给予学生积极期望。","k":"教师期望效应"},{"s":"jiaozhao","p":"法律法规","c":3,"cn":"法律法规","t":"single","q":"《中小学教育惩戒规则（试行）》规定，教育惩戒分为（　）。","o":["一般教育惩戒、较重教育惩戒、严重教育惩戒三类","罚款、罚站、开除三类","口头警告、书面警告、辞退三类","无分类规定"],"a":[0],"e":"教育惩戒三类：一般（点名批评、口头书面检讨等）、较重（德育工作负责人训导、校内公益服务等）、严重（不超过一周停课停学、法治副校长训诫等）。禁止七类不当行为（击打、罚抄超量、辱骂等）。","k":"教育惩戒规则"},{"s":"jiaozhao","p":"法律法规","c":3,"cn":"法律法规","t":"single","q":"《新时代中小学教师职业行为十项准则》明确禁止教师的行为不包括（　）。","o":["关心爱护学生","组织、参与有偿补课","索要、收受学生及家长财物","歧视、侮辱学生"],"a":[0],"e":"十项准则：坚定政治方向、自觉爱国守法、传播优秀文化、潜心教书育人、关心爱护学生、加强安全防范、坚持言行雅正、秉持公平诚信、坚守廉洁自律、规范从教行为。关爱学生是准则要求而非禁止行为。","k":"教师职业行为准则"},{"s":"jiaozhao","p":"法律法规","c":3,"cn":"法律法规","t":"single","q":"《中小学教育惩戒规则》规定，教师可以实施一般教育惩戒的情形是（　）。","o":["学生故意不完成教学任务要求或者不服从教育、管理","学生成绩全年级倒数","学生家境贫寒","学生提出合理质疑"],"a":[0],"e":"一般教育惩戒适用于违规违纪情节较为轻微的学生：点名批评、责令赔礼道歉做口头书面检讨、增加额外教学或班级公益服务任务、一节课堂教学时间内的教室内站立等。","k":"教育惩戒适用"},{"s":"jiaozhao","p":"法律法规","c":3,"cn":"法律法规","t":"single","q":"根据《未成年人学校保护规定》，教职工不得对未成年人实施体罚、变相体罚或者其他侮辱人格尊严的行为。下列属于变相体罚的是（　）。","o":["罚抄课文超过合理限量的遍数","当堂订正一道错题","组织课堂讨论","课后辅导答疑"],"a":[0],"e":"变相体罚：以超量罚抄、反复蹲站等间接方式造成学生身心痛苦的惩戒。订正错题、讨论、辅导属于正常教学活动。","k":"变相体罚"},{"s":"jiaozhao","p":"教法技能","c":4,"cn":"教法技能","t":"single","q":"课堂上学生突然提出教师答不上来的问题，恰当的处理是（　）。","o":["坦诚说明并引导课后共同探究，保护学生的求知欲","训斥学生捣乱","装作没听见","随意编造答案蒙混"],"a":[0],"e":"课堂应变：坦诚＋引导。“知之为知之”，保护学生求知欲、课后共同探究既维护学生尊严又体现教师专业态度。","k":"课堂应变"},{"s":"jiaozhao","p":"教法技能","c":4,"cn":"教法技能","t":"single","q":"板书设计的基本要求不包括（　）。","o":["内容越多越好，越密越好","条理清晰、突出重点","书写规范、布局合理","图文并茂、启发性强"],"a":[0],"e":"板书要求：提纲挈领、条理清晰、重点突出、书写规范、布局美观。板书过密反而降低教学效果。","k":"板书设计"},{"s":"jiaozhao","p":"教法技能","c":4,"cn":"教法技能","t":"single","q":"教师进行教学反思的最佳时机与方式是（　）。","o":["课后及时反思并形成书面记录，贯穿教学全过程","等到学期末一次性回忆","从不反思","只反思失败的课"],"a":[0],"e":"教学反思贯穿教学全过程：课前反思（预设）、课中反思（调控）、课后反思（总结），写教后记是教师专业成长最有效的途径之一。","k":"教学反思"},{"s":"jiaozhao","p":"教法技能","c":4,"cn":"教法技能","t":"single","q":"对学生的评价应坚持（　）。","o":["发展性评价，评价内容与方式多元化","以一次考试定终身","只评价学习不评价品行","只表扬不指出问题"],"a":[0],"e":"发展性评价：目标多元、方式多样（形成性＋终结性）、注重过程，发挥评价的诊断、激励与发展功能。","k":"教学评价"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"multi","q":"我国基础教育课程改革倡导的课程评价理念包括（　）。","o":["发挥评价的促进学生发展的功能","评价主体多元化（教师、学生、家长参与）","评价方式多样化（过程性评价与终结性评价结合）","只以升学率评价学校和教师","仅关注结果不关注过程"],"a":[0,1,2],"e":"新课程评价观：立足过程、促进发展；评价主体多元、方式多样、内容全面。以升学率为唯一标准与只看结果都是错误的评价导向。","k":"课程评价改革"},{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"multi","q":"教学原则包括（　）。","o":["直观性原则","启发性原则","循序渐进原则","巩固性原则","理论脱离实际原则"],"a":[0,1,2,3],"e":"我国中小学常用教学原则：直观性、启发性、循序渐进、巩固性、量力性、思想性与科学性相统一、理论联系实际、因材施教等。“理论脱离实际”是反例。","k":"教学原则"},{"s":"jiaozhao","p":"心理学","c":2,"cn":"心理学","t":"multi","q":"埃里克森人格发展理论中，中小学阶段学生面临的发展危机包括（　）。","o":["勤奋对自卑（小学阶段）","自我同一性对角色混乱（中学阶段）","信任对不信任（婴儿期）","亲密对孤独（成年早期）"],"a":[0,1],"e":"埃里克森八阶段：小学阶段（6-12 岁）勤奋对自卑；中学阶段（12-18 岁）自我同一性对角色混乱。教师应帮助学生获得勤奋感、建立同一性。","k":"人格发展阶段"},{"s":"jiaozhao","p":"法律法规","c":3,"cn":"法律法规","t":"multi","q":"《教育法》规定的学生享有的权利包括（　）。","o":["参加教育教学计划安排的各种活动","使用教育教学设施、设备、图书资料","在学业成绩和品行上获得公正评价","对学校给予的处分不服向有关部门提出申诉","随意旷课和逃学的自由"],"a":[0,1,2,3],"e":"学生五项权利：参加活动权、使用设施权、公正评价权、申诉权、法律法规规定的其他权利。同时学生也应履行遵守规范、努力学习的义务。","k":"学生的权利"},{"s":"jiaozhao","p":"教法技能","c":4,"cn":"教法技能","t":"multi","q":"课堂教学中处理学生突发“插嘴”行为的恰当方式包括（　）。","o":["判断其发言价值，有价值的顺势引导","提醒发言规则，课后单独沟通","当众严厉训斥以儆效尤","假装没有听见完全忽略","罚站一节课"],"a":[0,1],"e":"课堂突发事件处理：保护学生积极性、维护课堂秩序并重。当众训斥与罚站属于不当惩戒，伤害学生自尊。","k":"课堂突发事件"}],"jk1":[{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在没有限速标志、标线的城市道路上（没有中心线），最高时速不得超过（　）。","o":["30公里/小时","40公里/小时","50公里/小时","70公里/小时"],"a":[0],"e":"无限速标志时：没有道路中心线的城市道路最高 30km/h，公路 40km/h；同方向只有一条机动车道的城市道路 50km/h，公路 70km/h。\n【记忆钩子】“城3公4，单车道城5公7”。","k":"限速规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在没有限速标志、标线的公路上（同方向只有一条机动车道），最高时速不得超过（　）。","o":["40公里/小时","50公里/小时","70公里/小时","80公里/小时"],"a":[2],"e":"同方向只有一条机动车道的公路，无限速标志时最高 70km/h；同类条件的城市道路为 50km/h。城市严于公路，因为路口行人非机动车多。","k":"限速规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"在没有中心线的道路上遇到对向来车时，两车应当（　）。","o":["各自靠右行驶并保持横向安全距离","左侧行驶，抢占先机","鸣笛示意对方让行","加速通过，避免会车"],"a":[0],"e":"我国实行右侧通行原则，会车时各自靠右、减速慢行、保持横向间距，必要时停车让行。抢行、逼车都是违法行为。","k":"右侧通行与会车"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车通过没有交通信号灯控制也没有交警指挥的交叉路口时，正确的通行原则是（　）。","o":["转弯的机动车让直行的车辆先行","直行的机动车让转弯的车辆先行","大型车让小型车先行","先到路口的减速慢行，后到的加速通过"],"a":[0],"e":"无信号灯路口规则：①转弯让直行；②相对方向行驶的右转弯让左转弯；③没有方向指示信号灯的路口，转弯让直行。直行优先是路口安全的基本逻辑。","k":"路口让行规则"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车准备进入环形路口（环岛）时，正确的做法是（　）。","o":["让已在路口内的机动车先行","抢先进入，占据内圈","鸣笛催促环岛内车辆让行","直接驶入内圈快速通过"],"a":[0],"e":"准备进入环岛的让已在环岛内的车辆先行——环岛内车辆有优先通行权。进入时开左转向灯（驶入内侧车道），驶出时开右转向灯。","k":"环岛通行规则"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车行经人行横道时，遇行人正在通过人行横道，应当（　）。","o":["停车让行","鸣笛提醒行人快速通过","减速绕行","加速在行人前通过"],"a":[0],"e":"行经人行横道遇行人正在通过，必须停车让行——这是“礼让斑马线”的法律义务，违者记 3 分并罚款。即便无人通过，也应减速慢行。","k":"礼让行人"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇有前方交叉路口交通阻塞时，正确的做法是（　）。","o":["依次停在路口以外等候，不得进入路口","借对向车道绕过阻塞段","在路口内停车等候","鸣喇叭催促前方车辆"],"a":[0],"e":"前方路口阻塞时应当依次停在路口以外等候，即使绿灯也不得进入路口——“绿灯不入堵路口”，进入路口内滞留属于违法（闯堵）。","k":"路口阻塞处置"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在车道减少的路口、路段，遇有前方机动车停车排队等候或者缓慢行驶时，应当（　）。","o":["每车道一辆依次交替驶入车道减少后的路口、路段","加速抢行并入剩余车道","鸣笛要求其他车道车辆让行","压实线强行加塞"],"a":[0],"e":"车道减少的路口路段实行“拉链式交替通行”：两边车道各一辆、依次交替合并。抢行加塞既危险也违法。","k":"交替通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在道路上发生故障，妨碍交通又难以移动时，正确的做法是（　）。","o":["开启危险报警闪光灯，并在来车方向设置警告标志","开启近光灯，在车后设置警告标志","开启远光灯，车内等候救援","开启示廓灯，在车前设置警告标志"],"a":[0],"e":"故障车妨碍交通又难以移动：开危险报警闪光灯（双闪）＋夜间同时开示廓灯和后位灯＋在来车方向（车后）设警告标志，必要时迅速报警。\n【方向陷阱】警告标志一定设在“来车方向”（车后），不是车前。","k":"故障车处置"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车上道路行驶，下列做法正确的是（　）。","o":["悬挂机动车号牌并随车携带行驶证、驾驶证","号牌可以适当遮挡边角避免曝光","行驶证放在家里，需要时再取","使用其他车辆的机动车号牌"],"a":[0],"e":"上道路行驶的机动车必须悬挂号牌（清晰完整、不得遮挡污损）、放置检验合格标志和保险标志，并随车携带行驶证、驾驶证。遮挡号牌、使用他人号牌都是严重违法。","k":"上路基本条件"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车行经漫水路或者漫水桥时，正确的做法是（　）。","o":["停车察明水情，确认安全后低速通过","加速冲过漫水路段","紧跟前车尾部通过","鸣笛后直接通过"],"a":[0],"e":"行经漫水路（桥）必须停车察明水情：水深、流速、水下路况不明时不得冒险通过，确认安全后低挡低速匀速通过，途中不得停车换挡。","k":"漫水路通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车通过铁路道口时，正确的做法是（　）。","o":["一停二看三通过，服从道口管理人员指挥","加速通过，避免在道口停车","跟紧前车一次性连续通过","道口栏杆刚抬起就抢先加速"],"a":[0],"e":"通过铁路道口：红灯亮或栏杆放下时停在停止线外；无信号时“一停（停在道口外）二看（观察左右有无来车）三通过”，确认安全后一次连续通过，不得在道口内变速、停车。","k":"铁路道口"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在道路上临时停车，下列地点中可以停车的是（　）。","o":["施划有停车泊位的路段","交叉路口 50 米以内的路段","公交车站 30 米以内的路段","急弯路 50 米以内的路段"],"a":[0],"e":"交叉路口、铁路道口、急弯路、窄路、桥梁、陡坡、隧道 50 米以内，以及公交站、加油站、消防栓 30 米以内不得停车。只有施划泊位或允许临时停车的路段可以停。\n【口诀】“口五站三”不能停。","k":"临时停车规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在没有交通信号的道路上行驶，应当在确保安全、畅通的原则下（　）。","o":["通行","鸣笛快速通过","靠左侧行驶","停车观察交警指挥"],"a":[0],"e":"没有交通信号的道路上，在确保安全、畅通的原则下通行。这是道路交通安全法的兜底原则——安全永远是第一位的。","k":"安全通行原则"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"道路交通信号包括交通信号灯、交通标志、交通标线和（　）。","o":["交通警察的指挥","导航软件的提示","其他车辆的鸣笛","乘车人的提醒"],"a":[0],"e":"道路交通信号四大类：信号灯、标志、标线、交警指挥。当信号灯与交警指挥不一致时，服从交警指挥。\n【优先级】交警＞信号灯＞标志标线。","k":"交通信号"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"交通信号灯红灯亮时，表示（　）。","o":["禁止通行","警示慢行","准许通行","仅限右转车辆通行"],"a":[0],"e":"红灯禁止通行、绿灯准许通行、黄灯警示（已越过停止线的可继续通行，未越线的应停在停止线内等候）。右转车辆在不妨碍被放行车辆行人通行的情况下可以通行，但不是“仅限右转”。","k":"信号灯含义"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇前方车辆停车排队等候或缓慢行驶时，正确的做法是（　）。","o":["依次排队行驶，不得借道超车、占用对面车道","借非机动车道超越排队车辆","穿插到排队车辆前方","鸣笛催促前车加速"],"a":[0],"e":"排队缓行时依次行驶，不得借道超车、占用对面车道、穿插等候车辆。加塞、借道超车既造成拥堵也是违法行为。","k":"排队通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车变更车道时，正确的做法是（　）。","o":["提前开启转向灯，观察后方来车情况后再变更","变更车道无须开启转向灯","同时跨越两条以上车道一次变更到位","转向灯开启的同时立即转向"],"a":[0],"e":"变更车道：提前开转向灯→观察后视镜与盲区→在不影响其他车辆正常行驶的前提下再变更，且一次只能变更到相邻车道，不得连续跨越多条车道。","k":"变更车道"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车通过有交通信号灯控制的交叉路口，向右转弯遇有同车道前车正在等候放行信号时，应当（　）。","o":["依次停车等候","借用非机动车道右转","鸣笛示意前车让行后右转","从前车左侧绕行后右转"],"a":[0],"e":"右转弯遇前车等候放行信号时，应依次停车等候，不得借用非机动车道绕行（除非有专门的右转渠化导向车道）。借道绕行极易与放行的直行非机动车发生冲突。","k":"路口右转"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在夜间没有路灯、照明不良的道路上行驶时，应当开启（　）。","o":["前照灯、示廓灯和后位灯","只有近光灯","危险报警闪光灯","只有远光灯"],"a":[0],"e":"夜间无路灯或照明不良时，开前照灯（远光）、示廓灯和后位灯；但同方向行驶的后车与前车近距离行驶时不得使用远光灯。会车时距对向来车 150 米内改用近光。","k":"灯光使用"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在夜间道路上发生故障或事故，妨碍交通又难以移动的，除开双闪外还应当开启（　）。","o":["示廓灯和后位灯","远光灯","前雾灯","转向灯"],"a":[0],"e":"夜间故障车难以移动：开危险报警闪光灯＋示廓灯＋后位灯，并设警告标志。这是“夜间三灯齐开”的固定考点。","k":"夜间故障车灯光"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车上坡行驶，即将到达坡顶时，正确的做法是（　）。","o":["减速慢行，鸣喇叭示意对向车辆（无禁鸣标志时）","加速冲上坡顶","保持原速靠左行驶","坡顶前变换远光灯照射对向"],"a":[0],"e":"接近坡顶视线盲区大（看不到对向来车与行人），应减速慢行、靠右行驶，必要时鸣喇叭（禁鸣区除外）或交替使用远近灯光提示。加速冲坡顶是最危险的做法。","k":"坡道通行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车掉头时，下列地点中允许掉头的是（　）。","o":["没有禁止掉头标志、标线的路段，且不影响其他车辆和行人正常通行","铁路道口","人行横道上","隧道内"],"a":[0],"e":"铁路道口、人行横道、桥梁、急弯、陡坡、隧道，以及有禁止掉头标志标线的地点严禁掉头；没有禁止标志的路段在不妨碍交通时可以掉头。\n【口诀】“口人道桥弯隧坡，禁止掉头莫碰错”。","k":"掉头规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车倒车时，正确的做法是（　）。","o":["查明车后情况，确认安全后倒车","在铁路道口倒车调头","在高速公路上倒车返回出口","只依赖倒车影像，无须回头观察"],"a":[0],"e":"倒车前必须查明车后情况、确认安全。铁路道口、交叉路口、单行路、桥梁、急弯、陡坡、隧道内严禁倒车；高速公路上倒车记 12 分并属严重违法。\n【提示】倒车影像是辅助，不能替代观察。","k":"倒车规定"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车遇有前方车辆停车排队等候时，从其左侧变更车道超越排队车辆的行为属于（　）。","o":["违法的穿插超越行为","合法的超车行为","合法的借道行驶","合理的提速行为"],"a":[0],"e":"前方排队或缓行时借道超车、占用对面车道、穿插等候车辆，均属违法。排队通行考验的恰恰是驾驶人的守法意识。","k":"禁止穿插"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇到执行紧急任务的警车、消防车、救护车、工程救险车时，应当（　）。","o":["按规定让行","加速与其抢行","紧随其后借道行驶","鸣笛要求其避让"],"a":[0],"e":"遇执行紧急任务的特种车辆必须让行，不得穿插、超越。不让行特种车辆会被处罚；因此让行产生的压线等行为经核实后不予处罚。","k":"特种车辆让行"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车在雨天遇到撑雨伞和穿雨衣的行人在路边行走时，正确的做法是（　）。","o":["提前减速，注意观察，留出安全横向距离","加速绕过行人","持续鸣喇叭提醒","紧贴行人一侧缓慢通过"],"a":[0],"e":"雨伞、雨衣会遮挡行人和骑车人的视线与听觉，且路面湿滑，应提前减速、加大横向安全距离、随时准备停车，切忌加速绕行或鸣笛催促。","k":"雨天礼让行人"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"行车中遇到儿童在道路上嬉戏打闹时，正确的做法是（　）。","o":["降低车速，随时准备停车避让","保持原速快速通过","鸣喇叭驱赶儿童离开","加速从儿童身后绕行"],"a":[0],"e":"儿童行为缺乏预见性、可能突然横穿，遇到时应主动降低车速、必要时停车避让。鸣笛驱赶可能惊吓儿童导致意外。","k":"特殊人群避让"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"驾驶机动车遇到盲人在道路上通行时，正确的做法是（　）。","o":["减速或停车避让，不得持续鸣喇叭","鸣喇叭提醒其让路","快速从其身边通过","紧跟其后缓慢行驶"],"a":[0],"e":"盲人听觉灵敏但行动缓慢且方向感不稳定，持续鸣喇叭会使其惊慌失措。应当减速停车避让，确保其安全通过后再行驶。","k":"避让盲人"},{"s":"jk1","p":"道路交通安全法规","c":1,"cn":"道路通行原则","t":"single","q":"机动车在道路上行驶，下列做法中违法的是（　）。","o":["在限速 60km/h 的路段以 55km/h 行驶","在禁止鸣喇叭路段鸣喇叭","按导向车道指示方向行驶","在潮汐车道按指示方向通行"],"a":[1],"e":"禁止鸣喇叭路段（如医院、学校、居民区周边）鸣喇叭属于违法行为。A 是遵章行驶，C、D 是按标志标线通行的正确做法。","k":"禁鸣规定"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"警告标志的作用是（　）。","o":["警告车辆、行人注意危险地点","禁止或限制车辆行人交通行为","指示车辆行人行进","传递道路方向、地点、距离信息"],"a":[0],"e":"警告标志＝黄底黑边黑图案、顶角朝上的等边三角形，提醒注意前方危险。禁令标志（白底红圈红杠）禁止限制，指示标志（蓝底白图案）指示行进，指路标志（蓝底/绿底白字）传递方向地点距离信息。","k":"警告标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"禁令标志的颜色特征是（　）。","o":["白底、红圈、红杠、黑图案","黄底、黑边、黑图案","蓝底、白图案","绿底、白图案"],"a":[0],"e":"禁令标志：白底红圈红杠黑图案，形状多为圆形，表示禁止或限制（如禁止驶入、限速、禁止停车）。\n【颜色口诀】“黄三角是警告，红圈是禁止，蓝色指示，绿色指路（高速）”。","k":"禁令标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"圆形、蓝底、白图案的交通标志属于（　）。","o":["指示标志","警告标志","禁令标志","辅助标志"],"a":[0],"e":"指示标志：圆形或矩形、蓝底白图案，指示车辆行人按规定方向地点行进（如直行、右转、环岛行驶）。","k":"指示标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"高速公路上传递道路方向、地点、距离信息的标志（指路标志）通常为（　）。","o":["绿底白字","蓝底白字","白底黑字","黄底黑字"],"a":[0],"e":"指路标志：一般道路为蓝底白字，高速公路为绿底白字。看到绿色门架式标志就是高速出口、方向信息。","k":"指路标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车看到前方有“注意儿童”警告标志时，应当（　）。","o":["减速慢行，注意观察儿童活动动态","加速通过该路段","持续鸣喇叭驱散儿童","变更到最左侧车道快速通过"],"a":[0],"e":"注意儿童标志多设于学校、幼儿园、少年宫等路段，提示驾驶人减速慢行、随时准备停车避让突然出现的儿童。","k":"注意儿童标志"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车遇前方有“施工”警告标志时，正确的做法是（　）。","o":["减速慢行，按施工导改标志和现场指挥有序通过","加速通过施工路段减少影响","从对向车道逆行绕过施工区","原地掉头绕行其他城市道路"],"a":[0],"e":"施工路段路况变化大（车道收窄、地面不平、人员机械作业），应提前减速、按导向标志和临时信号灯或现场指挥通行。","k":"施工路段通行"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"限速标志标明的最高时速，与前车保持的安全距离发生冲突时的正确理解是（　）。","o":["既不超限速，也要根据车速和天气路况保持足够安全距离","只要不超速就无须保持车距","保持车距重要，可以适当超速","跟紧前车防止被加塞"],"a":[0],"e":"限速和安全距离是两条并行的要求：限速是“最高值”，安全距离按“车速越快距离越大、雨雪雾加倍”执行，二者都要满足。","k":"限速与安全距离"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车看到“禁止通行”标志时，表示该标志禁止（　）。","o":["一切车辆和行人通行","仅禁止机动车通行","仅禁止行人通行","仅禁止非机动车通行"],"a":[0],"e":"“禁止通行”是白底红圈的空心圆（红圈中无横杠），禁止一切车辆和行人通行；“禁止驶入”是红底白横杠，禁止机动车驶入但行人可通行——两个标志是高频混淆点。","k":"禁止通行与禁止驶入"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"路口导向车道内的白色导向箭头的作用是（　）。","o":["指示车辆按箭头方向行驶","禁止车辆变更车道","表示该车道限时通行","警告前方有危险"],"a":[0],"e":"导向车道线内的导向箭头规定该车道的行驶方向，进入导向车道后不得变更车道，须按箭头指示方向通行（可变导向车道按 LED 指示）。","k":"导向车道线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"道路中心的黄色虚线表示（　）。","o":["允许越线超车或向左转弯（在对向无来车且安全时）","严格禁止越线","仅限公交车越线","表示车道分界"],"a":[0],"e":"中心黄色虚线：在对向无来车、保证安全的前提下可以越线超车或转弯；中心黄色实线严禁越线；黄色虚实线：实线一侧禁止越线，虚线一侧允许。","k":"中心黄色标线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"车行道边缘的白色实线的作用是（　）。","o":["指示机动车道的边缘，禁止车辆跨越","指示行人过街位置","表示临时停车区域","警告前方施工"],"a":[0],"e":"车行道边缘白色实线用于指示机动车道边缘，车辆不得跨压；虚线处在保证安全时允许临时跨越（如驶入路侧出入口）。","k":"车行道边缘线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"人行横道线（白色平行粗实线，俗称斑马线）表示（　）。","o":["准许行人横穿车行道的标线","机动车临时停放标线","非机动车通行标线","公交专用道标线"],"a":[0],"e":"人行横道线是行人过街的法定通道，车辆行经时必须减速，遇行人通过必须停车让行。","k":"人行横道线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"路面上施划的黄色网格线区域表示（　）。","o":["禁止停车区域（含排队等候时也不得进入）","允许临时停车区域","公交专用道","人行横道预告"],"a":[0],"e":"黄色网格线设于禁止停车的路段（常见于单位门口、路口），车辆不得在该区域停车，排队等候时也不得占用网格线区域停车。","k":"黄色网格线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"高速公路车行道分界线为白色虚线时，表示（　）。","o":["在保证安全的情况下可以越线变更车道","严格禁止越线变道","仅限货车越线","表示紧急停车带"],"a":[0],"e":"白色虚线＝同向车道分界，安全时可以变道；白色实线（如隧道、桥梁、出入口附近）禁止变道。高速公路最右侧另有应急车道（带“紧急停车带”标志），非紧急情况不得占用。","k":"高速公路标线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"减速标线（路面上的白色横向或菱形图案）的作用是（　）。","o":["提示驾驶人减速慢行","指示变道方向","表示允许停车","分隔对向车流"],"a":[0],"e":"减速标线多设于收费站广场、出口匝道、事故多发路段，提示驾驶人提前减速，常与“减速慢行”标志配合出现。","k":"减速标线"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在路口遇到黄灯持续闪烁时，表示（　）。","o":["警示注意，确认安全后通过","禁止通行","加速抢行","停车等待绿灯"],"a":[0],"e":"黄灯持续闪烁（闪光警告信号灯）多用于夜间或危险路段路口：提示减速慢行、注意瞭望，确认安全后通过。这与“黄灯亮时已越线可通行、未越线应停”的普通黄灯不同。","k":"黄灯闪烁"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在路口遇红灯亮时，正确的做法是（　）。","o":["依次停在停止线以外等待放行","已越过停止线的继续通行，未越线的停车等候","右转车辆一律停车","借对向车道绕行"],"a":[1],"e":"红灯亮时：未越过停止线的应停在停止线以外等候；已经越过停止线的可以继续通行。右转车在无专门右转红灯且不妨碍被放行车辆行人时可右转。","k":"红灯通行规则"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在有方向指示信号灯的路口，准备左转弯时，应当（　）。","o":["待左转弯信号灯（或左转箭头灯）变绿后再左转","红灯时提前借对向车道左转","绿灯直行车道直接左转","随意在路口内待转"],"a":[0],"e":"有方向指示信号灯（箭头灯）的路口，必须按箭头指示通行：左转箭头绿灯亮才可左转。有的路口设“左转待转区”，直行绿灯亮时可先驶入待转区等候。","k":"方向指示信号灯"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交警指挥","t":"single","q":"交通警察发出减速慢行手势信号时，右手（或左手）单侧摆动，掌心朝下，表示（　）。","o":["提示车辆减速缓慢行驶","准许左方直行车辆通行","示意车辆靠边停车","准许右方车辆右转弯"],"a":[0],"e":"交警减速慢行手势：单臂向下压摆、掌心朝下。配合记忆：掌心朝前手臂平伸＝停止；手臂平伸侧摆＝直行；左转弯待转＝左臂向左下方摆动。看不懂手势时以“安全减速”为第一反应。","k":"交警手势"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交警指挥","t":"single","q":"当交通信号灯与交通警察的现场指挥不一致时，车辆应当（　）。","o":["服从交通警察的指挥","按信号灯通行","自行选择通行方式","停车等待信号灯变绿"],"a":[0],"e":"信号灯与交警指挥不一致时，服从交警指挥——现场处置（如疏导、管制）优先于固定信号设施。","k":"信号优先级"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通信号灯","t":"single","q":"驾驶机动车在高速公路上遇到能见度较低的雾天时，应开启的灯光是（　）。","o":["雾灯、近光灯、示廓灯和前后位灯","只开远光灯","只开双闪灯，关闭其他灯","不开灯以免反光"],"a":[0],"e":"雾天在高速公路行驶：开雾灯、近光灯、示廓灯、前后位灯，能见度低于 100 米时还应开危险报警闪光灯（双闪），切勿开远光灯（光线被雾气漫反射，反而看不清）。","k":"雾天灯光"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"驾车看到“傍山险路”警告标志时，正确的做法是（　）。","o":["减速慢行，注意观察山体落石和会车","加速靠山体一侧抢行","持续鸣喇叭占道行驶","紧靠道路边缘行驶不观察"],"a":[0],"e":"傍山险路标志提示临崖、落石、连续急弯风险，应减速、鸣号（无禁鸣时）、注意观察、尽量靠内侧（靠山体一侧）谨慎会车。","k":"傍山险路"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"看到“前方学校（注意儿童）”标志到学校路段时，除减速慢行外还应（　）。","o":["注意观察学生动态，随时准备停车","变道至最左侧车道行驶","鸣喇叭提示学生让路","跟紧前车快速通过"],"a":[0],"e":"学校路段学生集中、行为突发，除限速减速外，要重点观察路边和路口的学生动态，随时准备停车避让。","k":"学校路段"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标线","t":"single","q":"路口内施划的白色“左转弯待转区”虚线框表示（　）。","o":["同向直行绿灯亮时，左转弯车辆可进入待转区等候","任何时候左转车都可进入停车","禁止左转车辆进入的区域","右转车待转区"],"a":[0],"e":"左转弯待转区：同向直行信号绿灯亮时，左转车辆应先进入待转区等候，待左转灯（或满屏灯）放行后完成左转——提高路口通行效率。","k":"左转弯待转区"},{"s":"jk1","p":"交通信号与标志标线","c":2,"cn":"交通标志","t":"single","q":"“潮汐车道”标志表示该车道（　）。","o":["根据早晚交通流量方向，可随指示灯变化调整行车方向","只允许潮汐式涨落时段通行","固定为单行道","仅限大型车辆通行"],"a":[0],"e":"潮汐车道（可变方向车道）通过车道上方的可变指示灯调整行车方向（早高峰进城、晚高峰出城），必须按当时的指示方向通行，切勿按习惯方向闯入。","k":"潮汐车道"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"安全跟车与车距","t":"single","q":"驾驶机动车在高速公路上以 100km/h 行驶时，与同车道前车的最小安全距离一般应保持（　）。","o":["100米以上","50米以上","30米以上","10米以上"],"a":[0],"e":"高速公路安全距离口诀：车速超过 100km/h，距离 100 米以上；低于 100km/h，可适当缩短但不小于 50 米。雨雾冰雪天气距离要加倍。\n【记忆钩子】“百码百米，五十码底”。","k":"高速公路安全车距"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"安全跟车与车距","t":"single","q":"驾驶机动车跟车行驶时，跟车距离过近的主要危害是（　）。","o":["前车紧急制动时极易发生追尾事故","油耗会增加很多","会遮挡前车视线以外的危险","导致发动机过热"],"a":[0],"e":"跟车过近意味着制动距离被压缩，前车急刹时必然追尾。跟车要遵循“2 秒法则”：以前车经过某参照物为起点，自己至少 2 秒后到达同一位置。","k":"跟车距离"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"安全跟车与车距","t":"single","q":"夜间行车遇到对向车辆持续使用远光灯、视线严重受影响时，正确的做法是（　）。","o":["减速慢行，必要时靠边停车让行","立即开启远光灯对射互晃","加速超过该车辆摆脱眩光","闭眼缓行通过眩光区"],"a":[0],"e":"遭遇远光眩目：先减速稳住方向，视线右移借用路缘参照，必要时靠边停车让行，切勿对射远光或凭感觉加速——眩光下 2 秒盲开等于闭眼行驶数十米。","k":"远光眩目处置"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"驾驶机动车超车时，正确的操作顺序是（　）。","o":["开启左转向灯，鸣喇叭（禁鸣区除外），从前车左侧超越","直接从前车右侧加速超越","与前车保持并行后寻找机会挤入","先减速靠边，从前车右侧低速超越"],"a":[0],"e":"超车规定：从左侧超越，提前开左转向灯、鸣喇叭（禁鸣区除外）确认安全后超车；超越后驶回原车道前须开启右转向灯并与被超车辆拉开必要距离。\n【铁律】超车一律从左侧，右侧超车违法。","k":"超车规定"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"下列路段中，允许超车的是（　）。","o":["视野开阔、无禁止超车标线的平直路段","铁路道口","隧道内","人行横道前"],"a":[0],"e":"铁路道口、交叉路口、窄桥、弯道、陡坡、隧道、人行横道等路段不得超车。超车前要确认前方路况开阔、对向无来车。","k":"禁止超车路段"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"驾驶机动车会车时，遇对向来车占用自己的行车道，正确的做法是（　）。","o":["减速或停车，让对方车辆先行通过","立即开启右转向灯强行抢行","持续鸣喇叭迫使对方让行","加速逼回对方车辆"],"a":[0],"e":"对方占道时“让速不让道”更安全：先减速，必要时停车，避免在恐慌中变道撞及其他目标。抢行、逼车、斗气是事故的最大诱因。","k":"会车处置"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"超车与会车","t":"single","q":"夜间会车时，对向来车距离自己 150 米以内，应当（　）。","o":["改用近光灯","继续使用远光灯","开启危险报警闪光灯","关闭所有灯光"],"a":[0],"e":"夜间会车应在距对向来车 150 米内改用近光灯；窄路窄桥与非机动车会车时也应使用近光灯，避免眩目引发事故。","k":"夜间会车灯光"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"起步与观察","t":"single","q":"机动车在道路边临时停车起步驶入行车道前，应当（　）。","o":["先开启左转向灯，观察后方来车，确认安全后再驶入","直接快速驶入行车道","开右转向灯驶入行车道","鸣笛示意后方车辆避让后驶入"],"a":[0],"e":"从路侧起步汇入车流：开左转向灯→观察后视镜和盲区→确认安全后平顺驶入。直接快速汇入或鸣笛要求他人避让都是危险且违法的。","k":"起步汇入车流"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"起步与观察","t":"single","q":"行车前绕车一周检查的目的不包括（　）。","o":["检查车内音响系统是否正常","观察车辆周围有无行人、障碍物","检查轮胎气压和外观状态","确认车辆下方有无儿童或小动物"],"a":[0],"e":"绕车一周的目的：观察车周环境（行人、障碍物、儿童）、车况（轮胎、灯光、车牌）。音响属于车内设备，与绕车检查无关。\n【考点】上车前绕车是科目三的法定动作，也是防“鬼探头”式碾压事故的关键。","k":"绕车检查"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"起步与观察","t":"single","q":"驾驶机动车起步前，驾驶人应当（　）。","o":["调整好座椅、系好安全带，观察后视镜并确认安全","先鸣喇叭再起步","迅速起步抢占车道","仅通过倒车影像观察周围"],"a":[0],"e":"起步标准动作：调座椅→系安全带→调整后视镜→打左转向灯→观察后视镜与盲区→确认安全后平顺起步。","k":"起步规范"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"驾驶机动车时接拨打手持电话的危害，说法正确的是（　）。","o":["分散注意力，单手操纵，反应明显变慢，极易引发事故","只是小动作，不影响驾驶","仅在高速行驶时有危害","使用免提通话同样严重违法且危害相同"],"a":[0],"e":"驾驶时接打手持电话违法（记 3 分并罚款），主要危害是注意力分散和单手操控。使用蓝牙耳机等免提方式虽能双手握盘，但通话仍会分散注意力，驾驶中应尽量少通话。","k":"分心驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"下列行为中，属于危险驾驶犯罪行为的是（　）。","o":["醉酒驾驶机动车在道路上行驶","驾驶时打电话","未系安全带驾驶","驾驶时向车外抛物"],"a":[0],"e":"醉酒驾驶（血液酒精含量≥80mg/100ml）构成危险驾驶罪，依法追究刑事责任并吊销驾驶证、5 年内不得重新申领。其余选项属交通违法，但未达刑事犯罪程度。","k":"醉酒驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"车辆驾驶人员血液中酒精含量大于或等于（　）时，构成醉酒驾驶。","o":["80mg/100ml","20mg/100ml","50mg/100ml","100mg/100ml"],"a":[0],"e":"标准分界：≥20mg/100ml 且＜80mg/100ml 为饮酒驾驶（违法）；≥80mg/100ml 为醉酒驾驶（犯罪）。\n【口诀】“20 违法，80 犯罪”。","k":"酒精含量标准"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"疲劳驾驶（连续驾驶机动车超过 4 小时未停车休息或停车休息时间少于 20 分钟）的直接危害是（　）。","o":["感知和判断能力下降，反应迟钝，极易失控引发事故","会增加轮胎磨损","导致车辆油耗上升","使导航信号变弱"],"a":[0],"e":"法规要求连续驾驶不得超过 4 小时、停车休息不少于 20 分钟。疲劳时反应迟钝、视野变窄、容易走神，是长途事故的头号诱因。感到困倦应立即驶入服务区或安全地带休息。","k":"疲劳驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"危险驾驶行为","t":"single","q":"驾驶机动车向道路抛撒物品的危害不包括（　）。","o":["提升后车发动机功率","危及后方车辆和行人安全","可能遮挡后车视线引发事故","破坏环境卫生并诱发后车避让事故"],"a":[0],"e":"车窗抛物既违法又不文明：抛出物可能砸中后车、遮挡视线、诱发避让连锁事故。抛撒物品的驾驶人将被处罚。","k":"车窗抛物"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在高速公路遇到能见度小于 200 米的雾天时，最高时速和跟车距离应为（　）。","o":["不超过 60km/h，与前车保持 100 米以上距离","不超过 80km/h，保持 50 米","不超过 100km/h，保持 100 米","不超过 120km/h，保持 150 米"],"a":[0],"e":"雾天高速公路能见度规则：<200 米→≤60km/h、车距 100 米以上；<100 米→≤40km/h、车距 50 米以上；<50 米→≤20km/h 并尽快驶离高速。同时开启雾灯、近光、示廓灯、前后位灯，<100 米加开双闪。\n【口诀】“2 百 6 1 百；1 百 4 五十；5 十 2 驶离”。","k":"雾天能见度规则"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在高速公路遇能见度小于 50 米的强雾天时，除按规定开启灯光和低速行驶外，还应（　）。","o":["尽快从最近的出口驶离高速公路","在行车道上停车等待雾散","加速驶向下一个服务区","紧跟大车行驶借其引路"],"a":[0],"e":"能见度＜50 米：车速≤20km/h，并从最近的出口尽快驶离高速公路或进入服务区；严禁在行车道停车（追尾风险极高）。","k":"强雾天处置"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在雨天行驶时，路面附着力下降，正确的做法是（　）。","o":["降低车速，避免急加速、急制动和急打方向","保持原速行驶缩短淋雨时间","急制动测试路面附着力","高速通过积水路段溅开积水"],"a":[0],"e":"雨天“三急”最危险：急加速、急制动、急打方向都容易打滑失控（水滑效应）。应降速、加大车距、缓打方向、缓踩制动，涉水路段低速匀速通过。","k":"雨天驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在冰雪道路行驶时，最容易出现的危险是（　）。","o":["制动距离延长，车辆易发生侧滑失控","发动机温度过高","灯光照射距离变短","轮胎气压迅速升高"],"a":[0],"e":"冰雪路面附着力极低：制动距离成倍延长、转向易侧滑。应低速行驶、缓踩制动（利用发动机制动）、避免急打方向，有条件时安装防滑链。","k":"冰雪路面驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"恶劣天气驾驶","t":"single","q":"驾驶机动车在夜间行驶时，光线差、视线受限，正确的做法是（　）。","o":["降低行驶速度，集中注意力观察灯光照射范围内的动态","提高车速弥补视线不足","持续使用喇叭探路","紧跟前车利用其灯光探路"],"a":[0],"e":"夜间可视范围缩小、对向眩光干扰多，必须降速并集中精力，把车速控制在与灯光照射距离相匹配的水平——“照多远、开多快”。","k":"夜间驾驶"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车从匝道驶入高速公路行车道时，应当（　）。","o":["开启左转向灯，在加速车道内提速，确认安全后汇入行车道","直接低速汇入行车道","在匝道口急刹观察后突然汇入","开启右转向灯汇入行车道"],"a":[0],"e":"高速公路汇入流程：在加速车道内将车速提到 60km/h 以上→开左转向灯→观察后视镜与盲区→在不影响正常行驶车辆的前提下汇入。低速突然汇入是高速追尾的主因之一。","k":"高速汇入"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车驶离高速公路时，应当（　）。","o":["提前开启右转向灯，驶入减速车道后降低车速驶离","在行车道上突然减速驶向出口","错过出口后立即停车倒车返回","连续跨越多条车道直接驶向出口"],"a":[0],"e":"驶离高速：提前并线至最右侧→开右转向灯→进入减速车道减速→经匝道驶离。错过出口只能继续行驶到下一出口，严禁倒车、逆行、掉头（记 12 分）。\n【口诀】“出口早准备，错过不回头”。","k":"高速驶离"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车在高速公路上发生故障需停车检查时，正确的做法是（　）。","o":["将车移至应急车道或路肩，开启双闪，在车后 150 米外设置警告标志，人员撤离到护栏外并报警","在行车道内停车立即检修","人员在车内等待救援","在车后 30 米设置警告标志即可"],"a":[0],"e":"高速故障停车标准流程：移至应急车道→开双闪→车后 150 米外放三角警示牌（夜间、雨雾天还要加距离并开示廓灯、后位灯）→人员全部撤离到护栏外→拨打报警救援电话。\n【数字】普通道路车后 50~100 米，高速公路 150 米以外。","k":"高速故障停车"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车在高速公路上行驶，下列做法中违法的是（　）。","o":["在应急车道内正常行驶","按限速标志行驶","从减速车道驶离高速","在加速车道提速后汇入"],"a":[0],"e":"应急车道是生命通道，仅限紧急情况（故障、事故、救护）使用，正常行驶占用应急车道将被记分罚款。","k":"应急车道"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"高速公路驾驶","t":"single","q":"机动车在高速公路上行驶，遇前方交通拥堵缓行时，正确的做法是（　）。","o":["依次减速排队行驶，不占用应急车道","从应急车道超车通过","穿插到大型车前方","在路肩掉头返回"],"a":[0],"e":"高速拥堵时依次排队，应急车道留给救援车辆。占用应急车道既处罚又可能耽误生命救援。","k":"高速拥堵通行"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"文明驾驶","t":"single","q":"驾驶机动车经过积水路段时，正确的做法是（　）。","o":["减速慢行或停车观察，避免溅湿行人","加速通过减少进水","紧贴路边行人通过","连续鸣喇叭示意行人躲避"],"a":[0],"e":"经过积水路段应减速慢行或停车让行，高速通过会溅起水花殃及行人与非机动车，既不文明也违法（遇行人应避让）。","k":"积水路段礼让"},{"s":"jk1","p":"安全行车文明驾驶","c":3,"cn":"文明驾驶","t":"single","q":"行车中需要借道时，遇到后方车辆鸣喇叭催促，正确的做法是（　）。","o":["保持心态平和，按自己的节奏安全完成操作","立即加速完成操作","与其斗气别车","长时间占用道路不理会任何车辆"],"a":[0],"e":"被催促时不慌不斗：保持安全节奏完成操作。斗气驾驶（别车、逼停）属严重违法行为，极易造成重大事故。\n【文明驾驶核心】礼让、冷静、不斗气。","k":"文明驾驶心态"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶证的有效期分为 6 年、10 年和长期。驾驶人初次申领驾驶证的有效期为（　）。","o":["6 年","10 年","长期","3 年"],"a":[0],"e":"驾驶证有效期规则：初次申领 6 年；每个记分周期均未记满 12 分的，换发 10 年有效期驾驶证；10 年有效期内每个记分周期均未记满 12 分的，换发长期有效的驾驶证。\n【记忆钩子】“6 年 → 10 年 → 长期，靠的是不记满 12 分”。","k":"驾驶证有效期"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶证有效期即将届满需要换证的，驾驶人应当在驾驶证有效期满前（　）内申请换证。","o":["90 日","30 日","60 日","180 日"],"a":[0],"e":"有效期满前 90 日内向核发地或核发地以外的车辆管理所申请换证。逾期不换仍驾车属无证驾驶范畴（超过有效期 1 年以上未换证的将被注销）。\n【口诀】“期满前九十，抓紧办换证”。","k":"换证时限"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶人初次申领驾驶证后的 12 个月为实习期。实习期内驾驶机动车上高速公路行驶，正确的做法是（　）。","o":["由持相应或者更高准驾车型驾驶证 3 年以上的驾驶人陪同","任何时间都可以独自上高速","只要车流量小就可以独自上高速","在实习期内禁止申领任何驾驶证"],"a":[0],"e":"实习期为 12 个月；实习期内上高速公路，必须由持相应或更高准驾车型驾驶证 3 年以上的驾驶人陪同。此外实习期内应在车身尾部粘贴或悬挂统一实习标志。","k":"实习期规定"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶人户籍迁出原车辆管理所管辖区的，应当（　）。","o":["向迁入地车辆管理所申请换证","重新申领驾驶证","在原籍驾驶即可，全国通用无须处理","注销原驾驶证后重新考试"],"a":[0],"e":"户籍迁出原辖区或居住在核发地以外的，可向迁入地（居住地）车管所申请换证——驾驶证全国通用，换证只是信息属地化，不需要重新考试。","k":"驾驶证换证属地"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"持有 C1 驾驶证的驾驶人，可以驾驶的车辆是（　）。","o":["小型、微型载客汽车以及轻型、微型载货汽车（含低速载货汽车）","所有摩托车","中型载客汽车","重型半挂牵引车"],"a":[0],"e":"C1 准驾车型：小型、微型载客汽车，轻型、微型载货汽车，低速载货汽车，三轮汽车，以及 C2（自动挡）、C3、C4 准驾车型。C1 不含摩托车（需 E/F 证），也不含中型客车、大货车、牵引车。\n【高频陷阱】“C1 可以骑摩托车”——错。","k":"准驾车型"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"年龄在 70 周岁以上的机动车驾驶人，应当（　）。","o":["每年进行一次身体检查，并提交体检证明","每两年提交一次体检证明","无须再提交体检证明","注销驾驶证后重新申领"],"a":[0],"e":"70 周岁以上驾驶人每年体检并提交身体条件证明；未按时提交的，车管所将注销其驾驶证。此外 70 岁以上申领（含增驾）还需通过记忆力、判断力、反应力“三力”测试。","k":"高龄驾驶人体检"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"驾驶证管理","t":"single","q":"机动车驾驶人发现驾驶证丢失后，正确的做法是（　）。","o":["申请补领，补领后原驾驶证作废不得继续使用","继续使用，被查到再说","使用朋友的驾驶证驾车","找路边办证小广告补办"],"a":[0],"e":"驾驶证丢失应向核发地或核发地以外车管所申请补领；补领后原驾驶证作废，若继续使用原证驾车将按使用失效证件处理。\n【提示】可通过“交管 12123”App 在线补领。","k":"驾驶证补领"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"机动车驾驶人的一个记分周期时间为（　）。","o":["12 个月","6 个月","24 个月","3 个月"],"a":[0],"e":"记分周期为 12 个月，满分 12 分，从初次领证之日起计算。周期内记分不满 12 分且罚款已缴清的，记分予以清除；仍有罚款未缴的，记分转入下一周期。","k":"记分周期"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"机动车驾驶人在一个记分周期内累积记分达到 12 分的，应当（　）。","o":["参加道路交通安全法律法规学习并重新考试（科目一），考试合格后清除记分","直接到车管所缴纳罚款清除记分","换领新驾驶证即可清零","找他人代为处理记分"],"a":[0],"e":"记满 12 分：扣留驾驶证→参加 7 天左右法律法规学习→重新考科目一，合格后记分清除并发还驾驶证。一个周期内两次记满 12 分的，还要加考科目三。找他人代记分属违法（双方均处罚）。","k":"记满 12 分的处理"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路或城市快速路上违法占用应急车道行驶的，一次记（　）。","o":["6 分","12 分","3 分","1 分"],"a":[0],"e":"违法占用应急车道行驶记 6 分并罚款；在高速公路、城市快速路上违法停车的记 9 分。应急车道是生命通道，非紧急情况不得占用。","k":"占用应急车道记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"饮酒后驾驶机动车的（血液酒精含量达到 20mg/100ml 以上），一次记（　），并处暂扣驾驶证 6 个月和罚款。","o":["12 分","6 分","9 分","3 分"],"a":[0],"e":"饮酒后驾驶机动车：记 12 分＋暂扣驾驶证 6 个月＋罚款 1000～2000 元；再次饮酒驾车的，处 10 日以下拘留＋罚款＋吊销驾驶证。\n【对比】饮酒驾驶营运机动车：15 日拘留＋5000 元罚款＋吊销驾驶证＋5 年内不得重新申领。","k":"饮酒驾驶处罚"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路、城市快速路上倒车、逆行、穿越中央分隔带掉头的，一次记（　）。","o":["12 分","9 分","6 分","3 分"],"a":[0],"e":"高速/城市快速路上倒车、逆行、穿越中央分隔带掉头属最危险的违法行为之一，一次记 12 分并罚款。错过出口请继续行驶至下一出口。","k":"高速倒车逆行"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车行经人行横道，不按规定减速、停车、避让行人的，一次记（　）。","o":["3 分","6 分","12 分","1 分"],"a":[0],"e":"不礼让斑马线记 3 分并罚款。斑马线前“一脚刹车”既是守法也是文明。","k":"不礼让行人记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路或城市快速路上行驶时，驾驶人未按规定系安全带的，一次记（　）。","o":["1 分","3 分","6 分","9 分"],"a":[0],"e":"驾驶人未按规定系安全带（在高速或城市快速路上行驶时）记 1 分并罚款。安全带是“生命带”，前排后排都要系。\n【联动】驾驶时接打手持电话记 3 分。","k":"安全带记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"造成交通事故后逃逸，尚不构成犯罪的，处罚正确的是（　）。","o":["记 12 分，处 200 元以上 2000 元以下罚款，可以并处 15 日以下拘留","仅记 3 分并口头教育","只赔偿损失，不予处罚","吊销驾驶证且终生禁驾"],"a":[0],"e":"事故逃逸尚不构成犯罪：记 12 分＋200～2000 元罚款＋可并处 15 日以下拘留。构成犯罪的（致人重伤、死亡等）依法追究刑事责任，吊销驾驶证且终生禁驾。\n【牢记】“逃逸一时爽，代价无限大”。","k":"肇事逃逸处罚"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"使用伪造、变造的机动车号牌、行驶证、驾驶证的，处罚正确的是（　）。","o":["记 12 分，收缴物品，处 15 日以下拘留，并处 2000 元以上 5000 元以下罚款；构成犯罪的依法追究刑事责任","仅没收假牌假证","记 6 分并罚款 200 元","扣留车辆后放行"],"a":[0],"e":"伪造、变造或使用伪造变造的牌证：记 12 分＋收缴＋拘留＋2000～5000 元罚款，构成犯罪追究刑责。使用其他车辆号牌的同样记 12 分并处罚。","k":"伪造牌证处罚"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车在高速公路上行驶低于规定的最低时速的，一次记（　）。","o":["3 分","1 分","6 分","12 分"],"a":[0],"e":"高速公路有最低时速限制（一般车道不低于 60km/h），低速行驶同样是危险的“移动路障”，记 3 分并罚款。\n【记分速记】12 分最严重（酒驾、逃逸、高速倒车逆行、假牌）；9 分（遮挡号牌、高速违法停车）；6 分（闯红灯、占应急车道）；3 分（接打电话、不礼让行人、低速行驶）；1 分（不系安全带、违反禁止标线）。","k":"低速行驶记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车时拨打、接听手持电话的，一次记（　）。","o":["3 分","1 分","6 分","9 分"],"a":[0],"e":"驾驶时接打手持电话记 3 分并罚款。分心 2 秒，盲开数十米——需要接打电话请靠边停车或使用免提。","k":"接打电话记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"记分规则","t":"single","q":"驾驶机动车不按照规定避让执行紧急任务的警车、消防车、救护车、工程救险车的，一次记（　）。","o":["3 分","1 分","6 分","12 分"],"a":[0],"e":"不避让特种车辆记 3 分并罚款。让行特种车辆：在保证安全的前提下减速、变道、停车，为生命通道让行。","k":"避让特种车辆记分"},{"s":"jk1","p":"驾驶证管理与记分处罚","c":4,"cn":"车辆管理","t":"single","q":"机动车驾驶人应当于机动车驾驶证有效期满前 90 日内申请换证；机动车所有人住所在车辆管理所管辖区域内迁移的，应当（　）。","o":["向登记地车辆管理所申请变更登记","重新购买车辆","不需要办理任何手续","注销行驶证后重新上牌"],"a":[0],"e":"机动车所有人住所在车管所管辖区内迁移、姓名或联系方式变更的，应当向登记地车管所申请变更登记（备案）。\n【区分】驾驶人信息变化→换证/备案；机动车转移（过户）→转移登记。","k":"机动车变更登记"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"在道路上发生交通事故，仅造成轻微财产损失且基本事实清楚的，当事人应当（　）。","o":["先撤离现场再自行协商处理","保护现场等待交警到场","将车辆原地保留并堵塞交通","弃车离开现场"],"a":[0],"e":"轻微事故（无人伤、事实清楚、车可移动）：应当先撤离现场、恢复交通，再自行协商赔偿或使用“交管 12123”在线快处——堵路协商反而违法。\n【对比】有人伤亡或对事实有争议的，必须保护现场并立即报警。","k":"轻微事故快处"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"在道路上发生交通事故，造成人员伤亡时，驾驶人应当（　）。","o":["立即抢救受伤人员，并迅速报告执勤交警或公安机关交通管理部门","先撤离现场再报警","自行与伤者私了后离开","驾车逃离现场避免麻烦"],"a":[0],"e":"造成人身伤亡的事故：立即抢救伤员并迅速报警；因抢救伤员需要变动现场的，应当标明位置。逃逸将承担全责乃至刑事责任。\n【顺序】救人→报警→保护现场。","k":"伤亡事故处置"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"机动车在高速公路上发生交通事故，车辆可以移动时，正确的做法是（　）。","o":["将车辆移至应急车道或就近驶离，开启双闪并在来车方向 150 米外设置警告标志，人员撤离到安全区域后报警","原地保留现场等待交警","人员在车周围摆放三角牌","继续在行车道行驶寻找出口"],"a":[0],"e":"高速公路事故“车能先动就先动”：移至应急车道→开双闪→150 米外放三角牌→人员全部撤离到护栏外→报警。“车靠边、人撤离、即报警”九字诀是保命口诀。","k":"高速事故处置（九字诀）"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"发生交通事故后当事人逃逸的，承担的责任是（　）。","o":["逃逸的当事人承担全部责任，但有证据证明对方当事人也有过错的，可以减轻责任","双方各承担一半责任","不承担任何责任","仅承担刑事责任不承担民事赔偿"],"a":[0],"e":"逃逸者原则上承担事故全部责任（有证据证明对方也有过错的可减轻）。逃逸还会触发记 12 分、拘留乃至吊销驾照终生禁驾的严重后果。","k":"逃逸责任"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"道路上发生交通事故，当事人对交通事故事实及成因有争议的，应当（　）。","o":["保护现场并立即报警，等候交通警察处理","强行要求对方当场赔钱","弃车离开现场","拦截过往车辆逼停对方"],"a":[0],"e":"对事实成因有争议、有人伤、无牌无证或酒驾等情形，必须保护现场立即报警，不能私了。私了仅适用于无人伤、事实清楚、责任明确且可撤离的轻微事故。","k":"争议事故报警"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"车辆涉水后制动效能降低，正确的做法是（　）。","o":["低速行驶，轻踩制动踏板利用摩擦产生的热量蒸发水分，恢复制动效能","立即高速行驶甩干水分","直接停车不管","拉紧驻车制动器行驶"],"a":[0],"e":"涉水后制动器内进水导致制动减弱：低速行驶并间歇轻踩制动，让摩擦生热烘干制动片，确认制动恢复后再正常行驶。","k":"涉水后制动恢复"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故现场抢救伤员的基本要求是（　）。","o":["先救命、后治伤：优先处理危及生命的大出血、呼吸道阻塞等问题","先固定骨折再处理出血","先搬移伤员到路边再施救","给所有伤员喂水补充体力"],"a":[0],"e":"现场急救原则“先救命后治伤”：优先处理大出血（止血）、保持呼吸道通畅，再处理骨折等损伤。给昏迷伤员喂水可能造成窒息。","k":"急救基本原则"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故中发现伤员手指、胳膊或腿骨折时，正确的做法是（　）。","o":["用夹板（或就便器材）固定骨折部位上方和下方，避免晃动","用力将骨折处复位拉直","热敷揉搓骨折部位","不做处理等待伤员自行恢复"],"a":[0],"e":"骨折处置：固定制动——用夹板或木板等固定骨折部位上下两个关节，不要试图复位拉直，防止二次损伤；开放性骨折先止血包扎再固定。","k":"骨折固定"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"救助有骨折伤员益处最大、最应注意避免的错误做法是（　）。","o":["随意搬动、背拖脊柱受伤的伤员","拨打急救电话","在专业指导下用硬担架搬运","观察伤员呼吸和意识"],"a":[0],"e":"脊柱、颈椎受伤的伤员严禁随意搬动或背拖，否则可能加重脊髓损伤导致瘫痪。应保持伤员平卧位、固定颈部，等待专业急救人员用硬担架搬运。","k":"脊柱伤员搬运"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故现场对伤员进行心肺复苏时，胸外按压的位置和频率应为（　）。","o":["两乳头连线中点（胸骨下半部），按压频率 100～120 次/分钟","左胸心脏位置，每分钟 60 次","腹部位置，每分钟 80 次","任意位置，随意按压"],"a":[0],"e":"心肺复苏要点：按压位置为胸骨下半部（两乳头连线中点），频率 100～120 次/分钟，深度 5～6 厘米，每次按压后让胸廓充分回弹，尽量不中断。","k":"心肺复苏"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"事故现场有伤员大量出血时，正确的止血方法是（　）。","o":["用干净的布料、绷带直接压在出血部位加压包扎止血","在伤口上涂抹药膏","用泥土、烟灰撒在伤口上","不处理等自行凝固"],"a":[0],"e":"直接压迫止血是现场最有效的止血法：用干净布料直接按压伤口并加压包扎；四肢大出血无法控制时，可在近心端使用止血带并记录时间。严禁往伤口撒泥土烟灰（易感染）。","k":"止血方法"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"车辆发生火灾时，正确的做法是（　）。","o":["立即靠边停车、切断电源、组织人员撤离，用灭火器对准火源根部灭火","打开发动机舱盖仔细查找火源","用水直接浇灭油火","躲在车内等待火势自行熄灭"],"a":[0],"e":"车辆起火：立即停车、切断电源、组织乘员远离车辆，用灭火器对准火焰根部喷射；不要贸然完全打开引擎盖（大量进氧会助燃），可微开缝隙喷射。油类火灾严禁用水浇。","k":"车辆灭火"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"急救常识","t":"single","q":"搬运昏迷或有窒息危险的伤员时，正确的做法是（　）。","o":["采取侧卧位（或侧俯卧位）搬运，保持呼吸道通畅","采取仰卧位搬运","采取俯卧位搬运","抱起伤员立位搬运"],"a":[0],"e":"昏迷伤员仰卧时舌后坠、呕吐物易堵塞呼吸道，应采取侧卧位（复原卧位）搬运并清理口鼻异物，保持呼吸道通畅。","k":"昏迷伤员搬运"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"道路上发生交通事故，驾驶人未造成人身伤亡且对事实及成因无争议却拒不撤离现场的，交通警察将（　）。","o":["予以强制撤离，并依法处理","帮助其协商赔偿","不予理会","当场吊销其驾驶证"],"a":[0],"e":"应当自行撤离现场而不撤离、造成交通堵塞的，交警可以强制撤离并依法处罚。快处快撤既是义务也是保护自己。","k":"拒不撤离的后果"},{"s":"jk1","p":"事故处理与急救","c":5,"cn":"事故处理","t":"single","q":"抢救失血过多的伤员时，下列做法中错误的是（　）。","o":["给伤员大量饮水补充水分","采取压迫止血措施","及时拨打 120 急救电话","注意给伤员保暖"],"a":[0],"e":"失血伤员不宜大量饮水（可能需要手术麻醉，且昏迷时饮水会窒息）；保暖、压迫止血、呼叫 120 才是正确做法。\n【急救铁律】不给伤员随意进食进水。","k":"失血伤员处理"}],"jk4":[{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶机动车起步前，驾驶人应对车辆周围进行绕车观察，最主要的目的是（　）。","o":["确认车辆周围有无行人、儿童及障碍物，避免起步事故","检查车辆油耗多少","观察天气情况","欣赏车辆外观有无划痕"],"a":[0],"e":"车辆盲区内的行人、儿童是起步事故的高发原因，绕车一周确认安全是起步前的必做动作，同时顺带检查轮胎、车牌状态。","k":"起步观察"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆汇入主路车流时，正确的做法是（　）。","o":["开启转向灯，观察主路情况，确认安全后汇入","加速直接汇入主路","低速缓慢汇入，让主路车辆避让","鸣喇叭示意主路车辆停车让行"],"a":[0],"e":"汇入主路必须“一开灯、二观察、三汇入”，在不影响主路车辆正常行驶的前提下汇入。直接汇入或低速汇入都会迫使主路车辆紧急避让。","k":"汇入主路"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在交叉路口左转弯时，应提前（　）。","o":["开启左转向灯，驶入左转弯车道","开启右转向灯，驶入右转弯车道","在直行车道直接左转","不开转向灯，凭经验转弯"],"a":[0],"e":"转弯、变更车道、超车、掉头等都要提前开启相应转向灯，并提前驶入对应导向车道。路口内临时变道左转极易与直行车流冲突。","k":"左转弯规范"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆行经学校附近路段时，正确的做法是（　）。","o":["减速慢行，注意观察学生动态，随时准备停车避让","保持正常车速通过","鸣喇叭警告学生让路","加速在学生放学前冲过"],"a":[0],"e":"学校路段学生集中、突发横穿多，应主动减速、加强观察、随时准备停车。上下学高峰还应服从交警和护学岗指挥。","k":"学校路段"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆通过窄路、窄桥与会车时，正确的做法是（　）。","o":["减速靠右通过，必要时选择宽阔地点停车让行","加速抢先通过","鸣喇叭迫使对方让行","紧靠道路中心行驶"],"a":[0],"e":"窄路窄桥会车空间有限：减速靠右，有让行条件的一方应停车让行，确保双方安全交会。","k":"窄路会车"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"行车中遇到转向失控、制动失灵等紧急故障时，驾驶人首先应当（　）。","o":["握稳方向，控制住车辆行驶轨迹","立即跳车逃生","猛拉驻车制动器","关闭发动机滑行"],"a":[0],"e":"任何紧急情况的第一步都是“稳住方向、控制车辆”，方向失控时乱打方向或跳车都会造成更严重后果。握稳方向后再逐级减速、开启双闪、靠边停车。","k":"紧急故障第一反应"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在高速公路行驶时，发现轮胎气压过低或出现异常，正确的做法是（　）。","o":["逐渐减速，开启右转向灯驶入应急车道或就近驶离高速检查","立即紧急制动停车检查","继续行驶到目的地再处理","高速行驶中停车更换轮胎"],"a":[0],"e":"高速上轮胎异常严禁急刹与猛打方向，应稳住方向、松开油门逐渐减速，开右转向灯驶入应急车道处理，并按规定摆放警告标志。","k":"轮胎异常处置"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆变更车道时，应当提前开启转向灯并（　）。","o":["通过后视镜观察后方和侧方交通情况","加速快速插入目标车道","鸣喇叭通知其他车辆","降低车速缓慢平移"],"a":[0],"e":"变道三步：开灯预告→观察后视镜和盲区→确认安全后平顺变更。加速插入或缓慢平移都会造成后车反应不及。","k":"变更车道观察"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在道路上跟车行驶时，最重要的是（　）。","o":["根据前车速度和路况保持动态安全距离","始终紧跟前车不掉队","频繁变更车道寻找更快车道","紧盯前车尾灯忽略其他方向"],"a":[0],"e":"安全距离是动态的：随车速、天气、载重调整。速度快、雨雾天、重载时距离要加大。跟车还要观察前车的前车，预判连带制动。","k":"动态跟车"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆遇到前方车辆正在执行紧急任务（救护车、消防车）时，应当（　）。","o":["减速避让，在条件允许的车道停车让行","加速与其并行","紧跟其后利用其开道","鸣喇叭要求其等待"],"a":[0],"e":"为特种车辆让行是法定义务：同向的在保证安全下变道让出通道，路口的在保证安全后停车让行——因让行产生的交通违法经核实后不予处罚。","k":"避让特种车辆"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在弯道上行驶时，正确的做法是（　）。","o":["减速、鸣号（禁鸣区除外）、靠右行","提前加速冲过弯道","弯道中踩制动减速","占用对向车道切弯"],"a":[0],"e":"弯道驾驶“减速、鸣号、靠右行”三原则：入弯前减速（弯中制动易侧滑），盲区弯道鸣号提示，全程靠右不占对向车道。","k":"弯道驾驶"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆下长坡时，正确的控制车速的方法是（　）。","o":["利用发动机牵阻作用控制车速，配合行车制动器","持续踩住行车制动器不放","挂空挡滑行省油","拉紧驻车制动器下坡"],"a":[0],"e":"下长坡长时间连续踩制动会导致制动器过热失效（热衰退），应挂低挡利用发动机制动控制车速，配合点刹。空挡滑行既违法又失去发动机牵阻。","k":"下长坡控速"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆通过隧道时，正确的做法是（　）。","o":["提前开启前照灯，按限速行驶，隧道内不得变更车道","进入隧道后减速开远光灯观察","在隧道内超车尽快通过","隧道口不减速直接进入适应光线"],"a":[0],"e":"隧道驾驶：提前开灯（进暗处眼睛需要适应）、按隧道限速行驶、隧道内禁止变更车道和超车，保持车距，禁止停车。","k":"隧道驾驶"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆行经人行横道前，遇绿灯放行但行人尚未通过完毕时，应当（　）。","o":["停车让行人先行通过","鸣喇叭催促行人","加速从行人身后绕过","保持车速从人群中间通过"],"a":[0],"e":"绿灯放行也必须等斑马线上的行人走完——路权让位于生命权。此时若后方鸣笛催促，也应坚持让行。","k":"斑马线让行"},{"s":"jk4","p":"安全行车常识","c":1,"cn":"安全行车常识","t":"single","q":"驾驶车辆在雨天遇到非机动车驾驶人穿戴雨衣影响视线时，应当（　）。","o":["减速慢行，加大横向间距，随时准备停车","正常车速紧贴通过","鸣喇叭提醒其注意","加速从其左侧超越"],"a":[0],"e":"雨衣遮挡视线、雨天人车不稳，与非机动车交会或超越时应加大横向距离、低速通过，防止其突然晃动或滑倒。","k":"雨天非机动车"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"行车中遇到其他车辆加塞时，正确的做法是（　）。","o":["减速礼让，保持安全距离","加速顶住不让其加塞","鸣喇叭并长时间逼鸣","故意碰撞示意警告"],"a":[0],"e":"遇到加塞“让速不让道”，减速留出空间避免剐蹭，斗气别车会构成违法乃至犯罪。安全永远优先于“一口气”。","k":"应对加塞"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"驾驶车辆时发现后方车辆鸣喇叭、闪灯示意超车，正确的做法是（　）。","o":["在保证安全的前提下，适当减速靠右让其超越","加速行驶不让其超越","故意压低车速阻拦","开启双闪逼其后车绕行"],"a":[0],"e":"后车示意超车时应礼让：减速靠右，为对方留出超车空间。斗气阻拦属于报复性驾驶行为，极易引发恶性事故。","k":"礼让后车"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"下列驾驶行为中，属于文明驾驶的是（　）。","o":["夜间会车时交替使用远近光灯提示后改用近光","雨天高速通过积水路段","小区内鸣喇叭催促行人","车窗抛物减轻车内垃圾"],"a":[0],"e":"文明驾驶体现在细节：夜间规范用灯、雨天减速防溅水、小区禁鸣、不向车外抛物。这些细节直接反映驾驶人的素养。","k":"文明驾驶行为"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"驾驶车辆遇到其他驾驶人发生交通事故需要帮助时，正确的做法是（　）。","o":["在保证安全的前提下停车协助，保护现场并帮助报警","围观拍照发朋友圈","加速离开避免麻烦","借机超车快速通过"],"a":[0],"e":"助人为乐是驾驶人职业道德的要求：在确保自身安全的前提下停车协助，帮助摆放警示标志、报警求救。围观堵路、拍照传播都是不当行为。","k":"助人互助"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"驾驶车辆通过居民小区时，应当（　）。","o":["低速慢行，避让行人和宠物，不鸣喇叭","正常车速通过小区道路","鸣喇叭开道提醒行人","借小区道路抄近道加速通过"],"a":[0],"e":"小区内老人儿童密集、视线遮挡多：低速、禁鸣、随时避让。多数小区道路还有限速 5~15km/h 的规定。","k":"小区驾驶"},{"s":"jk4","p":"文明驾驶与职业道德","c":2,"cn":"文明驾驶与职业道德","t":"single","q":"关于驾驶人在行车中的着装与操作，正确的做法是（　）。","o":["穿鞋底防滑、软硬适中的鞋子驾驶，不穿拖鞋或高跟鞋","穿拖鞋驾驶更凉快灵活","高跟鞋跟部便于踩踏制动","赤脚踩踏踏板更灵敏"],"a":[0],"e":"拖鞋、高跟鞋、厚底靴都会影响踏板的踩踏力度与精度，是明确的危险行为。驾驶应穿软硬适中、防滑的平底鞋。","k":"驾驶着装"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在雨天行驶，遇前方路面有积水时，正确的做法是（　）。","o":["减速或停车观察水深和水下路况，低速匀速通过","高速冲过积水路段","紧跟前车车辙快速通过","停车在水中休息观察"],"a":[0],"e":"积水路段“一慢二看三通过”：不明水深绝不冒险，通过时低挡匀速、不停车不换挡，通过后轻踩制动恢复制动效能。","k":"积水路段"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在冰雪道路行驶时，转向和制动都应（　）。","o":["轻缓柔和，避免急打方向和急踩制动","快速果断，一步到位","与干燥路面操作相同","先加速再减速"],"a":[0],"e":"冰雪路面附着力极低，“柔和”是关键词：缓加速、缓制动（多用发动机制动）、缓打方向，加大跟车距离，防止侧滑甩尾。","k":"冰雪路面操作"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"车辆在冰雪路面发生侧滑时，正确的做法是（　）。","o":["松抬加速踏板，向侧滑的一侧适当转动方向盘修正","立即紧急制动","向侧滑相反方向猛打方向","拉紧驻车制动器"],"a":[0],"e":"车辆侧滑（甩尾）修正口诀“顺滑打轮”：松油门、向侧滑方向轻转方向盘，待车身回正后再缓加油。紧急制动和反向猛打都会加剧侧滑。","k":"侧滑修正"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在雾天行驶时，正确的做法是（　）。","o":["开启雾灯和危险报警闪光灯，低速行驶，多鸣喇叭提示","开启远光灯照亮前方","紧跟前车借其灯光行驶","加速抢在雾变大前通过"],"a":[0],"e":"雾天：开雾灯＋双闪（必要时近光、示廓灯）、降速、勤按喇叭提示位置；远光灯会被雾气漫反射形成白幕，反而更看不清。","k":"雾天驾驶"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆在夜间会车时对向车辆灯光眩目、视线受阻，应当（　）。","o":["减速慢行，必要时靠边停车，视线右移避开光源","开启远光灯对射","闭眼片刻缓解眩目","加速冲过眩目区"],"a":[0],"e":"眩光会形成 2 秒左右的视觉盲区，减速或停车是唯一安全做法；视线可稍向右移借助路缘参照。对射远光会害人害己。","k":"夜间眩光"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆通过连续弯道（山区弯路）时，正确的做法是（　）。","o":["减速慢行，鸣号提示，注意观察弯道尽头的来车","连续切弯占用对向车道","弯中加速体验操控","紧贴弯道外侧行驶"],"a":[0],"e":"山区连续弯道盲区多：“减速、鸣号、靠右”贯穿每个弯道，绝不占用对向车道切弯，注意观察凸面镜和弯道标志提示。","k":"连续弯道"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"驾驶车辆行经施工路段时，正确的做法是（　）。","o":["按施工标志和临时导向行驶，减速慢行，与前车保持较大距离","加速通过减少暴露时间","紧跟前车尾部通过","在施工路段停车询问路线"],"a":[0],"e":"施工路段车道收窄、路面不平、人员机械混行：按导改标志减速通行、加大车距、注意观察工作人员手势。","k":"施工路段"},{"s":"jk4","p":"恶劣天气与复杂路况","c":3,"cn":"恶劣天气与复杂路况","t":"single","q":"夜间驾驶车辆会车前，正确的观察方法是（　）。","o":["提前观察前方道路情况，减速并改用近光灯","到两车交会时再观察减速","凭灯光判断对方车型不减速","开远光灯先照亮对向车辆"],"a":[0],"e":"夜间会车要“提前”：提前降速、提前改近光、提前观察路侧，避免在交会瞬间手忙脚乱。","k":"夜间会车"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行驶中轮胎突然爆裂（爆胎）时，正确的做法是（　）。","o":["紧握方向盘，保持行驶方向，轻踏制动踏板缓慢减速停车","立即紧急制动停车","猛打方向盘修正方向","迅速松开方向盘保护自己"],"a":[0],"e":"爆胎瞬间的正确反应：紧握方向保持直线行驶→松油门→轻踩制动缓慢减速→开双闪靠边停车。急刹和猛打方向会导致车辆失控翻车。","k":"爆胎处置"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中制动突然失灵时，驾驶人应当（　）。","o":["握稳方向，抢挂低速挡利用发动机制动减速，同时使用驻车制动器","立即跳车弃车","猛踩制动踏板不放松","关闭点火开关滑行减速"],"a":[0],"e":"制动失灵处置：握稳方向→抢挂低挡（发动机制动）→缓拉驻车制动（分段拉紧）→开双闪鸣笛警示→利用路边障碍物（缓冲物）摩擦减速。行驶中关闭点火开关会失去转向助力且锁死方向盘（带锁车型），绝对禁止。","k":"制动失灵"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中发动机突然熄火（转向仍有助力余量）时，正确的做法是（　）。","o":["握稳方向，减速开启右转向灯，滑行靠边停车检查","立即重新点火启动","紧急制动停车在行车道内","立即关闭一切电器"],"a":[0],"e":"行驶中熄火：控制方向是第一位的（熄火后液压助力会逐渐消失，转向变沉），靠滑行减速、开右转向灯靠边停车，设置警示后排查。","k":"行驶中熄火"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆转向突然失控时，正确的做法是（　）。","o":["握稳方向，及时减速，开启危险报警闪光灯并鸣喇叭提示，选择安全地点停车","立即紧急制动到停车","继续加速保持行驶","弃车跳车逃生"],"a":[0],"e":"转向失控：减速、开双闪、鸣笛警示其他车辆，果断选择安全地点（空旷处、缓冲物较少处）停车；只有车速降下来失控的后果才可控。","k":"转向失控"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆行驶中发生侧滑时，应向（　）转动方向盘进行修正。","o":["侧滑的一侧（后轮侧滑方向）","侧滑的相反一侧","任意一侧","固定向左侧"],"a":[0],"e":"后轮侧滑（甩尾）修正口诀“顺打方向”：车尾向哪边甩，方向就向哪边转，把车头“带”回来。切忌紧急制动（会加重失控）。","k":"侧滑修正方向"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆落入水中时，正确的逃生方法是（　）。","o":["保持冷静，待车身下沉至水浸过车窗后，深吸气开门或砸窗游出","第一时间猛力推车门逃生","在车内等待救援不采取任何措施","立即爬到车顶等待"],"a":[0],"e":"车辆落水初期水压差导致车门推不开：系好安全带保持镇定，待水进入车厢接近充满、内外压力接近时，深吸一口气开门或用安全锤砸碎侧窗四角游出。安全锤应击打玻璃四角。","k":"落水逃生"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中发动机舱起火时，正确的做法是（　）。","o":["立即靠边停车熄火，组织人员撤离，微开发动机舱盖用灭火器对准火源根部喷射","立即打开发动机舱盖查找火源","用水浇灭发动机火焰","继续行驶赶到消防队"],"a":[0],"e":"发动机舱起火：停车熄火断电→人员撤离→舱盖微开缝隙灭火（全开会让大量空气涌入助燃）→对准根部喷射。油类火灾禁止用水浇。","k":"车辆起火"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆即将发生正面碰撞、无法避免时，正确的做法是（　）。","o":["顺向撞向危险较小的一侧，同时紧急制动，驾驶人身体后靠紧贴座椅","打开车门跳车","向副驾驶一侧躲避方向","猛打方向盘抢救方向"],"a":[0],"e":"正面碰撞无法避免时：紧急制动降低相对速度，身体后靠（远离方向盘气囊弹出区），顺向转向选择损失较小的一侧碰撞。高速时猛打方向极易侧翻失控。","k":"碰撞避险"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"车辆翻车时，车内人员的正确做法是（　）。","o":["抓紧车内固定物（方向盘、扶手等），身体紧贴座椅固定，翻转停止后再逃生","在翻转过程中跳车","抱头在车内随意翻滚","立即解开安全带站起逃生"],"a":[0],"e":"翻车过程中跳车极其危险（易被车辆碾压）：抓紧固定物、身体紧贴座椅背靠、双脚蹬住，翻转停止确认安全后再破窗或开门撤离。","k":"翻车避险"},{"s":"jk4","p":"紧急情况避险","c":4,"cn":"紧急情况避险","t":"single","q":"行车中遇到牲畜或畜力车时，正确的做法是（　）。","o":["减速慢行，不鸣喇叭，保持较大安全距离","鸣喇叭驱赶牲畜让路","加速绕过牲畜","紧贴牲畜缓慢通过"],"a":[0],"e":"牲畜受鸣喇叭惊吓会失控冲撞，应减速靠近内侧缓慢通过或停车让行，切勿鸣笛驱赶。","k":"避让牲畜"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"抢救事故受伤人员时，应当（　）。","o":["先处理危及生命的伤情，如大出血和呼吸道阻塞","先处理轻微擦伤","先等待伤员家属到场","给伤员服用止痛药物"],"a":[0],"e":"现场急救原则“先救命后治伤”：优先处理气道阻塞和大出血等致命伤情，同时拨打 120，不要随意搬动疑似脊柱损伤的伤员。","k":"急救优先级"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"搬运昏迷或有窒息危险的伤员时，应采取（　）。","o":["侧卧位，保持呼吸道通畅","仰卧位","俯卧位","坐位"],"a":[0],"e":"昏迷伤员侧卧（复原卧位）可防止舌后坠和呕吐物堵塞气道。仰卧可能加重窒息，搬运时还要特别注意保护颈椎。","k":"昏迷伤员体位"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"伤员较大动脉出血时，现场首选的急救方法是（　）。","o":["在伤口近心端用手指或绷带压迫止血","在伤口处涂抹药膏","让伤员平躺休息自行止血","用纸巾轻擦伤口"],"a":[0],"e":"动脉大出血凶险，应立即在近心端压迫止血（指压或加压包扎），并尽快送医；使用止血带要标注时间，每隔一段时间放松一次。","k":"大出血急救"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"伤员被烧伤后，正确的现场处理方法是（　）。","o":["用清洁冷水冲洗降温，小心除去衣物，不要弄破水泡","在烧伤处涂抹酱油或牙膏","立即撕除粘连的衣物","用针挑破水泡放液"],"a":[0],"e":"烧烫伤急救“冲、脱、泡、盖、送”：冷水冲降温→小心脱去衣物→冷水浸泡→清洁敷料覆盖→尽快送医。涂抹酱油牙膏会污染创面，挑破水泡易感染。","k":"烧伤处理"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"对硫化氢、一氧化碳等有害气体中毒的伤员，正确的做法是（　）。","o":["将伤员迅速移至通风良好的地方，保持呼吸道通畅","在原地进行人工呼吸","给伤员戴上原有口罩","先给伤员喂水稀释毒物"],"a":[0],"e":"气体中毒急救第一步是脱离中毒环境：将伤员移到上风向通风处，解开衣领保持呼吸通畅，呼吸停止的立即进行心肺复苏。施救者也要注意自身防护，避免盲目进入中毒环境。","k":"气体中毒急救"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"救助腐蚀性化学品溅到皮肤上的伤员时，正确的做法是（　）。","o":["用大量清水反复冲洗接触部位","用布巾用力擦拭","涂抹中和药膏后再冲洗","包扎后等待送医处理"],"a":[0],"e":"腐蚀品灼伤第一时间用大量流动清水持续冲洗（至少 15 分钟以上），稀释并冲走化学品，再脱去污染衣物送医。先擦拭会扩大灼伤面积。","k":"化学品灼伤"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"对无骨端外露的开放性伤口出血伤员进行包扎时，正确的做法是（　）。","o":["用敷料覆盖伤口后进行加压包扎","将伤口内的异物拔出后再包扎","用泥土止血后再包扎","暴露伤口自然干燥"],"a":[0],"e":"开放性伤口：覆盖敷料加压包扎止血。伤口内的异物（钢筋、玻璃等）不要自行拔出——拔出可能引发大出血，应由医护人员处理。","k":"包扎原则"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到伤员心脏骤停时，应立即进行心肺复苏。关于按压与人工呼吸的比例，正确的是（　）。","o":["30 次胸外按压配合 2 次人工呼吸","15 次按压配合 5 次人工呼吸","10 次按压配合 10 次人工呼吸","只按压不做人工呼吸"],"a":[0],"e":"成人心肺复苏按压:吹气＝30:2，按压频率 100～120 次/分钟、深度 5～6 厘米，持续到专业急救人员到达或伤员恢复自主呼吸。","k":"心肺复苏比例"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆运载易燃易爆或腐蚀性危险货物时，正确的做法是（　）。","o":["按规定取得相应资质和许可，配备专用车辆并悬挂警示标志","用普通私家车少量运输","与其他货物混装运输","夜间运输躲避检查"],"a":[0],"e":"危险货物运输需专用资质车辆、押运员和许可路线。普通车辆运输危险品属于严重违法行为，发生泄漏后果不堪设想。","k":"危险品运输"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"车辆行经高速公路服务区休息时，正确的做法是（　）。","o":["感到疲劳即进服务区休息，避免疲劳驾驶","坚持到目的地再休息","在应急车道临时停车休息","连续驾驶超过 4 小时也无需休息"],"a":[0],"e":"连续驾驶不得超过 4 小时、休息不少于 20 分钟。服务区休息既守法也防疲劳——疲劳驾驶的反应速度接近酒驾。","k":"服务区休息"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇前方突发自然灾害（山体滑坡、泥石流）时，正确的做法是（　）。","o":["立即减速停车观察，确认安全后再通行或选择绕行，及时向有关部门报告","加速冲过灾害区域","紧跟前车盲目前进","在灾害点附近停车拍照"],"a":[0],"e":"遇自然灾害：停车观察、生命第一，绝不在滑坡、泥石流下方停留；确认无法通行时选择安全路线绕行并报告，帮助预警后方车辆。","k":"自然灾害处置"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"关于安全带的作用，正确的说法是（　）。","o":["发生碰撞时能有效约束乘员身体，大幅降低死亡和重伤风险","只在高速行驶时需要系","后排乘客无须系安全带","安全带会妨碍紧急逃生"],"a":[0],"e":"安全带是车辆碰撞时最重要的被动安全装置：正确系用可使正面碰撞死亡率降低约 57%。前后排都要系，儿童应使用安全座椅。","k":"安全带"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到突发地震等灾害需要紧急避险时，正确的做法是（　）。","o":["减速停车在开阔地带，远离桥梁、隧道、高楼和广告牌","加速通过桥梁尽快离开","停在桥下或隧道内躲避","紧贴高层建筑停车"],"a":[0],"e":"地震避险：减速停车于开阔地带，远离桥梁隧道高楼等易倒塌物；车内是比较安全的避险空间，人员应留在车内观察，听从统一指挥。","k":"地震避险"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到道路交通事故现场有人受伤昏迷并停止呼吸时，在等待急救车的同时应当（　）。","o":["立即就地进行心肺复苏，有条件的配合人工呼吸","掐人中等待伤员苏醒","给伤员喂水唤醒","搬动伤员到阴凉处观察"],"a":[0],"e":"呼吸心跳骤停的黄金抢救时间只有 4 分钟：立即胸外按压＋人工呼吸（30:2），不要浪费时间等待，除非现场有危险必须先转移伤员。","k":"呼吸骤停急救"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆行经高速公路收费站时，正确的做法是（　）。","o":["提前减速，按车道指示依次通行，保持车距防止追尾","临近收费站急刹排队","从 ETC 车道强行通过未安装设备的通道","在收费站前随意变道加塞"],"a":[0],"e":"收费站是高速上的高危节点：提前减速、按标志分道（ETC/人工）、保持车距、不随意变道。ETC 车道需保持规定车速（一般≤20km/h）通过。","k":"收费站通行"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"关于驾驶车辆时的视线盲区，正确的说法是（　）。","o":["车辆A柱、后视镜范围外、车头车尾附近都存在盲区，起步转弯要多观察","配备全景影像的车辆没有盲区","只有货车才有盲区","盲区可以完全通过后视镜消除"],"a":[0],"e":"任何车辆都有盲区：A柱遮挡、后视镜死角、车头车尾低矮区域。起步、转弯、变道都要转头观察补足盲区，宁停三分不强抢一秒。","k":"车辆盲区"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆遇到交通非常拥堵、长时间停滞不前时，正确的做法是（　）。","o":["保持耐心依次排队，关闭发动机减少怠速排放","频繁变道钻空抢行","下车活动堵塞道路","占用应急车道绕行"],"a":[0],"e":"拥堵时依次排队、保持车距、不抢行不加塞，长时间停滞可熄火等待。频繁变道只会让整体通行效率更低，还容易剐蹭。","k":"拥堵耐心"},{"s":"jk4","p":"事故救护常识","c":5,"cn":"事故救护常识","t":"single","q":"驾驶车辆经过事故现场，看到伤员倒地需要救助时，正确的做法是（　）。","o":["在不妨碍交通的前提下停车施以援手，或帮助报警疏导","加速离开避免责任","下车拍照留念","鸣喇叭提醒伤员离开"],"a":[0],"e":"救助他人既是道德义务也受法律保护（民法典“好人条款”：自愿施救造成受助人损害的，救助人不承担民事责任）。在确保安全的前提下应积极施救。","k":"施救义务"}],"jz1":[{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"single","q":"素质教育的核心（时代内涵）是（　）。","o":["以培养学生的创新精神和实践能力为重点","以传授系统的书本知识为重点","以升学考试的成绩为重点","以统一的标准答案为重点"],"a":[0],"e":"素质教育观：以提高国民素质为根本宗旨、面向全体学生、促进学生全面发展、促进学生个性发展、以培养创新精神和实践能力为重点。创新教育是素质教育的核心。","k":"素质教育观"},{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"single","q":"“素质教育面向全体学生”意味着（　）。","o":["让每个学生都得到发展，不放弃任何一个学生","只抓好尖子生","平均用力，不允许学生有差异","只面向学习困难的学生"],"a":[0],"e":"面向全体=人人都有受教育的权利、人人都得到发展，与“英才教育”相对。注意它不是“平均主义”，仍要促进个性发展。","k":"素质教育观"},{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"single","q":"教学过程中，教师“教书育人”强调（　）。","o":["在传授知识的同时引导学生学会做人","只管教书，育人是班主任的事","以分数作为育人成效的唯一标准","育人与教学相互独立"],"a":[0],"e":"教学观“育人”维度：教学过程更看重“教会学生学习”与育人引导，改变重教书轻育人的行为——知识传授与做人教育相统一。","k":"教学观"},{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"single","q":"新课程改革倡导的教学观认为，教学是（　）。","o":["师生交往、积极互动、共同发展的过程","教师单向传授知识的过程","学生被动接受知识的过程","教师单方面表演的过程"],"a":[0],"e":"新课程教学观：教学从“教育者为中心”转向“学习者为中心”，从“教会学生知识”转向“教会学生学习”，从重结论轻过程转向重过程，从关注学科转向关注人。","k":"教学观"},{"s":"jz1","p":"职业理念","c":1,"cn":"学生观","t":"single","q":"“以人为本”的学生观认为，学生是（　）。","o":["发展的人、独特的人、具有独立意义的人","被塑造的原料","教师的附属","标准化批量生产的对象"],"a":[0],"e":"学生观口诀“两独一发”：学生是发展的人（有巨大潜能、处于发展过程、容错）、独特的人（每个学生都有自身独特性）、具有独立意义的人（不由教师意志转移，是学习的主体）。","k":"以人为本的学生观"},{"s":"jz1","p":"职业理念","c":1,"cn":"学生观","t":"single","q":"把学生的错误视为“成长过程中的正常现象”并提供改进机会，体现了学生观中“学生是（　）”的观点。","o":["发展的人","独特的人","具有独立意义的人","完全成熟的人"],"a":[0],"e":"学生是发展的人包含三层：学生的身心发展有规律（要遵循规律）、有巨大发展潜能（不“一刀切”否定）、是处于发展过程中的人（允许犯错、宽容错误）。","k":"学生是发展的人"},{"s":"jz1","p":"职业理念","c":1,"cn":"学生观","t":"single","q":"“一把钥匙开一把锁”，因材施教体现的学生观是（　）。","o":["学生是独特的人","学生是发展的人","学生是具有独立意义的人","学生是被动的接受者"],"a":[0],"e":"每个学生都有自身的独特性——个性差异、认知方式差异，要求教师因材施教，使每个学生在原有基础上得到发展。","k":"学生是独特的人"},{"s":"jz1","p":"职业理念","c":1,"cn":"教师观","t":"single","q":"新课程改革要求教师角色从“知识的传授者”转变为（　）。","o":["学生学习的引导者和促进者","知识的垄断者","课堂的独裁者","标准答案的发布者"],"a":[0],"e":"教师角色转变：从知识传授者→学生学习的引导者和促进者；从课程执行者→课程的建设者和开发者；从教书匠→教育教学的研究者；从学校的教师→社区型开放教师。","k":"教师角色转变"},{"s":"jz1","p":"职业理念","c":1,"cn":"教师观","t":"single","q":"教师在教学中不断反思自己的教学行为、开展教育研究，体现的教师角色是（　）。","o":["教育教学的研究者","课程的执行者","知识的搬运工","纪律的监督员"],"a":[0],"e":"“从教书匠到研究者”：以研究者的心态审视教学，把问题当课题，反思＋行动研究是教师专业发展的重要途径。","k":"教师即研究者"},{"s":"jz1","p":"职业理念","c":1,"cn":"教师观","t":"single","q":"教师对待教学关系，强调“帮助、引导”而不是“灌输、强迫”，体现的行为转变是（　）。","o":["在对待教学关系上，强调帮助、引导","强调尊重、赞赏","强调反思","强调合作"],"a":[0],"e":"教师行为转变四条：对待学生——尊重赞赏；对待教学——帮助引导；对待自我——反思；对待同事——合作。题干是“帮助引导”维度的典型表述。","k":"教师行为转变"},{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"single","q":"素质教育的根本宗旨是（　）。","o":["提高国民素质","升学率的提升","选拔精英人才","统一标准管理"],"a":[0],"e":"素质教育以提高国民素质为根本宗旨，以面向全体学生、促进学生全面发展与个性发展为基本内涵，以创新精神和实践能力培养为重点。","k":"素质教育观"},{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"single","q":"课堂上教师鼓励学生提出不同见解并展开讨论，符合“以人为本”学生观中的（　）。","o":["学生是具有独立意义的人，是学习的主体","学生必须服从教师安排","学生之间没有差异","学生只需要接受结论"],"a":[0],"e":"学生是独立意义的人：独立于教师头脑之外、学习的主体、有自己的意愿与权利。尊重学生的主体地位就要鼓励质疑与参与。","k":"学生是独立意义的人"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教育法与义务教育法","t":"single","q":"《中华人民共和国教育法》规定，我国教育的性质是（　）。","o":["社会主义的公益事业","营利性产业","市场化服务","选择性消费"],"a":[0],"e":"教育是社会主义现代化建设的基础，国家保障教育事业优先发展；教育必须为社会主义现代化建设服务、为人民服务，坚持公益性，不得以营利为目的举办学校及其他教育机构。","k":"教育法"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教育法与义务教育法","t":"single","q":"《义务教育法》规定，我国义务教育的年限和特点是（　）。","o":["九年，具有强制性、普及性、免费性（免学费杂费）","十二年，收费教育","六年，选择性教育","九年，精英教育"],"a":[0],"e":"义务教育实行九年制，是国家统一实施的、所有适龄儿童少年必须接受的教育，具有强制性（必须入学）、普及性、免费性（免除学费杂费）、公共性、均衡发展方向。","k":"义务教育法"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教育法与义务教育法","t":"single","q":"适龄儿童、少年的父母或者其他法定监护人无正当理由未依照规定送适龄儿童少年入学接受义务教育的，首先由（　）给予批评教育，责令限期改正。","o":["当地乡镇人民政府或者县级人民政府教育行政部门","人民法院","公安机关","学校直接处罚家长"],"a":[0],"e":"《义务教育法》规定由当地乡镇政府或县级教育行政部门批评教育、责令限期改正。学校无权直接处罚家长，司法手段是后续途径。","k":"义务教育法"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教育法与义务教育法","t":"single","q":"义务教育学校不得（　）。","o":["分设重点班和非重点班","均衡配置师资","开展课后服务","组织文体活动"],"a":[0],"e":"《义务教育法》明确：学校不得分设重点班和非重点班，应当均衡配置师资、均衡编班，促进教育公平。","k":"义务教育法"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"single","q":"《教师法》规定，教师的平均工资水平应当（　）国家公务员的平均工资水平。","o":["不低于或者高于","略低于","等同于企业职工","由市场自行决定"],"a":[0],"e":"教师的平均工资水平应当不低于或者高于国家公务员的平均工资水平，并逐步提高。中小学教师工资待遇保障是教师法的重点条款。","k":"教师法"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"single","q":"教师资格的认定机构是（　）。","o":["县级以上地方人民政府教育行政部门","所在学校自行认定","人社部门","市场监督管理部门"],"a":[0],"e":"幼儿园、小学、初中教师资格由县级教育行政部门认定；高中、中职教师资格由地（市）级以上教育行政部门认定。教师资格实行终身制基础上的定期注册（在编在岗教师 5 年一注册）。","k":"教师资格制度"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"single","q":"教师对学校侵犯其合法权益的处理决定不服，可以向（　）提出申诉。","o":["教育行政部门","公安机关","市场监管部门","所在班级家长委员会"],"a":[0],"e":"《教师法》赋予教师申诉权：对学校或其他教育机构侵犯其合法权益的处理决定不服，可向教育行政部门提出申诉；教师认为当地政府有关部门侵犯其权益的，可向同级人民政府或上一级人民政府有关部门申诉。","k":"教师申诉制度"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"single","q":"《未成年人保护法》确立的保护未成年人工作应遵循的最有利于未成年人的原则，学校对欺凌行为的处理应当（　）。","o":["及时制止并按规定认定与处置学生欺凌行为，通知双方家长参与处理","淡化处理避免影响声誉","只批评被欺凌者软弱","等情节严重再上报"],"a":[0],"e":"学校应当建立学生欺凌防控工作制度，对欺凌行为立即制止、及时认定与处置，并通知双方父母参与处理；严重的欺凌行为不得隐瞒，应当及时向公安机关、教育行政部门报告。","k":"未成年人保护法（学校保护）"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"single","q":"学校、幼儿园安排未成年人参加集会、文化娱乐等集体活动时，应当（　）。","o":["采取安全措施，防止发生人身安全事故","以活动规模为先","由学生自行负责安全","尽量减少此类活动并禁止参加"],"a":[0],"e":"学校保护要求：组织集体活动应采取安全措施，防止人身安全事故。同时学校对未成年学生在校期间的安全负有教育、管理、保护职责。","k":"学校安全职责"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"single","q":"根据《未成年人保护法》对网络保护的规定，学校发现未成年学生沉迷网络的，应当（　）。","o":["及时告知其父母或其他监护人，共同进行教育和引导","直接开除该学生","公开通报批评警示他人","没收其家庭财产"],"a":[0],"e":"网络保护专章：学校应预防和干预学生沉迷网络，发现后及时告知监护人共同引导；不得为未成年人提供专用上网服务场所内的便利。","k":"网络保护"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"single","q":"教师职业道德的核心和灵魂是（　）。","o":["关爱学生","爱岗敬业","为人师表","教书育人"],"a":[0],"e":"《中小学教师职业道德规范》（三爱两人一终身）：爱国守法、爱岗敬业、关爱学生、教书育人、为人师表、终身学习。其中关爱学生是师德的灵魂。\n【口诀】“三爱两人一终身”。","k":"教师职业道德规范"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"single","q":"教师职业的本质要求是（　）。","o":["爱岗敬业","关爱学生","为人师表","终身学习"],"a":[0],"e":"爱岗敬业是教师职业的本质要求（忠于人民教育事业、认真负责）；关爱学生是师德灵魂；教书育人是天职；为人师表是内在要求；终身学习是发展动力。","k":"师德规范定位"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"single","q":"教师“不以分数作为评价学生的唯一标准”，体现的师德规范是（　）。","o":["教书育人","爱国守法","爱岗敬业","终身学习"],"a":[0],"e":"教书育人：遵循教育规律，实施素质教育，循循善诱、诲人不倦、因材施教，培养学生良好品行，不以分数作为评价学生的唯一标准。","k":"教书育人"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"single","q":"教师利用职务之便向学生家长索要财物，主要违反的师德规范是（　）。","o":["为人师表","终身学习","爱国守法","爱岗敬业"],"a":[0],"e":"为人师表要求廉洁从教、作风正派，不利用职务之便牟取私利。索要财物同时违反廉洁从教与相关法律规定。","k":"为人师表"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"single","q":"教师不断更新知识结构、潜心钻研业务，体现的师德规范是（　）。","o":["终身学习","爱国守法","关爱学生","尊重家长"],"a":[0],"e":"终身学习：崇尚科学精神，树立终身学习理念，拓宽知识视野，更新知识结构，不断提高教育教学水平。","k":"终身学习"},{"s":"jz1","p":"文化素养","c":4,"cn":"历史常识","t":"single","q":"我国历史上第一个统一的中央集权的封建王朝是（　）。","o":["秦朝","汉朝","商朝","唐朝"],"a":[0],"e":"公元前 221 年秦始皇嬴政统一六国建立秦朝，确立皇帝制度、推行郡县制、统一文字货币度量衡。","k":"中国古代史"},{"s":"jz1","p":"文化素养","c":4,"cn":"历史常识","t":"single","q":"科举制度作为选拔官员的制度开始于（　）。","o":["隋朝","唐朝","宋朝","明朝"],"a":[0],"e":"科举制创立于隋（隋炀帝设进士科），唐代完善，宋代改革，明清鼎盛（八股取士），1905 年清末废除。","k":"中国古代史"},{"s":"jz1","p":"文化素养","c":4,"cn":"历史常识","t":"single","q":"“戊戌变法”发生在我国近代史上的（　）。","o":["1898 年","1911 年","1919 年","1840 年"],"a":[0],"e":"戊戌变法（百日维新）发生于 1898 年，由康有为、梁启超等维新派推动。1911 是辛亥革命，1919 是五四运动，1840 是鸦片战争。","k":"中国近代史"},{"s":"jz1","p":"文化素养","c":4,"cn":"文学常识","t":"single","q":"《西游记》的作者是（　）。","o":["吴承恩","罗贯中","施耐庵","曹雪芹"],"a":[0],"e":"四大名著对应作者：《三国演义》罗贯中、《水浒传》施耐庵、《西游记》吴承恩、《红楼梦》曹雪芹（前八十回）。","k":"中国古代文学"},{"s":"jz1","p":"文化素养","c":4,"cn":"文学常识","t":"single","q":"“横眉冷对千夫指，俯首甘为孺子牛”出自鲁迅的诗作（　）。","o":["《自嘲》","《狂人日记》","《呐喊》","《朝花夕拾》"],"a":[0],"e":"该联出自鲁迅《自嘲》。《狂人日记》是中国第一篇现代白话小说，《呐喊》《彷徨》是小说集，《朝花夕拾》是散文集。","k":"中国现当代文学"},{"s":"jz1","p":"文化素养","c":4,"cn":"文学常识","t":"single","q":"创作《命运交响曲》《田园交响曲》的德国音乐家是（　）。","o":["贝多芬","莫扎特","巴赫","肖邦"],"a":[0],"e":"贝多芬（德）共作九部交响曲，《第三“英雄”》《第五“命运”》《第六“田园”》《第九“合唱”》最著名，被称为“乐圣”。","k":"艺术常识"},{"s":"jz1","p":"文化素养","c":4,"cn":"科技常识","t":"single","q":"我国“两弹一星”指的是（　）。","o":["原子弹、导弹和人造卫星","原子弹、氢弹和航天飞机","导弹、卫星和载人飞船","原子弹、卫星和空间站"],"a":[0],"e":"“两弹一星”指原子弹（1964）、导弹（1966 试验成功）和人造卫星（1970 东方红一号），代表人物有钱学森、邓稼先等。","k":"中国科技成就"},{"s":"jz1","p":"文化素养","c":4,"cn":"科技常识","t":"single","q":"世界上第一个将圆周率精确计算到小数点后七位的古代中国科学家是（　）。","o":["祖冲之","张衡","李时珍","沈括"],"a":[0],"e":"南朝祖冲之将圆周率精确到 3.1415926～3.1415927 之间，领先世界近千年。张衡发明地动仪，沈括著《梦溪笔谈》，李时珍著《本草纲目》。","k":"中国古代科技"},{"s":"jz1","p":"文化素养","c":4,"cn":"科技常识","t":"single","q":"我国自主建设、独立运行的全球卫星导航系统是（　）。","o":["北斗卫星导航系统（BDS）","GPS","格洛纳斯（GLONASS）","伽利略（Galileo）"],"a":[0],"e":"北斗系统 2020 年完成全球组网，与美国 GPS、俄罗斯格洛纳斯、欧盟伽利略并列为全球四大卫星导航系统。","k":"中国科技成就"},{"s":"jz1","p":"文化素养","c":4,"cn":"文化常识","t":"single","q":"中国传统“二十四节气”中，表示春季开始的是（　）。","o":["立春","春分","惊蛰","雨水"],"a":[0],"e":"春季节气顺序：立春→雨水→惊蛰→春分→清明→谷雨。二十四节气已列入联合国教科文组织人类非物质文化遗产名录。","k":"传统文化"},{"s":"jz1","p":"文化素养","c":4,"cn":"艺术常识","t":"single","q":"被誉为“画圣”的唐代画家是（　）。","o":["吴道子","王维","张择端","齐白石"],"a":[0],"e":"吴道子被尊为“画圣”，代表作《送子天王图》。张择端是北宋《清明上河图》作者，王维是唐代山水田园诗人画家，齐白石是近现代国画大师。","k":"艺术常识"},{"s":"jz1","p":"基本能力","c":5,"cn":"逻辑思维能力","t":"single","q":"“所有的教师都是受过专业训练的，王老师是教师，所以王老师是受过专业训练的。”这个推理属于（　）。","o":["演绎推理（三段论）","归纳推理","类比推理","循环论证"],"a":[0],"e":"从一般性前提推出个别性结论的三段论演绎推理：大前提＋小前提→结论。结论已包含在前提之中，前提真则结论必真。","k":"逻辑推理"},{"s":"jz1","p":"基本能力","c":5,"cn":"逻辑思维能力","t":"single","q":"命题“并非所有学生都及格了”，与下列命题意思等价的是（　）。","o":["有的学生没有及格","所有学生都没有及格","有的学生及格了","多数学生及格了"],"a":[0],"e":"“并非所有……都”＝“有的……不”。全称肯定命题的否定等值于特称否定命题。注意与“所有学生都不及格”区分。","k":"命题等价"},{"s":"jz1","p":"基本能力","c":5,"cn":"逻辑思维能力","t":"single","q":"概念“中学生”与“共产党员”的外延关系是（　）。","o":["交叉关系","全同关系","全异关系","包含关系"],"a":[0],"e":"有的中学生是共产党员、有的共产党员是中学生，两者外延部分重合，为交叉关系。全同＝外延完全重合；包含＝一个全在另一个之内。","k":"概念间关系"},{"s":"jz1","p":"基本能力","c":5,"cn":"信息处理能力","t":"single","q":"教师在 Word 文档中想把多页表格的标题行在每一页重复显示，应使用的功能是（　）。","o":["表格属性中的“重复标题行”","逐页手动复制标题","插入分节符","设置页眉即可自动实现"],"a":[0],"e":"Word 表格工具布局选项卡中有“重复标题行”功能，跨页表格每页自动显示标题行。页眉是页面统一的文字，无法替代表格标题行功能。","k":"信息处理（Word）"},{"s":"jz1","p":"基本能力","c":5,"cn":"信息处理能力","t":"single","q":"在 Excel 中，求 B2:B10 单元格区域平均值的正确公式是（　）。","o":["=AVERAGE(B2:B10)","=SUM(B2:B10)/2","=AVG(B2:B10)","=MEAN(B2:B10)"],"a":[0],"e":"平均值函数为 AVERAGE，求和为 SUM。Excel 没有 AVG、MEAN 函数。函数均以“=”开头。","k":"信息处理（Excel）"},{"s":"jz1","p":"基本能力","c":5,"cn":"阅读理解能力","t":"single","q":"阅读材料题中要求“概括作者的主要观点”，正确的做法是（　）。","o":["提炼材料中心论点，用自己的语言客观概括","大段抄录原文首尾","加入个人立场进行驳斥","罗列所有细节以示全面"],"a":[0],"e":"概括观点题：找中心句与关键词，区分观点与论据，用自己的语言简洁转述，不歪曲、不添加、不遗漏核心要点。","k":"阅读理解"},{"s":"jz1","p":"基本能力","c":5,"cn":"写作能力","t":"single","q":"教师资格考试写作题审题立意的正确做法是（　）。","o":["抓住材料关键词与逻辑关系，确定贴合教师职业视角的立意","套用背诵的范文不改内容","脱离材料自由发挥","只写名言警句堆砌"],"a":[0],"e":"写作题关键在审题：抓材料核心关键词、理清内在逻辑关系（并列、递进、对立），结合教师职业与教育视角立意，做到观点明确、结构完整、论据充实。","k":"写作能力"},{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"single","q":"“减负”并提高课堂效率，要求教师把学习的主动权（　）。","o":["还给学生，让学生成为学习的主人","交给家长配合完成","交给教辅资料","交给考试大纲"],"a":[0],"e":"素质教育要求改变学生被动学习、苦学负担重的状况，激发学习兴趣、教会学习方法，把学习主动权还给学生——减负与提质并行。","k":"素质教育观"},{"s":"jz1","p":"职业理念","c":1,"cn":"教师观","t":"single","q":"教师参与校本课程开发，体现的角色转变是（　）。","o":["从课程的执行者转变为课程的建设者和开发者","从研究者转变为执行者","从促进者转变为传授者","从开放型转变为封闭型"],"a":[0],"e":"新课程实行国家、地方、学校三级课程管理，教师不再是课程的被动执行者，而是课程的建设者与开发者，参与课程资源的开发与利用。","k":"教师角色转变"},{"s":"jz1","p":"职业理念","c":1,"cn":"学生观","t":"single","q":"教师公平对待每一位学生，不因成绩、家庭背景区别对待，体现的是（　）。","o":["面向全体学生的素质教育观","因材施教的个别化教学","精英教育理念","分层淘汰制度"],"a":[0],"e":"面向全体与公平对待是素质教育的底线要求；在此基础上通过因材施教实现个性发展——两者并行不悖。","k":"素质教育观"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"single","q":"依照《教师法》，学校或者其他教育机构对教师进行考核的内容不包括（　）。","o":["家庭财产状况","政治思想","业务水平","工作态度和工作成绩"],"a":[0],"e":"考核内容包括政治思想、业务水平、工作态度和工作成绩，应当客观、公正、准确，听取教师本人、其他教师和学生的意见。家庭财产不是考核内容。","k":"教师考核"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"single","q":"学校对未成年学生进行的法治教育、安全教育和自我保护教育，属于未成年人保护体系中的（　）。","o":["学校保护","家庭保护","社会保护","司法保护"],"a":[0],"e":"《未成年人保护法》分家庭、学校、社会、网络、政府、司法六大保护。学校组织实施的教育教学与安全管理行为属于学校保护。","k":"六大保护"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"single","q":"取得教师资格应当具备的相应学历要求中，取得小学教师资格应当具备（　）。","o":["中等师范学校毕业及其以上学历（现行要求为大专及以上学历）","高中学历即可","硕士以上学位","无学历要求"],"a":[0],"e":"《教师法》规定了各级教师资格的学历门槛：小学教师为中等师范学校毕业及以上（随着教师法修订与实际招考，现行普遍要求大专及以上）；初中要求高等师范专科及以上；高中要求本科及以上。","k":"教师资格学历"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教育法与义务教育法","t":"single","q":"国家对义务教育实行免试就近入学的目的是（　）。","o":["保障适龄儿童少年平等接受义务教育的权利，促进教育公平","提高重点中学升学率","减轻财政负担","便于选拔生源"],"a":[0],"e":"免试就近入学是义务教育均衡发展与教育公平的制度安排，禁止以考试、竞赛等方式选拔生源。","k":"义务教育法"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"single","q":"根据《未成年人保护法》，对违法犯罪的未成年人，实行的方针是（　）。","o":["教育、感化、挽救","从严、从重、从快","隔离、管束、惩罚","警告、罚款、拘留"],"a":[0],"e":"对违法犯罪的未成年人坚持教育为主、惩罚为辅的原则，实行教育、感化、挽救的方针，尊重其人格尊严，保障其合法权益。","k":"司法保护"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"single","q":"“不以任何理由歧视、侮辱学生，不体罚或变相体罚学生”体现的师德规范是（　）。","o":["关爱学生","终身学习","爱国守法","爱岗敬业"],"a":[0],"e":"关爱学生要求：关心爱护全体学生，尊重学生人格，平等公正对待学生；对学生严慈相济；不体罚或变相体罚学生；保护学生安全与合法权益。","k":"关爱学生"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"single","q":"教师有下列情形之一的，由所在学校、其他教育机构或者教育行政部门给予行政处分或者解聘，情节严重构成犯罪的依法追究刑事责任。下列不属于该情形的是（　）。","o":["因与学生家长沟通不畅而心生委屈","故意不完成教学任务给教育教学工作造成损失","体罚学生经教育不改的","品行不良侮辱学生影响恶劣的"],"a":[0],"e":"《教师法》第三十七条列举了可予处分或解聘的三种情形：故意不完成教学任务造成损失、体罚学生经教育不改、品行不良侮辱学生造成恶劣影响。与家长沟通受委屈不属于法定解聘情形。","k":"教师法"},{"s":"jz1","p":"文化素养","c":4,"cn":"历史常识","t":"single","q":"与“郑和下西洋”发生于同一朝代的重大历史事件是（　）。","o":["《永乐大典》的编纂","文景之治","贞观之治","康熙平定三藩"],"a":[0],"e":"郑和七下西洋发生在明代永乐至宣德年间，《永乐大典》同为永乐年间编纂。文景之治属西汉，贞观之治属唐，平定三藩属清。","k":"中国古代史"},{"s":"jz1","p":"文化素养","c":4,"cn":"文学常识","t":"single","q":"“但愿人长久，千里共婵娟”的作者是（　）。","o":["苏轼","李白","杜甫","白居易"],"a":[0],"e":"出自苏轼《水调歌头·明月几时有》。苏轼为北宋豪放派代表，号东坡居士。","k":"中国古代文学"},{"s":"jz1","p":"文化素养","c":4,"cn":"文学常识","t":"single","q":"中国现代文学史上创作了《骆驼祥子》《茶馆》的作家是（　）。","o":["老舍","巴金","茅盾","沈从文"],"a":[0],"e":"老舍（舒庆春）被称为“人民艺术家”，代表作长篇小说《骆驼祥子》《四世同堂》、话剧《茶馆》《龙须沟》。巴金著《家》《春》《秋》，茅盾著《子夜》，沈从文著《边城》。","k":"中国现当代文学"},{"s":"jz1","p":"文化素养","c":4,"cn":"科技常识","t":"single","q":"东汉张衡发明的水运浑天仪和候风地动仪，主要与下列哪一领域的成就相关（　）。","o":["天文学与地震监测","医学与药学","农学与水利","数学与历法"],"a":[0],"e":"张衡是天文学家：浑天仪演示天象，候风地动仪用于测报地震方向，属天文学与地震监测领域成就。","k":"中国古代科技"},{"s":"jz1","p":"文化素养","c":4,"cn":"文化常识","t":"single","q":"科举考试中，殿试录取的进士第一名称为（　）。","o":["状元","榜眼","探花","解元"],"a":[0],"e":"殿试前三名为状元、榜眼、探花；乡试第一名称解元，会试第一名称会元。“连中三元”指乡试、会试、殿试均得第一。","k":"科举文化"},{"s":"jz1","p":"基本能力","c":5,"cn":"逻辑思维能力","t":"single","q":"“只有年满十八周岁，才有选举权；小李未满十八周岁，所以小李没有选举权。”这个推理的形式是（　）。","o":["必要条件推理：否定前件则否定后件","充分条件推理：肯定前件则肯定后件","归纳推理","类比推理"],"a":[0],"e":"“只有P，才Q”中P是Q的必要条件。必要条件推理规则：否定前件就要否定后件；肯定后件才能肯定前件。本题符合“否定前件→否定后件”，推理有效。","k":"必要条件推理"},{"s":"jz1","p":"基本能力","c":5,"cn":"逻辑思维能力","t":"single","q":"由“甲班有的同学会游泳”为真，可以推出一定为真的是（　）。","o":["甲班并非所有同学都不会游泳","甲班所有同学都会游泳","甲班所有同学都不会游泳","甲班班长会游泳"],"a":[0],"e":"“有的会”为真，则其矛盾命题“所有都不会”必假，即“并非所有都不会”为真。“有的会”不能推出“所有会”，也不能确定具体某个人会。","k":"直言命题对当关系"},{"s":"jz1","p":"基本能力","c":5,"cn":"信息处理能力","t":"single","q":"教师用 PowerPoint 制作课件，希望所有幻灯片采用统一的外观（字体、配色、版式），最高效的做法是（　）。","o":["使用（或自定义）幻灯片母版","逐页手动设置格式","全部使用空白页再随意排版","每页插入相同的文本框"],"a":[0],"e":"幻灯片母版统一定义字体、配色、版式与占位符位置，修改母版即可全局生效——这是课件制作规范且高效的方式。","k":"信息处理（PPT）"},{"s":"jz1","p":"基本能力","c":5,"cn":"阅读理解能力","t":"single","q":"阅读理解题中，文中“然而”“但是”一类转折词之后的内容往往（　）。","o":["是作者重点强调的观点所在","是可以忽略的插入语","一定是引用他人观点","与文章主旨无关"],"a":[0],"e":"转折关联词（然而、但是、却）之后通常是语义重心，阅读理解要特别关注转折后的表述，它常常承载作者的真实观点。","k":"阅读理解"},{"s":"jz1","p":"基本能力","c":5,"cn":"写作能力","t":"single","q":"议论文写作中，分论点与中心论点的关系应当是（　）。","o":["分论点从不同角度支撑中心论点，不偏离不冲突","分论点各自独立与中心论点无关","分论点数量越多越好","分论点之间必须互相矛盾"],"a":[0],"e":"议论文结构：中心论点统领，分论点从“是什么、为什么、怎么办”等不同维度展开支撑，彼此不冲突、不游离，论据紧扣分论点。","k":"写作能力"},{"s":"jz1","p":"职业理念","c":1,"cn":"教师观","t":"multi","q":"新课程改革倡导的教师角色转变包括（　）。","o":["从教师与学生的关系看，学生学习的促进者","从教学与课程的关系看，课程的建设者和开发者","从教学与研究的关系看，教育教学的研究者","从学校与社区的关系看，社区型开放教师","从教师与家长的关系看，家长利益的代言人"],"a":[0,1,2,3],"e":"新课程教师角色“四人”：学生学习的促进者、教育教学的研究者、课程的建设者和开发者、社区型开放教师。教师应与家长真诚沟通，但不是家长利益的代言人。","k":"教师角色转变"},{"s":"jz1","p":"职业理念","c":1,"cn":"教育观","t":"multi","q":"素质教育的基本内涵包括（　）。","o":["以提高国民素质为根本宗旨","面向全体学生","促进学生全面发展","促进学生个性发展","以升学考试为主要目标"],"a":[0,1,2,3],"e":"素质教育五条基本内涵：提高国民素质（宗旨）、面向全体、促进全面发展、促进个性发展、培养创新精神与实践能力（重点）。以升学为目标是应试教育特征。","k":"素质教育观"},{"s":"jz1","p":"职业理念","c":1,"cn":"学生观","t":"multi","q":"贯彻“以人为本”的学生观，教师应当（　）。","o":["遵循学生身心发展规律开展教育教学","看到学生的发展潜能，不轻易否定学生","尊重学生的个体差异，因材施教","把学生视为学习的主体，调动其主动性","以教师权威压制学生不同意见"],"a":[0,1,2,3],"e":"以人为本学生观的实践要求：发展的人（遵循规律、看到潜能、宽容错误）、独特的人（因材施教）、独立意义的人（尊重主体地位）。压制不同意见违背学生主体观。","k":"以人为本的学生观"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"multi","q":"《未成年人保护法》确立的未成年人保护体系包括（　）。","o":["家庭保护","学校保护","社会保护","网络保护与政府保护","司法保护"],"a":[0,1,2,3,4],"e":"现行《未成年人保护法》构建六大保护：家庭保护、学校保护、社会保护、网络保护、政府保护、司法保护，形成全链条保护体系。","k":"未成年人保护法"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"multi","q":"根据《教师法》，教师享有的权利包括（　）。","o":["进行教育教学活动，开展教育教学改革和实验","从事科学研究、学术交流，参加专业的学术团体","指导学生的学习和发展，评定学生的品行和学业成绩","按时获取工资报酬，享受国家规定的福利待遇","对学生没收个人财物并自行处置"],"a":[0,1,2,3],"e":"教师六项权利：教育教学权、科学研究权、指导评价权、获取报酬权、民主管理权、进修培训权。没收并处置学生财物侵犯学生财产权，属违法行为。","k":"教师的权利"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"multi","q":"《中小学教师职业道德规范》的主要内容包括（　）。","o":["爱国守法","爱岗敬业","关爱学生","教书育人","为人师表与终身学习"],"a":[0,1,2,3,4],"e":"六条规范：爱国守法（基本要求）、爱岗敬业（本质要求）、关爱学生（师德灵魂）、教书育人（天职）、为人师表（内在要求）、终身学习（发展动力）。“三爱两人一终身”。","k":"教师职业道德规范"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"multi","q":"教师违反师德、可能受到处分的行为包括（　）。","o":["体罚或变相体罚学生","组织、参与有偿补课","索要或收受学生及家长财物","在招生考试中徇私舞弊","利用课余时间读书学习"],"a":[0,1,2,3],"e":"师德失范行为清单包含体罚、有偿补课、索贿受贿、考试舞弊、歧视侮辱学生等。读书学习是终身学习规范倡导的行为。","k":"师德失范行为"},{"s":"jz1","p":"文化素养","c":4,"cn":"文学常识","t":"multi","q":"下列作品中，属于鲁迅著作的有（　）。","o":["《呐喊》","《彷徨》","《朝花夕拾》","《子夜》","《家》"],"a":[0,1,2],"e":"鲁迅：《呐喊》《彷徨》（小说集）、《朝花夕拾》（散文集）、《野草》（散文诗集）。《子夜》是茅盾的，《家》是巴金的。","k":"中国现当代文学"},{"s":"jz1","p":"文化素养","c":4,"cn":"科技常识","t":"multi","q":"下列属于中国古代四大发明的有（　）。","o":["造纸术","印刷术","指南针","火药","地动仪"],"a":[0,1,2,3],"e":"四大发明：造纸术、印刷术（雕版与活字）、指南针、火药。地动仪是张衡的杰出发明但不属于四大发明。","k":"中国古代科技"},{"s":"jz1","p":"基本能力","c":5,"cn":"逻辑思维能力","t":"multi","q":"下列关于逻辑基本规律的说法中，正确的有（　）。","o":["同一律要求在同一思维过程中概念和判断保持同一","矛盾律要求两个互相矛盾的判断不能同真","排中律要求两个互相矛盾的判断不能同假","充足理由律要求断定为真必须有充分理由","违反矛盾律的思维就是违反了同一律"],"a":[0,1,2,3],"e":"逻辑四大基本规律各自独立：同一律（保持同一）、矛盾律（不能同真）、排中律（不能同假）、充足理由律（有据为真）。E 混淆了不同规律——违反矛盾律不等于违反同一律。","k":"逻辑基本规律"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教育法与义务教育法","t":"multi","q":"根据《教育法》，受教育者在入学、升学、就业等方面依法享有的权利包括（　）。","o":["平等受教育的权利","对学校给予的处分不服向有关部门提出申诉","使用教育教学设施、设备、图书资料","在学业成绩和品行上获得公正评价","随意旷课而不受约束"],"a":[0,1,2,3],"e":"受教育者权利：平等受教育权、使用设施权、获得评价权、申诉权、法律规定其他权利。义务教育阶段学生同时须履行按时入学、遵规守纪的义务。","k":"受教育者的权利"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"multi","q":"学校保护未成年人应当做的工作包括（　）。","o":["建立学生欺凌防控制度","对教职工进行未成年人保护培训","保障未成年学生课间正常活动","对进入校园的人员进行登记检查","组织学生参与商业性活动创收"],"a":[0,1,2,3],"e":"学校保护职责涵盖欺凌防控、安全培训、课间活动保障、出入管理等。学校不得组织未成年人参与商业性活动，不得利用学校资源牟利。","k":"学校保护"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"未成年人保护法","t":"multi","q":"根据《未成年人保护法》，任何组织或个人不得披露未成年人的（　）。","o":["个人隐私","个人电子信息中的私密信息","学生的荣誉记录","家庭住址等个人信息（未经监护人同意且无正当理由）","在校成绩排名（依法依规公示的范围外）"],"a":[0,1,3],"e":"保护未成年人隐私权与个人信息：不得披露隐私与私密信息；处理满十四周岁未成年人个人信息须征得监护人同意。荣誉记录与依规公示的成绩管理不属于禁止披露范围。","k":"隐私与个人信息保护"},{"s":"jz1","p":"教育法律法规","c":2,"cn":"教师法","t":"multi","q":"教师应当履行的义务包括（　）。","o":["遵守宪法、法律和职业道德，为人师表","贯彻国家的教育方针，完成教学工作任务","对学生进行宪法所确定的基本原则的教育和爱国主义教育","制止有害于学生的行为或者其他侵犯学生合法权益的行为","对学生家长的相关事务无条件满足"],"a":[0,1,2,3],"e":"教师六项义务：遵守宪法法律与职业道德、贯彻方针完成教学任务、进行思想政治教育、爱护学生制止侵害、不断提高思想政治觉悟与业务水平。对家长事务“无条件满足”不是教师义务。","k":"教师的义务"},{"s":"jz1","p":"文化素养","c":4,"cn":"文学常识","t":"multi","q":"下列称号与人物对应正确的有（　）。","o":["诗仙——李白","诗圣——杜甫","诗鬼——李贺","词圣——苏轼（词作成就而言常称东坡居士）","书圣——吴道子"],"a":[0,1,2],"e":"李白“诗仙”、杜甫“诗圣”、李贺“诗鬼”。“书圣”是东晋王羲之（书法），吴道子是“画圣”；词成就最高者之一是苏轼但无“词圣”固定称谓。","k":"古代文学称号"},{"s":"jz1","p":"文化素养","c":4,"cn":"历史常识","t":"multi","q":"下列成语典故与其历史人物对应正确的有（　）。","o":["卧薪尝胆——勾践","完璧归赵——蔺相如","负荆请罪——廉颇","纸上谈兵——赵括","闻鸡起舞——岳飞"],"a":[0,1,2,3],"e":"“闻鸡起舞”是东晋祖逖与刘琨的故事，不是岳飞。其余对应均正确：勾践卧薪尝胆、蔺相如完璧归赵、廉颇负荆请罪、赵括纸上谈兵。","k":"历史典故"},{"s":"jz1","p":"文化素养","c":4,"cn":"科技常识","t":"multi","q":"下列成就属于我国载人航天工程的有（　）。","o":["神舟五号实现首次载人航天飞行","神舟十一号与天宫二号对接","嫦娥一号绕月探测","天问一号火星探测","空间站建造任务实施"],"a":[0,1,4],"e":"载人航天工程以神舟系列与空间站为代表（杨利伟乘神舟五号 2003 年首飞）。嫦娥工程是探月工程，天问一号是行星探测工程——均不属于载人航天序列。","k":"中国航天"},{"s":"jz1","p":"基本能力","c":5,"cn":"逻辑思维能力","t":"multi","q":"由“有些教师喜欢文学”为真，下列判断中不能确定真假的包括（　）。","o":["所有教师都喜欢文学","有些教师不喜欢文学","王老师（教师）喜欢文学","并非所有教师都喜欢文学"],"a":[0,1,2],"e":"“有些P”为真时：“所有P”与“所有非P”真假不定，“王老师”是否属于“有些”也不确定；只能确定其矛盾命题“所有教师都不喜欢文学”为假（即“并非所有教师都不喜欢文学”为真）。\n【规则】“有些”仅否定全称否定命题。","k":"直言命题推理"},{"s":"jz1","p":"职业理念","c":1,"cn":"教师观","t":"multi","q":"教师教学行为转变的表现包括（　）。","o":["在对待学生上，由重知识传授转向尊重与赞赏","在对待教学上，由灌输转向帮助与引导","在对待自我上，由被动执行转向积极反思","在对待与其他教育者的关系上，由孤军奋战转向合作","在对待评价上，由多元评价转向只看考试分数"],"a":[0,1,2,3],"e":"教师教学行为四转变：尊重赞赏、帮助引导、反思、合作。只看分数是“重结论轻过程”的旧评价观，与新课程评价改革（发展性评价）相悖。","k":"教师行为转变"},{"s":"jz1","p":"教师职业道德","c":3,"cn":"教师职业道德","t":"multi","q":"教师践行“关爱学生”规范，应当做到（　）。","o":["关心爱护全体学生","尊重学生人格，平等公正对待学生","对学生严慈相济，做学生的良师益友","保护学生安全，关心学生健康，维护学生权益","对成绩好的学生偏爱有加"],"a":[0,1,2,3],"e":"关爱学生强调“全体学生”与“平等公正”，偏爱成绩好的学生违背教育公平，也是最常见的师德失范情形之一。","k":"关爱学生"},{"s":"jz1","p":"基本能力","c":5,"cn":"信息处理能力","t":"multi","q":"教师在利用网络教育资源时，正确的做法包括（　）。","o":["优先选用权威教育平台和官方发布的资源","注意甄别资源的科学性与时效性","尊重知识产权，注明资源来源","未经授权将付费资源直接售卖牟利","结合学情对资源进行二次加工"],"a":[0,1,2,4],"e":"网络资源利用原则：权威来源、甄别真伪与时效、尊重版权注明出处、结合学情二次开发。未经授权售卖付费资源侵犯知识产权。","k":"网络教育资源利用"},{"s":"jz1","p":"文化素养","c":4,"cn":"艺术常识","t":"multi","q":"下列关于中国传统文化艺术的说法中，正确的有（　）。","o":["京剧被视为中国国粹，分生旦净丑四大行当","书法“颜筋柳骨”指颜真卿与柳公权的楷书风格","古琴是中国最早的弹拨乐器之一，被列入人类非物质文化遗产","《清明上河图》描绘的是北宋汴京（开封）的城市风貌","昆曲起源于元代大都（今北京）"],"a":[0,1,2,3],"e":"昆曲起源于元末明初的江苏昆山一带，不是大都。京剧四大行当、颜筋柳骨、古琴非遗、清明上河图与汴京的对应均正确。","k":"传统艺术"}],"kj":[{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"会计的最基本职能是（　）。","o":["核算职能","监督职能","预测职能","决策职能"],"a":[0],"e":"会计核算（反映）是最基本职能，贯穿经济业务事前、事中、事后全过程；监督（控制）是与之并列的基本职能。预测、决策属于拓展职能。","k":"会计的职能"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"企业以取得收取款项的权利或支付款项的义务为基础确认收入和费用，这一记账基础称为（　）。","o":["权责发生制","收付实现制","永续盘存制","实地盘存制"],"a":[0],"e":"企业会计的确认、计量和报告以权责发生制为基础——按权利义务的归属期确认，而非按现金收付。收付实现制主要用于行政事业单位预算会计。","k":"权责发生制"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"下列各项中，属于流动资产的是（　）。","o":["存货","固定资产","无形资产","长期股权投资"],"a":[0],"e":"流动资产是预计在一个正常营业周期内变现、出售或耗用的资产，包括货币资金、交易性金融资产、应收款项、存货等。固定资产、无形资产、长期股权投资属于非流动资产。","k":"会计要素（资产）"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"企业购入原材料一批已验收入库，货款尚未支付。该项业务对会计等式的影响是（　）。","o":["资产增加，负债增加","资产内部一增一减","资产增加，所有者权益增加","负债减少，资产减少"],"a":[0],"e":"购料未付款：原材料（资产）增加，应付账款（负债）增加——等式两边同增，总额平衡。“资产＝负债＋所有者权益”恒等关系不受影响。","k":"会计等式"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"借贷记账法下，负债类账户的结构特点是（　）。","o":["贷方登记增加，借方登记减少，期末余额一般在贷方","借方登记增加，贷方登记减少","借贷方均登记增加","无余额"],"a":[0],"e":"负债及所有者权益类账户：贷方记增加、借方记减少，余额在贷方。与资产类账户（借增贷减，余额在借方）方向相反。","k":"借贷记账法","fig":"taccount"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"总分类账户与明细分类账户平行登记的要点不包括（　）。","o":["登记的原始凭证不同","会计期间相同","借贷方向相同","登记金额相等"],"a":[0],"e":"平行登记“四同”：同依据、同期间、同方向、同金额——总账与明细账使用的是同一原始凭证，A 恰是相同点而非不同点。\n【核对关系】总账余额＝所属明细账余额之和。","k":"平行登记"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"企业对财产物资进行清查时，对库存现金的清查方法是（　）。","o":["实地盘点法","技术推算法","函证核对法","抽样检查法"],"a":[0],"e":"库存现金采用实地盘点（突击盘点），编制库存现金盘点报告表；银行存款采用与银行对账单核对（编制余额调节表）；往来款项用函证核对。","k":"财产清查"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"single","q":"下列各项中，属于会计信息质量要求中“谨慎性”体现的是（　）。","o":["对存货计提跌价准备","对购入的设备计提折旧","按实际成本计量存货","编制资产负债表"],"a":[0],"e":"谨慎性要求不高估资产和收益、不低估负债和费用：计提减值准备、加速折旧是典型应用。计提折旧是正常的成本分摊，购入设备按实际成本是历史成本计量。","k":"会计信息质量要求"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业现金清查中发现库存现金短款，无法查明原因的部分，经批准后应计入（　）。","o":["管理费用","营业外支出","其他应收款","财务费用"],"a":[0],"e":"现金短缺：有责任人的计入其他应收款（应向责任人赔偿），无法查明原因的计入管理费用。现金溢余无法查明原因的计入营业外收入——方向相反，注意对比。","k":"库存现金清查"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业销售商品一批，价款 100 000 元，增值税销项税额 13 000 元，代购货单位垫付运费 2 000 元。该企业应确认的应收账款金额为（　）。","o":["115 000 元","100 000 元","113 000 元","102 000 元"],"a":[0],"e":"应收账款入账金额＝价款＋增值税销项税额＋代垫运杂费＝100 000＋13 000＋2 000＝115 000 元。\n【公式】应收账款＝售价×(1＋税率)＋代垫费用。","k":"应收账款入账价值"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业采用备抵法核算应收款项减值，计提坏账准备时应借记的科目是（　）。","o":["信用减值损失","管理费用","资产减值损失","坏账准备"],"a":[0],"e":"计提坏账准备：借记“信用减值损失”，贷记“坏账准备”（坏账准备是应收款项的备抵科目）。实际发生坏账核销时才借记坏账准备、贷记应收账款。","k":"应收款项减值"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业购入交易性金融资产（以公允价值计量且其变动计入当期损益），持有期间公允价值上升，应贷记的科目是（　）。","o":["公允价值变动损益","投资收益","其他综合收益","营业外收入"],"a":[0],"e":"交易性金融资产持有期间的公允价值变动计入当期损益：上升借记“交易性金融资产——公允价值变动”，贷记“公允价值变动损益”。处置时的价差再计入投资收益。","k":"交易性金融资产"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"下列各项中，不应计入存货采购成本的是（　）。","o":["入库后的仓储费用","购买价款","运输途中的合理损耗","入库前的挑选整理费用"],"a":[0],"e":"存货采购成本＝购买价款＋相关税费＋运输费、装卸费、保险费＋入库前的挑选整理费等。入库后的仓储费用计入当期损益（管理费用等），不计入存货成本。","k":"存货成本"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"某企业采用月末一次加权平均法核算发出存货。月初库存 A 材料 100 件、成本 1 000 元；本月购入 300 件、成本 3 600 元；本月发出 200 件。本月发出材料的成本为（　）。","o":["2 300 元","2 000 元","2 400 元","1 150 元"],"a":[0],"e":"加权平均单位成本＝(1 000＋3 600)÷(100＋300)＝4 600÷400＝11.5 元/件；发出成本＝200×11.5＝2 300 元。\n【公式】一次算出平均单价，再乘发出数量。","k":"月末一次加权平均法"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"期末存货成本高于其可变现净值时，企业应当（　）。","o":["按可变现净值计量，计提存货跌价准备","仍按成本计量不作处理","按两者之和计量","将差额计入营业外支出"],"a":[0],"e":"存货按成本与可变现净值孰低计量：成本高于可变现净值的差额计提存货跌价准备（借记资产减值损失——存货跌价损失）。以前减记的影响已消除的，可在原计提范围内转回。","k":"存货跌价准备"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业购入一台需要安装的设备，价款及增值税、安装费合计 113 万元（其中价款 100 万元、增值税 13 万元），安装完成后该固定资产的入账价值为（　）。（增值税可抵扣）","o":["100 万元（价款＋安装费，不含可抵扣增值税）","113 万元","13 万元","87 万元"],"a":[0],"e":"增值税一般纳税人购入设备，进项税额 13 万元可抵扣，不计入固定资产成本；入账价值＝价款＋运输费＋安装费等相关支出（不含可抵扣增值税）。需要安装的设备通过“在建工程”归集，安装完工转入固定资产。","k":"固定资产入账价值"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"某企业一项固定资产原值 100 万元，预计净残值 4 万元，预计使用年限 5 年，采用年限平均法计提折旧。该设备年折旧额为（　）。","o":["19.2 万元","20 万元","19.6 万元","18 万元"],"a":[0],"e":"年限平均法：年折旧额＝(原值−预计净残值)÷预计使用年限＝(100−4)÷5＝19.2 万元；年折旧率＝19.2÷100＝19.2%。\n【公式】“原值减残值，除以年限”。","k":"年限平均法折旧"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业对其一台设备采用双倍余额递减法计提折旧，原值 100 万元，预计使用 5 年（不考虑残值因素影响前期计算）。第一年应计提的折旧额为（　）。","o":["40 万元","20 万元","38.4 万元","50 万元"],"a":[0],"e":"双倍余额递减法：年折旧率＝2÷预计使用年限＝2÷5＝40%；第一年折旧＝原值×40%＝40 万元（前期不考虑净残值，最后两年改为平均法并扣除残值）。\n【对比】加速折旧前期折旧大、后期小。","k":"双倍余额递减法"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业出售一台不需用的设备，取得价款 50 万元，该设备账面价值 42 万元，发生清理费用 2 万元（不考虑税费）。该处置业务对企业当期损益的影响是（　）。","o":["资产处置收益增加 6 万元","营业外收入增加 6 万元","资产处置损失增加 6 万元","不影响当期损益"],"a":[0],"e":"出售固定资产（非报废毁损）的处置损益计入“资产处置收益”：50−42−2＝6 万元收益。因自然灾害等报废毁损产生的损益才计入营业外收支。\n【区分】主动处置＝资产处置收益；被动报废＝营业外收支。","k":"固定资产处置"},{"s":"kj","p":"资产","c":2,"cn":"无形资产及其他","t":"single","q":"下列关于无形资产摊销的说法中，正确的是（　）。","o":["使用寿命有限的无形资产，其摊销额自可供使用当月起开始摊销","所有无形资产都必须摊销","无形资产摊销一律计入管理费用","使用寿命不确定的无形资产按 10 年摊销"],"a":[0],"e":"无形资产“当月增加当月摊销”（与固定资产当月增加下月计提相反）。使用寿命有限的自可供使用当月起摊销，使用寿命不确定的不摊销（每年减值测试）。摊销去向按受益对象：自用计入管理费用、出租计入其他业务成本等。","k":"无形资产摊销"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"企业预提短期借款利息时，应借记的科目是（　）。","o":["财务费用","管理费用","短期借款","应付利息是贷方科目"],"a":[0],"e":"短期借款利息按月预提：借记“财务费用”，贷记“应付利息”；支付时借记应付利息、贷记银行存款。借款利息一律属于筹资性支出，计入财务费用。","k":"短期借款利息"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"下列各项中，不属于职工薪酬核算内容的是（　）。"," e":"追加投资使所有者权益总额增加。盈余公积补亏、提取盈余公积、资本公积转增资本都只是所有者权益内部“左口袋换右口袋”，总额不变。\n【判断技巧】看是否动了“外钱”：有钱从外面进来（投资、利润）才变总额。","k":"所有者权益变动"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"single","q":"企业接受投资者投入的一台设备（不属于出资额超出其注册资本份额的情形），该业务会导致（　）。","o":["实收资本增加，固定资产增加","资本公积增加","盈余公积增加","负债增加"],"a":[0],"e":"投资者投入设备：借记固定资产，贷记实收资本（在注册资本内份额）与资本公积（溢价部分）。本题未提溢价，按实收资本增加处理。","k":"实收资本"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"single","q":"下列各项中，属于企业留存收益的是（　）。","o":["盈余公积和未分配利润","实收资本和资本公积","盈余公积和资本公积","未分配利润和应付股利"],"a":[0],"e":"留存收益＝盈余公积＋未分配利润，是企业历年实现的净利润留存于企业的部分。实收资本、资本公积来自投资者投入，不属于留存收益。","k":"留存收益"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"single","q":"企业销售商品满足收入确认条件时，确认收入的核心判断标准是（　）。","o":["客户取得相关商品的控制权","商品已经发出","已经收到货款","已经开具发票"],"a":[0],"e":"收入确认的核心是“客户取得商品控制权”（能够主导商品的使用并获得几乎全部经济利益）。发出商品、收款、开票都只是表象，不是确认收入的本质标准。","k":"收入确认"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"single","q":"企业销售商品一批，售价 50 000 元（不含税），给予购货方 10% 的商业折扣。该企业应确认的销售收入为（　）。","o":["45 000 元","50 000 元","40 500 元","49 500 元"],"a":[0],"e":"商业折扣在销售时直接扣减，按折扣后金额确认收入：50 000×(1−10%)＝45 000 元。\n【对比】现金折扣（为早点收款给的折扣）不影响收入确认金额，实际发生时计入财务费用。","k":"商业折扣与现金折扣"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"single","q":"企业已经发出商品但不符合收入确认条件的，发出商品的成本应借记的科目是（　）。","o":["发出商品","主营业务成本","销售费用","库存商品保留不动"],"a":[0],"e":"不满足收入确认条件但商品已发出的，按成本借记“发出商品”，贷记“库存商品”——控制权没转移，收入和成本都不确认。","k":"发出商品"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"费用","t":"single","q":"下列各项中，应计入“销售费用”的是（　）。","o":["销售商品发生的广告费","企业行政管理部门的办公费","银行手续费","生产车间设备的折旧费"],"a":[0],"e":"销售费用核算销售环节的费用：广告费、运输费、销售人员薪酬、专设销售机构费用等。行政办公费属于管理费用，银行手续费属于财务费用，车间折旧计入制造费用（产品成本）。","k":"销售费用"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"费用","t":"single","q":"下列各项中，应计入“财务费用”的是（　）。","o":["银行承兑汇票的手续费","业务招待费","车间管理人员的工资","广告宣传费"],"a":[0],"e":"财务费用核算筹资性支出：利息支出（减利息收入）、银行手续费、汇兑损益等。业务招待费计入管理费用；车间管理人员工资计入制造费用。","k":"财务费用"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"利润","t":"single","q":"下列各项中，不影响企业营业利润的是（　）。","o":["营业外收入","管理费用","投资收益","财务费用"],"a":[0],"e":"营业利润＝营业收入−营业成本−税金及附加−销售/管理/研发/财务费用＋其他收益＋投资收益＋公允价值变动收益−减值损失＋资产处置收益等。营业外收支在利润总额环节才介入，不影响营业利润。","k":"营业利润"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"利润","t":"single","q":"某企业本年营业利润 300 万元，营业外收入 20 万元，营业外支出 50 万元，所得税费用 60 万元。该企业本年净利润为（　）。","o":["210 万元","270 万元","230 万元","320 万元"],"a":[0],"e":"利润总额＝营业利润＋营业外收入−营业外支出＝300＋20−50＝270 万元；净利润＝利润总额−所得税费用＝270−60＝210 万元。\n【公式链】营业利润→＋营业外收支＝利润总额→−所得税＝净利润。","k":"净利润计算"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"利润","t":"single","q":"企业当期实现的净利润，加上年初未分配利润（或减去年初未弥补亏损）后的余额，为（　）。","o":["可供分配的利润","未分配利润","盈余公积","营业利润"],"a":[0],"e":"可供分配的利润＝当年净利润＋年初未分配利润（或−年初未弥补亏损），再依次提取法定盈余公积、任意盈余公积后进行分配。","k":"利润分配"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"资产负债表中“货币资金”项目应根据（　）填列。","o":["库存现金、银行存款和其他货币资金三个总账科目期末余额的合计数","库存现金科目余额","银行存款科目余额","银行存款日记账余额"],"a":[0],"e":"货币资金＝库存现金＋银行存款＋其他货币资金（外埠存款、银行汇票存款等）的合计。应收账款等往来项目则要按明细账分析填列并扣除坏账准备——不同项目填列方法不同。","k":"资产负债表填列"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"资产负债表中“应收账款”项目应根据（　）填列。","o":["应收账款明细账借方余额与预收账款明细账借方余额之和，减去坏账准备","应收账款总账贷方余额","预收账款总账余额","应收账款总账借方余额直接填列"],"a":[0],"e":"“应收账款”＝应收账款明细借方＋预收账款明细借方−坏账准备；对应地“预收账款”＝两个科目明细贷方余额之和。总账余额会掩盖不同性质的明细方向，必须按明细分析。","k":"应收账款项目填列"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"利润表中“营业利润”项目之前不应减去的项目是（　）。","o":["营业外支出","税金及附加","销售费用","财务费用"],"a":[0],"e":"营业利润＝收入−成本−税金及附加−期间费用＋其他收益等；营业外支出在计算“利润总额”时才减去。这是多步式利润表的结构层次考点。","k":"利润表结构"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"single","q":"企业偿还在建工程专项借款的利息支出（不符合资本化条件部分），在现金流量表中应计入（　）。","o":["筹资活动产生的现金流量","经营活动产生的现金流量","投资活动产生的现金流量","汇率变动对现金的影响"],"a":[0],"e":"偿付利息、还本付息都属于筹资活动现金流出。判断口径：日常经营→经营；购建处置长期资产与对外投资→投资；借款还款分红→筹资。","k":"现金流量分类"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"下列各项中，应计入产品成本的是（　）。","o":["生产车间管理人员的工资","企业行政管理部门人员的工资","销售机构人员的工资","筹建期间的开办费"],"a":[0],"e":"产品成本归集生产环节的耗费：直接材料、直接人工、制造费用（含车间管理人员工资、车间折旧等）。行政管理费计入管理费用，销售机构费用计入销售费用——费用归集按“谁受益谁负担”。","k":"产品成本的范围"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"企业生产 A、B 两种产品共同耗用原材料 60 000 元，按材料定额消耗量比例分配。A 产品定额 400 千克，B 产品定额 200 千克。A 产品应分配的材料费用为（　）。","o":["40 000 元","20 000 元","30 0
