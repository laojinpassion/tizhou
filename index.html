00 元","60 000 元"],"a":[0],"e":"分配率＝60 000÷(400＋200)＝100 元/千克；A 产品分配＝400×100＝40 000 元；B 产品＝200×100＝20 000 元。共同费用的分配：先定标准（定额、工时），算分配率，再各自分配。","k":"材料费用分配"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"某车间本月完工产品 400 件，在产品 100 件（完工程度约当 50%）。月初在产品成本与本月生产费用合计 90 000 元（材料随加工陆续投入）。完工产品应负担的成本为（　）。","o":["80 000 元","90 000 元","72 000 元","20 000 元"],"a":[0],"e":"约当产量＝100×50%＝50 件；总约当产量＝400＋50＝450 件；单位成本＝90 000÷450＝200 元/件；完工产品成本＝400×200＝80 000 元；月末在产品＝50×200＝10 000 元。\n【公式】“在产品按完工程度折算成约当产量再分配”。","k":"约当产量比例法"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"single","q":"以产品品种为成本计算对象、适用于大量大批单步骤生产（或管理上不要求分步计算成本）的成本计算方法是（　）。","o":["品种法","分批法","分步法","分类法"],"a":[0],"e":"成本计算基本方法：品种法（大量大批单步骤，如发电）、分批法（单件小批按订单，如造船、定制设备）、分步法（大量大批多步骤，需分车间步骤算成本，如钢铁、纺织）。","k":"成本计算方法"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"政府会计实行“双功能”核算体系，其中反映政府年度预算收支执行情况的是（　）。","o":["预算会计（收付实现制）","财务会计（权责发生制）","成本会计","管理会计"],"a":[0],"e":"政府会计双体系：预算会计以收付实现制为基础，核算预算收入、预算支出、预算结余三要素，编制决算报告；财务会计以权责发生制为基础，核算资产、负债、净资产、收入、费用五要素，编制财务报告。","k":"政府会计双功能"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"政府财务会计的构成要素中，“资产−负债”的差额称为（　）。","o":["净资产","利润","预算结余","所有者权益"],"a":[0],"e":"政府会计恒等式“资产−负债＝净资产”。政府不以营利为目的，没有“利润”要素；预算会计另有“预算结余”三要素体系。","k":"政府会计要素"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"行政单位收到财政部门拨入的财政拨款时，预算会计应确认（　）。","o":["财政拨款预算收入（收付实现制）","主营业务收入","投资收益","营业外收入"],"a":[0],"e":"预算会计按收付实现制确认“财政拨款预算收入”（实际收到款项时确认）；财务会计则按权责发生制确认“财政拨款收入”。双体系对同一业务各记各账、相互衔接。","k":"财政拨款预算收入"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"single","q":"下列报表中，由政府会计主体以权责发生制为基础编制、反映其财务状况和运行成本的是（　）。","o":["政府综合财务报告","财政决算报告","税收收入月报表","预算执行情况表"],"a":[0],"e":"政府综合财务报告以权责发生制财务会计数据为基础，全面反映政府的资产负债“家底”与运行成本；决算报告反映预算执行。两者共同构成政府“双报告”。","k":"政府综合财务报告"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"multi","q":"下列各项中，属于会计基本假设的有（　）。","o":["会计主体","持续经营","会计分期","货币计量","实质重于形式"],"a":[0,1,2,3],"e":"会计四大基本假设：会计主体（为谁记账）、持续经营（不会破产清算）、会计分期（划分期间）、货币计量（以货币为主单位）。实质重于形式是会计信息质量要求，不是假设。","k":"会计基本假设"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"multi","q":"下列各项中，应作为企业资产在资产负债表中列示的有（　）。","o":["经营租赁方式出租给其他单位的设备","经营租赁方式租入的设备","融资租赁方式租入的设备","已签订采购合同但尚未购入的原材料","盘亏待处理的存货"],"a":[0,2],"e":"资产的定义核心是“企业拥有或控制、由过去交易形成、预期带来经济利益”：经营租出的设备控制权仍在企业（A）；融资租入的设备实质上由企业控制，符合实质重于形式（C）。经营租入设备不拥有控制权；尚未购入的原材料不属于过去的交易；盘亏待处理的存货已不符合资产定义，应转销。","k":"资产的定义与确认"},{"s":"kj","p":"会计概述","c":1,"cn":"会计职能与会计基础","t":"multi","q":"下列各项中，属于会计核算环节（方法）的有（　）。","o":["填制和审核会计凭证","登记会计账簿","成本计算","财产清查","编制纳税申报表"],"a":[0,1,2,3],"e":"会计核算方法七种：设置科目账户、复式记账、填制审核凭证、登记账簿、成本计算、财产清查、编制财务报告。纳税申报是税务事项，不属于会计核算方法体系。","k":"会计核算方法"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"multi","q":"下列各项中，通过“其他货币资金”科目核算的有（　）。","o":["银行汇票存款","银行本票存款","信用卡存款","存出投资款","库存现金"],"a":[0,1,2,3],"e":"其他货币资金：外埠存款、银行汇票存款、银行本票存款、信用卡存款、信用证保证金存款、存出投资款等。库存现金单独核算，不属于其他货币资金。","k":"其他货币资金"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"multi","q":"下列各项中，应计入存货采购成本的有（　）。","o":["购买价款","进口关税","运输途中的合理损耗","入库前的挑选整理费用","入库后的仓储保管费用"],"a":[0,1,2,3],"e":"存货成本包括买价、相关税费（关税等）、运输装卸保险费、合理损耗、入库前挑选整理费。入库后的仓储费计入当期损益（生产必需的仓储除外）。","k":"存货成本构成"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"multi","q":"企业可以采用的存货发出计价方法有（　）。","o":["先进先出法","月末一次加权平均法","移动加权平均法","个别计价法","后进先出法"],"a":[0,1,2,3],"e":"我国企业会计准则允许的发出计价：先进先出、月末一次加权平均、移动加权平均、个别计价。后进先出法（LIFO）已被准则取消。\n【提示】计价方法一经确定不得随意变更。","k":"发出存货计价方法"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"multi","q":"下列固定资产中，应当计提折旧的有（　）。","o":["未使用的房屋建筑物","季节性停用的机器设备","经营租赁方式出租的设备","已提足折旧仍继续使用的设备","单独计价入账的土地"],"a":[0,1,2],"e":"除“已提足折旧仍继续使用”和“单独计价入账的土地”外，固定资产都应计提折旧——未使用的房屋照提（计管理费用），季节性停用设备照提，经营租出的照提（计入其他业务成本）。\n【口诀】“除两例外全提”。","k":"固定资产折旧范围"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"multi","q":"下列各项中，属于职工薪酬的有（　）。","o":["职工工资、奖金、津贴和补贴","职工福利费","医疗保险费、工伤保险费等社会保险费","住房公积金","企业为职工垫付的水电费"],"a":[0,1,2,3],"e":"职工薪酬：短期薪酬（工资、福利、五险一金、工会经费、教育经费、非货币性福利等）、离职后福利、辞退福利。企业为职工垫付的水电费属于“其他应收款”（债权），不是薪酬。","k":"职工薪酬的内容"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"multi","q":"一般纳税人企业发生的下列税金中，应通过“应交税费”科目核算的有（　）。","o":["增值税","企业所得税","城市维护建设税","印花税（不通过应交税费核算的情形除外）","房产税"],"a":[0,1,2,4],"e":"应交税费核算企业按税法规定应缴纳的各种税费：增值税、所得税、城建税、房产税、教育费附加等。印花税因不需要预计应交数，直接付款时借记“税金及附加”，不通过应交税费。\n【特例记忆】印花税不走应交税费。","k":"应交税费"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"multi","q":"下列各项中，属于企业留存收益的有（　）。","o":["法定盈余公积","任意盈余公积","未分配利润","资本公积","实收资本"],"a":[0,1,2],"e":"留存收益＝盈余公积（法定＋任意）＋未分配利润，来源于企业净利润的留存。资本公积、实收资本属于投资者投入形成的权益。\n【联动】留存收益可以转增资本、弥补亏损，总额在内部结转时不变。","k":"留存收益的构成"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"multi","q":"下列各项中，会引起企业留存收益总额发生变动的有（　）。","o":["提取法定盈余公积","用盈余公积转增资本","宣告分配现金股利","实现净利润","用盈余公积弥补亏损"],"a":[1,2,3],"e":"留存收益＝盈余公积＋未分配利润：用盈余公积转增资本（B）使盈余公积减少；宣告分配现金股利（C）借记利润分配，未分配利润减少；实现净利润（D）使未分配利润增加——三者都会引起留存收益总额变动。提取盈余公积（A）和盈余公积补亏（E）只是内部结转，总额不变。\n【记忆】“内转不变，进出才变”。","k":"留存收益的变动"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"收入","t":"multi","q":"企业确认商品销售收入时，需要判断的履约义务履行方式包括（　）。","o":["在某一时点履行履约义务","在某一时段内履行履约义务","在签订合同时即确认全部收入","在收款时确认收入"],"a":[0,1],"e":"收入准则按履约义务的履行模式确认收入：某一时点履行（如交付商品）在控制权转移时点确认；某一时段履行（如建造服务、定制软件）按履约进度确认。","k":"收入确认的模式"},{"s":"kj","p":"收入、费用和利润","c":5,"cn":"费用","t":"multi","q":"下列各项中，属于期间费用的有（　）。","o":["管理费用","销售费用","财务费用","制造费用","研发费用"],"a":[0,1,2,4],"e":"期间费用＝管理费用＋销售费用＋财务费用＋研发费用（费用化部分），直接计入当期损益。制造费用是产品成本的组成部分，计入存货成本而非期间费用。","k":"期间费用"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"multi","q":"下列各项中，属于资产负债表流动资产项目的有（　）。","o":["货币资金","应收账款","存货","无形资产","长期股权投资"],"a":[0,1,2],"e":"流动资产：货币资金、交易性金融资产、应收票据及应收账款、预付款项、其他应收款、存货等。无形资产、长期股权投资是非流动资产。","k":"流动资产项目"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"multi","q":"一套完整的财务报表至少应当包括（　）。","o":["资产负债表","利润表","现金流量表","所有者权益变动表","附注"],"a":[0,1,2,3,4],"e":"“四表一注”：资产负债表、利润表、现金流量表、所有者权益变动表＋附注。审计报告是外部鉴证文件，不属于企业编制的报表体系。","k":"财务报表的构成"},{"s":"kj","p":"产品成本核算","c":7,"cn":"产品成本核算","t":"multi","q":"下列各项中，属于产品成本项目的有（　）。","o":["直接材料","直接人工","制造费用","管理费用","销售费用"],"a":[0,1,2],"e":"产品成本项目：直接材料、直接人工、制造费用（燃料及动力可视情况单列）。管理费用、销售费用属于期间费用，与产品成本无关。\n【归集口诀】“车间里发生的是成本，办公室发生的是费用”。","k":"产品成本项目"},{"s":"kj","p":"政府会计基础","c":8,"cn":"政府会计基础","t":"multi","q":"下列关于政府会计的说法中，正确的有（　）。","o":["财务会计实行权责发生制","预算会计一般实行收付实现制","编制政府综合财务报告和决算报告（双报告）","只核算预算收支，不核算资产负债","财务会计要素包括资产、负债、净资产、收入、费用"],"a":[0,1,2,4],"e":"政府会计“双功能、双基础、双报告”：财务会计（权责发生制、五要素、财务报告）＋预算会计（收付实现制、三要素、决算报告）。D 说“只核算预算收支”是旧模式，改革后资产负债家底也要核算。","k":"政府会计体系"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业的库存现金限额一般由开户银行根据实际需要核定，通常按企业（　）日常零星开支所需现金确定。","o":["3～5 天","10～15 天","1 个月","半年"],"a":[0],"e":"库存现金限额按 3～5 天日常零星开支的需要核定，边远地区和交通不便地区可按多于 5 天但不超过 15 天核定。超过限额的现金应及时送存银行。","k":"库存现金限额"},{"s":"kj","p":"资产","c":2,"cn":"货币资金与应收款项","t":"single","q":"企业拨付给内部各部门周转使用的备用金，应通过（　）科目核算。","o":["其他应收款","库存现金","银行存款","应付账款"],"a":[0],"e":"备用金（内部各部门周转使用的定额备用金）通过“其他应收款——备用金”核算；领用时借记其他应收款，报销补足时直接计入费用。","k":"备用金"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"single","q":"企业盘盈的存货（按规定程序批准后），正确的处理是（　）。","o":["冲减管理费用","计入营业外收入","计入其他业务收入","增加盈余公积"],"a":[0],"e":"存货盘盈：按重置成本借记存货，报批后冲减管理费用（原因是计量误差）。对比：固定资产盘盈作为前期差错处理（通过以前年度损益调整），存货盘亏的管理原因损失计入管理费用、自然灾害损失计入营业外支出。","k":"存货盘盈盘亏"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业对自有设备采用工作量法计提折旧。该设备原值 60 万元，预计净残值 3 万元，预计总行驶里程 10 万公里，本月行驶 2 万公里。本月应计提的折旧额为（　）。","o":["11.4 万元","12 万元","5.7 万元","6 万元"],"a":[0],"e":"单位工作量折旧额＝(原值−净残值)÷预计总工作量＝(60−3)÷10＝5.7 元/公里；本月折旧＝5.7×2＝11.4 万元。工作量法适合运输设备等损耗与使用量直接相关的资产。","k":"工作量法折旧"},{"s":"kj","p":"资产","c":2,"cn":"固定资产","t":"single","q":"企业对经营租入的办公楼进行装修改造，发生的装修支出应计入（　）。","o":["长期待摊费用，在租赁期内分期摊销","固定资产","管理费用一次性列支","无形资产"],"a":[0],"e":"经营租入固定资产的改良支出不属于企业资产，但受益期跨租赁期，通过“长期待摊费用”归集，在剩余租赁期与资产使用寿命孰短内分期摊销。","k":"长期待摊费用"},{"s":"kj","p":"资产","c":2,"cn":"无形资产及其他","t":"single","q":"企业出售一项使用寿命有限的无形资产，取得价款 30 万元，该无形资产账面价值 22 万元，未发生相关税费。该业务的处置损益应计入（　）。","o":["资产处置收益（贷方）8 万元","营业外收入 8 万元","其他业务收入 8 万元","管理费用减少 8 万元"],"a":[0],"e":"出售无形资产（主动处置）的净损益计入“资产处置收益”；无形资产报废毁损的损失才计入营业外支出。固定资产出售同理。","k":"无形资产处置"},{"s":"kj","p":"负债","c":3,"cn":"流动负债","t":"single","q":"企业购买原材料赊购一批货，享受供货方给予的现金折扣（实际付款时享受）。该现金折扣对购货方的影响是（　）。","o":["实际享受折扣时冲减财务费用","计入购货成本","计入营业外收入","不影响任何损益"],"a":[0],"e":"购货方在折扣期内付款享受的现金折扣，冲减当期财务费用（作为理财收益处理）；销货方则将给予的现金折扣计入财务费用。双方都走财务费用，方向相反。","k":"现金折扣（购货方）"},{"s":"kj","p":"负债","c":3,"cn":"非流动负债","t":"single","q":"企业分期付息、到期还本的长期借款，每期计提的利息（不符合资本化条件）应借记（　）。","o":["财务费用","在建工程","应付利息属于贷方科目","管理费用"],"a":[0],"e":"不符合资本化条件的借款利息计入财务费用；分期付息的利息通过“应付利息”核算，到期一次还本付息的通过“长期借款——应计利息”核算。","k":"长期借款利息（费用化）"},{"s":"kj","p":"资产","c":2,"cn":"存货","t":"multi","q":"下列关于存货发出计价方法的说法中，正确的有（　）。","o":["物价持续上涨时，先进先出法计算的期末存货成本更接近市价","物价持续上涨时，先进先出法会虚增当期利润","个别计价法适用于不能替代使用的存货（如珠宝、定制设备）","月末一次加权平均法便于随时结转发出存货成本"],"a":[0,1,2],"e":"物价上涨时先进先出法按低价结转发出成本、期末存货按高价计，期末存货更接近市价、当期利润偏高（A、B 正确）；个别计价法成本流转与实物流转一致，适合贵重不可替代存货（C 正确）。月末一次加权平均法月末才算成本，无法随时结转（D 错）。","k":"发出计价方法比较"},{"s":"kj","p":"所有者权益","c":4,"cn":"所有者权益","t":"multi","q":"下列关于所有者权益的说法中，正确的有（　）。","o":["所有者权益是企业资产扣除负债后由所有者享有的剩余权益","所有者凭借所有者权益参与企业的利润分配","所有者权益金额取决于资产和负债的计量","所有者权益项目可以直接按市价单独计量"],"a":[0,1,2],"e":"所有者权益是剩余权益（A），所有者享有利润分配权（B），金额＝资产−负债倒算、取决于两者的计量（C）。它不能单独直接计量（D），只能通过资产和负债间接计量。","k":"所有者权益的特征"},{"s":"kj","p":"财务报表","c":6,"cn":"财务报表","t":"multi","q":"下列各项中，属于现金流量表中“投资活动产生的现金流量”的有（　）。","o":["购建厂房支付的现金","取得投资收益（股利、利息）收到的现金","支付给职工的工资","收回对外投资收到的现金","偿还银行借款支付的现金"],"a":[0,1,3],"e":"投资活动：购建与处置长期资产、对外投资及其收益的现金收付（A、B、D）。支付工资属经营活动，偿还借款属筹资活动。\n【三分类】经营管日常、投资管长期、筹资管资金来源。","k":"投资活动现金流量"}],"ncre":[{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"计算机中信息的存储与处理都采用（　）。","o":["二进制","十进制","八进制","十六进制"],"a":[0],"e":"计算机内部采用二进制：物理实现简单（高低电平）、运算规则简单、与逻辑值真假对应、可靠性高。","k":"进制与编码"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"十进制数 25 转换为二进制数是（　）。","o":["11001","10101","11011","10011"],"a":[0],"e":"25＝16＋8＋1＝11001B。转换方法：除 2 取余逆序排列。","k":"进制转换"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"1GB 等于（　）。","o":["1024MB","1000KB","1024KB","10MB"],"a":[0],"e":"存储单位换算（2 的幂）：1KB＝1024B，1MB＝1024KB，1GB＝1024MB，1TB＝1024GB。","k":"存储单位"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"微型计算机中，CPU 的主要组成部分是（　）。","o":["运算器和控制器","存储器和控制器","运算器和内存","输入设备和输出设备"],"a":[0],"e":"CPU（中央处理器）＝运算器＋控制器，是计算机的核心部件。冯·诺依曼结构五大部件：运算器、控制器、存储器、输入设备、输出设备。","k":"计算机组成"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"下列设备中，属于输入设备的是（　）。","o":["扫描仪","显示器","打印机","音箱"],"a":[0],"e":"输入设备：键盘、鼠标、扫描仪、摄像头、麦克风等；输出设备：显示器、打印机、音箱、投影仪等。","k":"输入输出设备"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"计算机软件一般分为（　）。","o":["系统软件和应用软件","办公软件和游戏软件","收费软件和免费软件","国产软件和进口软件"],"a":[0],"e":"系统软件：操作系统、语言处理程序、数据库管理系统等；应用软件：Office、Photoshop、QQ 等面向具体应用的软件。","k":"软件分类"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"操作系统的主要功能不包括（　）。","o":["文字排版与美化","处理机管理（进程调度）","存储管理","设备管理与文件管理"],"a":[0],"e":"操作系统五大功能：处理机管理、存储管理、文件管理、设备管理、作业（用户接口）管理。文字排版属于应用软件（Word）功能。","k":"操作系统"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"single","q":"在计算机中，一个字节（Byte）由（　）个二进制位组成。","o":["8","4","16","32"],"a":[0],"e":"1Byte＝8bit；一个字节可以表示 2⁸＝256 种状态。ASCII 码用一个字节表示一个字符。","k":"字节与位"},{"s":"ncre","p":"计算机基础与网络","c":2,"cn":"计算机网络","t":"single","q":"计算机网络最主要的功能是（　）。","o":["资源共享和数据通信","打印文档","播放音乐","打字排版"],"a":[0],"e":"计算机网络功能：数据通信（基础）、资源共享（最主要目的）、分布式处理、提高可靠性、负载均衡。","k":"计算机网络功能"},{"s":"ncre","p":"计算机基础与网络","c":2,"cn":"计算机网络","t":"single","q":"Internet 采用的核心协议是（　）。","o":["TCP/IP 协议簇","IPX/SPX","NetBEUI","HTTP only"],"a":[0],"e":"TCP/IP 协议簇是互联网的基础：IP 负责寻址与路由，TCP 提供可靠传输，应用层有 HTTP、FTP、SMTP、DNS 等。","k":"TCP/IP"},{"s":"ncre","p":"计算机基础与网络","c":2,"cn":"计算机网络","t":"single","q":"下列关于 IP 地址的说法中，正确的是（　）。","o":["IPv4 地址由 32 位二进制数组成","IPv4 地址由 128 位二进制数组成","IP 地址就是计算机名","同一局域网中两台电脑可以使用相同的 IP 地址"],"a":[0],"e":"IPv4 地址 32 位（点分十进制如 192.168.1.1）；IPv6 地址 128 位。同一网络中 IP 地址必须唯一。","k":"IP 地址"},{"s":"ncre","p":"计算机基础与网络","c":2,"cn":"计算机网络","t":"single","q":"计算机病毒的本质是（　）。","o":["一段具有破坏性并可自我复制的程序代码","细菌感染","硬件故障","系统补丁"],"a":[0],"e":"计算机病毒特征：传染性、破坏性、潜伏性、隐蔽性、可触发性。防治：安装杀毒软件并及时更新、不打开来历不明的附件、定期备份。","k":"计算机病毒"},{"s":"ncre","p":"Office 高级应用","c":3,"cn":"Office 高级应用","t":"single","q":"在 Word 中，若想在文档的每一页顶部显示文档标题，应使用（　）。","o":["页眉","页脚","文本框","脚注"],"a":[0],"e":"页眉在页顶、页脚在页底，均可插入页码、日期等域实现自动更新；脚注在页面底部对正文内容注释。","k":"Word 操作"},{"s":"ncre","p":"Office 高级应用","c":3,"cn":"Office 高级应用","t":"single","q":"Word 中“样式”的主要作用是（　）。","o":["统一管理文档中各级标题与正文的格式，便于自动生成目录","加密文档","统计字数","插入图片"],"a":[0],"e":"样式是一组格式的集合；使用标题样式（标题 1/2/3）后可通过“引用→目录”自动生成并更新目录。","k":"Word 样式与目录"},{"s":"ncre","p":"Office 高级应用","c":3,"cn":"Office 高级应用","t":"single","q":"Excel 中，若 A1=5，B1=3，则公式 =A1*B1 的结果是（　）。","o":["15","8","2","53"],"a":[0],"e":"公式以“=”开头，* 为乘法运算符，A1*B1＝15。常用运算符：+ − * / ^（乘方）。","k":"Excel 公式"},{"s":"ncre","p":"Office 高级应用","c":3,"cn":"Office 高级应用","t":"single","q":"Excel 中，函数 =SUM(B2:B6) 的作用是（　）。","o":["求 B2 到 B6 单元格区域中数值的和","求平均值","统计非空单元格个数","排序"],"a":[0],"e":"SUM 求和；AVERAGE 平均；COUNT 计数（数值）；MAX/MIN 最大最小值；IF 条件判断；RANK 排名。","k":"Excel 函数"},{"s":"ncre","p":"Office 高级应用","c":3,"cn":"Office 高级应用","t":"single","q":"在 Excel 中，要对某列数据进行降序排列，应使用的功能是（　）。","o":["数据选项卡中的“排序”","开始选项卡中的“字体”","插入选项卡中的“图表”","视图选项卡中的“冻结窗格”"],"a":[0],"e":"排序在“数据”选项卡；图表在“插入”选项卡；筛选、分类汇总也在“数据”选项卡。","k":"Excel 数据管理"},{"s":"ncre","p":"Office 高级应用","c":3,"cn":"Office 高级应用","t":"single","q":"PowerPoint 中，设置幻灯片自动连续播放（放映）应使用（　）。","o":["“排练计时”并设置自动换片时间","手动单击翻页","删除所有幻灯片","打印讲义"],"a":[0],"e":"“排练计时”记录每页停留时间，配合“设置幻灯片放映”中的换片方式（排练计时/自动换片）实现自动放映。","k":"PowerPoint 放映"},{"s":"ncre","p":"公共基础","c":4,"cn":"公共基础","t":"single","q":"算法的有穷性是指（　）。","o":["算法必须在有限的步骤内终止","算法的程序长度有限","算法的输入数据有限","算法的输出结果有限"],"a":[0],"e":"算法五个特性：有穷性、确定性、可行性、输入（≥0 个）、输出（≥1 个）。","k":"算法基础"},{"s":"ncre","p":"公共基础","c":4,"cn":"公共基础","t":"single","q":"栈和队列的主要区别是（　）。","o":["栈是先进后出（FILO），队列是先进先出（FIFO）","栈是线性结构而队列不是","队列是先进后出","栈只能存储数字"],"a":[0],"e":"栈：限定在一端（栈顶）操作，先进后出；队列：一端入队一端出队，先进先出。两者都是操作受限的线性结构。","k":"栈与队列"},{"s":"ncre","p":"公共基础","c":4,"cn":"公共基础","t":"single","q":"在长度为 n 的顺序表（线性表顺序存储）的末尾插入一个元素，其时间复杂度为（　）。","o":["O(1)","O(n)","O(n²)","O(log₂n)"],"a":[0],"e":"表尾插入直接定位无需移动元素，为 O(1)；在表头插入则需移动全部 n 个元素，为 O(n)。","k":"算法复杂度"},{"s":"ncre","p":"公共基础","c":4,"cn":"公共基础","t":"single","q":"数据库（DB）、数据库系统（DBS）与数据库管理系统（DBMS）之间的关系是（　）。","o":["DBS 包括 DB 和 DBMS","DB 包括 DBS 和 DBMS","DBMS 包括 DBS 和 DB","三者互不相关"],"a":[0],"e":"DBS（数据库系统）＝DB（数据库）＋DBMS（数据库管理系统）＋应用程序＋用户等。DBMS 是管理数据库的系统软件。","k":"数据库基础"},{"s":"ncre","p":"计算机基础与网络","c":2,"cn":"计算机网络","t":"multi","q":"下列关于计算机网络的描述中，正确的有（　）。","o":["按覆盖范围分为局域网、城域网、广域网","局域网常用以太网技术","无线局域网标准主要为 IEEE 802.11 系列","接入 Internet 必须使用调制解调器拨号","域名系统 DNS 用于域名与 IP 地址的转换"],"a":[0,1,2,4],"e":"接入方式多种（光纤宽带、无线、移动网络等），拨号只是早期方式。DNS 完成域名到 IP 的解析。","k":"计算机网络"},{"s":"ncre","p":"计算机基础","c":1,"cn":"计算机基础","t":"multi","q":"下列关于计算机病毒的说法中，正确的有（　）。","o":["病毒具有传染性和破坏性","病毒可以潜伏在合法程序中","及时更新系统补丁有助于防毒","安装杀毒软件后可以随意打开不明附件","不联网的计算机也可能感染病毒（如通过 U 盘）"],"a":[0,1,2,4],"e":"U 盘等移动介质是病毒传播的重要途径；杀毒软件需及时更新病毒库才有效，且不能保证绝对安全。","k":"计算机病毒"},{"s":"ncre","p":"Office 高级应用","c":3,"cn":"Office 高级应用","t":"multi","q":"关于 Excel 高级应用的说法中，正确的有（　）。","o":["绝对引用使用 $ 符号（如 $A$1）","IF 函数可以进行条件判断","图表可以随数据变化自动更新","数据透视表可用于多维度汇总分析","Excel 只能存储数字不能存储文本"],"a":[0,1,2,3],"e":"Excel 单元格可存储文本、数值、日期、公式等多种数据类型。绝对引用 $A$1 在公式复制时地址不变。","k":"Excel 高级应用"}],"rl":[{"s":"rl","p":"组织激励","c":1,"cn":"组织激励","t":"single","q":"马斯洛需要层次理论中，从低到高的第三个层次需要是（　）。","o":["归属和爱的需要（社交需要）","生理需要","尊重需要","自我实现需要"],"a":[0],"e":"马斯洛五层次由低到高：生理→安全→归属和爱→尊重→自我实现。已满足的需要不再具有激励作用，未满足的需要才是激励的源泉。","k":"需要层次理论"},{"s":"rl","p":"组织激励","c":1,"cn":"组织激励","t":"single","q":"赫茨伯格双因素理论中，属于激励因素的是（　）。","o":["工作富有成就感","工资水平","工作环境","公司政策"],"a":[0],"e":"激励因素：成就感、认可、工作本身、责任、晋升与成长。工资、环境、政策属于保健因素——改善保健因素只能消除不满，不能带来满意与激励。","k":"双因素理论"},{"s":"rl","p":"组织激励","c":1,"cn":"组织激励","t":"single","q":"期望理论中激励力（M）的计算公式是（　）。","o":["M＝效价（V）×期望值（E）","M＝效价＋期望值","M＝效价÷期望值","M＝期望值−效价"],"a":[0],"e":"弗鲁姆期望理论：激励力＝效价×期望值。效价为0或期望值为0，激励力都是0——二者缺一不可。","k":"期望理论"},{"s":"rl","p":"组织激励","c":1,"cn":"组织激励","t":"single","q":"公平理论认为，员工的公平感来源于（　）。","o":["将自己的产出与投入之比同他人的产出与投入之比进行比较","只看自己的绝对报酬高低","只与过去工资比较","领导的口头表扬"],"a":[0],"e":"亚当斯公平理论：员工会进行横向（与他人）与纵向（与自己过去）比较，感到不公平时会采取改变投入、改变产出（消极方式）等方式恢复公平感。","k":"公平理论"},{"s":"rl","p":"领导行为","c":2,"cn":"领导行为","t":"single","q":"管理方格理论中，“9.9 型”（团队型）领导风格的特点是（　）。","o":["对人关心与对生产关心都达到最高水平","对人极不关心，只关心生产","只关心人，不关心生产","对人、对生产都处于中等水平"],"a":[0],"e":"管理方格（布莱克与穆顿）以关心人为纵轴、关心生产为横轴：9.9 团队型是最理想风格；1.9 乡村俱乐部型；9.1 任务型；1.1 贫乏型；5.5 中庸型。","k":"领导风格理论"},{"s":"rl","p":"领导行为","c":2,"cn":"领导行为","t":"single","q":"领导生命周期理论（情境领导理论）认为，有效的领导方式取决于（　）。","o":["下属的成熟度水平","领导者的学历","企业的规模","行业的利润率"],"a":[0],"e":"情境领导理论（赫塞与布兰查德）：根据下属成熟度（意愿＋能力）选择领导方式——命令式（低成熟度）、说服式、参与式、授权式（高成熟度）。","k":"情境领导理论"},{"s":"rl","p":"战略性人力资源管理","c":3,"cn":"战略性人力资源管理","t":"single","q":"战略性人力资源管理强调人力资源管理必须与（　）保持一致。","o":["组织的战略目标","员工的个人爱好","竞争对手的薪酬","办公环境"],"a":[0],"e":"战略性人力资源管理：以组织战略为导向，通过人力资源规划、政策与实践获取持续竞争优势，人力资源部门从行政事务角色转变为战略伙伴。","k":"战略性人力资源管理"},{"s":"rl","p":"人力资源管理","c":4,"cn":"人力资源管理","t":"single","q":"人力资源规划中，预测组织内部人力资源供给的主要依据是（　）。","o":["现有人力资源的数量、结构与流动情况（晋升、离职、退休等）","竞争对手的人员名单","社会人口总数","企业logo颜色"],"a":[0],"e":"人力资源供给预测分内部供给（现有人员盘点＋流动分析）与外部供给（劳动力市场分析）。内部盘点是基础。","k":"人力资源规划"},{"s":"rl","p":"人力资源管理","c":4,"cn":"人力资源管理","t":"single","q":"工作分析的方法中，适用于对大量重复、周期短的体力劳动进行时间研究的是（　）。","o":["工作实践法（现场观察法）","问卷法","工作日志法","文献分析法"],"a":[0],"e":"工作分析方法：观察/实践法（体力劳动适用）、问卷法（大量员工）、访谈法（管理者）、工作日志法、文献法。各方法优劣互补，常组合使用。","k":"工作分析方法"},{"s":"rl","p":"人员甄选","c":5,"cn":"人员甄选","t":"single","q":"甄选工具中，预测效度较高的测试方法是（　）。","o":["结构化面试与工作样本测试","astrology 星座占卜","随意闲聊","仅凭简历颜值判断"],"a":[0],"e":"甄选工具效度比较：工作样本测试与结构化面试效度较高，非结构化面试与笔迹分析效度较低。背景调查可验证信息真实性。","k":"人员甄选工具"},{"s":"rl","p":"绩效管理","c":6,"cn":"绩效管理","t":"single","q":"绩效管理的最终目的是（　）。","o":["促进组织与员工绩效的持续改进与共同发展","为了扣员工工资","为了淘汰员工","为了应付检查"],"a":[0],"e":"绩效管理是完整循环：绩效计划→辅导监控→考核评价→反馈应用。考核不是目的，发展才是目的。","k":"绩效管理循环"},{"s":"rl","p":"薪酬管理","c":7,"cn":"薪酬管理","t":"single","q":"薪酬的构成中，与员工个人绩效直接挂钩的部分是（　）。","o":["可变薪酬（绩效工资、奖金）","基本薪酬","法定福利","间接薪酬"],"a":[0],"e":"薪酬三部分：基本薪酬（相对固定）、可变薪酬（与绩效挂钩）、间接薪酬（福利，非现金形式为主）。","k":"薪酬构成"},{"s":"rl","p":"薪酬管理","c":7,"cn":"薪酬管理","t":"single","q":"确定薪酬水平时使企业的薪酬水平高于市场平均水平，这种薪酬水平策略称为（　）。","o":["领先（领先市场）策略","跟随策略","滞后策略","混合策略"],"a":[0],"e":"薪酬水平策略：领先策略（吸才但成本高）、跟随策略（与市场持平）、滞后策略（低于市场，成本控制）、混合策略（关键岗位领先、其他岗位跟随）。","k":"薪酬水平策略"},{"s":"rl","p":"培训与开发","c":8,"cn":"培训与开发","t":"single","q":"培训效果评估中，评估“学员在多大程度上掌握了培训内容”属于（　）层次。","o":["学习层","反应层","结果层","行为层"],"a":[0],"e":"柯氏四级评估：反应层（满意吗）→学习层（学会了吗）→行为层（用了吗）→结果层（绩效变了吗）。","k":"培训评估"},{"s":"rl","p":"劳动关系","c":9,"cn":"劳动关系","t":"single","q":"劳动关系的主体是（　）。","o":["劳动者与用人单位（雇主）","只有劳动者","只有政府","只有工会"],"a":[0],"e":"劳动关系的主体是劳动者与用人单位；工会是劳动者利益的代表组织；政府通过劳动行政部门调整劳动关系。","k":"劳动关系主体"},{"s":"rl","p":"社会保险","c":10,"cn":"社会保险","t":"single","q":"我国社会保险体系中的“五险”不包括（　）。","o":["商业人寿保险","养老保险","医疗保险","工伤保险"],"a":[0],"e":"五险：养老、医疗、工伤、失业、生育（生育保险与职工医保已合并实施）。商业人寿保险是商业行为，不属于社会保险。","k":"社会保险"},{"s":"rl","p":"组织激励","c":1,"cn":"组织激励","t":"multi","q":"下列关于激励理论的说法中，正确的有（　）。","o":["需要层次理论认为未满足的需要具有激励作用","双因素理论区分了保健因素与激励因素","期望理论强调激励力＝效价×期望值","公平理论关注报酬的相对比较","激励理论认为钱对任何人都没有激励作用"],"a":[0,1,2,3],"e":"各激励理论相互补充：需要内容（马斯洛、赫茨伯格）、过程（期望、公平、目标设置）。货币报酬仍是重要的激励与保健因素之一，E 绝对化了。","k":"激励理论综合"},{"s":"rl","p":"人力资源管理","c":4,"cn":"人力资源管理","t":"multi","q":"人力资源管理的主要职能模块包括（　）。","o":["人力资源规划","招聘与甄选","培训与开发","绩效与薪酬管理","替员工缴纳个人赌债"],"a":[0,1,2,3],"e":"人力资源管理六大模块：规划、招聘配置、培训开发、绩效管理、薪酬福利、员工关系。违法行为不属于任何职能模块。","k":"人力资源职能模块"},{"s":"rl","p":"绩效管理","c":6,"cn":"绩效管理","t":"multi","q":"绩效考核中常见的考核者误区包括（　）。","o":["晕轮效应","趋中倾向","近因效应","宽大化倾向","使用客观量化指标"],"a":[0,1,2,3],"e":"考核者主观偏差：晕轮（以偏概全）、趋中（不敢打极端分）、近因（只看最近表现）、宽大化（老好人）。客观量化指标正是纠偏手段。","k":"考核误区"},{"s":"rl","p":"劳动关系","c":9,"cn":"劳动关系","t":"multi","q":"根据《劳动合同法》，下列情形中用人单位应当向劳动者支付经济补偿的有（　）。","o":["用人单位未及时足额支付劳动报酬，劳动者解除劳动合同","用人单位依照破产法规定进行重整而解除劳动合同","劳动合同期满终止（用人单位维持或提高条件续订而劳动者拒绝续订的除外）","劳动者严重违反规章制度被用人单位解除合同","劳动者在试用期内主动辞职"],"a":[0,1,2],"e":"经济补偿（N）：单位过错被迫解除、单位依法解除、合同期满单位不续或降条件续订等。劳动者过错被辞退与试用期主动辞职无经济补偿。","k":"经济补偿"},{"s":"rl","p":"薪酬管理","c":7,"cn":"薪酬管理","t":"multi","q":"职位（岗位）薪酬体系设计的基础工作包括（　）。","o":["工作分析形成工作说明书","工作评价确定岗位相对价值","薪酬调查确定市场水平","划分薪酬等级与薪档","随机拍脑袋定工资"],"a":[0,1,2,3],"e":"职位薪酬体系设计流程：工作分析→工作评价（排序法、计点法等）→薪酬调查→薪酬结构（等级与薪档）设计。科学设计排斥“拍脑袋”。","k":"职位薪酬体系"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"single","q":"奥尔德弗 ERG 理论把人的需要压缩为三类，下列对应正确的是（　）。","o":["生存需要、关系需要、成长需要","生理需要、安全需要、自我实现需要","权力需要、归属需要、成就需要","保健需要、激励需要、公平需要"],"a":[0],"e":"ERG 理论（奥尔德弗）把需要归纳为生存（Existence）、关系（Relatedness）、成长（Growth）三类，并认为多种需要可同时起激励作用，且存在「挫折—退化」机制：高层需要受挫会退回低层需要。「生理—安全—自我实现」是马斯洛需要层次的节选，「权力—归属—成就」是麦克利兰三重需要，「保健—激励」则来自双因素理论。【记忆钩子】E 生存、R 关系、G 成长，谐音「生关长」。","k":"ERG理论"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"single","q":"根据麦克利兰三重需要理论，优秀的管理者往往表现为（　）。","o":["成就需要极高、权力需要极低","归属需要极高、成就需要极低","权力需要较高、归属需要较低","三种需要都处于最低水平"],"a":[2],"e":"麦克利兰把需要分为成就、权力、归属三类。研究发现，高成就需要者偏好有挑战、能由个人负责的目标，却未必擅长管理他人；优秀管理者通常权力需要较高（愿意且能够影响他人）、归属需要较低（不被人情与亲和需要干扰判断）。「成就极高、权力极低」「归属极高」等组合都不符合这一结论。【易错点】别把「高成就需要」等同于「好管理者」，这是该理论最经典的陷阱。","k":"三重需要理论"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"single","q":"洛克的目标设置理论认为，最能提升绩效的目标特征是（　）。","o":["越笼统越好，例如「尽力而为」","具体、有一定难度且被员工接受，并配合反馈","难度尽可能低，确保人人都能轻松完成","由上级单方面秘密下达、员工并不知情"],"a":[1],"e":"目标设置理论：具体、有挑战性、被员工接受的目标，加上及时反馈与较高自我效能感，比模糊的「尽力而为」更能提升绩效。「越笼统越好」「难度越低越好」「员工毫不知情」都与该结论相反——目标必须清晰、可衡量且被理解接纳。【记忆钩子】「具体＋难度＋接受＋反馈」四要素，缺一不可。","k":"目标设置理论"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"single","q":"某企业对按时提交周报的员工给予公开表扬，以促使该行为重复出现。按强化理论，这属于（　）。","o":["惩罚","负强化","自然消退","正强化"],"a":[3],"e":"斯金纳强化理论：正强化是「呈现愉快刺激以增加行为频率」，负强化是「撤销不愉快刺激以增加行为」，惩罚是「呈现厌恶刺激以减少行为」，自然消退是「不再给予强化使行为逐渐减少」。公开表扬属于给好刺激，故为正强化。【易错点】负强化不是惩罚——前者靠「拿走坏的」鼓励好行为，后者靠「给来坏的」压制坏行为。","k":"强化理论"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"single","q":"弗鲁姆期望理论中，员工判断「达到绩效后能否获得相应奖励」，对应的是（　）。","o":["绩效—奖励（工具性）联系","努力—绩效（期望）联系","奖励—个人目标（效价）联系","投入—产出的横向比较"],"a":[0],"e":"期望理论三组关系：努力—绩效（期望值，我努力能达标吗）、绩效—奖励（工具性，达标能拿到奖吗）、奖励—个人目标（效价，这奖对我有价值吗），激励力取决于三者共同作用，简化写作 M＝V×E。「投入—产出的横向比较」是公平理论的术语，不属于期望理论。【记忆钩子】「努力→绩效→奖励→价值」四字链，逐段问「能不能、值不值」。","k":"期望理论"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"multi","q":"下列激励理论中，属于「过程型」激励理论的有（　）。","o":["需要层次理论","期望理论","公平理论","目标设置理论","双因素理论"],"a":[1,2,3],"e":"激励理论分两派：内容型研究「用什么激励」（需要层次、ERG、双因素、三重需要），过程型研究「激励的心理过程如何发生」（期望、公平、目标设置、强化）。「需要层次理论」与「双因素理论」属内容型，其余三项属过程型。【记忆钩子】带「需要/因素」多归内容派，带「期望/公平/目标/强化」多归过程派。","k":"激励理论分类"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"multi","q":"按照赫茨伯格双因素理论，下列属于保健因素的有（　）。","o":["公司政策与行政管理","与上级、同事的人际关系","工作条件与安全保障","工作本身的挑战性与责任感","工资与福利"],"a":[0,1,2,4],"e":"保健因素与工作环境相关、属外在条件：公司政策与管理、监督、人际关系、工作条件、工资、福利、安全、地位。缺了会「不满」，齐备也只是「没有不满」，并不能带来满意与激励。「工作本身的挑战性与责任感」属于激励因素（成就、认可、工作本身、责任、晋升、成长），故不选。【易错点】工资是保健因素而非激励因素——涨薪能平息抱怨，却未必激发热情。","k":"双因素理论因素辨析"},{"s":"rl","p":"组织激励理论","c":11,"cn":"组织激励理论的深化","t":"multi","q":"对比各激励理论的核心观点，下列判断成立的有（　）。","o":["ERG 理论认为多种需要可以同时具有激励作用","ERG 理论提出「挫折—退化」：高层需要受挫会使低层需要增强","公平理论认为员工只关心自己报酬的绝对数额","马斯洛认为已满足的需要不再具有激励作用","强化理论关注行为结果对行为频率的影响"],"a":[0,1,3,4],"e":"「多种需要可同时激励」与「挫折—退化」是 ERG 区别于马斯洛的两大特点；「已满足的需要不再有激励作用」是马斯洛的核心主张；「行为由结果塑造」是强化理论的核心。「员工只关心报酬绝对数额」错——公平理论强调员工把「自己产出/投入」与「他人产出/投入」作相对比较，也做纵向历史比较。【易错点】把「公平」理解成「拿得多」是典型误解，公平感来自比较。","k":"激励理论综合辨析"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"single","q":"早期领导特质理论试图回答的核心问题是（　）。","o":["领导者应采取何种行为风格","领导者具备哪些区别于非领导者的个人特质","下属成熟度如何决定领导方式","情境变量如何调节领导效果"],"a":[1],"e":"领导理论演进：特质理论找「天生的领导者特质」，行为理论找「最佳行为风格」，权变理论主张「没有最好、要视情境而定」。「采取何种行为风格」是行为理论的问题，「下属成熟度如何决定方式」属情境领导理论，「情境变量如何调节效果」属权变理论。【记忆钩子】特质看「人」，行为看「事」，权变看「场合」。","k":"领导特质理论"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"single","q":"领导行为理论中，俄亥俄州立大学研究归纳出的两个行为维度是（　）。","o":["任务导向与员工导向","关心人与关心生产","专制与民主","关怀维度与结构（定规）维度"],"a":[3],"e":"俄亥俄研究归纳出「关怀」（关心下属感受、尊重信任）与「定规/结构」（界定任务、明确角色与标准）两个维度；「任务导向与员工导向」来自密歇根研究，「关心人与关心生产」是管理方格的两轴，「专制与民主」属早期领导方式分类。【易错点】「关怀/定规」对应俄亥俄，「员工/生产导向」对应密歇根，两者常被互换设陷。","k":"领导行为理论维度"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"single","q":"费德勒权变模型认为，领导效果主要取决于（　）。","o":["领导风格与情境有利程度之间的匹配","领导者的年龄与任职年限","下属的学历层次","企业的所有制性质"],"a":[0],"e":"费德勒用「最不喜欢的同事」（LPC）问卷区分任务导向/关系导向风格，情境有利程度由上下级关系、任务结构、职位权力三个变量决定：任务导向在极有利或极不利情境下更有效，关系导向在中等有利情境下更有效。年龄、学历、所有制都不是该模型的情境变量。【记忆钩子】费德勒三情境：关系好不好、任务明不明、权力大不大。","k":"费德勒权变模型"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"single","q":"路径—目标理论中，领导者向下属说明期望、明确任务与绩效标准，这属于（　）。","o":["支持型领导","参与型领导","指导型（指令型）领导","成就取向型领导"],"a":[2],"e":"豪斯路径—目标理论（源于期望理论）认为领导者职责是扫清通往目标的障碍、提升下属期望与效价，含四种方式：指导型（说明做什么、怎么做，任务模糊时最有效）、支持型（关心下属，任务枯燥压力大时有效）、参与型（征求意见共同决策）、成就取向型（设挑战性目标并表达信任）。「说明期望、明确任务与标准」正是指导型。【记忆钩子】四种风格按「任务清不清、下属要不要参与」来选。","k":"路径—目标理论"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"single","q":"与交易型领导相比，变革型领导的典型特征是（　）。","o":["以明确的奖惩与任务交换为基础","通过愿景、理想化影响与个性化关怀激励下属超越自我利益","仅在下属出错时才介入（例外管理）","严格按既定契约与标准给付报酬"],"a":[1],"e":"巴斯：交易型领导基于「交换」——明确目标、按绩效付酬、例外管理；变革型领导在此基础上叠加理想化影响/魅力、鼓舞性激励、智力激发、个性化关怀四要素，使下属为组织愿景付出额外努力。「以奖惩交换为基础」「仅在出错时介入」「按契约付酬」都是交易型或例外管理的表现。【易错点】变革型不是「取代」交易型，而是「超越并包含」——先有交换基础，再谈愿景激励。","k":"变革型与交易型领导"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"single","q":"领导—成员交换（LMX）理论强调的核心现象是（　）。","o":["领导者对所有下属一视同仁、采用完全相同的风格","领导效果完全由下属成熟度决定","领导风格由组织结构唯一决定","领导者会与不同下属形成质量不同的「圈内/圈外」交换关系"],"a":[3],"e":"LMX 理论：由于时间精力有限，领导者会与一部分下属建立高质量的「圈内」关系（更多信任、支持、资源与授权），其余为「圈外」关系（按正式契约与职责办事）；圈内成员通常绩效、满意度与组织承诺更高。「一视同仁」「完全由成熟度决定」「由结构唯一决定」都否定了关系质量的差异。【记忆钩子】LMX＝「圈内人 vs 圈外人」，重点是关系有亲疏，而非领导只有一种风格。","k":"领导—成员交换理论"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"multi","q":"下列领导理论中，强调「领导方式应随情境或下属状态而变」的有（　）。","o":["费德勒权变模型","领导生命周期（情境领导）理论","领导特质理论","路径—目标理论","密歇根大学领导行为研究"],"a":[0,1,3],"e":"权变/情境学派：费德勒看情境有利度、赫塞—布兰查德看下属成熟度、豪斯看任务与下属特征，都主张「没有普适最佳风格」。「领导特质理论」与「密歇根大学领导行为研究」恰恰在寻找普遍适用的最佳特质或最佳风格，正是权变理论所反对的。【记忆钩子】凡是带「要看情况」的归权变，带「找最优」的归特质或行为。","k":"权变领导理论辨析"},{"s":"rl","p":"领导理论","c":12,"cn":"领导理论及其发展","t":"multi","q":"根据领导生命周期理论，下列「下属成熟度—领导方式」配对正确的有（　）。","o":["既无能力又不情愿（低成熟度）→命令式","有意愿但能力不足→说服式","有能力但缺乏意愿或信心→参与式","既有能力又有意愿（高成熟度）→授权式","下属成熟度越高，领导者越应加强直接指挥与监督"],"a":[0,1,2,3],"e":"赫塞—布兰查德按「工作能力＋工作意愿」把成熟度分四级：R1 没能力没意愿→命令（高任务低关系）、R2 没能力有意愿→说服（高任务高关系）、R3 有能力没意愿→参与（低任务高关系）、R4 有能力有意愿→授权（低任务低关系）。「成熟度越高越应加强指挥」恰好说反：成熟度越高越应放权。【记忆钩子】成熟度升高，领导从「我说了算」逐步退到「你看着办」。","k":"情境领导方式配对"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"single","q":"以直线制为基础、在各级行政负责人之下设相应职能部门，职能部门只作参谋指导而不直接指挥下级，这种组织结构是（　）。","o":["事业部制","矩阵制","直线职能制","纯直线制"],"a":[2],"e":"直线职能制：直线指挥链统一指挥，再加职能部门参谋辅助，集权、效率高，适合产品单一、规模中等、环境稳定的组织；缺点是横向协调差、对变化适应慢。「纯直线制」不设职能部门，「事业部制」按产品或地区分权独立核算，「矩阵制」则是职能与项目的双重指挥。【记忆钩子】「直线管命令、职能当参谋」是直线职能制最核心的一句话。","k":"组织结构类型"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"single","q":"实行「集中决策、分散经营」，按产品、地区或顾客划分相对独立、自负盈亏经营单位的组织结构是（　）。","o":["事业部制（分权型）","直线制","职能制","矩阵制"],"a":[0],"e":"事业部制（斯隆模型）：总部保留战略决策、财务与重要人事权，各事业部独立经营核算、自负盈亏，适应多元化与大规模组织；缺点是机构重叠、资源重复配置、易滋生本位主义。「直线制」无职能与分部，「职能制」按职能划分且易多头指挥，「矩阵制」是双重领导。【记忆钩子】「集中决策、分散经营」八个字专为事业部制准备。","k":"事业部制"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"single","q":"矩阵制组织结构最突出的特征是（　）。","o":["完全取消职能部门","员工同时接受职能部门与项目（产品）经理的双重领导","由一位最高首长直接指挥全体人员","按地区划分并各自独立核算"],"a":[1],"e":"矩阵制＝职能部门纵向系统＋项目/产品横向系统交叉，形成双重指挥链，灵活、资源共享、利于复杂临时任务；主要缺点是双重领导易造成权责不清与多头指挥。「按地区划分、独立核算」是事业部制特征，「完全取消职能部门」并不成立。【易错点】双重领导既是矩阵制优势的来源，也是其最大隐患，注意题干问的是「特征」还是「缺陷」。","k":"矩阵制组织结构"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"single","q":"在组织规模一定的前提下，管理幅度与管理层次之间的关系是（　）。","o":["正比关系：幅度越大，层次越多","两者互不相关","层次单方面决定幅度，幅度不影响层次","反比关系：幅度越大，层次越少"],"a":[3],"e":"组织规模≈管理幅度×管理层次。规模一定时，一名管理者直接管辖的下属越多（幅度大），所需层级越少，形成「扁平结构」；幅度小则层次多，形成「高耸（锥形）结构」。「正比」「互不相关」「单向决定」都不符合这一关系。【记忆钩子】幅度大→层次少→扁平；幅度小→层次多→高耸。","k":"管理幅度与管理层次"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"single","q":"按照组织文化的层次划分，价值观、经营信念与基本假设属于（　）。","o":["精神层（深层、核心层）","物质层（表层）","制度层（中层）","行为层（外显层）"],"a":[0],"e":"组织文化常分三层：物质层（厂容厂貌、标识、产品、仪式等外显器物，最易看见）、制度层（规章制度、组织结构、行为规范）、精神层（价值观、经营哲学、基本假设，是核心与灵魂，最稳定、最难改变）。价值观与基本假设显然不在表层或制度层。【记忆钩子】物质看得见、制度管得住、精神改不动。","k":"组织文化层次"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"multi","q":"下列关于组织文化功能的表述中，正确的有（　）。","o":["导向功能：引导成员把个人目标与组织目标结合起来","约束功能：通过共享规范对成员行为产生软性约束","凝聚功能：增强成员对组织的认同与归属感","激励功能：使成员产生自豪感与进取心","组织文化可直接替代劳动合同，从而免除一切制度约束"],"a":[0,1,2,3],"e":"组织文化主要功能：导向、约束（区别于制度硬约束，属「软约束」）、凝聚、激励，以及辐射（对外影响）与调适。「可直接替代劳动合同、免除一切制度约束」夸大且错误——文化只是制度的补充，不能替代法定劳动制度。【记忆钩子】「导、约、凝、激、辐」五功能，取首字连读。","k":"组织文化功能"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"multi","q":"影响组织结构设计的权变因素通常包括（　）。","o":["组织所在地的天气与气候条件","组织战略","组织规模与生命周期阶段","技术与业务特点","外部环境的稳定性与不确定性"],"a":[1,2,3,4],"e":"组织设计的权变因素：战略（结构跟随战略）、规模与生命周期（由小到大、由简单到规范）、技术（单件/批量/连续生产对应不同结构）、环境（稳定→机械式，动态→有机式）。「天气与气候条件」与结构选择没有稳定的因果联系。【记忆钩子】「战略、规模、技术、环境」四大权变因素，结构没有「唯一最优解」。","k":"组织设计权变因素"},{"s":"rl","p":"组织设计与组织文化","c":13,"cn":"组织结构设计与组织文化","t":"multi","q":"与「有机式组织」相比，机械式组织的典型特征包括（　）。","o":["高度专业化与严格的部门化","明确的指挥链与较窄的管理幅度","高度分权、正规化程度很低","高度集权、规范化与标准化程度高","信息主要沿正式层级纵向沟通"],"a":[0,1,3,4],"e":"伯恩斯与斯托克：机械式（适配稳定环境）——高度专业化、刚性部门化、清晰指挥链、窄幅度、集权、高正规化、纵向沟通；有机式（适配动态环境）——低正规化、分权、宽幅度、跨职能团队、横向沟通与灵活协作。「高度分权、正规化程度很低」是有机式特征，故不选。【易错点】稳定环境配机械式、动荡环境配有机式，方向别记反。","k":"机械式与有机式组织"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"single","q":"战略性人力资源管理区别于传统人事管理的关键在于（　）。","o":["把主要精力放在考勤、档案与工资发放等事务上","使人力资源实践与组织战略纵向匹配，并追求各模块之间的横向匹配","完全取消人力资源规划以降低成本","只关注压缩当期的人工成本支出"],"a":[1],"e":"战略性人力资源管理：纵向匹配（HR 战略服从并支撑组织战略）＋横向匹配（招聘、培训、绩效、薪酬等模块彼此协同，形成高绩效工作系统）；HR 部门由行政事务执行者转变为战略伙伴、变革推动者、员工后盾与行政管理专家。「只做考勤档案工资」恰是传统人事管理，「取消规划」「只压成本」都与之相悖。【记忆钩子】「纵向对齐战略，横向对齐彼此」。","k":"战略性人力资源管理"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"single","q":"企业采取成本领先（低成本）竞争战略时，相应的人力资源管理实践通常更强调（　）。","o":["高度柔性的工作设计与鼓励冒险的创新激励","大规模引进高薪顶尖研发人才并弱化成本控制","完全取消绩效考核以营造宽松氛围","效率导向、明确的岗位职责、成本控制与以产出为基础的报酬"],"a":[3],"e":"战略—HR 匹配：成本领先战略对应「效率型」HR 实践——分工明确、标准化、短期与结果导向、严密控制、按产出付酬；差异化/创新战略对应「创新型」HR——柔性、宽泛职责、长期导向、鼓励冒险与团队协作、重培训与开发。「柔性工作设计」「高薪引才弱化成本控制」「取消绩效考核」属差异化或不当做法。【易错点】别把创新战略的「柔性」套到成本战略上。","k":"人力资源战略匹配"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"single","q":"关于高绩效工作系统，下列表述正确的是（　）。","o":["通过严格甄选、系统培训、绩效与薪酬联动、员工参与等一组互补实践提升组织绩效","等同于单一的高薪政策","核心是尽量压缩对员工的培训投入","要求把绩效考核结果完全保密、从不反馈"],"a":[0],"e":"高绩效工作系统（HPWS）是一组「内部一致、互相强化」的 HR 实践组合：选择性招聘、广泛培训、内部晋升、绩效导向薪酬、员工参与与信息共享、就业保障等，通过提升员工的能力、动机与机会（AMO 框架）改善组织绩效。「等同于高薪」「压缩培训」「结果保密不反馈」都与该系统相悖。【记忆钩子】AMO＝Ability 能力、Motivation 动机、Opportunity 机会。","k":"高绩效工作系统"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"single","q":"下列方法中，属于人力资源「需求」预测而非「供给」预测的是（　）。","o":["人员核查法（人员盘点）","马尔可夫分析法（人员转移矩阵）","德尔菲法（专家预测）与趋势、比率分析","替换规划图（管理人员接替图）"],"a":[2],"e":"需求预测（未来需要多少人、何种结构）：定性有德尔菲法、主观判断法，定量有趋势预测、比率分析、回归分析与劳动定额法；供给预测：内部有人员核查法、替换规划图（接替图）、马尔可夫转移矩阵，外部靠劳动力市场分析。「人员核查」「马尔可夫」「替换规划图」都是供给预测工具。【易错点】「德尔菲」与「马尔可夫」最易混：前者测需求（问专家），后者测供给（算内部流动概率）。","k":"人力资源需求预测"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"single","q":"马尔可夫分析法在人力资源规划中主要用于（　）。","o":["预测企业未来产品的市场需求总量","根据历史人员转移概率预测组织内部各类人员的未来供给","评估培训项目的投资回报率","测算外部劳动力市场的总供给规模"],"a":[1],"e":"马尔可夫分析以过去各岗位类别之间晋升、调动、离职的转移概率为基准，推算未来各岗位的内部供给人数，是典型的内部供给预测工具，常用于岗位体系较稳定的大型组织。「产品市场需求」「培训回报率」「外部市场总量」都不是它的用途。【记忆钩子】见到「转移概率/晋升率/离职率」就想到马尔可夫，它管的是「内部人往哪儿流」。","k":"马尔可夫分析法"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"single","q":"当企业预测到某类人员供给大于需求（人员冗余）时，较为稳妥的应对措施是（　）。","o":["立即大规模无条件裁员","大幅提高该类人员的外部招聘规模","冻结一切薪酬调整并取消全部培训","通过自然减员、内部转岗、缩短工时与培训转岗逐步消化，谨慎使用裁员"],"a":[3],"e":"供过于求的对策：冻结外部招聘、自然减员（退休离职不补）、内部调配与转岗、缩短工作时间、培训储备，最后才考虑裁员（成本高、伤士气、涉法律风险）；供不应求时则相反：内部晋升调动、适度加班、培训提效、外部招聘、业务外包、技术革新等。「立即大规模裁员」「反而扩大招聘」「取消全部培训」都不妥。【易错点】裁员是「最后手段」而非首选，选项里出现「立即大规模裁员」几乎都是陷阱。","k":"人力资源供需平衡"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"multi","q":"按照 Ulrich（尤里奇）的人力资源角色模型，人力资源管理者承担的角色包括（　）。","o":["战略伙伴","变革推动者（变革代理人）","员工后盾（员工贡献的捍卫者）","行政管理专家","仅负责保管人事档案的记录员"],"a":[0,1,2,3],"e":"尤里奇按「关注点（战略/日常）×活动（过程/人员）」两维划分四角色：战略伙伴、变革推动者、员工后盾、行政管理专家。「仅负责保管人事档案的记录员」把 HR 窄化为事务执行，正是战略性 HRM 要摆脱的传统定位。【记忆钩子】「战略、变革、后盾、行政」四顶帽子，按「未来/日常」与「事/人」两轴定位。","k":"人力资源管理者角色"},{"s":"rl","p":"战略性人力资源管理","c":14,"cn":"战略性人力资源管理与人力资源规划","t":"multi","q":"根据人力资本投资理论，下列属于人力资本投资形式的有（　）。","o":["各级正规教育与在职培训","医疗保健与营养投入","劳动力流动与迁移（寻找更好就业机会）","为找工作、了解工资信息而进行的信息搜寻","企业购买办公用打印纸与耗材"],"a":[0,1,2,3],"e":"舒尔茨、贝克尔认为凝结在人身上的知识、技能、健康与经验是资本，主要投资形式包括正规教育、在职培训、医疗保健、劳动力流动/迁移以及信息搜寻；收益体现为未来更高的生产率与收入。「购买办公打印纸与耗材」是普通物质消耗，不凝结于人、不提升人的生产能力。【记忆钩子】「教培、健康、迁移、信息」四大投资，共同点都是「花在人身上、图的是将来回报」。","k":"人力资本投资形式"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"single","q":"工作分析最直接、最核心的成果通常体现为（　）。","o":["企业年度财务报表","员工个人绩效面谈记录","工作说明书（含工作描述与任职资格）","市场薪酬调查报告"],"a":[2],"e":"工作分析是系统收集、分析与某职位有关的信息，回答「做什么、为什么做、怎么做、何时何地做、由谁做、需要什么条件」（6W1H）；成果是工作说明书：工作描述（内容、职责、环境、条件）＋任职资格/工作规范（知识、技能、经验、能力、个性要求），是招聘、培训、绩效、薪酬的共同基础。「财务报表」「绩效面谈记录」「薪酬调查报告」是其他环节的产物。【记忆钩子】「一分析、两成果」：描述说「事」，规范说「人」。","k":"工作分析成果"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"single","q":"希望从任职者及其主管处深入了解岗位中「特别有效或特别无效的典型行为」，最适宜的工作分析方法是（　）。","o":["关键事件法","观察法","工作日志法","文献查阅法"],"a":[0],"e":"关键事件法（CIT）：请熟悉岗位的人描述导致特别成功或特别失败的具体行为事件，聚焦可观察的关键行为，常用于行为锚定等级评价与任职资格提炼。「观察法」适合短周期、重复性体力工作，「工作日志法」由员工逐日记录、信息细但整理量大，「文献查阅法」查已有资料。【记忆钩子】「特别好/特别坏的具体事例」→关键事件法。","k":"关键事件法"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"single","q":"关于工作分析中的问卷调查法，下列表述正确的是（　）。","o":["只能一对一实施，无法同时面向多人","可在短时间内面向大量任职者低成本收集信息，但问卷设计质量直接决定效果","完全不需要任职者配合即可完成","所得信息无需任何核实即可直接作为最终结论"],"a":[1],"e":"问卷法（如职位分析问卷 PAQ、管理职位描述问卷 MPDQ）：标准化、覆盖面广、省时省力、便于量化统计，适合大量岗位与人员；局限是设计成本高、易因理解偏差造成信息失真，通常需配合访谈或观察补充核实。「只能一对一」「无需任职者配合」「无需核实直接用」都与实际不符。【易错点】「便宜快速」是优点，「依赖问卷质量、易失真」是代价，二者要一起记。","k":"工作分析问卷法"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"single","q":"胜任素质「冰山模型」中，位于水面之下、难以直接观察却对长期绩效更具预测力的是（　）。","o":["知识","技能","学历证书与专业资格","社会角色、自我概念、特质与动机"],"a":[3],"e":"麦克利兰/斯宾塞冰山模型：水面上是知识与技能（易观察、易培训、属门槛性条件），水面下是社会角色、自我概念、人格特质与动机（深层、难测量、难改变，却是区分绩优者与普通者的关键）。「知识」「技能」「学历证书」都属水面上的显性部分。【记忆钩子】「上知识技能、下角色自我特质动机」，越往下越难改、越能预测长期表现。","k":"胜任素质冰山模型"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"single","q":"通过赋予员工更多计划、组织与控制自身工作的自主权，使工作更完整、更具挑战性，这种工作设计方法属于（　）。","o":["工作丰富化（纵向扩大）","工作扩大化（横向扩大）","工作轮换","工作简化"],"a":[0],"e":"工作扩大化：横向增加同层次、性质相近的任务数量（范围变宽、深度不变）；工作丰富化：纵向增加计划、决策、反馈与自主权（深度增加，依据赫茨伯格双因素理论，给的是激励因素）；工作轮换：定期在不同岗位间轮换；工作简化：把工作拆成更细的简单环节。【易错点】「多干几件差不多的活」是扩大化，「自己能拍板、看到整件成果」是丰富化。","k":"工作丰富化与扩大化"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"multi","q":"工作分析所获得的信息，可作为下列哪些人力资源管理活动的基础依据（　）。","o":["决定公司当日的股价走势","制定招聘的任职资格与甄选标准","确定培训需求与培训内容","设计绩效考核指标与标准","进行工作评价以确定岗位相对价值"],"a":[1,2,3,4],"e":"工作分析是各 HR 模块的「地基」：招聘（任职资格）、培训（能力差距）、绩效（考核标准）、薪酬（工作评价→岗位等级）都依赖它，工作设计与流程再造同样离不开它。「决定公司当日股价走势」与岗位信息毫无关系。【记忆钩子】「招、训、绩、薪」四大模块，都从工作说明书起步。","k":"工作分析的作用"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"multi","q":"一份规范的工作说明书，通常包含的内容有（　）。","o":["工作标识（岗位名称、所属部门、直接上级）","工作职责与工作任务的逐项描述","工作条件、工作环境与所用设备","任职资格（所需知识、技能、经验与能力）","该岗位任职者家庭成员的个人信息"],"a":[0,1,2,3],"e":"工作说明书＝工作描述＋任职资格。工作描述含工作标识、工作概要、职责与任务、工作联系、工作环境与条件、使用设备等；任职资格含教育程度、经验、技能、能力、培训与个性要求。「任职者家庭成员的个人信息」属与岗位无关的个人隐私，不应写入。【易错点】「任职要求」写的是「岗位需要什么」，不是「现任者是谁」。","k":"工作说明书内容"},{"s":"rl","p":"工作分析与胜任素质","c":15,"cn":"工作分析与胜任素质模型","t":"multi","q":"根据工作特征模型（JCM），构成「核心工作特征」的维度包括（　）。","o":["技能多样性","任务完整性与任务重要性","工作自主性","工作反馈","上级的个人财富水平"],"a":[0,1,2,3],"e":"哈克曼—奥尔德姆工作特征模型：五个核心维度——技能多样性、任务完整性、任务重要性、工作自主性、反馈。前三者共同带来「工作意义感」，自主性带来「责任感」，反馈带来「对结果的了解」，进而提升内部工作动机、绩效与满意度。「上级的个人财富水平」与工作本身无关。【记忆钩子】「多、整、要、主、馈」五维，对应「意义、责任、知果」三种心理状态。","k":"工作特征模型"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"single","q":"组织优先从内部选拔人员填补空缺，其显著优点之一是（　）。","o":["必然带来全新的管理理念与外部经验","对候选人了解更充分、误选风险低，并能激励现有员工、缩短上岗适应期","可以完全避免内部人际矛盾","招聘成本一定高于外部招聘"],"a":[1],"e":"内部招募（工作公告、内部推荐、接替图）：信息对称、误选风险小、上岗快、成本低、能激励士气与保留人才；局限是「近亲繁殖」、缺新思路、可选范围有限、易引发未晋升者不满。「必然带来全新理念」是外部招募的优点，「完全避免矛盾」「成本一定更高」也都站不住。【易错点】内部招募会「减少」而非「完全避免」矛盾，落选者的挫伤恰是常见副作用。","k":"内部招募优缺点"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"single","q":"与「非结构化面试」相比，结构化面试的主要特点是（　）。","o":["面试官可随意追问、凭个人感觉打分","完全不涉及与工作相关的提问","只允许一位考官提问且不做任何记录","对所有候选人使用统一的问题、评分标准与实施程序，信度与效度通常更高"],"a":[3],"e":"结构化面试：问题基于工作分析预先设定，提问顺序、评分维度与量表统一，多名考官按锚定标准打分并留记录，从而减少主观偏差与随意性，信效度明显高于非结构化面试；行为描述面试（STAR）与情境面试是其常见形式。「随意追问」「不涉及工作相关提问」「单人提问不记录」恰是非结构化或不当做法。【记忆钩子】「同题、同序、同尺、同记录」＝结构化。","k":"结构化面试"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"single","q":"下列甄选技术中，属于「评价中心技术」典型形式的是（　）。","o":["无领导小组讨论与文件筐（公文处理）测验","单纯查验学历证书","星座与血型分析","随机抽签决定录用"],"a":[0],"e":"评价中心以情景模拟为核心，多方法、多考官、多维度、历时较长，典型形式包括无领导小组讨论、文件筐/公文筐测验、角色扮演、管理游戏、案例分析与演讲等，常用于管理人员选拔，预测效度较高。「查验学历证书」属于背景核查，「星座血型」属伪科学，「抽签录用」毫无效度。【记忆钩子】「无领导、文件筐、角色扮」是评价中心三件套。","k":"评价中心技术"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"single","q":"关于甄选方法的信度与效度，下列表述正确的是（　）。","o":["信度高就一定效度高","效度高则信度一定低","信度与效度只是同一概念的不同叫法","效度高通常以信度高为前提，但信度高并不保证效度高"],"a":[3],"e":"信度＝测量结果的一致性/稳定性（同一人反复测、不同评分者之间结果是否一致）；效度＝测到的是否真是想测的东西（能否预测工作绩效）。信度是效度的必要非充分条件：一把「稳定但不准」的尺子信度高、效度低，而效度高必然要求测量先稳定。「信度高就一定效度高」「效度高则信度低」「同一概念」都不成立。【记忆钩子】信度看「稳不稳」，效度看「准不准」；稳是准的门票。","k":"信度与效度"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"single","q":"用于测量申请人「是否具备完成某项工作所需的认知能力或潜能」的测验，通常属于（　）。","o":["人格（个性）测验","能力（认知能力/性向）测验","职业兴趣测验","诚实度/诚信测验"],"a":[1],"e":"甄选常用心理测验：认知能力测验（言语、数理、推理等，对工作绩效预测力较强）、人格测验（如大五人格，测「合不合适」）、职业兴趣测验（人—职匹配）、诚信/诚实度测验。「人格」测性格特质，「兴趣」测偏好，「诚信」测诚实倾向，唯「能力」测能不能干。【易错点】「能不能干」问能力，「愿不愿/合不合」问人格与兴趣。","k":"心理测验类型"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"multi","q":"下列关于招募渠道的表述中，正确的有（　）。","o":["内部招募有助于激励员工、降低误选风险，但可选范围有限","外部招募能带来新观念与新技术，但适应期较长、成本与风险较高","校园招聘适合批量补充初级与储备人才","借助猎头（高级人才寻访）多用于中高端、稀缺关键岗位","外部招募必然比内部招募更快、更省成本"],"a":[0,1,2,3],"e":"内外部渠道各有优劣：内部快、准、省、激励士气但易近亲繁殖；外部来源广、带来新血但筛选成本高、融入慢、存在「外来和尚」落位风险。「校园招聘」面向应届生做人才储备，「猎头」面向高端稀缺岗。「外部必然更快更省」把相对优势绝对化，恰与事实相反。【记忆钩子】内部「准省稳」，外部「广新贵」。","k":"招募渠道辨析"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"multi","q":"关于常见甄选方法的预测效度，下列说法正确的有（　）。","o":["工作样本测试与结构化面试通常具有较高预测效度","认知能力测验对多类岗位的绩效有较好预测力","评价中心技术对管理潜质的预测效度较高","非结构化面试、笔迹与相貌推断的预测效度通常较低","只要面试时间足够长，任何甄选方法的效度都会自动变高"],"a":[0,1,2,3],"e":"效度研究相对稳定的结论：工作样本/工作知识测试、结构化面试、认知能力测验、评价中心、配合使用的履历与推荐核查效度较好；非结构化面试、笔迹学、相貌与星座推断等近乎无效或很弱。效度取决于方法本身与岗位的相关性，不靠「聊得久」来补，「时间够长就自动变高」不成立。【易错点】「面试越随意越能看准人」是误区，结构化才是效度保障。","k":"甄选方法效度"},{"s":"rl","p":"招募与甄选方法","c":16,"cn":"人员招募与甄选","t":"multi","q":"关于人员录用与背景调查，下列做法恰当的有（　）。","o":["对拟录用人员核实学历、任职资格与过往履历的真实性","在录用前明确告知岗位职责、录用条件与薪酬构成","依据与岗位相关的统一标准作出录用决策，并保留书面记录","对关键岗位可在征得候选人同意后开展合规的背景核查","仅凭面试官第一印象的「眼缘」当场定薪定岗"],"a":[0,1,2,3],"e":"规范录用：以工作分析得到的任职资格为准绳、统一标准、书面留痕；背景调查（学历、履历、离职原因、有无竞业限制等）验证信息真实性、降低误聘风险，须依法合规并取得授权；录用条件与薪酬应事先明确，避免后续争议。「仅凭眼缘当场定薪定岗」属典型主观随意决策，与结构化、标准化原则相悖。【记忆钩子】录用四步：核信息、明条件、按标准、留记录。","k":"录用决策与背景调查"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"single","q":"培训需求分析的三层次模型通常包括（　）。","o":["组织分析、任务（工作）分析与人员分析","财务分析、市场分析与生产分析","战略分析、竞争分析与品牌分析","学历分析、年龄分析与籍贯分析"],"a":[0],"e":"培训需求分析（McGehee & Thayer）：组织分析（战略目标、资源与氛围是否支持培训）、任务/工作分析（岗位需要什么知识技能，依据工作说明书）、人员分析（谁需要培训、现有能力差距在哪）。三者依次回答「该不该做、做什么、给谁做」。「财务/市场/生产」「战略/竞争/品牌」「学历/年龄/籍贯」都不是该模型的层次。【记忆钩子】「组织定方向、任务定内容、人员定对象」。","k":"培训需求分析层次"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"single","q":"让受训者在真实工作岗位上、由经验丰富的员工或主管边干边指导，这种培训方法属于（　）。","o":["讲授法","案例研讨法","在职培训（如师带徒、教练法、工作轮换）","角色扮演法（模拟情境）"],"a":[2],"e":"在职培训（OJT）：学徒/师带徒、教练辅导、工作轮换、行动学习，在真实岗位上边做边学，成本低、迁移快，但可能干扰正常生产、受指导者水平限制。「讲授法」「案例研讨」「角色扮演」多属脱产/离岗方法。【易错点】角色扮演虽「像在做」，但发生在模拟情境中，仍归脱产方法，不算在职培训。","k":"在职培训方法"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"single","q":"在柯氏（Kirkpatrick）培训效果评估四级模型中，考察「学员回到岗位后是否真正运用了所学内容」属于（　）。","o":["反应层（第一级）","学习层（第二级）","结果层（第四级）","行为层（第三级）"],"a":[3],"e":"柯氏四级：一级反应（学员喜不喜欢、满不满意）、二级学习（知识技能态度有无提升，常用测验）、三级行为（回岗后有没有用起来，常靠主管同事观察与 360 反馈）、四级结果（组织层面绩效、质量、成本、离职率等有无改善）。层级越高，评估越难、越接近业务价值。【记忆钩子】「满意—学会—用了—见效」逐级递进。","k":"柯氏四级评估"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"single","q":"关于绩效管理与绩效考核的关系，下列表述正确的是（　）。","o":["二者完全相同，只是叫法不同","绩效考核只是绩效管理循环中的一个环节，绩效管理还包含计划、辅导与反馈应用","绩效管理仅仅是年终填一张评分表","绩效考核的结果不应向员工反馈"],"a":[1],"e":"绩效管理是持续闭环：绩效计划（定目标与指标）→绩效监控与辅导（过程跟踪、及时反馈）→绩效考核（评价）→绩效反馈面谈与结果应用（改进、薪酬、培训、晋升）。绩效考核只对应「评价」这一步。「完全相同」「只填一张表」「结果不反馈」都把管理窄化或违背了闭环原则。【易错点】把「考核」当「管理」的全部，是导致「重打分、轻改进」的根源。","k":"绩效管理与绩效考核"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"single","q":"关于关键绩效指标（KPI），下列说法正确的是（　）。","o":["应围绕组织战略目标层层分解，抓住少数关键、可衡量的产出指标","指标越多越全面，应把员工所有行为都列入考核","只能由员工自行设定，管理者不得参与","完全不需要设定目标值或衡量标准"],"a":[0],"e":"KPI 源自「二八原理」与战略目标分解：从公司级 KPI → 部门级 → 岗位级，聚焦对战略贡献最大的少数关键指标，且须符合 SMART（具体、可衡量、可达成、相关、有时限）。指标过多会稀释重点、抬高考核成本；「不需目标值」「只由员工自定」都不符合 SMART 与上下对齐原则。【记忆钩子】KPI 的灵魂是「抓关键、可衡量、能对齐战略」。","k":"关键绩效指标"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"single","q":"平衡计分卡（BSC）从四个维度平衡地衡量组织绩效，下列正确的一组是（　）。","o":["财务、生产、销售、人事","收入、利润、税收、股价","财务、客户、内部业务流程、学习与成长","成本、质量、交期、库存"],"a":[2],"e":"卡普兰与诺顿 BSC：财务（股东怎么看）、客户（客户怎么看）、内部业务流程（我们擅长什么）、学习与成长（能否持续改进，含员工能力、信息系统与组织文化），把短期财务指标与长期驱动因素、滞后指标与领先指标结合起来。「生产/销售/人事」「收入/利润/税收/股价」「成本/质量/交期/库存」都是单一财务或运营视角，未体现四维平衡。【记忆钩子】「财、客、流、学」四维，兼顾「结果」与「动因」。","k":"平衡计分卡"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"multi","q":"下列关于常见绩效考核方法的说法，正确的有（　）。","o":["行为锚定等级评价法（BARS）把关键事件与量表结合，评价尺度更具体","关键事件法记录特别有效或无效的典型行为，便于反馈但难以横向比较与量化","360 度反馈汇集上级、同事、下属、客户及自评等多源信息，信息较全面","强制分布法要求考核结果按预定比例落入各等级，可能引发内部竞争","配对比较法被考核人数越多越省事，最适合大规模全员考核"],"a":[0,1,2,3],"e":"「行为锚定等级评价法把关键事件与量表结合」「关键事件法重反馈轻排序」「360 度多源但需防老好人」「强制分布按比例分级易引发竞争」四项表述都成立。「配对比较法被考核人数越多越省事」错——它需两两成对比较，比较次数为 n(n−1)/2，人数增加时工作量急剧上升，恰恰最不适合大规模考核。【易错点】「人一多就爆炸」是配对比较法与排序法的共同软肋。","k":"绩效考核方法辨析"},{"s":"rl","p":"培训开发与绩效管理工具","c":17,"cn":"培训开发与绩效管理","t":"multi","q":"关于绩效反馈面谈与考核结果应用，下列做法正确的有（　）。","o":["面谈前让员工先做自评并准备事实与数据，面谈时以双向沟通为主","反馈应聚焦具体行为与可改进事项，而非笼统评价个人性格","与员工共同制定下一周期的绩效改进计划与目标","考核结果可合理用于薪酬调整、培训安排、晋升与岗位配置","为避免冲突，考核结果和理由一律不告知员工本人"],"a":[0,1,2,3],"e":"有效反馈：准备充分（自评＋事实数据）、对事不对人、双向倾听、就改进计划与下期目标达成共识，并落到薪酬、培训、晋升、转岗等结果应用。「一律不告知本人」与「反馈」本身相矛盾——绩效管理强调公开透明与持续改进，隐瞒结果只会削弱信任与改进动力。【记忆钩子】反馈四要：有准备、讲事实、共定计划、落到应用。","k":"绩效反馈与结果应用"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"single","q":"在职位薪酬体系设计中，先确定若干报酬要素并分级配点，再按各岗位在要素上的得分汇总出相对价值，这种工作评价方法是（　）。","o":["排序法","分类法（套级法）","市场定价法","要素计点法（点数法）"],"a":[3],"e":"工作评价四法：排序法（整体由高到低排队，简单粗放）、分类法（先定等级标准再把岗位套进去）、要素计点法（选定报酬要素如技能、责任、努力、工作条件，分级配点、加权求和，最量化、最常用）、因素比较法（按基准岗位与要素逐项比较，较复杂）。「市场定价法」依赖外部薪酬调查，属外部取向而非严格的内部工作评价。【记忆钩子】「排、分、点、比」四法，计点法最精确、最费工。","k":"工作评价—要素计点法"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"single","q":"与传统的窄带（多等级、级差小）薪酬结构相比，宽带薪酬的主要特点是（　）。","o":["把原来较多的薪酬等级压缩为少数几个宽幅区间，同一等级内薪酬变动范围更大","薪酬等级数量更多、每个等级的浮动区间更窄","完全取消基本薪酬，只发放奖金","薪酬只与工龄挂钩，与绩效和技能无关"],"a":[0],"e":"宽带薪酬把十几甚至几十个薪酬等级合并为少数几个「宽带」，每带内薪酬区间（最小值—中值—最大值）大幅拉宽，支持扁平化组织、鼓励横向轮岗与技能/绩效成长而不必靠晋升涨薪，弱化「官本位」意识。「等级更多、区间更窄」恰是传统窄带结构，「取消基本薪酬」「只与工龄挂钩」也不成立。【易错点】宽带薪酬「等级少、幅度宽」，方向别记反；它仍是基本薪酬体系。","k":"宽带薪酬"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"single","q":"与直接薪酬（工资、奖金）相比，员工福利的典型特点是（　）。","o":["完全随个人绩效波动，绩效差就没有","必须以现金一次性发放","只对高层管理人员提供","多以非现金或延期、实物服务形式提供，具有普惠性、非激励性与一定刚性"],"a":[3],"e":"福利属间接薪酬：法定福利（社会保险、法定休假等）＋企业自愿福利（补充保险、体检、餐补、弹性福利等）。特点：多为非现金/服务或延期支付、通常面向全体或某类员工而非按绩效差别、具有普惠与保障性质、一经设立易升难降（刚性），主要作用是吸引保留与增强安全感，而非直接激励短期绩效。「完全随绩效波动」「必须现金发放」「只给高层」都不符。【易错点】福利「保人不催人」——它留人，但不像奖金那样直接拉绩效。","k":"员工福利特点"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"single","q":"劳动关系与劳务（民事）关系的重要区别在于（　）。","o":["劳务关系也必然要缴纳社会保险","劳动关系只能以口头方式建立","劳动者成为用人单位成员、在其管理指挥下从事有报酬劳动，具有人身与组织上的从属性","双方是完全平等、互不隶属的民事主体"],"a":[2],"e":"劳动关系的核心认定标准是「从属性」：人格/组织从属（受规章制度约束、接受指挥监督、纳入组织体系）＋经济从属（以用人单位支付的报酬为主要生活来源）。「双方完全平等、互不隶属」描述的是劳务/承揽等民事关系；是否缴纳社保、是否书面，都是法律后果或形式要求而非本质区别。【记忆钩子】认定劳动关系就抓两个字——「从属」。","k":"劳动关系的从属性"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"single","q":"社会保险区别于商业保险的根本属性是（　）。","o":["以自愿投保、等价交换、追求利润为原则","完全由市场费率自由定价、政府不作任何干预","保障水平完全取决于个人缴费多少，多投多保、不投不保","由国家依法强制实施、以保障基本生活为目的的非营利性社会制度"],"a":[3],"e":"社会保险：国家立法强制、政府主导、互济共担、保障基本生活、非营利、待遇与缴费挂钩但更强调社会共济与再分配；商业保险：自愿投保、合同约定的对价交换、保险公司以营利为目的、多投多保。「自愿投保追求利润」「市场自由定价」「多投多保不投不保」描述的都是商业保险逻辑。【易错点】「强制、互济、保基本、非营利」四个词是社保的身份标签。","k":"社会保险与商业保险"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"single","q":"关于劳动争议的处理，下列表述正确的是（　）。","o":["任何劳动争议都必须先经法院诉讼，仲裁只是可选程序","调解达成的协议一律不具有任何约束力","劳动争议只能由用人单位单方决定是否受理","一般遵循「先调解、调解不成再仲裁，对仲裁裁决不服可依法提起诉讼」的递进路径"],"a":[3],"e":"劳动争议处理体制通常概括为「协商—调解—仲裁—诉讼」：发生争议可先协商或向调解组织申请调解；调解不成或不愿调解可申请劳动争议仲裁；对仲裁裁决不服（法律规定部分终局裁决除外）可向人民法院起诉，仲裁一般是诉讼的前置程序。「必须先诉讼」「调解协议一律无约束力」「由单位单方决定受理」都不符合该体制。【记忆钩子】「调、裁、审」三步走，仲裁是进法院的「闸门」。","k":"劳动争议处理程序"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"multi","q":"下列关于薪酬体系与薪酬构成的说法，正确的有（　）。","o":["职位薪酬体系以岗位相对价值为主要付酬依据，需先做工作分析与工作评价","技能/能力薪酬体系以任职者所具备的技能或能力深度、广度为主要付酬依据","绩效薪酬把部分报酬与个人、团队或组织绩效结果挂钩","基本薪酬通常相对稳定，可变薪酬随绩效波动，间接薪酬以福利为主","职位薪酬体系下，同一岗位无论任职者能力高低，薪酬必定完全相同且永不调整"],"a":[0,1,2,3],"e":"三种基本薪酬体系：职位（以岗定薪）、技能/能力（以人定薪）、绩效（以结果定薪）；薪酬构成＝基本＋可变＋间接（福利）。「同岗薪酬必定完全相同且永不调整」把「以岗定薪」绝对化——同岗仍可因资历、绩效、技能、市场调整与薪档而不同，薪酬结构本身也设区间与调薪机制。【易错点】「以岗定薪」不等于「同岗同酬、永不变化」。","k":"薪酬体系与构成"},{"s":"rl","p":"薪酬结构与劳动关系","c":18,"cn":"薪酬设计、劳动关系与人力资本投资","t":"multi","q":"根据人力资本投资理论，下列关于人力资本投资的说法正确的有（　）。","o":["人力资本投资的成本包括直接成本、放弃的收入（机会成本）与心理成本","人们是否投资于教育或培训，取决于对未来收益与当前成本的比较","在职培训可分为一般在职培训与特殊（企业专用）在职培训","一般培训形成的技能通用，其成本与收益的承担方式不同于特殊培训","人力资本一旦形成便不会贬值，也无需后续再投资"],"a":[0,1,2,3],"e":"贝克尔人力资本理论：投资成本＝直接支出＋因学习放弃的收入（机会成本，往往是最大一块）＋心理成本；决策依据是未来收益增量（更高生产率与收入）折现后是否大于成本；培训分「一般培训」（技能通用、可带走，通常由受训者承担成本）与「特殊培训」（只对本企业有用，企业更愿分担成本并留住员工）。「一旦形成便不会贬值、无需再投资」错——知识技能会折旧老化，需要持续再投资与终身学习。【记忆钩子】一般培训「谁受益谁买单」多落在员工，特殊培训企业愿意一起扛。","k":"人力资本投资成本与培训类型"}],"ruankao":[{"s":"ruankao","p":"信息化知识","c":1,"cn":"信息化知识","t":"single","q":"信息系统集成项目中，“信息系统”的生命周期一般包括立项、开发、运维和（　）四个阶段。","o":["消亡","测试","编码","验收"],"a":[0],"e":"信息系统生命周期：立项（概念）→开发（分析、设计、实施、验收）→运维→消亡。开发阶段又细分为系统分析、系统设计、系统实施、系统验收。","k":"信息系统生命周期"},{"s":"ruankao","p":"信息化知识","c":1,"cn":"信息化知识","t":"single","q":"电子政务的内容中，G2B 表示（　）。","o":["政府对企业类的电子政务","政府对公务员","政府对公众","企业对企业"],"a":[0],"e":"电子政务分类：G2G 政府对政府、G2B 政府对企业、G2C 政府对公众、G2E 政府对公务员。电子商务则为 B2B、B2C、C2C 等。","k":"电子政务"},{"s":"ruankao","p":"信息化知识","c":1,"cn":"信息化知识","t":"single","q":"商业智能（BI）系统的核心技术不包括（　）。","o":["数据仓库","数据挖掘","联机分析处理（OLAP）","由人手工翻阅纸质台账"],"a":[3],"e":"商业智能=数据仓库＋OLAP＋数据挖掘＋可视化展示，用于辅助决策。手工翻阅纸质台账不属于 BI 核心技术。","k":"商业智能"},{"s":"ruankao","p":"信息化知识","c":1,"cn":"信息化知识","t":"single","q":"云计算服务的三种主要模式是（　）。","o":["IaaS、PaaS、SaaS","LAN、WAN、MAN","TCP、UDP、HTTP","C/S、B/S、M/S"],"a":[0],"e":"IaaS（基础设施即服务）、PaaS（平台即服务）、SaaS（软件即服务）。云部署模式：公有云、私有云、混合云。","k":"云计算"},{"s":"ruankao","p":"信息系统项目管理","c":2,"cn":"项目管理基础","t":"single","q":"项目管理的“三重约束”是指（　）。","o":["范围、时间、成本的相互制约关系","质量、安全、环保","人力、财力、物力","计划、执行、检查"],"a":[0],"e":"范围、时间、成本构成项目管理三重约束，质量受三者共同影响，任何一项变动都会影响其他两项。","k":"项目三重约束"},{"s":"ruankao","p":"信息系统项目管理","c":2,"cn":"项目管理基础","t":"single","q":"项目具有临时性、独特性和（　）的特征。","o":["渐进明细性","永久性","重复性","随机性"],"a":[0],"e":"项目三大特性：临时性（有始有终）、独特性（交付独特成果）、渐进明细（逐步完善）。日常运营是持续重复的，不是项目。","k":"项目的特征"},{"s":"ruankao","p":"信息系统项目管理","c":2,"cn":"项目管理基础","t":"single","q":"项目管理过程组中，制定项目章程属于（　）。","o":["启动过程组","规划过程组","执行过程组","监控过程组"],"a":[0],"e":"五大过程组：启动（项目章程、识别干系人）、规划、执行、监控、收尾（验收移交、经验总结）。制定项目章程是启动过程组的核心工作，授权项目经理使用组织资源。","k":"项目管理过程组"},{"s":"ruankao","p":"信息系统项目管理","c":2,"cn":"项目管理基础","t":"single","q":"项目干系人是指（　）。","o":["能影响项目决策、活动或结果的个人、群体或组织，以及被影响的个人、群体或组织","仅指客户","仅指项目团队成员","仅指公司领导"],"a":[0],"e":"干系人范围广泛：客户、发起人、团队、供应商、政府、公众等。管理干系人期望、平衡其利益是项目成功的关键。","k":"项目干系人"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"single","q":"项目范围管理中，防止“范围蔓延”（scope creep）的正确做法是（　）。","o":["严格按范围基准控制，范围变更须经整体变更控制过程审批","客户要求什么都做","范围越模糊越好","不断主动增加功能讨好客户"],"a":[0],"e":"范围蔓延=未经变更控制的范围扩大。范围基准（范围说明书＋WBS＋WBS 词典）一经批准，任何变更都要走变更流程。","k":"范围管理"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"single","q":"WBS（工作分解结构）的分解原则中，最底层的工作包应（　）。","o":["可分配给单一责任人来完成，可估算、可监控","越小越好，细到每一分钟","越大越好，方便管理","与 WBS 词典无关"],"a":[0],"e":"工作包是 WBS 最底层要素：责任到人、可估算工期与成本、可监控。8/80 原则（工时 8~80 小时）是常用经验值。","k":"工作分解结构"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"single","q":"进度管理中，关键路径是指（　）。","o":["网络图中历时最长的路径，决定项目最短工期","历时最短的路径","成本最高的路径","资源最多的路径"],"a":[0],"e":"关键路径上工作总时差最小（通常为零），关键工作延误将延误整个项目；压缩工期应从关键路径上的工作入手。","k":"关键路径法"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"single","q":"挣值分析中，进度绩效指数 SPI＝EV/PV，当 SPI＜1 时表示（　）。","o":["进度落后","进度提前","成本超支","成本节约"],"a":[0],"e":"SPI＝EV/PV＜1 进度落后；CPI＝EV/AC＜1 成本超支。SPI＞1 进度提前，CPI＞1 成本节约。","k":"挣值分析"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"single","q":"质量管理中“PDCA 循环”的正确顺序是（　）。","o":["计划—执行—检查—处理","执行—计划—处理—检查","检查—处理—计划—执行","处理—检查—执行—计划"],"a":[0],"e":"戴明环 PDCA：Plan 计划→Do 执行→Check 检查→Act 处理（固化或进入下一循环），持续改进质量。","k":"质量管理（PDCA）"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"single","q":"风险管理中，“风险暴露（风险敞口）”的计算通常为（　）。","o":["风险概率×风险影响","风险影响−风险概率","风险概率÷风险影响","风险概率＋风险影响＋成本"],"a":[0],"e":"风险暴露＝概率×影响（期望 monetary value），用于风险定量分析与应对策略排序。应对策略：规避、转移、减轻、接受（威胁）；开拓、分享、提高、接受（机会）。","k":"风险管理"},{"s":"ruankao","p":"信息系统与安全","c":4,"cn":"信息系统与安全","t":"single","q":"信息系统安全的三要素（CIA）是（　）。","o":["保密性、完整性、可用性","保密性、完整性、可抵赖性","真实性、可控性、可用性","可靠性、稳定性、经济性"],"a":[0],"e":"信息安全 CIA 三要素：保密性（Confidentiality）、完整性（Integrity）、可用性（Availability），另有可审查性、可控性、不可抵赖性等扩展属性。","k":"信息安全三要素"},{"s":"ruankao","p":"信息系统与安全","c":4,"cn":"信息系统与安全","t":"single","q":"非对称加密算法（公钥加密）的典型代表是（　）。","o":["RSA","AES","DES","MD5"],"a":[0],"e":"RSA 为非对称加密（公钥/私钥成对）；AES、DES 是对称加密；MD5 是哈希算法（完整性校验，不可逆）。数字签名＝私钥签名＋公钥验证。","k":"加密技术"},{"s":"ruankao","p":"信息系统与安全","c":4,"cn":"信息系统与安全","t":"single","q":"我国《网络安全法》规定，网络运营者收集使用个人信息应当遵循的原则不包括（　）。","o":["可以随意出售个人信息牟利","合法、正当、必要","公开收集使用规则","经被收集者同意"],"a":[0],"e":"个人信息收集使用必须合法、正当、必要，公开规则、明示目的方式范围、经同意，不得泄露、篡改、毁损、出售。","k":"网络安全法"},{"s":"ruankao","p":"法律法规与标准","c":5,"cn":"法律法规与标准","t":"single","q":"《招标投标法》适用于工程建设项目，其中“投标人少于（　）个的，招标人应当重新招标”。","o":["3","2","5","7"],"a":[0],"e":"投标人少于 3 个的，招标人应当重新招标——保证竞争性是招标制度的核心。","k":"招投标法"},{"s":"ruankao","p":"法律法规与标准","c":5,"cn":"法律法规与标准","t":"single","q":"根据《政府采购法》，政府采购的主要方式是（　）。","o":["公开招标","单一来源采购","竞争性谈判","询价"],"a":[0],"e":"公开招标是政府采购的主要采购方式（达到限额标准的项目原则上公开招标）。符合特殊情形才可用邀请招标、竞争性谈判、单一来源、询价等。","k":"政府采购法"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"multi","q":"项目管理十大知识域包括（　）。","o":["整合管理","范围管理","进度管理","成本管理","恋人和朋友管理"],"a":[0,1,2,3],"e":"十大知识域：整合、范围、进度、成本、质量、资源、沟通、风险、采购、干系人管理。E 为干扰项。","k":"项目管理知识域"},{"s":"ruankao","p":"项目管理知识域","c":3,"cn":"项目管理知识域","t":"multi","q":"变更管理流程的正确环节包括（　）。","o":["提出变更申请","变更影响评估","CCB（变更控制委员会）审批","实施与验证变更","变更后无需通知任何干系人"],"a":[0,1,2,3],"e":"变更管理：申请→评估→CCB 审批→实施→验证→通知干系人→归档。绕过流程的变更（未批先改）是项目失控主因之一。","k":"变更管理"},{"s":"ruankao","p":"信息系统与安全","c":4,"cn":"信息系统与安全","t":"multi","q":"信息系统安全的常用防护措施包括（　）。","o":["防火墙与入侵检测","数据加密与数字签名","访问控制与身份认证","数据备份与容灾","把管理员密码设为 123456 方便记忆"],"a":[0,1,2,3],"e":"技术防护：防火墙、IDS/IPS、加密、签名、PKI、访问控制、备份容灾。弱口令是安全事故最常见诱因之一。","k":"安全防护措施"},{"s":"ruankao","p":"信息系统项目管理","c":2,"cn":"项目管理基础","t":"multi","q":"关于项目经理的说法中，正确的有（　）。","o":["项目经理是项目成败的关键人物","项目经理应具备 enough 的技术能力、领导力与沟通能力","项目经理对项目结果负责","项目经理只负责技术不负责沟通","项目经理由项目章程正式授权"],"a":[0,1,2,4],"e":"项目经理通过项目章程获得授权，是整合者与沟通枢纽，对项目目标负责。沟通占项目经理工作时间的 80% 以上，“只管技术”是错误认知。","k":"项目经理角色"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"关于项目与运营的区别，下列说法正确的是（　）。","o":["项目是临时性、独特性的工作，运营是持续且重复的工作","项目和运营都是永久持续、没有终点的工作","运营具有独特性，项目具有高度重复性","项目没有明确的开始与结束时间"],"a":[0],"e":"项目具有临时性（有明确起止）、独特性（交付独特成果）与渐进明细；运营是持续、重复、维持业务运转的日常活动。【记忆钩子】“项目有始有终做一次，运营日复一日不停歇”。B、C 把两者特征对调，D 否认了项目的临时性，均错。","k":"项目与运营"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"在五大过程组中，监控过程组的主要作用是（　）。","o":["跟踪、审查和调整项目进展与绩效，识别必要变更并启动变更","编制项目管理计划与各子计划","正式授权项目或阶段启动","完成验收移交并正式结束项目"],"a":[0],"e":"启动＝授权（项目章程、识别干系人）；规划＝定计划与基准；执行＝完成工作产出成果；监控＝跟踪审查调整绩效、识别偏差与必要变更；收尾＝验收移交、结束。【易错点】监控不是“只盯着看”，还要触发变更请求；“制定项目章程”属启动而非监控。","k":"五大过程组"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"下列哪一项属于组织过程资产（OPA）？（　）。","o":["组织积累的项目管理模板、历史信息与经验教训知识库","组织的组织结构、治理模式与企业文化","市场上的人力资源供给条件","国家或行业发布的强制性与推荐性标准"],"a":[0],"e":"组织过程资产（OPA）是组织内部可复用、可更新的资产：流程/政策/模板、配置与财务数据库、历史信息与经验教训知识库；事业环境因素（EEF）是项目只能被动适应的既定约束（文化结构、设施、市场、法规标准、人事制度）。【记忆钩子】“资产能攒能改（模板、经验库），环境只能适应（文化、法规）”。B、C、D 都是 EEF。","k":"组织过程资产与事业环境因素"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"关于项目章程（Project Charter）的作用，下列说法错误的是（　）。","o":["详细规定每项活动的具体工期与活动级预算","正式授权项目或阶段存在","任命项目经理并授权其动用组织资源","记录项目的高层级目标、需求与主要干系人"],"a":[0],"e":"项目章程由发起人签发，是高层级、纲领性的授权文件：授权项目、任命项目经理、记录高层级需求/目标/风险/里程碑/总体预算。逐活动的工期与预算属于项目管理计划及进度、成本基准，不在章程中。【易错点】章程是“授权书”不是“详细计划”，A 把基准级内容错放进章程，故错误的是 A。","k":"项目章程"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"在几种典型组织结构中，项目经理权力最大、对资源控制力最强的是（　）。","o":["项目型（项目化）组织","职能型组织","弱矩阵组织","平衡矩阵组织"],"a":[0],"e":"职能型：项目经理多为兼职、权力很小，资源由职能经理掌控；矩阵型分弱/平衡/强，权力随矩阵增强而递增；项目型：项目经理全职、权限大、直接控制预算与资源。【记忆钩子】“职能→弱矩阵→平衡矩阵→强矩阵→项目型，项目经理权力一路递增”。B、C、D 的权力均小于项目型。","k":"组织结构类型"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"关于项目管理办公室（PMO），下列说法正确的是（　）。","o":["PMO 通过提供模板、方法论、治理与跨项目协调来支持项目管理","PMO 直接取代项目经理并对每个具体项目的交付结果负全责","PMO 只负责编写代码与执行单元测试","PMO 无权参与任何项目治理与标准制定"],"a":[0],"e":"PMO 是组织级管理部门，职能包括制定标准/模板/方法论、提供培训与资源、项目治理与监督、跨项目协调；分支持型、控制型、指令型三类，指令型可较强地直接管理项目，但仍不等于“取代项目经理”。【易错点】PMO 管“标准与治理”，项目经理管“单项目交付”，B 夸大、C 与 D 缩权，均错。","k":"PMO"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"项目生命周期中，阶段关口（phase gate，阶段审查）的主要用途是（　）。","o":["在阶段结束时审查绩效与可交付成果，决定继续、整改或终止项目","把项目范围逐层拆解为 WBS 工作包","为每一个活动估算持续时间与资源","替代项目收尾阶段的正式验收"],"a":[0],"e":"阶段关口（阶段门/里程碑评审）在每个阶段末进行，把阶段成果与业务目标、继续条件比对，作出继续、整改或终止（go/no-go）决策。【易错点】关口是“决策点”而非分解或估算工具，也不能取代最终收尾验收。B、C、D 均属张冠李戴。","k":"项目生命周期与阶段关口"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"single","q":"关于“过程组”与“项目阶段”的关系，下列说法正确的是（　）。","o":["五大过程组可在每个阶段内重复开展，并非与阶段一一对应","一个过程组在整个项目中只能出现一次","过程组就是项目生命周期的五个阶段","启动过程组只在收尾阶段才开展"],"a":[0],"e":"过程组是管理动作的逻辑分组，不是时间阶段；每个阶段（乃至子阶段）都可能完整走一遍启动→规划→执行→监控→收尾。【记忆钩子】“阶段是时间段，过程组是动作集，动作在每个阶段都重演”。B、C、D 把过程组当成阶段或限制其出现次数，均错。","k":"过程组与阶段关系"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"multi","q":"下列均为管理领域名称，其中属于项目管理十大知识域的有（　）。","o":["整合管理","范围管理","进度管理","干系人管理","行政管理"],"a":[0,1,2,3],"e":"十大知识域：整合、范围、进度、成本、质量、资源、沟通、风险、采购、干系人管理。“行政管理”是组织日常职能，不是知识域。【记忆钩子】“整范进成质，资沟风采干”（整合/范围/进度/成本/质量/资源/沟通/风险/采购/干系人）。E 为杜撰项。","k":"十大知识域"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"multi","q":"关于项目章程与项目管理计划，下列说法正确的有（　）。","o":["项目章程由项目发起人或发起组织签发","项目管理计划由项目经理牵头、团队与干系人参与编制","项目章程授权项目经理使用组织资源","范围基准、进度基准、成本基准属于项目管理计划的组成部分","项目管理计划一经批准即永远不可更改"],"a":[0,1,2,3],"e":"章程＝发起人签发的授权文件；项目管理计划＝项目经理主导编制、整合各子计划与三大基准（范围/进度/成本基准）。【易错点】基准不是“不能改”，而是“不能随便改”，必须经实施整体变更控制审批后更新。E 错在“永远不可更改”。","k":"项目章程与项目管理计划"},{"s":"ruankao","p":"项目管理一般知识","c":6,"cn":"项目管理过程组与知识域","t":"multi","q":"下列属于事业环境因素（EEF）的有（　）。","o":["组织文化、结构与治理","政府或行业标准","市场条件","组织现有设施与资源的地理分布","组织积累的标准流程模板与历史项目数据库"],"a":[0,1,2,3],"e":"EEF 是项目团队不能随意更改、只能适应的内外部既定条件（文化治理、设施、市场、法规标准、人事制度等）；OPA 是组织可复用可更新的资产（模板、流程、历史库、经验教训库）。【记忆钩子】“环境因素被动适应，过程资产主动复用”。E 属于 OPA，不是 EEF。","k":"事业环境因素"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"single","q":"项目立项阶段，用于论证“项目是否值得做、技术上能否实现、经济上是否合算”的文件通常统称为（　）。","o":["可行性研究报告","项目章程","WBS 词典","风险登记册"],"a":[0],"e":"可行性研究从技术、经济、运行（操作）、法律与社会等维度论证项目是否可行，是立项审批与投资决策的依据。【记忆钩子】“立项先问三句话：能不能做、划不划算、合不合规”。B 是授权文件，C 是范围分解产物，D 是风险管理文件。","k":"可行性研究"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"single","q":"可行性研究中，经济可行性主要关注的是（　）。","o":["投入产出、成本效益、投资回收期与净现值等财务合理性","现有技术能力能否支撑系统实现","系统与现有管理制度、人员习惯是否适配","是否符合法律法规与合同要求"],"a":[0],"e":"技术可行性＝技术能力与资源能否实现；经济可行性＝成本效益、投资回报、回收期、净现值；运行（操作）可行性＝组织流程与人员适配；法律可行性＝合规。【易错点】“适配现有制度与人员”属运行可行性，不是经济可行性。B、C、D 各对应其他维度。","k":"可行性研究维度"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"single","q":"关于项目建议书（立项申请）与可行性研究报告的关系，下列说法正确的是（　）。","o":["项目建议书是初步设想与立项申请，获批后再开展详细可行性研究","两者内容完全相同，只是名称不同","必须先完成可行性研究才能提交项目建议书","项目建议书由项目经理自行签发即可生效"],"a":[0],"e":"一般流程：项目建议书（初步论证、提出立项申请）→批复后开展可行性研究→可研报告审批→正式立项。建议书是“轮廓”，可研是“深度论证”。【易错点】顺序不能颠倒，二者粗细程度不同；项目建议书需按组织/投资管理程序报批，非项目经理自签。B、C、D 均违背该流程。","k":"立项流程"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"single","q":"公开招标流程的合理顺序是（　）。","o":["发布招标公告→资格预审→发售招标文件→投标→开标→评标→定标→发中标通知书→签订合同","先确定中标人再发布招标公告","开标与评标由各投标人共同自行组织","中标通知书发出之前就应完成合同签订"],"a":[0],"e":"流程：招标准备→发布公告/投标邀请→资格预审→发售招标文件→（踏勘、答疑）→接收投标文件→开标→评标→定标→发中标通知书→在规定期限内签合同。【易错点】“先签合同后发中标通知”次序颠倒；开标、评标由招标人/评标委员会组织，而非投标人。B、C、D 均错。","k":"招标流程"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"single","q":"评标委员会完成评审后，应向招标人提交（　），并推荐合格的中标候选人。","o":["书面评标报告","项目章程","竣工结算书","需求规格说明书"],"a":[0],"e":"评标委员会独立评审并向招标人提交书面评标报告、推荐中标候选人，由招标人（或经授权的评标委员会）确定中标人。【易错点】评标委员会只“评与荐”，定标权原则上在招标人。B、C、D 分别属于启动、收尾结算、需求定义阶段文档。","k":"评标与定标"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"single","q":"关于合同类型与风险归属，下列对应正确的是（　）。","o":["固定总价合同：范围明确、卖方承担成本风险，买方风险较小","成本补偿合同：范围明确、总价包干，卖方承担全部成本风险","工时与材料合同适用于范围极其明确的大型总包项目","固定总价合同下买方按卖方实际成本据实支付并另付管理费"],"a":[0],"e":"固定总价（FFP）：范围清晰，卖方担成本风险，买方风险小；成本补偿（CPFF/CPIF 等）：范围不确定，买方按实际成本加费用支付、买方担成本风险；工时与材料（T&M）：按工时费率加材料实报，多用于小而紧急、范围难定的补充工作。【记忆钩子】“范围越清越偏总价，范围越糊越偏成本补偿”。B、C、D 把风险归属或适用场景说反。","k":"合同类型"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"single","q":"采购管理中，自制或外购分析（make-or-buy analysis）主要用于决定（　）。","o":["某项工作由项目团队自行完成，还是从外部供应商采购","项目应采用预测型还是适应型生命周期","项目奖金在团队成员之间如何分配","是否需要由发起人签发项目章程"],"a":[0],"e":"自制或外购分析是规划采购管理的工具：比较内部自制成本（含直接、间接、能力、风险、知识产权）与外部采购成本后作出决策。【易错点】它是采购规划工具，不是生命周期选择、激励分配或立项授权工具。B、C、D 均错位。","k":"自制或外购分析"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"multi","q":"下列属于可行性研究常见论证维度的有（　）。","o":["技术可行性","经济可行性","运行（操作）可行性","法律与社会可行性","代码行可行性"],"a":[0,1,2,3],"e":"可研维度通常包括技术、经济、运行（操作/管理）、法律（合规）、社会与环境影响以及进度等。“代码行可行性”不是规范维度。【记忆钩子】“技经运法社”五维。E 为杜撰项。","k":"可行性研究维度"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"multi","q":"关于招投标的基本规范，下列说法正确的有（　）。","o":["投标人不得以低于成本的报价竞标，也不得以他人名义投标","开标应在招标文件确定的提交投标文件截止时间的同一时间公开进行","评标委员会成员名单在中标结果确定前应当保密","招标人对已发出的招标文件可作必要澄清或修改，但须按规定通知所有招标文件收受人","招标人与中标人可私下另签背离合同实质性内容的协议"],"a":[0,1,2,3],"e":"A、B、C、D 体现公开、公平、公正与诚实信用原则（禁止低于成本竞标与挂靠、开标同时公开、名单保密、澄清须通知全部收受人）。【易错点】招标人与中标人不得再订立背离合同实质性内容的其他协议，“阴阳合同”被禁止，E 错。","k":"招投标规范"},{"s":"ruankao","p":"立项与招投标管理","c":7,"cn":"立项、可行性研究与招标采购","t":"multi","q":"关于合同类型与风险，下列说法正确的有（　）。","o":["固定总价合同下卖方承担较大的成本风险","成本补偿合同下买方承担较大的成本风险","工时与材料合同常约定费用上限（not-to-exceed）以控制买方风险","范围不确定、需探索性研发时更适合成本补偿类合同","固定总价合同最适合需求频繁变动的探索型项目"],"a":[0,1,2,3],"e":"总价＝卖方担成本风险、要求范围清晰；成本补偿＝买方按实报销担风险，适合范围不定/研发；T&M 常加费用上限防成本敞口。【易错点】需求频繁变动却用固定总价，会把卖方逼向索赔或偷工减料，恰恰最不合适，E 说反。","k":"合同类型与风险"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"single","q":"实施整体变更控制过程的主要输出之一是（　）。","o":["批准的变更请求，以及更新后的项目管理计划与项目文件","项目章程","工作绩效数据","最终产品、服务或成果的移交"],"a":[0],"e":"实施整体变更控制：受理变更请求→影响评估→CCB 审批→输出“批准的变更请求”，并更新项目管理计划/基准与项目文件，再交由执行与监控落实。【记忆钩子】“变更流程的出口是批准的变更请求”。B 是启动输出，C 是执行输出，D 是收尾输出。","k":"整体变更控制"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"single","q":"关于配置管理与变更管理的关系，下列说法正确的是（　）。","o":["配置管理关注产品/成果的规格与版本一致性，变更管理关注变更请求的审批流程，二者相互配合","配置管理就是审批变更申请，与变更管理完全等同","变更管理只负责文档版本号，与审批无关","二者毫无关系，不能在同一项目中并存"],"a":[0],"e":"配置管理（配置项识别、版本与基线、状态记录、配置核实与审计）保证“产品规格与版本对得上”；变更管理（申请、评估、CCB 审批、实施、验证）管“改不改、怎么批”。【易错点】别把“基线/版本”与“审批流程”混为一谈，二者是配合关系而非等同或互斥。","k":"配置管理与变更管理"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"single","q":"范围基准由下列哪一组文件构成？（　）。","o":["项目范围说明书＋WBS＋WBS 词典","项目章程＋商业论证＋协议","进度基准＋成本基准＋质量测量指标","需求文件＋需求跟踪矩阵＋风险登记册"],"a":[0],"e":"范围基准＝经批准的项目范围说明书＋WBS＋WBS 词典，是确认范围、控制范围及变更比较的依据。【记忆钩子】“范围基准三件套：说明书、WBS、词典”。B 是立项文件，C 是其他基准，D 是需求与风险文件。","k":"范围基准"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"single","q":"确认范围（Validate Scope）过程的主要关注点是（　）。","o":["由客户或发起人正式验收已完成的项目可交付成果","检查单个可交付成果是否符合质量要求与正确性","把可交付成果逐层拆解为工作包","估算各活动所需的持续时间"],"a":[0],"e":"确认范围＝客户/发起人验收可交付成果，关注“可接受性”，输出“验收的可交付成果”；控制质量＝检查成果是否“正确、符合质量要求”，输出“核实的可交付成果”。【易错点】通常控制质量在先、确认范围在后（先内部质检合格再提交客户验收），B 描述的是控制质量。","k":"确认范围与控制质量"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"single","q":"关于 WBS 的 100% 规则，下列理解正确的是（　）。","o":["WBS 必须包含且仅包含项目范围内全部工作，子层之和恰好等于父层，不多不少","WBS 允许遗漏少量不重要工作以便简化","WBS 应把项目范围之外的工作也纳入以显得全面","WBS 每一层的节点数都必须恰好为 10 个"],"a":[0],"e":"100% 规则：WBS 覆盖项目全部工作（含项目管理工作），且仅包含范围内工作；下层分解之和＝上层，既不遗漏也不镀金。【记忆钩子】“既不漏、也不多、刚好 100%”。B、C、D 分别违反不遗漏、不越界、以及层数/节点数并无强制规定。","k":"WBS 100%规则"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"single","q":"滚动式规划（rolling wave planning）指的是（　）。","o":["对近期工作详细规划、对远期工作先在较高层级粗略规划，随信息明确再逐步细化","一次性把全部工作细化到最底层后才允许开工","项目结束后再补做全部计划","只规划关键路径上的活动，其余工作不做计划"],"a":[0],"e":"滚动式规划体现“渐进明细”：近细远粗、随进展迭代细化，适合信息尚不完备的远期工作。【易错点】它不是“不做计划”或“事后补计划”，而是分层次、分时段地迭代细化。B、C、D 均偏离该含义。","k":"滚动式规划"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"multi","q":"关于项目范围说明书，通常包含的内容有（　）。","o":["产品范围描述（交付成果的特征与功能）","可交付成果及其验收标准","项目的除外责任（明确什么不属于本项目）","项目的制约因素与假设条件","每个团队成员的每日考勤记录"],"a":[0,1,2,3],"e":"项目范围说明书内容：产品范围描述、可交付成果、验收标准、除外责任（边界）、制约因素、假设条件。“除外责任”尤其用于防止范围蔓延。【记忆钩子】“说明书写清楚：做什么、交什么、怎么验、不做什么、受什么限”。E 是行政记录，不属于范围文件。","k":"项目范围说明书"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"multi","q":"关于需求跟踪矩阵（RTM），下列说法正确的有（　）。","o":["把每条需求关联到其来源以及对应的可交付成果、设计与测试用例，实现双向追踪","有助于确保需求都被实现且都被验证，防止遗漏或镀金","可在需求变更时评估受影响的范围与工作","是收集需求与定义范围阶段常用的工具/文件","它等同于 WBS，用来把工作拆成工作包"],"a":[0,1,2,3],"e":"需求跟踪矩阵建立“需求↔来源↔设计↔开发↔测试”的映射，保证需求不丢、不多、可验证、变更可追溯。【易错点】RTM 追踪的是“需求”，WBS 分解的是“工作”，二者维度不同，E 混淆了二者。","k":"需求跟踪矩阵"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"multi","q":"关于实施整体变更控制与 CCB，下列说法正确的有（　）。","o":["任何对已批准基准的变更都应通过实施整体变更控制过程","CCB（变更控制委员会）负责审批或否决变更请求","变更请求获批后通常需更新项目管理计划或基准并通知相关干系人","批准的变更请求由指导与管理项目工作过程加以实施","紧急情况下可先改基准并上线，事后完全不必补任何记录与审批"],"a":[0,1,2,3],"e":"变更闭环：申请→影响评估→CCB 审批→更新计划/基准→执行（指导与管理项目工作）→验证→通知干系人→归档。【易错点】即便紧急变更也应补记、补审、纳入配置与记录，“未批先改、事后不补”是配置失控与审计问题的典型来源，E 错。","k":"整体变更控制"},{"s":"ruankao","p":"项目整体与范围管理","c":8,"cn":"整体变更控制、范围基准与WBS","t":"multi","q":"下列做法有助于防止范围蔓延的有（　）。","o":["以书面、可验收的方式明确并记录范围边界与除外责任","所有范围变更走整体变更控制并经审批后才实施","对客户新增诉求先评估其对进度、成本、质量的影响再决策","建立并维护范围基准，定期用工作绩效数据与实际结果对比","对客户口头提出的额外功能一律先做再补手续，以提升满意度"],"a":[0,1,2,3],"e":"范围蔓延＝未经控制的范围扩大。防线：清晰的书面范围与除外责任、范围基准、变更流程、影响评估、绩效对比。【易错点】“先做再补手续”看似服务态度好，实则把未批准工作变成既成事实，是范围蔓延的典型诱因，E 错。","k":"范围蔓延"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"某项目网络计划中各路径起点相同且相互独立：路径 A→B→C 历时 3+5+4=12 天，路径 A→D→E 历时 3+6+2=11 天，路径 F→G 历时 7+4=11 天。该项目的计算工期与关键路径是（　）。","o":["12 天，A→B→C 为关键路径","11 天，A→D→E 与 F→G 两条路径并列为关键路径","34 天，把三条路径的工期相加即为总工期","7 天，取全部活动中最长单个活动的历时"],"a":[0],"e":"推导：计算工期取各路径历时的最大值＝max(12, 11, 11)＝12 天；历时最长的路径 A→B→C 即关键路径，其上活动总时差为 0，另两条路径各有 12−11＝1 天时差。【易错点】“最长”指路径总历时最长，不是活动最多、也不是单个最长活动（后者为 7 天）；总工期既不取平均、也不把各路径相加（12+11+11=34 是 D 的错法）。等长最长路径才可能并列，本题仅一条 12 天路径。","k":"关键路径计算"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"某活动最早开始时间 ES=4、最早完成时间 EF=10、最迟完成时间 LF=14（时间单位：天）。该活动的最迟开始时间 LS 与总时差 TF 分别为（　）。","o":["LS=8，TF=4","LS=8，TF=2","LS=6，TF=4","LS=10，TF=6"],"a":[0],"e":"推导：活动工期 d＝EF−ES＝10−4＝6；LS＝LF−d＝14−6＝8；总时差 TF＝LS−ES＝8−4＝4（亦等于 LF−EF＝14−10＝4）。【记忆钩子】“时差＝最迟−最早”，用开始或完成时间相减结果相同。B、C、D 的 LS 或 TF 计算错误。","k":"网络计划时间参数"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"赶工（crashing）压缩工期的主要特点与代价是（　）。","o":["通过增加资源或加班缩短关键路径活动工期，通常会增加项目成本","把原本顺序进行的活动改为并行，主要增加返工风险而几乎不增加成本","直接削减项目范围、删除部分可交付成果","延长非关键路径活动的时差以缩短总工期"],"a":[0],"e":"赶工＝对关键路径活动加资源/加班（成本换时间），代价是成本上升且可能边际效益递减；快速跟进（并行/重叠）＝风险与返工换时间，成本增加不明显但风险高。【记忆钩子】“赶工花钱、快跟担险”。B 描述的是快速跟进；C 属于缩减范围（改变基准）；D 不可能缩短总工期。","k":"进度压缩：赶工与快速跟进"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"快速跟进（fast tracking）相较于赶工，最突出的风险是（　）。","o":["把本应顺序进行的活动并行或重叠，可能因前序信息不全导致返工与协调、质量风险","必然大幅增加人工与设备采购成本","会使关键路径自动消失","只能用于非关键路径上的活动"],"a":[0],"e":"快速跟进把串行活动改为并行/重叠，不明显增加成本，但因前序尚未完成就开工，易因变更与信息不全造成返工、协调与质量风险。【易错点】它和赶工一样通常作用于关键路径活动（C、D 错），但代价类型不同：成本上升是赶工，返工风险上升是快跟。","k":"进度压缩"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"某项目计划价值 PV=100 万元、挣值 EV=80 万元、实际成本 AC=90 万元。关于其绩效判断正确的是（　）。","o":["进度落后且成本超支（SV=−20，CV=−10）","进度提前且成本节约（SV=+20，CV=+10）","进度落后但成本节约（SV=−20，CV=+10）","进度提前但成本超支（SV=+20，CV=−10）"],"a":[0],"e":"推导：CV＝EV−AC＝80−90＝−10（负＝超支），SV＝EV−PV＝80−100＝−20（负＝落后）；CPI＝EV/AC≈0.89<1、SPI＝EV/PV＝0.80<1 同向印证。【记忆钩子】“差值看正负、指数看是否大于 1；EV 打头，减 AC 看钱、减 PV 看进度”。B、C、D 的判断均与计算结果相反。","k":"挣值管理：偏差与指数"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"某项目完工预算 BAC=200 万元，当前 EV=80 万元、AC=90 万元。假设剩余工作按当前成本绩效指数（CPI）继续发生，则完工估算 EAC 约为（　）。","o":["225 万元","210 万元","200 万元","180 万元"],"a":[0],"e":"推导：CPI＝EV/AC＝80/90≈0.889；按当前 CPI 持续（典型偏差）EAC＝BAC/CPI＝200÷(80/90)＝200×90/80＝225 万元，ETC＝EAC−AC＝135 万元。若按“非典型假设（余下按预算执行）”则 EAC＝AC＋(BAC−EV)＝90＋120＝210 万元，即选项 B，但那是另一种假设，不符题干“按 CPI 继续”。【记忆钩子】“典型除 CPI、非典型加剩余预算”。C、D 为凑数。","k":"挣值管理：完工估算 EAC"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"成本管理“制定预算”过程的主要输出是（　）。","o":["成本基准以及项目资金需求","活动成本估算与估算依据","工作分解结构（WBS）","风险登记册"],"a":[0],"e":"估算成本→输出活动成本估算与估算依据；制定预算→把估算汇总并分摊到各时间段，形成经审批的“成本基准”（含应急储备、不含管理储备）及资金需求。【易错点】成本基准是按时间分段、用于挣值比较的批准版预算，不是单条活动的成本估算。B 是估算成本输出，C 是范围文件，D 是风险文件。","k":"成本基准与制定预算"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"single","q":"关于应急储备与管理储备，下列说法正确的是（　）。","o":["应急储备应对已识别（已知—未知）风险、包含在成本基准内；管理储备应对未识别（未知—未知）风险、在基准之外","两者都包含在成本基准内，且均由项目经理直接动用","应急储备应对未知—未知风险，且动用须经高层审批","管理储备用于应对已识别风险且计入成本基准"],"a":[0],"e":"应急储备（contingency reserve）为已识别风险准备，属于成本基准、项目经理可动用；管理储备（management reserve）为未识别风险准备，不在基准内、不计入挣值计算，动用常需更高层审批并相应变更基准。【记忆钩子】“已知的进基准（应急），未知的留基准外（管理）”。B、C、D 把归属或适用范围说反。","k":"应急储备与管理储备"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"multi","q":"关于挣值管理（EVM）的基本参数与指标，下列说法正确的有（　）。","o":["PV 是计划工作的预算价值，EV 是已完成工作的预算价值，AC 是实际花费成本","CV=EV−AC，CV<0 表示成本超支","SV=EV−PV，SV<0 表示进度落后","CPI=EV/AC、SPI=EV/PV，二者大于 1 分别表示成本节约、进度提前","EAC 恒等于 BAC，与项目实际绩效完全无关"],"a":[0,1,2,3],"e":"PV（计划）、EV（实得预算）、AC（实花）；CV＝EV−AC、SV＝EV−PV（正数为好），CPI＝EV/AC、SPI＝EV/PV（大于 1 为好）。【易错点】EAC（完工估算）会随实际绩效或重新估算而变化，只有“完全按预算且无偏差”这一特例才等于 BAC，E 把特例当通例。","k":"挣值管理基础"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"multi","q":"下列属于制定进度计划常用工具/技术或输出结果的有（　）。","o":["关键路径法","关键链法（考虑资源约束与缓冲）","资源优化（资源平衡/资源平滑）","进度压缩（赶工/快速跟进）与进度基准","帕累托图（排列图）"],"a":[0,1,2,3],"e":"制定进度计划常用：关键路径法、关键链法、资源优化（平衡/平滑）、进度压缩、假设情景分析、提前量与滞后量、进度网络分析等，输出含“进度基准”。帕累托图是质量管理七工具之一，用于找主要缺陷来源。【易错点】别把质量工具混进进度工具，E 乱入。","k":"制定进度计划工具"},{"s":"ruankao","p":"进度与成本管理","c":9,"cn":"进度网络图、关键路径与挣值管理","t":"multi","q":"关于里程碑与活动，下列说法正确的有（　）。","o":["里程碑是项目中的重要事件或时点，持续时间为零","活动清单中的工作需要消耗时间与资源","里程碑清单是定义活动过程的输出之一","进度网络图中活动之间可存在 FS、SS、FF、SF 等逻辑关系","里程碑与普通活动一样必须估算并占用工期"],"a":[0,1,2,3],"e":"里程碑＝零历时、标记关键时点（如阶段完成、合同签署）；活动＝需历时与资源的工作。紧前关系绘图法（PDM）支持 FS（完成—开始，最常用）、SS、FF、SF 四种依赖。【易错点】里程碑“零工期”、不占持续时间（E 错）；定义活动会输出活动清单、活动属性与里程碑清单。","k":"里程碑与活动依赖关系"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"single","q":"质量保证（管理质量）与控制质量的主要区别在于（　）。","o":["质量保证关注过程是否按规范执行、能否预防缺陷；控制质量关注可交付成果是否合格、能否查出缺陷","质量保证只检查最终产品，控制质量只编写文档","两者完全相同，只是叫法不同","控制质量在规划阶段做，质量保证在收尾阶段做"],"a":[0],"e":"管理质量（质量保证）＝面向过程，审计过程与标准、预防缺陷、持续改进；控制质量＝面向结果，检查具体可交付成果、识别缺陷并输出“核实的可交付成果”。【记忆钩子】“保证管过程防缺陷，控制查结果挑毛病”。B、C、D 均错。","k":"质量保证与控制质量"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"single","q":"质量成本（COQ）中，用于预防缺陷和鉴定/评估是否符合要求的投入属于（　）。","o":["一致性成本（预防成本＋评价/鉴定成本）","非一致性成本（内部失败＋外部失败成本）","仅指返工与保修费用","仅指管理储备"],"a":[0],"e":"质量成本＝一致性成本（预防：培训、文档、设备、正确做事；评价/鉴定：测试、检验、审计）＋非一致性成本（内部失败：返工、报废；外部失败：退货、保修、索赔、声誉损失）。【记忆钩子】“预防+鉴定＝一致（花钱防），返工+索赔＝不一致（出事赔）”。B、C、D 错位。","k":"质量成本"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"single","q":"质量管理七种基本工具中，用于按发生频率排序、识别造成大多数问题的少数关键原因（抓主要矛盾）的是（　）。","o":["帕累托图（排列图）","因果图（鱼骨图/石川图）","控制图","散点图"],"a":[0],"e":"帕累托图按频次降序排列并叠加累计百分比，基于“关键少数”思想找主要问题来源；因果图用于追溯根因（人机料法环）；控制图看过程是否受控；散点图看两变量相关性。【记忆钩子】“帕累托抓重点、鱼骨找原因、控制图看稳定、散点看相关”。B、C、D 各有分工。","k":"质量管理七工具"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"single","q":"关于控制图，下列说法正确的是（　）。","o":["用于判断过程是否处于受控状态，点超出控制界限或出现连续多点同侧等非随机排列即为异常信号","用于把缺陷按原因分类并排序","用于显示两个变量之间是否存在相关关系","用于估算活动的最可能工期"],"a":[0],"e":"控制图以中心线加上/下控制界限（UCL/LCL）监控过程稳定性；点出界或出现非随机排列（如连续若干点落在均值同侧）提示存在可归属原因，需调查。【易错点】控制界限（过程能力）≠规格界限（客户要求）；B 是帕累托图、C 是散点图、D 是类比/PERT 估算。","k":"控制图"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"single","q":"在风险管理过程中，识别风险之后紧接着对风险进行优先级排序的过程是（　）。","o":["实施定性风险分析：用概率与影响矩阵对风险发生可能性与后果评级并排出优先级","实施定量风险分析：对已排定优先级的风险做数值化建模，并非所有项目都必做","规划风险应对：针对风险制定规避、转移、减轻等策略","监督风险：跟踪已识别风险、识别新风险并评估应对效果"],"a":[0],"e":"顺序：规划风险管理→识别风险→实施定性风险分析（概率×影响、主观分级、排优先级）→实施定量风险分析（可选，蒙特卡洛/决策树/敏感性分析）→规划风险应对→实施风险应对→监督风险。【易错点】“定性排序先做、定量建模后做且可选”，别把二者先后颠倒。","k":"风险管理过程顺序"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"single","q":"对威胁（负面风险）的应对策略中，把风险后果及应对责任转给第三方（如购买保险、外包、要求担保）属于（　）。","o":["转移（Transfer）","规避（Avoid）","减轻（Mitigate）","接受（Accept）"],"a":[0],"e":"威胁四策：规避（改变计划消除威胁）、转移（保险/外包/担保，把影响与责任转给第三方，通常需付费）、减轻（降低概率或影响）、接受（主动建应急储备或被动不采取措施）；机会四策：开拓、分享、提高、接受。【记忆钩子】“威胁：避、转、减、受；机会：开、分、提、受”。B、C、D 是其他策略。","k":"风险应对策略"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"single","q":"关于风险登记册（风险登记簿），下列说法错误的是（　）。","o":["它只在项目收尾时一次性编制，过程中无需更新","识别风险过程形成其初始内容（已识别风险清单、潜在应对措施、潜在责任人等）","定性/定量风险分析会补充风险优先级、概率影响评级与数值分析结果","规划风险应对会补充具体应对策略、行动方案与责任人"],"a":[0],"e":"风险登记册是动态文件：识别风险时创建，随后在定性/定量分析、规划应对、实施应对、监督风险中不断补充与更新（优先级、评级、策略、责任人、状态、残余风险与次生风险）。【易错点】“一次编完不更新”是典型错误认知；B、C、D 描述正确，故错误的是 A。","k":"风险登记册"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"multi","q":"下列属于质量管理七种基本工具（老七种）的有（　）。","o":["因果图（鱼骨图）","流程图","核查表（检查表/计数表）","直方图","蒙特卡洛模拟"],"a":[0,1,2,3],"e":"老七种：因果图、流程图、核查表、帕累托图、直方图、控制图、散点图。蒙特卡洛模拟是风险定量分析（进度/成本建模）技术，不属于质量七工具。【记忆钩子】“鱼（因果）流（流程）查（核查表）帕（帕累托），直（直方图）控（控制）散（散点）”。E 乱入。","k":"质量管理七工具"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"multi","q":"关于风险识别与应对，下列说法正确的有（　）。","o":["风险既包括威胁（负面影响），也包括机会（正面影响）","风险登记册应随项目进展持续更新，并可记录残余风险与次生风险","决策树、蒙特卡洛模拟、敏感性分析属于实施定量风险分析的常用技术","对已接受的风险可建立应急储备，并约定触发条件与应对方案","只要买了保险，风险就完全消失，项目期间无需再跟踪"],"a":[0,1,2,3],"e":"风险＝不确定事件，可对目标产生负面（威胁）或正面（机会）影响；定量分析常用决策树（预期货币价值）、蒙特卡洛、敏感性分析（龙卷风图）、影响图；接受策略可配应急储备与触发条件/弹回计划。【易错点】转移（保险/外包）只是把财务后果转走，风险仍需跟踪且可能引入新风险（如供应商风险），E 错。","k":"风险识别与应对"},{"s":"ruankao","p":"质量与风险管理","c":10,"cn":"质量管理工具与风险识别应对","t":"multi","q":"关于规划风险应对中的机会与威胁策略，下列对应正确的有（　）。","o":["威胁—规避：改变计划以消除威胁或保护目标免受影响","威胁—转移：通过保险、外包或担保把影响与应对责任转交第三方","机会—开拓：确保机会一定发生，如调集最优资源以抢占收益","机会—分享：与外部伙伴合作（如组成联合体）共同把握机会","机会—减轻：通过降低发生概率把机会改造成威胁"],"a":[0,1,2,3],"e":"威胁策略：规避、转移、减轻、接受；机会策略：开拓（确保发生）、分享（合作共赢）、提高（增大概率/影响）、接受。【记忆钩子】“威胁避转减受、机会开分提受”，两套词不能串用；“减轻”只用于威胁且是降低负面概率/影响，不存在“把机会变威胁”，E 杜撰。","k":"机会与威胁应对策略"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"single","q":"关于对称加密与非对称加密，下列说法正确的是（　）。","o":["对称加密加解密用同一密钥、速度快适合大数据量；非对称加密用公钥/私钥对、速度慢，常用于密钥交换与数字签名","非对称加密加解密使用完全相同的单一密钥","对称加密天然解决了密钥分发难题，无需安全通道","数字签名是用对称加密算法对整篇明文加密生成的"],"a":[0],"e":"对称加密（如 AES、DES）：收发同钥、速度快，但密钥分发困难；非对称加密（如 RSA）：公钥/私钥成对，速度慢，常用于加密对称密钥（数字信封）、密钥交换、签名与认证。【记忆钩子】“对称一把钥匙速度快，非对称两把钥匙管分发与签名”。B、C、D 均说反。","k":"对称与非对称加密"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"single","q":"数字签名的主要作用不包括（　）。","o":["保证数据在传输过程中不被窃听（即提供保密性）","验证消息发送者的身份（认证）","验证消息自签名后未被篡改（完整性）","使发送方难以否认已发送该消息（不可抵赖性）"],"a":[0],"e":"数字签名＝发送方用私钥对消息摘要加密、接收方用其公钥验签，提供认证、完整性与不可抵赖；但消息本身仍可能是明文，签名“不提供保密性”，保密需另用加密（如数字信封）。【易错点】签名≠加密，“防篡改/防抵赖”≠“防窃听”。B、C、D 都是签名的作用，故不包括的是 A。","k":"数字签名"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"single","q":"防火墙的主要功能是（　）。","o":["按安全策略对网络进出流量进行访问控制与过滤，隔离可信与不可信网络","对磁盘上的数据库文件做加密存储","自动修复已被删除的系统文件","对已感染主机内的病毒进行查杀（终端反病毒）"],"a":[0],"e":"防火墙部署于网络边界，依据规则（地址、端口、协议、连接状态）控制进出访问、隔离内外网。【易错点】防火墙“管进出”，不管内容加密/主机杀毒/数据备份；它一般也不能替代防病毒软件或防止所有内部攻击与绕过的应用层攻击。B、C、D 各有归属。","k":"防火墙"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"single","q":"关于数据备份策略，下列说法正确的是（　）。","o":["全量备份恢复最快但耗时耗空间，增量备份只备份上次备份以来的变化、备份快但恢复需按顺序合并","差异备份只备份自上次全量备份以来的变化，且恢复一定比全量备份更慢","增量备份每次都完整复制全部数据","只要做了备份就无需制定恢复演练与异地存放策略"],"a":[0],"e":"全量＝全部数据，恢复最快（一次还原）、备份慢且占空间；增量＝自“上次备份（全量或增量）”以来的变化，备份快省空间、恢复需沿链依次合并最慢；差异＝自“上次全量”以来的变化，恢复只需全量加最近一次差异。【记忆钩子】“全量好恢复、增量好备份、差异折中”。B 把差异恢复说反，C 把增量定义写错，D 忽视恢复演练与异地容灾。","k":"数据备份策略"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"single","q":"信息化基础概念中，CRM 主要指的是（　）。","o":["客户关系管理，围绕客户信息、营销、销售与客户服务进行管理与分析","企业资源计划，对企业人财物与产供销进行集成管理","供应链管理，协调供应商、制造商与分销商之间的物流与信息流","制造执行系统，负责车间现场的生产调度与执行"],"a":[0],"e":"CRM（Customer Relationship Management）＝客户信息、营销自动化、销售、客户服务与关怀、客户分析；ERP＝企业资源计划（财务/人力/生产/采购/销售集成）；SCM＝供应链管理；MES＝制造执行（车间层）。【记忆钩子】“ERP 管内部资源、CRM 管客户、SCM 管上下游、MES 管车间”。B、C、D 各对应别的概念。","k":"信息化基础：ERP/CRM"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"single","q":"关于项目收尾，下列说法正确的是（　）。","o":["包括合同收尾与行政（管理）收尾，需移交成果、结算合同、释放资源、归档记录并总结经验教训","只要可交付成果通过验收，就无需任何文档归档与经验总结","收尾阶段才开始识别项目干系人","项目收尾等同于控制质量对成果的检查"],"a":[0],"e":"收尾过程组：结束项目或阶段，含合同收尾（结算、合同归档、索赔处理）与行政收尾（验收移交、更新并归档项目文件、释放资源、经验教训总结、团队解散）。【记忆钩子】“验收移交、合同结算、文档归档、经验入库、资源释放”。识别干系人属启动；控制质量属监控；B 漏项。C、D 均错。","k":"项目收尾"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"multi","q":"关于信息安全技术与防护措施，下列说法正确的有（　）。","o":["身份认证常用所知（口令）、所有（令牌/卡）、所是（生物特征）三类因素，多因素认证更安全","入侵检测系统（IDS）侧重发现并记录可疑行为并报警，通常不直接阻断流量","数据加密可保护存储与传输中的保密性，哈希/消息摘要可用于验证完整性","异地容灾与定期恢复演练是保障业务连续性的重要措施","只要部署了防火墙，系统就无需打补丁、无需访问控制，可一劳永逸"],"a":[0,1,2,3],"e":"认证三因素加多因素认证（MFA）；IDS 检测报警、IPS 可主动阻断；加密保保密、哈希/摘要保完整、签名保不可抵赖；备份＋异地容灾＋演练保可用与业务连续。【易错点】安全是“纵深防御＋持续运维”，防火墙只是边界一环，补丁、最小权限、审计缺一不可，E 错。","k":"信息安全防护"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"multi","q":"关于软件测试，下列说法正确的有（　）。","o":["单元测试针对最小可测单元，常由开发人员采用白盒方法实施","集成测试重点检查模块间接口与组装后的交互","验收测试依据需求规格/合同，通常由用户或客户主导确认","回归测试在缺陷修复或变更后重跑相关用例，防止引入新缺陷","黑盒测试必须逐行阅读被测程序源码才能设计用例"],"a":[0,1,2,3],"e":"测试层次：单元（白盒/开发自测）→集成（接口）→系统（整体功能与非功能）→验收（用户/客户主导、黑盒为主）；回归测试防“改一处坏一片”。【易错点】黑盒依据功能规格与输入输出、不需要看源码，逐行读源码是白盒测试特征，E 把二者对调。","k":"软件测试层次与黑盒白盒"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"multi","q":"关于沟通管理与干系人管理，下列说法正确的有（　）。","o":["沟通模型包含发送方编码、传递介质、接收方解码，可能受噪声干扰，并需确认与反馈","沟通方法可分为交互式（会议/电话）、推式（邮件/报告）、拉式（知识库/门户自取）","干系人参与度评估矩阵可用于比较干系人当前与期望的参与水平","权力—利益方格可据以对干系人分类并制定差异化沟通策略","沟通渠道数量随人数线性增长，10 人团队只有 10 条潜在沟通渠道"],"a":[0,1,2,3],"e":"沟通渠道数＝n(n−1)/2，10 人＝10×9/2＝45 条（是组合级增长，不是线性）；沟通模型含编码/传递/解码/噪声/反馈；推式（发出不保证收到）、拉式（自取）、交互式（双向）；干系人分类常用权力—利益方格，参与度评估矩阵比较不知晓/抵制/中立/支持/领导。【易错点】“渠道数＝n(n−1)/2”是高频计算点，E 既说成线性又算错。","k":"沟通与干系人管理"},{"s":"ruankao","p":"信息化安全与项目收尾","c":11,"cn":"信息安全、信息化基础、配置与收尾","t":"multi","q":"关于配置管理、采购与标准化，下列说法正确的有（　）。","o":["配置项（需求文档、设计文档、代码、测试用例等）经评审后可形成基线，基线变更须受控","配置审核（配置审计）用于核实配置项与基线的一致性、完整性","采购工作说明书（SOW）应清晰描述拟采购工作范围，便于潜在卖方判断能否承接","我国标准按层级分为国家标准、行业标准、地方标准、团体标准与企业标准等","软件著作权自软件公开发表之日起才产生，未发表则不享有任何权利"],"a":[0,1,2,3],"e":"配置项识别→版本/基线管理→配置状态记录→配置核实与审计，基线一经批准变更须走变更控制；采购 SOW 描述范围、规格、期限与验收标准供卖方评估；标准层级为国标/行标/地标/团标/企标（强制性标准必须执行、推荐性标准自愿采用）。【易错点】著作权（含软件著作权）自“创作完成/开发完成”即自动产生，登记或发表不是权利产生要件，E 错。","k":"配置、采购与标准化"}],"shiye":[{"s":"shiye","p":"政治理论","c":1,"cn":"政治理论","t":"single","q":"马克思主义哲学认为，世界的本原是（　）。","o":["物质","意识","绝对精神","感觉"],"a":[0],"e":"唯物主义认为物质第一性、意识第二性，物质决定意识；意识对物质具有能动的反作用。","k":"马克思主义哲学"},{"s":"shiye","p":"政治理论","c":1,"cn":"政治理论","t":"single","q":"“头痛医头、脚痛医脚”割裂了事物之间普遍联系的观点，违背了唯物辩证法的（　）。","o":["联系的观点","发展的观点","矛盾的观点","实践的观点"],"a":[0],"e":"联系具有普遍性、客观性、多样性，要求用联系的观点看问题，反对孤立地看问题。","k":"唯物辩证法"},{"s":"shiye","p":"政治理论","c":1,"cn":"政治理论","t":"single","q":"实践是检验真理的（　）。","o":["唯一标准","重要标准之一","参考标准","辅助手段"],"a":[0],"e":"实践是检验真理的唯一标准，这是由真理的本性（主观与客观相符合）和实践的直接现实性特点决定的。","k":"认识论"},{"s":"shiye","p":"政治理论","c":1,"cn":"政治理论","t":"single","q":"量变与质变的辩证关系是（　）。","o":["量变是质变的必要准备，质变是量变的必然结果","量变与质变毫无关系","质变可以脱离量变发生","量变必然直接引起质变"],"a":[0],"e":"质量互变规律：量变积累到一定程度（度）引起质变；质变又为新的量变开辟道路。方法论：重视量的积累、抓住时机促成质变、坚持适度原则。","k":"唯物辩证法"},{"s":"shiye","p":"政治理论","c":1,"cn":"政治理论","t":"single","q":"矛盾的普遍性与特殊性的关系是（　）。","o":["共性与个性、一般与个别的关系","整体与部分的关系","主要与次要的关系","绝对与相对的对立关系"],"a":[0],"e":"矛盾的普遍性与特殊性即共性与个性、一般与个别的关系，二者相互联结、在一定条件下相互转化。“具体问题具体分析”是矛盾特殊性原理的方法论要求。","k":"矛盾分析法"},{"s":"shiye","p":"法律基础","c":2,"cn":"法律基础","t":"single","q":"我国的最高国家行政机关是（　）。","o":["国务院（中央人民政府）","全国人大常委会","国家监察委员会","最高人民法院"],"a":[0],"e":"国务院即中央人民政府，是最高国家权力机关的执行机关，是最高国家行政机关。","k":"宪法"},{"s":"shiye","p":"法律基础","c":2,"cn":"法律基础","t":"single","q":"行政处罚的种类中不包括（　）。","o":["有期徒刑","警告","罚款","行政拘留"],"a":[0],"e":"行政处罚：警告通报批评、罚款没收违法所得、暂扣或吊销许可证件、降低资质等级、责令关闭限制开展生产经营活动、限制开展生产经营活动、行政拘留等。有期徒刑是刑罚。","k":"行政处罚"},{"s":"shiye","p":"法律基础","c":2,"cn":"法律基础","t":"single","q":"《民法典》规定，向人民法院请求保护民事权利的诉讼时效期间一般为（　）。","o":["3 年","2 年","1 年","5 年"],"a":[0],"e":"普通诉讼时效 3 年，自权利人知道或应当知道权利受损害以及义务人之日起算；超过 20 年的不予保护（特殊情况可延长）。","k":"民法典"},{"s":"shiye","p":"法律基础","c":2,"cn":"法律基础","t":"single","q":"公文《通知》的适用范围是（　）。","o":["发布、传达要求下级机关执行和有关单位周知或者执行的事项，批转、转发公文","向上级机关汇报工作","不相隶属机关之间商洽工作","记载会议主要情况和议定事项"],"a":[0],"e":"15 种法定公文：通知（发布传达事项）、报告（向上汇报）、函（不相隶属机关商洽）、纪要（记载会议事项）等。上行文：报告、请示；下行文：通知、批复、决定等。","k":"公文写作"},{"s":"shiye","p":"法律基础","c":2,"cn":"法律基础","t":"single","q":"根据公文行文规则，上级机关向受双重领导的下级机关行文，（　）。","o":["必要时抄送其另一个上级机关","不得抄送任何机关","必须同时给两个上级各发一份命令","只能用电话通知"],"a":[0],"e":"受双重领导的机关向一个上级机关行文时，应抄送另一个上级机关；上级机关向受双重领导的下级机关行文，必要时抄送其另一个上级机关。","k":"公文行文规则"},{"s":"shiye","p":"管理与经济","c":3,"cn":"管理与经济","t":"single","q":"管理的基本职能包括计划、组织、领导和（　）。","o":["控制","消费","融资","公关"],"a":[0],"e":"管理四大基本职能：计划、组织、领导、控制。控制是将实际绩效与计划目标比较并及时纠偏的过程。","k":"管理学基础"},{"s":"shiye","p":"管理与经济","c":3,"cn":"管理与经济","t":"single","q":"通货膨胀时期，中央银行适宜采取的货币政策是（　）。","o":["提高法定存款准备金率、提高利率","降低存款准备金率、降低利率","扩大财政支出","减税"],"a":[0],"e":"通胀时实行紧缩性货币政策：提高准备金率、提高再贴现率、卖出债券回笼货币。减税与扩大支出属于扩张性财政政策。","k":"宏观经济政策"},{"s":"shiye","p":"管理与经济","c":3,"cn":"管理与经济","t":"single","q":"GDP（国内生产总值）是指（　）。","o":["一个国家（或地区）所有常住单位在一定时期内生产活动的最终成果","一个国家的全部财政收入","一个国家的外汇储备总额","国民全部储蓄总额"],"a":[0],"e":"GDP 按“国土/常住单位”原则核算最终产品与服务价值，有三种核算方法：生产法、收入法、支出法（C+I+G+NX）。","k":"国民经济核算"},{"s":"shiye","p":"管理与经济","c":3,"cn":"管理与经济","t":"single","q":"实行“按劳分配为主体、多种分配方式并存”的直接原因是（　）。","o":["我国生产力发展水平总体不高且发展不平衡","公有制主体地位","社会主义性质","市场经济规律"],"a":[0],"e":"生产资料公有制是按劳分配的前提（社会主义性质），生产力发展水平是物质基础，劳动还是谋生手段是直接原因。","k":"分配制度"},{"s":"shiye","p":"管理与经济","c":3,"cn":"管理与经济","t":"single","q":"供给侧结构性改革的“三去一降一补”指的是（　）。","o":["去产能、去库存、去杠杆、降成本、补短板","去风险、去泡沫、降利率、补短板、扩内需","去库存、促消费、增出口、降税、补教育","去产能、增就业、稳外贸、降税、补基建"],"a":[0],"e":"“三去一降一补”：去产能、去库存、去杠杆、降成本、补短板，是供给侧结构性改革的重点任务。","k":"经济政策"},{"s":"shiye","p":"人文科技","c":4,"cn":"人文科技","t":"single","q":"我国的第一部诗歌总集是（　）。","o":["《诗经》","《楚辞》","《全唐诗》","《乐府诗集》"],"a":[0],"e":"《诗经》收录西周至春秋诗歌 305 篇，分风、雅、颂三部分，手法为赋、比、兴。","k":"人文历史"},{"s":"shiye","p":"人文科技","c":4,"cn":"人文科技","t":"single","q":"被称为“杂交水稻之父”的我国科学家是（　）。","o":["袁隆平","钱学森","邓稼先","屠呦呦"],"a":[0],"e":"袁隆平培育杂交水稻，为粮食安全作出巨大贡献。屠呦呦发现青蒿素获诺贝尔奖；钱学森是航天之父；邓稼先是两弹元勋。","k":"科技人物"},{"s":"shiye","p":"人文科技","c":4,"cn":"人文科技","t":"single","q":"我国的“南水北调”工程是将长江流域水资源调往（　）地区。","o":["华北和西北","华南","东北","西南"],"a":[0],"e":"南水北调分东、中、西三条线路，缓解华北与西北地区水资源短缺问题。","k":"国情地理"},{"s":"shiye","p":"人文科技","c":4,"cn":"人文科技","t":"single","q":"我国陆地面积约（　）平方公里，管辖海域面积约 300 万平方公里。","o":["960 万","860 万","1040 万","1100 万"],"a":[0],"e":"我国陆地面积约 960 万平方公里，居世界第三位；大陆海岸线约 1.8 万千米。","k":"国情地理"},{"s":"shiye","p":"人文科技","c":4,"cn":"人文科技","t":"single","q":"下列人物中，获得我国国家最高科学技术奖和“共和国勋章”的农业科学家是（　）。","o":["袁隆平","钟南山（共和国勋章获得者）","屠呦呦（诺贝尔奖得主）","黄旭华（核潜艇之父）"],"a":[0],"e":"袁隆平获首届国家最高科学技术奖（2000）与“共和国勋章”（2019）。钟南山、屠呦呦、黄旭华也分别获得国家荣誉，但题干限定“农业科学家”。","k":"科技人物"},{"s":"shiye","p":"政治理论","c":1,"cn":"政治理论","t":"multi","q":"下列关于实践与认识关系的说法中，正确的有（　）。","o":["实践是认识的来源","实践是认识发展的动力","实践是检验认识真理性的唯一标准","实践是认识的目的","认识对实践没有反作用"],"a":[0,1,2,3],"e":"实践决定认识（来源、动力、标准、目的）；认识对实践具有反作用，正确的认识指导实践取得成功，错误的认识导致实践失败。","k":"认识论"},{"s":"shiye","p":"法律基础","c":2,"cn":"法律基础","t":"multi","q":"下列关于宪法的说法中，正确的有（　）。","o":["宪法是国家的根本法，具有最高的法律效力","宪法的修改须由全国人大常委会或五分之一以上全国人大代表提议","一切法律、行政法规和地方性法规都不得同宪法相抵触","宪法只规定国家机构，不规定公民基本权利","全国各族人民、一切国家机关都必须以宪法为根本活动准则"],"a":[0,1,2,4],"e":"宪法规定国家根本制度与公民基本权利义务，D 错——公民基本权利与义务是宪法的重要内容。","k":"宪法"},{"s":"shiye","p":"管理与经济","c":3,"cn":"管理与经济","t":"multi","q":"下列关于宏观经济调控的说法中，正确的有（　）。","o":["宏观调控的主要目标是促进经济增长、增加就业、稳定物价、保持国际收支平衡","宏观调控以经济手段和法律手段为主，辅以必要的行政手段","财政政策包括财政收入政策与财政支出政策","央行降息属于扩张性货币政策","提高存款准备金率属于扩张性货币政策"],"a":[0,1,2,3],"e":"提高存款准备金率是紧缩性货币政策（回笼资金）。宏观调控四大目标与以经济、法律手段为主的调控方式是常考点。","k":"宏观调控"},{"s":"shiye","p":"人文科技","c":4,"cn":"人文科技","t":"multi","q":"下列关于我国地理国情的说法中，正确的有（　）。","o":["我国陆地面积约 960 万平方公里","地势西高东低，呈三级阶梯状分布","长江是我国最长的河流","我国最大的淡水湖是鄱阳湖","我国最北端在海南曾母暗沙"],"a":[0,1,2,3],"e":"我国最南端在南海的曾母暗沙（纬度最低点），最北端在漠河以北黑龙江主航道中心线。E 南北颠倒。","k":"地理国情"},{"s":"shiye","p":"公文写作","c":5,"cn":"公文写作","t":"multi","q":"下列公文文种与其适用范围对应正确的有（　）。","o":["请示——向上级机关请求指示、批准","报告——向上级机关汇报工作、反映情况","批复——答复下级机关请示事项","函——不相隶属机关之间商洽工作、询问和答复问题","决定——向上级机关汇报工作"],"a":[0,1,2,3],"e":"决定适用于对重要事项作出决策和 款的，税务机关在（　）内可以追征税款、滞纳金。","o":["3 年（特殊情况下延长至 5 年）","1 年","5 年且不受期限限制","10 年"],"a":[0],"e":"一般追征期 3 年；累计数额 10 万元以上的延长至 5 年；偷税、抗税、骗税的，无限期追征。","k":"追征期"},{"s":"sws","p":"税收征收管理","c":5,"cn":"税收征收管理","t":"single","q":"纳税人采取欺骗、隐瞒手段进行虚假纳税申报或者不申报，逃避缴纳税款数额较大并且占应纳税额 10% 以上的，属于（　）。","o":["逃避缴纳税款行为，可追究刑事责任（补缴税款和滞纳金、接受行政处罚后初犯可不追究刑责）","一般财务差错","民事违约行为","合法节税"],"a":[0],"e":"《刑法》逃税罪：经税务机关依法下达追缴通知后补缴税款、滞纳金，已受行政处罚的，不予追究刑事责任（5 年内因逃税受过刑事处罚或两次以上行政处罚的除外）。","k":"逃税罪"},{"s":"sws","p":"税收征收管理","c":5,"cn":"税收征收管理","t":"single","q":"纳税人对税务机关的征税行为不服的，救济途径的法定顺序是（　）。","o":["必须先申请行政复议，对复议决定不服的才能提起行政诉讼（复议前置）","可以直接向法院起诉","只能向上级税务机关信访","可以先诉讼后复议"],"a":[0],"e":"纳税争议实行“复议前置”：先缴纳税款滞纳金或提供担保，然后申请行政复议，对复议决定不服再诉讼。处罚决定等则可直接诉讼。","k":"税务行政复议"},{"s":"sws","p":"增值税","c":1,"cn":"增值税","t":"multi","q":"下列各项中，属于增值税视同销售行为的有（　）。","o":["将自产货物无偿赠送给福利院","将委托加工的货物用于集体福利","将自产货物用于对外投资","将外购货物用于个人消费","外购货物用于企业建设厂房（集体福利用途）"],"a":[0,1,2],"e":"自产、委托加工的货物用于集体福利、个人消费、投资、分配、赠送均视同销售；外购货物用于集体福利、个人消费作进项转出（不视同销售），用于赠送则视同销售。","k":"视同销售"},{"s":"sws","p":"增值税","c":1,"cn":"增值税","t":"multi","q":"下列各项中，进项税额准予从销项税额中抵扣的有（　）。","o":["取得增值税专用发票注明的进项税额","海关进口增值税专用缴款书注明的增值税额","购进国内旅客运输服务取得的合规票据注明的税额","用于集体福利购进货物的进项税额","简易计税项目购进货物的进项税额"],"a":[0,1,2],"e":"合规扣税凭证（专票、海关缴款书、农产品收购/销售发票、旅客运输凭证等）注明的进项税额可抵扣；用于简易计税、免税、集体福利个人消费的进项不得抵扣。","k":"进项税额"},{"s":"sws","p":"企业所得税","c":2,"cn":"企业所得税","t":"multi","q":"下列各项中，在计算应纳税所得额时不得扣除的有（　）。","o":["税收滞纳金","被没收财物的损失","未经核定的准备金支出","合理的业务招待费在限额内部分","环保专项基金"],"a":[0,1,2],"e":"八项不得扣除：滞纳金、罚金罚款和被没收财物损失、赞助支出、未经核定准备金、与收入无关支出等。限额内业务招待费、符合条件的环保基金可扣。","k":"不得扣除项目"},{"s":"sws","p":"个人所得税","c":3,"cn":"个人所得税","t":"multi","q":"下列所得中，属于个人所得税综合所得的有（　）。","o":["工资薪金所得","劳务报酬所得","稿酬所得","特许权使用费所得","经营所得"],"a":[0,1,2,3],"e":"综合所得四项：工资薪金、劳务报酬、稿酬、特许权使用费，按年合并计税。经营所得单独适用 5%～35% 税率；利息股息红利、财产租赁、财产转让、偶然所得分类计税。","k":"综合所得"},{"s":"sws","p":"税收征收管理","c":5,"cn":"税收征收管理","t":"multi","q":"根据《税收征管法》，纳税人的下列行为中，税务机关可处以罚款等处罚的有（　）。","o":["未按照规定的期限申报办理税务登记变更或注销","伪造、变造、隐匿、擅自销毁账簿凭证","编造虚假计税依据","按时足额申报缴纳税款","不进行纳税申报，不缴或少缴应纳税款"],"a":[0,1,2,4],"e":"按时足额申报缴税是守法
