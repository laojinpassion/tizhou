算和简单的宏观经济模型","t":"single","q":"国内生产总值（GDP）是按（　）计算的一国（或地区）常住单位生产的最终产品和劳务的市场价值总和。","o":["国民原则（本国国民）","国土（地域）原则（境内生产，不论生产者国籍）","国籍原则","企业注册地原则"],"a":[1],"e":"GDP按“国土/地域”原则核算：在中国境内生产就算中国GDP，包括外资企业在华产出；GNP（现称GNI）按“国民”原则：本国国民（含在境外的）生产的算本国国民收入。外资在华利润计入我国GDP、不计入我国GNI——这就是两个指标的差异来源。\n【记忆钩子】“GDP看地盘，GNI看人头”。","k":"GDP的概念（地域原则）"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"面粉厂出售给面包房的面粉、出售给居民的面粉，在GDP核算中的处理是（　）。","o":["两次都计入GDP","卖给面包房的面粉不计入（中间产品），卖给居民的计入（最终产品）","两次都不计入","按重置价值计一次"],"a":[1],"e":"GDP只计最终产品，避免重复计算：面粉卖给面包房是中间产品（还要变成面包被再次核算），直接卖给居民消费就是最终产品。避免重复的技术是增值法：各环节只计本环节的增加值，加总等于最终产品价值。\n【易错点】同一批面粉身份不同待遇不同——“卖给的下游是谁”决定中间还是最终。","k":"最终产品与中间产品"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"用收入法核算GDP时，包括劳动者报酬、生产税净额、固定资产折旧和（　）。","o":["营业盈余","个人储蓄","政府转移支付","进口总额"],"a":[0],"e":"收入法把GDP按要素与政府的“分蛋糕”加总：劳动者报酬（工资奖金社保）＋生产税净额（生产税−补贴）＋固定资产折旧＋营业盈余（企业利润）＝GDP。四大项对应“挣的钱、交的税、磨的旧、赚的利”。与支出法（C+I+G+NX）、生产法（各行业增加值）三法殊途同归。\n【对比记忆】支出法看“钱花到哪”，收入法看“钱被谁挣走”。","k":"GDP的收入法核算"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"在只有家庭和企业的两部门经济中，国民收入恒等式表现为（　）。","o":["投资等于储蓄（I＝S）","消费等于储蓄","税收等于政府购买","出口等于进口"],"a":[0],"e":"两部门（家庭＋企业）：总收入＝消费＋储蓄，总支出＝消费＋投资，收支相等推出I＝S——储蓄是投资的资金来源，这是宏观恒等式家族的起点。三部门加入政府：I＝S＋(T−G)（私人储蓄＋政府净收入支撑投资）；四部门再加净出口：I＝S＋(T−G)＋(M−X)。\n【记忆链】“两部门I＝S，三部门加政府，四部门加外贸”。","k":"储蓄—投资恒等式"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"线性消费函数为C＝a＋bY（a为自发消费，b为边际消费倾向）。随着收入增加，平均消费倾向（APC＝C/Y）将（　）。","o":["不断下降","不断上升","保持不变","等于边际消费倾向"],"a":[0],"e":"APC＝C/Y＝a/Y＋b：收入Y越大，a/Y越小，APC越接近并永远高于b（MPC）。含义：越富的家庭收入中消费占比越低、储蓄占比越高——凯恩斯消费函数的核心结论，也是“刺激消费要盯中低收入群体”的学理依据。\n【两条曲线关系】“APC＞MPC，且APC随收入下降、逐渐靠近MPC”。","k":"消费函数与消费倾向"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"边际消费倾向为0.75时，边际储蓄倾向为（　）。","o":["0.25","0.75","1","4"],"a":[0],"e":"收入要么消费要么储蓄：MPC＋MPS＝1，故MPS＝1−0.75＝0.25。延伸：投资乘数k＝1/MPS＝1/0.25＝4——储蓄倾向越高、乘数越小，扩张政策的效果越弱。\n【成对换算】知道MPC就知道了MPS和乘数（k＝1/(1−MPC)），一组数字通吃三种题。","k":"边际消费倾向与边际储蓄倾向"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"multi","q":"下列各项中，应计入当年GDP的有（　）。","o":["当年生产并销售的汽车","家政公司提供的当年保洁服务","去年生产、今年售出的存货","买卖二手房的佣金（当年提供的中介服务）","二手房本身的价值"],"a":[0,1,3],"e":"GDP计“当年生产的新价值”：当年生产的汽车（C）、当年提供的保洁服务（服务也是产出）、二手房交易的佣金（中介服务是当年新提供的服务）都计入。去年造的存货不是今年生产（去年已计入），二手房子本身只是产权转移、不是当年生产——都不重复计入。\n【判断口诀】“是不是今年新造的（含服务）；中介费是服务要算，旧货本身不算”。","k":"GDP的核算范围"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"经济增长率扣除资本增长贡献和劳动增长贡献后的剩余部分，通常被解释为（　）的贡献。","o":["技术进步（全要素生产率）","人口增长","通货膨胀","汇率变动"],"a":[0],"e":"增长核算（索洛余值法）：产出增长＝资本贡献（α·ΔK/K）＋劳动贡献（β·ΔL/L）＋技术进步率（索洛余值）。余值——增长中“要素投入解释不了的部分”——归功于技术进步与效率提升（全要素生产率TFP）。它告诉我们：靠堆要素的增长有极限，靠科技与效率的增长才有后劲。\n【政策语言】“从要素驱动转向创新驱动”＝提高TFP贡献率。","k":"增长核算与全要素生产率"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"联合国开发计划署的人类发展指数（HDI）综合衡量发展的三个维度是（　）。","o":["预期寿命（健康）、受教育程度（教育）、人均收入（体面的生活水平）","GDP总量、军费、人口","外汇储备、贸易额、通胀率","城市化率、工业化率、信息化率"],"a":[0],"e":"HDI用三个维度纠正“唯GDP”的发展观：健康（出生预期寿命）、教育（入学年限与预期在校年限）、体面生活（人均国民收入）。它体现发展经济学的基本立场：发展≠增长，发展还包括结构优化、能力提升、福利改善。\n【辨析】“有增长无发展”指GDP涨了但结构恶化、贫富分化、环境破坏——增长是必要条件，不是充分条件。","k":"经济发展（人类发展指数）"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"既满足当代人的需要，又不损害后代人满足其需要能力的发展，称为（　）。","o":["可持续发展","粗放型增长","进口替代","出口导向"],"a":[0],"e":"可持续发展的核心是代际公平：今天的增长不能透支资源环境（后代的发展本钱），内涵包括经济可持续、社会可持续、生态可持续三维。与之配套的政策：绿色低碳转型、资源节约与循环利用、生态补偿制度。“绿水青山就是金山银山”正是可持续发展理念的中国表达。\n【对照】粗放型增长靠高投入高消耗，与可持续方向相反。","k":"可持续发展"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"在经济周期的度量中，如果经济总量的绝对值出现下降（GDP负增长），这种周期称为（　）。","o":["增长型周期","古典型周期","长周期","季节波动"],"a":[1],"e":"按波动形态分：古典型周期——经济总量绝对水平下降（负增长、真正“衰退”）；增长型周期——总量还在增长、只是增长率高低起伏（增速换挡）。现代经济多以增长型周期为主，古典型衰退多伴随重大危机。划分周期的“谷谷”或“峰峰”间隔即周期长度（短周期3~4年、中周期8年、长周期50~60年）。\n【判断口诀】“绝对量降是古典，增速降是增长型”。","k":"经济周期的类型"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"multi","q":"下列关于经济增长与经济发展关系的说法，正确的有（　）。","o":["经济增长是经济发展的基础和前提","经济发展包含经济增长，还包括结构优化、福利改善等更丰富内涵","有经济增长必然有经济发展","经济发展可以用人类发展指数等综合指标衡量","高质量增长强调效率、结构与可持续性"],"a":[0,1,3,4],"e":"增长是发展的必要条件而非充分条件（C 错——可能是“有增长无发展”：单纯堆要素、结构恶化、成果分配不均）。发展＝增长＋结构升级＋制度进步＋福利与环境改善，用HDI等综合指标衡量；高质量发展正是对“发展内涵”的政策化表达：创新驱动、协调平衡、绿色低碳、开放合作、共享普惠。\n【答题直觉】“把增长和发展画等号的选项，一律错”。","k":"经济增长与经济发展的关系"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"我国衡量价格总水平变动最常用的指标是（　）。","o":["居民消费价格指数（CPI）","生产者价格指数（PPI）","GDP缩减指数","恩格尔系数"],"a":[0],"e":"CPI反映居民购买消费品和服务价格的总变动，与民生直接相关，是国际上度量通货膨胀最常用指标（我国把3%左右作为年度调控参考目标之一）。PPI反映工业品出厂价格（偏上游、领先指标）；GDP缩减指数覆盖全部最终产品但季度才出、时效差；恩格尔系数（食品支出占比）衡量生活水平，不是价格指数。\n【联动解读】PPI向CPI传导、剪刀差，都是政策分析常用语。","k":"价格总水平的度量（CPI）"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"失业率的计算公式是（　）。","o":["失业人数÷劳动力总数（就业人数＋失业人数）×100%","失业人数÷总人口×100%","失业人数÷就业人数×100%","（总人口−就业人数）÷总人口×100%"],"a":[0],"e":"失业率＝失业人数/劳动力总数，劳动力＝就业者＋失业者（16岁以上、有劳动能力、正在找工作的人口）。分母不是总人口——家庭主妇、在校学生、退休者、丧失劳动能力者不属于劳动力；想工作但已放弃找工作的“灰心丧气的劳动者”被计入“退出劳动力市场”，这正是统计失业率低估实际失业的原因。\n【配套指标】劳动参与率＝劳动力/适龄人口。","k":"失业率"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"奥肯定律描述的关系是（　）。","o":["失业率与产出缺口反向变动（失业率每高于自然失业率1个百分点，实际GDP低于潜在GDP约2%）","税率与税收收入的关系","失业与通货膨胀的替代关系","收入与消费的关系"],"a":[0],"e":"奥肯定律：失业率的变动与GDP增长缺口负相关——失业多1个点，产出损失约2个点，说明“失业的宏观代价巨大”，为政府稳定就业提供量化依据。注意区分：奥肯定律管“失业—产出”，菲利普斯曲线管“失业—通胀”，拉弗曲线管“税率—税收”，别记串。\n【政策含义】保就业就是保增长，稳就业政策有宏观效率依据。","k":"奥肯定律"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"菲利普斯曲线最初揭示的是失业率与（　）之间此消彼长的关系。","o":["货币工资增长率（后扩展为通货膨胀率）","利率水平","财政赤字率","汇率水平"],"a":[0],"e":"菲利普斯曲线（菲利普斯，英国数据）：失业率与货币工资增长率负相关；萨缪尔森等将其扩展为失业率与通货膨胀率的替代关系——低失业伴随高通胀、高失业伴随低通胀，政策上面临“两难取舍”。短期存在替代关系，长期中预期调整后曲线趋于垂直（长期不存在替代）——理性预期学派的修正。\n【联动】这一“短期替代、长期消失”的结论是理解货币政策规则之争的钥匙。","k":"菲利普斯曲线","fig":"phillips"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"发生通货膨胀时，从固定利率债权债务关系看，通常（　）。","o":["债务人受益、债权人受损","债权人受益、债务人受损","双方都不受影响","银行必然破产"],"a":[0],"e":"未预期的通胀使货币购买力下降：债务人还的钱“缩水”，实际债务负担减轻——受益；债权人收回的钱买不到原来那么多东西——受损。同理，固定收入者（退休金、工薪）受损，持有实物资产与涨价资产者相对受益。\n【反向操作】通胀预期下“长期固定利率债务受欢迎、浮动利率资产受欢迎”——利率会被通胀预期推高。","k":"通货膨胀的再分配效应"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"月通货膨胀率超过50%的极端通货膨胀，称为（　）。","o":["温和通货膨胀","奔腾式通货膨胀","恶性（超级）通货膨胀","隐蔽型通货膨胀"],"a":[2],"e":"按程度分：温和（爬行式）通胀——年率较低（一般低于10%），对经济危害有限甚至润滑交易；奔腾式——两位数急速上涨，扰乱经济秩序；恶性（超级）通胀——月率超50%（物价一年涨千倍量级），货币体系崩溃（历史案例：魏玛德国、津巴布韦）。按是否显现：公开型（物价明涨）与隐蔽型（有价无货、排队配给）。\n【治理共识】恶性通胀的唯一出路是财政货币“双紧”＋币制改革＋恢复财政纪律。","k":"通货膨胀的类型（按程度）"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"亚当·斯密的绝对优势理论认为，国际贸易的基础是（　）。","o":["各国在不同产品上的绝对劳动成本差异","各国的要素禀赋差异","规模经济","各国需求偏好差异"],"a":[0],"e":"绝对优势理论（斯密《国富论》）：各国按绝对劳动成本最低的产品分工生产并交换，双方获利。局限：若一国在所有产品上都处于绝对劣势，贸易似乎无法发生——李嘉图用比较优势理论修补了这个漏洞（机会成本差异决定分工）。要素禀赋理论（赫克歇尔-俄林）解释比较优势的来源（资源禀赋），规模经济理论（克鲁格曼）解释发达国家的产业内贸易。\n【理论演进线】绝对优势→比较优势→要素禀赋→规模经济，一个比一个精细。","k":"绝对优势理论"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"赫克歇尔-俄林的要素禀赋理论认为，一国应当出口（　）。","o":["密集使用本国相对丰裕要素生产的产品","本国绝对成本最低的产品","本国稀缺资源生产的产品","所有本国能生产的产品"],"a":[0],"e":"要素禀赋理论（H-O理论）回答了“比较优势从哪来”：各国要素存量不同（劳动力丰富的国家、资本丰富的国家），出口密集使用本国丰裕要素的产品、进口密集使用本国稀缺要素的产品——劳动丰富的国家出口服装，资本丰富的国家出口机器。\n【记忆钩子】“有什么多就卖什么多的”。","k":"要素禀赋理论"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"解释发达国家之间、相似产品之间大量贸易（产业内贸易）的理论是（　）。","o":["绝对优势理论","规模经济贸易理论（克鲁格曼）","重商主义","要素禀赋理论"],"a":[1],"e":"规模经济贸易理论（新贸易理论，克鲁格曼）：即使两国要素禀赋、技术相近，分工与规模经济仍带来贸易利益——大规模专业化生产降低平均成本，消费者同时享受“便宜＋多样”（德国出口汽车给美国，美国也出口汽车给德国）。它解释了战后发达国家间贸易比重上升的现象，是传统比较优势理论覆盖不到的盲区。\n【对照传统】要素禀赋解释“南北贸易”（发达国家与发展中国家），规模经济解释“北北贸易”（发达国家之间）。","k":"规模经济贸易理论"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"征收进口关税的福利效应表现为（　）。","o":["消费者受损、生产者受益、政府获得关税收入，社会整体出现净损失","全社会都受益","只有消费者受益","只影响出口国利益"],"a":[0],"e":"关税抬高了国内价格：消费者支付更多（消费者剩余减少，且损失最大）；国内生产者获得保护、扩大生产（生产者剩余增加）；政府获得关税收入；但“保护低效率生产＋抑制消费”造成无谓损失（净福利为负）。此外还引发贸易伙伴报复、资源配置扭曲。\n【政策现实】关税是“保护少数、摊薄到多数人头上”的隐形税——每个人多掏一点，养活一个低效行业。","k":"关税的效应"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"一国企业以低于正常价值的价格向另一国出口产品，并对进口国同类产业造成实质损害。这种行为称为（　）。","o":["倾销","补贴","走私","转口贸易"],"a":[0],"e":"倾销：出口价格低于“正常价值”（出口国国内价格或成本加合理利润），损害进口国产业，进口国可依WTO规则征收反倾销税（税率不超过倾销幅度）。认定要件：低价＋损害＋因果关系。反补贴针对的是政府补贴出口；走私是逃避监管的非法行为；转口贸易是正常贸易方式。\n【公平与否的争辩】“低于成本卖”是掠夺性倾销还是正常促销，实务中认定复杂，但考试按规则答案走。","k":"倾销与反倾销"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"世界贸易组织（WTO）的最惠国待遇原则要求（　）。","o":["一成员给任何一国的优惠，无条件给予所有成员","只给最友好的国家优惠","对发展中国家不适用","只适用于服务贸易"],"a":[0],"e":"WTO两大基石原则：最惠国待遇（MFN）——给你给我的任何一个伙伴的最好待遇，就自动给我（成员之间“一视同仁”，不允许选择性优惠）；国民待遇——进口产品在国内税费与法规上享受不低于本国同类产品的待遇（“进了国门就是自己人”）。例外：自由贸易区/关税同盟的内部优惠、对发展中国家的特殊差别待遇、安全例外等。\n【记忆钩子】“最惠国：一碗水端平；国民待遇：进门同待遇”。","k":"WTO的基本原则"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"multi","q":"下列措施中，属于非关税壁垒的有（　）。","o":["进口配额","进口许可证制度","苛刻的技术标准与卫生检疫要求","歧视性政府采购","降低进口关税"],"a":[0,1,2,3],"e":"非关税壁垒名目繁多：数量限制类（配额、许可证）、技术类（技术标准、认证、卫生检疫——SPS/TBT）、行政类（歧视性政府采购、海关程序刁难）、外汇管制等。降低关税是贸易自由化措施，方向恰好相反。\n【趋势判断】当代贸易摩擦更多采用非关税手段（更隐蔽、更灵活），技术标准是重灾区——“标准即壁垒”。","k":"非关税壁垒的种类"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"《区域全面经济伙伴关系协定》（RCEP）的重要意义在于（　）。","o":["它是目前全球参与人口最多、经贸规模最大、最具发展潜力的自由贸易区","它是全球最高的关税同盟","它取代了世界贸易组织","它只涉及金融服务开放"],"a":[0],"e":"RCEP由东盟十国发起，中国、日本、韩国、澳大利亚、新西兰共同参与，2022年生效——覆盖全球约三成人口、经济总量与贸易额，是全球规模最大的自贸协定。核心内容：货物贸易最终零关税比例高、原产地累积规则（区域价值成分累积计算，便利产业链布局）、服务与投资开放、电子商务等新规则。\n【战略意义】首次以自贸协定纽带连接中日两大经济体，深化亚太产业链合作。","k":"区域经济合作（RCEP）"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"长期平均成本曲线呈U形的原因是（　）。","o":["先出现规模经济、后出现规模不经济","边际效用递减","供求关系波动","价格管制"],"a":[0],"e":"长期中企业可自由调整规模：规模较小时扩大规模带来专业化分工、大型设备等规模经济，平均成本下降；规模过大后管理层次膨胀、协调困难，出现规模不经济，平均成本上升——长期平均成本曲线因此呈U形，最低点对应最优规模。短期U形则源于边际报酬先增后减（可变要素与固定要素配比失衡）。\n【对位记忆】“短期U形看边际报酬，长期U形看规模经济”。","k":"长期平均成本曲线"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"与完全竞争相比，垄断市场的效率损失表现为（　）。","o":["价格高于边际成本，产量低于社会最优水平，产生无谓损失","产量高于社会最优水平","价格等于边际成本","消费者剩余增加"],"a":[0],"e":"垄断企业按MR＝MC定产、按需求曲线定价，导致P＞MC：一部分愿意按边际成本购买的消费者买不到，交易减少；已成交部分价格虚高、消费者剩余被转移；加上“高价格抑制交易”形成的无谓损失——社会福利净减少。这也是反垄断政策的经济依据（拆分、管制、引入竞争）。\n【对照】完全竞争P＝MC，资源配置帕累托效率；垄断P＞MC，价格“失真”。","k":"垄断的效率损失"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"工资率上升产生的“替代效应”是指（　）。","o":["闲暇的机会成本上升，劳动者减少闲暇、增加劳动供给","劳动者收入提高后多买闲暇、减少劳动","企业用机器替代劳动","劳动者换雇主"],"a":[0],"e":"工资上升对劳动供给有双向作用：替代效应——闲暇的机会成本（少工作损失的收入）变贵，人们用工作替代闲暇，劳动供给增加；收入效应——钱多了“买得起”闲暇，减少劳动。两效应反向拉扯，替代效应占优时供给曲线右上（劳动力市场常见区间），收入效应占优时向后弯（高工资段）。\n【对称记忆】对劳动者：工资是工作的报酬、也是闲暇的价格。","k":"工资变化的替代效应与收入效应"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"资本这种生产要素提供服务的价格，通常表现为（　）。","o":["利率（利息）","工资","地租","利润"],"a":[0],"e":"要素服务价格各归其位：劳动→工资，资本→利息（利率），土地→地租，企业家才能→利润。资本需求曲线（利率越低投资越多）与资本供给（储蓄）共同决定均衡利率。理解这个对应关系，货币政策（利率）与实体经济投资的分析就打通了。\n【判断口诀】“给劳动的叫工资，借资本付利息，租土地交地租，剩下的归利润”。","k":"资本的价格"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"政府规定的最低工资标准高于市场均衡工资率时，可能出现的后果是（　）。","o":["劳动需求量减少、供给量增加，出现失业（劳动力过剩）","就业自动增加","工资下降回均衡","劳动供给减少"],"a":[0],"e":"最低工资是劳动力市场上的“保护价格”（高于均衡价）：企业按更高工资只愿雇佣较少人，求职者却增多，差额就是失业。它保护了在岗者，但可能伤及最弱势的低技能劳动者。现实政策需要权衡：适度标准的最低工资对就业影响有限，且能改善收入分配；定得过高则副作用明显。\n【对照保护价格】农产品保护价→过剩由政府收购；最低工资→“过剩”是失业，政府收不了人，所以争议更大。","k":"最低工资与劳动力市场"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"根据外部性理论，对产生负外部性的经济活动按外部成本大小征收的矫正性税收称为（　）。","o":["庇古税","拉弗税","关税","个人所得税"],"a":[0],"e":"庇古税：按“外部成本内部化”的思路征税——税率=边际外部成本，让排污者自己承担社会代价，产量回落到社会最优。对正外部性则给予等额补贴（庇古补贴）。它是环境税费（排污费、环保税、碳税）的理论原型。\n【对比科斯】庇古走“政府定价”路线，科斯走“界定产权、市场谈判”路线——两套药方对应不同交易成本条件。","k":"庇古税"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"治理信息不对称问题，政府可采取的措施不包括（　）。","o":["强制信息披露","质量认证与标准管理","建立信誉与信用体系","禁止市场交易"],"a":[3],"e":"信息不对称的治理工具箱：强制披露（食品配料表、财报审计）、认证与许可（3C认证、执业资格）、声誉机制（信用评级、平台评价）、担保与售后承诺。全面禁止交易是极端手段，会同时消灭交易的收益，通常不是合理选择——监管的目标是“让信息流动起来”，而不是“让市场关门”。\n【市场自发解决】品牌、质保、连锁经营本身就是企业自建的“信誉抵押品”。","k":"信息不对称的治理"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"剔除价格变动因素、按不变价格计算的GDP称为（　）。","o":["名义GDP","实际GDP","潜在GDP","人均GDP"],"a":[1],"e":"实际GDP＝按基期不变价格计算的GDP，剔除了物价上涨的“水分”，反映真实产出变化；名义GDP按当期价格计算，包含价格因素。两者之比即GDP缩减指数（平减指数），也是测算通货膨胀的宽口径指标。报告“经济增长6.5%”通常指实际GDP增速。\n【判断口诀】“看增长用实际，看现值用名义；实际＝名义÷价格指数”。","k":"名义GDP与实际GDP"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"主要依靠增加生产要素投入数量来实现增长的方式，称为（　）。","o":["集约型增长","粗放型增长","内涵式增长","创新型增长"],"a":[1],"e":"粗放型（外延式）增长：靠多投入劳动力、资本、资源“堆”产量，边际效益递减、资源环境代价大；集约型（内涵式）增长：靠技术进步、管理改善、劳动者素质提高提高要素使用效率。增长方式转变的核心是提高全要素生产率贡献——创新驱动、质量第一。\n【判断标志】“堆数量、拼资源”是粗放，“提效率、上技术”是集约。","k":"经济增长方式的类型"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"发展中国家普遍存在传统农业部门与现代工业部门并存的二元经济结构。刘易斯模型认为，经济发展的过程是（　）。","o":["农业剩余劳动力向现代工业部门转移，直至二元结构转化为一元","工业劳动力回流农业","农业部门自动消失","两个部门互不相干"],"a":[0],"e":"刘易斯二元经济模型：传统农业部门存在大量边际产出接近零的剩余劳动力，现代工业部门以略高于农业收入的工资吸收劳动力，直至剩余劳动力被吸纳完毕（刘易斯转折点），工资开始上涨、两部门融合——这解释了发展中国家“廉价劳动力红利”及其消失。中国经济发展常引用该模型解释“民工潮”与“招工难”的转换。\n【结构含义】二元结构是发展中国家的典型特征，城镇化、工业化就是消解二元结构的过程。","k":"二元经济结构（刘易斯模型）"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"库兹涅茨曲线描述的收入分配随经济发展的变化规律是（　）。","o":["先扩大后缩小（呈倒U形）","一直扩大","一直缩小","保持不变"],"a":[0],"e":"库兹涅茨“倒U假说”：发展初期，工业化、城市化使收入差距扩大（部门间、城乡间、技能间差异拉大）；发展成熟后，劳动力转移完成、教育与再分配制度完善，差距重新收敛。经验检验分歧较大（部分国家长期未收敛），但“发展不能听任分化——需要主动的分配调节”的政策含义清晰。\n【同类曲线】环境库兹涅茨曲线（污染随发展先升后降），逻辑同源、别记混主题。","k":"库兹涅茨曲线"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"充分就业状态下仍然存在的失业（摩擦性失业与结构性失业之和）对应的失业率称为（　）。","o":["自然失业率","周期性失业率","零失业率","登记失业率"],"a":[0],"e":"自然失业率＝摩擦性＋结构性失业占劳动力的比重：即使总供求平衡、经济“充分就业”，换工作、技能错配仍会造成一定失业，所以充分就业≠零失业。超过自然失业率的部分才是周期性失业，需要总需求政策治理；摩擦性与结构性失业靠劳动力市场建设（信息平台、职业培训）。\n【政策口诀】“需求政策治周期，供给政策治自然”。","k":"自然失业率"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"编制居民消费价格指数（CPI）时，调查的内容是（　）。","o":["居民消费的一篮子商品和服务的价格变动（含食品烟酒、衣着、居住、生活用品、交通通信、教育文化、医疗保健、其他等大类）","全部工业品出厂价格","股票价格指数","农产品收购价格"],"a":[0],"e":"CPI按“一篮子”消费品和服务编制：我国CPI覆盖八大类——食品烟酒、衣着、居住、生活用品及服务、交通和通信、教育文化娱乐、医疗保健、其他用品及服务，按居民消费支出结构确定权重并定期更新。食品（尤其猪肉）权重影响大，故有“猪周期扰动CPI”的说法；居住类含房租不含房价。\n【区分】工业品出厂价格是PPI的篮子，两者口径不同。","k":"CPI的构成"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"国防、治安等纯公共物品通常由政府免费提供，其原因是（　）。","o":["无法向受益者分别收费（非排他性），市场无法有效供给","政府提供一定更便宜","法律禁止私人生产任何公共物品","消费者不需要这类物品"],"a":[0],"e":"纯公共物品非排他＋非竞争，无法对使用者分别收费、收费成本极高，市场价格机制失灵；其成本只能通过税收等强制性方式筹集、由政府统一提供并免费享用。注意“免费提供”指的是消费端不收费，资源成本仍在（税收支付）——“天下没有免费的公共物品，只有看不见的税单”。\n【准公共物品对照】教育医疗可部分收费（受益者负担）＋政府补贴，供给方式更灵活。","k":"纯公共物品的提供方式"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"财政支出绩效评价遵循的“3E”原则是指（　）。","o":["经济性、效率性、效果性","公平性、公开性、公正性","强制性、无偿性、固定性","计划、执行、检查"],"a":[0],"e":"3E原则：经济性（Economy——花得省，成本最小化）、效率性（Efficiency——花得快，投入产出比）、效果性（Effectiveness——花得值，目标达成度）。后扩展出“5E”（加环境性Equity/Environment、公平性）。“花钱必问效、无效必问责”是预算绩效管理的总要求。\n【记忆钩子】“省钱、省事、办成事”。","k":"财政支出绩效评价（3E原则）"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"税收成为财政收入最主要形式的原因不包括（　）。","o":["来源广泛、稳定可靠","强制无偿、规范法治","依据国家政治权力征收","完全由纳税人自愿决定缴纳多少"],"a":[3],"e":"税收的优越性：以政治权力为后盾（强制性）、无需偿还付息（无偿性）、依法定标准征收（固定性/规范性），因此来源广泛、及时、稳定——天然适合充当财政的“主粮”。自愿性是国债和捐赠的特征，恰恰是税收所不具备的。\n【三性连锁】强制→无偿→固定，三者互为支撑，共同区别于收费、国债、罚没等其他收入形式。","k":"税收的特征（ again 强化）"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"按照税收与价格的关系分类，增值税（一般计税方法）属于（　）。","o":["价内税","价外税（税额在价格之外单独列明）","直接税","财产税"],"a":[1],"e":"价外税：税款不包含在商品价格内、单独列示（增值税专用发票上“金额＋税额”分列），消费者看得见税；价内税：税款含在价格里（消费税、关税），消费者只看到总价。间接税/直接税按“能否转嫁”分，增值税是间接税；按计税依据分还有从价税、从量税（车船税按辆、啤酒从量）。\n【三个分类维度】“价格内外、能否转嫁、计量方式”，一套税三种身份。","k":"税收的分类（价内税与价外税）"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"我国《预算法》确立的预算管理基本规则是（　）。","o":["先有预算、后有支出；各级预算须经本级人大批准，未经法定程序不得调整","先花钱后补预算","政府可自行决定收支","预算只对内不公开"],"a":[0],"e":"预算法治的铁律：无预算不支出、先批准后执行；预算执行中确需调整的，必须编制预算调整方案报本级人大常委会审查批准；决算接受人大审批与审计监督。目的是把政府收支关进“制度的笼子”。\n【配套时间线】人大批准预算→执行→决算→审计→公开，一个年度闭环。","k":"预算法治"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"中央预算草案由（　）编制、提请全国人民代表大会审查批准。","o":["国务院","财政部独立决定","审计署","中国人民银行"],"a":[0],"e":"预算编制主体：国务院编制中央预算草案（具体由财政部门汇总），报全国人大审查批准；地方各级预算由本级政府编制、本级人大批准。人大是预算的“批准机关”，财政部门是“编制与执行的具体经办机关”，审计机关事后监督——分工明确。\n【易混点】“财政部编制、国务院提请、人大批准”是一条流水线，别把角色张冠李戴。","k":"预算的编制与审批主体"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"我国现行财政管理体制的类型是（　）。","o":["分税制基础上的分级财政管理体制","统收统支体制","财政包干体制","单一税制体制"],"a":[0],"e":"我国1994年分税制改革确立了“分税制＋分级财政”体制：中央与地方按税种划分收入、分级编制预算、分级承担支出责任，并配套转移支付制度均衡地区财力。此前经历统收统支（计划经济时期）、财政包干（80年代“分灶吃饭”）等阶段——包干制导致“两个比重”（财政收入占GDP、中央收入占比）下滑，才有了分税制改革。\n【历史坐标】1994分税制是理解现行央地财政关系的起点。","k":"我国财政管理体制的类型"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"按财政政策调节经济周期的作用方式划分，可分为（　）。","o":["自动稳定的财政政策和相机抉择的财政政策","中央财政政策和地方财政政策","税收政策和货币政策","长期政策和五年规划"],"a":[0],"e":"两大类：自动稳定器——制度内嵌、自动发挥（累进税、社保）；相机抉择——政府审时度势主动出手（增支减税或紧缩）。另有按松紧方向分为扩张性、紧缩性、中性（稳健）政策；按作用空间分为总量政策与结构性政策（减税定向行业、专项债投向）。\n【两个分类维度】“怎么发挥作用（自动/相机）＋往哪个方向使劲（松/紧）”。","k":"财政政策的分类"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"根据消费者权益保护法，对侵害众多消费者合法权益的行为，可以提起公益诉讼的主体是（　）。","o":["中国消费者协会以及在省、自治区、直辖市设立的消费者协会","任何单个消费者","新闻媒体","行业协会"],"a":[0],"e":"消费者公益诉讼：对侵害众多不特定消费者合法权益、损害社会公共利益的行为，中消协和省级消协可以向人民法院提起诉讼——让“维权成本高、单个不值得告”的群体性侵害有制度出口。单个消费者的私益诉讼照常进行；新闻媒体有舆论监督权但无诉讼主体资格。\n【同族制度】检察机关公益诉讼、环境公益诉讼，共同构成公益诉讼体系。","k":"消费者公益诉讼"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"消费者效用最大化时选择商品组合，当商品X的价格下降而其他条件不变时，预算线与无差异曲线形成新的切点。这一比较静态分析的结论是（　）。","o":["价格变化引起消费者均衡点移动，可由不同价格下的均衡点推导出个人需求曲线","需求曲线与均衡无关","收入变化不影响均衡点","效用与价格始终无关"],"a":[0],"e":"价格—消费曲线（PCC）：让X的价格连续变化，把每一价格下的消费者均衡点（预算线与无差异曲线的切点）连起来，再转换到“价格—数量”坐标系，就得到该消费者的需求曲线——这正是序数效用论对需求规律的微观推导。同理，收入—消费曲线（ICC）推导恩格尔曲线。\n【理论闭环】“需求为什么向右下倾斜？”——边际效用递减/替代与收入效应给了答案，PCC给出了图形推导。","k":"消费者均衡与需求曲线的推导","fig":"indifference"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"按照税收负担能否转嫁分类，个人所得税、企业所得税属于（　）。","o":["间接税（税负易转嫁）","直接税（税负不易转嫁，由纳税人直接承担）","从量税","中央税"],"a":[1],"e":"直接税：纳税人与负税人基本一致、税负难转嫁——个人所得税、企业所得税、房产税、车船税；间接税：税负可转嫁给最终消费者——增值税、消费税、关税。直接税直接“摸收入与财产”，调节分配功能强；间接税征收效率高但具有累退性（低收入者负担相对重）。\n【结构取舍】现代税制“间接税保收入、直接税调分配”，我国正逐步提高直接税比重。","k":"直接税与间接税"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"政府间财政关系中，“地方的事权所需财力不足、中央财力相对集中”形成的纵向财力缺口，主要通过（　）弥补。","o":["中央对地方的转移支付","地方自行发行货币","取消地方事权","提高地方关税"],"a":[0],"e":"分税制下收入相对向中央集中、大量事权由地方承担，形成纵向财政失衡——转移支付（含税收返还、一般性与专项转移支付）就是把中央集中的财力“回流”给地方的制度管道。地方无权发货币、无关税权，取消事权更不可能——转移支付是唯一的规范化解法。\n【改革方向】推进省以下财政体制改革，健全县级基本财力保障机制。","k":"政府间财政关系（纵向失衡与转移支付）"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"multi","q":"下列因素变动中，会导致商品供给增加（供给曲线右移）的有（　）。","o":["生产技术进步","原材料价格下降","政府给予生产补贴","消费者对该商品的偏好增强","行业内生产企业数量增加"],"a":[0,1,2,4],"e":"供给由“成本—技术—主体数量—政策”决定：技术进步与原材料降价降低单位成本（A、B）；补贴改善盈利预期（C）；更多企业进入增加市场总供给（E）。消费者偏好影响的是需求端（D），与供给曲线无关——需求类因素混进供给题是经典干扰。\n【对照记忆】“成本技术动供给，收入偏好动需求”。","k":"影响供给的因素","fig":"supply-shift"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"multi","q":"完全竞争市场的特征包括（　）。","o":["买者和卖者数量众多，任何人都无法影响市场价格","产品同质无差别","资源可以自由流动，企业进出市场无障碍","买卖双方信息完全","单个企业面临向右下方倾斜的需求曲线"],"a":[0,1,2,3],"e":"完全竞争四条件：众多买卖者、产品同质、自由进出、信息完全（A、B、C、D）。正因为这些条件，单个企业只能是价格接受者，其需求曲线是水平线（E 说反了——面对右下倾斜需求曲线的是垄断力量更强的市场）。\n【对照表】四类市场的垄断力量由弱到强：完全竞争→垄断竞争→寡头→完全垄断，需求曲线由水平到最陡。","k":"完全竞争市场的特征"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"multi","q":"按通货膨胀的成因划分，其类型包括（　）。","o":["需求拉上型","成本推进型","输入型","结构型","温和型"],"a":[0,1,2,3],"e":"按成因四分：需求拉上（总需求过旺）、成本推进（工资原料成本上升）、输入型（进口涨价与外部冲击传导）、结构型（部门结构失衡传导扩散）。温和型是按“程度”分类的说法（温和/奔腾/恶性），与成因分类不在一个维度。\n【分类题防御】先看清题问的是“按什么分类”，维度混搭是固定陷阱。","k":"通货膨胀的类型（按成因）"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"multi","q":"关于GDP与国民总收入（GNI）的区别，下列说法正确的有（　）。","o":["GDP按国土（地域）原则核算","GNI按国民（常住居民）原则核算","外资企业在本国的生产计入本国GDP","外资企业汇出国外的利润计入本国GNI","两者在任何国家都完全相等"],"a":[0,1,2,3],"e":"GDP“看地盘”：境内常住单位的生产成果（含外资在本国的产出）；GNI“看人头”：本国常住单位从国内外获得的全部收入（本国要素在境外的收入算进来，外资汇走的利润不算）。经济大量引入外资的国家通常GDP＞GNI；对外投资大国相反。两者永远不会“完全相等”（E 错）——净要素收入几乎不为零。\n【数字口径】GNI＝GDP＋来自国外的净要素收入。","k":"GDP与GNI"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"multi","q":"财政政策的内在稳定器（自动稳定器）主要包括（　）。","o":["累进所得税制度","失业保险和社会福利等转移支付制度","农产品维护价格制度","政府购买性支出的主动增减","公开市场操作"],"a":[0,1,2],"e":"自动稳定器的三大装置：累进所得税（繁荣时自动多征税）、转移支付（衰退时失业救济、低保自动扩支出）、农产品维护价格（价格波动时自动收放储备调节）。D 是政府主动决策的相机抉择手段，不属于“自动”范畴；E 是货币政策工具，跑错片场。\n【判断标准】看是否需要“开会决策”——不用开会就起作用的，才是自动稳定器。","k":"财政政策的自动稳定器"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"multi","q":"中央银行的职能包括（　）。","o":["发行的银行（垄断货币发行）","银行的银行（最后贷款人、集中准备金、组织清算）","政府的银行（代理国库、管理国际储备）","以盈利为目的经营存贷款业务","直接为企业和个人办理结算账户开立"],"a":[0,1,2],"e":"央行三大职能（A、B、C），另外两条都是“央行不该干的事”：不以盈利为目的、原则上不与企业和个人直接发生业务往来（D、E 错）——这正是央行与商业银行的本质区别。央行的对象是金融机构和政府，“最后贷款人”角色只在非常时期对金融机构启用。\n【反着记】“央行三管：管印钱、管银行、管国库；不抢商业银行生意”。","k":"中央银行的职能"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"multi","q":"下列融资活动中，属于直接融资的有（　）。","o":["发行股票","发行企业债券","商业票据签发与转让","向商业银行申请贷款","办理融资租赁"],"a":[0,1,2],"e":"直接融资：资金供需双方直接建立债权债务或股权关系——股票、债券、商业票据、风险投资等；银行存贷款、融资租赁、信托贷款等经过金融中介的资产负债表，属间接融资。判断标志：钱有没有“经过中介的手转一道”。\n【延伸】直接融资市场化程度是金融体系结构的重要标志，我国长期以间接融资为主，政策方向是提高直接融资比重。","k":"直接融资与间接融资"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"multi","q":"下列关于会计等式与复式记账的说法中，正确的有（　）。","o":["基本会计等式为“资产＝负债＋所有者权益”","任何经济业务的发生都不会破坏会计等式的平衡关系","复式记账对每项经济业务在两个或两个以上相互联系的账户中登记","借贷记账法的记账规则是“有借必有贷、借贷必相等”","会计等式平衡了就说明所有账都记对了"],"a":[0,1,2,3],"e":"会计恒等式是复式记账的理论基石：任何业务要么等式两边同增同减、要么一边内部有增有减，恒等关系永存（A、B）；复式记账（C）与“有借必有贷、借贷必相等”规则（D）共同保证试算平衡。E 是经典误读——平衡只是必要条件，漏记、重记、串户等错误借贷依旧平衡。\n【记忆钩子】“等式永平是原理，试算平衡是体检，体检正常不等于没病”。","k":"会计等式与复式记账","fig":"taccount"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"multi","q":"下列属于统计调查方式的有（　）。","o":["普查","抽样调查","统计报表","重点调查与典型调查","会计恒等试算"],"a":[0,1,2,3],"e":"我国统计调查方式体系：普查（全面、一次性）、统计报表（经常性、自上而下布置）、抽样调查（非全面、应用最广）、重点调查（只查举足轻重的少数单位）、典型调查（有意识选代表深入解剖）。E 是会计概念，与统计调查无关。\n【选择逻辑】要“全”用普查，要“快省”用抽样，要“常态”用报表，要“抓大头”用重点，要“解剖麻雀”用典型。","k":"统计调查方式体系"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"multi","q":"物权与债权相比，物权具有的特征包括（　）。","o":["支配权（直接支配标的物并享受其利益）","对世权（义务人为权利人之外的一切人）","具有排他性（一物之上不能有两个所有权）","请求权（须请求特定义务人为一定行为）","种类和内容由当事人自由创设"],"a":[0,1,2],"e":"物权三特征：支配权（直接管物，无需他人介入）、对世权（人人都是义务人）、排他性（一物一权）；还具有追及效力和优先效力。请求权是债权的特征（D 说反了）；物权实行法定原则，当事人不得自由创设（E 错，恰是债权“意思自治”的对照面）。\n【对仗记忆】“物权对物直接管、对全世界生效、不能自己发明；债权对人发请求、只对特定人生效、合同里随便约定”。","k":"物权与债权"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"multi","q":"有限责任公司与股份有限公司相比，有限责任公司的特征包括（　）。","o":["股东人数有上限（50人以下）","股东以其认缴的出资额为限对公司承担责任","不得公开发行股票募集股份","注册资本划分为等额股份","股权（出资）对外转让受限制，其他股东有优先购买权"],"a":[0,1,2,4],"e":"有限公司的“封闭性”：人数封顶50、不得公开募股、出资转让须其他股东过半数同意且其他股东有优先购买权（人合性），D “注册资本划分为等额股份”是股份公司的标志——有限公司按出资比例行使权利，不划等额股份。E 中“以认缴出资额为限担责”其实是两类公司的共同点（有限责任），但作为有限公司特征表述无误，多选题按正确表述入选。\n【记忆钩子】“有限公司是熟人合伙（封闭），股份公司是陌生人募资（开放）”。","k":"公司的种类与区别"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"multi","q":"影响一国财政收入规模的因素包括（　）。","o":["经济发展水平","分配体制与分配政策","价格变动","税收征管水平","国际汇率制度选择"],"a":[0,1,2,3],"e":"财政收入规模四因素：经济发展水平（根本约束，蛋糕多大）、分配体制政策（切多大比例，宏观税负取向）、价格（名义收入随物价水涨船高，实际规模要看不变价）、征管水平（堵漏能力决定“应收尽收”程度）。汇率制度影响的是对外金融关系，与财政收入规模无直接关系。\n【判断口诀】“蛋糕多大（经济）、切多少（政策）、称的时候用啥秤（价格）、撒没撒漏（征管）”。","k":"影响财政收入规模的因素"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"下列物品（服务）中，属于纯公共物品的是（　）。","o":["高等教育","国防","收费高速公路","经济适用住房"],"a":[1],"e":"纯公共物品同时具备两个特征：①非竞争性——增加一个消费者的边际成本为零；②非排他性——技术上或经济上无法把不付费者排除在受益之外。国防是教科书级的纯公共物品。高等教育、收费公路、经济适用房都具有可排他性或竞争性，属于（准）公共物品或私人物品。\n【同类举例】纯公共物品还有：治安、路灯、灯塔、环境保护。","k":"公共物品及其特征"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"multi","q":"在社会主义市场经济条件下，财政具有的职能包括（　）。","o":["资源配置职能","收入分配职能","经济稳定与发展职能","以盈利为目的的投资经营职能","直接决定商品价格职能"],"a":[0,1,2],"e":"财政三大职能：①资源配置——提供公共物品、纠正外部性；②收入分配——通过税收和转移支付调节收入差距；③经济稳定与发展——运用财政政策熨平经济波动、促进增长与就业。公共财政姓“公”，不以盈利为目的，不直接经营企业和定价。\n【记忆钩子】“配资源、调分配、稳经济”。","k":"财政的三大职能"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"描述“税率提高到一定程度后，税收收入反而随税率提高而下降”这一关系的曲线是（　）。","o":["洛伦兹曲线","拉弗曲线","菲利普斯曲线","无差异曲线"],"a":[1],"e":"拉弗曲线表明：税率与税收收入并非线性正相关，存在一个最佳税率；税率超过该点后，高税率抑制经济活动、税基萎缩，税收收入不增反降。它是供给学派主张减税的理论依据。洛伦兹曲线衡量收入分配公平程度，菲利普斯曲线描述失业率与通货膨胀率的交替关系，无差异曲线属于消费者行为理论。","k":"拉弗曲线","fig":"laffer"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"纳税人通过提高商品销售价格，把税负转嫁给商品购买者或最终消费者承担。这种税负转嫁方式属于（　）。","o":["前转（顺转）","后转（逆转）","消转","税收资本化"],"a":[0],"e":"前转：纳税人抬高售价把税负向前转给购买者/消费者，是最常见、最典型的转嫁方式。后转：压低进货价把税负向后转给供应者。混转：一部分前转、一部分后转。消转：不转嫁给任何人，靠改善经营、降低成本自行消化。税收资本化：多见于土地等耐久财产交易，买方把未来应纳税款从购价中预先扣除。\n【记忆钩子】“往前加价是前转，往后压价是后转”。","k":"税负转嫁的方式"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"multi","q":"税收区别于其他财政收入形式的基本特征（税收“三性”）包括（　）。","o":["强制性","无偿性","固定性","返还性","盈利性"],"a":[0,1,2],"e":"税收三性：①强制性——凭国家政治权力依法征收，不是自愿捐赠；②无偿性——国家取得税收不需要直接向纳税人支付任何对价；③固定性——按事先规定的课税对象、税率等标准征收，相对稳定。返还性（如国债偿还）与盈利性均与税收本质不符。\n【辨析】国债有偿还性，收费与政府提供服务有直接对价，这两点正是它们区别于税收之处。","k":"税收的基本特征"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"下列各项中，不属于我国政府预算体系组成部分的是（　）。","o":["一般公共预算","政府性基金预算","国有资本经营预算","货币政策执行预算"],"a":[3],"e":"我国实行“四本预算”：①一般公共预算（税收为主体，保障民生与公共服务）；②政府性基金预算（专款专用，如土地出让收入）；③国有资本经营预算（国企上缴利润）；④社会保险基金预算（社保缴费与待遇支出）。货币政策由中央银行执行，不属于政府预算范畴。","k":"我国政府预算体系（四本预算）"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"按照我国现行分税制财政管理体制，下列税种中属于中央固定收入的是（　）。","o":["增值税","消费税","企业所得税","个人所得税"],"a":[1],"e":"消费税、关税、车辆购置税等属于中央固定收入；增值税为中央与地方共享税（目前五五分成）；企业所得税和个人所得税为中央与地方共享（六四分成）。\n【记忆钩子】“消费全归央，增值五五分，所得税六四开”。","k":"分税制与税种划分"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"宏观经济处于萧条、失业率上升阶段时，政府适宜采取的财政政策是（　）。","o":["提高税率、压缩财政支出","减少税收、扩大财政支出","增加税收、扩大财政支出","提高利率、减少货币供应"],"a":[1],"e":"萧条期总需求不足，应实行扩张性（积极）财政政策：减税增加企业和居民可支配收入、扩大支出直接增加总需求。紧缩期相反，采用紧缩性财政政策（增税、减支）。D 提高利率属于紧缩性货币政策，且不属于财政政策工具。\n【联动考点】自动稳定器：累进所得税和转移支付随经济波动自动反向调节，无需政府临时决策。","k":"财政政策的类型与工具"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"凯恩斯的流动性偏好理论认为，人们持有货币的动机不包括（　）。","o":["交易动机","预防动机","投机动机","储藏动机"],"a":[3],"e":"凯恩斯货币需求三动机：交易动机（应付日常支付）、预防动机（应付意外支出）、投机动机（把握有价证券的获利机会），三者对应持有货币的三种需求，其中投机性货币需求与利率负相关。储藏动机不属于该理论。\n【记忆钩子】“交、预、投”三动机。","k":"凯恩斯流动性偏好理论"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"因原材料价格上涨、工资成本上升推动一般物价水平持续上涨，这种通货膨胀属于（　）。","o":["需求拉上型通货膨胀","成本推进型通货膨胀","输入型通货膨胀","结构型通货膨胀"],"a":[1],"e":"成本推进型：从供给（成本）端发力，工资、原材料、利润推进等成本上升推动物价上涨。需求拉上型：“过多的货币追逐过少的商品”，由总需求过度扩张引起；输入型：进口品涨价或外币流入传导；结构型：部门结构失衡引起物价总体上行。\n【判断口诀】先问压力来自“买方（需求）”还是“卖方（成本）”。","k":"通货膨胀的类型"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"multi","q":"中央银行的一般性货币政策工具（“三大法宝”）包括（　）。","o":["法定存款准备金率","再贴现","公开市场操作","窗口指导","消费信用控制"],"a":[0,1,2],"e":"一般性货币政策工具是“三大法宝”：法定存款准备金率（威力猛，影响所有银行）、再贴现（影响银行融资成本与数量信号）、公开市场操作（最灵活、最常用，央行买卖政府债券吞吐基础货币）。窗口指导属于辅助性/道义劝说工具，消费信用控制属于选择性货币政策工具。\n【记忆钩子】“准备金、再贴现、公开市场”三件套。","k":"货币政策三大工具"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"中央银行在公开市场上买入政府债券，将直接导致（　）。","o":["基础货币投放增加，市场利率趋于下降","基础货币回笼，市场利率趋于上升","财政赤字扩大","商业银行准备金减少"],"a":[0],"e":"央行买入债券＝向市场（商业银行或公众）支付货币＝投放基础货币→商业银行准备金增加、货币供给扩张→资金面宽松，市场利率趋于下降。卖出债券则相反（回笼货币、收紧）。这是最常用的微调工具。\n【记忆钩子】“买进放水，卖出抽水”。","k":"公开市场操作"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"商业银行能够随时以合理成本变现资产、应付客户提取存款和支付需要的能力，称为（　）。","o":["盈利性","流动性","安全性","成长性"],"a":[1],"e":"商业银行经营管理三原则：盈利性（追求利润）、流动性（随时应付提存与支付）、安全性（控制风险、稳健经营），三者此消彼长，需统筹平衡。题干描述的“随时变现应付提存”即流动性。利润最大化倾向会牺牲流动性与安全性，故监管要求（如流动性覆盖率）必不可少。","k":"商业银行经营管理原则"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"按融资期限划分，融资期限在一年以内的金融市场属于（　）。","o":["资本市场","货币市场","发行市场","外汇市场"],"a":[1],"e":"货币市场：期限一年以内，如同业拆借、票据贴现、短期国债（国库券）、大额可转让存单，功能是调剂短期资金余缺。资本市场：期限一年以上，如股票市场、中长期债券市场，功能是长期资金融通与资源配置。\n【分界线】一年，考试反复在“国库券＝货币市场工具”上设陷阱。","k":"金融市场的类型"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"multi","q":"金融风险的基本类型包括（　）。","o":["信用风险","市场风险","流动性风险","操作风险","经营杠杆风险"],"a":[0,1,2,3],"e":"金融风险四大基本类型：①信用风险——交易对手不履约（还不上钱）；②市场风险——利率、汇率、股价等市场价格波动带来损失；③流动性风险——想变现时变现不了或必须大幅折价；④操作风险——内部流程、人员、系统缺陷或外部事件造成损失（如违规操作、系统宕机）。经营杠杆是企业财务概念，不属于金融风险分类。\n【记忆钩子】“信、市、流、操”。","k":"金融风险的类型"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"一国的国际储备中，占比最高、最主要的组成部分通常是（　）。","o":["货币性黄金","外汇储备","在国际货币基金组织的储备头寸","特别提款权（SDR）"],"a":[1],"e":"国际储备四大构成：外汇储备、货币性黄金、IMF储备头寸、特别提款权（SDR）。其中外汇储备流动性最好、规模最大，是国际储备的主体。我国的外汇储备规模长期居世界第一。\n【联动考点】外汇储备的作用：弥补国际收支逆差、干预外汇市场稳定汇率、增强国际清偿力与信心。","k":"国际储备的构成"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"某小区居民收入数据中存在个别极端高收入者。若要更稳健地描述该组数据的一般（集中趋势）水平，宜采用的指标是（　）。","o":["均值","中位数","方差","标准差"],"a":[1],"e":"均值容易受极端值影响，“被富人拉高”；中位数按位置取值，不受极端值影响，是存在偏态或极端值时更稳健的集中趋势指标。方差、标准差属于离散程度（波动）指标，与题意不符。\n【记忆钩子】“有 outlier，看中位；对称干净，才用均值”。这也是“居民收入中位数”比“平均数”更常被引用的原因。","k":"集中趋势指标"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"要比较“身高（cm）”与“体重（kg）”两组计量单位不同、均值差异较大的数据的离散程度，应当采用的指标是（　）。","o":["极差","标准差","变异系数","四分位差"],"a":[2],"e":"变异系数＝标准差÷均值，是无量纲的相对离散指标，用于：①计量单位不同的数据之间比较；②均值相差悬殊的数据之间比较。标准差、极差、四分位差都带原始单位，直接比较没有意义。\n【典型坑】“身高的标准差5＞体重的标准差4，所以身高更分散”——错，单位不同不能比。","k":"离散程度指标与变异系数"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"multi","q":"下列抽样方法中，属于概率抽样的有（　）。","o":["简单随机抽样","分层抽样","整群抽样","判断抽样","方便抽样"],"a":[0,1,2],"e":"概率抽样的核心特征：每个单位有已知的、非零的入样概率，可计算抽样误差。常见方法：简单随机抽样、分层抽样、系统抽样、整群抽样、多阶段抽样。判断抽样、方便抽样（街头随手拦访）、自愿样本属于非概率抽样，无法推断总体精度。\n【判断标准】问一句：“入样靠不靠抽签（随机机制）？”","k":"概率抽样与非概率抽样"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"下列关于抽样误差的说法中，正确的是（　）。","o":["在其他条件相同时，样本单位数越多，抽样误差越小","在其他条件相同时，样本单位数越多，抽样误差越大","抽样误差可以完全消除","抽样误差是由于登记、计算错误造成的"],"a":[0],"e":"抽样误差随样本量增大而减小（与样本量的平方根成反比），与总体变异程度成正比，并受抽样组织方式影响。C 错：抽样误差是随机抽样固有的代表性误差，只能控制不能完全消除；D 错：登记性误差（调查员抄错、受访者乱答）属于另一类误差，与抽样误差不同。\n【记忆钩子】“样本越大越像总体”。","k":"抽样误差及其影响因素"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"两个变量的相关系数 r＝−0.92，说明两变量之间（　）。","o":["高度正相关","高度负相关","低度负相关","不存在相关关系"],"a":[1],"e":"相关系数取值范围 [−1, 1]：正负号表示方向，绝对值表示强度，|r|≥0.8 通常视为高度相关。r＝−0.92 即两变量变动方向相反且关系紧密（如：产品价格越高、需求量越小）。\n【注意】相关不等于因果；r 只度量线性关系，r＝0 不代表两变量没有任何关系（可能是非线性）。","k":"相关系数"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"定基发展速度等于相应时期内各环比发展速度的（　）。","o":["连乘积","算术和","算术平均数","加权平均数"],"a":[0],"e":"定基发展速度（报告期水平÷某一固定基期水平）＝相应各期环比发展速度（报告期÷上期）的连乘积。对应地，两个相邻定基发展速度之商＝环比发展速度。增长速度＝发展速度−1（增长100%即发展速度200%）。\n【数字例】增长10%再增长20%：定基发展速度＝1.1×1.2＝1.32，即累计增长32%，不是30%。","k":"时间序列的速度分析"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"multi","q":"下列各项中，属于会计基本前提（会计假设）的有（　）。","o":["会计主体","持续经营","会计分期","货币计量","权责发生制"],"a":[0,1,2,3],"e":"会计四大基本前提：会计主体（为谁记账，划清空间界限）、持续经营（假设企业不会破产清算）、会计分期（把经营期间切成年度、季度、月度）、货币计量（用货币统一计量）。权责发生制不是假设，而是会计确认、计量和报告的基础。\n【高频陷阱】E 是最常被塞进选项的干扰项。","k":"会计基本前提"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"multi","q":"下列会计要素中，反映企业财务状况（资产负债表要素）的有（　）。","o":["资产","负债","所有者权益","收入","利润"],"a":[0,1,2],"e":"六大会计要素分两组：反映财务状况（时点、静态、资产负债表）——资产、负债、所有者权益；反映经营成果（时期、动态、利润表）——收入、费用、利润。两组之间以“收入−费用＝利润”和“资产＝负债＋所有者权益”两大会计等式相联结。","k":"会计要素的分类"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"某企业当年12月一次性预收次年全年场地租金120万元。按照权责发生制，该企业当年应确认的租金收入为（　）。","o":["0万元","10万元","60万元","120万元"],"a":[0],"e":"权责发生制按收入的权利、费用的义务“归属期”确认，而不是按款项收付确认。租金对应的服务期间在次年，当年只是“预收账款”（负债），当年确认收入为0。收付实现制才按实际收到现金的120万确认。\n【判断口诀】“权责看归属，现金看收付”。","k":"权责发生制与收付实现制"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"借贷记账法下，“借方”登记增加额的账户是（　）。","o":["资产类账户","负债类账户","所有者权益类账户","收入类账户"],"a":[0],"e":"记账规则“资产、费用（成本）借增贷减；负债、所有者权益、收入贷增借减”。即借方记增加的是资产类和费用成本类账户；负债、权益、收入类账户增加记在贷方。会计恒等式“资产＝负债＋所有者权益”决定了等式两边增减登记方向相反。\n【记忆钩子】“资产费用借加，负债权益收入贷加”。","k":"借贷记账法","fig":"taccount"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"反映企业某一特定日期（如12月31日）财务状况的会计报表是（　）。","o":["利润表","资产负债表","现金流量表","利润分配表"],"a":[1],"e":"资产负债表是“时点表”（像一张照片），反映特定日期资产、负债、所有者权益的存量；利润表、现金流量表是“时期表”（像一段录像），反映一段期间的经营成果和现金流量。\n【结构】资产负债表按流动性排列：左资产右负债与权益；利润表多步式：营业利润→利润总额→净利润。","k":"资产负债表"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"计算速动比率时，速动资产是指流动资产扣除（　）后的余额。","o":["存货","货币资金","应收账款","固定资产"],"a":[0],"e":"速动比率＝速动资产÷流动负债，速动资产＝流动资产−存货（−预付账款等变现能力差的项目）。存货是流动资产中变现最慢、最容易贬值的项目，剔除后更能反映短期偿债的“即时”能力。一般认为速动比率约等于1较为合适（流动比率约为2）。\n【联动】固定资产本身就不属于流动资产，故D是干扰项。","k":"偿债能力比率"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"我国政府会计实行“双功能、双基础、双报告”体系，其中实行收付实现制核算基础的是（　）。","o":["财务会计","预算会计","成本会计","管理会计"],"a":[1],"e":"政府会计“双体系”：财务会计——权责发生制，编制财务报告（反映运行成本、资产负债状况）；预算会计——收付实现制（国务院另有规定除外），编制决算报告（反映预算收支执行）。同一个系统里两套账并行、相互衔接。\n【记忆钩子】“财务要权责，预算看收付”。","k":"政府会计标准体系"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"下列各项中，属于用益物权的是（　）。","o":["建设用地使用权","抵押权","质权","留置权"],"a":[0],"e":"物权三分：①所有权（占有、使用、收益、处分四项权能）；②用益物权——对他人的不动产使用、收益，包括土地承包经营权、建设用地使用权、宅基地使用权、地役权、居住权；③担保物权——抵押权、质权、留置权，作用是担保债务履行、优先受偿。\n【记忆钩子】“担保三兄弟：抵、质、留；剩下的用益都是‘用’字辈”。","k":"物权的种类"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"根据民法典关于善意取得的规定，受让人取得不动产或动产所有权的条件不包括（　）。","o":["受让人受让时是善意的","以合理的价格转让","转让的不动产依法应当登记的已经登记，动产已经交付","受让人无偿取得该财产"],"a":[3],"e":"善意取得三要件：①受让人受让时善意（不知且不应知转让人无处分权）；②以合理价格转让——有偿性是必要条件，无偿取得不适用善意取得；③已完成登记（不动产）或交付（动产）。原所有权人的损失只能向无处分权人追偿。\n【立法目的】保护交易安全与信赖，牺牲原所有权人的静态安全换取动态安全。","k":"善意取得"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"根据民法典的规定，要约生效的时间是（　）。","o":["要约人发出要约时","要约到达受要约人时","受要约人作出承诺时","双方签字盖章时"],"a":[1],"e":"要约是希望与他人订立合同的意思表示，自到达受要约人时生效（到达主义）。承诺生效时合同成立，承诺同样自到达要约人时生效。注意区分三个时点：要约生效（到达）→承诺生效（到达，合同成立）→依法需批准的合同自批准时生效。","k":"合同的订立（要约与承诺）"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"一方以欺诈手段，使对方在违背真实意思的情况下订立合同，受欺诈方有权请求（　）。","o":["人民法院或者仲裁机构予以撤销","自行宣布合同无效","直接扣押欺诈方财产","公安机关追究欺诈方刑事责任"],"a":[0],"e":"可撤销的民事法律行为包括：重大误解、欺诈（含第三人欺诈且对方知情）、胁迫、显失公平。撤销权必须通过人民法院或仲裁机构行使，撤销后合同自始没有法律约束力。注意新规：欺诈、胁迫所签合同一般属“可撤销”而非“无效”（仅损害国家利益的无效这一旧规已调整）。\n【除斥期间】自知道或应当知道撤销事由之日起1年内行使。","k":"可撤销合同"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"multi","q":"当事人一方不履行合同义务或者履行不符合约定的，依法承担违约责任的方式包括（　）。","o":["继续履行","采取补救措施","赔偿损失","支付违约金","行政拘留"],"a":[0,1,2,3],"e":"违约责任的承担方式：继续履行、采取补救措施（修理、重作、更换、退货、减少价款等）、赔偿损失、支付违约金、定金责任（双倍返还或不予返还）。行政拘留是行政处罚，与民事违约责任性质不同。\n【联动考点】定金不得超过主合同标的额的20%；违约金过分高于损失的可请求法院适当减少。","k":"违约责任"},{"s":"jc","p":"法律","c":36,"cn":"公司法律制度","t":"single","q":"根据2024年7月1日起施行的新《公司法》，有限责任公司全体股东认缴的出资额应当自公司成立之日起（　）内缴足。","o":["一年","三年","五年","十年"],"a":[2],"e":"新《公司法》将认缴制的“无期限”改为“五年实缴期限”：有限责任公司股东认缴的出资额须在公司成立之日起五年内缴足，股份有限公司发起人应在成立前全额缴纳。这是对长期以来“认缴天价、永不到账”乱象的制度纠偏。\n【时效提醒】公司法近年修订幅度大，数字类考点务必以当年教材和最新法条为准。","k":"公司法律制度（新公司法）"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"根据专利法，发明专利权的保护期限自申请日起计算为（　）。","o":["10年","15年","20年","25年"],"a":[2],"e":"三种专利的保护期均自申请日起算：发明20年，实用新型10年，外观设计15年（2021年修改后的专利法将外观设计从10年延长至15年）。保护期届满后技术进入公有领域。\n【记忆钩子】“发明二十、实用十、外观十五”（外观与实用新型别记反）。","k":"专利法律制度"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"某公司在销售的商品中掺杂掺假、以假充真。该行为主要侵犯了消费者的（　）。","o":["安全保障权","知情权","自主选择权","结社权"],"a":[1],"e":"消费者九项权利：安全保障、知情、自主选择、公平交易、求偿、结社、获得知识、人格尊严（含个人信息保护）、监督。掺杂掺假、以次充好使消费者无法获知商品的真实情况，侵犯的是知情权；若商品缺陷危及人身安全才涉及安全保障权。\n【答题技巧】先分清“信息被蒙蔽（知情）”与“人身财产受威胁（安全）”。","k":"消费者权益保护法律制度"},{"s":"jc","p":"法律","c":37,"cn":"其他法律制度","t":"single","q":"某公司与劳动者订立了期限为3年的劳动合同，其约定的试用期最长不得超过（　）。","o":["1个月","2个月","3个月","6个月"],"a":[3],"e":"试用期上限规则：合同期3个月以上不满1年的，试用期≤1个月；1年以上不满3年的，≤2个月；3年以上固定期限和无固定期限的，≤6个月。同一用人单位与同一劳动者只能约定一次试用期；以完成一定工作任务为期限或期限不满3个月的，不得约定试用期。\n【记忆钩子】“一年以内一个月，一到三年两个月，三年以上封顶六个月”。","k":"劳动合同法律制度"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"政府对某些商品规定低于均衡价格的最高限价（限价）后，市场通常会出现的结果是（　）。","o":["供不应求，出现短缺、排队购买甚至黑市交易","供过于求，出现商品过剩","市场自动恢复到均衡状态","需求曲线整体向右移动"],"a":[0],"e":"最高限价低于均衡价格：在此价格上需求量＞供给量，产生短缺，常见排队、配给、黑市加价等现象。最高限价多用于保护买方（如战时物价管制）。\n【对比考点】保护价格（支持价格）高于均衡价格：供过于求出现过剩，政府通常收购储备——典型如粮食保护价。","k":"均衡价格模型的应用（最高限价与保护价格）","fig":"price-control"},{"s":"jc","p":"经济学基础","c":1,"cn":"市场需求、供给与均衡价格","t":"single","q":"政府为扶持农业，对粮食规定高于均衡价格的保护价格。为维持该价格，政府通常需要（　）。","o":["向消费者发放购物补贴","收购市场上过剩的粮食建立储备","向市场投放储备粮平抑价格","对粮食生产征收特别税"],"a":[1],"e":"保护价格高于均衡价格→供给量＞需求量→市场过剩，过剩部分由政府收购形成储备，才能把价格“托”在保护价水平。投放储备粮是压低价格的措施，与保护价方向相反。\n【记忆钩子】“限价防涨价要收购，最高价压涨价管短缺”。对照记：最高限价→短缺；保护价格→过剩。","k":"均衡价格模型的应用（保护价格）","fig":"price-control"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"消费者连续喝奶茶，第3杯带来的满足感的增加量明显小于第2杯。这一现象反映的规律是（　）。","o":["边际效用递减","边际效用递增","总效用递减","机会成本递减"],"a":[0],"e":"边际效用递减规律：随着消费数量连续增加，每增加一单位消费带来的效用增量（边际效用）是递减的。注意区分：只要边际效用＞0，总效用仍在增加（只是增加得越来越慢）；边际效用＝0 时总效用最大；边际效用＜0 时总效用才下降。所以 C 错——“满足感的增加量变小”不代表“满足感本身变小”。","k":"边际效用递减规律","fig":"tu-mu"},{"s":"jc","p":"经济学基础","c":2,"cn":"消费者行为分析","t":"single","q":"正常商品的价格下降后，消费者增加对该商品的购买。从效应分解看，其原因在于（　）。","o":["替代效应使购买量增加，收入效应使购买量减少","替代效应和收入效应都使购买量增加","替代效应使购买量减少，收入效应使购买量增加","替代效应和收入效应都使购买量减少"],"a":[1],"e":"价格下降的两种效应：①替代效应——该商品相对变便宜，消费者用它替代其他商品，购买量增加；②收入效应——同样收入购买力增强（实际收入上升），正常商品的购买量随之增加。对正常商品，两种效应方向一致，需求曲线向右下方倾斜。低档商品（如劣质品）两效应方向相反，特殊情况下才可能出现需求曲线向右上方倾斜（吉芬商品）。","k":"替代效应与收入效应"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"微观经济学中所说的“长期”，是指（　）。","o":["时间长度超过一年的时期","全部生产要素都可以调整的时期","至少有一种生产要素固定不变的时期","企业已经实现利润最大化的时期"],"a":[1],"e":"长期与短期的划分标准不是日历时间，而是要素能否全部调整：短期——至少有一种要素（通常是厂房、设备等固定要素）数量不变；长期——所有要素都可调整，企业可以调整生产规模甚至进入、退出行业。因此“一年以上”是常见误读，有的行业长期可能只要几个月，有的要数年。","k":"短期与长期的划分"},{"s":"jc","p":"经济学基础","c":3,"cn":"生产和成本理论","t":"single","q":"某企业将全部生产要素投入增加一倍，产量增加超过一倍。该企业处于（　）。","o":["规模报酬递增","规模报酬递减","规模报酬不变","边际报酬递减"],"a":[0],"e":"规模报酬研究“所有要素同比例增加”时产量的变化：产出增幅＞投入增幅为递增（往往源于专业化分工、大型设备、管理协同），＝为不变，＜为递减。注意与边际报酬递减区分：边际报酬递减针对“其他要素不变、只增加一种要素”的短期情形。\n【对应关系】同比例增加所有要素→规模报酬；只增加一种要素→边际产量。","k":"规模报酬"},{"s":"jc","p":"经济学基础","c":4,"cn":"市场结构理论","t":"single","q":"完全垄断企业面对向右下方倾斜的需求曲线，其边际收益与价格的关系是（　）。","o":["边际收益小于价格","边际收益等于价格","边际收益大于价格","边际收益与价格无关"],"a":[0],"e":"垄断企业多卖一单位必须降价，而且降价适用于所有产品，故新增一单位带来的收益增量（MR）小于新价格本身，即 MR＜P。而完全竞争企业是价格接受者，P＝MR——这是两类市场最重要的区别之一。垄断企业按 MR＝MC 确定产量，再按需求曲线定价，价格高于边际成本。","k":"垄断企业的收益曲线"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"在完全竞争的生产要素市场中，企业为利润最大化而使用劳动要素的原则是：劳动的（　）。","o":["边际产量等于平均产量","边际产品价值等于工资率（劳动价格）","边际产品价值等于产品价格","总产量达到最大"],"a":[1],"e":"企业使用要素的边际收益是“边际产品价值”VMP＝P×边际产量MP，边际成本是要素价格（劳动为工资率W）。多雇一人增加的产值＞工资就继续雇，＜就减少雇，均衡在 VMP＝W。选项C混淆了 VMP 里的产品价格与要素价格；A、D 是产量概念，与要素使用决策无关。","k":"生产者使用生产要素的原则"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"某企业产品价格为10元/件，当前雇用的最后一名工人的边际产量为5件/天。该工人为企业带来的边际产品价值为（　）。","o":["50元/天","5元/天","10元/天","2元/天"],"a":[0],"e":"边际产品价值 VMP＝产品价格P×边际产量MP＝10×5＝50（元/天）。若该工人的日工资低于50元，增雇可增利；高于50元则应减雇。\n【判断要点】VMP 一定是“价格×边际产量”，与工资、平均产量无关。工资率是使用要素的成本，不进 VMP 的计算。","k":"边际产品价值（VMP）"},{"s":"jc","p":"经济学基础","c":5,"cn":"生产要素市场理论","t":"single","q":"当工资率上升到较高水平后，劳动者反而可能减少劳动供给、增加闲暇。此时劳动供给曲线（　）。","o":["向后弯曲","变成水平线","变成垂直线","向上倾斜得更陡"],"a":[0],"e":"工资上升有两种效应：替代效应——闲暇的机会成本变高，人们多工作；收入效应——收入高了，人们想多买“闲暇”这种奢侈品。工资较低时替代效应占优（供给曲线向右上），工资高到一定程度后收入效应超过替代效应，劳动供给量反而减少，供给曲线向后弯曲。\n【记忆钩子】“钱少拼命干，钱多想躺平”。","k":"劳动供给曲线","fig":"labor-supply"},{"s":"jc","p":"经济学基础","c":6,"cn":"市场失灵和政府的干预","t":"single","q":"某化工厂向河流排污却未支付治理费用。关于该负外部性的说法，正确的是（　）。","o":["工厂的私人成本低于社会成本，产量高于社会最优水平","工厂的私人成本高于社会成本，产量低于社会最优水平","市场会自动把外部成本内部化，无需干预","该行为只影响工厂自身收益，不影响他人"],"a":[0],"e":"负外部性＝生产的真实代价没有全部计入私人成本：私人成本＜社会成本，企业按私人成本决策会“生产过多”，超过社会最优产量。纠正手段：征收庇古税（按外部成本征税）、排污收费、排污权交易、规制标准等；科斯定理提示产权清晰且交易成本低时也可通过谈判解决。\n【对称记忆】正外部性（如接种疫苗、教育）则“生产过少”，用补贴纠正。","k":"外部性与政府干预"},{"s":"jc","p":"经济学基础","c":7,"cn":"国民收入核算和简单的宏观经济模型","t":"single","q":"某经济社会边际消费倾向为0.8，政府投资增加100亿元。在其他条件不变时，国民收入将增加约（　）。","o":["80亿元","125亿元","500亿元","800亿元"],"a":[2],"e":"投资乘数 k＝1/(1−边际消费倾向)＝1/(1−0.8)＝5；国民收入增加＝100×5＝500亿元。乘数机制：一笔投资先变成收入，再按边际消费倾向不断被消费、再变成别人的收入……循环放大。\n【联动】边际储蓄倾向＝1−0.8＝0.2，乘数也等于1/边际储蓄倾向。MPC越大，乘数越大。","k":"投资乘数"},{"s":"jc","p":"经济学基础","c":8,"cn":"经济增长和经济发展理论","t":"single","q":"一个完整的经济周期依次经历的四个阶段是（　）。","o":["繁荣、衰退、萧条、复苏","复苏、繁荣、萧条、衰退","繁荣、萧条、衰退、复苏","扩张、复苏、收缩、衰退"],"a":[0],"e":"经济周期四阶段（自波峰到波谷再到波峰）：繁荣（扩张到顶）→衰退（活动下滑）→萧条（谷底徘徊）→复苏（重新回升）。也可简化为扩张与收缩两大阶段，谷底与波峰是转折点。\n【周期长度考点】短周期（基钦，约3~4年）、中周期（朱格拉，约8年）、长周期（康德拉季耶夫，约50~60年）。","k":"经济周期的阶段","fig":"cycle"},{"s":"jc","p":"经济学基础","c":9,"cn":"价格总水平和就业、失业","t":"single","q":"未预期的通货膨胀引起的收入再分配效应是（　）。","o":["有利于债务人，不利于债权人","有利于债权人，不利于债务人","对债权人和债务人都没有影响","有利于靠固定工资生活的群体"],"a":[0],"e":"通胀使货币的实际购买力下降：债务人还的钱“变毛了”，实际债务负担减轻，受益；债权人收回的钱缩水，受损。同理，通胀不利于靠固定收入（工资、退休金）生活的人，有利于持有涨价资产（房产、股票）的人。政府若大量举债，温和通胀还能实际减轻政府债务——这也是有些国家容忍通胀的原因之一。","k":"通货膨胀的效应"},{"s":"jc","p":"经济学基础","c":10,"cn":"国际贸易理论和政策","t":"single","q":"某国规定每年进口某种汽车的数量不得超过10万辆。这种贸易限制措施属于（　）。","o":["关税壁垒","进口配额（非关税壁垒）","出口补贴","外汇倾销"],"a":[1],"e":"对进口数量直接设限是典型的进口配额，属于非关税壁垒。非关税壁垒还包括进口许可证制、技术性贸易壁垒（标准、认证）、卫生与植物卫生措施、自动出口限制等。关税壁垒是“用价格（征税）限进口”，配额是“用数量限进口”，后者对数量控制更直接、更刚性。","k":"非关税壁垒"},{"s":"jc","p":"财政","c":11,"cn":"公共物品与财政职能","t":"single","q":"关于公共物品的供给，下列说法正确的是（　）。","o":["公共物品必须由政府直接生产","政府提供不等于政府直接生产，可以采取合同外包等方式","公共物品只能由市场提供","公共物品的供给不需要成本补偿"],"a":[1],"e":"公共物品“提供主体”与“生产方式”是两回事：提供者通常是政府（因为免费搭车导致市场供给不足），但生产可以交给市场——合同外包、政府购买服务、特许经营（BOT）等。“政府提供”指政府出资并承担最终责任，生产环节完全可以引入竞争。\n【易错点】A 把“提供”与“生产”混为一谈，是本考点最经典的干扰项。","k":"公共物品的提供与生产"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"下列财政支出项目中，属于转移性支出的是（　）。","o":["政府投资修建高速公路","行政管理费","财政补贴","公务员工资"],"a":[2],"e":"按是否获得等价商品和服务分：①购买性支出——政府花钱“买东西”，一手钱一手货，如政府投资、行政管理费、公务员工资，对生产和就业影响直接；②转移性支出——钱无偿单方面转出、不取得对价，如财政补贴、社会保障支出（抚恤、救济）、债务利息，主要体现收入分配职能。\n【判断口诀】“有没有拿到货”：拿到货是购买，白给钱是转移。","k":"财政支出的分类（购买性支出与转移性支出）"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"single","q":"衡量一国政府活动规模、反映财政支出相对水平的常用指标是（　）。","o":["财政支出总额","财政支出占GDP的比重","财政收入总额","财政赤字额"],"a":[1],"e":"财政支出占GDP的比重是相对指标，剔除了经济体量差异，便于纵向比较和国际比较，是衡量政府活动规模最常用的指标。财政支出总额是绝对指标，只看总量不看经济体量，说服力有限。\n【趋势考点】随着经济发展和政府职能扩展，各国财政支出占GDP比重总体呈上升趋势（瓦格纳法则）。","k":"财政支出规模"},{"s":"jc","p":"财政","c":12,"cn":"财政支出","t":"multi","q":"下列关于财政支出的说法中，正确的有（　）。","o":["购买性支出对生产和就业的影响直接","转移性支出主要体现政府的收入分配职能","购买性支出遵循等价交换原则","转移性支出直接形成对商品和服务的购买","转移性支出包括财政补贴和债务利息支出"],"a":[0,1,2,4],"e":"购买性支出：政府以购买者身份按等价交换取得商品和服务，直接构成社会总需求的一部分，直接刺激生产与就业（A、C 正确）。转移性支出：资金无偿转移、不换回对价，通过改变收入分配格局间接影响需求，体现分配职能（B 正确），内容包括补贴、社保、利息等（E 正确）。D 颠倒了性质——直接形成购买的是购买性支出。","k":"财政支出的分类"},{"s":"jc","p":"财政","c":13,"cn":"财政收入","t":"single","q":"我国财政收入最主要的形式是（　）。","o":["税收","政府收费","国有资产收益","罚没收入"],"a":[0],"e":"税收占我国财政收入的绝大部分（通常在85%~90%），是最稳定、最规范、覆盖面最广的收入形式。收费、罚没等具有一次性、分散性，国有资产收益随经营波动，国债是有偿的临时性收入，都不能挑大梁。\n【判断标准】凡问“最主要、最重要、主体”，财政收入的答案基本都是税收。","k":"财政收入的形式"},{"s":"jc","p":"财政","c":14,"cn":"税收制度","t":"single","q":"我国个人所得税综合所得适用的税率形式是（　）。","o":["比例税率","超额累进税率","全额累进税率","定额税率"],"a":[1],"e":"个人所得税综合所得按3%~45%的超额累进税率计征：只对“超过上一级次的部分”适用更高税率，税负随收入平滑上升。比例税率（如增值税13%）、定额税率（如车船税按辆）对不同收入者税负不随收入累进。全额累进在临界点附近税负跳升严重，各国基本不用。\n【记忆分组】比例：增值税、企业所得税（25%标准税率）；超额累进：个税综合所得；定额：车船税、部分资源税。","k":"税率的类型"},{"s":"jc","p":"财政","c":15,"cn":"政府预算","t":"single","q":"政府预算草案必须提交国家权力机关审查批准后方可执行。这体现的政府预算原则是（　）。","o":["完整性原则","统一性原则","合法性原则","保密性原则"],"a":[2],"e":"合法性原则：政府预算的编制、执行和决算都要经过法定程序审查批准，受立法机关约束——本质是“政府的钱袋子要经人民同意”。完整性：全部收支都进预算，不设账外账；统一性：统一预算科目、统一口径；公开性：向社会公开，接受监督。保密性与预算的公开精神相悖。","k":"政府预算的原则"},{"s":"jc","p":"财政","c":16,"cn":"财政管理体制","t":"single","q":"中央对地方实施一般性转移支付的主要目的是（　）。","o":["指定地方资金的具体用途","均衡地区间基本财力、推进基本公共服务均等化","提高中央财政收入占比","替代地方税体系"],"a":[1],"e":"政府间转移支付解决的是“财力与事权不匹配、地区间财力差距”问题。一般性转移支付（均衡性转移支付为主体）不指定用途，由地方统筹用于保基本民生、保工资、保运转，目标是缩小地区财力差距、实现基本公共服务均等化；专项转移支付才“戴帽”指定用途，且不得挪用。\n【对比记忆】“一般性给钱随便花（均衡均等），专项给钱指定花”。","k":"政府间转移支付"},{"s":"jc","p":"财政","c":17,"cn":"财政政策","t":"single","q":"经济过热、通货膨胀压力加大时，政府适宜采取的财政政策是（　）。","o":["增加税收、压缩财政支出","减少税收、扩大财政支出","降低法定存款准备金率","扩大货币供应量"],"a":[0],"e":"过热期总需求过旺，应实行紧缩性（稳健从紧）财政政策：增税压低私人可支配收入、减支直接压缩政府需求，给经济“降温”。萧条期则相反（减税扩支）。C、D 是货币政策工具，与财政政策分属两套工具箱——考题常拿货币工具冒充财政工具。\n【搭配口诀】“热了收（紧缩财政），冷了放（扩张财政）；货币政策管水量，财政政策管花销”。","k":"财政政策的类型与运用"},{"s":"jc","p":"货币与金融","c":18,"cn":"货币供求与货币均衡","t":"single","q":"我国货币层次划分中，M0 是指（　）。","o":["流通中现金","单位活期存款","居民储蓄存款","单位定期存款"],"a":[0],"e":"M0＝流通中现金（银行体系以外的现金），流动性最强。M1＝M0＋单位活期存款，是狭义货币，反映企业资金松紧；M2＝M1＋准货币（单位定期存款、居民储蓄存款等），是广义货币，通常作为货币政策监测的主要指标。\n【记忆钩子】“M0揣兜里，M1进单位，M2存银行”——流动性逐层递减、范围逐层扩大。","k":"货币供给层次"},{"s":"jc","p":"货币与金融","c":19,"cn":"中央银行与货币政策","t":"single","q":"中央银行提高法定存款准备金率，将直接导致（　）。","o":["商业银行可贷资金减少，货币供应量收缩","商业银行可贷资金增加，货币供应量扩张","基础货币投放增加","企业融资成本立即下降"],"a":[0],"e":"法定存款准备金率提高→每吸收一笔存款要冻结更多准备金→银行体系信用创造能力（货币乘数）下降→可贷资金减少、货币供应量收缩、市场利率趋于上行。它是“三大法宝”中威力最大、通常不宜频繁动用的工具。C 方向反了——这不是投放基础货币的操作。","k":"法定存款准备金率政策"},{"s":"jc","p":"货币与金融","c":20,"cn":"商业银行与金融市场","t":"single","q":"下列融资活动中，属于直接融资的是（　）。","o":["向银行申请贷款","发行企业债券","办理银行承兑汇票贴现","申请融资租赁"],"a":[1],"e":"直接融资：资金供需双方直接对接，不经银行“转手”，典型是发行股票、债券。间接融资：资金先存入银行等金融中介，再由中介贷出——银行贷款、票据贴现、融资租赁都以中介机构为依托，属于间接融资。判别标志：钱是从“最终出资人”手里直接到“最终用钱人”手里，还是隔了一层中介的资产负债表。","k":"直接融资与间接融资"},{"s":"jc","p":"货币与金融","c":21,"cn":"金融风险与金融监管","t":"single","q":"根据巴塞尔协议确立的国际监管标准，商业银行的资本充足率应不低于（　）。","o":["4%","8%","15%","20%"],"a":[1],"e":"巴塞尔协议规定商业银行资本充足率（资本与风险加权资产之比）不得低于8%，核心资本充足率不低于4%；巴塞尔协议Ⅲ在此基础上增加了储备资本缓冲等更严要求。资本充足率的本质：用自有资本吸收损失，保护存款人和金融体系稳定——资本是“防波堤”，不能太薄。\n【联动】我国以立法形式引入存款保险制度（限额偿付），与资本监管共同构成金融安全网。","k":"巴塞尔协议与资本充足率"},{"s":"jc","p":"货币与金融","c":22,"cn":"对外金融关系与政策","t":"single","q":"我国现行的人民币汇率制度属于（　）。","o":["固定汇率制度","自由浮动汇率制度","以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度","联系汇率制度"],"a":[2],"e":"人民币汇率制度的官方表述是完整的“一句话考点”：以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。它既不是盯死一种货币的固定汇率（如联系汇率制），也不是完全放任的自由浮动——央行可在必要时干预，保持汇率基本稳定。\n【答题技巧】选项里看到“有管理的浮动”基本就是它；看到“盯住美元”“联系汇率”都是干扰。","k":"人民币汇率制度"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"“统计”一词通常包含三种涵义，它们是（　）。","o":["统计工作、统计数据、统计学","统计调查、统计整理、统计分析","总体、样本、标志","普查、抽样调查、重点调查"],"a":[0],"e":"统计的三种涵义：①统计工作——收集、整理、分析数据的实践活动；②统计数据——工作活动的成果（数字与资料）；③统计学——总结实践经验形成的理论与方法论科学。三者是“活动—成果—理论”的关系。\n【辨析】B 是统计工作的三个环节；C 是统计学基本概念；D 是统计调查的组织方式，都不是“统计”一词的涵义本身。","k":"统计的涵义"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"single","q":"对产品按“一等品、二等品、三等品”分等级登记。这里的“产品等级”属于（　）。","o":["分类变量","顺序变量","数值变量","随机变量"],"a":[1],"e":"变量按取值性质分：分类变量——类别之间无高低次序（性别、行业）；顺序变量——类别有等级次序但不能作数量运算（产品等级、满意度、学历层次）；数值变量——取值是数字，可加减运算（产量、收入）。\n【判断口诀】“能分不能排是分类，能排不能算是顺序，能算才是数值”。","k":"变量的类型"},{"s":"jc","p":"统计","c":23,"cn":"统计与数据科学","t":"multi","q":"下列关于大数据特征的说法中，正确的有（　）。","o":["数据体量巨大（Volume）","数据类型多样（Variety）","处理速度快、时效性强（Velocity）","价值密度高，每条数据都蕴含大量信息（Value）","大数据分析更关注相关关系而非仅仅因果关系"],"a":[0,1,2,4],"e":"大数据“4V”特征：Volume大量、Variety多样、Velocity高速，以及 Value——价值密度低（海量数据中有用信息相对稀疏，需要挖掘提取），D 把“密度低”说成“密度高”，是最常见的反向陷阱。E 正确：大数据思维的重要转变是从追求精确的因果关系转向接受混杂、关注相关关系。\n【记忆钩子】“量大、样多、跑得快，价值像沙里淘金”。","k":"大数据的特征"},{"s":"jc","p":"统计","c":24,"cn":"描述统计","t":"single","q":"某组数据的均值明显大于中位数，则该组数据的分布形态为（　）。","o":["左偏（负偏）分布","右偏（正偏）分布","对称分布","均匀分布"],"a":[1],"e":"存在少数极端大值时，均值被拉高而中位数不受影响，均值＞中位数，分布呈右偏（长尾拖向右侧），如收入分布。反之均值＜中位数为左偏。对称分布下两者重合。\n【记忆钩子】“尾巴甩向哪边就往哪边偏”——大尾巴在右，均值跟着尾巴跑。","k":"分布形态（偏态）"},{"s":"jc","p":"统计","c":25,"cn":"抽样调查","t":"single","q":"与简单随机抽样相比，分层抽样的主要优点是（　）。","o":["无需任何抽样框","样本代表性更好，估计精度更高，还可以对各层分别进行估计","调查成本一定更高","样本量一定更小"],"a":[1],"e":"分层抽样先把总体分成“层内差异小、层间差异大”的若干层，再在每层内抽样：一是样本均匀撒遍各层，代表性更好、抽样误差更小；二是能对每一层单独估计（如分行业、分地区）。C、D 的“一定”都不成立——分层还可能降低成本，样本量取决于设计而非方法本身。\n【对比】整群抽样是“群间差异小、群内像总体”，抽几个整群调查，省钱但误差偏大——两者方向正好相反，最爱对着考。","k":"分层抽样"},{"s":"jc","p":"统计","c":26,"cn":"回归分析","t":"single","q":"一元线性回归模型的判定系数 R²＝0.85，其含义是（　）。","o":["自变量每变动一个单位，因变量平均变动0.85个单位","因变量变差中约有85%可以由自变量（回归方程）解释","两变量的相关系数为0.85的85%","回归预测的误差为15%的概率是85%"],"a":[1],"e":"判定系数 R² 度量拟合优度：取值[0,1]，表示因变量总变差中被回归方程解释的比例。R²＝0.85 即85%的变差由x解释，其余15%来自其他因素与随机扰动。注意与回归系数区分：回归系数才描述“x每变1单位，y平均变多少”（A 是回归系数的含义）。R² 越接近1，拟合越好。","k":"判定系数（拟合优度）","fig":"scatter"},{"s":"jc","p":"统计","c":27,"cn":"时间序列分析","t":"single","q":"某品牌月饼销量每年中秋节前大幅上升、节后回落，年复一年呈规律性变化。这种波动属于时间序列构成成分中的（　）。","o":["长期趋势","季节变动","循环波动","不规则波动"],"a":[1],"e":"时间序列四大构成成分：长期趋势（持续的方向性变化）、季节变动（一年内随季节/节日的固定周期重复，月份数据最常见）、循环波动（非固定周期的涨落，如经济周期，周期常在一年以上）、不规则波动（偶然因素）。月饼、空调、羽绒服销量都是教科书级的季节变动例子。\n【判别口诀】“一年内重复是季节，跨年大起大落是循环”。","k":"时间序列的构成成分","fig":"trend"},{"s":"jc","p":"会计","c":28,"cn":"会计概论","t":"single","q":"企业以融资租赁方式租入的设备，虽然法律所有权属于出租人，但会计上作为企业自有固定资产核算。这体现的会计信息质量要求是（　）。","o":["谨慎性","实质重于形式","重要性","及时性"],"a":[1],"e":"实质重于形式：按交易或事项的经济实质进行会计确认、计量和报告，而不仅以其法律形式为依据。融资租赁承租方实质上控制了设备、享有收益并承担风险，故视同自有资产。谨慎性是“不高估资产收益、不低估负债费用”（如计提减值准备）；重要性抓大放小；及时性不得提前或延后。","k":"会计信息质量要求（实质重于形式）"},{"s":"jc","p":"会计","c":29,"cn":"会计循环","t":"single","q":"会计循环的基本环节按正确顺序排列为（　）。","o":["填制和审核会计凭证→登记会计账簿→编制财务会计报告","登记会计账簿→填制会计凭证→编制财务会计报告","编制财务会计报告→填制会计凭证→登记会计账簿","填制和审核会计凭证→编制财务会计报告→登记会计账簿"],"a":[0],"e":"会计循环：经济业务发生→填制并审核会计凭证（把业务变成会计语言）→据此登记账簿（分类、汇总）→期末对账结账→编制财务会计报告（输出信息）。凭证是“入口”，账簿是“加工”，报表是“出口”，顺序不能乱。\n【记忆钩子】“先凭证、后账簿、再报表”。","k":"会计循环的环节"},{"s":"jc","p":"会计","c":30,"cn":"会计报表","t":"single","q":"企业购买生产设备支付的现金，在现金流量表中应计入（　）。","o":["经营活动现金流量","投资活动现金流量","筹资活动现金流量","汇率变动对现金的影响"],"a":[1],"e":"现金流量表把现金收支分为三类：经营活动（日常产供销，如销售收款、采购付款、付工资）、投资活动（长期资产购建与处置、对外投资及其收回——买设备在此）、筹资活动（吸收投资、借款、还款、分红）。判断口诀：跟“日常经营的钱”走是经营，跟“买机器、做投资”走是投资，跟“找钱、还钱”走是筹资。","k":"现金流量表的分类"},{"s":"jc","p":"会计","c":31,"cn":"会计报表分析","t":"single","q":"下列财务指标中，最能反映企业为股东投入资本创造收益能力（盈利能力核心指标）的是（　）。","o":["流动比率","净资产收益率","资产负债率","存货周转率"],"a":[1],"e":"净资产收益率（ROE）＝净利润÷平均净资产，直接回答“股东的钱一年赚了百分之几”，是杜邦分析体系的核心，也是盈利能力的综合性最强指标。流动比率、资产负债率反映偿债能力，存货周转率反映营运效率。\n【杜邦分解】ROE＝销售净利率×总资产周转率×权益乘数——把盈利、效率、杠杆串成一条线。","k":"盈利能力比率"},{"s":"jc","p":"会计","c":32,"cn":"政府会计","t":"single","q":"政府财务会计的要素不包括（　）。","o":["资产","净资产","利润","费用"],"a":[2],"e":"政府财务会计五要素：资产、负债、净资产、收入、费用。“利润”是企业会计的要素（收入−费用＝利润），政府会计不以营利为目的、没有利润概念，相应等式为“资产−负债＝净资产”。\n【对比记忆】企业六要素：资产、负债、所有者权益、收入、费用、利润；政府五要素：没有“利润”，且“所有者权益”换成“净资产”。","k":"政府会计要素"},{"s":"jc","p":"法律","c":33,"cn":"法律对经济关系的调整","t":"single","q":"反垄断法、反不正当竞争法等直接体现国家干预、协调经济运行的法律，属于（　）法律部门。","o":["民商法","经济法","行政法","刑法"],"a":[1],"e":"调整社会主义市场经济主要有两大法律部门：民商法——调整平等主体之间的人身与财产关系（合同、物权、公司法等），强调“平等自治”；经济法——调整国家在干预、协调经济运行中发生的经济关系（反垄断、反不正当竞争、财政税收、金融监管等），体现“国家干预”。\n【区分标志】主体地位平等、意思自治的是民商法；有“看得见的手”介入的是经济法。","k":"调整经济的法律体系"},{"s":"jc","p":"法律","c":34,"cn":"物权法律制度","t":"single","q":"抵押与质押的主要区别在于（　）。","o":["是否转移担保财产的占有","是否必须签订书面合同","担保的债权数额大小","能否由债务人本人提供担保"],"a":[0],"e":"抵押——不转移占有，抵押物仍在抵押人手里用（如房产抵押、生产设备抵押）；质押——必须转移占有或交付权利凭证（动产质押交付、权利质押登记/交付），出质人失去对质物的占有控制。书面合同两者都需要（B 同）；担保金额、担保人身份（C、D）两者都无差别。\n【记忆钩子】“抵押不搬家，质押要过手”。","k":"担保物权（抵押与质押）"},{"s":"jc","p":"法律","c":35,"cn":"合同法律制度","t":"single","q":"某买卖合同标的额为100万元，双方约定定金30万元。一方违约时，定金罚则实际可适用的数额为（　）。","o":["30万元","25万元","20万元","10万元"],"a":[2],"e":"民法典规定：定金数额由当事人约定，但不得超过主合同标的额的20%；超过部分不产生定金效力（不适用双倍返还/不予返还的罚则），只能按预付款处理。本题20%上限＝20万元，故定金罚则适用的只有20万。\n【定金罚则】给付方违约→无权请求返还；收受方违约→双倍返还。","k":"定金规则"}],"jiankang":[{"s":"jiankang","p":"健康管理概论","c":1,"cn":"健康管理概论","t":"single","q":"世界卫生组织对健康的定义是（　）。","o":["不仅是没有疾病和虚弱，而是身体、心理和社会适应的完好状态","没有疾病就是健康","不进医院就是健康","能吃能睡就是健康"],"a":[0],"e":"WHO 健康定义（1948）：健康不仅是没有疾病和虚弱，而是身体、心理和社会适应的完好状态。健康是多维概念，后补充“道德健康”。","k":"健康的概念"},{"s":"jiankang","p":"健康管理概论","c":1,"cn":"健康管理概论","t":"single","q":"健康管理的三部曲是（　）。","o":["健康监测、健康风险评估、健康干预","体检、看病、开药","营养、运动、睡眠","预防、诊断、治疗"],"a":[0],"e":"健康管理三部曲：健康监测（信息收集）→健康风险评估与分析→健康干预（指导与效果评估），循环进行、持续改善。","k":"健康管理流程"},{"s":"jiankang","p":"健康监测","c":2,"cn":"健康监测","t":"single","q":"成人正常血压的标准（收缩压/舒张压）为（　）。","o":["收缩压＜120 mmHg 且舒张压＜80 mmHg","收缩压≥140 mmHg","舒张压≥90 mmHg","收缩压 160 mmHg"],"a":[0],"e":"正常血压：收缩压＜120 且舒张压＜80；120-139/80-89 为正常高值；≥140/90 为高血压诊断标准（非同日三次测量）。","k":"血压标准"},{"s":"jiankang","p":"健康监测","c":2,"cn":"健康监测","t":"single","q":"体重指数（BMI）的计算公式为体重（kg）除以身高（m）的平方。BMI 为 28 的人群属于（　）。","o":["肥胖（我国标准 BMI≥28 为肥胖）","正常（18.5~23.9）","超重（24~27.9）","消瘦（＜18.5）"],"a":[0],"e":"我国成人 BMI 标准：＜18.5 消瘦、18.5~23.9 正常、24~27.9 超重、≥28 肥胖。中心性肥胖以腰围判定（男≥90cm、女≥85cm）。","k":"BMI 与肥胖"},{"s":"jiankang","p":"健康监测","c":2,"cn":"健康监测","t":"single","q":"成人空腹血糖的正常范围为（　）。（静脉血浆葡萄糖）","o":["3.9～6.1 mmol/L","6.1～7.0 mmol/L","≥7.0 mmol/L","2.8～3.9 mmol/L"],"a":[0],"e":"空腹血糖 3.9~6.1 正常；6.1~7.0 空腹血糖受损；≥7.0 且有多饮多尿等症状（或另日复测）考虑糖尿病。餐后 2 小时血糖＜7.8 正常。","k":"血糖标准"},{"s":"jiankang","p":"健康风险评估","c":3,"cn":"健康风险评估","t":"single","q":"健康风险评估的主要目的是（　）。","o":["估计个体患某种疾病或死亡的可能性，为干预提供依据","直接确诊疾病","代替临床治疗","预测寿命的准确天数"],"a":[0],"e":"健康风险评估=“健康体检+评估报告”：把生活方式与体检指标转化为患病的风险概率，用于激发干预动机、指导个性化干预，不能替代临床诊断。","k":"健康风险评估"},{"s":"jiankang","p":"健康风险评估","c":3,"cn":"健康风险评估","t":"single","q":"下列不属于慢性病共同危险因素的是（　）。","o":["接种乙型肝炎疫苗","吸烟","不合理膳食","缺乏身体活动"],"a":[0],"e":"慢病共同危险因素：吸烟、过量饮酒、不合理膳食、缺乏身体活动、超重肥胖、心理压力等。接种疫苗属于一级预防措施（乙肝疫苗可预防乙肝→肝癌，是保护因素）。","k":"慢病危险因素"},{"s":"jiankang","p":"健康干预","c":4,"cn":"健康干预","t":"single","q":"高血压患者生活方式干预的核心内容不包括（　）。","o":["增加钠盐摄入","减少钠盐摄入、增加钾盐摄入","控制体重、戒烟限酒","增加运动、保持心理平衡"],"a":[0],"e":"高血压生活方式干预六部曲：减少钠盐摄入（＜5g/天）、增加钾摄入、控制体重、戒烟限酒、增加运动、心理平衡。限盐是核心中的核心。","k":"高血压干预"},{"s":"jiankang","p":"健康干预","c":4,"cn":"健康干预","t":"single","q":"2 型糖尿病的综合治疗策略“五驾马车”是指（　）。","o":["糖尿病教育、饮食治疗、运动治疗、药物治疗、血糖监测","手术、化疗、放疗、理疗、食疗","降糖、降压、降脂、抗凝、营养","节食、断食、剧烈运动、大量饮水、 安眠"],"a":[0],"e":"糖尿病“五驾马车”：教育、饮食、运动、药物、血糖监测缺一不可，其中饮食治疗是基础。","k":"糖尿病管理"},{"s":"jiankang","p":"健康干预","c":4,"cn":"健康干预","t":"single","q":"成年人推荐的身体活动量（WHO 与我国指南）为（　）。","o":["每周至少 150 分钟中等强度有氧运动，每周 2～3 次抗阻练习","每天剧烈运动 3 小时","完全静养","只在周末突击运动 5 小时"],"a":[0],"e":"有氧运动每周至少 150 分钟中等强度（或 75 分钟高强度），抗阻练习每周 2~3 次；运动应循序渐进、动则有益、贵在坚持。","k":"身体活动"},{"s":"jiankang","p":"健康干预","c":4,"cn":"健康干预","t":"single","q":"关于吸烟危害与戒烟的说法，正确的是（　）。","o":["吸烟是多种慢性病（肺癌、心脑血管疾病、COPD）的主要危险因素，戒烟任何时候都不晚","戒烟会使病情加重","过滤嘴香烟无害","电子烟完全无害可以放心使用"],"a":[0],"e":"烟草依赖是慢性成瘾性疾病：戒烟可显著降低肺癌、心脑血管病、COPD 风险，戒烟能益处即刻与长期并存；电子烟同样含尼古丁成瘾物质，不作为戒烟推荐手段。","k":"烟草控制"},{"s":"jiankang","p":"健康教育","c":5,"cn":"健康教育","t":"single","q":"健康教育与健康促进的区别在于（　）。","o":["健康促进的范围更广，还包括创造支持性环境、制定公共政策等社会行动","健康教育范围更广","两者毫无联系","健康促进只针对病人"],"a":[0],"e":"健康教育是健康促进的重要组成部分（知识传播与行为干预）；健康促进还包括政策、环境、社会动员等，即“健康教育＋环境支持”。","k":"健康教育与健康促进"},{"s":"jiankang","p":"健康教育","c":5,"cn":"健康教育","t":"single","q":"健康信念模式中，促使人们采取健康行为的关键因素不包括（　）。","o":["感知到疾病的易感性与严重性","感知到行为的益处与障碍","自我效能（相信自己能改变）","他人的随机玩笑"],"a":[3],"e":"健康信念模式要素：感知易感性、感知严重性、感知益处、感知障碍、自我效能、行为线索。随机玩笑不是行为改变的理论要素。","k":"健康行为理论"},{"s":"jiankang","p":"慢病管理","c":6,"cn":"慢病管理","t":"single","q":"我国慢性病死亡人数占总死亡人数的比例约为（　）。","o":["88% 以上（慢性病是居民的主要死因）","30%","10%","5%"],"a":[0],"e":"慢性病（心脑血管病、癌症、糖尿病、慢性呼吸疾病）导致的死亡占总死亡的 88% 以上，慢病防控是我国健康管理的重中之重。","k":"慢性病流行状况"},{"s":"jiankang","p":"慢病管理","c":6,"cn":"慢病管理","t":"single","q":"高血压随访管理中，血压达标且稳定者随访（　）。","o":["每 3 个月 1 次（可适当延长随访间隔）","每天 1 次","每月必须 1 次不能变","每年 1 次即可"],"a":[0],"e":"高血压分级随访管理：达标且稳定者可 3 个月随访一次；不达标或不稳定者 2 周~1 个月随访一次并调整方案。","k":"高血压随访"},{"s":"jiankang","p":"健康监测","c":2,"cn":"健康监测","t":"multi","q":"健康信息收集的主要内容包括（　）。","o":["一般情况（性别、年龄、职业等）","目前健康状况与疾病家族史","生活方式（吸烟、饮酒、膳食、身体活动）","体格检查与实验室检查指标","他人的健康档案"],"a":[0,1,2,3],"e":"健康信息收集以个人健康档案为核心：一般情况、健康史、生活方式、体检与实验室指标、心理健康状况等，他人档案不属于本人健康信息。","k":"健康信息收集"},{"s":"jiankang","p":"健康风险评估","c":3,"cn":"健康风险评估","t":"multi","q":"健康风险评估报告一般包括的内容有（　）。","o":["个人健康信息汇总","疾病风险评估结果","生活方式危险因素提示","个性化的干预建议","临床诊断证明与处方"],"a":[0,1,2,3],"e":"健康风险评估报告：信息汇总、疾病风险预测、危险因素分析、个性化干预建议。风险评估不能出具临床诊断与处方。","k":"评估报告内容"},{"s":"jiankang","p":"健康干预","c":4,"cn":"健康干预","t":"multi","q":"合理膳食的核心推荐包括（　）。","o":["食物多样，谷类为主","多吃蔬菜、水果、奶类、大豆","少盐少油，控糖限酒","足量饮水，规律进餐","以含糖饮料代替饮水"],"a":[0,1,2,3],"e":"《中国居民膳食指南》平衡膳食八准则：食物多样、吃动平衡、多吃蔬果奶豆、适量鱼禽蛋瘦肉、少盐少油控糖限酒、规律进餐足量饮水、会烹会选会看标签、公筷分餐杜绝浪费。","k":"合理膳食"},{"s":"jiankang","p":"健康干预","c":4,"cn":"健康干预","t":"multi","q":"健康管理干预策略的常用模式包括（　）。","o":["生活方式干预（膳食、运动、戒烟限酒）","慢病管理干预（随访、用药指导）","心理健康干预","就医指导与疾病管理服务","发放保健品代替一切干预"],"a":[0,1,2,3],"e":"健康干预策略：生活方式、疾病管理、心理健康、就医服务等多维度综合干预。保健品不能替代规范的干预与治疗。","k":"健康干预策略"},{"s":"jiankang","p":"慢病管理","c":6,"cn":"慢病管理","t":"multi","q":"关于糖尿病筛查与管理的说法中，正确的有（　）。","o":["高危人群（超重、家族史等）应定期检测血糖","糖尿病管理需饮食、运动、药物、监测、教育综合干预","血糖控制目标应个体化","血糖达标后可以随意停药","规律运动有助于改善血糖控制"],"a":[0,1,2,4],"e":"糖尿病管理是终身过程，血糖达标后擅自停药会导致血糖反弹；任何调药都应在医生指导下进行。","k":"糖尿病筛查管理"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"流行病学最基本的研究对象是（　）。","o":["具有某种共同特征的人群","单个就诊的患者","实验室培养的病原体","某一种实验动物"],"a":[0],"e":"流行病学从人群层面研究疾病与健康状况的分布及其影响因素，研究对象是人群；临床医学以个体患者为对象，病原学以病原体为对象。【易错点】把人群与个体病人、病原体混淆，是本章最基础的失分点。","k":"流行病学研究对象"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"关于发病率与患病率关系的说法，正确的是（　）。","o":["患病率受发病率和病程共同影响，病程延长可使患病率升高","发病率是某一时点人群中现有病例所占的比例","患病率只统计观察期内新发生的病例","发病率与患病率在任何情况下都相等"],"a":[0],"e":"发病率等于一定期间内新发病例数除以同期暴露人口，反映发病风险；患病率等于特定时间内新旧病例之和除以平均人口，反映疾病负担。当发病率与病程较稳定时，患病率约等于发病率乘以病程。【易错点】患病率含新旧病例、发病率只含新发病例，二者分母与用途都不同。","k":"发病率与患病率"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"病例对照研究在设计上属于（　）。","o":["回顾性的分析性研究，由果推因","前瞻性的实验性研究，由因推果","随机对照的实验性研究","描述性的现况调查"],"a":[0],"e":"病例对照研究按是否患病分组，回顾性调查既往暴露史，以比值比 OR 估计关联，属观察法中的分析性研究，方向是由果推因；队列研究才是由因推果的前瞻性研究。【记忆钩子】病例对照回头看（回顾），队列研究向前看（前瞻）。","k":"病例对照研究"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"与病例对照研究相比，队列研究最突出的优势是（　）。","o":["能直接计算发病率与相对危险度 RR","能直接计算比值比 OR","研究罕见病更省时省钱","无需随访、不存在失访偏倚"],"a":[0],"e":"队列研究随访暴露组与非暴露组，能直接获得发病率并计算相对危险度 RR 与归因危险度；病例对照研究不能直接计算发病率，只能用 OR 估计关联，反而更适合罕见病、更省时省钱，但易受回忆偏倚影响。【易错点】把 OR 与 RR 的适用设计、罕见病适用性对调，是高频失分点。","k":"队列研究"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"某队列研究得到相对危险度 RR=2.5，正确的解释是（　）。","o":["暴露组发病风险约为非暴露组的 2.5 倍，提示该因素可能是危险因素","暴露组发病风险比非暴露组低 2.5 倍","暴露与疾病之间不存在关联","暴露组有 2.5% 的概率发病"],"a":[0],"e":"相对危险度 RR 等于暴露组发病率除以非暴露组发病率。RR 大于 1 提示正关联即危险因素，小于 1 提示保护因素，等于 1 提示无关联。【易错点】RR 是倍数而非绝对概率或百分比，且关联强度本身不能直接证明因果。","k":"相对危险度"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"评价一项筛检试验不漏诊能力的指标是（　）。","o":["灵敏度，即真阳性率","特异度，即真阴性率","阳性预测值","病死率"],"a":[0],"e":"灵敏度等于真阳性除以真阳性与假阴性之和，反映检出病人的能力，越高越不易漏诊；特异度等于真阴性除以真阴性与假阳性之和，反映排除非病人的能力，越高越不易误诊。【记忆钩子】灵敏找病人怕漏，特异排健康怕冤。","k":"筛检灵敏度"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"对无症状人群定期测量血压、检测血糖以早期发现高血压和糖尿病，属于（　）。","o":["二级预防，即三早预防","一级预防，即病因预防","三级预防，即临床与康复预防","零级预防"],"a":[0],"e":"一级预防针对病因，如健康教育、疫苗接种、控烟；二级预防强调早发现、早诊断、早治疗，筛检与定期体检是典型手段；三级预防面向已患病者，防伤残、促康复。题干的筛查属二级预防。【易错点】把量血压、查血糖这类筛检误判为一级预防。","k":"三级预防"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"single","q":"传染病流行过程得以形成的三个基本环节是（　）。","o":["传染源、传播途径、易感人群","病原体、宿主、外界环境","病人、医生、媒介昆虫","潜伏期、症状期、恢复期"],"a":[0],"e":"传染病流行须同时具备传染源（能排出病原体的人或动物）、传播途径（病原体由传染源到易感者的通路）、易感人群（对该病缺乏免疫力者），切断任一环节即可阻断流行。【记忆钩子】源、路、人，三环缺一不可。","k":"传染病流行环节"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"multi","q":"描述疾病分布时，经典的三间分布所包含的维度有（　）。","o":["时间分布","地区分布","人群分布，如年龄、性别、职业","病原体的基因序列分布","患者的医疗费用分布"],"a":[0,1,2],"e":"疾病的三间分布指时间、地区、人群三个维度，是描述流行病学的基本框架，用以提出病因线索；基因序列分型与费用分布属分子流行病学或卫生经济学范畴，不属经典三间分布。【记忆钩子】时、地、人，三间定分布。","k":"疾病三间分布"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"multi","q":"关于流行病学研究方法分类的说法，正确的有（　）。","o":["现况调查属于描述性研究","病例对照研究与队列研究属于分析性研究","随机对照试验属于实验性研究","队列研究属于实验性研究","生态学研究属于实验性研究"],"a":[0,1,2],"e":"观察法分描述性（现况调查、生态学研究、疾病监测）与分析性（病例对照、队列）；实验法含临床、现场与社区干预试验，随机对照试验是其代表；另有理论流行病学。队列研究虽需随访，但研究者不施加干预、不随机分组，仍属观察性。【易错点】随访不等于干预，别把队列研究当成实验性研究。","k":"流行病学方法分类"},{"s":"jiankang","p":"流行病学与卫生统计","c":7,"cn":"流行病学基本概念与方法","t":"multi","q":"关于常用疾病频率测量指标的说法，正确的有（　）。","o":["发病率反映一定时期内人群发生某病新病例的频率","患病率包括特定时间内的新发病例和原有病例","病死率反映某病对患者生命的威胁程度","死亡率的分母通常为同期平均人口数","患病率只计入观察期内新发生的病例"],"a":[0,1,2,3],"e":"发病率看新发病例除以暴露人口，反映风险；患病率看某时点或时期新旧病例之和除以平均人口，反映负担；病死率看某病死亡数除以该病病人数，反映严重程度；死亡率看某病死亡数除以平均人口，反映对人群的危害。【记忆钩子】发病看新、患病看新旧、死亡看总人口、病死看病人数。选项 E 把患病率说成只含新病例，错。","k":"疾病频率指标"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"将疗效按治愈、显效、好转、无效分级记录的资料属于（　）。","o":["等级资料，即有序分类变量","计量资料","二分类计数资料","连续型定量资料"],"a":[0],"e":"等级资料又称半定量或有序分类资料，各类别之间有程度、顺序差别，如疗效分级、病情轻重；无序分类如血型、性别属计数资料；计量资料是有数值大小与度量衡单位的定量数据。【易错点】有顺序是判定等级资料的关键，别与无序计数资料混淆。","k":"资料类型"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"一组呈明显偏态分布、且含个别极大值的血清学指标，描述其集中位置最合适的是（　）。","o":["中位数","算术均数","几何均数","标准差"],"a":[0],"e":"中位数由位次决定，不受极端值影响，适用于偏态、分布不明或有开口资料；算术均数适用于对称近似正态分布；几何均数适用于倍数变化或对数正态资料，如抗体滴度；标准差是离散指标而非集中指标。【记忆钩子】偏态找中位，正态用均数，滴度用几何。","k":"集中趋势指标"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"比较身高与体重两组单位不同的数据之变异程度，宜采用（　）。","o":["变异系数","极差","标准差","方差"],"a":[0],"e":"变异系数 CV 等于标准差除以均数再乘以百分之百，消除了量纲与均数水平的影响，专门用于单位不同或均数相差悬殊时的变异度比较；标准差、方差、极差都带原始单位，不便跨单位比较。【易错点】是否跨单位或跨量级，决定该用变异系数还是标准差。","k":"离散趋势指标"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"关于标准差与标准误的说法，正确的是（　）。","o":["标准差反映个体观察值的变异，标准误反映样本均数的抽样误差","两者含义完全相同","标准差随样本量增大而系统性增大","标准误反映个体观察值的离散程度"],"a":[0],"e":"标准差描述个体值围绕样本均数的离散程度；标准误是样本均数的标准差，数值上约等于标准差除以样本量的平方根，衡量样本统计量围绕总体参数的抽样误差，样本量越大标准误越小。【记忆钩子】标准差管个体，标准误管均数、管抽样。","k":"标准差与标准误"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"在假设检验中，关于 P 值的正确理解是（　）。","o":["在原假设成立的前提下，得到当前样本结果或更极端结果的概率","原假设本身为真的概率","P 值越小说明两总体差别越大","备择假设成立的概率"],"a":[0],"e":"P 值是在原假设 H0 成立的假定下，出现当前检验统计量或更极端情况的概率；当 P 不大于事先设定的检验水准时拒绝 H0。【易错点】把 P 值误解为原假设为真的概率或效应大小，是最常见的概念错误，也不能仅凭 P 值下临床结论。","k":"P 值含义"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"假设检验中拒绝了实际上成立的原假设，所犯的错误属于（　）。","o":["第一类错误即弃真错误，其概率用检验水准表示","第二类错误即取伪错误，其概率用 β 表示","抽样误差","系统误差"],"a":[0],"e":"第一类错误是弃真，即 H0 为真却被拒绝，其最大概率为事先设定的检验水准 α；第二类错误是取伪，即 H0 为假却未被拒绝，概率为 β；检验效能或把握度等于 1 减 β。【记忆钩子】α 是冤枉好人弃真，β 是放走坏人取伪。","k":"两类错误"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"比较两组近似正态、方差齐的计量资料均数有无差别，应首选（　）。","o":["两独立样本 t 检验","卡方检验","秩和检验","直线相关分析"],"a":[0],"e":"两独立样本均数比较且满足正态性与方差齐性时，用 t 检验；卡方检验用于分类资料率或构成比的比较；秩和检验用于偏态或等级资料；相关分析用于两变量的关联程度。【易错点】先看资料类型与分布特征，再选检验方法，不能见两组比较就套 t 检验。","k":"t 检验"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"single","q":"比较两种疗法治疗某病的有效率，有效与无效为二分类结果，宜采用（　）。","o":["卡方检验","两样本 t 检验","配对 t 检验","方差分析"],"a":[0],"e":"有效率属二分类计数资料，两组或多组率的比较用卡方检验；t 检验与方差分析用于计量资料的均数比较。【记忆钩子】率是分类用卡方，均数是计量用 t 或 F。","k":"卡方检验"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"multi","q":"关于正态分布特征的描述，正确的有（　）。","o":["曲线以均数为中心，左右对称","均数、中位数与众数三者相等","曲线下面积的分布有固定规律，可用均数与标准差描述","呈明显正偏态，高峰偏向左侧","由均数与标准差两个参数即可唯一确定"],"a":[0,1,2,4],"e":"正态曲线是以均数为中心的对称钟形，均数、中位数、众数合一，由均数决定位置、标准差决定形状，一旦两参数确定分布即唯一确定，曲线下面积按标准差有固定比例供参考值范围使用。【记忆钩子】对称钟形、三数合一、两参定形；偏态才有长尾，正态不偏。","k":"正态分布"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"multi","q":"关于集中趋势与离散趋势指标合理搭配的说法，正确的有（　）。","o":["对称或正态资料常用均数配合标准差描述","偏态资料常用中位数配合四分位数间距描述","几何均数适用于倍数变化或对数正态资料","任何资料都用均数描述最准确","标准差越大说明均数的代表性越好"],"a":[0,1,2],"e":"正态资料用均数加标准差，偏态或有极端值用中位数加四分位数间距，等比或对数正态资料用几何均数；标准差越大说明数据越分散、均数代表性越差，而非越好，且均数并非对任何分布都合适。【易错点】标准差与均数代表性是反向关系，别记反。","k":"统计描述搭配"},{"s":"jiankang","p":"流行病学与卫生统计","c":8,"cn":"医学统计学基础","t":"multi","q":"关于医学参考值范围与总体均数可信区间的说法，正确的有（　）。","o":["参考值范围用于估计绝大多数正常人某指标的波动区间","可信区间用于按给定概率估计总体参数所在范围","两者含义与用途不同，不能混用","正态资料双侧 95% 参考值范围常用均数加减 1.96 倍标准差估计","可信区间越宽说明抽样误差越小、估计越精确"],"a":[0,1,2,3],"e":"参考值范围面向个体，判断某人某指标是否异常；可信区间面向参数，估计总体均数等可能落入的范围；正态资料双侧 95% 参考值范围常用均数加减 1.96 倍标准差，偏态资料用百分位数法。可信区间越窄才越精确，选项 E 把宽窄与精确性说反。【易错点】个体正常值范围与总体参数区间张冠李戴，以及宽窄方向记反。","k":"参考值范围与可信区间"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"在三大产能营养素中，单位质量产生能量最高的是（　）。","o":["脂肪，约 9 kcal/g","碳水化合物，约 4 kcal/g","蛋白质，约 4 kcal/g","膳食纤维"],"a":[0],"e":"脂肪约 9 kcal/g，碳水化合物与蛋白质各约 4 kcal/g，故脂肪能量密度最高、过量摄入最易造成能量过剩；膳食纤维几乎不产生能量。【记忆钩子】4、4、9，糖、蛋、脂。","k":"产能营养素"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"下列维生素中，属于脂溶性、摄入过量可在体内蓄积而致中毒的是（　）。","o":["维生素 A","维生素 C","维生素 B1","维生素 B2"],"a":[0],"e":"脂溶性维生素包括 A、D、E、K，随脂肪吸收、可在肝与脂肪组织蓄积，过量易中毒；B 族与 C 属水溶性，体内储存少、多余随尿排出，需经常由膳食供给。【记忆钩子】脂溶 A D E K，水溶 B 族加 C。","k":"维生素分类"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"儿童维生素 D 缺乏且日照不足，最可能引起的疾病是（　）。","o":["佝偻病","夜盲症","坏血病","脚气病"],"a":[0],"e":"维生素 D 促进钙磷吸收与骨骼钙化，缺乏致儿童佝偻病、成人骨软化与骨质疏松，且可经日照由皮肤合成；夜盲症对应维生素 A，坏血病对应维生素 C，脚气病对应维生素 B1。【记忆钩子】D 管骨头、A 管眼、C 管胶原、B1 管神经。","k":"维生素 D 缺乏症"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"为提高膳食中非血红素铁的吸收率，最合理的做法是（　）。","o":["同时摄入富含维生素 C 的新鲜蔬果","与浓茶、咖啡同餐大量饮用","与大量高钙食品同餐摄入","长期纯素食且不与任何果蔬搭配"],"a":[0],"e":"维生素 C 可将三价铁还原为易吸收的二价铁并形成可溶性络合物，显著促进非血红素铁吸收；茶多酚、咖啡、植酸、钙与过多膳食纤维则抑制其吸收。【易错点】动物性食物中的血红素铁吸收率高且受膳食因素影响小，勿与非血红素铁混为一谈。","k":"铁的吸收"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"谷类与豆类搭配食用能提高膳食蛋白质质量，其原理是（　）。","o":["必需氨基酸相互补充，发挥蛋白质互补作用","豆类可完全替代谷类供能","谷类蛋白质含量远高于豆类","搭配后脂肪含量大幅下降"],"a":[0],"e":"谷类蛋白缺赖氨酸而富蛋氨酸，大豆蛋白富赖氨酸而缺蛋氨酸，二者混食使必需氨基酸模式更接近人体需要，提高蛋白质生物学价值，即蛋白质互补作用。【记忆钩子】谷缺赖、豆缺蛋，混着吃才圆满。","k":"蛋白质互补"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"在中国居民平衡膳食宝塔中，位于底层、作为膳食主体且推荐量最大的是（　）。","o":["谷薯类","蔬菜和水果","畜禽鱼蛋奶类","烹调油与食盐"],"a":[0],"e":"平衡膳食宝塔按推荐量由多到少分层，底层为谷薯类等主食，往上依次为蔬菜水果、动物性食物与奶类大豆坚果，塔尖为应少量摄入的油盐，体现食物多样、谷类为主。【记忆钩子】塔底主食撑得稳，塔尖油盐要收紧。","k":"平衡膳食宝塔"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"内陆缺碘地区居民长期碘摄入不足，最典型的社区营养问题是（　）。","o":["甲状腺肿，孕期严重缺碘还可影响胎儿脑发育","佝偻病","缺铁性贫血","夜盲症"],"a":[0],"e":"碘是合成甲状腺激素的原料，缺乏可致甲状腺代偿性肿大，孕妇严重缺碘可致胎儿不可逆的智力与生长发育损害；食盐加碘是经济有效的群体预防措施。【易错点】其余三项分别对应维生素 D、铁、维生素 A 缺乏，勿对号混淆。","k":"碘缺乏病"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"single","q":"下列关于食物中毒共同特点的描述，正确的是（　）。","o":["发病与进食某种被污染或含毒食物有关，常集体暴发、潜伏期较短，病人之间一般不直接传染","可在人与人之间持续传播，呈现典型传染病流行曲线","潜伏期常长达数月乃至数年","仅零星散发，与共同进食史毫无关联"],"a":[0],"e":"食物中毒起病急、潜伏期短、常同源集体暴发，病人有共同进食史，停止食用可疑食物后发病即止，且不人传人，可与肠道传染病区分；按病因分细菌性、真菌及其毒素、动物性、植物性与化学性。【易错点】病从口入但不人传人，是辨析关键。","k":"食物中毒特点"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"multi","q":"下列属于常用膳食调查方法的有（　）。","o":["24 小时膳食回顾法","记账法","称重法","食物频率问卷法","静脉血生化指标检测"],"a":[0,1,2,3],"e":"膳食调查用于了解摄入了什么、吃了多少，常用 24 小时回顾、记账、称重与食物频率法；血生化检测属于营养状况的实验室评价，反映机体营养水平，不是膳食摄入量调查方法本身。【易错点】吃了什么即膳食调查，与营养水平如何即生化体格评价，是两类方法。","k":"膳食调查方法"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"multi","q":"关于水溶性维生素的描述，正确的有（　）。","o":["主要包括 B 族维生素与维生素 C","体内储存少，需经常由膳食供给","摄入过多时多随尿液排出，相对不易蓄积中毒","包括维生素 A、D、E、K","缺乏后体内仍可长期大量储存而不出现症状"],"a":[0,1,2],"e":"水溶性维生素为 B 族与 C，体内储存有限、需经常补充，多余部分多随尿排出、相对不易蓄积中毒，但并非可无限制大剂量滥用；A、D、E、K 属脂溶性，可在体内蓄积。【记忆钩子】水溶天天补，脂溶能存住。","k":"水溶性维生素"},{"s":"jiankang","p":"营养与食品安全","c":9,"cn":"营养素与平衡膳食","t":"multi","q":"关于常见食物中天然或污染性有毒因素及其来源，对应正确的有（　）。","o":["发芽马铃薯——龙葵素","未煮熟四季豆——皂素与植物血凝素","霉变花生、玉米——黄曲霉毒素","河豚内脏——河豚毒素","不新鲜青皮红肉鱼——组胺，且充分加热即可完全破坏"],"a":[0,1,2,3],"e":"四季豆含皂素与植物血凝素、发芽马铃薯含龙葵素、霉变粮油易被黄曲霉毒素污染、河豚内脏含河豚毒素，均为经典对应，充分加热可破坏前两者；组胺由不新鲜青皮红肉鱼的组氨酸分解产生，耐热，加热不能去除，故选项 E 错。【记忆钩子】豆要熟、芽别吃、霉粮油最毒、河豚脏要命。","k":"食物中的有毒因素"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"single","q":"关于身体活动与运动（锻炼）的关系，正确的是（　）。","o":["运动是身体活动的一种，具有计划性、组织性和重复性，以增进体能为目的","身体活动是运动的子集，范围更小","两者完全等同，没有任何区别","身体活动仅指竞技体育比赛"],"a":[0],"e":"身体活动泛指由骨骼肌产生并导致能量消耗的任何身体动作，涵盖职业性、交通性、家务性与休闲性活动；运动是其中有计划、有组织、可重复、以改善或维持体能为目的的子集。【易错点】包含关系别颠倒，活动大、运动小。","k":"身体活动概念"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"single","q":"判断某人当前处于中等强度有氧运动，最常用的简易主观指标是（　）。","o":["呼吸与心率加快，能说话但不能连贯唱歌","呼吸平稳，可轻松唱歌且毫无费力感","气喘吁吁，几乎说不出完整句子","身体完全静止，能耗与安静时相同"],"a":[0],"e":"中等强度时呼吸心跳加快、微微出汗，主观有点费力，能交谈却不能唱歌，即谈话测试；能轻松唱歌偏轻强度，说话困难接近高强度。【记忆钩子】能说不能唱是中等，唱得出偏轻，说不出偏强。","k":"运动强度判断"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"single","q":"以增强肌肉力量和肌肉耐力为主要目的的身体活动类型是（　）。","o":["抗阻练习，即力量训练","有氧耐力运动","柔韧性拉伸","平衡练习"],"a":[0],"e":"抗阻练习如哑铃、弹力带、自身重量训练，通过对抗阻力增强肌力与肌耐力，通常每周安排 2 至 3 次、隔天进行；有氧运动主要提升心肺耐力，柔韧练习增加关节活动度，平衡练习多用于老年人防跌倒。【记忆钩子】有氧练心肺、抗阻练肌肉、拉伸练柔韧、平衡防摔倒。","k":"身体活动类型"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"single","q":"制定个体化运动处方时，FITT 框架所指的四个基本要素是（　）。","o":["频率、强度、时间、方式","食物、兴趣、体温、团队","家族史、免疫、检验、治疗","柔韧、平衡、速度、营养"],"a":[0],"e":"FITT 即频率 Frequency、强度 Intensity、时间 Time、类型 Type，常再补充总运动量与循序渐进的进阶计划，并强调个体化与安全性；其余选项为拼凑的无关词。【记忆钩子】多久一次、多累、多久、做啥，合起来就是 FITT。","k":"运动处方 FITT"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"single","q":"抑郁状态最具代表性的核心表现是（　）。","o":["持续的情绪低落、兴趣或愉快感减退、精力下降","短暂紧张后迅速完全恢复","注意力始终高度集中、精力过剩","仅食欲亢进而无任何情绪改变"],"a":[0],"e":"抑郁以显著而持久的心境低落、兴趣或愉快感丧失、精力减退易疲劳为核心，常伴睡眠、食欲、自我评价与注意力改变并损害社会功能；焦虑则以过度担心、紧张与自主神经亢进为主。【易错点】自评量表或筛查只能提示风险，是否达到抑郁症诊断须由专业人员结合面谈判定。","k":"抑郁核心症状"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"multi","q":"规律身体活动对健康的益处包括（　）。","o":["改善心肺耐力与心血管功能","有助于控制体重、血压、血糖与血脂","改善情绪与睡眠、缓解压力","增强骨密度、降低老年人跌倒风险","可在短期内完全替代所有药物治疗且毫无风险"],"a":[0,1,2,3],"e":"规律运动在心肺功能、代谢指标、体重、情绪睡眠、骨骼与平衡能力方面获益证据充分；但运动只是健康生活方式与慢病管理的一部分，不能宣称完全替代药物或绝对零风险，过量与不当运动仍可致损伤，应循序渐进、量力而行。【易错点】警惕包治百病、绝对无害式绝对化表述。","k":"身体活动健康益处"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"multi","q":"关于常用心理健康评估量表及其应用的说法，正确的有（　）。","o":["SCL-90 可用于多种心理症状的自评","SDS 主要用于抑郁情绪的自评筛查","SAS 主要用于焦虑情绪的自评筛查","自评量表结果只能作为筛查与辅助线索，不能据此直接下临床诊断","量表得分异常即可确诊精神障碍，无需专业面谈"],"a":[0,1,2,3],"e":"SCL-90 为症状自评量表，SDS、SAS 分别用于抑郁与焦虑的自评筛查；自评量表反映主观症状严重程度，用于初筛、疗效观察与科研，精神障碍诊断须结合病史、精神检查与专业评估。【记忆钩子】量表管筛查，诊断靠医生。","k":"心理评估量表"},{"s":"jiankang","p":"身体活动与心理健康","c":10,"cn":"身体活动基础与心理健康","t":"multi","q":"下列疾病中，通常认为心理社会因素在其发生发展中起重要作用、可归入心身疾病的有（　）。","o":["原发性高血压","消化性溃疡","冠心病","支气管哮喘","急性阑尾炎，单纯由细菌感染与管腔梗阻所致"],"a":[0,1,2,3],"e":"心身疾病指心理社会因素如应激、情绪与行为作为重要病因或诱因参与发病的躯体疾病，典型有原发性高血压、消化性溃疡、冠心病、支气管哮喘、甲状腺功能亢进等；急性阑尾炎主要为感染梗阻所致的器质性疾病，一般不归入心身疾病。【记忆钩子】高压、溃疡、冠心、哮喘，情绪能插手的那几样。","k":"心身疾病"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"single","q":"中医学理论体系的两个基本特点是（　）。","o":["整体观念与辨证论治","阴阳五行与四气五味","望闻问切与理法方药","辨证求因与审因论治"],"a":[0],"e":"中医学以整体观念，即人体自身统一及人与自然、社会统一，和辨证论治，即据证候确立治法，为两大基本特点；阴阳五行是哲学基础与说理工具，四诊八纲、理法方药属具体诊治方法。【记忆钩子】整体加辨证，两大特点记牢。","k":"中医学基本特点"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"single","q":"中医治未病思想在健康管理中最贴切的对应是（　）。","o":["以预防为核心，涵盖未病先防、既病防变、瘥后防复","只针对已发疾病的根治手段","仅指病后康复锻炼","仅指长期服用滋补药物"],"a":[0],"e":"治未病含三层，未病先防即无病时养生防病、既病防变即已病防传变加重、瘥后防复即病愈防复发，与健康管理预防为主、全程管理的理念高度契合，并非单纯治疗或进补。【记忆钩子】未病先防、既病防变、愈后防复。","k":"治未病"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"single","q":"中医藏象学说中，五脏即心、肝、脾、肺、肾共同的生理特点是（　）。","o":["化生和贮藏精气，藏而不泻、满而不能实","受盛和传化水谷，泻而不藏、实而不能满","专司传导糟粕并排出体外","仅主司体表与四肢运动"],"a":[0],"e":"五脏主藏精气而不泻，故满而不能实；六腑即胆、胃、小肠、大肠、膀胱、三焦主传化物而不藏，故实而不能满，以通降为顺。【记忆钩子】五脏宜满藏精，六腑宜通传化。","k":"藏象五脏六腑"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"single","q":"中医八纲辨证中，用以辨别疾病性质属寒属热的一对纲领是（　）。","o":["寒热","表里","虚实","阴阳"],"a":[0],"e":"八纲为阴、阳、表、里、寒、热、虚、实：表里辨病位深浅，寒热辨疾病性质，虚实辨邪正盛衰，阴阳为总纲统摄其余六纲。【记忆钩子】表里定位置、寒热定性质、虚实定力量、阴阳当总纲。","k":"八纲辨证"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"single","q":"与临床医学相比，康复医学最鲜明的特征是（　）。","o":["以功能障碍为核心，目标是恢复功能、提高生活质量并重返社会","以彻底根除病原体为唯一目标","只依赖手术与药物，不进行功能训练","只面向临终患者提供照护"],"a":[0],"e":"临床医学以疾病诊断与治愈为中心，康复医学以功能评定与功能恢复为中心，借助综合训练、代偿与适应、环境改造及辅助器具，使病伤残者最大限度恢复功能、回归家庭与社会，常由医师、治疗师、护士、社工等组成团队实施。【易错点】康复不等于静养不动，主动功能训练才是核心。","k":"康复医学核心"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"multi","q":"中医养生的基本原则包括（　）。","o":["顺应自然、天人相应，因时因地因人制宜","形神兼养、动静结合","调养脾胃、重视后天之本","持之以恒、因人而异","追求一刀切的固定进补方案，人人同方"],"a":[0,1,2,3],"e":"养生强调顺应四时、形神共养、动静相宜、顾护脾胃、三因制宜与长期坚持，并须依据个体体质辨识施养；万人同方、盲目进补违背辨证论治与因人制宜。【记忆钩子】顺自然、养形神、护脾胃、贵坚持、辨体质。","k":"中医养生原则"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"multi","q":"下列属于现代康复治疗常用技术手段的有（　）。","o":["运动疗法等物理治疗","作业治疗，即日常生活活动训练","言语与吞咽治疗","假肢、矫形器与辅助器具等康复工程","以长期静卧制动完全替代一切主动训练"],"a":[0,1,2,3],"e":"康复治疗包括物理治疗、作业治疗、言语治疗、心理治疗、康复工程、传统康复与康复护理等；长期制动可致关节挛缩、肌萎缩、深静脉血栓与压疮等废用综合征，现代康复强调在安全前提下尽早主动活动。【易错点】制动是功能障碍之源，不是康复手段。","k":"康复治疗技术"},{"s":"jiankang","p":"中医养生与康复医学","c":11,"cn":"中医养生基础与康复医学","t":"multi","q":"中医情志学说中，情志过激可损伤相应脏腑，下列对应正确的有（　）。","o":["怒伤肝","思伤脾","恐与惊伤肾","忧与悲伤肺","喜伤心，且喜在任何强度下都绝对有益无害"],"a":[0,1,2,3],"e":"五志配五脏为怒伤肝、喜伤心、思伤脾、忧伤肺、恐伤肾，且须情志过极方成致病因素；喜虽属良性情志，暴喜过喜可使心气涣散、神不守舍，故选项 E 绝对化表述错。【记忆钩子】怒肝、喜心、思脾、悲肺、恐肾，过则为害。","k":"五志与五脏"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"single","q":"某人投保的重大疾病保险，确诊合同约定疾病后按约定金额一次性给付、与实际医疗费用无关，该险种属于（　）。","o":["定额给付型疾病保险","费用补偿型医疗保险","失能收入损失保险","长期护理保险"],"a":[0],"e":"疾病保险以重大疾病保险为典型，多为定额给付，符合合同约定即按保额给付，无需医疗票据、可多份叠加；医疗保险属补偿型，以实际发生费用为上限、凭票据报销，适用损失补偿原则，不能因保险额外获利。【易错点】按保额给与按花费报，是定额给付与费用补偿的分水岭。","k":"健康保险给付方式"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"single","q":"关于社会医疗保险与商业健康保险的说法，正确的是（　）。","o":["社会医疗保险强调广覆盖、保基本，商业健康保险强调自愿投保、按合同约定提供补充保障","商业健康保险由政府强制实施","社会医疗保险以盈利为首要目标","二者保障对象与运行机制完全相同"],"a":[0],"e":"社会医保由政府主导、依法普遍实施、互助共济、保基本广覆盖且不以盈利为目的；商业健康险由保险公司市场化经营、投保人自愿购买、权利义务以保险合同为准，是多层次医疗保障体系的补充。【记忆钩子】社保保基本靠共济，商保作补充凭合同。","k":"社会医保与商业健康险"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"single","q":"投保前，健康状况较差、患病风险较高者往往比健康人更积极投保，这一现象在保险学中称为（　）。","o":["逆向选择","道德风险","理赔调查","损失补偿"],"a":[0],"e":"逆向选择发生在合同成立之前，因信息不对称使高风险者更倾向投保，保险公司通过核保、如实告知与等待期加以应对；道德风险发生在投保之后，因已有保障而疏于防范或过度利用医疗服务。【记忆钩子】投保前挑人是逆向选择，投保后松懈是道德风险。","k":"逆向选择"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"single","q":"商业健康保险约定合同生效后一段时间内因疾病发生的医疗费用不予赔付，该约定主要目的是（　）。","o":["设置等待期或观察期，防范带病投保与逆选择","延长保险责任期限","提高保险金额","免除保险公司全部责任"],"a":[0],"e":"等待期用于排除投保时已患未愈或处于潜伏期的疾病，降低带病投保与逆选择风险，意外伤害通常不设等待期；它既非延长保障或提高保额，也非无原则免责，仅针对观察期内特定情形作出约定。【易错点】等待期不等同于免责条款，意外医疗一般不受其限制。","k":"等待期"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"single","q":"健康管理机构的服务质量常因服务人员、时间、情境不同而波动，这主要体现服务的（　）。","o":["易变性，即异质性","无形性","不可储存性","不可分离性"],"a":[0],"e":"服务的四大特征为无形性、不可分离性（生产与消费同步）、易变性或异质性（质量随提供者、时间、对象波动，难标准化）与不可储存性（不能库存、过时作废）；质量波动对应易变性。【记忆钩子】无形、同步、易变、易逝，服务四性。","k":"服务的基本特征"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"multi","q":"与有形实物产品相比，健康管理服务通常具有的特征包括（　）。","o":["无形性，服务本身难以被看见或触摸","不可分离性，服务的提供与消费多同时发生","易变性，质量依人员与情境而波动","不可储存性，服务不能提前生产、库存待售","可无限次退换，与实物产品完全同质"],"a":[0,1,2,3],"e":"服务区别于实物产品的四个典型特征即无形性、不可分离性、异质性与易逝性；服务难以像实物那样退换，标准化程度也较低，选项 E 错。【记忆钩子】看不见、同步走、会变样、留不住。","k":"服务四特征"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"multi","q":"服务营销组合在传统 4P 基础上扩展为 7P，下列属于新增的服务特有要素有（　）。","o":["人员，即服务提供与接触人员的素质","过程，即服务流程与顾客体验","有形展示，即服务环境与有形线索","产品","价格"],"a":[0,1,2],"e":"传统 4P 为产品、价格、渠道、促销；服务营销 7P 在 4P 之上增加人员、过程、有形展示三项，以适配服务的无形性与高度人际接触特征。产品与价格本就属于 4P，不是新增要素。【易错点】只认人、过程、有形展示这三项，别把原有 4P 也算作新增。","k":"服务营销 7P"},{"s":"jiankang","p":"健康保险与服务营销","c":12,"cn":"健康保险与健康管理服务营销","t":"multi","q":"健康管理师在服务过程中应遵循的职业伦理与沟通要求包括（　）。","o":["尊重服务对象的知情同意与自主决定","对个人健康信息严格保密，非授权不得外泄","以共情、倾听和开放式提问建立信任","依据服务对象的健康素养，用其能理解的方式解释信息","为激励改变，可将服务对象隐私作为案例在公开场合随意讲述"],"a":[0,1,2,3],"e":"健康管理伦理强调尊重即知情同意与自主、不伤害与有利、公正及保密；健康信息属敏感个人信息，须授权、脱敏、最小必要使用；沟通上重视倾听、共情、开放式提问与健康素养适配。选项 E 违反保密与知情同意原则。【记忆钩子】尊重、保密、共情、通俗四要，泄露隐私一不要。","k":"职业伦理与沟通"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"single","q":"以问题为导向的病历记录中，SOAP 格式里的 A 指的是（　）。","o":["评估，即对健康问题的分析与判断","主观资料，即服务对象自述的症状与感受","客观资料，即体征与检验等可测量数据","计划，即诊疗与随访管理方案"],"a":[0],"e":"SOAP 中 S 为主观资料（主诉）、O 为客观资料（检查检验）、A 为评估或诊断判断、P 为计划（治疗、随访、健康教育）；A 是连接资料与处置的临床判断环节。【记忆钩子】S 说、O 查、A 判、P 办。","k":"SOAP 病历"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"single","q":"关于居民电子健康档案管理与信息安全的说法，正确的是（　）。","o":["应保证信息真实完整、动态更新，并严格控制访问权限、保护个人隐私","健康档案一经建立不得再修改或补充","任何人员都可随意查阅、导出全部档案数据","为实现共享，档案无需脱敏即可向社会公开发布"],"a":[0],"e":"健康档案质量强调真实、完整、连续、动态维护与及时更新；因含大量敏感个人健康信息，须实行授权访问、最小必要使用、脱敏加密与留痕审计，防止泄露与滥用。【易错点】动态更新、权限受控与建完不动、人人可查，是正误分界。","k":"健康档案与信息安全"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"single","q":"劳动组织不合理、劳动强度过大、长期不良工作体位所致的健康损害，其职业性有害因素属于（　）。","o":["劳动过程中的有害因素","生产过程中的化学因素","生产环境中的物理因素","自然环境因素"],"a":[0],"e":"职业性有害因素按来源分三类：生产过程（化学性如粉尘毒物、物理性如噪声高温辐射、生物性）、劳动过程（劳动组织与制度、强度与节奏、不良体位、心理紧张）、生产环境（厂房设计、通风照明、作业环境）。不良体位与劳动组织属劳动过程。【记忆钩子】生产过程看物，劳动过程看怎么干，生产环境看在哪干。","k":"职业有害因素分类"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"single","q":"为发现劳动者是否存在职业禁忌证，应开展的职业健康检查是（　）。","o":["上岗前健康检查","在岗期间定期检查","离岗时健康检查","急性事故后的应急健康检查"],"a":[0],"e":"上岗前检查用于发现职业禁忌证、建立健康基础资料，避免易感者从事所禁忌的作业；在岗期间定期用于早期发现健康损害或疑似职业病；离岗时用于明确离岗时健康状况；应急检查针对急性职业危害事故。【记忆钩子】上岗查禁忌、在岗查损害、离岗查底账、应急查事故。","k":"职业健康检查"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"single","q":"长期吸入含较高游离二氧化硅的生产性粉尘，最典型且危害最重的职业病是（　）。","o":["矽肺，即硅沉着病","职业性噪声聋","一氧化碳中毒","电光性眼炎"],"a":[0],"e":"游离二氧化硅粉尘可致肺组织弥漫性纤维化即矽肺，是常见且危害严重的尘肺，目前缺乏特效根治手段，重在改革工艺、湿式作业、密闭通风与个体防护等综合防尘和一级预防；其余三项分别对应噪声、窒息性气体与紫外线。【记忆钩子】矽尘致矽肺，粉尘里最需防的那个。","k":"生产性粉尘与矽肺"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"single","q":"新装修住宅中，主要来自人造板材与胶黏剂、释放周期较长且被列为室内主要化学污染物的是（　）。","o":["甲醛","一氧化碳","氡","臭氧"],"a":[0],"e":"甲醛主要来自脲醛树脂等人造板、胶黏剂与家具，释放缓慢、周期长，对眼与呼吸道有刺激并被列为致癌物，控制以源头选材与加强通风为主；氡主要来自地基与部分石材属放射性、一氧化碳来自不完全燃烧、臭氧多源于部分净化消毒设备。【记忆钩子】板材胶水出甲醛，地基石材出氡气。","k":"室内空气污染"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"multi","q":"关于职业病三级预防的说法，正确的有（　）。","o":["一级预防从源头消除或控制职业性有害因素，最为根本","改革工艺、密闭除尘、通风排毒属于一级预防","在岗期间职业健康监护、早期发现属于二级预防","对已患职业病者及时诊治、康复并调离属三级预防","佩戴个体防护用品可完全替代工程控制，是唯一需采取的措施"],"a":[0,1,2,3],"e":"一级预防即病因预防，用无毒替代、改革工艺、密闭通风、湿式作业等工程控制最根本；二级预防靠上岗前、在岗、离岗健康监护早发现；三级预防为诊断、治疗、康复、调离与劳动能力鉴定。个体防护用品是最后一道防线，应在工程控制与管理措施之后配合，不能替代源头治理，选项 E 错。【记忆钩子】一级治源头、二级早发现、三级善处理，口罩耳塞是兜底不是万能。","k":"职业病三级预防"},{"s":"jiankang","p":"健康信息与环境卫生","c":13,"cn":"健康档案、职业健康与环境卫生","t":"multi","q":"关于环境与健康关系的说法，正确的有（　）。","o":["长期摄入过量氟可引起氟斑牙、氟骨症等地方性氟中毒","碘缺乏可致甲状腺肿，并影响胎儿脑发育","霍乱、伤寒、痢疾等可经水传播，属介水传染病","甲基汞经食物链富集可引发水俣病等公害病","饮水只要感官清澈透明，即一定无病原微生物、可直接饮用"],"a":[0,1,2,3],"e":"地方性氟中毒、碘缺乏病、介水传染病及甲基汞经生物富集致水俣病，均为环境与健康关系的经典结论；感官性状清澈不能说明无微生物或化学污染物，仍须经消毒与卫生学评价方可饮用，选项 E 错。【记忆钩子】清不等于净，看不见的才最该防。","k":"环境与健康"}],"jianli":[{"s":"jianli","p":"监理概论","c":1,"cn":"监理概论","t":"single","q":"工程监理企业从事建设工程监理活动应当遵循的基本准则不包括（　）。","o":["以利润最大化为唯一准则","公平、独立、诚信、科学","守法","诚实信用"],"a":[0],"e":"工程监理的基本准则：守法、诚信、公平、科学。监理企业以盈利为目的可以理解，但活动准则是法定的四项。","k":"监理基本准则"},{"s":"jianli","p":"监理概论","c":1,"cn":"监理概论","t":"single","q":"建设工程监理的行为主体是（　）。","o":["工程监理企业","建设单位","施工企业","设计单位"],"a":[0],"e":"工程监理是指具有相应资质的工程监理企业受建设单位委托，依据法律法规、标准与合同对工程实施监督管理，行为主体是监理企业。","k":"监理行为主体"},{"s":"jianli","p":"监理概论","c":1,"cn":"监理概论","t":"single","q":"工程监理单位与被监理工程的施工承包单位之间是（　）。","o":["监理与被监理的关系","上下级关系","合作关系","母子公司关系"],"a":[0],"e":"监理单位受建设单位委托对施工单位履行监督职责，与施工单位是监理与被监理关系；双方不得有隶属或利害关系（独立性）。","k":"监理关系"},{"s":"jianli","p":"监理概论","c":1,"cn":"监理概论","t":"single","q":"下列工程中，必须实行监理的是（　）。","o":["国家重点建设工程、大中型公用事业工程等规定的建设工程","所有私人自建住宅","临时设施工程","小型修缮工程"],"a":[0],"e":"必须实行强制监理的范围：国家重点工程、大中型公用事业工程、成片开发住宅小区、利用外国政府或国际组织资金的项目等，由国务院建设主管部门规定具体范围。","k":"强制监理范围"},{"s":"jianli","p":"监理组织","c":2,"cn":"监理组织","t":"single","q":"项目监理机构的组织形式应根据（　）确定。","o":["监理工程项目的特点、规模与技术复杂性等因素","监理人员的个人喜好","施工单位的组织架构","材料供应商的建议"],"a":[0],"e":"项目监理机构组织形式按项目特点、规模、技术复杂程度、环境及监理合同要求确定，常用的有直线制、职能制、直线职能制、矩阵制。","k":"监理组织形式"},{"s":"jianli","p":"监理组织","c":2,"cn":"监理组织","t":"single","q":"总监理工程师代表经总监理工程师授权，可以行使的部分职责不包括（　）。","o":["签发工程开工令、暂停令和复工令的全部决定权","负责总监理工程师指定或交办的监理工作","按总监理工程师的授权行使总监的部分职责与权力","协调处理监理范围内的工作"],"a":[0],"e":"总监理工程师不得将签发开工令、暂停令、复工令，以及工程款支付、竣工结算的签认权，重要的审批权等核心职责全部授予总监代表。","k":"总监理工程师代表"},{"s":"jianli","p":"监理规划与细则","c":3,"cn":"监理规划与细则","t":"single","q":"监理规划应当在（　）编制完成后报送建设单位。","o":["签订委托监理合同及收到设计文件后","工程竣工验收后","施工开始后一个月","监理招标前"],"a":[0],"e":"监理规划由总监理工程师主持编制，在签订监理合同及收到设计文件后开始编制，经监理单位技术负责人审核批准后报送建设单位，指导项目监理机构全面开展工作。","k":"监理规划"},{"s":"jianli","p":"监理规划与细则","c":3,"cn":"监理规划与细则","t":"single","q":"监理实施细则（监理细则）的作用是（　）。","o":["指导专业监理工程师和监理员开展具体的监理作业","指导施工单位施工","替代施工组织设计","作为投标文件"],"a":[0],"e":"监理实施细则由专业监理工程师针对中型及以上或专业性较强的分部分项工程编制，明确监理工作流程、控制要点、方法与措施。","k":"监理实施细则"},{"s":"jianli","p":"监理工作内容","c":4,"cn":"监理工作内容","t":"single","q":"项目监理机构对施工单位报审的施工组织设计进行审查后，应由（　）签认。","o":["总监理工程师","专业监理员","建设单位代表","施工单位项目经理"],"a":[0],"e":"施工组织设计报审表由总监理工程师审核签认后报建设单位；涉及重大调整的需重新报审。","k":"施工组织设计审查"},{"s":"jianli","p":"监理工作内容","c":4,"cn":"监理工作内容","t":"single","q":"施工单位报送的工程开工报审表，总监理工程师审查具备开工条件后，应（　）。","o":["签发工程开工令并报建设单位","自行决定暂缓开工","通知施工单位自行开工","要求建设单位直接下达开工指令"],"a":[0],"e":"开工条件（施工许可、人员机械到位、图纸交底等）审查合格后，由总监理工程师签发工程开工令，报建设单位。","k":"开工令"},{"s":"jianli","p":"监理工作内容","c":4,"cn":"监理工作内容","t":"single","q":"工程存在重大质量隐患或发生质量事故时，总监理工程师应当（　）。","o":["签发工程暂停令，并及时报告建设单位","口头提醒继续施工","私下让施工单位整改不上报","签发竣工结算文件"],"a":[0],"e":"发现重大质量隐患或事故，总监理工程师应及时签发工程暂停令（需要时报告建设单位与有关主管部门），责令整改，消除隐患后复工。","k":"工程暂停令"},{"s":"jianli","p":"监理工作内容","c":4,"cn":"监理工作内容","t":"single","q":"隐蔽工程在隐蔽前，施工单位应当先（　）。","o":["进行自检并通知项目监理机构验收，合格后方可隐蔽","直接隐蔽后补手续","通知建设单位直接隐蔽","隐蔽后电话告知监理"],"a":[0],"e":"隐蔽工程隐蔽前必须自检合格并报监理验收（旁站或平行检验、拍照留证），未经监理验收签认不得隐蔽。","k":"隐蔽工程验收"},{"s":"jianli","p":"监理工作方式","c":5,"cn":"监理工作方式","t":"single","q":"项目监理机构对关键部位、关键工序的施工过程实施连续性的监督检查活动称为（　）。","o":["旁站监理","巡视检查","平行检验","见证取样"],"a":[0],"e":"监理工作方式四种：旁站（关键工序全过程监督）、巡视（日常巡查）、平行检验（独立检验）、见证取样（见证送检）。","k":"监理工作方式"},{"s":"jianli","p":"监理工作方式","c":5,"cn":"监理工作方式","t":"single","q":"见证取样中，见证人员应由（　）担任。","o":["建设单位或监理单位的人员（并经考核备案）","施工单位材料员","材料供应商代表","政府随机指派的路人"],"a":[0],"e":"见证取样：见证人员由建设单位或工程监理单位具备试验知识的专业技术人员担任，对取样、制样、标识、送检全过程见证。","k":"见证取样"},{"s":"jianli","p":"监理工作方式","c":5,"cn":"监理工作方式","t":"single","q":"对施工质量的巡视检查，重点是（　）。","o":["施工现场的施工作业过程和质量保证措施的落实情况","监理人员的考勤","建设单位办公室的卫生","材料供应商的生产线"],"a":[0],"e":"巡视是对施工现场的日常巡查，重点关注施工作业过程、质量保证措施落实、安全隐患等，发现问题及时处理。","k":"巡视"},{"s":"jianli","p":"合同与信息管理","c":6,"cn":"合同与信息管理","t":"single","q":"监理工程师处理工程变更时，工程变更应由（　）提出并按程序审批。","o":["建设单位、设计单位、施工单位等项目参与方按合同约定程序提出","监理员自行发起","材料商提出","当地政府随意下发"],"a":[0],"e":"工程变更可由建设单位、设计单位、施工单位提出，经审查确认后由总监理工程师签发工程变更单，涉及设计修改的由设计单位出具变更文件。","k":"工程变更管理"},{"s":"jianli","p":"合同与信息管理","c":6,"cn":"合同与信息管理","t":"single","q":"施工单位提交的工程款支付申请，经专业监理工程师审查后由（　）签署支付证书。","o":["总监理工程师","监理员","建设单位财务人员","施工企业财务"],"a":[0],"e":"工程款支付：专业监理工程师审查（工程量、质量、单价）→总监理工程师签发支付证书→建设单位按合同支付。工程款支付权是总监核心职权。","k":"工程款支付"},{"s":"jianli","p":"合同与信息管理","c":6,"cn":"合同与信息管理","t":"single","q":"监理日志与监理月报的编写要求是（　）。","o":["监理日志由监理人员逐日如实记录，监理月报由总监组织按月编制报送建设单位","日志可以事后补写虚构","月报只写好消息","都不需要编写"],"a":[0],"e":"监理日志逐日记录现场监理活动，真实客观；监理月报由总监理工程师组织编写，反映当月工程进度、质量、安全、变更与支付情况。","k":"监理日志与月报"},{"s":"jianli","p":"监理法律责任","c":7,"cn":"监理法律责任","t":"single","q":"工程监理单位与被监理工程的承包单位以及建筑材料、构配件和设备供应单位不得（　）。","o":["有隶属关系或者其他利害关系","签订监理合同","派遣旁站人员","召开监理会议"],"a":[0],"e":"《建设工程质量管理条例》：监理单位与被监理工程的施工承包单位以及建筑材料、构配件和设备供应单位不得有隶属关系或者其他利害关系。","k":"监理独立性"},{"s":"jianli","p":"监理法律责任","c":7,"cn":"监理法律责任","t":"single","q":"监理单位将不合格的建设工程、建筑材料按照合格签字，造成损失的，应当（　）。","o":["承担相应的赔偿责任（与施工单位承担连带赔偿责任）","只退监理费不担责","由施工单位独立承担全部责任","免除一切责任"],"a":[0],"e":"监理单位与建设单位或施工企业串通弄虚作假、降低工程质量，或将不合格按合格签字造成损失的，承担连带赔偿责任；构成犯罪的追究刑事责任。","k":"监理连带责任"},{"s":"jianli","p":"监理概论","c":1,"cn":"监理概论","t":"multi","q":"建设工程监理的性质包括（　）。","o":["服务性","科学性","独立性","公平性"],"a":[0,1,2,3],"e":"工程监理性质：服务性（高智能有偿技术服务）、科学性（专业的方法手段）、独立性（独立第三方）、公平性（维护各方合法权益）。","k":"监理性质"},{"s":"jianli","p":"监理组织","c":2,"cn":"监理组织","t":"multi","q":"项目监理机构中专职监理人员的岗位职责包括（　）。","o":["总监理工程师","总监理工程师代表","专业监理工程师","监理员","施工单位的施工员"],"a":[0,1,2,3],"e":"项目监理机构人员：总监理工程师、总监理工程师代表、专业监理工程师、监理员（及资料员等辅助人员）。施工员属于施工单位岗位。","k":"监理人员构成"},{"s":"jianli","p":"监理工作内容","c":4,"cn":"监理工作内容","t":"multi","q":"项目监理机构的质量控制工作包括（　）。","o":["审查施工组织设计与专项施工方案","核查施工单位质量管理体系","旁站、巡视、平行检验","组织竣工验收并签署质量评估报告","代替施工单位编制施工方案"],"a":[0,1,2,3],"e":"监理质量控制：审查施组与专项方案、核查质保体系、旁站巡视平行检验、参与验收签发质量评估报告。监理不代替施工单位编制施工文件。","k":"监理质量控制"},{"s":"jianli","p":"监理工作内容","c":4,"cn":"监理工作内容","t":"multi","q":"项目监理机构的安全生产监理工作包括（　）。","o":["审查施工组织设计中的安全技术措施和专项施工方案","巡视检查危险性较大的分部分项工程施工情况","发现安全隐患要求整改或签发暂停令并报告建设单位","直接负责施工现场的安全生产管理","代替施工企业组织安全培训"],"a":[0,1,2],"e":"安全监理“审查＋巡视＋报告”：审查安措与专项方案、巡视危大工程、发现隐患责令整改或暂停并报告。施工现场安全生产的主体责任在施工单位。","k":"安全监理"},{"s":"jianli","p":"监理法律责任","c":7,"cn":"监理法律责任","t":"multi","q":"监理单位违反法律法规和强制性标准的规定，可能承担的法律责任形式包括（　）。","o":["行政责任（罚款、降低资质等级、吊销资质证书）","民事赔偿责任（连带赔偿）","刑事责任（构成犯罪的）","对监理人员的执业处罚","无限期免费服务"],"a":[0,1,2,3],"e":"监理违法责任：行政（罚款、停业整顿、降级、吊销资质与执业证书）、民事（连带赔偿）、刑事（重大安全事故罪等）。“无限期免费服务”不是法律责任形式。","k":"监理法律责任"}],"jiaozhao":[{"s":"jiaozhao","p":"教育学","c":1,"cn":"教育学","t":"single","q":"“教学相长”“不愤不启，不悱不发”出自我国古代教育文献（　）。","o":["《学记》","《论语》","《大学》","《师说》"],"a":[0],"e":"《学记》是世界上最早的教育专著，提出“教学相长”“不愤不启，不悱不发”（启发诱导）等教学原则。《论语》有“不愤不启”的相近表述，但“教学相长”出自《学记》。","k":"教育学经典"},{
